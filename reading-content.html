real geology that fits the tale."},{"q":"The columns' regular shapes were produced by:","o":["ancient builders","molten lava cooling and cracking","the sea slowly wearing down rock","moving glaciers"],"a":1,"x":"Those uniform pillars formed when molten volcanic lava cooled slowly and cracked, around 50 to 60 million years ago."}],"C2":[{"q":"The passage presents the Finn McCool story primarily as:","o":["proven history","a charming legend that predates the geological explanation","a modern invention for tourists","an accepted scientific theory"],"a":1,"x":"It frames the story as a delightful legend, told long before geology could explain the stones."},{"q":"What is notable about the causeway's 'astonishing regularity'?","o":["It was carefully carved by hand","It arises entirely from natural processes, not human craftsmanship","It changes shape from year to year","It was designed by early engineers"],"a":1,"x":"That striking regularity owes nothing to any mason's chisel. Slow-cooling volcanic lava alone produced it."},{"q":"The matching columns at Fingal's Cave matter because they:","o":["prove the giants were real","tie the myth neatly to genuine geology across the water","are far larger than those in Ireland","were built at the same time as the causeway"],"a":1,"x":"The same columns across the sea link the legend to real geology, binding myth and landscape together."}]},levels:{B1:"On the north Antrim coast of Northern Ireland, near the town of Bushmills, there is an amazing place called the Giant's Causeway. It is made of about 40,000 columns of dark basalt rock. The columns fit together like a honeycomb or a giant paved road. Most of them have six sides, but some have four, five, seven or eight sides. Nature made them around 50 to 60 million years ago, when hot volcanic lava cooled slowly and cracked into these very regular shapes. In 1986, the Causeway became Northern Ireland's first UNESCO World Heritage Site.\n\nThere is also an old and lovely legend about the place. People said that an Irish giant named Finn McCool built the Causeway. He wanted a path of stepping stones across the sea to Scotland, so he could fight a rival Scottish giant called Benandonner.\n\nBut then Finn saw that Benandonner was much bigger than him. Finn's clever wife dressed Finn as a baby and put him in a cradle. When Benandonner came across and saw the huge \"baby,\" he was terrified. He imagined how enormous the father must be, so he ran back to Scotland, ripping up the Causeway so no one could follow him. Across the sea, on the Scottish island of Staffa, a sea cave called Fingal's Cave has the same basalt columns, and this real rock fits the story perfectly.",B2:"On the north Antrim coast of Northern Ireland, not far from the town of Bushmills, lies one of the most extraordinary sights in the whole country: the Giant's Causeway. It is made up of roughly 40,000 interlocking columns of dark basalt rock, which fit together so neatly that they look like a honeycomb or a giant paved road stretching into the sea. Most of the columns are hexagonal, with six sides, although some have four, five, seven or eight. Astonishingly, no human hand shaped them. They formed around 50 to 60 million years ago, when molten volcanic lava cooled slowly and cracked into these remarkably regular pillars. In 1986, this natural wonder became Northern Ireland's very first UNESCO World Heritage Site.\n\nYet long before anyone talked about geology, people told a delightful story to explain the strange stones. According to the old legend, an Irish giant named Finn McCool, sometimes spelled Fionn mac Cumhaill, built the Causeway himself. He laid it down as a path of stepping stones across the sea to Scotland, because he wanted to fight a rival Scottish giant called Benandonner.\n\nWhen Finn finally got close, however, he realised that Benandonner was far bigger than he was. Thinking quickly, Finn's clever wife disguised her husband as a baby and tucked him snugly into a cradle. When Benandonner crossed over and saw the enormous \"baby,\" he was terrified, imagining just how gigantic the father must be. He fled back to Scotland at once, tearing up the Causeway behind him so that nobody could follow. The tale fits the landscape beautifully, because across the sea, on the Scottish island of Staffa, a sea cave called Fingal's Cave contains matching basalt columns, real geology that links the two shores together.",C1:"On the wild north Antrim coast of Northern Ireland, a short distance from the town of Bushmills, the land dips towards the sea and reveals one of the most captivating sights in the British Isles: the Giant's Causeway. What greets visitors is a sprawling pavement of roughly 40,000 interlocking columns of dark basalt, packed together so precisely that they resemble a honeycomb, or a colossal paved road marching straight into the waves. The great majority of the columns are hexagonal, six-sided and geometrically crisp, yet a curious few break the pattern with four, five, seven or eight sides. Most remarkable of all is that this astonishing regularity owes nothing to human craftsmanship. It emerged some 50 to 60 million years ago, when molten volcanic lava cooled slowly and fractured into these strikingly uniform pillars. In recognition of its wonder, the site became Northern Ireland's first UNESCO World Heritage Site in 1986.\n\nLong before geologists could account for the phenomenon, however, storytellers offered an explanation of their own, and a far more charming one at that. According to the cherished legend, an Irish giant named Finn McCool, whose name is also spelled Fionn mac Cumhaill, constructed the Causeway with his own hands. He laid it out as a path of stepping stones across the sea to Scotland, so that he might cross over and confront a rival Scottish giant called Benandonner.\n\nThe plan, though, took an unexpected turn. As Finn drew near, he discovered to his dismay that Benandonner was vastly larger than he had imagined. It was Finn's quick-witted wife who ultimately saved the day, ingeniously disguising her towering husband as a baby and tucking him snugly into a cradle before their fearsome visitor could arrive. When Benandonner finally crossed the Causeway and set eyes on this monstrous \"infant,\" he was seized with terror, for if the child was so enormous, the father who had sired him must surely be beyond all reckoning. Panic-stricken, he turned and fled back to Scotland, ripping up the Causeway as he went so that he could never be followed or pursued across the water. The story dovetails delightfully with reality, because far across the sea, on the Scottish island of Staffa, a sea cave known as Fingal's Cave displays the very same interlocking basalt columns, a genuine geological echo that ties the ancient legend neatly to the land.",C2:"On the rugged north Antrim coast of Northern Ireland, only a short distance from the town of Bushmills, the countryside slopes down to meet the Atlantic and unveils one of the most beguiling spectacles in all the British Isles: the Giant's Causeway. Spread across the shoreline lies a vast, undulating pavement of some 40,000 interlocking columns of dark basalt, fitted together with such uncanny precision that they call to mind a honeycomb, or perhaps a titanic paved road striding boldly out into the surf. While the overwhelming majority of these columns are hexagonal, their six sides drawn with almost architectural exactness, a scattering of eccentrics defies the norm entirely, boasting instead four, five, seven or eight sides apiece. What confounds the eye most of all is that this extraordinary regularity is entirely the work of nature, not of any mason's chisel. It came into being roughly 50 to 60 million years ago, when molten volcanic lava, cooling with tremendous slowness, contracted and cracked into these bewilderingly uniform pillars. Fittingly, in 1986 the Causeway was inscribed as Northern Ireland's very first UNESCO World Heritage Site.\n\nYet centuries before any geologist could unravel the science behind the stones, the imaginations of ordinary people had already furnished an explanation of their own, and one immeasurably more delightful. As the beloved legend has it, an Irish giant by the name of Finn McCool, rendered in older spelling as Fionn mac Cumhaill, raised the entire Causeway single-handedly. He laid it down as a path of stepping stones stretching across the sea to Scotland, all so that he might march over and do battle with a rival Scottish giant named Benandonner.\n\nThe scheme, however, unravelled the moment Finn drew near enough to see his opponent clearly, for Benandonner proved to be vastly, alarmingly larger than Finn had ever anticipated. Salvation, as it turned out, came not through brute strength or open combat but through the quick wit of Finn's endlessly resourceful wife, who cunningly disguised her colossal husband as a baby and tucked him snugly into an oversized cradle just in time. When Benandonner at last strode across the Causeway and beheld this preposterously gigantic \"infant,\" a cold dread gripped him, for if the child alone was of such staggering proportions, the father must surely be a monster beyond imagining. Overcome with panic, he turned tail and bolted back towards Scotland, tearing up the Causeway behind him as he ran so that no pursuer could ever follow in his wake. Charmingly, the tale slots into geographical reality with something close to perfection, for far across the water, on the Scottish island of Staffa, a sea cave known as Fingal's Cave flaunts the self-same interlocking basalt columns, a genuine and unmistakable geological counterpart that binds the ancient myth and the living landscape together in one seamless, deeply satisfying whole."}},
{id:"irish-coffee-foynes",title:"How Irish Coffee Was Invented at Foynes",tag:"Ireland · Culture",img:"images/reading/irish-coffee-foynes.jpg",quiz:{"B1":[{"q":"In which town was Irish coffee invented?","o":["Foynes","Shannon","San Francisco","Limerick city"],"a":0,"x":"Irish coffee was born in Foynes, County Limerick. Shannon only comes up as the modern airport that arrived later, so don't pick it."},{"q":"What was the name of the chef who invented the drink?","o":["Joe Sheridan","Stanton Delaplane","Robert Prevost","Buena Vista"],"a":0,"x":"The chef who wanted to warm the freezing passengers is Joe Sheridan. Don't be fooled by Stanton Delaplane, the travel writer who spread the drink years later."},{"q":"What did Sheridan float on top of the hot coffee?","o":["A layer of cream","A slice of lemon","Melted chocolate","Whipped butter"],"a":0,"x":"He floated a layer of cream on top, so you sip the hot coffee up through the cool cream."}],"B2":[{"q":"Why did the flight turn back to Foynes?","o":["Because of a cold, stormy night","Because it ran out of fuel","Because of a mechanical fault","Because the crew fell ill"],"a":0,"x":"A cold, stormy evening forced the flight to turn back. Fuel and mechanical faults never come into it."},{"q":"What did the curious American passenger ask Sheridan?","o":["Whether it was Brazilian coffee","Whether it contained whiskey","Whether it was made with cream","Whether he could have another"],"a":0,"x":"The American asked whether it was Brazilian coffee, and Sheridan replied, 'No, it's Irish coffee', which is how the drink got its name."},{"q":"Who helped introduce the drink to the Buena Vista Cafe in 1952?","o":["A travel writer named Stanton Delaplane","The chef Joe Sheridan himself","A pilot from the flying boats","The mayor of San Francisco"],"a":0,"x":"In 1952 the travel writer Stanton Delaplane helped bring it to the Buena Vista Cafe in San Francisco."}],"C1":[{"q":"What were the 'flying boats' that stopped at Foynes?","o":["Seaplanes that landed on the water","Fast ferries crossing the Atlantic","Small propeller planes using runways","Ordinary passenger ships"],"a":0,"x":"Flying boats were seaplanes that touched down on the water rather than a runway, back before land airports."},{"q":"Why does the text say Foynes stood at 'the very crossroads' between the old world and the new?","o":["Because it served travellers before modern land airports came to dominate air travel","Because it was the largest city in Ireland","Because it lay exactly halfway across the Atlantic","Because it was the birthplace of whiskey"],"a":0,"x":"Foynes was a key transatlantic stop before land airports like Shannon took over, which is why it sat 'at the very crossroads'. It was neither Ireland's largest city nor literally mid-Atlantic."},{"q":"How does the text describe the way the drink is meant to be enjoyed?","o":["Sipping the hot coffee through the cool cream on top","Stirring the cream fully into the coffee","Drinking the cream first, then the coffee","Serving it chilled over ice"],"a":0,"x":"The cream is floated on top and left there. You sip the hot coffee up through the cool cream, rather than stirring it in."}],"C2":[{"q":"What does the phrase 'born of little more than kindness and a cold night' suggest about the invention?","o":["That it arose almost by chance from an act of kindness","That it was the result of careful planning","That it was created to make a profit","That it was invented on a warm summer evening"],"a":0,"x":"It frames the drink as an accident of kindness on a cold night, not something planned or created for profit."},{"q":"By calling Foynes 'anything but the sleepy backwater one might imagine,' the writer implies that the town was in fact:","o":["A busy and thriving terminal","A forgotten and abandoned village","A purely military outpost","A quiet farming community"],"a":0,"x":"Watch the double negative in 'anything but the sleepy backwater one might imagine': the writer means Foynes was in fact busy and thriving."},{"q":"What is the main purpose of the festival and museum mentioned at the end?","o":["To keep the memory of that stormy night and the invention alive","To sell whiskey to tourists","To replace the old flying-boat service","To compete with San Francisco's cafes"],"a":0,"x":"The closing lines say Foynes keeps the festival and museum so the memory of that stormy night 'lives warmly on'. Preservation, not profit or rivalry."}]},levels:{B1:"In the early 1940s, on the west coast of Ireland, a wonderful drink was born. It happened in Foynes, a small town in County Limerick. Back then, Foynes was a busy place. Big \"flying boats,\" which were large planes that landed on water, stopped there on their way across the Atlantic. This was before modern airports like nearby Shannon.\n\nOne cold, stormy night, a flight to America had to turn back to Foynes. The passengers came off the plane wet, tired and freezing. A chef at the terminal named Joe Sheridan wanted to help them feel warm again. He had a clever idea. He poured a measure of Irish whiskey into hot coffee, added some sugar, and then floated a layer of cream on top. You drink the hot coffee through the cool cream.\n\nThe passengers loved it. One American asked if it was Brazilian coffee. Sheridan smiled and said, \"No, it's Irish coffee.\" The name stayed, and the drink became famous. Later, it travelled to the United States. In 1952, a travel writer called Stanton Delaplane helped bring it to the Buena Vista Cafe in San Francisco, and soon everyone knew about it. Today, Foynes is proud of its invention. The town has an annual Irish Coffee Festival and a flying-boat museum for everyone to enjoy.",B2:"In the early 1940s, in a small town on the west coast of Ireland, one of the world's most beloved drinks came quietly into being. The town was Foynes, in County Limerick, and at the time it was anything but sleepy. It served as a busy terminal for the great transatlantic \"flying boats,\" enormous seaplanes that landed gracefully on the water. This was the age before modern land airports, such as the one that would later open at nearby Shannon, and Foynes sat right at the heart of the journey between Europe and America.\n\nThen came the night that changed everything. During a cold, stormy evening, a flight bound for America was forced to turn back to Foynes. The weary passengers came ashore soaked, exhausted and frozen to the bone. A chef working at the terminal, a man named Joe Sheridan, decided that something had to be done to warm them. With a little imagination, he added a measure of Irish whiskey to hot coffee, sweetened the mixture, and floated a smooth layer of cream on top, so that each sip of hot coffee was drawn up through the cool cream.\n\nThe passengers were delighted. When one curious American asked whether it was Brazilian coffee, Sheridan reportedly replied, \"No, it's Irish coffee,\" and the name stuck for good. In time, the drink crossed the ocean itself. In 1952, a travel writer named Stanton Delaplane helped introduce it to the Buena Vista Cafe in San Francisco, which popularised it far and wide. Today, Foynes proudly celebrates its creation, hosting an annual Irish Coffee Festival and keeping a charming flying-boat museum in the town.",C1:"In the early 1940s, on the rugged western coast of Ireland, a drink now cherished across the world was invented almost by accident. The place was Foynes, a modest town in County Limerick that, at the time, was far from quiet. It served as a bustling terminal for the transatlantic \"flying boats,\" those magnificent seaplanes that touched down upon the water rather than the runway. This was long before modern land airports, including the one that would later rise at nearby Shannon, had come to dominate air travel, and so Foynes found itself at the very crossroads of the passage between the old world and the new.\n\nOne particular night would earn the little town its lasting fame. As a cold storm lashed the coast, a flight bound for America was compelled to turn back and return to Foynes. The passengers stepped ashore wet, exhausted and chilled to the bone, longing for nothing more than a little warmth. It was then that a chef at the terminal, a resourceful man named Joe Sheridan, resolved to lift their spirits. Drawing on a flash of inspiration, he poured a measure of Irish whiskey into hot coffee, sweetened the blend, and floated a delicate layer of cream upon the surface, so that the drinker might sip the steaming coffee through the cool, velvety cream above.\n\nThe response was immediate and warm. When one intrigued American passenger enquired whether he was drinking Brazilian coffee, Sheridan is said to have answered simply, \"No, it's Irish coffee,\" and with that gentle wit the name was born and never let go. The drink's fame would eventually carry it across the very ocean those flying boats once crossed. In 1952, a travel writer by the name of Stanton Delaplane helped bring it to the Buena Vista Cafe in San Francisco, an establishment that popularised it on a grand scale. Today, Foynes honours its happy invention with genuine pride, welcoming visitors to an annual Irish Coffee Festival and preserving a delightful flying-boat museum at the heart of the town.",C2:"In the early 1940s, along the wild and weather-beaten western coast of Ireland, a drink destined to be savoured the world over came into existence almost by chance, born of little more than kindness and a cold night. Its birthplace was Foynes, an unassuming town in County Limerick which, in those years, was anything but the sleepy backwater one might imagine. Rather, it thrived as a bustling terminal for the great transatlantic \"flying boats,\" those extraordinary seaplanes that descended not onto tarmac but onto open water, settling upon the estuary like enormous birds. All of this unfolded well before the modern land airports, among them the one that would in time rise at nearby Shannon, came to govern the skies, and so Foynes stood, however briefly, at the very threshold between the old world and the new.\n\nIt was a single stormy night, however, that would secure the town its enduring place in the story of the drink. As bitter wind and rain battered the coast, a flight bound for America found itself compelled to abandon the crossing and turn back towards Foynes. The passengers came ashore drenched, weary and frozen to the marrow, yearning for nothing grander than a moment of warmth and comfort. Into this scene stepped a chef at the terminal, an inventive and warm-hearted man by the name of Joe Sheridan, who resolved that these shivering travellers should not be left to suffer. Seized by a stroke of quiet genius, he laced hot coffee with a generous measure of Irish whiskey, sweetened the whole, and floated upon its surface a soft, cool ribbon of cream, so contrived that each mouthful of steaming coffee had first to be drawn gently through the chilled cream resting above.\n\nThe passengers were charmed at once. When one inquisitive American, savouring the novelty, asked whether he was enjoying Brazilian coffee, Sheridan is fondly reported to have replied, \"No, it's Irish coffee,\" and by that single, understated turn of phrase the drink was christened forever. In due course its renown would journey across the very ocean those flying boats had once traversed. In 1952, a travel writer named Stanton Delaplane lent a hand in carrying it to the Buena Vista Cafe in San Francisco, an establishment whose enthusiasm popularised the drink on a scale Sheridan could scarcely have foreseen. Today, Foynes cherishes its serendipitous invention with heartfelt pride, drawing visitors to an annual Irish Coffee Festival and lovingly tending a flying-boat museum at the very heart of the town, so that the memory of that stormy night lives warmly on."}},
{id:"uk-postbox-toppers",title:"Britain's Secret Postbox Toppers",tag:"United Kingdom · Society",img:"images/reading/uk-postbox-toppers.jpg",quiz:{"B1":[{"q":"How are postbox toppers made?","o":["By knitting or crochet","By carving wood","By printing plastic","By welding iron"],"a":0,"x":"They're small knitted or crocheted decorations, set on the rounded tops of postboxes."},{"q":"What are the crafters who make toppers sometimes called?","o":["Yarn bombers","Pillar makers","Royal posters","Street painters"],"a":0,"x":"The local crafters who make and place them are sometimes called 'yarn bombers'."},{"q":"What is Royal Mail's one condition about the toppers?","o":["They must not cover the slot where letters are posted","They must be removed within a week","They must be approved in advance","They must display the maker's name"],"a":0,"x":"Royal Mail stays relaxed about toppers, as long as none covers the slot where letters go in."}],"B2":[{"q":"When did the trend grow especially quickly?","o":["Around 2020 and 2021, during the Covid pandemic","In the early 1990s","Just after World War Two","In the year 2000"],"a":0,"x":"It took off around 2020 and 2021, a cheerful surprise to lift spirits during the Covid pandemic."},{"q":"How are the toppers almost always made and placed?","o":["Anonymously, with no credit sought","By paid professional artists","By Royal Mail staff","With a signature attached"],"a":0,"x":"Almost always anonymously, the makers wanting nothing and no thanks in return."},{"q":"What are the traditional 'pillar boxes' described as being made of?","o":["Bright red iron","Painted wood","Moulded plastic","Grey stone"],"a":0,"x":"The traditional pillar boxes are described as tall, round, bright red iron."}],"C1":[{"q":"According to the text, what is part of the pleasure for someone who walks the same route each day?","o":["Never quite knowing what topper will appear next","Being thanked by the crafters","Choosing the next design themselves","Collecting the toppers to keep"],"a":0,"x":"For regular walkers, part of the joy is never quite knowing what new topper will turn up next."},{"q":"How is Royal Mail's attitude toward the toppers described?","o":["A relaxed and good-humoured tolerance","Strict official disapproval","Complete indifference","Active encouragement with prizes"],"a":0,"x":"Royal Mail is described as viewing them with a relaxed, good-humoured tolerance."},{"q":"What do the crafters expect in return for their work?","o":["Nothing whatsoever","Public recognition","A small payment","Permission from Royal Mail"],"a":0,"x":"Nothing whatsoever. They ask for no credit for their hours of patient handiwork."}],"C2":[{"q":"In the passage, the postbox is said to be as much a part of the street as what?","o":["The lamp-post beside it","The nearest shop","The passing traffic","The garden wall"],"a":0,"x":"As much a part of the street as the lamp-post beside it, the passage says."},{"q":"How does the writer characterise the makers of the toppers?","o":["They slip away and let the object speak for itself","They wait nearby to be praised","They sell their creations to passers-by","They compete openly for attention"],"a":0,"x":"They seek no praise. They slip away and let the topper speak for itself."},{"q":"What does the writer conclude the whole phenomenon amounts to?","o":["A freely given public gift that asks for nothing in return","A clever form of advertising","A minor nuisance for the postal service","A profitable local craft business"],"a":0,"x":"The writer calls it a freely given public gift that asks for absolutely nothing back."}]},levels:{B1:"All across the United Kingdom, you can see tall, round, bright red postboxes on street corners. They are made of iron, and people call them \"pillar boxes.\" Royal Mail runs them, and they are a very familiar sight. In recent years, something new has appeared on top of them. People have started to put small knitted or crocheted decorations on the rounded tops of these postboxes. They are called \"postbox toppers.\"\n\nMost of the time, local crafters make and place the toppers in secret. Some people call these crafters \"yarn bombers.\" They almost always stay anonymous, and they want nothing in return. The toppers often follow the seasons or a theme. There are Christmas scenes with tiny snowmen, poppies for Remembrance Day, spring flowers and lambs, celebrations for royal events, or a nod to the local town or football team.\n\nThe trend grew quickly around 2020 and 2021, during the Covid pandemic. It was a small, cheerful surprise to lift a neighbourhood's spirits when times were hard. Royal Mail has been relaxed and good-humoured about the toppers, as long as they do not cover the slot where you post letters. In this way, a topper is a kind of free public gift. A person walks past, sees it, and smiles. No one has to pay, and no one ever needs to know who made it.",B2:"All across the United Kingdom, the traditional postboxes are hard to miss: tall, round, bright red iron \"pillar boxes,\" run by Royal Mail, standing on street corners as a familiar part of everyday life. In recent years, though, many of them have gained a charming new feature. People have begun placing small knitted or crocheted decorations on their domed tops, and these cheerful little creations have become known as \"postbox toppers.\"\n\nWhat makes them so special is that they are almost always made and placed anonymously. The local crafters who create them, sometimes called \"yarn bombers,\" put them out quietly and expect absolutely nothing in return. Nobody signs their work, and nobody asks to be thanked. The toppers are frequently seasonal or themed, so you might come across a Christmas scene complete with tiny snowmen, a display of poppies for Remembrance Day, spring flowers and lambs, a celebration for a royal event, or a friendly nod to the local town or football team. Each one is a small burst of colour and imagination that seems to appear almost by magic.\n\nThe trend grew remarkably quickly around 2020 and 2021, during the Covid pandemic, when a tiny, unexpected surprise could lift a whole neighbourhood's spirits at a very difficult time. Royal Mail has generally taken a relaxed, good-humoured view of them, provided that a topper never covers the slot where letters are posted. In the end, a postbox topper works like a free public gift, given freely and asking for nothing. A passer-by glances up, smiles to themselves, and carries on with their day, never asked to pay a single penny or even to learn the name of the kind stranger who quietly made it and left it there for everyone to enjoy.",C1:"All across the United Kingdom, the traditional postboxes are impossible to overlook: tall, round, bright red iron \"pillar boxes,\" run by Royal Mail and standing on street corners as one of the most familiar and best-loved features of the national landscape. In recent years, however, a quietly delightful trend has transformed many of them. People have taken to placing small knitted or crocheted decorations on their domed tops, and these whimsical little creations have come to be known, rather fondly and quite affectionately, as \"postbox toppers.\"\n\nPerhaps the most touching thing about them is that they are nearly always made and installed in complete anonymity. The local crafters responsible, sometimes affectionately dubbed \"yarn bombers,\" tend to work under cover of secrecy, asking for no credit and expecting nothing whatsoever in return for hours of patient handiwork. The toppers are commonly seasonal or built around a particular theme, which means that a single street corner might, over the course of a year, host a Christmas scene dotted with tiny snowmen, a solemn arrangement of poppies for Remembrance Day, a cluster of spring flowers and lambs, a joyful tribute to a royal celebration, or a proud nod to the local town or its beloved football team, each stitched with obvious care. Part of the pleasure, for anyone who walks the same route each day, lies in never quite knowing what will appear next, or when the last display will quietly give way to a fresh one.\n\nThe phenomenon spread with striking speed around 2020 and 2021, during the Covid pandemic, at a time when even the smallest cheerful surprise could lift the spirits of an entire neighbourhood weighed down by hardship and uncertainty. Royal Mail, for its part, has generally regarded the toppers with a relaxed and good-humoured tolerance, on the sensible condition that none of them ever obscures the slot through which letters are posted. What emerges from all of this is something rather lovely: a form of free public gift that asks for nothing at all, from anybody. A passer-by looks up, feels a sudden flicker of unexpected joy, and walks on a little lighter than before, never once asked to pay a penny, and never even needing to know the name of the anonymous soul who quietly climbed up, tied on a scrap of colourful wool, and left such kindness behind.",C2:"All across the United Kingdom, the traditional postboxes remain impossible to overlook: tall, round, bright red iron \"pillar boxes,\" operated by Royal Mail and planted on street corners as one of the most instantly recognisable and enduring fixtures of the national scene, as much a part of the street as the lamp-post beside them. In recent years, however, a quietly enchanting trend has begun to soften their sturdy Victorian formality. Passers-by have taken to crowning their domed tops with small knitted or crocheted decorations, and these whimsical little creations have come to be known, with characteristic and quite typical British affection, as \"postbox toppers.\"\n\nWhat lends the whole phenomenon its peculiar charm is the near-total anonymity in which it unfolds. The local crafters responsible, sometimes teasingly labelled \"yarn bombers,\" almost invariably work in secret, seeking no recognition, courting no thanks, and expecting nothing whatsoever in return for their painstaking handiwork. Nobody stitches a signature into the wool, and nobody lingers nearby waiting to be praised; the makers slip away and let the object speak for itself. The toppers themselves tend to be seasonal or thematic, so that a single humble postbox might, across the turning year, play host to a miniature Christmas scene populated by tiny snowmen, a dignified array of poppies for Remembrance Day, a fresh scattering of spring flowers and lambs, an exuberant celebration of some royal occasion, or a heartfelt nod to the local town or its cherished football team. Half the delight, for those who pass by regularly, lies precisely in wondering what will be waiting to greet them next, and in watching one loving creation give way, in its own good time, to another.\n\nThe trend proliferated with remarkable rapidity around 2020 and 2021, during the Covid pandemic, precisely when the smallest and most unexpected flourish of colour could lift the flagging spirits of an entire neighbourhood struggling through hard and uncertain times. Royal Mail, to its considerable credit, has tended to look upon the toppers with an indulgent, good-humoured tolerance, insisting only, and quite reasonably, that no decoration should ever come to cover the slot into which letters are posted, so that the everyday business of the post can carry on beneath the wool undisturbed.\n\nWhat all of this amounts to, in the end, is something genuinely rare: a freely given public gift that asks for absolutely nothing in return. A weary passer-by glances upward, feels an unbidden flicker of delight, and continues on their way a fraction more cheerful than a moment before, never once invited to pay a penny, and never even needing to discover the name of the quiet, generous stranger whose small, secret act of kindness brightened that ordinary street corner, without fuss or fanfare, for absolutely everyone who happened to walk by that day and glance, however briefly, in its direction."}},
{id:"red-kite-return",title:"The Return of the Red Kite",tag:"United Kingdom · Nature",img:"images/reading/red-kite-return.jpg",quiz:{"B1":[{"q":"What shape is the red kite's tail?","o":["Like a fork","Round","Square","Pointed like an arrow"],"a":0,"x":"You'll know the red kite by its long, forked tail."},{"q":"Where did a very small number of red kites survive?","o":["The quiet valleys of mid-Wales","The city of London","The coast of Spain","The Scottish islands"],"a":0,"x":"Only a handful survived, tucked away in the quiet, remote valleys of mid-Wales."},{"q":"What do red kites mostly eat?","o":["Dead animals and scraps","Fresh fish they catch","Fruit and seeds","Insects only"],"a":0,"x":"They mostly eat dead animals and scraps, so they quietly help clean the countryside."}],"B2":[{"q":"When did the reintroduction programme begin?","o":["Around 1989 and 1990","In the early 1970s","Just after 2000","In the 1950s"],"a":0,"x":"The reintroduction programme began around 1989 and 1990, led by groups including the RSPB."},{"q":"From which countries were young birds brought over?","o":["Spain and Sweden","France and Italy","Germany and Norway","Portugal and Poland"],"a":0,"x":"Young birds were carefully brought over from countries such as Spain and Sweden."},{"q":"Which was the most famous of the release sites?","o":["The Chilterns","The valleys of mid-Wales","The city of London","The coast of Scotland's islands"],"a":0,"x":"The most celebrated release site was the Chilterns, hills near the M40 motorway north-west of London."}],"C1":[{"q":"Why does the text say red kites help clean up the countryside?","o":["Because as scavengers they feed largely on carrion and scraps rather than hunting live prey","Because they eat harmful insects that damage crops","Because they carry away rubbish to their nests","Because they hunt and remove live pests"],"a":0,"x":"As scavengers they eat carrion and scraps rather than hunt live prey, so they quietly tidy the countryside."},{"q":"What state was the red kite in by the 20th century?","o":["Driven to the very brink of extinction","More common than ever before","Confined to Scotland alone","Already completely extinct in Britain"],"a":0,"x":"By the 20th century, centuries of persecution had driven the red kite to the very brink of extinction."},{"q":"How are the Chilterns described in the passage?","o":["A range of gentle hills near the M40 motorway, north-west of London","A remote group of Scottish islands","A stretch of coastline in mid-Wales","A dense forest in southern England"],"a":0,"x":"The Chilterns are described as a range of gentle hills near the M40 motorway, north-west of London."}],"C2":[{"q":"What does the phrase 'a thread so fine it might easily have snapped' refer to?","o":["The tiny surviving population that carried the species' future","The narrow forked tail of the kite","The single motorway near the release site","The thin funding for the programme"],"a":0,"x":"That fragile thread is the handful of Welsh survivors who carried the whole British future of the species."},{"q":"How does the writer regard the red kite's return overall?","o":["As one of the greatest wildlife conservation success stories the UK has known","As a modest change of little lasting importance","As a threat to other native birds","As an accident that conservationists did not intend"],"a":0,"x":"The writer calls it one of the greatest wildlife conservation success stories the UK has ever seen."},{"q":"What contrast is drawn in the image of kites 'wheeling unhurriedly over... the very motorways along which we hurry past below'?","o":["The birds' calm, unhurried flight against the rushed movement of people below","The danger of motorways against the safety of the hills","The kites' hunting speed against their slow breeding","The noise of traffic against the silence of the countryside"],"a":0,"x":"The image sets the kites' calm, unhurried soaring against the people hurrying along the motorways beneath them."}]},levels:{B1:"High in the British sky, a large bird turns slowly in wide circles. It has reddish-brown feathers and a long tail shaped like a fork. This is the red kite, a bird of prey that flies with beautiful, easy movements. It twists and glides in the wind with real elegance.\n\nLong ago, red kites lived all over Britain. But for hundreds of years people hunted them and drove them away. By the 20th century, almost all of them were gone. Only a very small number survived, hidden in the quiet, remote valleys of mid-Wales.\n\nThen, around 1989 and 1990, people decided to help. Conservation groups, including the RSPB and the government's nature body, started a special project. They carefully brought young birds from countries such as Spain and Sweden. They set them free in new places, especially in the Chilterns, a range of hills near the M40 motorway, north-west of London, and in parts of Scotland.\n\nThe project worked wonderfully. The kites bred, they spread out, and today there are thousands of them. In some areas they are a normal, everyday sight above towns, fields and roads. Red kites mostly eat dead animals and scraps, so they help to clean the countryside. Their return is one of Britain's greatest wildlife success stories.",B2:"High above the British countryside, a large bird wheels and twists against the sky. With its reddish-brown feathers and its unmistakable forked tail, it soars and turns with a grace that is a joy to watch. This is the red kite, a bird of prey that seems to dance in the wind, and its story is one of loss and remarkable recovery.\n\nOnce, the red kite was a common sight across the whole of Britain. Yet for centuries it was persecuted, hunted and driven from the land, until by the 20th century it had almost completely vanished. Only a tiny population managed to cling on, surviving in the remote, peaceful valleys of mid-Wales, far from most people.\n\nAround 1989 and 1990, however, everything began to change. A reintroduction programme was launched, led by conservation groups including the RSPB and the government's nature body. Young birds were carefully brought over from countries such as Spain and Sweden, and then released at carefully chosen sites. The most famous of these were in the Chilterns, an area of hills near the M40 motorway to the north-west of London, and in parts of Scotland.\n\nThe results were spectacular. The kites bred, spread out across the land, and today they number in the thousands. In some areas they are once again an everyday sight, wheeling over towns, fields and busy motorways. Because they feed mainly on carrion and scraps rather than hunting live prey, they quietly help to clean up the countryside. Few doubt that this is one of the greatest wildlife conservation success stories in the whole of the UK.",C1:"High above the British landscape, a large bird of prey circles with extraordinary ease, tilting its long, forked tail as it soars and twists through the currents of air. Its feathers glow a warm reddish-brown, and every movement seems effortless, almost playful. This is the red kite, and the sight of it wheeling overhead is now so ordinary in some regions that it is easy to forget how close the bird once came to disappearing from Britain altogether.\n\nFor centuries, the red kite had been a familiar presence across the country, but it was relentlessly persecuted, and by the 20th century it had been driven to the very brink of extinction. All that remained was a tiny, fragile population, clinging on in the remote and thinly populated valleys of mid-Wales. There, hidden away from the pressures that had wiped the species out elsewhere, a handful of birds quietly held the future of the red kite in Britain.\n\nEverything began to change around 1989 and 1990, when a bold reintroduction programme was launched by conservation groups, among them the RSPB and the government's own nature body. Young birds were carefully brought over from countries such as Spain and Sweden, and then released at a number of chosen sites. Chief among these were the Chilterns, a range of gentle hills near the M40 motorway to the north-west of London, along with several locations in Scotland, where the newcomers could settle and, in time, raise families of their own.\n\nThe outcome exceeded almost everyone's hopes. The kites bred successfully, spread steadily outwards, and today they number in the thousands, so that in many places they are once again an everyday sight, wheeling lazily over towns, fields and busy motorways. Being mainly scavengers, they feed largely on carrion and scraps rather than hunting live prey, and so they help, quietly and usefully, to clean up the countryside. Little wonder, then, that the return of the red kite is now widely regarded as one of the greatest wildlife conservation success stories the UK has ever seen.",C2:"High above the British landscape, a large bird of prey wheels and twists with an elegance that borders on the theatrical, its reddish-brown plumage catching the light and its unmistakable forked tail steering each graceful turn. To watch a red kite soar is to watch a creature entirely at home in the air, riding the wind with a lazy, almost casual mastery. Yet what makes the sight so quietly moving is the knowledge of how nearly it was lost, for this everyday spectacle was, within living memory, on the very edge of vanishing from Britain for good.\n\nOnce common across the whole country, the red kite was persecuted for centuries, hunted and harried until, by the 20th century, it had been all but exterminated. What survived was a single, precarious remnant, a tiny population clinging on in the remote and sparsely peopled valleys of mid-Wales. There, sheltered by isolation from the forces that had erased the species everywhere else, a mere handful of birds carried the entire British future of the red kite on their wings, a thread so fine it might easily have snapped altogether.\n\nThat the thread held, and then strengthened, is owed to a bold act of imagination that began around 1989 and 1990, when conservation groups, among them the RSPB and the government's own nature body, launched an ambitious reintroduction programme. Young birds were carefully brought over from countries such as Spain and Sweden and released at a series of chosen sites, the most celebrated being the Chilterns, a run of gentle hills near the M40 motorway to the north-west of London, alongside several locations in Scotland. There the newcomers were given the space to settle, to find their footing, and eventually to raise young of their own.\n\nWhat followed surpassed even the most optimistic expectations. The kites bred, spread outwards across the land, and now number in the thousands, so that in many districts they have become an ordinary sight once more, wheeling unhurriedly over towns, fields and the very motorways along which we hurry past below. As scavengers, feeding largely on carrion and scraps rather than pursuing live prey, they perform a modest but genuine service, helping to keep the countryside clean. It is little wonder that their return, a bird brought back from the brink to soar once again over the skies that were always meant to be theirs, is now widely regarded as one of the greatest wildlife conservation success stories the United Kingdom has ever known."}},
{id:"dolly-the-sheep",title:"Dolly the Sheep: The World's First Clone",tag:"Scotland · Science",img:"images/reading/dolly-the-sheep.jpg",quiz:{"B1":[{"q":"Where was Dolly born?","o":["England","Scotland","Ireland","Wales"],"a":1,"x":"Dolly was born at the Roslin Institute, just outside Edinburgh, so the answer is Scotland."},{"q":"What kind of animal was Dolly?","o":["A cow","A goat","A sheep","A horse"],"a":2,"x":"A sheep. A lamb that looked ordinary but was the first clone from an adult cell."},{"q":"Who was Dolly named after?","o":["A scientist","A singer","A queen","A town"],"a":1,"x":"She was named after the singer Dolly Parton, a fun nod to the udder cell used to make her."}],"B2":[{"q":"What made Dolly special?","o":["She was the first mammal cloned from an adult body cell","She was the largest sheep ever recorded","She was the first animal born in Scotland","She lived longer than any other sheep"],"a":0,"x":"She was the first mammal cloned from an adult body cell, taken from a grown animal rather than an embryo."},{"q":"Which kind of cell did the scientists use to create her?","o":["A blood cell","A mammary gland (udder) cell","A brain cell","A skin cell"],"a":1,"x":"Scientists took the nucleus from a mammary gland, or udder, cell of an adult sheep."},{"q":"Why were scientists so surprised by Dolly?","o":["Sheep were thought unable to have lambs","Many believed a specialised adult cell could not grow a whole new animal","She was born far bigger than expected","She was the first animal named after a singer"],"a":1,"x":"Many had firmly believed a specialised adult cell could never be reprogrammed to grow a whole new animal."}],"C1":[{"q":"In somatic cell nuclear transfer, what exactly was moved?","o":["The whole udder cell into a new sheep","The nucleus, holding the DNA, into an emptied egg cell","An egg cell into the udder","DNA taken from Dolly Parton"],"a":1,"x":"The nucleus, which holds the DNA, was moved into an egg cell whose own nucleus had been taken out."},{"q":"Dolly was a genetic copy of which animal?","o":["The sheep that provided the egg cell","The sheep whose udder cell was used","Both parent sheep equally","A sheep chosen at random"],"a":1,"x":"She was a genetic copy of the sheep the udder cell came from, not the sheep that supplied the egg."},{"q":"The passage suggests Dolly's birth mattered mainly because it:","o":["proved cloning was cheap","overturned a widely held belief about what adult cells could do","created a healthier breed of sheep","was the first success at the Roslin Institute"],"a":1,"x":"Her birth mattered mainly because it overturned the belief that a specialised adult cell couldn't build a new animal."}],"C2":[{"q":"Naming Dolly after Dolly Parton is best described as:","o":["a serious scientific tribute","a light-hearted nod to the mammary-gland cell used","a marketing decision by the institute","a coincidence unrelated to the science"],"a":1,"x":"A playful, light-hearted nod to the mammary gland, or udder, cell she was grown from."},{"q":"Which statement best captures why Dolly overturned a 'stubborn assumption'?","o":["It showed only sheep, and no other animal, could be cloned","It demonstrated a specialised adult cell could be reprogrammed to build a whole organism","It proved embryos were unnecessary for all reproduction","It confirmed that clones outlive ordinary animals"],"a":1,"x":"Dolly proved a specialised adult cell could be reprogrammed to build a complete new organism, which many thought impossible."},{"q":"Dolly is called 'one of the most consequential animals ever to have drawn breath' chiefly for her impact on:","o":["the wool industry","our scientific understanding of what life is capable of","Scottish tourism","the naming of laboratory animals"],"a":1,"x":"She earns that phrase chiefly for changing our scientific understanding of what life is capable of."}]},levels:{B1:"In a research centre in Scotland, something amazing happened. A lamb was born, and she looked like any other sheep. But she was not ordinary at all. Her name was Dolly, and she was the first mammal ever cloned from an adult cell. This means she was a living copy of another sheep. She was born on 5 July 1996 at the Roslin Institute, near Edinburgh, and a team of scientists led by Ian Wilmut and Keith Campbell created her.\n\nHow did they do it? Every cell has a nucleus, the tiny part that holds the DNA, like a set of instructions. The scientists took the nucleus from an udder cell of an adult sheep. They put it into an egg cell that had had its own nucleus taken out. This rebuilt egg then grew into Dolly. So Dolly was a genetic copy of the sheep the udder cell came from.\n\nThe team named her Dolly after the singer Dolly Parton, a fun joke about the udder cell. When the world heard about her in 1997, scientists were shocked. Many had thought this was impossible. Dolly showed that it could be done. She lived a normal life, had lambs of her own, and died in 2003. Today you can still see her at the National Museum of Scotland.",B2:"In the summer of 1996, in a quiet research centre in Scotland, a lamb was born who would change science forever. To anyone watching, she looked like an ordinary sheep, but she was anything but ordinary. Her name was Dolly, and she was the first mammal ever cloned from an adult body cell, which means from a cell taken from a fully grown animal rather than from an embryo. She was born on 5 July 1996 at the Roslin Institute, near Edinburgh, and she was created by a team of scientists led by Ian Wilmut and Keith Campbell.\n\nThe method they used was called somatic cell nuclear transfer, and although the name sounds complicated, the idea is quite simple. Every cell contains a nucleus, the part that holds the DNA, the instructions for building a living thing. The scientists took the nucleus from a mammary gland cell, an udder cell, of an adult sheep. They then placed it into an egg cell whose own nucleus had been removed. This rebuilt egg grew and developed into a lamb, and that lamb, Dolly, was a genetic copy of the sheep the udder cell had come from.\n\nThey named her Dolly after the American singer Dolly Parton, a light-hearted nod to the fact that the cell had come from a mammary gland. When her existence was announced to the world in 1997, scientists were stunned. Many had firmly believed it was impossible to take a specialised adult cell and reprogramme it to grow a whole new animal, yet Dolly proved that it could be done. She went on to live a fairly ordinary life, mated normally and had several lambs of her own, and she died in 2003. Her preserved body is now on display at the National Museum of Scotland in Edinburgh.",C1:"In the summer of 1996, in a research centre tucked into the countryside near Edinburgh, a lamb was born who would quietly rewrite what scientists believed was possible. To the casual eye she was an unremarkable sheep, yet she was one of the most extraordinary animals ever to have lived. Her name was Dolly, and she holds a unique place in history as the first mammal ever cloned from an adult body cell, that is, from a cell taken from a fully grown animal rather than from an embryo. Born on 5 July 1996 at the Roslin Institute, she was the creation of a team of scientists led by Ian Wilmut and Keith Campbell.\n\nThe technique behind her, known as somatic cell nuclear transfer, sounds forbidding, but the underlying idea can be explained simply. At the heart of nearly every cell sits a nucleus, the tiny structure that holds the DNA, the complete set of instructions for building and running a living creature. The scientists carefully removed the nucleus from a mammary gland cell, an ordinary udder cell, belonging to an adult sheep. They then introduced that nucleus into an egg cell from which the original nucleus had already been taken out. Coaxed into action, this reconstructed egg began to divide and grow, eventually developing into a lamb who was, genetically, an exact copy of the sheep whose udder cell had started it all.\n\nWith a playful sense of humour, the team named her Dolly after the American singer Dolly Parton, a light-hearted nod to the mammary gland cell from which she had sprung. When her existence was finally announced to the world in 1997, it sent a shockwave through the scientific community. Many researchers had been convinced that it was simply impossible to take a specialised adult cell and reprogramme it to grow an entire new animal, and yet here was Dolly, calm and woolly, proving them all wrong. She went on to live a fairly ordinary life for a sheep, mated normally and gave birth to several lambs of her own, before dying in 2003. Today her preserved body stands on display at the National Museum of Scotland in Edinburgh, where visitors can still come face to face with the sheep who changed biology.",C2:"In the summer of 1996, in a research centre nestled in the green countryside near Edinburgh, a lamb was born who would gently but decisively overturn one of biology's most stubborn assumptions. To any passer-by she was a perfectly ordinary sheep, indistinguishable from the flock around her, and yet she remains one of the most consequential animals ever to have drawn breath. Her name was Dolly, and she earned her place in history as the first mammal ever cloned from an adult body cell, meaning a cell drawn from a fully grown animal rather than from an embryo. Born on 5 July 1996 at the Roslin Institute, she was the achievement of a team of scientists led by Ian Wilmut and Keith Campbell, working at the very edge of what was then thought achievable.\n\nThe method that brought her into being, somatic cell nuclear transfer, carries an intimidating name, yet the principle at its core is surprisingly intuitive. Within almost every cell lies a nucleus, the minuscule compartment that houses the DNA, the full library of instructions for assembling and sustaining a living organism. What the scientists did was remarkable in its audacity and its delicacy: they extracted the nucleus from a single mammary gland cell, a humble udder cell, taken from an adult sheep, and transferred it into an egg cell that had first been emptied of its own nucleus. Prompted into life, this reconstructed egg began to divide, to grow and to organise itself, until in time it became a lamb who was, genetically speaking, an exact replica of the sheep from whose udder that original cell had been taken.\n\nIn a characteristically playful touch, the team christened her Dolly, after the American singer Dolly Parton, a light-hearted allusion to the mammary gland cell from which she had ultimately arisen. When her existence was announced to the world in 1997, it landed like a thunderclap across the scientific community. A great many researchers had held it as near-certain that a specialised adult cell could never be persuaded, or reprogrammed, to grow into an entire new animal, and yet there stood Dolly, placid and unmistakably real, quietly dismantling that certainty. She went on to lead a thoroughly ordinary life for a sheep, mating normally and bearing several lambs of her own, before her death in 2003. Her preserved body now stands on display at the National Museum of Scotland in Edinburgh, where visitors can still stand before the small, woolly creature who forever changed our understanding of what life is capable of."}},
{id:"cheese-rolling-coopers-hill",title:"Chasing Cheese Down Cooper's Hill",tag:"England · Sports",img:"images/reading/cheese-rolling-coopers-hill.jpg",quiz:{"B1":[{"q":"When does the cheese race take place?","o":["On the Spring Bank Holiday in late May","On New Year's Day","In early spring, in March","On the last day of summer"],"a":0,"x":"It runs 'on the Spring Bank Holiday in late May', so none of the other dates fit."},{"q":"How fast can the rolling cheese reach?","o":["About 70 miles per hour","About 20 miles per hour","About 40 miles per hour","About 100 miles per hour"],"a":0,"x":"That cheese hits 'about 70 miles per hour', which is exactly why no runner ever catches it."},{"q":"Who waits at the bottom of the hill to catch the runners?","o":["Volunteers, often local rugby players","Police officers","Doctors and nurses","Professional athletes"],"a":0,"x":"It's 'volunteers, often local rugby players' waiting at the bottom, not police, doctors or professional athletes."}],"B2":[{"q":"Why does nobody actually catch the cheese?","o":["It moves far faster than any person can run","It is too heavy to pick up","It is thrown into the crowd","The rules forbid touching it"],"a":0,"x":"The wheel hits around 70 mph, 'much faster than any person can run', so the chase is hopeless from the off."},{"q":"How much does the wheel of Double Gloucester weigh?","o":["Roughly 3 to 4 kilograms","About 1 kilogram","Around 10 kilograms","Less than half a kilogram"],"a":0,"x":"The cheese weighs 'about 3 to 4 kilograms', so don't be tempted by the heavier figures."},{"q":"How is the event organised these days?","o":["Informally and independently by the participants themselves","By the local council as an official festival","By a national sports federation","By the cheese company that makes the prize"],"a":0,"x":"These days it runs 'informally and independently by the participants themselves', not by a council, federation or the cheese company."}],"C1":[{"q":"According to the passage, what does the race really come down to?","o":["Who can tumble to the bottom of the hill first","Who can catch the cheese before it stops","Who can run the fastest on their feet","Who can throw the cheese the furthest"],"a":0,"x":"Since nobody catches the cheese, it really comes down to 'who can tumble to the bottom first'."},{"q":"The volunteers' job is described as 'thankless'. This suggests their work is","o":["Important but rarely appreciated","Highly paid and respected","Easy and relaxing","Optional and often skipped"],"a":0,"x":"'Thankless' means a needed job that gets little thanks. Their work matters, but it's rarely appreciated."},{"q":"Why does the writer call the fact that nobody catches the cheese a 'delicious catch'?","o":["It playfully overturns the idea that the race is a sensible contest","It explains why the cheese tastes so good","It warns readers that the race is dangerous","It proves the tradition is unfair to competitors"],"a":0,"x":"It's a playful pun that flips the idea this is any sensible athletic contest, since the chase was hopeless from the start."}],"C2":[{"q":"Which phrase best captures the writer's overall attitude to the event?","o":["Affectionate delight in its glorious silliness","Cool disapproval of a reckless custom","Detached, purely factual reporting","Nostalgic sadness that it still continues"],"a":0,"x":"Notice 'gloriously silly' and 'joyfully pointless'. That's warm, affectionate delight, not disapproval or cool detachment."},{"q":"By calling minor injuries 'badges of honour to be shown off afterwards', the writer implies competitors","o":["Take a certain pride in their bumps and bruises","Try to hide any sign of injury","Are secretly angry about getting hurt","Rarely suffer any injuries at all"],"a":0,"x":"A 'badge of honour' is worn with pride, so competitors are genuinely proud of their bumps and bruises."},{"q":"How does the writer characterise the British attachment to this tradition?","o":["As stubborn and rather endearing, however absurd","As embarrassing and best forgotten","As a purely commercial invention","As a modern trend with no real history"],"a":0,"x":"The ending nails it: 'the stubborn and rather endearing British affection for tradition, however absurd', word for word."}]},levels:{B1:"Every year, on the Spring Bank Holiday in late May, big crowds come to Cooper's Hill. This hill is near the village of Brockworth in Gloucestershire, in England. The people are all there for one strange and very English reason: a cheese race.\n\nSomeone rolls a large round wheel of Double Gloucester cheese from the top of the hill. The cheese weighs about 3 to 4 kilograms. The hill is extremely steep, so the cheese goes very fast. Then the competitors throw themselves down the slope after it. The first person to reach the bottom wins the cheese as a prize.\n\nBut here is the funny part. Nobody really catches the cheese. Once it is rolling, it can reach about 70 miles per hour, or 110 kilometres per hour. That is much faster than any person can run. So the race is really about who falls to the bottom first.\n\nThe hill is so steep that runners cannot stay on their feet. They trip, roll, bounce and turn over as they go down. Small injuries like bumps and sprains are common. Volunteers, often local rugby players, wait at the bottom to catch people and stop them. The tradition is very old and goes back well over 200 years. Today the runners organise it themselves, and it brings people from all around the world.",B2:"Every year, on the Spring Bank Holiday in late May, cheerful crowds gather at Cooper's Hill, a wonderfully steep slope near the little village of Brockworth in Gloucestershire, England. They come from near and far for one gloriously daft reason: to watch, or to join, a race that involves chasing a cheese.\n\nThe event begins when a large round wheel of Double Gloucester, weighing roughly 3 to 4 kilograms, is sent rolling from the very top of the hill. As soon as it starts to move, competitors hurl themselves down the slope after it, and the first person to reach the bottom wins the cheese as a prize. It sounds simple enough, but there is a catch that makes the whole thing beautifully absurd.\n\nThe truth is that nobody actually catches the cheese. Once it gets going, that heavy wheel can reach speeds of around 70 miles per hour, about 110 kilometres per hour, which is far faster than any human being could ever hope to run. So the race is not really about catching anything at all. Instead, it is a contest to see who can tumble to the bottom first.\n\nBecause the hill is so steep, the runners simply cannot stay on their feet. They trip, roll, bounce and somersault all the way down, and minor injuries such as bumps and sprains are fairly common. Happily, a team of volunteers, often local rugby players, waits at the bottom to catch the runners and bring them safely to a stop. This wonderfully silly tradition goes back well over 200 years. These days it is run informally and independently by the participants themselves, rather than as an official organised event, yet it still draws competitors and spectators from all around the world.",C1:"Every year, when the Spring Bank Holiday arrives in late May, enthusiastic crowds make their way to Cooper's Hill, a fearsomely steep slope near the modest village of Brockworth in Gloucestershire, England. They come, quite happily, to take part in or simply to gawp at one of the most gloriously ridiculous spectacles the country has to offer: a race in which grown adults fling themselves headlong down a hillside in pursuit of a cheese, and think it a splendid way to spend a bank holiday.\n\nProceedings begin when a large round wheel of Double Gloucester, weighing somewhere between 3 and 4 kilograms, is released from the very top of the hill. The moment it starts to roll, the competitors hurl themselves after it, and whoever reaches the bottom first is crowned the winner and carries off the cheese as a prize. Framed like that, it might sound almost like a sensible athletic contest, a straightforward test of speed and courage, but there is a delicious catch that turns the whole affair neatly on its head. Nobody, in practice, ever catches the cheese at all. Once that wheel gathers momentum, it can barrel downhill at something like 70 miles per hour, roughly 110 kilometres per hour, a speed no human sprinter could ever dream of matching. The chase, in other words, is hopeless from the very first second, and the race quietly transforms into a rather different question, namely who can tumble to the foot of the hill first.\n\nThe slope is so brutally steep that staying upright is simply not an option, no matter how determined or athletic the runner might be. Competitors trip, roll, bounce and somersault their way down in a glorious tangle of limbs, and minor injuries, the odd bump or sprain, are very much part of the bargain. Waiting at the bottom, mercifully, stands a line of volunteers, frequently drawn from the local rugby club, whose thankless job is to catch the runners and haul them to a stop before they do themselves any real harm. This splendidly eccentric tradition stretches back well over 200 years, handed down from one generation to the next. Nowadays it is run informally and independently by the participants themselves, rather than as any official organised event, and yet, improbably, it draws competitors and spectators from every corner of the world.",C2:"Every year, as the Spring Bank Holiday rolls around in late May, cheerful crowds converge on Cooper's Hill, a punishingly steep slope tucked away near the unassuming village of Brockworth in Gloucestershire, England. They gather, with an enthusiasm bordering on the deranged, for one of the most magnificently silly spectacles these islands have ever produced: a race in which otherwise sensible human beings throw themselves off a hillside in hot pursuit of a cheese. It is, in the very best sense, gloriously and unmistakably English.\n\nThe ritual commences when a large round wheel of Double Gloucester, weighing somewhere in the region of 3 to 4 kilograms, is set loose from the crest of the hill and left to find its own way down. No sooner has it begun to roll than the competitors launch themselves down the slope in its wake, the understanding being that the first to reach the bottom wins the cheese as a prize. Described in those terms, the enterprise sounds almost like a legitimate athletic contest, a straightforward test of speed and nerve. Yet lurking within it is a wonderfully preposterous truth that upends the entire premise: nobody, in all honesty, ever actually catches the cheese. Once that wheel has picked up momentum, it can hurtle downhill at something approaching 70 miles per hour, or roughly 110 kilometres per hour, a velocity no mortal runner could ever hope to rival. The pursuit, then, is doomed from the outset, and the so-called race resolves itself into a rather different question altogether, namely who can tumble, bruised but triumphant, to the foot of the hill first.\n\nSo unforgivingly steep is the incline that remaining on one's feet is quite simply out of the question, however nimble or well-prepared the competitor may fancy themselves to be. The runners trip, roll, bounce and somersault their way to the bottom in a chaotic flurry of flailing limbs, and minor injuries, the occasional bump or sprain, are cheerfully accepted as part of the deal, badges of honour to be shown off afterwards. Stationed at the foot of the slope, thankfully, is a line of volunteers, more often than not recruited from the local rugby club, whose unenviable task is to catch the tumbling competitors as they arrive and bring them to a halt before any serious harm is done. This delightfully eccentric custom reaches back well over 200 years, a testament to the stubborn and rather endearing British affection for tradition, however absurd that tradition happens to be. Today it is staged informally and independently by the participants themselves, rather than as any officially organised event, and yet, against all reasonable expectation, it continues to draw competitors and spectators from every last corner of the globe, all eager to witness, or survive, the maddest and most joyfully pointless few seconds of the entire English calendar."}}

{id:"barbie-movie-phenomenon",title:"Barbenheimer: The Summer Two Very Different Films Became One Cultural Moment",tag:"United States · Culture",img:"images/reading/barbie-movie-phenomenon.jpg",quiz:{"B1":[{"q":"On what date did both films open?","o":["21 July 2023","1 July 2023","21 June 2023","31 July 2023"],"a":0,"x":"Both films 'opened on 21 July 2023', stated twice, so the other dates are out."},{"q":"Who directed 'Barbie'?","o":["Greta Gerwig","Christopher Nolan","Margot Robbie","Ryan Gosling"],"a":0,"x":"Greta Gerwig directed it. Robbie and Gosling starred, and Nolan directed the other film, Oppenheimer."},{"q":"What did the word 'Barbenheimer' describe?","o":["Watching both films on the same day","A sequel that combined the two films","A new pink paint colour","A cinema chain that showed the films"],"a":0,"x":"'Barbenheimer' was the joke idea of watching both films in one day, not a sequel, paint or cinema chain."}],"B2":[{"q":"Why did the two films open on the same date?","o":["It was purely a scheduling coincidence","The two studios planned it together","One studio copied the other's date","A film festival chose the date"],"a":0,"x":"The shared date was 'purely by scheduling coincidence', not planned or copied by either studio."},{"q":"How much did 'Barbie' earn at the global box office?","o":["More than $1.4 billion","About $400 million","Around $800 million","Just over $1 billion"],"a":0,"x":"Barbie earned 'more than $1.4 billion' worldwide, so the smaller amounts don't hold up."},{"q":"How many brands did Warner Bros and Mattel partner with?","o":["More than 100","Fewer than 20","Exactly 50","More than 500"],"a":0,"x":"They 'partnered with over 100 brands', so fewer than 20, exactly 50 or 500 are all wrong."}],"C1":[{"q":"What point does the passage make about 'Barbie's commercial success?","o":["It succeeded on its own, independent of the Oppenheimer pairing","It depended entirely on being watched alongside Oppenheimer","It came mainly from merchandise rather than tickets","It was smaller than expected given the marketing"],"a":0,"x":"Barbie was 'a phenomenon in its own right, independent of the Oppenheimer pairing', not reliant on it or on merchandise."},{"q":"What most captured the public imagination about the two films?","o":["The sharp contrast, or incongruity, between them","The fact that they shared the same director","Their identical marketing campaigns","Their similar serious themes"],"a":0,"x":"It was 'precisely this incongruity' that gripped everyone, not shared directors or serious themes."},{"q":"How does the passage present the claim about a paint shortage at Rosco?","o":["As something reportedly claimed, not stated as certain fact","As a confirmed, well-documented event","As a joke invented by the film's marketers","As the main reason the film succeeded"],"a":0,"x":"Watch that careful 'reportedly claimed'. The writer passes on the Rosco story cautiously rather than confirming it."}],"C2":[{"q":"What is the writer's view of the films' coincidental release?","o":["A coincidence, yet hard to imagine a more consequential one","A carefully coordinated marketing plan","An unfortunate clash that hurt both films","A minor detail of little real importance"],"a":0,"x":"Coincidental, yes, but the writer finds it 'difficult to imagine a more consequential accident in film marketing history'."},{"q":"The repeated phrase 'reportedly claimed' about the Rosco shortage signals that the writer","o":["Treats the story with deliberate caution rather than asserting it","Is certain the shortage happened","Considers the shortage the film's greatest achievement","Believes the story was completely false"],"a":0,"x":"Hedging like 'reportedly claimed' holds the story at arm's length rather than stating it as certain."},{"q":"Which statement best sums up the passage's central argument?","o":["A single coincidence, amplified by internet culture, defined a whole summer","Two similar films succeeded because audiences preferred serious drama","Careful studio planning guaranteed both films' success","Merchandise, not the films, was the real story of 2023"],"a":0,"x":"The ending says it: a single coincidence, 'amplified by internet culture', defined a whole summer."}]},levels:{B1:"In July 2023, two very different films came out on the same day, and something amazing happened. The first film was \"Barbie,\" directed by Greta Gerwig. It starred Margot Robbie as Barbie and Ryan Gosling as Ken. The second film was \"Oppenheimer,\" a serious drama by Christopher Nolan about the atomic bomb. Both films opened on 21 July 2023.\n\nThe two movies could not have been more different. \"Barbie\" was a bright pink comedy, full of fun and colour. \"Oppenheimer\" was a dark, serious story about history and science. Because the films were so different, but opened on the same day, people online started a joke about watching both in one day. They called this idea \"Barbenheimer.\" Soon, it was not just a joke. Real people around the world went to the cinema and watched both films the same day.\n\n\"Barbie\" became a huge success. It made more money than any other film in 2023, and it became the highest-grossing film ever made by a woman director alone, earning more than $1.4 billion worldwide.\n\nThe marketing was everywhere too. Warner Bros and Mattel worked with more than 100 different brands to make Barbie products. Suddenly, pink was everywhere, in shops and on social media, a trend people called \"Barbiecore.\" The film used so much bright pink paint that the paint company Rosco reportedly ran short of that exact colour.",B2:"On 21 July 2023, cinemas around the world released two films that could hardly have been more different, yet the coincidence turned into one of the biggest cultural moments of the year. One was \"Barbie,\" a bright, colourful comedy directed by Greta Gerwig, starring Margot Robbie as Barbie and Ryan Gosling as Ken. The other was \"Oppenheimer,\" Christopher Nolan's serious, dramatic account of the scientist behind the atomic bomb. Both films opened on exactly the same date, purely by scheduling coincidence, but that coincidence is what made the moment so memorable.\n\nBecause the two films contrasted so sharply, a light-hearted internet joke quickly spread: why not watch both on the same day, back to back? The idea was nicknamed \"Barbenheimer,\" and it soon grew from an online joke into a genuine shared cultural event, with moviegoers deliberately booking double screenings and turning cinema-going into a playful ritual.\n\nThe commercial results were remarkable. \"Barbie\" went on to become the highest-grossing film of 2023 worldwide, and the highest-grossing film ever directed solely by a woman, earning more than $1.4 billion at the global box office. Behind that success lay an enormous marketing campaign. Warner Bros teamed up with Mattel and partnered with over 100 brands to produce Barbie-themed merchandise, flooding shops and social media feeds with pink until the trend earned its own name, \"Barbiecore.\"\n\nThe film's obsession with a particular shade of bright pink even had a real-world side effect: it was reportedly said that the production's enormous use of that pigment contributed to a temporary shortage at the paint company Rosco. What began as a scheduling accident, then, ended up reshaping how audiences experienced cinema that summer, proving that two wildly different stories, released on the very same day, could together become far bigger than either film alone.",C1:"When cinemas worldwide released two strikingly dissimilar films on 21 July 2023, few could have predicted that the pairing would evolve into one of the defining cultural phenomena of the decade. On one side stood \"Barbie,\" Greta Gerwig's vividly pink, self-aware comedy starring Margot Robbie as the title character and Ryan Gosling as Ken. On the other stood \"Oppenheimer,\" Christopher Nolan's sombre, meticulously researched drama chronicling the physicist behind the atomic bomb. The two productions shared nothing in tone, subject matter, or visual palette, and their simultaneous release was, in the strictest sense, an accident of studio scheduling rather than any deliberate coordination.\n\nIt was precisely this incongruity, however, that captured the public imagination. Almost as soon as release dates were confirmed, internet users began proposing, half-jokingly, that audiences ought to watch both films back to back in a single day, contrasting a candy-coloured satire with a somber meditation on nuclear devastation. The idea was christened \"Barbenheimer,\" a portmanteau that rapidly transcended its origins as a meme and materialised into an authentic, widely observed cultural ritual. Cinemas reported audiences arriving dressed head to toe in pink before settling in for hours of considerably darker material, and the juxtaposition itself became part of the entertainment, generating a wave of commentary about how audiences engage with contrasting narratives on the same day.\n\nCommercially, \"Barbie\" proved to be a phenomenon in its own right, independent of the Oppenheimer pairing. It concluded 2023 as the highest-grossing film of the year worldwide, and, notably, became the highest-grossing film ever directed solely by a woman, amassing over $1.4 billion in global box office receipts. This success was underpinned by a marketing campaign of extraordinary scale. Warner Bros, in collaboration with Mattel, negotiated tie-in partnerships with more than 100 separate brands, ensuring that Barbie-branded products saturated retail spaces and social media feeds alike. The resulting explosion of pink, in fashion, homeware, and advertising, was informally dubbed \"Barbiecore,\" a trend whose reach extended well beyond anyone who had actually seen the film.\n\nEven the production itself left a tangible mark on an unrelated industry: it was reportedly claimed that the film's extensive use of one particular, vivid shade of pink paint con
