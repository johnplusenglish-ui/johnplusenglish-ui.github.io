famous landmarks. It is precisely this open-ended creativity that has made the game so endlessly appealing to millions of people of all ages.\n\nThe game was originally created by the Swedish developer Markus \"Notch\" Persson and was first released in 2011 by Mojang Studios, a company also based in Sweden. Its popularity grew so quickly and so widely that, in 2014, the technology giant Microsoft acquired Mojang, recognising the enormous potential of the game it had built. Under Microsoft's ownership, Minecraft's reach only continued to expand across new platforms and new audiences.\n\nThat growth eventually turned Minecraft into a genuine phenomenon. It is now widely recognised as the best-selling video game of all time, having sold well over 300 million copies across all the different platforms on which it has appeared, from computers and consoles to mobile phones. Its educational value has been recognised too: a special version called \"Minecraft: Education Edition\" is now used in schools around the world to teach subjects such as history, engineering, and computer coding, turning a game into a genuine classroom tool.\n\nBeyond the classroom, Minecraft's cultural influence has been just as striking. The game has inspired a live-action Minecraft film, an enormous range of merchandise, and a large, dedicated global community that keeps the game alive long after its release. Countless players run massive multiplayer servers, where they build, explore, and collaborate together, ensuring that this simple cube-based world remains one of the most beloved creative spaces in gaming history.",C1:"Minecraft belongs to a genre known as the sandbox, combining building and survival gameplay in a form that grants players an almost unparalleled degree of creative freedom. Rather than following a fixed narrative, players are handed a world made of simple, blocky cubes and left to construct virtually anything their imagination can conjure, ranging from modest houses and ingeniously engineered working machines to sprawling, painstakingly detailed recreations of real cities and world-famous landmarks. It is this open-endedness, this refusal to impose limits on what players can achieve, that has allowed the game to resonate with an extraordinarily broad and diverse audience, a freedom rarely offered by more conventional, tightly scripted titles.\n\nThe game's origins trace back to the Swedish developer Markus \"Notch\" Persson, who created Minecraft before it was first released in 2011 by Mojang Studios, a company likewise based in Sweden. What began as a relatively modest independent project soon snowballed into something far larger, and by 2014 its commercial and cultural momentum had become impossible to ignore. That year, the technology company Microsoft acquired Mojang outright, a move that reflected just how significant Minecraft had already become within the wider gaming industry, and one that positioned the game for even greater global expansion, reaching new players and new platforms, in the years that followed.\n\nThe scale of that expansion is difficult to overstate. Minecraft is now widely regarded as the best-selling video game of all time, having sold well over 300 million copies across the numerous platforms on which it has been released, spanning personal computers, consoles, and mobile devices alike. Its influence, however, extends well beyond commercial success. A dedicated version of the game, \"Minecraft: Education Edition,\" has been adopted by schools around the world, where educators use it to teach subjects as varied as history, engineering, and computer coding, harnessing the game's inherent creativity for genuinely pedagogical ends.\n\nMinecraft's cultural footprint has grown correspondingly vast. The game has inspired a live-action Minecraft film, an extensive and ever-expanding range of merchandise, and a sprawling, deeply devoted global community that continues to sustain and reinvent the experience years after its original release. Countless enthusiasts run massive multiplayer servers, on which players collaborate, compete, and build together at a scale few other games have ever matched, cementing Minecraft's status not merely as a bestseller but as a defining cultural touchstone of the modern gaming era.",C2:"Minecraft occupies a singular place in the history of interactive entertainment: a sandbox building and survival video game in which the only real constraint is imagination itself. There is no scripted campaign to complete, only the material itself and the possibilities it suggests. Constructed entirely from simple, blocky cubes, its world invites players to fashion almost anything they can conceive, from unassuming houses and intricately engineered working machines to vast, painstakingly rendered recreations of real cities and globally recognised landmarks. This radical openness, the refusal to funnel players toward any predetermined outcome, sets Minecraft apart from the more tightly scripted, narrative-driven titles that dominate much of the industry, and it is precisely this quality that has allowed the game to transcend age, geography, and genre preference in ways few other creative works ever manage.\n\nThe game's origins are, in retrospect, almost modest. It was conceived by the Swedish developer Markus \"Notch\" Persson and first released in 2011 by Mojang Studios, a company likewise headquartered in Sweden. Few could have predicted that a game built from such humble, pixelated materials would eventually rank among the most commercially significant creative products ever released. What began as an independent project, built without the resources of a major publisher, expanded with such extraordinary velocity that by 2014 its cultural and commercial significance had become undeniable, prompting the technology giant Microsoft to acquire Mojang outright. That acquisition marked not an ending but an inflection point, positioning Minecraft for a further, sustained expansion across platforms, audiences, and use cases that neither its original creator nor its earliest players could plausibly have anticipated.\n\nThe resulting trajectory has been extraordinary by any measure. Minecraft is now widely acknowledged as the best-selling video game of all time, having sold well over 300 million copies across the many platforms on which it has appeared, spanning personal computers, consoles, and mobile devices. Yet its significance cannot be reduced to commercial figures alone. A dedicated iteration, \"Minecraft: Education Edition,\" has been embraced by schools around the world, where educators deploy it to teach subjects as varied as history, engineering, and computer coding, effectively repurposing a recreational phenomenon as a genuinely versatile pedagogical instrument, one capable of making abstract concepts tangible through hands-on construction and experimentation. In this respect the game functions less like conventional entertainment and more like a flexible medium adaptable to whichever curriculum an educator has in mind.\n\nBeyond the classroom and the sales charts, Minecraft's cultural footprint has grown into something closer to an entire ecosystem. The game has inspired a live-action Minecraft film, an extensive and continually expanding range of merchandise, and a vast, fiercely devoted global community that has sustained and reinvented the experience for well over a decade. Fan-made creations and events have proliferated online, feeding a cycle of attention few franchises ever replicate. Countless enthusiasts operate massive multiplayer servers on which players collaborate, compete, and build collectively at a scale rarely matched elsewhere in gaming, ensuring that this deceptively simple, cube-based world endures not merely as a commercial triumph but as one of the defining cultural touchstones of the digital age."}},
{id:"eurovision-global-fandom",title:"Sequins, Ballads and Pyrotechnics: Why the World Watches Eurovision",tag:"Europe · Culture",img:"images/reading/eurovision-global-fandom.jpg",quiz:{"B1":[{"q":"When did the Eurovision Song Contest begin?","o":["1974","1956","2020","1990"],"a":1,"x":"The contest 'began in 1956', so 1974, 2020 and 1990 are all out."},{"q":"What is one important voting rule in the contest?","o":["No country can vote for its own song","Only juries can vote","Each country sends three songs","Viewers cannot vote at all"],"a":0,"x":"Note the key rule: 'no country is allowed to vote for its own song', and it isn't that only juries vote."},{"q":"Which group won in 1974 with the song 'Waterloo'?","o":["A group from Australia","The Swedish group ABBA","The EBU singers","A British band"],"a":1,"x":"'The Swedish group ABBA' won in 1974 with 'Waterloo', not an Australian or British act."}],"B2":[{"q":"How is the winner of Eurovision decided, according to the passage?","o":["Only by professional juries","Only by viewers at home","Half by professional national juries and half by television viewers","By the EBU committee alone"],"a":2,"x":"The winner is decided 'half from professional national juries and half from television viewers', not by one group alone."},{"q":"Why is Australia mentioned in the passage?","o":["As the host country every year","As a notable non-European nation welcomed into the contest","As the country that started Eurovision","As a country banned from voting"],"a":1,"x":"Australia is cited as 'the most notable example' of a non-European nation welcomed in, not as host or founder."},{"q":"What does the passage say truly sets Eurovision apart?","o":["Its low cost to produce","Its extraordinary range of performance styles","Its focus only on ballads","Its small television audience"],"a":1,"x":"What 'truly sets Eurovision apart' is its 'extraordinary range of performance styles', not its cost or a small audience."}],"C1":[{"q":"The passage describes the rule against voting for one's own entry as designed to do what?","o":["Preserve at least the appearance of impartiality","Guarantee European countries win","Speed up the voting process","Reward the host nation"],"a":0,"x":"That rule is 'designed to preserve at least the appearance of impartiality', not to speed voting or reward hosts."},{"q":"What does the writer suggest defines Eurovision's identity?","o":["Its strict European-only membership","The juxtaposition of the sincere and the spectacular","Its avoidance of theatrical excess","Its reliance on professional juries only"],"a":1,"x":"It's 'this juxtaposition of the sincere and the spectacular' that defines Eurovision's identity, not European-only membership."},{"q":"What does the writer imply by noting that viewing parties occur even in countries that have never competed?","o":["That those countries are trying to join","That Eurovision generates a singular, unifying joy beyond competing nations","That the contest is losing its audience","That non-European countries dislike the show"],"a":1,"x":"Parties in non-competing countries reveal the 'singular, unifying joy' Eurovision sparks well beyond the nations actually competing."}],"C2":[{"q":"The closing line says Eurovision 'has always taken its music seriously and itself, delightfully, not at all.' This chiefly conveys what tone?","o":["Harsh criticism of the contest's quality","Affectionate appreciation of its self-aware playfulness","Indifference toward the music","Regret that the show still exists"],"a":1,"x":"The line warmly celebrates the show's self-aware playfulness, not criticism, indifference or regret."},{"q":"How does the author characterise the contest's format across nearly seven decades?","o":["Constantly reinvented beyond recognition","Little changed on paper, making its endurance remarkable","Abandoned and revived many times","Copied directly from sporting events"],"a":1,"x":"Notice 'how little, on paper, the format has changed across nearly seven decades', which makes its endurance remarkable."},{"q":"What does the author suggest is the main source of Eurovision's singular reputation?","o":["Its wholehearted embrace of contradiction, holding sincerity and spectacle together","Its strict geographical boundaries","Its reliance on a single arbiter to judge","Its avoidance of emotional ballads"],"a":0,"x":"The credit goes to its 'wholehearted embrace of contradiction', holding sincerity and spectacle in comfortable coexistence."}]},levels:{B1:"Every year, millions of people around the world watch a huge television event called the Eurovision Song Contest. It began in 1956, and it is organized by the European Broadcasting Union, or EBU. It is one of the oldest television shows in the world, and it is also one of the most popular.\n\nEvery country that takes part sends one singer or group with one original song. Most of the countries are in Europe, but a few countries from outside Europe, like Australia, also compete. During the show, two groups choose the winner: professional juries and ordinary television viewers at home. However, there is one important rule - no country is allowed to vote for its own song.\n\nThe contest is famous for its exciting mix of styles. Some songs are slow and emotional, full of feeling. Other performances are wild and theatrical, with bright costumes, fireworks, dancing and strange props on stage. One of the most famous winners was the Swedish group ABBA. They won in 1974 with their song \"Waterloo,\" and this win helped them become one of the most successful pop groups in history.\n\nBecause the contest is so loved, fans travel from every part of the world just to watch it live. In many other countries, even ones that do not compete, people organize parties to watch Eurovision together, showing just how much joy this contest brings to people everywhere.",B2:"Since its inception in 1956, the Eurovision Song Contest has grown into one of the longest-running and most-watched non-sporting television events on the planet, drawing hundreds of millions of viewers every single year. Organized by the European Broadcasting Union, or EBU, the competition brings together countries from across Europe, and occasionally beyond it, in a spectacular celebration of music and national pride.\n\nEach participating nation enters exactly one original song, performed live by a chosen singer or group, and the stakes could not be higher. While the vast majority of competing countries are European, a handful of non-European nations, Australia being the most notable example, have also been welcomed into the contest, reflecting Eurovision's remarkably broad appeal. The winner is decided through a combined system of votes, half from professional national juries and half from television viewers voting from home, though there is one rule no country can bend: nobody may vote for their own entry.\n\nWhat truly sets Eurovision apart, though, is its extraordinary range of performance styles. Within a single evening, audiences might be moved to tears by a heartfelt ballad, only to be dazzled minutes later by a performance bursting with pyrotechnics, elaborate costumes, dancing and props that seem to know no limits. This willingness to embrace both raw emotion and pure theatrical spectacle is part of what has made the contest so beloved. Among its most celebrated winners is the Swedish group ABBA, whose triumphant 1974 victory with \"Waterloo\" did not just earn them the trophy, it launched one of the most successful international pop careers the world has ever seen.\n\nThat devotion is not confined to competing countries. Fans routinely travel across continents to be in the arena for the live broadcast, while viewing parties spring up in cities all over the globe, including in nations that have never taken part, proof of how far Eurovision's joyful reach extends.",C1:"First staged in 1956 and organized ever since by the European Broadcasting Union, the EBU, the Eurovision Song Contest has evolved into a genuine cultural phenomenon, ranking among the longest-running and most-watched non-sporting television events anywhere in the world. Each year, hundreds of millions of viewers across the globe tune in, transforming what began as a modest post-war experiment in continental cooperation into a spectacle whose scale few other broadcasts can rival.\n\nThe format itself is deceptively simple. Every participating country submits a single original song, performed by an artist or group chosen to represent it, and although the roster is overwhelmingly European, the contest has never been confined strictly by geography, with countries such as Australia having been invited to compete despite lying firmly outside the continent. Winners are determined by a dual voting system that combines the judgments of professional national juries with the enthusiasm of ordinary television viewers, who cast their votes by phone or app from their living rooms. One safeguard, however, is inviolable: no country, whatever its allegiances, may cast a vote for its own entry, a rule designed to preserve at least the appearance of impartiality in a contest not exactly famous for subtlety.\n\nIt is precisely this juxtaposition of the sincere and the spectacular that has come to define Eurovision's identity. In the space of a single broadcast, viewers might be quietly moved by a stark, confessional ballad before being swept up moments later by a performance overflowing with pyrotechnics, elaborate costumes, synchronized choreography and props of almost limitless invention. Few other stages so comfortably accommodate both raw emotional vulnerability and unapologetic theatrical excess within the same running order. Among the contest's most storied triumphs is that of the Swedish group ABBA, whose 1974 victory with \"Waterloo\" proved to be far more than a single evening's success, effectively launching an international career that would establish them as one of the most commercially successful pop acts in musical history.\n\nEurovision's devoted following, moreover, extends well beyond the borders of the nations actually competing. Fans think nothing of crossing continents to secure a seat for the live broadcast, while organized viewing parties fill bars, halls and living rooms in cities across the globe, including in countries that have never entered a single act. That such enthusiasm persists in places with no competitive stake whatsoever says a great deal about the singular, unifying joy that Eurovision continues to generate, year after year, decade after decade.",C2:"Inaugurated in 1956 under the auspices of the European Broadcasting Union, the EBU, and staged annually ever since with only the rarest of interruptions, the Eurovision Song Contest has ascended from a modest exercise in postwar continental goodwill into one of television's most durable and improbable institutions, a fixture so entrenched in the European calendar that its absence would seem almost inconceivable. Watched each year by an audience numbering in the hundreds of millions, it stands among the longest-running and most-watched non-sporting broadcasts on the planet, a distinction all the more remarkable given how little, on paper, the format has changed across nearly seven decades.\n\nThat format rests on a principle of elegant simplicity, even if its execution has grown ever more elaborate. Each participating nation puts forward a single original song and a single performer or ensemble to deliver it, and while the roster remains overwhelmingly European in composition, the contest has long resisted being defined by strict geographical boundaries, admitting nations such as Australia despite their evident remoteness from the continent whose name the competition bears. The outcome, in turn, is determined not by a lone arbiter but by a carefully calibrated hybrid of judgment and popular sentiment, professional national juries weighing in alongside television audiences who cast their preferences from home. Yet amid all this complexity, one stricture remains sacrosanct and unbending: no country, regardless of loyalty or self-interest, is permitted to vote for its own entry, a safeguard intended to lend the proceedings at least a veneer of impartiality.\n\nWhat has arguably done more than anything else to cement Eurovision's singular reputation, however, is its wholehearted embrace of contradiction. Within the span of a single evening, an audience might find itself moved to genuine, unguarded emotion by a stripped-back, confessional ballad, only to be catapulted, mere minutes later, into a performance saturated with pyrotechnics, extravagant costuming, meticulously synchronized choreography and props whose sheer inventiveness borders on the surreal. Few other cultural showcases manage to hold both sincerity and spectacle in such comfortable, unembarrassed coexistence, and it is precisely this tonal audacity that keeps successive generations of viewers returning. Among the contest's most storied legacies is the triumph of the Swedish group ABBA, whose 1974 victory with \"Waterloo\" transcended the confines of a single night's competition altogether, becoming instead the launching point for an international career that would install them among the most commercially successful and enduring pop acts the world has ever produced.\n\nNor is Eurovision's appeal confined to those nations with a stake in the outcome. Devoted fans think nothing of crossing continents merely to secure a place in the arena for the live broadcast, while informal viewing parties spring up in bars, homes and public squares across the globe, flourishing even in countries that have never fielded so much as a single entry. That such fervent, unprompted devotion should persist in places entirely outside the competitive fray speaks volumes about the peculiar, unifying joy Eurovision continues, year upon year, to generate, a testament to the enduring power of a contest that has always taken its music seriously and itself, delightfully, not at all."}},

triumph did not prepare American sports fans for what was about to happen to their domestic league.\n\nIn 2023, Messi stunned the football world by signing with Inter Miami CF, a club competing in Major League Soccer in the United States. The team is co-owned by David Beckham, the former England international whose own career had already made him a global icon. Beckham had long dreamed of bringing a player of Messi's stature to his club, and now that dream had become reality.\n\nThe impact was immediate and dramatic. Ticket prices for Inter Miami matches soared as demand exploded overnight, while sales of MLS jerseys and merchandise spiked to levels the league had rarely, if ever, seen. Attendance records at Inter Miami's home stadium were broken as supporters scrambled for the chance to watch the Argentine superstar in person. Even Apple's MLS Season Pass streaming subscription reportedly experienced a significant surge in signups around the time of his debut, as fans who could not attend in person raced to watch from home.\n\nMessi wasted no time proving why the excitement was justified. In his very first match for Inter Miami, in the Leagues Cup competition, he scored a dramatic stoppage-time free kick to win the game outright, an entrance that felt almost scripted.\n\nCommentators and league executives quickly began describing the phenomenon as comparable to, or perhaps even greater than, the impact of Beckham's own high-profile move to LA Galaxy back in 2007. The whole extraordinary wave of enthusiasm soon earned its own nickname: the \"Messi Effect.\"",C1:"By the time Lionel Messi lifted the 2022 FIFA World Cup with Argentina, his standing as one of the finest players ever to grace the sport was already beyond dispute, a crowning achievement that seemed to leave little else for him to prove. What no one could have fully anticipated, however, was the seismic effect his next career move would have on a footballing landscape thousands of miles from Europe or South America, in a country where soccer had long lived in the shadow of other sports.\n\nIn 2023, Messi confirmed his signing with Inter Miami CF, a club competing in Major League Soccer in the United States and co-owned by David Beckham, the former England international whose own playing career had made him a household name across the football world. For Beckham, who had spent years cultivating the club's ambitions, the arrival of a player of Messi's calibre represented the culmination of a long-held vision, and for MLS as a whole, it marked the beginning of an entirely new chapter.\n\nThe consequences unfolded almost instantaneously. Ticket prices for Inter Miami fixtures soared as demand vastly outstripped supply, while sales of MLS jerseys and associated merchandise spiked to levels the league had never previously witnessed. Attendance records tumbled at Inter Miami's home stadium, as supporters clamoured for even the briefest glimpse of the Argentine icon in action. Meanwhile, Apple's MLS Season Pass, the league's streaming subscription service, reportedly registered a substantial surge in signups coinciding with Messi's debut, as fans unable to secure tickets sought an alternative route to witness history.\n\nThat history, fittingly, arrived without delay. In his very first appearance for Inter Miami, during the Leagues Cup, Messi produced a moment of pure theatre, curling home a stoppage-time free kick to snatch a winning goal in what might have been mistaken for a piece of scripted drama rather than genuine sporting reality. It was, quite literally, the perfect introduction, a single moment that seemed to confirm every hope the club and its new supporters had invested in him.\n\nCommentators and league executives alike were quick to draw comparisons with Beckham's own headline-grabbing move to LA Galaxy in 2007, a transfer that had likewise been credited with raising the sport's profile across the country. Many, however, argued that Messi's impact eclipsed even that landmark moment. The phenomenon swiftly acquired its own shorthand, the \"Messi Effect,\" a phrase now used to capture the remarkable surge in popularity that soccer experienced across the United States in the wake of his arrival.",C2:"By the time Lionel Messi hoisted the 2022 FIFA World Cup aloft with Argentina, the question of whether he ranked among the greatest players ever to grace the game had, for most observers, been settled beyond meaningful debate. What remained unforeseeable, even to the most seasoned football pundits, was the sheer magnitude of the transformation his subsequent career decision would unleash upon a sporting culture on an entirely different continent, one where the game had traditionally struggled to command the attention lavished on gridiron football, basketball, or baseball.\n\nIn 2023, Messi confirmed his signing with Inter Miami CF, a club competing in Major League Soccer and co-owned by David Beckham, the former England international whose own storied playing career had long since made him a globally recognisable figure well beyond the confines of the sport. For Beckham, who had spent years nurturing the franchise's ambitions and quietly courting precisely this kind of marquee arrival, Messi's decision represented nothing short of a vindication, the culmination of a vision many had once dismissed as improbable. For American soccer more broadly, it signalled the opening of an unprecedented chapter.\n\nThe repercussions materialised with startling immediacy. Ticket prices for Inter Miami fixtures soared as demand vastly outstripped supply, while sales of MLS jerseys and associated merchandise spiked to levels the league had never previously come close to registering. Attendance records at Inter Miami's home stadium were shattered in short order, as supporters clamoured, sometimes at considerable expense, for even the briefest glimpse of the Argentine icon in the flesh. Meanwhile, Apple's MLS Season Pass, the league's dedicated streaming subscription service, reportedly experienced a substantial surge in signups coinciding precisely with Messi's debut, as fans unable to secure stadium tickets sought an alternative, and considerably cheaper, route into history.\n\nThat history, fittingly, arrived without so much as a moment's delay. In his very first appearance for Inter Miami, during the Leagues Cup, Messi conjured a moment of pure theatre, curling home a stoppage-time free kick to snatch a winning goal in circumstances so improbably cinematic that they might easily have been mistaken for scripted drama rather than genuine, unscripted sporting reality. It was, in the most literal sense imaginable, the perfect introduction, a single moment of individual brilliance that seemed almost designed to validate every expectation the club, the league, and its newly captivated supporters had invested in him.\n\nCommentators and league executives alike were quick to draw comparisons with Beckham's own headline-grabbing move to LA Galaxy back in 2007, a transfer widely credited at the time with raising the sport's domestic profile. Many observers, however, went further still, arguing that Messi's impact had already eclipsed even that landmark moment in scale and immediacy. The phenomenon swiftly acquired its own shorthand, the \"Messi Effect,\" a phrase now firmly embedded in the vocabulary of American sport to describe the extraordinary, almost overnight surge in soccer's popularity that followed in the wake of his arrival on Florida's shores."}}

const WORD_COUNTS = {};
READING_PASSAGES.forEach(function(p){
  WORD_COUNTS[p.id] = {};
  ['B1','B2','C1','C2'].forEach(function(lvl){
    WORD_COUNTS[p.id][lvl] = p.levels[lvl].trim().split(/\s+/).length;
  });
});

let currentPassage = null;
let currentLevel = 'B2';

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---- highlight storage (per passage + level, persisted in localStorage) ---- */
const HL_KEY = 'jpe-reading-highlights';

function loadHighlights(){
  try { return JSON.parse(localStorage.getItem(HL_KEY)) || {}; } catch(e){ return {}; }
}
function saveHighlights(){
  try { localStorage.setItem(HL_KEY, JSON.stringify(highlightStore)); } catch(e){}
}
let highlightStore = loadHighlights();

function hlKey(id, level){ return id + '|' + level; }

function getHighlights(id, level){
  return highlightStore[hlKey(id, level)] || [];
}

function mergeRanges(ranges){
  const sorted = ranges.slice().sort(function(a,b){ return a.start - b.start || a.end - b.end; });
  const out = [];
  sorted.forEach(function(r){
    const last = out[out.length - 1];
    if (last && r.start <= last.end) {
      last.end = Math.max(last.end, r.end);
    } else {
      out.push({start: r.start, end: r.end});
    }
  });
  return out;
}

function addHighlight(id, level, para, start, end){
  const key = hlKey(id, level);
  const list = highlightStore[key] || [];
  const sameParaRanges = list.filter(function(r){ return r.para === para; }).map(function(r){ return {start:r.start, end:r.end}; });
  sameParaRanges.push({start:start, end:end});
  const merged = mergeRanges(sameParaRanges).map(function(r){ return {para:para, start:r.start, end:r.end}; });
  const otherParas = list.filter(function(r){ return r.para !== para; });
  highlightStore[key] = otherParas.concat(merged);
  saveHighlights();
}

function removeHighlight(id, level, para, start, end){
  const key = hlKey(id, level);
  const list = highlightStore[key] || [];
  highlightStore[key] = list.filter(function(r){ return !(r.para === para && r.start === start && r.end === end); });
  saveHighlights();
}

function renderParaHtml(text, ranges){
  const sorted = ranges.slice().sort(function(a,b){ return a.start - b.start; });
  let out = '';
  let pos = 0;
  sorted.forEach(function(r){
    if (r.start > pos) out += escapeHtml(text.slice(pos, r.start));
    out += '<mark class="hl" data-start="' + r.start + '" data-end="' + r.end + '">' + escapeHtml(text.slice(r.start, r.end)) + '</mark>';
    pos = Math.max(pos, r.end);
  });
  if (pos < text.length) out += escapeHtml(text.slice(pos));
  return out;
}

function renderPassageBody(){
  const p = READING_PASSAGES.find(function(x){ return x.id === currentPassage; });
  const paras = p.levels[currentLevel].split(/\n\s*\n/).filter(Boolean);
  const ranges = getHighlights(currentPassage, currentLevel);
  document.getElementById('passageBody').innerHTML = paras.map(function(para, i){
    const paraRanges = ranges.filter(function(r){ return r.para === i; });
    return '<p data-para="' + i + '">' + renderParaHtml(para, paraRanges) + '</p>';
  }).join('');
  renderQuiz();
}

/* ---- comprehension quiz (3 MCQs per level, trickier as the level rises) ---- */
function renderQuiz(){
  const wrap = document.getElementById('passageQuiz');
  const p = READING_PASSAGES.find(function(x){ return x.id === currentPassage; });
  const qs = p && p.quiz && p.quiz[currentLevel];
  if (!qs || !qs.length) { wrap.innerHTML = ''; return; }
  let html = '<div class="quiz-head"><h3>Check your understanding <span class="quiz-lvl">' + currentLevel + '</span></h3><span class="quiz-score" id="quizScore"></span></div>';
  qs.forEach(function(item, qi){
    html += '<div class="quiz-q" data-q="' + qi + '" data-a="' + item.a + '">';
    html += '<div class="quiz-q-text"><span class="quiz-q-num">' + (qi + 1) + '</span><span>' + escapeHtml(item.q) + '</span></div>';
    html += '<div class="quiz-opts">';
    item.o.forEach(function(opt, oi){
      html += '<button class="quiz-opt" data-o="' + oi + '"><span class="quiz-opt-mark">' + String.fromCharCode(65 + oi) + '</span><span>' + escapeHtml(opt) + '</span></button>';
    });
    html += '</div>';
    if (item.x) html += '<div class="quiz-exp"><b>Why:</b> ' + escapeHtml(item.x) + '</div>';
    html += '</div>';
  });
  wrap.innerHTML = html;
  updateQuizScore();
}

function updateQuizScore(){
  const wrap = document.getElementById('passageQuiz');
  const el = document.getElementById('quizScore');
  if (!el) return;
  const all = wrap.querySelectorAll('.quiz-q');
  const answered = wrap.querySelectorAll('.quiz-q.answered');
  let right = 0;
  answered.forEach(function(q){ if (!q.querySelector('.quiz-opt.wrong')) right++; });
  el.innerHTML = answered.length ? ('<b>' + right + '</b> / ' + all.length + ' correct') : '';
}

/* ---- turning a text selection into a stored highlight ---- */
function getOffsetWithinPara(paraEl, node, offset){
  let total = 0;
  let found = false;
  function walk(n){
    if (found) return;
    if (n.nodeType === 3) {
      if (n === node) { total += offset; found = true; return; }
      total += n.textContent.length;
    } else {
      for (let i = 0; i < n.childNodes.length; i++) {
        walk(n.childNodes[i]);
        if (found) return;
      }
    }
  }
  walk(paraEl);
  return total;
}

function handleSelection(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const startEl = range.startContainer.nodeType === 3 ? range.startContainer.parentElement : range.startContainer;
  const endEl = range.endContainer.nodeType === 3 ? range.endContainer.parentElement : range.endContainer;
  const startPara = startEl && startEl.closest('p[data-para]');
  const endPara = endEl && endEl.closest('p[data-para]');
  if (!startPara || !endPara || startPara !== endPara) { sel.removeAllRanges(); return; }
  const paraIndex = parseInt(startPara.getAttribute('data-para'), 10);
  const start = getOffsetWithinPara(startPara, range.startContainer, range.startOffset);
  const end = getOffsetWithinPara(startPara, range.endContainer, range.endOffset);
  sel.removeAllRanges();
  if (end <= start) return;
  addHighlight(currentPassage, currentLevel, paraIndex, start, end);
  renderPassageBody();
}

function renderLevelTabs(){
  const tabs = document.getElementById('levelTabs');
  let html = '';
  ['B1','B2','C1','C2'].forEach(function(lvl){
    html += '<button class="tab' + (lvl===currentLevel?' active':'') + '" data-level="' + lvl + '" onclick="setLevel(\'' + lvl + '\')" style="--tab-accent:#2176FF">' + lvl + '</button>';
  });
  tabs.innerHTML = html;
}

function setLevel(lvl){
  currentLevel = lvl;
  renderLevelTabs();
  if (currentPassage) {
    renderPassageBody();
    JPE_DEEPLINK.setParams({passage: currentPassage, level: currentLevel});
  }
}

function groupedTopics(){
  const groups = {};
  READING_PASSAGES.forEach(function(p){
    const parts = p.tag.split(' · ');
    const region = parts[0];
    const category = parts[1] || 'General';
    if (!groups[category]) groups[category] = [];
    groups[category].push({id: p.id, title: p.title, region: region});
  });
  const catNames = Object.keys(groups).sort();
  catNames.forEach(function(c){
    groups[c].sort(function(a, b){ return a.title.localeCompare(b.title); });
  });
  return {catNames: catNames, groups: groups};
}

let currentCatIdx = 0;
const TOPIC_SIDEBAR_COLLAPSED_KEY = 'jpe-reading-sidebar-collapsed';

function renderSidebarNav(){
  const grouped = groupedTopics();
  let collapsed = false;
  try { collapsed = localStorage.getItem(TOPIC_SIDEBAR_COLLAPSED_KEY) === '1'; } catch(e){}
  document.getElementById('guideShell').classList.toggle('sb-collapsed', collapsed);

  let menuHtml = '';
  grouped.catNames.forEach(function(cat, i){
    menuHtml += '<button class="guide-nav-item' + (i === currentCatIdx ? ' active' : '') + '" onclick="selectCategory(' + i + ')"><span class="guide-nav-dot"></span><span>' + escapeHtml(cat) + '</span><span class="guide-nav-count">' + grouped.groups[cat].length + '</span></button>';
  });
  document.getElementById('catNav').innerHTML = menuHtml;
  document.getElementById('sbFoot').innerHTML = READING_PASSAGES.length + ' passages across <b>' + grouped.catNames.length + '</b> categories';

  renderCategoryContent();
}

function selectCategory(idx){
  currentCatIdx = idx;
  document.querySelectorAll('#catNav .guide-nav-item').forEach(function(el, i){
    el.classList.toggle('active', i === idx);
  });
  closePassage();
}

function showListView(){
  document.getElementById('catHead').style.display = 'block';
  document.getElementById('catBody').style.display = 'block';
  document.getElementById('readerHead').style.display = 'none';
  document.getElementById('readerBody').style.display = 'none';
}

function showReaderView(){
  document.getElementById('catHead').style.display = 'none';
  document.getElementById('catBody').style.display = 'none';
  document.getElementById('readerHead').style.display = 'block';
  document.getElementById('readerBody').style.display = 'block';
}

function renderCategoryContent(){
  const grouped = groupedTopics();
  const cat = grouped.catNames[currentCatIdx];
  const items = grouped.groups[cat] || [];
  document.getElementById('catHeadTitle').textContent = cat;
  document.getElementById('catHeadSub').textContent = items.length + (items.length === 1 ? ' passage' : ' passages');
  let html = '';
  items.forEach(function(it){
    html += '<button class="topic-row" onclick="openPassage(\'' + it.id + '\')"><span class="topic-row-region">' + escapeHtml(it.region) + '</span><span class="topic-row-title">' + escapeHtml(it.title) + '</span><span class="topic-row-arr">&rsaquo;</span></button>';
  });
  document.getElementById('rpContent').innerHTML = html;
  showListView();
}

function toggleWbSidebar(){
  const shell = document.getElementById('guideShell');
  const collapsed = shell.classList.toggle('sb-collapsed');
  try { localStorage.setItem(TOPIC_SIDEBAR_COLLAPSED_KEY, collapsed ? '1' : '0'); } catch(e){}
}

function openPassage(id){
  currentPassage = id;
  const p = READING_PASSAGES.find(function(x){ return x.id === id; });
  const grouped = groupedTopics();
  // keep the sidebar + breadcrumb in sync with the passage's own category
  // (matters when a passage is opened directly via a #hash deep link)
  const cat = (p.tag.split(' · ')[1]) || 'General';
  const catIdx = grouped.catNames.indexOf(cat);
  if (catIdx !== -1 && catIdx !== currentCatIdx) {
    currentCatIdx = catIdx;
    document.querySelectorAll('#catNav .guide-nav-item').forEach(function(el, i){
      el.classList.toggle('active', i === currentCatIdx);
    });
  }
  document.getElementById('readerBackBtn').textContent = '‹ ' + grouped.catNames[currentCatIdx];
  document.getElementById('passageTag').textContent = p.tag;
  document.getElementById('passageTitle').textContent = p.title;
  setPassageHero(p);
  renderLevelTabs();
  renderPassageBody();
  showReaderView();
  window.scrollTo(0,0);
  JPE_DEEPLINK.setParams({passage: id, level: currentLevel});
}

function setPassageHero(p){
  const hero = document.getElementById('passageHero');
  const img = document.getElementById('passageHeroImg');
  const label = document.getElementById('passageHeroPhLabel');
  hero.classList.remove('has-img');
  if (p && p.img) {
    label.textContent = 'HERO IMAGE PLACEHOLDER · upload as ' + p.img;
    img.alt = p.title;
    img.onload = function(){ hero.classList.add('has-img'); };
    img.onerror = function(){ hero.classList.remove('has-img'); };
    img.src = p.img;
  } else {
    label.textContent = 'HERO IMAGE PLACEHOLDER';
    img.removeAttribute('src');
  }
}

function closePassage(){
  currentPassage = null;
  renderCategoryContent();
  window.scrollTo(0,0);
  JPE_DEEPLINK.setParams({passage: null, level: null});
}

/* ---- shareable per-passage link ---- */
function getShareUrl(){
  try { if (window.top && window.top !== window) return window.top.location.href; } catch(e){}
  return location.href;
}

function sharePassageLink(btn){
  const url = getShareUrl();
  const p = READING_PASSAGES.find(function(x){ return x.id === currentPassage; });
  if (navigator.share) {
    navigator.share({title: p ? p.title : document.title, url: url}).catch(function(){});
    return;
  }
  copyShareLink(url, btn);
}

function copyShareLink(url, btn){
  const label = btn && btn.querySelector('span');
  const original = label ? label.textContent : '';
  const done = function(ok){
    if (!label) return;
    label.textContent = ok ? 'Copied!' : 'Copy failed';
    setTimeout(function(){ label.textContent = original; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(function(){ done(true); }).catch(function(){ fallbackCopyText(url, done); });
  } else {
    fallbackCopyText(url, done);
  }
}

function fallbackCopyText(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
  done(ok);
}

(function(){
  const body = document.getElementById('passageBody');
  body.addEventListener('mouseup', handleSelection);
  body.addEventListener('touchend', function(){ setTimeout(handleSelection, 0); });
  body.addEventListener('click', function(e){
    const mark = e.target.closest('mark.hl');
    if (!mark) return;
    const p = mark.closest('p[data-para]');
    const para = parseInt(p.getAttribute('data-para'), 10);
    const start = parseInt(mark.getAttribute('data-start'), 10);
    const end = parseInt(mark.getAttribute('data-end'), 10);
    removeHighlight(currentPassage, currentLevel, para, start, end);
    renderPassageBody();
  });

  document.getElementById('passageQuiz').addEventListener('click', function(e){
    const opt = e.target.closest('.quiz-opt');
    if (!opt) return;
    const q = opt.closest('.quiz-q');
    if (q.classList.contains('answered')) return;
    const correct = parseInt(q.getAttribute('data-a'), 10);
    const chosen = parseInt(opt.getAttribute('data-o'), 10);
    q.classList.add('answered');
    const opts = q.querySelectorAll('.quiz-opt');
    opts[correct].classList.add('correct');
    if (chosen !== correct) opt.classList.add('wrong');
    updateQuizScore();
  });
})();

/* ---- export the current passage + level as a shareable PNG ---- */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapPlainText(measure, text, font, maxWidth){
  measure.font = font;
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  words.forEach(function(w){
    const test = line ? line + ' ' + w : w;
    if (line && measure.measureText(test).width > maxWidth) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  return lines;
}

function wrapParaWords(measure, text, paraIndex, ranges, font, maxWidth){
  measure.font = font;
  const paraRanges = mergeRanges(ranges.filter(function(r){ return r.para === paraIndex; }));
  const words = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(text))) {
    const wStart = m.index, wEnd = m.index + m[0].length;
    const hl = paraRanges.some(function(r){ return wEnd > r.start && wStart < r.end; });
    words.push({text: m[0], hl: hl});
  }
  const spaceWidth = measure.measureText(' ').width;
  const lines = [];
  let line = [];
  let lineWidth = 0;
  words.forEach(function(w){
    const ww = measure.measureText(w.text).width;
    const extra = line.length ? spaceWidth + ww : ww;
    if (line.length && lineWidth + extra > maxWidth) {
      lines.push(line);
      line = [];
      lineWidth = 0;
    }
    line.push(w);
    lineWidth += line.length > 1 ? spaceWidth + ww : ww;
  });
  if (line.length) lines.push(line);
  return lines;
}

async function exportPNG(){
  const btn = document.getElementById('exportBtn');
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.style.opacity = '.6';

  try {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }

    const p = READING_PASSAGES.find(function(x){ return x.id === currentPassage; });
    const paras = p.levels[currentLevel].split(/\n\s*\n/).filter(Boolean);
    const ranges = getHighlights(currentPassage, currentLevel);

    const scale = 2;
    const width = 900;
    const pad = 56;
    const contentWidth = width - pad * 2;
    const bodyFontSize = 21;
    const bodyLineHeight = Math.round(bodyFontSize * 1.7);
    const paraGap = 20;
    const titleFontSize = 34;
    const tagFont = '700 14px Outfit, sans-serif';
    const titleFont = '800 ' + titleFontSize + 'px Outfit, sans-serif';
    const bodyFont = '400 ' + bodyFontSize + 'px Outfit, sans-serif';
    const footerFont = '600 14px Outfit, sans-serif';

    const measure = document.createElement('canvas').getContext('2d');
    const titleLines = wrapPlainText(measure, p.title, titleFont, contentWidth);
    const paraLineGroups = paras.map(function(para, i){
      return wrapParaWords(measure, para, i, ranges, bodyFont, contentWidth);
    });

    measure.font = tagFont;
    const tagText = p.tag.toUpperCase() + '   ' + currentLevel;
    const tagW = measure.measureText(tagText).width;

    let h = pad;
    h += 30 + 20;
    h += titleLines.length * (titleFontSize * 1.22);
    h += 28;
    paraLineGroups.forEach(function(lines){ h += lines.length * bodyLineHeight + paraGap; });
    h += 24;
    h += 30;
    h += pad;

    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(width * scale);
    canvas.height = Math.ceil(h * scale);
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, h);

    let y = pad;

    ctx.font = tagFont;
    ctx.fillStyle = '#E2E8F0';
    roundRect(ctx, pad, y, tagW + 24, 30, 8);
    ctx.fill();
    ctx.fillStyle = '#1E293B';
    ctx.textBaseline = 'middle';
    ctx.fillText(tagText, pad + 12, y + 16);
    ctx.textBaseline = 'alphabetic';
    y += 30 + 20;

    ctx.font = titleFont;
    ctx.fillStyle = '#2D3047';
    titleLines.forEach(function(line){
      y += titleFontSize;
      ctx.fillText(line, pad, y);
      y += titleFontSize * 0.22;
    });
    y += 28;

    ctx.font = bodyFont;
    paraLineGroups.forEach(function(lines){
      lines.forEach(function(line){
        y += bodyLineHeight;
        let x = pad;
        const spaceWidth = ctx.measureText(' ').width;
        line.forEach(function(w){
          const ww = ctx.measureText(w.text).width;
          if (w.hl) {
            ctx.fillStyle = '#FFE08A';
            ctx.fillRect(x - 2, y - bodyFontSize, ww + 4, bodyFontSize + 8);
          }
          ctx.fillStyle = '#2D3047';
          ctx.fillText(w.text, x, y);
          x += ww + spaceWidth;
        });
      });
      y += paraGap;
    });

    y += 4;
    ctx.strokeStyle = '#E8E5DF';
    ctx.beginPath();
    ctx.moveTo(pad, y);
    ctx.lineTo(width - pad, y);
    ctx.stroke();
    y += 30;
    ctx.font = footerFont;
    ctx.fillStyle = '#7A7D8E';
    ctx.fillText('johnplusenglish.com  ·  Reading  ·  ' + currentLevel, pad, y);

    await new Promise(function(resolve){
      canvas.toBlob(function(blob){
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = currentPassage + '-' + currentLevel + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        resolve();
      }, 'image/png');
    });
  } finally {
    btn.disabled = false;
    btn.style.opacity = '';
    btn.innerHTML = originalLabel;
  }
}

var READING_FONTS = {
  outfit: "'Outfit',sans-serif",
  georgia: "Georgia,'Times New Roman',serif",
  verdana: "Verdana,Geneva,sans-serif",
  atkinson: "'Atkinson Hyperlegible',sans-serif",
  lexend: "'Lexend',sans-serif"
};
function setReadingFont(key){
  if (!READING_FONTS[key]) key = 'outfit';
  document.documentElement.style.setProperty('--reading-font', READING_FONTS[key]);
  document.querySelectorAll('.font-opt').forEach(function(b){ b.classList.toggle('active', b.dataset.font===key); });
  try { localStorage.setItem('jpe-reading-font', key); } catch(e) {}
}
function toggleFontMenu(){
  document.getElementById('fontMenu').classList.toggle('open');
}
document.addEventListener('click', function(e){
  var sw = document.getElementById('fontSwitch');
  if (sw && !sw.contains(e.target)) document.getElementById('fontMenu').classList.remove('open');
});
(function(){
  var saved = 'outfit';
  try { saved = localStorage.getItem('jpe-reading-font') || 'outfit'; } catch(e) {}
  setReadingFont(saved);
})();
