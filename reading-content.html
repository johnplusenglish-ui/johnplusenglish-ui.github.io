<script>
(function(){
  var FONTS = {
    outfit: "'Outfit',sans-serif",
    georgia: "Georgia,'Times New Roman',serif",
    verdana: "Verdana,Geneva,sans-serif",
    atkinson: "'Atkinson Hyperlegible',sans-serif",

  var saved = 'outfit';

<style>
:root{--sky:#2176FF;--sky-light:#E8EEFF;--sea:#1DD3B0;--sea-light:#E4F8F6;--coral:#FF6B6B;--coral-light:#FFE8E8;--lavender:#9B72CF;--lavender-light:#F0E8FA;--cream:#F7F6F3;--ink:#2D3047;--muted:#7A7D8E;--border:#E8E5DF;--card:#fff;--radius:14px;--radius-sm:10px;--shadow-sm:0 1px 3px rgba(45,48,71,.06);--shadow-md:0 4px 14px rgba(45,48,71,.08);--accent:#2176FF;--accent-light:#E8EEFF}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;overflow-y:scroll}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-y:auto}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}
.topnav{position:fixed;top:0;left:0;right:0;height:52px;z-index:200;background:rgba(247,246,243,.88);backdrop-filter:blur(16px);border-bottom:1.5px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.nav-logo span{color:#2563EB}
.topnav-links{display:flex;gap:1.2rem;align-items:center}
.topnav-links a{font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s}
.topnav-links a:hover{color:var(--sky)}

.page-header{padding:2rem 2rem 1rem;max-width:960px;margin:0 auto;position:relative;z-index:1}
.topic-hero{display:flex;align-items:flex-start;gap:1.2rem}
.topic-icon{width:52px;height:52px;border-radius:12px;background:color-mix(in srgb, #2D3047 8%, #fff);color:#2D3047;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topic-icon svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor}
.page-header h1{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;letter-spacing:-.01em;font-weight:900}

.wrap{max-width:960px;margin:0 auto;padding:0 2rem 4rem;position:relative;z-index:1}

/* ── Tabs (page-level: B1 / B2 / C1 / C2) ── */
.tabs-wrap{max-width:960px;margin:0 auto;padding:0 2rem;position:relative;z-index:1}
.tabs{display:flex;gap:4px;row-gap:4px;border-bottom:none;position:relative;margin-bottom:1.5rem;align-items:flex-end;flex-wrap:wrap;padding-top:8px}
.tabs::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.tab{position:relative;font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:700;padding:.5rem 1.25rem;color:var(--muted);cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1.5px solid var(--border);border-radius:12px 12px 0 0;transition:background .18s,color .18s,box-shadow .18s,border-color .18s}
.tab:not(.active):hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.tab:not(.active):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab.active{outline:none;background:var(--cream);border-color:var(--tab-accent,var(--accent));border-bottom:none!important;color:var(--tab-accent,var(--accent));padding-top:calc(.5rem + 3px);box-shadow:0 -3px 10px rgba(45,48,71,.06);z-index:2}

/* ── Guide-style shell: categories sidebar + content pane ── */
.guide-shell{display:grid;grid-template-columns:250px 1fr;gap:1.2rem;align-items:start}
.guide-shell.sb-collapsed{grid-template-columns:48px 1fr}
.wb-sb{background:var(--card);border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;position:sticky;top:80px;max-height:calc(100vh - 100px)}
.wb-sb-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.wb-sb-head>span{font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wb-sb-head .sb-chev{width:26px;height:26px;border:1.5px solid var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1rem;line-height:1;flex-shrink:0;transition:transform .2s}
.wb-sb-head .sb-chev svg{width:13px;height:13px}
.wb-sb-head:hover .sb-chev{color:var(--ink);border-color:var(--muted)}
.wb-sb-scroll{flex:1;min-height:0;overflow-y:auto;padding:.4rem}
.wb-sb-foot{padding:.55rem .9rem;border-top:1px solid var(--border);font-size:.66rem;color:var(--muted)}
.wb-sb-foot b{color:var(--ink)}
.guide-shell.sb-collapsed .wb-sb-scroll,.guide-shell.sb-collapsed .wb-sb-foot,.guide-shell.sb-collapsed .wb-sb-head>span{display:none}
.guide-shell.sb-collapsed .wb-sb-head{justify-content:center;padding:.7rem .4rem}
.guide-shell.sb-collapsed .sb-chev{transform:rotate(180deg)}

.guide-nav-item{display:flex;align-items:center;gap:.6rem;padding:.65rem .75rem;border-radius:10px;cursor:pointer;font-family:'Outfit',sans-serif;color:var(--muted);border:1.5px solid transparent;background:none;transition:all .15s;text-align:left;width:100%;font-size:.84rem;font-weight:700;line-height:1.3}
.guide-nav-item:hover{color:var(--ink);background:var(--cream)}
.guide-nav-item.active{color:var(--ink);border-color:var(--accent);background:var(--accent-light)}
.guide-nav-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.guide-nav-item.active .guide-nav-dot{background:var(--accent)}
.guide-nav-count{margin-left:auto;font-weight:600;color:var(--muted);background:var(--cream);border-radius:20px;padding:.1rem .55rem;font-size:.66rem;flex-shrink:0}
.guide-nav-item.active .guide-nav-count{background:var(--card);color:var(--accent)}

@media(max-width:820px){.guide-shell{grid-template-columns:1fr}.wb-sb{position:static;max-height:none}}

/* ── content pane ── */
.wb-pane{background:var(--card);border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;min-width:0}
.wb-pane-head{padding:1rem 1.25rem .8rem;border-bottom:1.5px solid var(--border)}
.wb-pane-head h2{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.wb-pane-head p{margin:.35rem 0 0;font-size:.85rem;color:var(--muted);line-height:1.5}
.wb-pane-body{padding:1.1rem 1.25rem 1.4rem}
.guide-quicknav-back{font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;padding:.35rem .8rem;border-radius:999px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:.7rem;display:inline-block}
.guide-quicknav-back:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.passage-tag{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-light);display:inline-block;padding:.25rem .7rem;border-radius:6px;margin:0 0 .6rem .5rem}
h2.wb-pane-head-title{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,3.4vw,2.4rem);font-weight:900;letter-spacing:-.02em;line-height:1.08;margin:.4rem 0 0}
.reader-toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.reader-toolbar .hl-hint{margin:0}

.topic-group-list{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden}
.topic-row{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;padding:.8rem 1.1rem;border:none;background:none;cursor:pointer;font-family:'Outfit',sans-serif;border-bottom:1px solid var(--border);transition:background .12s}
.topic-row:last-child{border-bottom:none}
.topic-row:hover{background:var(--cream)}
.topic-row-region{flex-shrink:0;width:96px;font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;line-height:1.25}
.topic-row-title{flex:1;font-size:.94rem;font-weight:700;color:var(--ink);line-height:1.35}
.topic-row-arr{color:var(--muted);font-size:1rem;flex-shrink:0}
.topic-row:hover .topic-row-arr{color:var(--accent)}

.level-actions{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
.icon-btn{display:inline-flex;align-items:center;gap:.45rem;font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:600;padding:.5rem .95rem;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm)}
.icon-btn:hover{border-color:var(--ink);background:var(--ink);color:var(--cream)}
.icon-btn svg{width:14px;height:14px}
@media print{.icon-btn,.topnav,.page-header,.tabs-wrap,.wb-sb,.guide-quicknav-back{display:none!important}}

.passage-body{font-size:1.02rem;line-height:1.85;-webkit-user-select:text;user-select:text;font-family:var(--reading-font,inherit)}

.font-switch{position:relative;display:inline-flex}
.font-switch-menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--card);border:1.5px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);padding:.4rem;display:none;flex-direction:column;gap:.1rem;min-width:210px;z-index:20}
.font-switch-menu.open{display:flex}
.font-opt{font-size:.87rem;text-align:left;padding:.55rem .65rem;border:none;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:.6rem;font-family:'Outfit',sans-serif}
.font-opt:hover{background:var(--cream)}
.font-opt.active{background:var(--accent-light);color:var(--accent);font-weight:700}
.font-opt-check{opacity:0;font-size:.8rem}
.font-opt.active .font-opt-check{opacity:1}
.font-opt-label{font-family:var(--opt-font,inherit);font-size:.95rem}
.passage-body p{margin-bottom:1.1rem}
.passage-body p:last-child{margin-bottom:0}
.passage-body mark.hl{background:#FFE08A;color:inherit;padding:.05em 0;border-radius:2px;cursor:pointer;transition:background .15s;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.passage-body mark.hl:hover{background:#FFD35C}
.hl-hint{font-size:.75rem;color:var(--muted);margin:0 0 1.1rem;font-style:italic}
.passage-hero{position:relative;display:block;margin:0 0 1.3rem;border-radius:12px;overflow:hidden;border:1.5px solid var(--border);background:var(--accent-light);aspect-ratio:16/7}
.passage-hero img{display:none;width:100%;height:100%;object-fit:cover}
.passage-hero.has-img img{display:block}
.passage-hero.has-img .passage-hero-ph{display:none}
.passage-hero-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;color:var(--accent);background:repeating-linear-gradient(135deg,transparent,transparent 14px,rgba(33,118,255,.05) 14px,rgba(33,118,255,.05) 28px)}
.passage-hero-ph svg{width:42px;height:42px;stroke-width:1.6;opacity:.85}
.passage-hero-ph span{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
/* ── comprehension quiz ── */
.quiz{margin-top:2rem;padding-top:1.6rem;border-top:1.5px solid var(--border)}
.quiz:empty{display:none}
.quiz-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.quiz-head h3{font-family:'Outfit',sans-serif;font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.quiz-head .quiz-lvl{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.quiz-score{font-size:.82rem;font-weight:700;color:var(--muted)}
.quiz-score b{color:var(--accent)}
.quiz-q{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:1.1rem 1.2rem;margin-bottom:.9rem}
.quiz-q:last-child{margin-bottom:0}
.quiz-q-text{display:flex;gap:.7rem;font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;line-height:1.4;margin-bottom:.85rem;color:var(--ink)}
.quiz-q-num{flex-shrink:0;width:24px;height:24px;border-radius:7px;background:var(--accent-light);color:var(--accent);font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:.05rem}
.quiz-opts{display:flex;flex-direction:column;gap:.5rem}
.quiz-opt{display:flex;align-items:flex-start;gap:.7rem;width:100%;text-align:left;font-family:'Outfit',sans-serif;font-size:.92rem;font-weight:600;line-height:1.4;color:var(--ink);background:var(--cream);border:1.5px solid var(--border);border-radius:10px;padding:.65rem .85rem;cursor:pointer;transition:border-color .15s,background .15s}
.quiz-opt:hover{border-color:var(--accent);background:var(--accent-light)}
.quiz-opt-mark{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.6px solid var(--border);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--card);margin-top:.02rem}
.quiz-q.answered .quiz-opt{cursor:default}
.quiz-q.answered .quiz-opt:hover{border-color:var(--border);background:var(--cream)}
.quiz-exp{display:none;margin-top:.9rem;padding:.7rem .85rem;background:var(--accent-light);border:1px solid var(--border);border-radius:10px;font-size:.9rem;line-height:1.55;color:var(--ink)}
.quiz-exp b{color:var(--accent);font-weight:800}
.quiz-q.answered .quiz-exp{display:block}
.quiz-opt.correct{border-color:#1DBE7A;background:#E3F9EF}
.quiz-opt.correct .quiz-opt-mark{border-color:#1DBE7A;background:#1DBE7A;color:#fff}
.quiz-opt.correct:hover{border-color:#1DBE7A;background:#E3F9EF}
.quiz-opt.wrong{border-color:#E5484D;background:#FDE9E9}
.quiz-opt.wrong .quiz-opt-mark{border-color:#E5484D;background:#E5484D;color:#fff}
.quiz-opt.wrong:hover{border-color:#E5484D;background:#FDE9E9}
@media print{.quiz{display:none}}

@media print{.hl-hint{display:none}.wb-pane{box-shadow:none;border:none}.wb-pane-body{padding:0}.passage-hero{break-inside:avoid}}

@media(max-width:600px){.wrap{padding:0 1.2rem 3rem}.page-header{padding:1.6rem 1.2rem 1rem}.tabs-wrap{padding:0 1.2rem}.topic-row{flex-wrap:wrap}.topic-row-region{width:100%;order:1}.topic-row-title{order:2;width:100%}.topic-row-arr{display:none}.level-actions{flex-wrap:wrap;flex-shrink:1;width:100%}}
</style>
<style>.topnav{display:none!important}</style></head>

const READING_PASSAGES = [
{id:"wow-signal",title:"The Wow! Signal: SETI's Unexplained Mystery",tag:"United States · Science",img:"images/reading/wow-signal.jpg",quiz:{"B1":[{"q":"In which US state was the Big Ear telescope located?","o":["Ohio","California","Texas","New York"],"a":0,"x":"Big Ear sat at Ohio State University, so it's in Ohio. The other states are just there to tempt you."},{"q":"What did Jerry Ehman write next to the signal?","o":["Alien","Wow!","Strong","Help"],"a":1,"x":"Ehman circled the odd sequence in red pen and scribbled one word in the margin, 'Wow!', and the name stuck."},{"q":"How long did the signal last?","o":["30 seconds","72 seconds","15 minutes","several hours"],"a":1,"x":"It lasted exactly 72 seconds, the time Big Ear's antenna needed to sweep past a fixed point in the sky."}],"B2":[{"q":"Why did astronomers consider the frequency near 1,420 MHz a likely choice for an alien civilisation?","o":["It is the loudest frequency in space","Hydrogen is the most common element and the frequency is unusually quiet","It is the only frequency Big Ear could detect","Comets naturally broadcast on it"],"a":1,"x":"Hydrogen is the most common element around, and this 'hydrogen line' is unusually quiet, so scientists reckoned aliens might pick it."},{"q":"Why did the 72-second duration suggest the source was in space rather than local interference?","o":["It matched how long a fixed point in the sky takes to cross Big Ear's antenna as Earth rotates","72 seconds is too short for any Earth signal","Satellites cannot transmit for that long","The signal faded exactly at midnight"],"a":0,"x":"72 seconds is precisely how long a fixed point takes to cross Big Ear's antenna as Earth turns, which points skyward, not to local noise."},{"q":"What is the passage's overall conclusion about the Wow! signal?","o":["It has been proven to come from aliens","It is neither proof of alien life nor conclusively ruled out","Scientists agree it was satellite interference","It was caused by a comet"],"a":1,"x":"The verdict is careful: 'not proof of extraterrestrial life, but not conclusively ruled out either'. Neither door is shut."}],"C1":[{"q":"According to the passage, what has kept the signal from being dismissed as just another unexplained blip?","o":["A second detection years later","The convergence of several suggestive details","Its detection by the Very Large Array","A government investigation"],"a":1,"x":"Notice it's the pile-up of several suggestive details together, not any single feature, that keeps interest alive."},{"q":"What was the 2016 hypothesis, and why was it rejected?","o":["Satellite interference; satellites were not overhead","Hydrogen clouds around passing comets; it could not account for the signal's frequency and duration","A military radar test; the records were missing","A software error; the printout was reprinted"],"a":1,"x":"The 2016 idea blamed hydrogen clouds around passing comets, but it couldn't account for the signal's exact frequency and duration."},{"q":"The passage says the signal's lasting interest rests on which combination?","o":["Its brightness and its colour","A suggestive signature and stubborn irreproducibility","Its frequency and its cost","Ehman's fame and his red pen"],"a":1,"x":"It's a suggestive signature paired with the awkward fact that, despite decades of searching, it has never happened again."}],"C2":[{"q":"By writing that something 'the word is chosen advisedly' briefly lit up the receivers, the author signals that he is...","o":["certain the source was intelligent life","deliberately avoiding any claim about what the source actually was","mocking Ehman's choice of words","quoting an official SETI report"],"a":1,"x":"By calling it merely 'something' and flagging the word, the author is deliberately refusing to claim what the source actually was."},{"q":"In the C2 text, what role does the signal appearing on only one of the two receiving channels play?","o":["It proved the signal was terrestrial","It ruled out, or at least complicated, several mundane explanations","It doubled the signal's measured strength","It explained why the signal never repeated"],"a":1,"x":"Turning up on just one of the two channels helped rule out, or at least complicate, several more ordinary explanations."},{"q":"What is the author's main point in the closing paragraph?","o":["The signal's fame comes from what it proves about aliens","The signal's fame rests on its stubborn refusal to be resolved either way","New telescopes have finally explained the signal","SETI has abandoned the hydrogen line theory"],"a":1,"x":"The fame rests on one stubborn fact: the signal simply won't be pinned down as either alien or mundane."}]},levels:{B1:"On 15 August 1977, a radio telescope in Ohio, USA, picked up a strange, very strong radio signal from space. The telescope was called Big Ear, and it belonged to Ohio State University. Scientists were using it for SETI, a project that searches for radio messages from intelligent life on other planets. Nobody looked at the data straight away. A few days later, an astronomer named Jerry Ehman was checking the printout, page by page. When he saw this one signal, he was so surprised that he circled it in red pen and wrote one word next to it: 'Wow!' That is why people now call it the Wow! signal. The signal was strong, about 30 times stronger than the normal background noise from space. It lasted for 72 seconds, which matched exactly how long Big Ear's fixed telescope would 'see' a distant object as the Earth turned. It came from the direction of the constellation Sagittarius. Scientists have searched for the same signal again many times, using the Big Ear telescope and other telescopes. Nobody has ever found it a second time. Because it never repeated, and because no natural explanation fully fits, the Wow! signal is still, after nearly 50 years, one of the biggest mysteries in the search for alien life.",
B2:"On the night of 15 August 1977, the Big Ear radio telescope at Ohio State University recorded a radio signal so unusual that it would go on to become the most famous unexplained event in the history of the search for extraterrestrial intelligence, or SETI. Big Ear was scanning the sky automatically, and nobody noticed anything at the time; it was only a few days later, while reviewing a thick stack of computer printouts, that astronomer Jerry Ehman spotted a startling sequence of numbers and letters representing a signal roughly 30 times stronger than the background noise of space. Ehman circled it in red pen and wrote a single word in the margin: 'Wow!', a name that stuck. Several features of the signal made it so intriguing. It arrived on a frequency close to 1,420 megahertz, the 'hydrogen line', a frequency astronomers had long predicted an alien civilisation might use, since hydrogen is the most common element in the universe and this particular frequency is unusually quiet. It also lasted exactly 72 seconds, precisely the length of time Big Ear's fixed antenna would have taken to sweep across a genuinely fixed point in the sky as the Earth rotated beneath it, strong evidence that the source was celestial rather than local interference. The signal appeared to come from the direction of the constellation Sagittarius. Despite decades of follow-up searches, including repeated attempts using Big Ear itself and, more recently, far more powerful instruments, the signal has never been detected again. Various explanations have been proposed over the years, from passing comets to satellite interference, but none has been widely accepted by the scientific community. As a result, nearly fifty years on, the Wow! signal remains stubbornly unexplained: not proof of extraterrestrial life, but not conclusively ruled out either.",
C1:"Shortly after midnight on 15 August 1977, the Big Ear radio telescope at Ohio State University's Perkins Observatory registered a narrowband radio signal so anomalous that it remains, nearly half a century later, the single most tantalising data point in the search for extraterrestrial intelligence. Big Ear operated largely unattended, scanning the sky as the Earth's rotation carried its fixed antenna across successive strips of sky; consequently, the signal went unnoticed until several days afterwards, when the astronomer Jerry Ehman, reviewing a stack of computer printouts by hand, encountered a sequence of alphanumeric characters denoting a signal roughly thirty times stronger than the ambient noise floor. Startled, he circled the sequence in red ink and wrote, in the margin, a single exclamation that has since become inseparable from the event itself: 'Wow!' What has sustained scientific interest in the signal, as opposed to consigning it to the large catalogue of unexplained astronomical blips, is the convergence of several suggestive details. The signal arrived at a frequency of approximately 1,420 MHz, the so-called hydrogen line, a frequency long favoured in SETI theory precisely because it is both a 'quiet' region of the radio spectrum, relatively free of natural interference, and one tied to the most abundant element in the universe, making it, at least arguably, a plausible rendezvous frequency for any civilisation attempting to signal across interstellar distances. Equally suggestive was its duration: the signal rose and fell over almost exactly 72 seconds, matching to a striking degree the interval a genuinely fixed celestial source ought to take to cross Big Ear's stationary beam as the planet rotated, evidence, cited repeatedly by researchers, against a terrestrial or near-Earth origin. What the Wow! signal has never yielded, despite extensive effort, is repetition. Ehman and others conducted follow-up observations with Big Ear itself in the years afterward; later researchers have trained far more sensitive instruments, including the Very Large Array and the Allen Telescope Array, on the same coordinates near the constellation Sagittarius. None has found so much as a trace. Various terrestrial explanations have been floated over the decades, among them a 2016 hypothesis attributing the signal to hydrogen clouds surrounding passing comets, but each has, on scrutiny, failed to withstand independent testing, not least because none can adequately account for the signal's precise frequency and duration. It is this combination of suggestive signature and stubborn irreproducibility that keeps the Wow! signal in circulation: neither confirmed evidence of anything, nor quite dismissible as noise.",
C2:"Just after midnight on 15 August 1977, somewhere in the vicinity of the constellation Sagittarius, something, the word is chosen advisedly, briefly lit up the receivers of the Big Ear radio telescope at Ohio State University, and then, as abruptly as it had appeared, vanished for good. Big Ear, an unglamorous fixed antenna that swept the sky passively as the Earth turned beneath it, was part of the university's contribution to the search for extraterrestrial intelligence, or SETI, and it recorded its findings not in real time but onto reams of continuous-feed printout, to be reviewed later at leisure. It was several days on, while working through precisely this backlog, that the astronomer Jerry Ehman came across a run of alphanumeric characters, 6EQUJ5, in the telescope's idiosyncratic intensity-coding scheme, denoting a signal roughly thirty times more intense than the background hiss of the cosmos. He circled it in red pen and, with an economy that history has rewarded rather more than most scientific commentary, wrote a single word beside it: 'Wow!' The signal's charm, if one can call it that, lies less in any single feature than in the way several improbable details line up. It arrived at a frequency near 1,420 megahertz, the hydrogen line, long favoured in SETI circles on the reasoning that hydrogen, being the universe's most abundant element, and this particular frequency, being unusually free of natural clutter, would make a sensible meeting point for any civilisation hoping to be overheard. It lasted almost precisely 72 seconds, which is not an arbitrary figure: it corresponds almost exactly to the interval a genuinely fixed point in the sky ought to spend crossing Big Ear's stationary beam as the planet rotated beneath it, a signature that argues, about as persuasively as such things can, for a celestial rather than terrestrial origin. And it appeared on only one of the telescope's two receiving channels, ruling out, or at least complicating, a number of the more mundane explanations that might otherwise present themselves. What it has never done, in the intervening decades, is happen again. Ehman himself searched for a repeat using Big Ear in the years that followed; subsequent researchers have pointed considerably more sensitive instruments, from the Very Large Array to the Allen Telescope Array, at the same patch of sky, and each has come away empty-handed. A parade of terrestrial explanations has been proposed and, in due course, dismantled: a 2016 hypothesis blaming hydrogen clouds around a pair of passing comets drew considerable press attention before failing, rather comprehensively, to survive scrutiny of the comets' actual radio emissions. It says something about the peculiar epistemics of SETI that the Wow! signal's enduring fame rests not on what it proves but on what it stubbornly refuses to resolve: a single, powerful, structurally plausible burst of radio energy that behaves exactly as theory says an interstellar hello might, and that has never, in forty-nine years of listening, been polite enough to say it twice."}},
{id:"theranos-elizabeth-holmes",title:"The Rise and Fall of Theranos",tag:"United States · Business",img:"images/reading/theranos-elizabeth-holmes.jpg",quiz:{"B1":[{"q":"How old was Elizabeth Holmes when she started Theranos?","o":["19","25","30","16"],"a":0,"x":"She was a 19-year-old Stanford dropout when she founded Theranos."},{"q":"What was the name of Theranos's blood-testing machine?","o":["Edison","Stanford","Newton","Sunny"],"a":0,"x":"The compact blood-testing device was called the Edison."},{"q":"Which newspaper's journalist, John Carreyrou, investigated Theranos?","o":["The New York Times","The Wall Street Journal","The Washington Post","The Guardian"],"a":1,"x":"John Carreyrou dug into the company as a reporter for the Wall Street Journal."}],"B2":[{"q":"How did Theranos actually process most blood samples?","o":["On its own Edison devices, exactly as advertised","Secretly on modified commercial machines from other manufacturers","By sending them to a hospital abroad","By hand in a Stanford laboratory"],"a":1,"x":"Behind closed doors most samples were quietly run on modified, shop-bought machines, not the Edison at all."},{"q":"What was the outcome of Holmes's January 2022 trial?","o":["Convicted of defrauding investors but acquitted of defrauding patients","Fully acquitted on all counts","Convicted only of defrauding patients","The trial ended with no verdict at all"],"a":0,"x":"The jury convicted her of defrauding investors but acquitted her of defrauding patients. Watch that split closely."},{"q":"Why was Tyler Shultz important to Carreyrou's reporting?","o":["He had invented the Edison machine","He was a former lab worker alarmed at inaccurate results sent to patients","He was Holmes's defence lawyer","He personally funded the investigation"],"a":1,"x":"A former lab worker, he grew alarmed at inaccurate results reaching real patients and tipped off Carreyrou."}],"C1":[{"q":"According to the passage, what set Theranos apart from an ordinary failed startup?","o":["Its technology was simply ahead of its time","The company appears to have known the technology failed and concealed it systematically","It never managed to attract any investors","It only ever tested employees, never patients"],"a":1,"x":"It wasn't just that the technology failed. The company appears to have known and hidden it, systematically."},{"q":"What was Tyler Shultz's connection to the Theranos board?","o":["He was the grandson of board member George Shultz","He was Holmes's business partner","He personally chaired the board","He had no connection to the board"],"a":0,"x":"Tyler was the grandson of board member George Shultz, which made his decision to speak out all the harder."},{"q":"How did the legal outcomes for Holmes and Balwani differ?","o":["Both were fully acquitted","Holmes was convicted on four of eleven counts, while Balwani was convicted on all twelve against him","Balwani was acquitted while Holmes was convicted","Holmes received the longer sentence of the two"],"a":1,"x":"Holmes was convicted on four of eleven counts, whereas Balwani went down on every charge against him."}],"C2":[{"q":"What legal distinction does the author say the jury's verdict drew?","o":["Between fraud and mere exaggeration","Between lying to wealthy funders and lying to ordinary patients whose diagnoses depended on it","Between Holmes's guilt and Balwani's guilt","Between criminal and civil liability"],"a":1,"x":"The verdict separated lying to wealthy investors from lying to ordinary patients whose diagnoses hung on the results."},{"q":"The opening image of a company that 'ended up ... sticking rather a lot of people' with needles is used to...","o":["praise Theranos's genuine medical breakthrough","ironically highlight how the venture betrayed its founding promise","explain how the finger-prick technology worked","describe the courtroom process"],"a":1,"x":"A firm that promised to end needles 'stuck' people instead. That irony underlines how badly it betrayed its founding promise."},{"q":"What 'uncomfortable question' does the author say the episode leaves unresolved?","o":["Whether the Edison could ever have been made to work","How so many sophisticated people failed to ask an obvious question for so long","Whether Holmes really modelled herself on Steve Jobs","How much the company was truly worth"],"a":1,"x":"The nagging question is how so many clever people went so long without asking one obvious question."}]},levels:{B1:"Elizabeth Holmes started a company called Theranos in 2003, when she was only 19 years old. She left Stanford University to build it. Her big idea was exciting: a small machine that could test your blood for many diseases using just a few drops from your finger, instead of a full needle in your arm. Theranos said this would make blood tests faster, cheaper, and easier for everyone. For years, investors believed her. By 2014, Theranos was worth about 9 billion dollars, and Holmes became famous as a young, successful businesswoman. But the machine, called the Edison, did not really work. It could not do most of the tests Theranos promised. Behind the scenes, the company was secretly using other companies' machines for many tests, not its own technology. A journalist named John Carreyrou, who worked for The Wall Street Journal, began investigating in 2015. He spoke to former Theranos employees, including a young man named Tyler Shultz, who was worried about the false results. Carreyrou's reports showed that Theranos had been lying for years. The company closed in 2018. In 2022, a court found Holmes guilty of fraud, meaning she had lied to investors to get their money. In November 2022, a judge sentenced her to more than 11 years in prison. She began serving her sentence in 2023.",
B2:"In 2003, a 19-year-old Stanford dropout named Elizabeth Holmes founded a healthcare startup called Theranos, built around a single audacious promise: a compact device, which she called the Edison, that could run hundreds of medical tests from just a few drops of blood taken from a finger prick, rather than the multiple vials normally drawn from a vein. The idea captivated investors, board members and the media alike. By 2014, Theranos was valued at roughly 9 billion dollars, and Holmes, often photographed in a black turtleneck reminiscent of Steve Jobs, was celebrated as Silicon Valley's youngest self-made female billionaire. The problem was that the technology never actually worked as claimed. In reality, Theranos's Edison machines could reliably perform only a small fraction of the tests the company advertised; behind closed doors, most samples were secretly run on modified, commercially available machines bought from other manufacturers, while patients and regulators were told the results came from Theranos's own breakthrough device. The company's unravelling began in earnest in 2015, when Wall Street Journal reporter John Carreyrou started investigating, drawing on tips from former employees, including Tyler Shultz, a young lab worker who had grown increasingly alarmed at inaccurate results being sent to real patients. Carreyrou's reporting, later expanded into the bestselling book Bad Blood, exposed a pattern of falsified data, intimidated whistleblowers and a company culture built on secrecy. Theranos dissolved in September 2018, and both Holmes and her former partner Ramesh 'Sunny' Balwani were criminally charged with fraud. In January 2022, a jury convicted Holmes on four counts of defrauding investors, though it acquitted her of separately defrauding patients. She was sentenced in November 2022 to just over 11 years in federal prison and began serving her sentence in mid-2023, while Balwani received an even longer sentence after being convicted on all charges against him.",
C1:"Elizabeth Holmes dropped out of Stanford in 2003, aged nineteen, to found Theranos, a company built around a proposition that was, in retrospect, almost too elegant to be true: a proprietary device, marketed as the Edison, that could purportedly run an entire panel of diagnostic tests from a few drops of blood drawn with a simple finger prick, eliminating the need for the multiple venous vials conventional testing required. The pitch proved seductive to investors, board members and journalists alike; by 2014, Theranos was valued at approximately 9 billion dollars, and Holmes, deliberately styled, down to the black turtlenecks, in the image of Steve Jobs, was celebrated as the youngest self-made female billionaire in the country. What distinguished Theranos from an ordinary failed startup was not merely that the technology underperformed, but that the company appears to have known this and concealed it systematically. The Edison devices could, in practice, reliably perform only a limited subset of tests; for the majority of the panel, Theranos secretly ran samples on modified, commercially purchased analysers from established manufacturers, all while presenting the results to patients, doctors and regulators as products of its own breakthrough technology, a substitution that, given the tests concerned real patients' diagnoses, arguably crossed from corporate exaggeration into something closer to medical fraud. The company's unravelling is inseparable from the reporting of John Carreyrou, a Wall Street Journal investigative journalist who, beginning in 2015, pieced together an account of falsified data and internal dissent from a network of sources, not least Tyler Shultz, a young Theranos lab associate and grandson of Theranos board member George Shultz, who had raised internal concerns about inaccurate patient results and was, by his own account, threatened with legal action for doing so. Carreyrou's articles, subsequently expanded into the book Bad Blood (2018), catalogued a corporate culture in which dissent was suppressed, non-disclosure agreements were used aggressively, and regulators were reportedly misled about the extent of Edison's actual capabilities. Theranos formally dissolved in September 2018. Federal prosecutors charged both Holmes and her former business and romantic partner, Ramesh 'Sunny' Balwani, with wire fraud and conspiracy. Following a lengthy trial, a jury convicted Holmes in January 2022 on four of eleven counts, specifically those relating to defrauding investors, while acquitting her on charges concerning patients, and deadlocking on the remainder. She was sentenced that November to just over eleven years in federal prison, a term she began serving in 2023; Balwani, tried separately, was convicted on all twelve counts against him and received a still longer sentence.",
C2:"It is one of Silicon Valley's more instructive parables that a company built on the premise of eliminating needles ended up, metaphorically speaking, sticking rather a lot of people with them. Elizabeth Holmes founded Theranos in 2003, having dropped out of Stanford at nineteen, around a proposition of almost seductive simplicity: a proprietary device, christened, with a knowing nod to American inventive mythology, the Edison, that would run an entire battery of diagnostic tests from a few drops of blood drawn by finger prick, sparing patients the multiple venous vials conventional phlebotomy demands. Investors, board members drawn from the upper ranks of American statecraft, and a credulous business press all found the pitch irresistible; by 2014, Theranos carried a valuation of roughly 9 billion dollars, and Holmes, cultivating a persona (the black turtleneck, the affectedly lowered vocal register) unmistakably modelled on Steve Jobs, was anointed the youngest self-made female billionaire in the country. What separates Theranos from the ordinary Silicon Valley faceplant, however, is not that the technology simply failed to materialise, which happens to ambitious startups often enough to be almost unremarkable, but that the company appears to have understood this rather early and elected to conceal it, systematically and for years. The Edison could, in fact, perform only a modest subset of the tests Theranos advertised with any reliability; for the remainder, samples were quietly run on modified, off-the-shelf analysers purchased from established diagnostics firms, their results then presented to doctors, regulators and, this is the detail that transforms the episode from cautionary tale into indictment, actual patients making actual medical decisions, as though they had issued from Theranos's own breakthrough machine. The edifice began to crack, appropriately enough, under the weight of old-fashioned shoe-leather journalism. Starting in 2015, John Carreyrou of the Wall Street Journal assembled, source by source, an account of falsified quality-control data and suppressed internal dissent, drawing not least on Tyler Shultz, a junior lab employee, and, awkwardly, the grandson of Theranos board member and former Secretary of State George Shultz, who had flagged inaccurate patient results internally and found himself, for his trouble, threatened with litigation. Carreyrou's reporting, subsequently expanded into Bad Blood (2018), remains a small masterclass in how a culture of aggressive non-disclosure agreements, hero-worship of a charismatic founder and outright intimidation of whistleblowers can keep a fraud airborne for the better part of a decade. Theranos dissolved in September 2018, its assets essentially worthless. Federal prosecutors indicted both Holmes and her former partner Ramesh 'Sunny' Balwani on charges of wire fraud and conspiracy; a jury convicted Holmes in January 2022 on four counts relating specifically to defrauding investors, while acquitting her of separately defrauding patients and deadlocking on several remaining counts, a verdict that, tellingly, drew a legal distinction between lying to the wealthy people who funded the company and lying to the ordinary people whose diagnoses depended on it. Sentenced that November to just over eleven years, Holmes surrendered to federal prison in mid-2023; Balwani, tried separately and convicted on all twelve counts against him, received a sentence longer still, a coda that leaves the more uncomfortable question, of how so many sophisticated people failed to ask an obvious question for so long, conspicuously unresolved."}},
{id:"great-emu-war",title:"The Great Emu War of 1932",tag:"Australia · History",img:"images/reading/great-emu-war.jpg",quiz:{"B1":[{"q":"In which country did the Emu War take place?","o":["New Zealand","Australia","South Africa","Canada"],"a":1,"x":"The campaign unfolded in Western Australia."},{"q":"About how many emus moved into the farmland?","o":["1,000","5,000","20,000","100,000"],"a":2,"x":"Roughly 20,000 emus migrated inland and set about wrecking the wheat crops."},{"q":"How fast can emus run, according to the text?","o":["up to 20 km/h","up to 50 km/h","up to 80 km/h","up to 100 km/h"],"a":1,"x":"Emus can hit speeds of up to 50 kilometres per hour. Fast birds indeed."}],"B2":[{"q":"Why had the government settled soldiers on the wheat-belt farmland in the first place?","o":["As part of a soldier-settlement scheme after the First World War","To defend the coast from invasion","To hunt and study the local emus","As punishment for desertion"],"a":0,"x":"After the First World War, returning soldiers were placed on wheat-belt farmland under a soldier-settlement scheme."},{"q":"Why did the emus prove such difficult targets?","o":["They hid underground during the day","They ran fast and scattered into small groups instead of staying together","They attacked the soldiers directly","They only appeared at night"],"a":1,"x":"They ran fast and scattered into small groups instead of bunching up, so they kept slipping the gunfire."},{"q":"How does the passage say later emu control was actually handled?","o":["By a much larger army deployment","By farmers using bounty schemes rather than the army","By fencing off the entire wheat belt","By relocating the emus elsewhere"],"a":1,"x":"Later culling fell to farmers using bounty schemes, not the army."}],"C1":[{"q":"Who authorised the deployment of troops for the operation?","o":["Major G. P. W. Meredith","Defence Minister Sir George Pearce","The farmers themselves","The state governor"],"a":1,"x":"The Minister of Defence, Sir George Pearce, signed off on sending in the troops."},{"q":"Which branch of the military carried out the campaign?","o":["The Royal Australian Navy","The Royal Australian Artillery","The Royal Australian Air Force","A volunteer farmers' militia"],"a":1,"x":"Soldiers of the Royal Australian Artillery carried out the campaign."},{"q":"According to the passage, what larger question does the episode raise beyond mere farce?","o":["Whether emus should become a protected species","Whether military solutions suit ecological problems","Whether the soldiers had been properly trained","Whether the Depression alone caused the migration"],"a":1,"x":"Beyond the farce, it asks whether military solutions really fit ecological problems at all."}],"C2":[{"q":"What does the author suggest by noting the arsenal 'looked considerably more suited to repelling an invading army than a flock of ... birds'?","o":["The soldiers were badly under-equipped","The response was absurdly disproportionate to the actual problem","The emus posed a genuine military threat","Still more ammunition was really needed"],"a":1,"x":"An arsenal built for war rather than a bird cull drives home just how absurdly out of proportion the response was."},{"q":"How does the final paragraph say the emu problem was eventually managed, and what does this imply?","o":["A second military campaign that finally succeeded","Bounty schemes run by farmers, implying an army was never needed","Poisoning the region's water supply","Simply abandoning the farms altogether"],"a":1,"x":"Farmers' bounty schemes sorted it out in the end, which quietly implies the army had never really been needed."},{"q":"The phrase 'asymmetric warfare running the wrong way' is used to convey that...","o":["the emus were technically better armed than the troops","the weaker-seeming side, the birds, effectively prevailed over superior firepower","the soldiers ended up fighting among themselves","the whole war was fought at night"],"a":1,"x":"It means the weaker side, the birds, effectively saw off the soldiers' far superior firepower."}]},levels:{B1:"In 1932, Australia had a strange military operation. People later called it 'the Emu War'. It happened in Western Australia, in an area called Campion. After World War One, the government gave land to soldiers so they could become farmers. But farming was hard, especially after the Great Depression, when prices for crops fell. Then a new problem arrived: about 20,000 emus, which are large flightless birds, moved into the farmland to find food and water. The emus ate and destroyed wheat crops. The farmers, many of them ex-soldiers, asked the government for help. The government sent real soldiers, led by Major G.P.W. Meredith, with two machine guns and 10,000 bullets. The plan was to kill the emus and protect the crops. But the plan failed badly. Emus can run very fast, up to 50 kilometres per hour, and they moved in small, scattered groups instead of one big group. The machine guns often jammed, and the birds were surprisingly hard to kill. After about six weeks, from November to December 1932, soldiers had killed fewer than 1,000 emus, using thousands of bullets. Today, people remember the Emu War as a funny example of humans losing to nature, an event where, as the joke goes, 'the emus won'.",
B2:"In late 1932, the Australian military carried out one of the more farcical operations in its history: a deliberate campaign against emus in Western Australia, later nicknamed 'the Emu War'. The roots of the conflict lay in the aftermath of the First World War, when the government had settled returning soldiers on farmland in the state's wheat belt as part of a soldier-settlement scheme. Farming was already precarious, made worse by the falling crop prices of the Great Depression, when roughly 20,000 emus migrated inland during their breeding season and began destroying wheat crops and damaging fences in search of food and water. Desperate farmers, many of them veterans themselves, appealed to the government for military assistance, and in November 1932 the Minister of Defence agreed to deploy soldiers armed with machine guns. Major G. P. W. Meredith led the operation, accompanied by two soldiers and two Lewis light machine guns, along with roughly 10,000 rounds of ammunition, in the Campion district. The results, however, fell dramatically short of expectations. Emus proved far harder targets than anticipated: capable of running at speeds up to 50 kilometres per hour and inclined to scatter into small, fast-moving groups rather than stay together, they routinely evaded gunfire, while the machine guns themselves repeatedly jammed under field conditions. By the time the operation was called off in early December 1932, after roughly six weeks, fewer than 1,000 emus had been killed despite the thousands of rounds expended. The campaign was widely mocked in the press at the time and has remained a byword for military overreach and underestimation ever since. Commentators later noted, with some irony, that the emus had effectively won: the birds continued to damage crops in the years that followed, and subsequent culling was left to farmers using bounty schemes rather than the army.",
C1:"Few episodes in Australian military history have attracted quite the enduring, faintly comic notoriety of the so-called Emu War of late 1932, a campaign that pitted soldiers of the Royal Australian Artillery, equipped with machine guns, against the country's own native emu population in the wheat-growing districts of Western Australia. The origins of the conflict lay in a soldier-settlement scheme dating from the years after the First World War, under which returning veterans had been granted farmland in the state's marginal wheat belt. Farming these plots was difficult at the best of times, and considerably more so once the Great Depression drove crop prices down; matters worsened further when an estimated 20,000 emus, migrating inland during their breeding season in search of water and feed, descended on the region and began trampling fences and devouring wheat in substantial quantities. Farmers, a number of them former soldiers, lobbied the federal government for military intervention, and in November 1932 the Minister of Defence, Sir George Pearce, authorised the deployment of troops under Major G. P. W. Meredith, equipped with two Lewis machine guns and some 10,000 rounds of ammunition. The operation, framed at the outset almost as a formality, instead became something closer to a case study in military miscalculation. Emus, it transpired, are considerably more difficult targets than their ungainly appearance suggests: capable of speeds approaching 50 kilometres per hour, they tended to scatter into small, erratic groups rather than presenting the massed target the operation had anticipated, while the Lewis guns, mounted on trucks or fired from static positions, jammed with what contemporary reports described as dispiriting regularity. By the time the campaign was abandoned in early December 1932, after roughly six weeks of intermittent engagement, official tallies credited the operation with fewer than 1,000 confirmed kills against thousands of rounds fired, a ratio that, even allowing for the difficulty of the terrain, struck contemporaries as embarrassing. The Australian press seized on the episode with evident relish, and it has since entered popular memory as an emblem of institutional overreach: an instance in which superior firepower proved strikingly inadequate against an adversary that was simply better adapted to the landscape than its human opponents. Whether the campaign should be read purely as farce, or more soberly as an early illustration of the limits of applying military solutions to ecological problems, remains, arguably, an open question, one that later, more systematic culling efforts, organised around bounties rather than soldiers, seemed tacitly to answer in the latter's favour.",
C2:"Historians searching for a tidy metaphor for the limits of military force need look no further than Western Australia in the closing weeks of 1932, when the Royal Australian Artillery was dispatched, machine guns in tow, to wage what has passed into folklore as the Emu War, and lost, comprehensively, to a bird. The episode's origins were unglamorous enough: under a soldier-settlement scheme established after the First World War, veterans had been granted marginal farmland in the state's wheat belt, a livelihood rendered precarious even before the Great Depression drove crop prices down further. Into this already fragile arrangement arrived, in the spring of 1932, an estimated 20,000 emus, migrating inland during their breeding season in search of water and feed, and discovering, in the settlers' wheat, an inexhaustible supply of both, along with, in the settlers' fences, an obstacle they simply flattened en route. The farmers, a fair number of them ex-servicemen themselves, appealed to Canberra for the kind of assistance one might, not unreasonably, expect a government to extend to citizens facing a genuine agricultural crisis, and in November 1932 the Minister of Defence, Sir George Pearce, obliged, authorising the deployment of Major G. P. W. Meredith, two subordinate gunners, two Lewis light machine guns and roughly 10,000 rounds of ammunition to the Campion district, an arsenal that, on paper, looked considerably more suited to repelling an invading army than a flock of large, flightless birds. It did not go well. Emus, it turned out, possess a set of qualities singularly ill-suited to being machine-gunned en masse: they can run at speeds approaching 50 kilometres an hour, they scatter into small, erratic clusters rather than obligingly bunching into a target-rich mass, and they proved, if contemporary accounts are to be believed, capable of absorbing an alarming quantity of gunfire and continuing regardless. The Lewis guns, for their part, jammed repeatedly, whether mounted on the back of a moving truck, a platform that made accurate fire all but impossible, or fired from static positions the emus had, by then, generally learned to avoid. By the time the operation was quietly wound down in early December, after roughly six weeks of what can only be described as asymmetric warfare running the wrong way, official figures credited the campaign with fewer than 1,000 confirmed kills against several thousand rounds expended, a hit rate that even Meredith himself is reported to have found difficult to defend. The Australian and international press covered the affair with barely disguised delight, and it has endured in popular memory ever since as shorthand for institutional overreach and underestimated adversaries, a status the emus themselves, one imagines, would find entirely reasonable. Later, more effective culling efforts dispensed with the military altogether in favour of bounty schemes administered by the farmers directly, a quieter and considerably more successful approach that rather undercuts the original premise: that this was ever a problem requiring an army, two machine guns, and 10,000 rounds of ammunition to solve."}},
{id:"octopus-cognition",title:"Octopus Intelligence: A Different Kind of Mind",tag:"Global · Nature",img:"images/reading/octopus-cognition.jpg",quiz:{"B1":[{"q":"About how many neurons does an octopus have in total?","o":["500 thousand","500 million","5 billion","50 million"],"a":1,"x":"An octopus carries roughly 500 million neurons in total."},{"q":"Where are two-thirds of an octopus's neurons located?","o":["In its central brain","Spread through its eight arms","In its eyes","In its stomach"],"a":1,"x":"About two-thirds of those neurons are spread through its eight arms, not the head."},{"q":"What does the veined octopus carry around to use as a shelter?","o":["Empty coconut shells","Small rocks","Seaweed","Fish bones"],"a":0,"x":"The veined octopus gathers empty coconut shell halves and reassembles them later as a shelter."}],"B2":[{"q":"What are the clusters of neurons in each octopus arm called?","o":["Ganglia","Cortex","Tentacles","Synapses"],"a":0,"x":"Each arm holds its own cluster of neurons, known as ganglia."},{"q":"According to the passage, how is work divided between the central brain and the arms?","o":["The brain controls every movement precisely","The brain gives a broad instruction and each arm works out the specific movements","The arms decide everything and the brain does nothing","Each arm must wait for detailed brain signals"],"a":1,"x":"The central brain issues a broad instruction, then each arm works out the specific movements for itself."},{"q":"Why do scientists find octopus intelligence particularly significant?","o":["Octopuses are closely related to dolphins","Their intelligence evolved independently, on a separate branch from vertebrates","They have larger brains than humans","They learned intelligence from other sea animals"],"a":1,"x":"Its intelligence evolved independently, on a branch separate from vertebrates, and that's exactly what makes it so significant."}],"C1":[{"q":"What does the passage cite as evidence that much 'decision-making' happens locally in the arms?","o":["A severed arm can keep making coordinated reaching and grasping movements","Octopuses have no central brain at all","Lost arms simply grow back","Arms can survive on their own for years"],"a":0,"x":"A severed arm keeps making coordinated reaching and grasping movements, which shows much of the control really sits in the arms."},{"q":"In the phrase describing octopus cognition as 'distributed rather than centralised', 'distributed' most nearly means...","o":["shared out across many parts of the body","given away to other animals","slow and inefficient","concentrated in one place"],"a":0,"x":"Here 'distributed' means shared out across many parts of the body, rather than bundled into one central brain."},{"q":"Why does the evolutionary distance give the octopus findings 'theoretical weight'?","o":["It proves octopuses are older than humans","It shows complex intelligence can arise independently, through convergent evolution","It means octopuses and humans think in identical ways","It confirms the common ancestor had a large brain"],"a":1,"x":"That vast evolutionary gap shows complex intelligence can arise on its own, through convergent evolution."}],"C2":[{"q":"Why does the author open by discussing intelligence evolving 'only once'?","o":["To argue that intelligence is unique to vertebrates","To set up the octopus as a counterexample showing intelligence can arise more than once","To claim octopuses evolved before vertebrates","To explain how the human brain works"],"a":1,"x":"The 'only once' idea is set up on purpose, so the octopus can walk in as the counterexample that intelligence arose more than once."},{"q":"The passage calls the octopus 'the closest thing on Earth to an alien mind' mainly because...","o":["octopuses may have originally come from space","its nervous system is organised radically unlike our own","it cannot communicate with humans","it lives in an extreme environment"],"a":1,"x":"It earns that label because its nervous system is wired in a way radically unlike our own."},{"q":"How does the author treat the claims that the octopus 'plays' and dislikes certain keepers?","o":["As firmly proven scientific fact","As credible behaviour described with careful hedging","As pure fiction with no basis","As irrelevant to the question of intelligence"],"a":1,"x":"The author finds these credible but hedges them carefully, reaching for phrases like 'by several credible accounts'."}]},levels:{B1:"Octopuses are some of the smartest animals in the ocean, but their brains work in a very unusual way. An octopus has about 500 million neurons, the cells that carry information in the nervous system. But only about one-third of these neurons are in its central brain. The other two-thirds are spread through its eight arms. This means each arm has its own small 'mini-brain' and can act quite independently. An arm can touch, taste, and even make simple decisions about movement without waiting for instructions from the main brain. For example, if the central brain sends a general message like 'find food', each arm can figure out, by itself, exactly how to move and grab something. Octopuses also show real intelligence in their behaviour. Scientists have watched them open jars to get food inside, solve mazes, and even use tools. One famous example is the veined octopus, which picks up empty coconut shells and carries them around to use later as a portable shelter. This kind of intelligence is especially interesting to scientists because octopuses are not related to smart animals like humans, dolphins, or crows. Their last common ancestor with humans lived hundreds of millions of years ago and was a very simple creature. So octopus intelligence developed completely separately from ours, a different path to a similar result.",
B2:"Octopuses possess one of the most unusual nervous systems in the animal kingdom, and it is this unusual architecture, as much as any single feat of behaviour, that has made them a favourite subject for researchers studying the evolution of intelligence. An octopus has roughly 500 million neurons in total, a substantial number for an invertebrate, but only about a third of these are located in its central brain. The remaining two-thirds are distributed throughout its eight arms, each of which contains its own cluster of neurons, or ganglia, functioning almost like a semi-independent mini-brain. This decentralised arrangement allows individual arms to process sensory information and initiate movement with a striking degree of autonomy. While the central brain can issue a broad instruction, such as 'search for food', each arm appears capable of working out, largely on its own, the specific sequence of movements needed to grasp an object, explore a crevice, or manipulate an awkward shape, without waiting for detailed direction from above. Behavioural evidence has reinforced the picture of a genuinely sophisticated intelligence. Octopuses in laboratory and aquarium settings have been observed unscrewing jar lids to reach food, navigating mazes, and even displaying apparent problem-solving under novel conditions. Perhaps the most striking documented example is that of the veined octopus, which has been filmed collecting empty coconut shell halves, carrying them clumsily across the seafloor, and later reassembling them into a makeshift shelter, a rare instance of tool use and, arguably, forward planning among invertebrates. What makes these abilities particularly significant to scientists is evolutionary distance. Octopuses and vertebrates, including humans, diverged from a common ancestor hundreds of millions of years ago, long before complex nervous systems as we know them had evolved. As a result, octopus intelligence is widely regarded as a case of complex cognition evolving independently, along an entirely separate evolutionary branch from our own.",
C1:"Octopuses occupy a peculiar place in the study of animal cognition: intelligent by almost any behavioural measure, yet built on a nervous system so structurally unlike our own that comparisons with vertebrate intelligence can only be made, at best, by analogy. An octopus possesses somewhere in the region of 500 million neurons, a considerable figure for an invertebrate, comparable in order of magnitude to some small mammals, yet only roughly a third of these reside in the central brain proper. The remaining two-thirds are distributed among the eight arms, each equipped with its own substantial cluster of neurons, or ganglia, arranged along the arm's length in a configuration that functions, to a meaningful extent, as a semi-autonomous processing centre in its own right. The consequences of this decentralisation are not merely anatomical curiosities but appear to be functionally significant. An individual arm, severed from the central brain in laboratory conditions, can continue to execute coordinated reaching and grasping movements for some time, suggesting that a considerable portion of what might loosely be called 'decision-making' occurs locally rather than centrally. In an intact animal, the central brain appears to issue comparatively coarse-grained commands, locate food, explore this surface, leaving each arm to determine, largely independently, the specific motor sequence required, a division of labour that has led some researchers to describe the octopus's cognition as distributed rather than centralised. This architecture correlates with, and arguably underlies, a body of behavioural evidence that few would dispute qualifies as genuine problem-solving. Octopuses in captivity have repeatedly demonstrated the ability to open screw-top jars, navigate mazes, and recognise individual human keepers; more strikingly, the veined octopus (Amphioctopus marginatus) has been documented collecting discarded coconut shell halves, transporting them, awkwardly, using a form of stilted walking, across open sand, and later reassembling them into an impromptu shelter, a behaviour that meets most working definitions of tool use and, not uncontroversially, of a rudimentary capacity to plan for future contingencies rather than merely react to present ones. What lends these findings particular theoretical weight is the sheer evolutionary distance separating octopuses from vertebrates: the two lineages diverged from a common ancestor several hundred million years ago, at a point in evolutionary history when that ancestor was almost certainly a simple, neurologically unremarkable organism, well before anything resembling a centralised brain had evolved in either line. Octopus cognition is consequently regarded by many researchers as one of the clearest available cases of complex intelligence arising through convergent evolution, a separate, independent experiment in mind, run by nature along a branch of the tree of life that shares almost nothing with our own beyond the most distant common root.",
C2:"If intelligence had to evolve only once, on one branch of the tree of life, we would have every reason to think of it as a fluke, a peculiar accident of vertebrate neurology, unlikely to recur. The octopus exists, at least in part, to disabuse us of that comfortable assumption. Here is an invertebrate mollusc, distant kin to the garden snail, that opens jars, solves mazes, recognises individual human faces, and, by several credible accounts, plays; and it does all this while possessing a nervous system so radically unlike our own in its basic organisation that biologists have taken to describing it, without excessive hyperbole, as the closest thing on Earth to an alien mind. The anatomy alone justifies the description. An octopus carries something on the order of 500 million neurons, a figure that places it, roughly, in the neighbourhood of some small mammals, yet only about a third of that total sits in the creature's central brain. The remaining two-thirds are dispersed through its eight arms, each threaded with its own substantial chain of ganglia, effectively a string of semi-independent processing hubs rather than a mere conduit relaying orders from headquarters. Sever an arm under laboratory conditions, not a recommendation, merely an observation drawn from the literature, and it will go on reaching, grasping and manoeuvring for some time afterward, evidently untroubled by the absence of central supervision. In the intact animal, the brain appears to deal in the executive rather than the granular: broad instructions along the lines of 'locate food' or 'investigate this crevice', leaving each arm to improvise, largely on its own recognisance, the fine motor choreography required. It would be easy to mistake this for mere biological trivia were it not for the behavioural record, which is difficult to explain away as reflex. Octopuses in captivity have repeatedly demonstrated the capacity to unscrew jar lids to retrieve food sealed inside, to navigate mazes, and to distinguish between individual human keepers, occasionally squirting water at ones they appear, by whatever internal metric octopuses use, to dislike. Most celebrated of all is the veined octopus, Amphioctopus marginatus, filmed off the coast of Indonesia collecting discarded coconut shell halves, hauling them awkwardly across open sand in a peculiar stilted gait, and later reassembling them into a portable shelter, a sequence that satisfies most working definitions of tool use, and that some researchers have gone further to read as evidence of a rudimentary capacity to plan for a need not yet present, rather than simply react to one already at hand. What elevates all this from charming anecdote to genuine scientific significance is the sheer evolutionary distance the octopus has travelled to arrive at it. Cephalopods and vertebrates parted ways from a shared ancestor several hundred million years ago, at a point when that ancestor was, by any reasonable reconstruction, a simple, neurologically unremarkable creature, long before anything resembling a centralised brain existed on either branch. Octopus cognition is therefore held up, with good reason, as among the clearest natural instances of convergent evolution in the realm of mind itself: proof, if proof were needed, that nature has run the experiment of building a sophisticated intelligence more than once, using entirely different materials, along a branch of the evolutionary tree that shares with our own almost nothing except the most distant and unremarkable of common roots."}},
{id:"chernobyl-wildlife",title:"Chernobyl's Unexpected Wildlife",tag:"Ukraine · Nature",img:"images/reading/chernobyl-wildlife.jpg",quiz:{"B1":[{"q":"In which year did the Chernobyl reactor explode?","o":["1986","1996","1978","2006"],"a":0,"x":"Reactor No. 4 blew up on 26 April 1986."},{"q":"According to studies, how many more wolves may be in the zone than in similar forests outside it?","o":["twice as many","seven times as many","the same number","half as many"],"a":1,"x":"A widely cited 2015 study put wolf density about seven times higher than in comparable uncontaminated reserves."},{"q":"When were Przewalski's horses brought to the zone?","o":["1986","1998","2008","1976"],"a":1,"x":"These endangered horses were deliberately introduced to the zone in 1998."}],"B2":[{"q":"How large is the Chernobyl exclusion zone?","o":["about 260 square kilometres","about 2,600 square kilometres, roughly the size of Luxembourg","about 26,000 square kilometres","about 26 square kilometres"],"a":1,"x":"The exclusion zone runs to roughly 2,600 square kilometres, about the size of Luxembourg."},{"q":"What did Moller and Mousseau's research on birds in contaminated areas find?","o":["Larger brains and better fertility","Smaller brains, more cataracts, and reduced fertility","No health effects at all","Faster population growth"],"a":1,"x":"Moller and Mousseau found smaller brains, higher cataract rates, and reduced fertility in the more contaminated areas."},{"q":"What conclusion do most scientists now favour, according to the passage?","o":["Radiation is completely harmless to wildlife","Radiation is not harmless, but removing humans matters more for wildlife numbers","The zone is a lifeless wasteland","The animals should be removed from the zone"],"a":1,"x":"Most now land here: radiation isn't harmless, but removing humans matters more for wildlife numbers than the radiation does."}],"C1":[{"q":"Why does the passage describe the zone as presenting ecologists with a 'paradox'?","o":["Animals thrive in an area contaminated by the worst nuclear accident","The zone turned out to be smaller than expected","No animals live there despite the ban on humans","Radiation levels there keep rising"],"a":0,"x":"The paradox is simple: animals thrive on land poisoned by the worst nuclear accident on record."},{"q":"What point do critics make about the mammal researchers' focus on population abundance?","o":["Abundance proves radiation is beneficial","Abundance alone says little about individual health or long-term genetic damage","Mammal counts are always inaccurate","Only birds are worth studying"],"a":1,"x":"Critics warn that high headcounts tell you little about individual animals' health or long-term genetic damage."},{"q":"What did the 2024 study of Chernobyl's wolves find?","o":["The wolves had shrunk in size","Roughly 3,180 differentially expressed genes, some possibly linked to cancer resistance","The wolves had vanished from the zone","The wolves were interbreeding with dogs"],"a":1,"x":"The 2024 study found roughly 3,180 differentially expressed genes in the wolves, some perhaps tied to cancer resistance."}],"C2":[{"q":"When conservationists released Przewalski's horses in 1998, what bet does the author say they were making?","o":["That radiation would kill off the predators","That radiation would prove a lesser threat than poachers and farmland","That the horses would clean up the contamination","That humans would soon return to the zone"],"a":1,"x":"Releasing the horses was a bet that radiation would prove a smaller threat than poachers and farmland, and it paid off."},{"q":"The author calls describing the zone as harmless a 'category error' in order to...","o":["endorse the view that nature is simply fine","warn against oversimplifying, since radiation still causes measurable harm","argue that all the animals there are sick","dismiss the wolf density study"],"a":1,"x":"Branding the 'harmless' reading a category error is a warning against oversimplifying, since radiation still does measurable harm."},{"q":"What does the wry summary 'people, evidently, are worse' actually claim?","o":["Radiation is genuinely good for wildlife","Human presence harms wildlife populations more than the lingering radiation does","Scientists dislike ordinary people","Wildlife prefers radiation to clean habitats"],"a":1,"x":"It claims that, for wildlife numbers, human presence does more damage than the lingering radiation."}]},levels:{B1:"On 26 April 1986, a reactor exploded at the Chernobyl nuclear power plant in Ukraine, then part of the Soviet Union. It was the worst nuclear accident in history. About 116,000 people left their homes and never came back. The government created an \"exclusion zone,\" an area of about 2,600 square kilometres where people are not allowed to live.\n\nForty years later, something surprising has happened. Without humans, wild animals have come back in large numbers. Scientists have counted many gray wolves, and studies show there may be seven times more wolves in the zone than in similar forests outside it. Lynx, brown bears, wild boar, and even Przewalski's horses (a rare wild horse species, brought to the zone in 1998) now live there too.\n\nRadiation is still dangerous, and scientists do not agree about its effects. Some researchers, like Anders Møller and Timothy Mousseau, found smaller brains and other health problems in local birds. Other scientists say the biggest mammal populations look healthy and are not shrinking. One researcher explained it simply: this does not mean radiation is good for animals. It means that living without humans (without hunting, farming, and traffic) is even better for wildlife than living with radiation is bad.",
B2:"On 26 April 1986, Reactor No. 4 at the Chernobyl nuclear power plant exploded, releasing huge amounts of radioactive material across Ukraine, Belarus, and beyond. It remains the most serious nuclear accident on record. Around 116,000 people were evacuated from the surrounding area, and an exclusion zone of roughly 2,600 square kilometres (about the size of Luxembourg) was declared off-limits to permanent human habitation.\n\nWhat has happened since then has surprised many scientists. Rather than becoming a lifeless wasteland, the zone has turned into an accidental wildlife refuge. Camera traps and field surveys have recorded thriving populations of gray wolves, Eurasian lynx, brown bears, elk, and wild boar, along with Przewalski's horses, an endangered wild horse species deliberately introduced in 1998. A widely cited 2015 study found wolf density in the zone to be roughly seven times higher than in comparable uncontaminated reserves nearby.\n\nHowever, the science is not as simple as \"nature is fine.\" Researchers remain divided over how radiation actually affects the animals living there. Ecologists Anders Møller and Timothy Mousseau have published decades of research showing that birds in more contaminated areas have smaller brains, higher rates of cataracts, and reduced fertility. Other teams, studying larger mammals, argue that population numbers show no clear decline linked to radiation exposure, despite ongoing contamination. A 2024 genetic study even found thousands of genes behaving differently in Chernobyl's wolves, possibly linked to cancer resistance, though researchers caution this needs further confirmation.\n\nAs a result, most scientists now favour a more nuanced conclusion: radiation is not harmless, but the removal of humans (no hunting, farming, logging, or traffic) appears to matter more for wildlife numbers than the lingering radioactivity does.",
C1:"When Reactor No. 4 at the Chernobyl Nuclear Power Plant exploded on 26 April 1986, it triggered what remains, by most measures, the worst nuclear accident in history. Roughly 116,000 residents were evacuated from the surrounding towns and villages, most permanently, and Soviet authorities cordoned off a 2,600-square-kilometre exclusion zone spanning parts of northern Ukraine and southern Belarus.\n\nFour decades on, the zone presents ecologists with a genuine paradox. Rather than the barren, irradiated wasteland popular imagination might expect, the area has become one of Europe's largest de facto wildlife reserves. Camera-trap surveys and radio-collar tracking have documented flourishing populations of gray wolves, Eurasian lynx, brown bears (locally extinct for over a century) and Przewalski's horses, a critically endangered species deliberately reintroduced in 1998. A frequently cited 2015 study led by Tatiana Deryabina found wolf densities roughly seven times higher inside the zone than in comparable, uncontaminated reserves in the region, a figure that startled even seasoned researchers.\n\nIt would be a mistake, however, to read this as evidence that radiation is somehow benign. The scientific community remains genuinely split. Ecologists Anders Møller and Timothy Mousseau have spent over two decades documenting, particularly in birds, smaller brain sizes, elevated rates of cataracts and tumours, and reduced breeding success correlating with contamination levels, findings that arguably complicate any simple \"nature is thriving\" narrative. Other researchers, working primarily with larger mammals, counter that population-level abundance shows little discernible link to radiation dose once confounding variables are controlled for, though critics note that abundance alone says little about individual health or long-term genetic damage. A 2024 study identifying roughly 3,180 differentially expressed genes in Chernobyl's wolves (some potentially associated wit
