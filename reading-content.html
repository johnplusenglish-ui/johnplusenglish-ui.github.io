est Irish?","o":["It was the only crop the British allowed them to grow","It produced more calories per acre than any viable alternative on their tiny plots","It was immune to disease","It could be easily exported for profit"],"a":1,"x":"The potato fed the poorest because it yielded more calories per acre than anything else their tiny plots could grow."},{"q":"Why do most historians resist describing the famine purely as a natural disaster?","o":["Because the blight was actually harmless","Because British administrative choices are widely held to have turned a crop failure into a demographic catastrophe","Because no one really starved","Because the potato crop never truly failed"],"a":1,"x":"Historians resist the 'natural disaster' label because British policy is widely seen as turning a crop failure into a catastrophe."},{"q":"What does the passage say most distinguishes An Gorta Mor from other famines of similar scale?","o":["The durability of its aftershocks, including a population that has never recovered to its pre-famine level","That it was caused by a war rather than disease","That it lasted only a single year","That the population recovered within a generation"],"a":0,"x":"What sets it apart is the lasting aftershock: Ireland's population still hasn't returned to its pre-famine level."}],"C2":[{"q":"How does the author regard the view of 'blight as unfortunate act of nature'?","o":["As the fullest and most accurate account","As an ahistorical convenience that historians have laboured to dismantle","As proof that policy played no role","As a minor detail not worth discussing"],"a":1,"x":"The author treats 'blight as mere act of nature' as a convenient half-truth that historians have worked hard to dismantle."},{"q":"Why, according to the author, does the name resist the translation 'famine'?","o":["Because 'famine' is not an English word","Because 'famine' implies mere scarcity rather than the engineered, policy-compounded devastation that occurred","Because the Irish word means something entirely unrelated","Because no food was ever scarce"],"a":1,"x":"'Famine' suggests plain scarcity, but the Irish name points to engineered, policy-worsened devastation."},{"q":"What 'bitter irony' does the author note about where the population collapse fell hardest?","o":["It fell on the western counties that had contributed least to the political decisions governing the response","It fell mainly on wealthy landowners in the east","It fell equally across every county","It fell hardest on Britain rather than Ireland"],"a":0,"x":"Here's the bitter irony: the western counties hit hardest had the least say in the policies shaping the response."}]},levels:{B1:"Between 1845 and 1852, Ireland suffered one of the worst disasters in its history: An Gorta Mór, or \"The Great Hunger,\" known in English as the Irish Famine.\n\nIt began when a disease called blight attacked the potato plant. At the time, millions of poor Irish families depended almost completely on potatoes for food. When the blight destroyed the crop, especially in 1846 and 1848, these families had almost nothing to eat.\n\nMany historians say the disaster was made much worse by British government policy. Ireland was then ruled by Britain. Even while people were starving, ships continued to export other foods, like wheat and meat, out of the country. The government also built \"workhouses\" for poor people, but conditions there were harsh, and many people died there from disease.\n\nAbout one million people died from hunger and illness. Around one to two million more left Ireland, mostly for the United States, Canada, and Britain. Many died on the crowded ships that carried them, which people called \"coffin ships.\"\n\nIreland's population fell from about 8.4 million to 6.6 million in just a few years. Even today, Ireland's population has still not fully recovered. Tens of millions of people around the world, especially in the United States, are descendants of Irish people who left during this period.",
B2:"Between 1845 and 1852, Ireland experienced a catastrophe so severe that its Irish name, An Gorta Mór, translates simply as \"The Great Hunger.\" In English it is generally known as the Irish Famine, though the scale of the disaster makes that word feel almost too mild.\n\nThe immediate cause was biological: a water mould called Phytophthora infestans, commonly referred to as blight, attacked potato crops across Ireland, destroying them almost completely in particularly devastating years such as 1846 and 1848. This was catastrophic because roughly three million of Ireland's poorest people depended on the potato as their near-exclusive source of food, a level of dependence that left them with almost no alternative when the crop repeatedly failed.\n\nHowever, most historians agree that the blight alone does not explain the scale of the tragedy. Ireland was, at the time, governed directly from London, and British policy has been widely criticised for worsening the crisis considerably. Even as people starved, substantial quantities of grain and livestock continued to be exported out of Ireland to Britain. Relief efforts were also badly designed: the workhouse system, intended to support the destitute, was chronically overcrowded and disease-ridden, while a controversial regulation known as the Gregory Clause denied relief to any family holding more than a quarter-acre of land, forcing many to give up what little they had left.\n\nThe human cost was immense. Roughly one million people died of starvation and related diseases such as typhus, while a further one to two million emigrated, many aboard overcrowded, unsanitary vessels grimly nicknamed \"coffin ships\" because of their high death rates at sea. As a result, Ireland's population collapsed from around 8.4 million in the mid-1840s to roughly 6.6 million by 1851, a fall of 20 to 25% in under a decade.\n\nThe famine's legacy has proven remarkably durable. Ireland's population still has not returned to its pre-famine level, and the mass emigration it triggered helped create today's global Irish diaspora, estimated at tens of millions of people, particularly across the United States, Canada, and Australia.",
C1:"Few events have shaped a nation's demography, politics, and diaspora as decisively as An Gorta Mór, literally \"The Great Hunger,\" the famine that convulsed Ireland between 1845 and 1852. Its proximate cause was straightforwardly biological: Phytophthora infestans, a water mould commonly known as potato blight, swept through Irish fields, devastating harvests almost totally in the worst years, 1846 and 1848 chief among them. The reason this crop failure proved so catastrophic lies in the extraordinary degree of dependence it exposed: roughly three million of Ireland's poorest inhabitants, tenant farmers working tiny, subdivided plots, subsisted almost entirely on the potato, a crop chosen precisely because it produced more calories per acre than any viable alternative. When it failed, there was, for many families, no fallback whatsoever.\n\nYet to describe the famine purely as a natural disaster is, most historians would argue, to let policy off the hook rather too easily. Ireland was governed directly from Westminster throughout this period, and British administrative choices are widely held to have transformed a severe crop failure into a demographic catastrophe. Grain and livestock continued to be exported from Ireland even at the height of the starvation, a fact that has become one of the most bitterly remembered aspects of the period, whatever the market logic offered in its defence at the time. Relief measures, moreover, were poorly conceived: the workhouse system established under the Poor Law became chronically overwhelmed and rife with disease, while the notorious Gregory Clause of 1847 required any family holding more than a quarter-acre of land to surrender it before qualifying for assistance, a rule that likely accelerated rather than relieved the crisis.\n\nThe resulting toll was severe by any measure. Approximately one million people died, chiefly from starvation and famine-associated diseases such as typhus and dysentery, while a further one to two million emigrated, many aboard the notoriously overcrowded vessels known as \"coffin ships,\" so called for the mortality rates recorded during the crossing itself. Ireland's population, which had stood at roughly 8.4 million before the famine, fell to around 6.6 million by 1851, a decline of some 20 to 25% within a single decade, concentrated with particular severity in the poorest western counties.\n\nWhat arguably distinguishes An Gorta Mór from other famines of comparable scale is the durability of its aftershocks. Ireland's population has, remarkably, never recovered to its pre-famine level even today, a fact with few parallels among developed nations. The emigration it set in motion did not stop when the blight receded; it established migration networks and cultural expectations that continued for generations, eventually producing the modern Irish diaspora, a global population, estimated in the tens of millions, considerably larger than the population of Ireland itself.",
C2:"There are famines, and then there is An Gorta Mór, \"The Great Hunger,\" a catastrophe so thoroughly woven into Irish national memory that even its name resists the anodyne translation \"famine,\" a word that implies scarcity rather than the engineered, policy-compounded devastation that unfolded across Ireland between 1845 and 1852. The trigger was mundane enough, biologically speaking: Phytophthora infestans, a water mould better known as potato blight, arrived in Ireland in 1845 and, in the worst years (1846 most catastrophically, 1848 nearly as badly), reduced entire harvests to blackened rot within weeks. What converted a plant pathogen into a demographic cataclysm was the almost total dependence of roughly three million of Ireland's poorest tenant farmers on a single crop, chosen precisely because it yielded more edible calories per acre, on the meagre plots left to them, than any cereal could match. When that crop failed, repeatedly and near-totally, there was, for a substantial fraction of the population, quite literally nothing else to eat.\n\nTo leave the account there, however, blight as unfortunate act of nature, is to indulge in precisely the ahistorical convenience that generations of historians have laboured to dismantle. Ireland was administered directly from Westminster throughout the period, and British policy is now widely held to have transmuted a severe agricultural failure into a catastrophe of an altogether different order. Grain, oats, and livestock continued to be exported from Irish ports throughout the worst years of starvation, under armed guard on occasion, a fact that has calcified into perhaps the single most bitterly remembered detail of the entire period. The relief architecture fared little better: the workhouse system, erected under the Poor Law of 1838, buckled almost immediately under demand it was never designed to absorb, becoming itself a vector for typhus and dysentery; and the infamous Gregory Clause of 1847, which barred from relief any family holding more than a quarter-acre of land, forced tenant farmers to choose, with a cruelty that seems almost deliberate in retrospect, between starvation and surrendering the only asset standing between them and destitution.\n\nThe reckoning, when it came, was severe almost beyond comprehension. Something on the order of one million people died, chiefly of starvation and the diseases that accompany it, while a further one to two million fled the country entirely, not infrequently aboard the grimly nicknamed \"coffin ships,\" so called because a meaningful proportion of passengers did not survive the crossing. Ireland's population, roughly 8.4 million on the eve of the famine, had collapsed to around 6.6 million within barely a decade, a contraction of 20 to 25%, falling hardest, with a bitter irony, on precisely the western counties that had contributed least to the political decisions governing the response.\n\nWhat ultimately sets An Gorta Mór apart, though, is less the acuteness of the crisis than the persistence of its aftermath. Ireland's population, remarkably, has still not returned to its pre-famine peak, a demographic scar with virtually no parallel among developed nations, where population figures reliably recover within a generation or two of even severe shocks. The emigration the famine set in motion, far from subsiding once the blight receded, established migratory channels and cultural expectations that persisted for a century or more, ultimately producing a global Irish diaspora numbering, by most estimates, in the tens of millions, a population several multiples the size of Ireland itself, and a reminder that famines, however geologically brief, can reshape a nation's demography on a timescale closer to geological than historical."}},
{id:"free-solo-climbing",title:"The Climber Whose Brain Doesn't Flinch",tag:"United States · Psychology",img:"images/reading/free-solo-climbing.jpg",quiz:{"B1":[{"q":"What is 'free solo' climbing?","o":["Climbing without any rope or safety equipment","Climbing in a team of two","Climbing only indoors","Climbing with extra ropes for safety"],"a":0,"x":"Free solo means climbing with no rope or safety gear, exactly as Honnold did on El Capitan."},{"q":"What happened in Honnold's brain when he saw the scary pictures?","o":["His amygdala did not react at all","His amygdala became very active","He fell asleep in the scanner","He felt strong fear like most people"],"a":0,"x":"In the scanner, Honnold's amygdala didn't react to the frightening images at all."},{"q":"What did the documentary Free Solo win in 2019?","o":["An Academy Award","A Nobel Prize","A climbing world record","An Olympic medal"],"a":0,"x":"The film Free Solo won an Academy Award in 2019."}],"B2":[{"q":"Who was Dr Jane Joseph?","o":["A neuroscientist who scanned Honnold's brain","Honnold's climbing partner","The director of the film Free Solo","A doctor who treated Honnold's injuries"],"a":0,"x":"Dr Jane Joseph is the neuroscientist who put Honnold in the scanner and showed him the disturbing images."},{"q":"How did the control climber's amygdala respond to the images?","o":["It lit up exactly as expected, showing a normal fear response","It showed no reaction at all, like Honnold's","It was found to be damaged","It could not be measured"],"a":0,"x":"The control climber's amygdala lit up normally, the ordinary fear response Honnold's brain just didn't show."},{"q":"What did researchers conclude about Honnold's amygdala?","o":["It is damaged and no longer works","It likely requires a far stronger stimulus before triggering a fear response","It is missing entirely from his brain","It reacts more strongly than most people's"],"a":1,"x":"Researchers concluded his amygdala isn't damaged but simply needs a much stronger signal before it fires."}],"C1":[{"q":"What common assumption does Honnold's case challenge?","o":["That climbing El Capitan is physically possible","That extreme risk-takers are simply people who override or suppress an otherwise normal fear response through willpower","That the amygdala is involved in fear","That documentaries can win awards"],"a":1,"x":"His case challenges the idea that daredevils just muscle down a normal fear response through sheer willpower."},{"q":"Why does the passage say the scan should not be read as a damaged fear circuit?","o":["Because Honnold reported feeling very afraid","Because his amygdala appears structurally intact and his threshold for activation is simply unusually high","Because the scanner was faulty","Because no images were actually shown"],"a":1,"x":"It isn't a broken circuit: his amygdala looks structurally intact, with its trigger threshold just set unusually high."},{"q":"What role does the passage attribute to Honnold's rehearsal of routes?","o":["It converts an act that looks impulsive into one that is thoroughly rehearsed and no longer especially frightening to him","It has no effect on his performance","It is the only reason his amygdala reacts normally","It makes the climbs more dangerous"],"a":0,"x":"Rehearsal turns a seemingly reckless climb into one so thoroughly practised that it no longer frightens him much."}],"C2":[{"q":"What is the author's stance on explaining Honnold's climbing purely through biology?","o":["It is the complete and correct explanation","It would be 'equally glib', since years of deliberate rehearsal also matter","Biology plays no part whatsoever","Only willpower, not biology, is involved"],"a":1,"x":"The author calls a purely biological account equally glib, since years of deliberate rehearsal matter just as much."},{"q":"The closing idea that Honnold had 'already talked his nervous system out of much of the argument' mainly suggests:","o":["That he argues aloud while climbing","That through years of deliberate practice he had already reduced much of his fear before the climb","That his nervous system is physically unusual from birth","That he felt no fear because he ignored the risk"],"a":1,"x":"The line means his long practice had already quieted most of his fear well before the climb even began."},{"q":"Why does the author call the ambiguity over Honnold's threshold 'the more interesting scientific story'?","o":["Because it proves the amygdala is unimportant","Because whether the threshold is innate or recalibrated over years unsettles the comfortable folk narrative about risk-takers","Because it settles the debate about willpower for good","Because it shows the study was poorly designed"],"a":1,"x":"The open question, whether his low fear is inborn or trained over years, unsettles the tidy folk story about risk-takers."}]},levels:{B1:"On June 3, 2017, a climber named Alex Honnold did something almost impossible. He climbed El Capitan, a huge wall of rock in Yosemite National Park, California, without using any rope or safety equipment. This is called \"free solo\" climbing.\n\nEl Capitan is about 3,000 feet (900 meters) tall. Honnold climbed a route called Freerider, which is very difficult, in under four hours. One mistake would have meant death. His climb was filmed for a documentary called Free Solo, which won an Academy Award in 2019.\n\nScientists were curious about how Honnold's brain works. Before his climb, a neuroscientist named Dr. Jane Joseph put him in a brain scanner. She showed him about 200 scary or disturbing pictures. In most people, a part of the brain called the amygdala becomes very active when they see scary images. This is the brain's normal fear response.\n\nBut when Honnold saw the same pictures, his amygdala did not react at all. A control climber, who was also comfortable with risk, showed a normal fear response. This does not mean Honnold's amygdala is damaged. Scientists think his amygdala simply needs a much stronger signal before it reacts.\n\nThis case is interesting for psychology because it shows that fear is not the same for everyone. Some people may need years of practice, or have unusual brain responses, before they can control fear in dangerous situations.",
B2:"On 3 June 2017, the rock climber Alex Honnold achieved something many considered close to unthinkable: he climbed El Capitan, a nearly 3,000-foot granite cliff in Yosemite National Park, without a rope, harness, or any other safety equipment. This practice, known as free soloing, leaves absolutely no margin for error: a single slip on the Freerider route, which Honnold completed in just under four hours, would almost certainly have been fatal. The climb was documented in Free Solo (2018), a film that went on to win the Academy Award for Best Documentary Feature in 2019.\n\nWhat makes Honnold particularly interesting to scientists, however, is not just his climbing but his brain. Before the El Capitan climb, neuroscientist Dr Jane Joseph, of the Medical University of South Carolina, placed Honnold in an fMRI scanner and showed him roughly 200 images designed to provoke fear or disgust. In most people, this kind of stimulus reliably activates the amygdala, the brain region most closely associated with the fear response. When a control subject, another experienced climber known for taking risks, viewed the same images, his amygdala lit up exactly as expected.\n\nHonnold's amygdala, by contrast, showed no activation whatsoever. Crucially, this does not appear to be the result of any damage or dysfunction; rather, researchers concluded that his amygdala likely requires a far stronger stimulus before it triggers a fear response, a kind of unusually high activation threshold rather than an absence of the mechanism itself.\n\nThis finding matters beyond climbing because it complicates a common assumption in risk psychology: that people who take extreme risks are simply braver, or better at suppressing fear, than everyone else. Honnold's case suggests something subtly different, that fear itself may be processed differently at a neurological level in some individuals, and that years of deliberate practice and mental rehearsal (Honnold reportedly repeats routes hundreds of times before soloing them) may also play a significant role in reducing perceived danger, independent of raw biology.",
C1:"On 3 June 2017, Alex Honnold did something that professional climbers had long regarded as effectively suicidal: he climbed the Freerider route up El Capitan, a nearly 3,000-foot sheer granite face in Yosemite National Park, entirely without rope, harness, or any other form of protection. In free soloing, the margin for error is not merely small but nonexistent: a single misplaced foothold anywhere along the route's several hours of climbing would almost certainly have proven fatal. Honnold completed the ascent in just under four hours, a feat subsequently documented in Free Solo (2018), which won the Academy Award for Best Documentary Feature the following year.\n\nWhat has drawn sustained scientific interest, however, is not merely the audacity of the climb but the apparent peculiarity of Honnold's neurology. Prior to the El Capitan ascent, the neuroscientist Dr Jane Joseph, of the Medical University of South Carolina, placed Honnold in an fMRI scanner and exposed him to roughly 200 images selected to provoke fear, disgust, or arousal, a standard paradigm in affective neuroscience. In the overwhelming majority of subjects, including a control participant in this study who was himself an experienced, risk-tolerant climber, such images reliably activate the amygdala, the brain structure most closely implicated in the generation of fear responses. In Honnold's scan, by contrast, the amygdala showed essentially no activation at all.\n\nIt would be a mistake, though, to read this as evidence of a damaged or absent fear circuit; the researchers were careful to note that Honnold's amygdala appears structurally intact and presumably functions normally under sufficiently intense stimulation. The more plausible interpretation is that his threshold for amygdala activation is simply unusually high: his brain requires a considerably stronger stimulus before registering a threat as such, rather than lacking the capacity to register threat at all.\n\nThis distinction carries some weight for risk psychology more broadly, not least because it challenges the folk assumption that extreme risk-takers are merely people who have learned to override or suppress an otherwise normal fear response through willpower or bravado. Honnold's case suggests, instead, that the underlying neurological wiring may differ meaningfully between individuals, quite apart from any question of discipline. It would, however, be equally reductive to attribute his climbing purely to biology: Honnold is known to rehearse routes with painstaking, almost obsessive repetition, both physically and through mental visualisation, well before attempting them without protection, a degree of preparation that arguably converts an act that looks impulsive from the outside into one that is, from the inside, thoroughly rehearsed and, in his own subjective experience, no longer especially frightening at all.",
C2:"There is a particular kind of vertigo that sets in merely watching footage of Alex Honnold's ascent of El Capitan's Freerider route on 3 June 2017: nearly 3,000 feet of sheer Yosemite granite, climbed without rope, harness, chalk-bag partner, or any margin for the ordinary human fallibility that the rest of us are permitted. Free soloing tolerates no error whatsoever; a single mistimed foothold anywhere across the roughly four hours Honnold spent on the wall would, with grim mathematical certainty, have been fatal. That the climb exists on film at all is owed to Free Solo (2018), the documentary that followed him up to and including the ascent itself, and which duly collected the Academy Award for Best Documentary Feature the following year, a rare instance of Hollywood recognising a plot whose stakes needed no embellishment whatsoever.\n\nWhat has proven rather more durably fascinating to scientists than the climb itself, though, is what appears to be going on, or rather not going on, inside Honnold's skull. In the run-up to the ascent, the neuroscientist Dr Jane Joseph, of the Medical University of South Carolina, placed him inside an fMRI scanner and subjected him to roughly 200 images calibrated, by the standard conventions of affective neuroscience, to provoke fear, disgust, or arousal. In virtually every subject who undergoes this kind of test, including, in Joseph's own study, a control participant who was himself an experienced and self-professedly risk-tolerant climber, such images reliably light up the amygdala, the almond-shaped structure most closely associated with the brain's threat-detection machinery. In Honnold's scan, the amygdala remained, to all appearances, entirely unmoved.\n\nIt would be tempting, and wrong, to read this as evidence that Honnold simply lacks a fear response, some kind of neurological free pass issued at birth. The researchers were at pains to note that his amygdala appears structurally normal and, presumably, would activate given a sufficiently extreme stimulus; what seems to differ is not the presence of the circuitry but its threshold; his brain, for reasons not fully understood, requires considerably more provocation before it registers something as a threat worth flagging. Whether that threshold is innate, or has been recalibrated over years of exposure, remains, appropriately, an open question the study itself cannot settle.\n\nThat ambiguity is, if anything, the more interesting scientific story, because it unsettles a comfortable folk narrative about extreme risk-takers: the assumption that they are ordinary people who have simply learned, through willpower or bravado, to override a fear response the rest of us cannot suppress. Honnold's case gestures toward something rather less flattering to the willpower narrative: that the underlying wiring itself may vary between individuals in ways only partly within anyone's conscious control. And yet it would be equally glib to file the whole matter under pure biology and move on: Honnold is, by every account including his own, an almost pathologically diligent rehearser, repeating routes dozens or hundreds of times on rope before ever attempting them without one, visualising each sequence of moves until the climb has been, in some functional sense, already completed in his mind long before his hands ever touch the rock for real. Whatever the amygdala scan does or does not explain, it is worth remembering that Honnold did not simply show up to El Capitan unafraid; he appears, through years of extraordinarily deliberate practice, to have arrived there having already talked his nervous system out of much of the argument."}},
{id:"vertical-farming",title:"Farming Upward: The Promise and Price of Vertical Farms",tag:"Global · Business",img:"images/reading/vertical-farming.jpg",quiz:{"B1":[{"q":"What do vertical farms often use instead of soil?","o":["Sand and gravel","Hydroponics or aeroponics","Ordinary garden earth","Compost from old plants"],"a":1,"x":"Instead of soil, vertical farms often use hydroponics or aeroponics to feed the plants."},{"q":"According to the text, how much water can vertical farming save compared with normal farming?","o":["Up to 50% less","Up to 75% less","Up to 95% less","Up to 20% less"],"a":2,"x":"Vertical farming can use up to 95% less water than ordinary farming."},{"q":"What happened to the company AeroFarms in June 2023?","o":["It doubled its profits","It filed for bankruptcy","It opened ten new farms","It stopped using LED lights"],"a":1,"x":"AeroFarms filed for bankruptcy in June 2023 after running out of money."}],"B2":[{"q":"Why do vertical farms use up to 95% less water?","o":["They only grow desert plants","Water is recirculated rather than lost","They collect rainwater from roofs","They water crops only once a year"],"a":1,"x":"The big saving comes from recirculating water rather than losing it, the way open fields do."},{"q":"Which crops does the text say remain economically unviable to grow indoors?","o":["Lettuce and herbs","Microgreens","Wheat, rice, or potatoes","Basil and kale"],"a":2,"x":"Staples like wheat, rice or potatoes stay economically unviable indoors. Only high-value greens pay their way."},{"q":"What happened to AeroFarms after its June 2023 bankruptcy filing?","o":["It closed permanently","It emerged as a smaller, restructured private company","It merged with a rival farm","It moved abroad"],"a":1,"x":"AeroFarms didn't vanish after filing. It re-emerged smaller and restructured as a private company."}],"C1":[{"q":"What does the passage identify as the main reason vertical farming has 'faltered'?","o":["Poor plant quality","Energy economics","A lack of investor interest","Disease among the crops"],"a":1,"x":"The faltering comes down to energy economics: lighting and climate control simply cost too much."},{"q":"Why are vertical farms confined mostly to crops like lettuce and herbs?","o":["Customers refuse to buy staple crops","Staple crops generate too little revenue per square foot to justify the energy cost","LEDs cannot grow anything else","Staple crops need soil that is unavailable"],"a":1,"x":"Only leafy greens earn enough per square foot to cover the energy bill. Staples simply don't pay it back."},{"q":"What does the pattern of multiple companies collapsing in 2023 suggest, according to the passage?","o":["The failures were caused by one firm's mismanagement","The sector's core challenge was economic rather than technological","The technology itself does not work","Investors had lost interest in fresh produce"],"a":1,"x":"Several firms failing at once suggests the trouble is economic, not that the technology itself can't work."}],"C2":[{"q":"What is the author's overall attitude toward vertical farming's technical claims?","o":["The claims are largely fraudulent","The technical merits are not seriously disputed","The technology is scientifically impossible","The water savings are exaggerated"],"a":1,"x":"The author doesn't dispute the technical claims. The problem lies in the economics, not the science."},{"q":"The author calls the 'more parsimonious explanation' for the failures the one that is 'less comfortable' for the industry. What is that explanation?","o":["The industry lacked skilled managers","Indoor growing is inherently far more expensive than using natural sunlight","Consumers preferred imported produce","The plants were botanically unsuited to warehouses"],"a":1,"x":"The simpler, less flattering explanation: indoor growing is just inherently costlier than free sunlight."},{"q":"What is the effect of the author's phrase describing growing lettuce 'under a small artificial sun' versus 'the large free one'?","o":["It praises the efficiency of LED technology","It underscores the fundamental cost disadvantage of the model","It suggests sunlight is unreliable","It argues warehouses should be moved outdoors"],"a":1,"x":"Setting a small artificial sun against the large free one drives home the model's basic cost disadvantage."}]},levels:{B1:"Imagine a farm with no soil, no sunlight, and no outdoor fields, just a building filled with stacked shelves of plants growing under bright purple-pink lights. This is called vertical farming.\n\nVertical farms grow food indoors, often in old warehouses inside or near cities. Instead of soil, many use hydroponics (growing plants in water with nutrients) or aeroponics (spraying plant roots with a nutrient mist). Special LED lights replace sunlight, and computers control temperature, humidity, and light for the plants.\n\nSupporters say vertical farming has big advantages. It can use up to 95% less water than normal farming. It does not need fertile land, so it can be built almost anywhere, even in a city. Crops can grow all year, whatever the weather outside, and because the farm is close to customers, the food travels a much shorter distance to reach shops.\n\nHowever, vertical farming also has serious problems. Running bright lights and climate control systems 24 hours a day uses a huge amount of electricity, which is very expensive. Most vertical farms can only grow profitable crops like lettuce and herbs, not basic foods like wheat or potatoes.\n\nThese problems have caused real failures. AeroFarms, a well-known vertical farming company based in Newark, New Jersey, filed for bankruptcy in June 2023 after running out of money. Its story shows that even good technology does not always mean a good business.",
B2:"Picture a farm with no fields, no soil, and no weather at all: just a converted warehouse filled with stacked trays of plants, growing under rows of pink and purple LED lights. This is vertical farming, an approach to agriculture that has attracted enormous investment over the past decade, along with growing scepticism about whether it actually works as a business.\n\nVertical farms typically rely on hydroponics, in which plants grow in nutrient-rich water rather than soil, or aeroponics, in which roots are suspended in air and periodically misted with a nutrient solution. LED lighting, tuned to the specific wavelengths plants use for photosynthesis, replaces sunlight entirely, while sensors and software control temperature and humidity with far more precision than any outdoor farm could manage.\n\nThe claimed benefits are genuinely striking. Some vertical farms report using up to 95% less water than conventional agriculture, largely because water is recirculated rather than lost to evaporation or runoff. Because no fertile soil is required, farms can be built inside cities, cutting transport distances and, in principle, delivering fresher produce. Crops can also be harvested year-round, entirely independent of season or weather.\n\nDespite this, the economics of vertical farming have proven far harder than early enthusiasts expected. Running intense lighting and climate-control systems around the clock consumes enormous quantities of electricity, and energy costs have eaten into margins that were already thin. As a result, most vertical farms are limited to high-value, fast-growing crops such as lettuce, herbs, and microgreens; staple foods like wheat, rice, or potatoes remain economically unviable indoors.\n\nThese pressures came to a head in 2023, when several prominent vertical farming companies collapsed. AeroFarms, based in Newark, New Jersey and once considered an industry leader, filed for Chapter 11 bankruptcy in June 2023, citing an inability to raise sufficient capital, before emerging later that year as a smaller, restructured private company. Its difficulties illustrate a broader lesson: impressive technology does not automatically translate into a profitable business model.",
C1:"Strip away the marketing imagery and vertical farming amounts to a fairly radical proposition: agriculture with no fields, no soil, no sunlight, and no weather, crops grown instead on stacked trays inside converted warehouses, nourished by nutrient-laced water and illuminated by banks of LEDs tuned to the precise wavelengths photosynthesis requires. It is an idea that attracted several billion dollars of investment over the past decade, buoyed by genuinely compelling claims, and it has more recently met a rather harsher reckoning with the economics those claims tend to gloss over.\n\nThe technical case is not in serious dispute. Most vertical farms rely on hydroponics, in which plant roots sit in circulating, nutrient-enriched water rather than soil, or on the more advanced aeroponic method, in which roots hang in air and are periodically misted with nutrient solution, a technique AeroFarms, among others, built much of its reputation on. Because water is recirculated rather than lost to evaporation or runoff, some operators have reported water savings of up to 95% relative to conventional field agriculture. Because no arable land is required, farms can, in principle, be sited inside the cities they supply, shortening transport chains and delivering fresher produce. And because the growing environment is fully controlled, harvests need not pause for winter, drought, or pests, enabling year-round yields many multiples higher, per square foot, than any open field could support.\n\nWhere the model has faltered, rather more consistently than its early champions anticipated, is in energy economics. Running high-intensity grow lights and precision climate control around the clock is extraordinarily power-hungry, and electricity costs have proven difficult to offset through efficiency gains alone. This has, in practice, confined most vertical farms to a narrow band of high-margin, fast-turnover crops, lettuce, herbs, and microgreens chiefly, since staple caloric crops such as wheat, rice, or potatoes generate nowhere near enough revenue per square foot to justify the energy expenditure required to grow them indoors.\n\nThese structural pressures culminated, rather dramatically, in 2023, a year that amounted to something of a reckoning for the industry. AeroFarms, the Newark, New Jersey-based company long held up as a flagship of the sector, filed for Chapter 11 bankruptcy protection on 8 June 2023, having been unable to raise sufficient capital amid significant industry-wide headwinds; it emerged that September as a smaller, restructured private enterprise, with its co-founder and chief executive stepping down in the process. AeroFarms was far from alone; several other prominent vertical farming ventures folded around the same period, a pattern that suggests the sector's central challenge was never really technological, but rather whether controlled-environment agriculture could ever be reconciled with the blunt arithmetic of an electricity bill.",
C2:"Strip away the gauzy marketing renders, the walls of impossibly clean, humming green, and vertical farming turns out to be a fairly audacious wager: that agriculture can be conducted with no fields, no soil, no sunlight, and no weather, and that a warehouse full of stacked trays, nutrient-laced water, and LED lighting tuned to the precise wavelengths chlorophyll finds useful might out-farm a farm. It is an idea that has, over roughly the past decade, attracted several billion dollars of venture capital on the strength of genuinely compelling numbers, and which has, more recently, run headlong into the rather less forgiving arithmetic of an electricity bill.\n\nOn the technical merits, there is little to dispute. Most operations run on hydroponics, roots bathed in circulating, nutrient-enriched water rather than planted in soil, or on the more elaborate aeroponic method, in which roots dangle in open air and are periodically misted with solution, a technique the Newark-based firm AeroFarms built much of its early reputation refining. Because water recirculates rather than evaporating or running off, some operators have claimed reductions in water use of up to 95% relative to conventional field agriculture, a figure not seriously disputed on technical grounds. Because no arable land is required, such farms can, in theory, be tucked inside the very cities whose supermarkets they supply, compressing transport chains that ordinarily stretch across continents into a matter of miles. And because the growing environment answers to a thermostat rather than to weather, harvests need not defer to winter, drought, or blight, yielding, on paper, output per square foot that dwarfs anything an open field could manage across an equivalent year.\n\nWhere the sector has come unstuck, and rather more comprehensively than its early evangelists seem to have anticipated, is economics rather than agronomy. Running high-intensity grow lights and precision climate control twenty-four hours a day is a staggeringly power-hungry undertaking, and energy costs have proven stubbornly resistant to the kind of efficiency gains that might have rescued the unit economics. The practical consequence has been a narrowing of ambition: rather than the wheat, rice, or potatoes that actually feed populations at scale, vertical farms have found themselves confined almost entirely to fast-turnover, high-margin greens and herbs, lettuce, kale, basil, microgreens, crops whose retail price per gram can plausibly absorb an electricity bill that a staple grain never could.\n\nThat mismatch between technological promise and financial reality came to a head, with almost theatrical timing, in 2023, a year that amounted to something like an industry-wide reckoning. AeroFarms itself, long treated as the sector's flagship, filed for Chapter 11 bankruptcy protection on 8 June 2023 after failing to raise sufficient capital against significant headwinds facing the industry; it re-emerged that September as a smaller, privately restructured company, its founding chief executive having stepped down in the interim. It was, notably, not alone: several other prominent vertical farming ventures collapsed within the same twelve months, which rather undercuts any theory pinning the failures on one company's mismanagement. The more parsimonious explanation, and the less comfortable one for an industry built on the promise of reinventing agriculture from first principles, is that the central obstacle was never really botanical: it was that growing lettuce under a small artificial sun is, and perhaps always will be, considerably more expensive than growing it under the large free one."}},
{id:"tulip-mania",title:"Tulip Mania: The World's First Financial Bubble?",tag:"Netherlands · History",img:"images/reading/tulip-mania.jpg",quiz:{"B1":[{"q":"Where did tulips originally come from?","o":["The Dutch Republic","The Ottoman Empire","France","England"],"a":1,"x":"Tulips weren't originally Dutch. They came from the Ottoman Empire."},{"q":"How much did the famous Semper Augustus bulb reportedly sell for?","o":["About 150 guilders","About 600 guilders","About 6,000 guilders","About 60 guilders"],"a":2,"x":"The Semper Augustus bulb reportedly sold for about 6,000 guilders, more than a canal house."},{"q":"What did the historian Anne Goldgar discover about the tulip crash?","o":["It destroyed the entire Dutch economy","It was real but much smaller than the famous story suggests","It never actually happened","It made most merchants very rich"],"a":1,"x":"Goldgar found the crash was real but far smaller than the legend claims, hurting only a limited group."}],"B2":[{"q":"What actually caused the prized 'flamed' or striped petals?","o":["Special soil","A virus that infected the bulb","Careful breeding by farmers","Cold winter weather"],"a":1,"x":"Those prized striped petals were caused by a virus in the bulb, though nobody understood that at the time."},{"q":"What was 'windhandel' or 'wind trade'?","o":["Selling tulips only on windy days","Trading futures contracts for bulbs still in the ground","Shipping bulbs abroad by sea","Growing tulips in greenhouses"],"a":1,"x":"Windhandel meant trading futures, promises on bulbs still in the ground rather than on the flowers themselves."},{"q":"What did Anne Goldgar's research into the archives find about the trade?","o":["It bankrupted thousands of ordinary people","It was largely confined to a small, tightly-knit network of merchants and craftsmen","It involved the entire Dutch population","It continued for over a century"],"a":1,"x":"The archives showed the trade stayed within a small, close network of merchants and craftsmen, not the whole nation."}],"C1":[{"q":"What distinguished the later stages of the craze, according to the passage?","o":["The tulips grew much larger","The emergence of a derivatives market in contracts traded in taverns","The government began taxing tulips","Bulbs were shipped to other countries"],"a":1,"x":"The later craze was marked by a derivatives market, with contracts changing hands in taverns."},{"q":"How does Goldgar's work relate to the claim that a bubble occurred?","o":["It denies any bubble happened","It does not deny a bubble, but questions whether 'mania' is the right word","It proves the bubble was larger than thought","It shows prices never actually rose"],"a":1,"x":"Goldgar doesn't deny a bubble. She questions whether the word 'mania' really fits what happened."},{"q":"What is the passage's closing point about 'our best-known cautionary tales'?","o":["They are always completely accurate","They can owe as much to storytelling as to economic fact","They should be ignored entirely","They only apply to the tulip trade"],"a":1,"x":"The closing point: famous cautionary tales can owe as much to good storytelling as to economic fact."}],"C2":[{"q":"What does the author suggest the popularity of the tulip story reveals?","o":["That the Dutch economy was fragile","Our appetite for cautionary fables","That flowers were overvalued in the 1600s","That archives are unreliable"],"a":1,"x":"The story's lasting popularity, the author suggests, reveals our appetite for neat cautionary fables."},{"q":"How does the author characterise the 'kernel of truth' in the traditional story?","o":["It is entirely false","It is substantial enough - certain bulbs did command extraordinary sums","It applies only to the Semper Augustus","It was invented by Charles Mackay"],"a":1,"x":"The kernel of truth is real: certain bulbs genuinely fetched extraordinary sums, even if the wider panic is overblown."},{"q":"According to the passage, what is Goldgar's central 'point'?","o":["That nothing at all happened in 1637","That what happened was comparatively modest, not a macroeconomic catastrophe","That the Dutch economy collapsed completely","That tulips were never valuable"],"a":1,"x":"Goldgar's central point is that the episode was comparatively modest, not the economy-wrecking catastrophe of legend."}]},levels:{B1:"In the 1630s, something strange happened in the Dutch Republic. People began paying enormous sums of money for tulip bulbs. Tulips were not originally Dutch. They came from the Ottoman Empire, and a botanist named Carolus Clusius planted the first bulbs in the city of Leiden in the 1590s. Soon, wealthy Dutch families wanted rare tulips for their gardens, especially bulbs with beautiful striped petals. (We now know a plant virus caused these stripes, but nobody understood that in the 1630s.)\n\nBy the winter of 1636, people were trading 'futures contracts' for tulip bulbs, promises to buy a bulb later, at a price fixed today, while the bulb was still under the ground. Prices climbed fast. One famous bulb, called Semper Augustus, reportedly sold for around 6,000 guilders. A skilled craftsman earned about 150 guilders a year, so a single bulb could cost more than a house on an Amsterdam canal.\n\nThen, in February 1637, the market suddenly collapsed. At an auction in the city of Haarlem, buyers simply stopped bidding, and prices fell within days.\n\nFor centuries, people believed this crash destroyed the Dutch economy. However, the historian Anne Goldgar spent years reading original 17th-century documents. She discovered that the panic was real, but much smaller than the famous story suggests. It mainly hurt a limited group of merchants, not the whole nation.",
B2:"In the winter of 1636-37, the Dutch Republic experienced what many call the world's first speculative bubble: a frenzied market in tulip bulbs. Tulips had arrived in Europe from the Ottoman Empire, and the botanist Carolus Clusius established the first significant collection in Leiden in the 1590s. Within decades, tulips had become a status symbol among the wealthy merchant class of the Dutch Golden Age, particularly bulbs displaying dramatic 'flamed' or striped petals, a pattern, unknown to contemporaries, actually caused by a virus that infected the bulb even as it made it more desirable.\n\nAs the craze intensified, trading moved beyond physical bulbs to futures contracts, nicknamed windhandel ('wind trade'), in which buyers agreed to purchase bulbs still in the ground at a fixed future price. This allowed speculation without anyone ever needing to see, let alone possess, an actual tulip. Prices reached extraordinary heights: a single bulb of the prized Semper Augustus variety is reported to have sold for around 6,000 guilders, at a time when a skilled artisan might earn 150-300 guilders annually, meaning one bulb could be worth more than a comfortable Amsterdam canal house.\n\nThe bubble burst abruptly on 5 February 1637, when a routine bulb auction in Haarlem failed to attract bidders. Confidence evaporated almost overnight, and prices in many contracts collapsed within days.\n\nPopular history, largely drawing on Charles Mackay's sensational 1841 account, has long portrayed tulip mania as a national catastrophe that bankrupted thousands and shook the Dutch economy to its foundations. However, the historian Anne Goldgar, having examined notarial archives, guild records and court documents, has argued this picture is considerably exaggerated. Although the speculative frenzy was genuine, she found little evidence of widespread ruin; the trade was largely confined to a relatively small, tightly-knit network of merchants and skilled craftsmen. As a result, tulip mania survives today less as an economic catastrophe than as a cultural parable about the psychology of speculative bubbles.",
C1:"Few episodes in economic history have generated as much myth-making as the Dutch tulip mania of 1636-37, popularly cited as the first recorded speculative bubble in a market economy. Tulips reached the Low Countries from Ottoman gardens in the sixteenth century, and it was the botanist Carolus Clusius, working in Leiden, who cultivated the first notable collection in the 1590s. Within a generation, tulips (particularly bulbs exhibiting the striking 'flamed' petal patterns we now know result from a virus infection) had become coveted emblems of taste and wealth among the merchant elite of the Dutch Golden Age.\n\nWhat distinguished the later stages of the craze was not merely high prices but the emergence of a derivatives market: contracts, traded informally in tavern-based 'colleges', allowed speculators to buy and sell bulbs still dormant in the soil, months before delivery. This windhandel, or 'wind trade', meant fortunes could change hands without a single bulb ever being exchanged. Prices for the most sought-after varieties reached dizzying levels; the legendary Semper Augustus bulb is said to have fetched sums in the region of 6,000 guilders (arguably closer to 10,000 at the very peak, by some accounts) dwarfing the annual wage of 150 to 300 guilders earned by a skilled craftsman, and rivalling the price of a well-appointed house on an Amsterdam canal.\n\nThe collapse, when it came, was abrupt rather than gradual: at a routine bulb auction in Haarlem on 5 February 1637, bidders simply failed to appear, and confidence in the market unravelled within days.\n\nIt is this collapse, and the ruin supposedly wrought by it, that has attracted the most sustained historical revisionism. The popular account (descended largely from Charles Mackay's colourful, moralising 1841 history) depicts a mania that swept through Dutch society indiscriminately, bankrupting chimney sweeps and aristocrats alike. The economic historian Anne Goldgar, drawing on an exhaustive trawl through notarial records, guild archives and court proceedings, has persuasively challenged this narrative. Her research suggests the speculative trade, while genuine and at times reckless, was confined to a comparatively small and socially interconnected circle of merchants, master craftsmen and florists, not, as legend has it, the entire Dutch population. Crucially, she found scant evidence of the mass bankruptcies so central to the traditional story. Goldgar's work does not deny that a bubble occurred; rather, it questions whether 'mania' is the right word for what may have been a more contained, if still irrational, episode of market speculation, a reminder that even our best-known cautionary tales can owe as much to storytelling as to economic fact.",
C2:"That the Dutch Republic's tulip craze of 1636-37 has become economic shorthand for irrational exuberance says as much about our appetite for cautionary fables as it does about seventeenth-century horticulture. The story, as commonly told, runs thus: a flower imported from Ottoman gardens (cultivated in the Netherlands from the 1590s onward, notably by the Leiden botanist Carolus Clusius) became, within a few decades, an object of such feverish desire that otherwise sober Dutch burghers mortgaged their homes to acquire single bulbs, only to be ruined en masse when the market inexplicably collapsed. It is a satisfyingly tidy morality tale, endlessly recycled by financial journalists whenever a new bubble looms. The trouble is that, on closer archival inspection, it turns out to be only partly true.\n\nThe kernel of truth is substantial enough. Certain bulbs, above all those displaying the dramatic 'flamed' or 'broken' petal patterns we now attribute to a virus infection (a fact entirely opaque to contemporaries, who prized the effect without understanding its cause), commanded genuinely extraordinary sums. The Semper Augustus, the most celebrated variety of all, is reputed to have changed hands for something in the order of 6,000 guilders, a figure that, set against a skilled artisan's annual wage of perhaps 150 to 300 guilders, or against the price of a substantial Amsterdam canal house, was frankly absurd. By late 1636, trading had migrated from actual bulbs to futures contracts on bulbs still dormant underground, a practice wryly dubbed windhandel, or 'trade in wind', speculation, in other words, on an asset nobody involved needed ever to see. When the market seized up, at a lacklustre bulb auction in Haarlem on 5 February 1637, it did so with theatrical suddenness: bidders simply stopped showing up, and prices for many contracts evaporated within a matter of days.\n\nWhere the popular narrative overreaches, however, is in its account of the aftermath. That version (inherited largely from Charles Mackay's gleefully moralising Extraordinary Popular Delusions and the Madness of Crowds (1841)) depicts a bubble so vast and so democratic that it beggared the entire nation, chimney sweeps and merchant princes alike. The economic historian Anne Goldgar has spent a career quietly dismantling this picture. Sifting through notarial deeds, guild records and the minutes of court disputes, she found remarkably few instances of the catastrophic bankruptcies the legend requires; what she uncovered instead was a bubble real enough in its mechanics, but socially contained, confined largely to a networked coterie of well-off merchants, master craftsmen and professional florists who, crucially, mostly went on trading, marrying and doing business with one another much as before. Goldgar's point is not that nothing happened in 1637; it is that what happened was, in the scheme of national catastrophes, comparatively modest, a shock to reputation and trust within a tight-knit commercial community, rather than the macroeconomic conflagration of legend. Whether one finds this revisionism reassuring or faintly deflating is, perhaps, beside the point; either way, it is a useful corrective for anyone tempted to reach for tulip mania as an uncomplicated parable, whenever the next speculative asset (bulbs, dot-coms, or otherwise) comes untethered from anything resembling its underlying worth."}},
{id:"tenochtitlan-engineering",title:"Tenochtitlan: The Engineering of an Island Capital",tag:"Mexico · History",img:"images/reading/tenochtitlan-engineering.jpg",quiz:{"B1":[{"q":"In what year did the Aztecs found Tenochtitlan?","o":["1519","1325","1521","1590"],"a":1,"x":"The Aztecs founded the city in 1325. Don't be fooled: 1519 is when Cortes arrived, and 1521 is when it fell."},{"q":"What was a chinampa?","o":["A type of Aztec temple","A small artificial island for growing crops","A wooden bridge","A kind of boat"],"a":1,"x":"Farmers built small artificial islands from mud and plants to grow corn, beans and vegetables. Not a temple, not a boat."},{"q":"Why did the Aztecs build an aqueduct from Chapultepec?","o":["To defend the city from attack","To carry clean drinking water into the city","To connect the city to the mainland","To drain the lake"],"a":1,"x":"The lake itself was partly salty, so they piped fresh water from Chapultepec to give the city something clean to drink."}],"B2":[{"q":"Why were chinampas so productive?","o":["They floated freely on the lake","They were constantly enriched by nutrients from the surrounding water","They used imported fertiliser","They were watered only in the rainy season"],"a":1,"x":"The plots were 'constantly enriched by nutrients from the surrounding water'. Notice they were fixed, not floating, so that option is out."},{"q":"Why did the causeways have removable wooden bridges?","o":["To let large ships pass","So they could be pulled up for defence","To save on building materials","To collect tolls from travellers"],"a":1,"x":"The bridges could be pulled up for defence, letting the Aztecs cut the city off from the mainland whenever they were attacked."},{"q":"Why did the Chapultepec aqueduct use a double-pipe system?","o":["To carry twice as much salt water","So one channel could be cleaned while the other stayed in use","To supply two different cities","To make the water flow faster"],"a":1,"x":"Two channels meant one pipe could be cleaned while the other kept flowing, so the water supply never stopped. Clever, really."}],"C1":[{"q":"What does the passage argue Tenochtitlan's growth was most a testament to?","o":["Fortunate natural circumstances","Sustained, deliberate engineering","Military conquest of neighbours","Trade with Europe"],"a":1,"x":"The city's rise was a testament 'less to fortunate circumstance than to sustained, deliberate engineering'. Planning wins over luck or conquest here."},{"q":"According to the passage, what allowed the willow posts to anchor the chinampas in place?","o":["Heavy stones tied to them","Their root systems gradually gripping the lakebed","Ropes attached to the shore","The weight of the crops"],"a":1,"x":"Those willow posts had 'root systems whose roots gradually anchored the structure in place', gripping the lakebed. Not weighted, not roped."},{"q":"Why does the passage say the conquistadors' astonishment is especially telling?","o":["Because they had never left Spain before","Because it came from soldiers who had already seen much of the wider world","Because they were easily impressed by any city","Because they had read about the city beforehand"],"a":1,"x":"Their amazement came from men who had already seen a good deal of the world, which makes their wonder count for more."}],"C2":[{"q":"What 'irony' does the author highlight at the start of the passage?","o":["The Aztecs disliked engineering","A sophisticated engineering project arose on a site that looked like nowhere to build a capital","The Spanish were poor engineers","The lake was actually full of fresh water"],"a":1,"x":"Here's the irony: such advanced engineering rose on a swampy island that looked like nowhere sensible to build a capital."},{"q":"How does the author regard the double-channel aqueduct design?","o":["As wasteful over-engineering","As unglamorous redundancy that separates functional from merely impressive infrastructure","As a purely decorative feature","As a Spanish addition after 1521"],"a":1,"x":"The author calls it the unglamorous redundancy that separates genuinely functional infrastructure from the merely impressive-looking sort."},{"q":"How does the author suggest the conquistadors' astonishment should be read?","o":["As naive hyperbole","As a reasonably calibrated response to something genuinely without precedent","As deliberate exaggeration for their king","As fear of the unknown"],"a":1,"x":"Read their wonder not as naive hyperbole but as a fair response to something truly without precedent in their experience."}]},levels:{B1:"In 1325, the Aztec people (also called the Mexica) founded a city called Tenochtitlan. They built it on an island in Lake Texcoco, in the middle of what is now Mexico City. This might sound like a strange place for a city, but the Aztecs turned it into one of the biggest and most impressive cities in the world at that time.\n\nOne clever idea was the chinampa, sometimes called a 'floating garden'. Farmers built small artificial islands from mud and plants, tied to the lake bed with wooden poles. These chinampas were extremely fertile, so farmers could grow several harvests of corn, beans, and vegetables every year.\n\nBecause the city was surrounded by water, the Aztecs built three long causeways (raised roads) to connect it to the mainland. They also needed fresh water, since the lake itself was partly salty. So they built an aqueduct (a kind of water channel) from the hill of Chapultepec to carry clean drinking water into the city.\n\nBy 1519, when the Spanish explorer Hernán Cortés arrived, Tenochtitlan may have had 200,000 people or more, making it larger than most European cities of the time, including London or Paris. The Spanish soldiers were amazed. One of them, Bernal Díaz del Castillo, later wrote that the city seemed like something from a fantasy story.\n\nSadly, the Spanish conquered and destroyed the city in 1521.",
B2:"When the Mexica people founded Tenochtitlan in 1325, they chose, by most conventional standards, a poor location for a capital city: a swampy, uninhabited island in the middle of Lake Texcoco. Within two centuries, however, they had transformed it into one of the largest and most sophisticated cities on Earth, a feat of urban engineering that left the invading Spanish almost speechless with astonishment.\n\nCentral to this achievement was the chinampa system, often romantically described as 'floating gardens', although in practice they were fixed rather than floating. Farmers built up small rectangular plots from layers of lake mud, decaying vegetation and reeds, anchoring them to the shallow lakebed with willow stakes. The result was extraordinarily fertile land, constantly enriched by nutrients from the surrounding water, which allowed several harvests a year of maize, beans, squash and chillies, enough, by some estimates, to help feed a population that may have exceeded 200,000 people.\n\nSince the city sat entirely surrounded by water, the Mexica engineered three major causeways linking it to the mainland, wide enough for pedestrian and canoe traffic and interrupted by removable wooden bridges that could be pulled up for defence. Fresh water posed a separate challenge, as Lake Texcoco was partly brackish; the solution was the Chapultepec aqueduct, which channelled spring water from the hill of Chapultepec into the city via a double-pipe system, allowing one channel to be cleaned while the other remained in use.\n\nWhen Hernán Cortés and his men reached the city in 1519, they reportedly could barely believe what they were seeing. The conquistador-chronicler Bernal Díaz del Castillo later compared the sight to the enchanted cities of chivalric romance novels, remarking that some of his companions wondered whether it was all a dream. As a result, Tenochtitlan is now widely regarded, alongside contemporary European capitals like London and Paris, as one of the great urban achievements of the pre-modern world, despite its eventual destruction by the Spanish in 1521.",
C1:"Few pre-modern cities illustrate the ingenuity of hydraulic engineering quite as vividly as Tenochtitlan, the Mexica (Aztec) capital founded, according to tradition, in 1325 on a modest island in the brackish expanse of Lake Texcoco. That a settlement built on what was, by any reasonable assessment, inhospitable marshland should become (within roughly two centuries) one of the largest cities on the planet is a testament less to fortunate circumstance than to sustained, deliberate engineering.\n\nThe foundation of this achievement was agricultural: the chinampa system, popularly if somewhat imprecisely known as 'floating gardens'. Rather than actually floating, chinampas were constructed plots built up from alternating layers of lake sediment and decomposing vegetation, staked into the shallow lakebed with willow posts whose root systems gradually anchored the structure in place. The nutrient-rich, constantly irrigated soil this produced permitted a remarkable intensity of cultivation (potentially several harvests annually of maize, beans, squash and chilies) and it was arguably this agricultural surplus, as much as any political or military factor, that allowed the city's population to swell to an estimated 200,000 or more by the early sixteenth century, a figure that, if accurate, would have made it comparable to or larger than contemporary London or Paris.\n\nPhysically connecting an island city of this scale to the mainland required equally deliberate solutions. Three principal causeways, wide enough to carry substantial pedestrian and canoe traffic, linked Tenochtitlan to the lakeshore, their spans interrupted at intervals by removable wooden bridges that could be withdrawn to isolate the city in the event of attack. Potable water presented a separate difficulty, given the lake's partly saline composition; the Mexica addressed this with the Chapultepec aqueduct, an engineered channel bringing fresh spring water from the hill of Chapultepec into the city centre via a dual-conduit design that allowed one pipe to be cleaned or repaired while the other remained operational.\n\nIt is little wonder, then, that when Hernán Cortés and his expedition first glimpsed the city in 1519, the encounter left a lasting impression on the Spanish chroniclers. Bernal Díaz del Castillo, writing decades later, recalled that some of his companions asked whether what they were seeing was real, so closely did it resemble the enchanted cities described in chivalric romances. That such astonishment came from soldiers who had already seen a good deal of the wider world only underscores how genuinely exceptional Tenochtitlan's engineering was, a fact easily obscured by the city's eventual and comprehensive destruction during the Spanish siege of 1521.",
C2:"There is a certain irony, not lost on modern historians of urban planning, in the fact that one of the most sophisticated hydraulic engineering projects the pre-industrial world ever produced arose on a site that, to any reasonable observer in 1325, would have looked like precisely nowhere to build a capital city: a reed-choked, seasonally flooded island in the brackish waters of Lake Texcoco, offering neither arable land nor fresh water nor any obvious strategic advantage. That the Mexica (better known, if imprecisely, as the Aztecs) nonetheless transformed this unpromising site into Tenochtitlan, a metropolis whose population may have exceeded 200,000 by the early sixteenth century, rivalling or surpassing contemporary London and Paris, owes rather less to myth (the eagle-on-a-cactus foundation legend notwithstanding) than to several generations of unglamorous, cumulative civil engineering.\n\nThe foundation of the city's prosperity, quite literally, was the chinampa: an agricultural technology too often flattened in popular retelling into the picturesque but misleading phrase 'floating garden'. Chinampas did not float. They were painstakingly constructed plots, built up in alternating layers of lake mud and decomposing reeds, staked to the shallow lakebed with willow posts whose roots, over time, fused the whole structure into fixed, astonishingly fertile land, perpetually irrigated by the surrounding canals and capable, by most modern estimates, of yielding several harvests a year of maize, beans, squash and chilies. It is not too much to say that the chinampas were what made the city's improbable population density possible in the first place; without them, the demographic figures that so astonished sixteenth-century observers would simply not add up.\n\nConnecting an island metropolis of this scale to the mainland, and supplying it with water fit to drink, demanded solutions of comparable ambition. Three broad causeways, sturdy enough to bear substantial foot and canoe traffic, radiated out to the lakeshore, each punctuated by removable timber bridge sections that could be lifted to isolate the city during military threat, a design feature the Spanish would come to appreciate rather too intimately during the siege of 1521. Because Lake Texcoco itself was partly saline, drinking water had to be imported via the Chapultepec aqueduct, an engineered conduit running from freshwater springs on the hill of Chapultepec into the city's core, built with a double-channel design so that one pipe could be scoured and repaired without interrupting supply from the other, the kind of unglamorous redundancy engineering that tends to separate genuinely functional infrastructure from merely impressive-looking infrastructure.\n\nIt is against this backdrop that the famous astonishment of the conquistadors, on first sighting the city in November 1519, deserves to be read not as naive hyperbole but as a reasonably calibrated response to something genuinely without precedent in their experience. Bernal Díaz del Castillo, setting down his recollections decades after the fact, recorded that several of his companions wondered aloud whether they were dreaming, so closely did the causeways, temples and canals resemble the enchanted cities of chivalric fiction. Coming from men who had, by 1519, already traversed a fair portion of the known world, this was no small admission, and it is one that the city's total destruction a mere two years later, in the rubble-strewn aftermath of the 1521 siege, makes all the more poignant in retrospect."}},
{id:"deepfakes-liars-dividend",title:"Deepfakes and the Death of 'Seeing Is Believing'",tag:"Global · Technology",img:"images/reading/deepfakes-liars-dividend.jpg",quiz:{"B1":[{"q":"What are 'deepfakes'?","o":["Real videos that have been deleted","Fake videos that look extremely real","A type of camera","Old black-and-white films"],"a":1,"x":"Deepfakes are fake videos that look extremely real, made by new technology. Not deleted footage, and not a camera."},{"q":"In the GAN method, what do the two computer programs do?","o":["They work together to store data","They compete against each other, one making fakes and one spotting them","They translate languages","They edit real photographs"],"a":1,"x":"One program makes the fake, the other tries to spot it, and they keep competing until the fakes get very hard to catch."},{"q":"What happened to the finance worker at Arup in Hong Kong in February 2024?","o":["He discovered the deepfakes and stopped the fraud","He was tricked into sending around $25 million to criminals","He created the deepfakes himself","He refused to join the video call"],"a":1,"x":"He joined a video call full of deepfaked colleagues and was fooled into sending about $25 million to criminals."}],"B2":[{"q":"How do diffusion models create an image?","o":["By copying an existing photograph exactly","By starting from random visual noise and refining it into a realistic image","By combining two real videos","By scanning a printed picture"],"a":1,"x":"Diffusion starts from random noise and slowly refines it into a realistic image. It doesn't copy a real photo."},{"q":"Who coined the term 'liar's dividend'?","o":["Employees at Arup","Legal scholars Robert Chesney and Danielle Citron","The company's Chief Financial Officer","The creators of the first GAN"],"a":1,"x":"The phrase belongs to legal scholars Robert Chesney and Danielle Citron. Not Arup staff, and not the GAN inventors."},{"q":"What is the 'liar's dividend' problem?","o":["Deepfakes are too expensive to make","People can dismiss real, incriminating footage as fake","Discriminators always beat generators","Video calls are becoming less common"],"a":1,"x":"Because deepfakes exist, people caught on genuine footage can now claim it's fake to escape blame. That's the liar's dividend."}],"C1":[{"q":"According to the passage, why does each network in a GAN keep improving?","o":["Because engineers manually adjust them daily","Because each improves in response to the other's performance","Because they share the same training data as diffusion models","Because they are rewarded with more computing power"],"a":1,"x":"Each network improves in response to the other's performance. It's an arms race, pushing the fakes toward ever greater realism."},{"q":"Why is the Arup case 'widely cited', according to the passage?","o":["It was the first ever deepfake","It is a benchmark for how convincingly the technology can be weaponised against corporate verification","It was quickly reversed by the bank","It involved only audio, not video"],"a":1,"x":"It's a benchmark for how convincingly the technology can already be turned against normal corporate verification. Not the first-ever fake."},{"q":"Why does the passage suggest detection software cannot fully solve the liar's dividend?","o":["Software is too slow to run in real time","It cannot restore a public's instinctive trust once systematically undermined","The software is too expensive for courts","Fabricators refuse to use it"],"a":1,"x":"No detection software can rebuild a public's instinctive trust once that trust has been systematically undermined. That's the real bind."}],"C2":[{"q":"Why does the author explain the mechanics of deepfakes?","o":["To help readers build their own","Because they explain why detection has proven a persistently losing battle","To criticise the engineers who invented them","To show the technology is harmless"],"a":1,"x":"The mechanics matter because they explain why detection has been such a persistently losing battle. Not to help you build fakes."},{"q":"What does the author identify as deepfakes' potentially 'most consequential legacy'?","o":["The financial cost of fraud like the Arup case","A subtler, diffuse erosion of trust - the liar's dividend","The flickering artefacts in early fakes","The competition between generators and discriminators"],"a":1,"x":"The deepest legacy may not be fraud like Arup, but a subtler, diffuse erosion of trust: the liar's dividend."},{"q":"What does the author mean by calling the technology's most corrosive effect 'asymmetrical to its most obvious one'?","o":["Fakes are easier to make than to detect","The deeper harm is not that we distrust what we see, but that we distrust each other's insistence it was real","The technology helps liars more than honest people financially","Video is more affected than audio"],"a":1,"x":"The deeper harm isn't doubting what we see, but doubting each other's insistence that what we saw was real."}]},levels:{B1:"For most of history, if you saw a video of someone doing or saying something, you could believe it was real. Today, that is no longer completely true. New technology called 'deepfakes' can create fake videos that look extremely real.\n\nHow does this work? One common method uses something called a GAN (Generative Adversarial Network). This is actually two computer programs working against each other. One program tries to create a fake image or video. The other program tries to spot the fake. They keep competing, and over time, the fake images become harder and harder to detect. Newer tools use a different method called 'diffusion', which starts with random noise and slowly turns it into a realistic image, guided by huge amounts of training data.\n\nThis technology has already caused real harm. In February 2024, a finance worker at a company called Arup, in Hong Kong, joined a video call with people who looked and sounded exactly like his company's Chief Financial Officer and other colleagues. They were not real. They were deepfakes. He was tricked into sending around $25 million to criminals.\n\nThere is also a bigger problem, sometimes called the 'liar's dividend'. Because deepfakes exist, people can now claim that real videos are fake, to escape blame. This makes it harder for everyone to trust any video at all, real or fake.",
B2:"For most of human history, video and photographic evidence carried an almost unquestioned authority: if you could see it happen on screen, you could generally believe it. That assumption is now under serious threat from deepfakes, synthetic media, usually video or audio, generated by artificial intelligence to convincingly imitate real people saying or doing things they never actually said or did.\n\nAt a basic level, much deepfake technology relies on generative adversarial networks, or GANs, in which two neural networks are trained in competition with one another. One network, the 'generator', produces fake images, while the other, the 'discriminator', attempts to distinguish these fakes from real examples. As the two systems repeatedly challenge each other, the generator gradually improves until its output becomes difficult even for the discriminator to detect. More recently, diffusion models (the technology underlying many popular image generators) have taken a different approach, starting from random visual noise and progressively refining it into a coherent, realistic image based on patterns learned from vast training datasets.\n\nThe consequences are no longer hypothetical. In February 2024, an employee at the engineering firm Arup's Hong Kong office was deceived into authorising 15 separate wire transfers, totalling around $25 million, after joining a video call in which every other participant (including someone who appeared to be the company's Chief Financial Officer) was in fact an AI-generated deepfake, built from publicly available footage of real executives.\n\nBeyond individual fraud cases, however, lies a subtler and arguably more corrosive problem: the so-called 'liar's dividend', a term coined by legal scholars Robert Chesney and Danielle Citron. As deepfakes become more common and more convincing, it becomes correspondingly easier for people caught on genuine, incriminating footage to simply dismiss it as fake. In other words, the mere existence of deepfake technology doesn't just create new lies; it also gives dishonest people a plausible way to deny the truth, undermining trust in real evidence as well.",
