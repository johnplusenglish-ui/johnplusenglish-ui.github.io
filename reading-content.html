tributed to a temporary shortage of that pigment at the paint manufacturer Rosco. What had begun as an unplanned scheduling collision therefore rippled outward into supply chains, retail trends, and box office records alike, illustrating how a single coincidence, amplified by internet culture, can reshape the commercial and cultural landscape of an entire summer.",C2:"On 21 July 2023, an accident of studio scheduling produced one of the most talked-about cultural convergences in recent cinematic memory: the simultaneous release of two films whose sensibilities, tones, and thematic preoccupations could scarcely have diverged more sharply. The first, \"Barbie,\" directed by Greta Gerwig and starring Margot Robbie as its titular icon alongside Ryan Gosling as Ken, was a vividly pink, self-referential comedy that mined decades of doll-shaped cultural baggage for both satire and sincerity. The second, \"Oppenheimer,\" Christopher Nolan's sombre and exhaustively researched chronicle of the physicist who oversaw the creation of the atomic bomb, offered a graver meditation on scientific ambition and its moral consequences. Neither studio had coordinated with the other; the collision of release dates was, in the strictest sense, coincidental, yet it is difficult to imagine a more consequential accident in film marketing history.\n\nIt was precisely the incongruity between the two productions that seized the public imagination almost the moment release dates were confirmed. Internet users, delighting in the absurdity of pairing a candy-coloured satire with a somber meditation on nuclear devastation, began proposing, half in jest, that audiences watch both films consecutively in a single sitting. The notion, christened \"Barbenheimer\" through the internet's now-familiar portmanteau instinct, rapidly outgrew its origins as a meme and crystallised into an authentic, widely observed cultural ritual. Cinemas across the world reported audiences arriving dressed head to toe in pink, only to file into darkened auditoriums for hours of considerably weightier material immediately afterward. The juxtaposition itself became part of the spectacle, generating commentary about tonal whiplash and the pleasures of experiencing two incompatible narratives within a single day.\n\nCommercially, \"Barbie\" proved to be a phenomenon capable of standing on its own merits, independent of whatever lift it received from its unlikely pairing. By the close of 2023, it had become the highest-grossing film of the year worldwide, and, more remarkably still, the highest-grossing film ever directed solely by a woman, ultimately amassing more than $1.4 billion in global box office receipts. This triumph was scaffolded by a marketing campaign of almost unprecedented scale. Warner Bros, working with Mattel, negotiated tie-in partnerships with more than one hundred brands, ensuring that Barbie-branded merchandise, spanning fashion, homeware, cosmetics, and other categories, saturated retail environments and social media feeds in near-equal measure. The resulting explosion of the colour pink, impossible to escape in shops or on screens, was informally dubbed \"Barbiecore,\" a trend whose influence extended well beyond anyone who had actually bought a ticket to see the film.\n\nEven the production itself left a curious mark on an entirely unrelated industry: it was reportedly claimed that the film's extravagant use of one particular, intensely vivid shade of pink paint contributed to a temporary shortage of that pigment at the paint manufacturer Rosco, a small but telling illustration of the film's outsized material footprint. What had begun as an unplanned collision of release calendars rippled outward into supply chains, retail trends, and box office records, offering a vivid demonstration of how a single coincidence, amplified by internet culture, can define the commercial and cultural landscape of an entire summer."}},
{id:"taylor-swift-eras-tour-economy",title:"Swiftonomics: How One Concert Tour Boosted Whole Cities",tag:"United States · Business",img:"images/reading/taylor-swift-eras-tour-economy.jpg",quiz:{"B1":[{"q":"What was Taylor Swift's 2023-2024 tour called?","o":["The Eras Tour","The Billion Tour","The Swiftonomics Tour","The Philadelphia Tour"],"a":0,"x":"It was 'the Eras Tour' throughout. Swiftonomics is the economic effect, not the tour's name."},{"q":"What record did the tour set for earnings?","o":["It was the first tour ever to make more than one billion US dollars","It was the first tour to sell out every stadium","It was the cheapest tour ever to produce","It earned exactly one million US dollars"],"a":0,"x":"It was 'the first tour ever to make more than one billion US dollars', so the other claims fall away."},{"q":"What name did economists give to the tour's effect on cities?","o":["Swiftonomics","Erasomics","Tour money","Fan power"],"a":0,"x":"Economists 'started calling this effect Swiftonomics', the boost the tour handed to host cities."}],"B2":[{"q":"What made the Eras Tour different from a normal tour?","o":["Each show featured songs from every era of her career","She only performed songs from one new album","She played a completely different setlist each night by chance","She performed with many other famous singers"],"a":0,"x":"Every show journeyed through songs 'from each distinct era' of her career, unlike a normal one-album tour."},{"q":"Which institution referred to the boost in hotel revenue?","o":["The Federal Reserve Bank of Philadelphia","The World Bank","A national newspaper","The city government of Philadelphia"],"a":0,"x":"It was 'the Federal Reserve Bank of Philadelphia' that cited the rise in hotel revenue, not the World Bank or a newspaper."},{"q":"What did many of Swift's fans do around the shows?","o":["Travel between cities and countries and wear era-inspired outfits","Refuse to buy any merchandise","Attend only one show near their home","Watch the concerts online instead"],"a":0,"x":"Fans travelled between cities and countries and dressed in era-inspired outfits, hardly staying home or shunning merchandise."}],"C1":[{"q":"Why did the Federal Reserve reference give the effect 'an air of empirical legitimacy'?","o":["It came from a serious institution rather than being just anecdotal","It proved fans spent more than they earned","It was the only source that mentioned the tour","It replaced the need for any economic data"],"a":0,"x":"A serious body like the Federal Reserve citing the boost made it look like real evidence, not 'merely anecdotal'."},{"q":"The passage describes the crowd outside each venue as 'a walking timeline'. This means the fans","o":["Visually represented different chapters of Swift's career through their costumes","Arrived in strict order of ticket purchase","Were lined up along an actual timeline on the street","Wore watches showing different time zones"],"a":0,"x":"'A walking timeline' means their era-specific costumes pictured different chapters of Swift's career, not a real street queue."},{"q":"How did the tour go beyond a conventional album promotion?","o":["It offered an immersive retrospective of her whole career in one evening","It focused only on her newest and least-known songs","It avoided playing any of her older material","It was designed mainly to sell a single new record"],"a":0,"x":"The tour 'transcended' album promotion, offering an immersive retrospective of her whole career in one evening."}],"C2":[{"q":"What does the passage conclude about the tour's economic and cultural impact?","o":["They proved inseparable, each feeding the other","The cultural impact mattered far more than the economic one","The economic impact was largely imaginary","They had nothing meaningful to do with each other"],"a":0,"x":"The two 'proved inseparable', the show drawing fans whose travel and spending powered Swiftonomics."},{"q":"How is the one-billion-dollar figure characterised relative to the industry?","o":["A threshold that had been more theoretical benchmark than realistic target","A modest sum that many tours had already reached","An amount Swift narrowly failed to reach","A figure invented by journalists"],"a":0,"x":"One billion dollars had 'previously existed more as theoretical benchmark than realistic target'."},{"q":"What underlying idea does the passage stress about how the economic effect was generated?","o":["Countless individual fans' aggregated choices produced large-scale disruption","A few wealthy sponsors funded the entire effect","Government spending drove the city economies","The venues themselves created the revenue, not the fans"],"a":0,"x":"Notice the emphasis: 'countless individual fans, through their aggregated choices' drove the disruption, not sponsors or government."}]},levels:{B1:"Taylor Swift is one of the most famous singers in the world. In 2023 and 2024, she performed a huge concert tour called the Eras Tour. In every show, she sang songs from all the different periods, or \"eras,\" of her career. Fans loved seeing so many songs from so many years in one concert.\n\nThe Eras Tour soon broke records. It became the highest-grossing concert tour in history, which means it earned more money than any tour before it. In fact, it was the first tour ever to make more than one billion US dollars. This huge success surprised even experts who study money and business.\n\nThe tour also changed the cities where Swift performed. Economists started calling this effect \"Swiftonomics.\" When she came to a city, hotels sold out completely, and restaurants were fully booked for days. Small shops and other local businesses said they made much more money than usual, especially on the night of the show and the whole weekend around it. The Federal Reserve Bank of Philadelphia even mentioned this boost in an official report about hotel income in the city.\n\nMany fans traveled to different cities, and even different countries, just to see more than one show. They often wore special outfits inspired by different eras of Swift's music, making every concert night feel like a huge, colorful celebration.",B2:"Over the course of 2023 and 2024, Taylor Swift undertook the Eras Tour, an extraordinary concert series in which every show journeyed through songs drawn from each distinct era, or album period, of her career. Rather than simply promoting a single record, the tour functioned as a sweeping retrospective, allowing fans to relive years of musical evolution within the space of a single evening, something no previous tour had attempted on quite the same scale.\n\nThe scale of the tour's success quickly became historic. It emerged as the highest-grossing concert tour ever staged, and remarkably, it was the very first tour in history to surpass one billion US dollars in earnings. Such figures placed the Eras Tour in a category of its own, prompting economists and journalists alike to examine exactly how a single artist could generate such enormous financial momentum.\n\nThat examination gave rise to a new term: \"Swiftonomics,\" coined to describe the ripple effect the tour had on the local economies of host cities. Wherever Swift performed, hotels sold out entirely, restaurants found themselves fully booked, and local businesses of every kind reported unusually high revenue, not only on the night of the concert itself but across the surrounding weekend. This effect was significant enough that the Federal Reserve Bank of Philadelphia referenced the boost from Eras Tour shows in an official economic commentary, specifically noting the rise in hotel revenue within the city.\n\nAdding to the phenomenon was the extraordinary devotion of Swift's fanbase, many of whom traveled between cities, and even across national borders, in order to attend multiple performances. These fans frequently dressed in elaborate outfits inspired by different eras of Swift's music, transforming concert venues into vibrant, immersive celebrations of her entire musical journey.",C1:"Between 2023 and 2024, Taylor Swift embarked on the Eras Tour, a concert phenomenon distinguished not merely by its scale but by its structure: each performance traced the arc of her career, weaving together songs drawn from every era, or album period, she had released. In doing so, the tour transcended the conventional function of promoting a single album, instead offering audiences an immersive retrospective, one that compressed years of musical evolution and reinvention into the span of a single evening, structured so that no chapter of her artistic history was left unrepresented.\n\nThe commercial magnitude of this undertaking soon eclipsed anything the touring industry had previously witnessed. The Eras Tour became the highest-grossing concert tour of all time, and, more remarkably still, the first tour in history to cross the threshold of one billion US dollars in gross revenue. Such an achievement was less a matter of incremental record-breaking than of establishing an entirely new benchmark, one that prompted economists, journalists, and industry analysts to scrutinize the precise mechanisms by which a single touring artist could exert such outsized, geographically dispersed influence over consumer spending patterns.\n\nOut of that scrutiny emerged the term \"Swiftonomics,\" a coinage intended to capture the tangible economic ripple effect that materialized in whichever city hosted the tour. Hotels were booked to capacity, restaurants found themselves unable to accommodate additional reservations, and local businesses across sectors reported revenue spikes that extended well beyond the night of the concert itself, encompassing the entire surrounding weekend. The phenomenon proved substantial enough to attract the attention of institutions not typically associated with pop culture commentary: the Federal Reserve Bank of Philadelphia, in an economic commentary, explicitly referenced the surge in hotel revenue attributable to Eras Tour shows, lending an air of empirical legitimacy to what might otherwise have seemed anecdotal.\n\nCompounding this economic effect was the remarkable mobility of Swift's fanbase, many of whom thought nothing of crossing not just city lines but national borders in pursuit of attending multiple performances. This willingness to travel was frequently accompanied by an equally striking form of devotion: fans arrived in elaborate, era-specific costumes assembled in tribute to different chapters of Swift's discography, so that the crowd outside each venue became, in effect, a walking timeline of her entire body of work, as visually layered and varied as the setlist unfolding inside.",C2:"Across the two-year span of 2023 and 2024, Taylor Swift mounted the Eras Tour, a concert undertaking whose significance lay not solely in its scale but in its very conception: rather than centering each performance on a single, current album, Swift structured every show as a sweeping traversal of her entire discography, threading together songs from each distinct era of her career into one continuous, chronologically layered spectacle. The effect was less that of a promotional tour than of a curated retrospective, inviting audiences to witness the full trajectory of an artist's evolution compressed into the confines of a single night.\n\nThe commercial repercussions of this ambitious format proved to be without precedent. The Eras Tour ascended to the position of highest-grossing concert tour in history, and achieved a distinction more remarkable still: it became the first tour ever recorded to surpass one billion US dollars in gross earnings, a threshold that had previously existed more as theoretical benchmark than realistic target within the touring industry. This was not incremental progress against prior records but a wholesale redefinition of a touring artist's economic ceiling, prompting economists and cultural commentators to interrogate the mechanisms by which countless individual fans, through their aggregated choices, could generate economic disruption on a scale usually reserved for far larger industries.\n\nIt was out of this interrogation that the term \"Swiftonomics\" was coined, a shorthand for the pronounced economic ripple effect that accompanied the tour into whichever city it visited. Hotels across host cities were booked to full capacity, restaurants found their tables entirely reserved, and local businesses of every conceivable variety reported revenue figures markedly above their typical baseline, a surge that extended not merely through the evening of the performance itself but across the entirety of the surrounding weekend. So substantial was this effect that it drew commentary from institutions rarely associated with popular culture: the Federal Reserve Bank of Philadelphia, in an economic commentary of its own, explicitly cited the increase in hotel revenue attributable to Eras Tour performances, lending a degree of institutional credibility to a phenomenon that might otherwise have been dismissed as merely anecdotal.\n\nUnderpinning this entire economic phenomenon was the extraordinary mobility and dedication of Swift's fanbase, many of whom regarded attending a single performance as insufficient, choosing instead to travel between cities, and frequently across national borders, in order to witness multiple shows over the course of the tour. This devotion was matched by an equally elaborate visual one: fans routinely dressed in costumes inspired by different eras of Swift's music, transforming the crowds outside each venue into a kind of living timeline of her career, mirroring, era by era, the very structure of the concert unfolding within. In this way, the tour's economic and cultural impact proved inseparable: the promise of witnessing every era of an artist's evolution in a single show drew fans across borders, and their collective willingness to travel, spend, and dress the part became, in turn, the very engine that powered Swiftonomics from city to city."}},
{id:"mr-beast-youtube-empire",title:"The Creator Who Built an Empire From Giveaways and Trees",tag:"United States · Technology",img:"images/reading/mr-beast-youtube-empire.jpg",quiz:{"B1":[{"q":"What is Jimmy Donaldson's online name?","o":["MrBeast","BeastMan","Jimmy Trees","YouTube King"],"a":0,"x":"Jimmy Donaldson is known online as 'MrBeast', so the other names are pure invention."},{"q":"What was the 2019 #TeamTrees project about?","o":["Raising money to plant trees, one tree for each dollar donated","Cleaning plastic from the oceans","Building a new video studio","Selling snack products"],"a":0,"x":"#TeamTrees raised money to plant trees, with 'one tree would be planted' for every dollar donated."},{"q":"What does MrBeast do with much of the money he earns?","o":["He puts a large part of it back into his next videos","He saves nearly all of it in the bank","He gives all of it away to charity","He spends it on personal holidays"],"a":0,"x":"He 'puts a large part of it back into his next videos', rather than saving it or giving it all away."}],"B2":[{"q":"What was the goal of #TeamTrees?","o":["20 million trees","1 million trees","5 million trees","100 million trees"],"a":0,"x":"The goal was '20 million trees', which the campaign met, raising over $20 million."},{"q":"Which well-known person is mentioned as a donor to the campaign?","o":["Elon Musk","Greta Gerwig","Josh Wardle","Christopher Nolan"],"a":0,"x":"'Elon Musk' is named as a donor to #TeamTrees. The other figures belong to different passages."},{"q":"Which brands has MrBeast created?","o":["Feastables, a snack brand, and MrBeast Burger","A clothing line and a car brand","A streaming service and a bank","A cinema chain and a toy company"],"a":0,"x":"He launched 'Feastables', a snack brand, and 'MrBeast Burger', not a clothing, car or streaming brand."}],"C1":[{"q":"What strategy is described as central to MrBeast's rise?","o":["Relentless escalation, making each video an improvement on the last","Keeping costs as low as possible on every video","Copying the most popular videos of other creators","Posting as rarely as possible to build suspense"],"a":0,"x":"Central to his rise is a 'deliberate strategy of relentless escalation', each upload built as an improvement on the last."},{"q":"The passage says profitability is treated 'less as a reward to be enjoyed than as fuel to be immediately burned'. This means MrBeast","o":["Spends his profits straight away on bigger productions","Refuses to spend any money on his videos","Hides his earnings from the public","Stops working once he becomes profitable"],"a":0,"x":"'Fuel to be immediately burned' means he spends profits at once on bigger productions rather than banking them."},{"q":"What was the purpose of #TeamSeas?","o":["Redirecting the collaborative model towards cleaning up the oceans","Planting even more trees than #TeamTrees","Launching a new snack product","Funding other YouTubers' channels"],"a":0,"x":"#TeamSeas turned the same collaborative model 'towards the cleanup of the world's oceans', not more trees or snacks."}],"C2":[{"q":"How does the passage characterise MrBeast's approach to content production?","o":["A calculated, almost industrial approach in which scale is the method","A casual, spontaneous hobby with little planning","A cautious approach focused on minimising spending","A traditional approach copied from television"],"a":0,"x":"It's 'a calculated, almost industrial approach' where scale itself becomes the method, far from a casual hobby."},{"q":"The remark that 'the wager has proven remarkably astute' implies that","o":["His choice to spend lavishly has repeatedly paid off","His spending has usually led to failure","Audiences dislike his expensive videos","He rarely takes any real risks"],"a":0,"x":"Calling the wager 'remarkably astute' means his choice to spend lavishly has paid off again and again, drawing more attention and growth."},{"q":"Which statement best expresses the passage's main point about his finances?","o":["Financial success serves as raw material to reinvest, not an endpoint to enjoy","He values saving money above making new videos","His charities are more profitable than his channel","He has stopped growing because he spends too much"],"a":0,"x":"The closing line frames success 'not as an endpoint to be savoured but as raw material to be continuously reinvested'."}]},levels:{B1:"Jimmy Donaldson is an American YouTuber. Online, everyone knows him as MrBeast. Over the years, his channel grew and grew. Today, it is the biggest individual channel on YouTube. No other single creator has more subscribers than him.\n\nMrBeast is famous for big, expensive videos. He makes challenge videos and stunts that cost a lot of money to film. In many of his videos, he gives large amounts of cash to the people who take part, or even to strangers he meets. This makes his videos exciting to watch, because people love to see ordinary people win big prizes.\n\nIn 2019, MrBeast started a project called #TeamTrees. He worked together with other YouTubers to raise money to plant trees. For every dollar people donated, one tree would be planted. The goal was 20 million trees, and they reached it, raising more than $20 million. Even the businessman Elon Musk gave money to the campaign. Later, MrBeast started a similar project called #TeamSeas, this time to help clean up the oceans.\n\nMrBeast has also built a business empire outside YouTube. He created a snack brand called Feastables and a burger brand called MrBeast Burger. Instead of keeping most of the money he earns, he puts a large part of it back into his next videos, making each one bigger than the last.",B2:"Jimmy Donaldson, better known by his online alias MrBeast, is an American YouTuber whose channel has grown into the most-subscribed individual creator account on the entire platform. No other single person running their own channel has managed to attract a bigger audience, a remarkable achievement given how competitive online video has become.\n\nWhat sets MrBeast apart is the sheer scale of his content. He specialises in elaborate, expensive stunts and challenge videos, often built around enormous cash prizes that he hands out to participants, and sometimes to complete strangers he encounters along the way. Rather than relying on small, low-budget clips, he treats each video like a production, with dramatic setups and generous rewards designed to keep viewers hooked and coming back for more.\n\nBeyond entertainment, MrBeast has used his platform for genuine impact. In 2019 he launched #TeamTrees, joining forces with a wide range of fellow YouTubers to raise funds for planting trees, with one tree planted for every dollar donated. The ambitious goal was 20 million trees, and the campaign not only met it but surpassed $20 million in donations, drawing support from high-profile donors including entrepreneur Elon Musk. Encouraged by that success, he later launched a comparable initiative called #TeamSeas, this time focused on cleaning plastic and debris from the world's oceans.\n\nMrBeast's ambitions have long since expanded beyond YouTube itself. He has built a wider business empire, launching a snack food brand called Feastables and a burger delivery brand called MrBeast Burger, extending his influence from the screen into everyday consumer products. Crucially, rather than pocketing the bulk of his earnings, he consistently reinvests a large share of them straight back into his next project, allowing each video to become progressively bigger, bolder and more elaborate than the one before it.",C1:"Jimmy Donaldson, who operates under the online moniker MrBeast, has built what is now widely regarded as the most-subscribed individual creator channel anywhere on YouTube, a distinction that places him above every other solo creator on the platform. Few could have predicted, when he began uploading amateur content years earlier, that a single creator would eventually eclipse every rival for that top position, yet that is precisely what transpired. That his channel should have risen to such prominence is a testament not merely to consistency but to a deliberate strategy of relentless escalation, in which each new upload is conceived as an improvement, however incremental, on everything that preceded it.\n\nCentral to this strategy is a body of content built around elaborate, high-budget stunts and challenge videos, many of which hinge on the distribution of substantial cash prizes to participants, and occasionally to strangers encountered seemingly at random. What distinguishes this approach from more conventional entertainment formats is its sheer production value: rather than economising, MrBeast has consistently opted to spend more, wagering that audiences will respond to scale and generosity with correspondingly greater engagement, a bet that has, by most measures, paid off handsomely.\n\nYet MrBeast's influence extends well beyond pure entertainment. In 2019, he spearheaded #TeamTrees, a collaborative campaign in which he enlisted an array of fellow YouTubers to solicit donations for reforestation, with the arrangement that one tree would be planted for every dollar contributed. Having set an ambitious target of 20 million trees, the campaign not only achieved that goal but ultimately raised in excess of $20 million, attracting donations from prominent figures, among them the entrepreneur Elon Musk. Buoyed by this outcome, MrBeast subsequently orchestrated a comparable venture, #TeamSeas, redirecting the same collaborative model towards the cleanup of the world's oceans.\n\nNor has his ambition remained confined to philanthropy or content creation alone. He has since diversified into commerce, establishing Feastables, a snack food brand, alongside MrBeast Burger, a burger delivery concept, thereby translating his online popularity into tangible consumer enterprises. Perhaps most tellingly, MrBeast has resisted the temptation to simply bank his considerable earnings; instead, he channels a substantial proportion of them back into production, a reinvestment cycle that has allowed his output to grow steadily more ambitious, expensive and elaborate with each passing year. The result is a channel that has never plateaued, since profitability is treated less as a reward to be enjoyed than as fuel to be immediately burned.",C2:"Jimmy Donaldson, professionally known to a global audience as MrBeast, has, over the course of little more than a decade, transformed a niche pursuit into what is now unambiguously the most-subscribed individual creator channel on the whole of YouTube, a feat unmatched by any other solo operator working within the medium. It is a trajectory made all the more striking by the sheer density of competition inherent to the platform, where millions vie continuously for the same finite pool of viewer attention. That such a position could be attained at all speaks to more than mere popularity; it reflects a calculated, almost industrial approach to content production, one in which scale itself becomes both the method and the message.\n\nThe foundation of this ascent lies in a distinctive genre of video: elaborate, lavishly funded stunts and challenges, frequently structured around the distribution of substantial cash sums to participants, and, not infrequently, to strangers happened upon in the course of filming. What separates this body of work from the broader landscape of online entertainment is not novelty of concept so much as sheer commitment of resources; where competitors might economise, MrBeast has repeatedly chosen extravagance, evidently calculating that audiences reward spectacle with attention, and attention, in turn, with continued growth. The wager has proven, time and again, remarkably astute.\n\nYet to characterise MrBeast solely as an entertainer would be to understate the reach of his enterprise considerably. In 2019 he conceived and spearheaded #TeamTrees, a philanthropic campaign that saw him coordinate with a broad coalition of fellow YouTubers to solicit public donations earmarked for reforestation, structured around the straightforward principle that one tree would be planted for every dollar received. Having set the ambitious benchmark of twenty million trees, the initiative not only met but exceeded it, ultimately drawing in excess of twenty million dollars in contributions, among them a donation from the entrepreneur Elon Musk, whose involvement lent the campaign further visibility. Emboldened by that success, MrBeast subsequently replicated the model with #TeamSeas, redirecting collective goodwill towards the considerably thornier task of ridding the world's oceans of accumulated debris.\n\nNor has his enterprise remained tethered exclusively to philanthropy or to the production of video content. He has, in the intervening years, cultivated a wider commercial empire, founding Feastables, a snack food brand, and MrBeast Burger, a delivery-oriented burger concept, thereby converting digital fame into tangible, purchasable products that extend his brand well beyond the confines of a screen. Most tellingly of all, perhaps, is his enduring refusal to treat accumulated earnings as a terminus rather than a resource: a considerable share of whatever he makes is funnelled straight back into the next production, in a self-perpetuating cycle whereby ambition begets expenditure, and expenditure, in turn, begets ever more ambitious content, ensuring that no single video represents anything like a ceiling for what follows it. In this respect, financial success functions not as an endpoint to be savoured but as raw material to be continuously reinvested, a dynamic that has come to define his approach as much as any individual video ever could."}},
{id:"lego-adult-fans",title:"Grown-Up Builders: Why Adults Fell in Love With LEGO Again",tag:"Denmark · Business",img:"images/reading/lego-adult-fans.jpg",quiz:{"B1":[{"q":"What do the two Danish words behind the name 'LEGO' mean?","o":["Play well","Build big","Have fun","Small bricks"],"a":0,"x":"'LEGO' comes from 'leg godt', meaning 'play well', so the other meanings are off."},{"q":"What does the nickname 'AFOL' stand for?","o":["Adult Fans of LEGO","A Family Of Lego","All Fun Only LEGO","Adult Friends On LEGO"],"a":0,"x":"AFOLs are 'Adult Fans of LEGO', not any of the other invented phrases."},{"q":"What colour are the boxes of LEGO's special '18+' range?","o":["Black","Bright red","Pink","Green"],"a":0,"x":"The '18+' range comes in 'black boxes' that stand apart from the colourful children's boxes."}],"B2":[{"q":"Who founded LEGO, and where?","o":["Ole Kirk Christiansen, in Billund, Denmark","Josh Wardle, in Copenhagen","A group of toy makers in Germany","Ole Kirk Christiansen, in Sweden"],"a":0,"x":"LEGO was founded by 'Ole Kirk Christiansen' in 'Billund', Denmark, not Sweden or Copenhagen."},{"q":"Why does the '18+' range use distinct black packaging?","o":["To separate it clearly from the bright boxes aimed at children","Because black plastic bricks are cheaper","Because adults dislike coloured boxes","To hide what is inside the box"],"a":0,"x":"The black packaging is 'deliberately separated from the bright boxes aimed at children', not to cut costs or hide contents."},{"q":"How do many adult fans describe the act of building?","o":["Relaxing, like completing a puzzle or meditating","Stressful but worth the money","A quick way to pass a few minutes","Mainly a way to make money"],"a":0,"x":"Many describe building as 'relaxing, comparing it to completing a puzzle or practising meditation'."}],"C1":[{"q":"What does the passage suggest about how LEGO now views AFOLs?","o":["As a segment too significant to treat as a footnote","As a small group not worth designing products for","As customers who have grown out of the hobby","As buyers only interested in children's sets"],"a":0,"x":"AFOLs are now a segment LEGO 'can no longer afford to treat as a footnote', not a group too small to design for."},{"q":"According to the passage, the black packaging acts as a","o":["Visual signal that the sets belong to a different market","Way to reduce production costs","Warning that the sets are difficult","Sign that the sets are cheaper"],"a":0,"x":"The black packaging is 'a visual signal that these sets belong to a different market altogether', not a cost or warning."},{"q":"How do many adult builders characterise the hobby, according to the passage?","o":["As a genuinely mindful, screen-free way of decompressing","As a childish pastime they feel embarrassed about","As a competitive sport with strict rules","As a purely social activity done only in groups"],"a":0,"x":"Builders call it 'a genuinely mindful practice', a screen-free way of decompressing, not a childish or competitive one."}],"C2":[{"q":"How does the passage describe the fate of the old assumption that LEGO was only for children?","o":["It has been quietly and thoroughly dismantled","It remains as strong as ever","It was never really held by anyone","It has grown even more widespread"],"a":0,"x":"That old assumption 'has been quietly and thoroughly dismantled', not left standing or pretended away."},{"q":"What does the passage imply about adult fans' engagement with the hobby?","o":["It exceeds anything the original product line was designed to satisfy","It is limited to buying sets meant for children","It has weakened as the fans have aged","It matches exactly what LEGO first intended"],"a":0,"x":"Fans pursue it with an intensity that 'far exceeds anything the original product line was designed to satisfy'."},{"q":"Which combination does the passage credit for LEGO's enduring reputation?","o":["Nostalgia, craftsmanship and unexpected therapeutic value","Low prices, heavy advertising and celebrity endorsement","Simplicity, secrecy and limited availability","Speed of building, competition and prizes"],"a":0,"x":"The ending credits 'nostalgia, craftsmanship and unexpected therapeutic value', not low prices or celebrity endorsement."}]},levels:{B1:"LEGO is a toy company from Denmark. It was started in 1932 by a man called Ole Kirk Christiansen, in a small town called Billund. The name \"LEGO\" comes from two Danish words, \"leg godt,\" which mean \"play well.\"\n\nFor many years, people thought LEGO was only for children. But in the last few decades, something interesting has happened. More and more adults have started buying and building LEGO sets. These grown-up fans have a nickname, AFOLs, which stands for \"Adult Fans of LEGO.\" Today, AFOLs are a big and important part of LEGO's business.\n\nBecause of this, LEGO now makes sets clearly made for adults. There are detailed models of famous buildings, flower bouquets, and small bonsai trees. There are also realistic model vehicles and huge sets with thousands of pieces from franchises like Star Wars. LEGO even made a special \"18+\" range, packed in black boxes that look different from the colourful boxes made for children's toys.\n\nAdult fans do not only build alone at home. Many join clubs or go to conventions, where they show off amazing creations they designed themselves. Some adults say building LEGO sets is relaxing, almost like doing a puzzle or meditating, a nice way to unwind after a busy day. It is easy to see why LEGO remains one of the most valuable and respected toy brands in the world today.",B2:"LEGO began life as a small Danish toy company, founded in 1932 by Ole Kirk Christiansen in the modest town of Billund. Even the brand's name reflects its founding spirit: it comes from the Danish phrase \"leg godt,\" meaning \"play well.\" For decades, that mission seemed aimed squarely at children, and colourful plastic bricks were tucked away in playrooms across the world.\n\nOver recent decades, however, a quieter but powerful shift has been taking place. Adult fans of LEGO, affectionately nicknamed AFOLs, have grown into a huge and increasingly important part of the company's customer base. Rather than growing out of the hobby, many adults have grown further into it, and LEGO has clearly noticed. The company now produces sets that are unmistakably designed with grown-up builders in mind, moving well beyond simple children's toys.\n\nThis shift shows up everywhere in LEGO's modern catalogue. There are intricately detailed architecture models recreating famous buildings, elegant botanical collections featuring flower bouquets and delicate bonsai trees, and painstakingly accurate vehicle replicas. There are also sprawling sets containing thousands of individual pieces, often built around beloved franchises such as Star Wars. To formalise this adult market, LEGO even launched an official \"18+\" range, instantly recognisable by its distinct black packaging, deliberately separated from the bright boxes aimed at children.\n\nBeyond the sets themselves, a genuine community has flourished around this hobby. Adult fans organise their own conventions and clubs, where they proudly display elaborate, entirely custom creations they have designed from scratch. Many describe the act of building as unexpectedly relaxing, comparing it to completing a puzzle or practising meditation, a satisfying way to unwind after a demanding day. Given all this, it is little surprise that LEGO consistently ranks among the world's most valuable and most reputable toy brands.",C1:"Few toy companies can claim a more modest origin story than LEGO. Founded in 1932 by Ole Kirk Christiansen in the small Danish town of Billund, the company took its name from the Danish phrase \"leg godt,\" meaning \"play well,\" a simple philosophy that would end up guiding it for nearly a century. For most of that history, the brand's identity was firmly, almost exclusively, associated with childhood: a rite of passage involving scattered bricks underfoot and half-built kingdoms on bedroom floors.\n\nIn recent decades, though, that identity has quietly broadened. Adult fans of LEGO, affectionately known within the community as AFOLs, have emerged as a substantial and commercially significant segment of the company's market, one that LEGO can no longer afford to treat as a footnote. Far from outgrowing their childhood hobby, these fans have deepened their engagement with it, and the company has responded in kind, developing an entire tier of products that speaks directly to grown-up sensibilities rather than to children's play patterns.\n\nThe clearest evidence of this shift lies in the sets themselves. LEGO now produces intricately engineered architecture models that faithfully recreate iconic buildings, alongside botanical collections, flower bouquets and bonsai trees rendered with surprising botanical accuracy, as well as vehicle replicas built with an obsessive attention to detail. Elsewhere, sprawling sets comprising thousands of pieces, frequently tied to franchises such as Star Wars, cater to builders willing to devote entire weekends to a single project. Perhaps most tellingly, the company formalised this adult-oriented strategy by launching an official \"18+\" range, distinguished by sleek black packaging that stands in deliberate contrast to the vividly coloured boxes reserved for children's toys, a visual signal that these sets belong to a different market altogether.\n\nWhat has developed around these products is arguably just as significant as the products themselves: a thriving subculture complete with its own conventions and clubs, where enthusiasts gather to exhibit elaborate, self-designed creations that showcase remarkable ingenuity and patience. Many participants describe the act of building not as a childish pastime but as a genuinely mindful practice, likening it to assembling a complex puzzle or meditating, a deliberate, screen-free way of decompressing after a demanding day. It is this combination of nostalgia, craftsmanship and quiet therapeutic appeal that helps explain why LEGO continues to be ranked among the world's most valuable and most reputable toy brands, a Danish company built on scattered plastic bricks that has, remarkably, never stopped growing up alongside its fans.",C2:"There is something almost poetic about the fact that a toy company founded in 1932, in the unassuming Danish town of Billund, by a carpenter named Ole Kirk Christiansen, should have grown into a global institution whose very name distils a philosophy: \"LEGO,\" a contraction of the Danish \"leg godt,\" or \"play well.\" For much of its history, that philosophy was applied almost exclusively to childhood, an unspoken assumption that the pleasures of interlocking plastic bricks belonged squarely to the young and would, in time, be outgrown like so many other juvenile enthusiasms.\n\nThat assumption has, over recent decades, been quietly and thoroughly dismantled. Adult fans of LEGO, known within their own affectionately self-designated community as AFOLs, have evolved from a curious niche into a commercially indispensable pillar of the company's market, one whose purchasing power and brand loyalty LEGO has been unable, and evidently unwilling, to ignore. Rather than representing a nostalgic detour from childhood, this cohort of enthusiasts has pursued the hobby with an intensity and sophistication that far exceeds anything the original product line was designed to satisfy, and LEGO's response has been to build an entire adult-facing tier of products in kind.\n\nThe evidence for this recalibration is woven throughout the company's contemporary catalogue. There are architecturally rigorous models that faithfully reproduce famous buildings down to their structural nuance, botanical collections whose flower bouquets and bonsai trees achieve an almost uncanny verisimilitude, and vehicle replicas assembled with an attention to mechanical and aesthetic detail that borders on the obsessive. Elsewhere, sprawling sets running to many thousands of individual pieces, frequently drawing on franchises such as Star Wars, invite builders to commit not minutes but entire weekends to a single undertaking. Most tellingly of all, perhaps, the company institutionalised this adult market by introducing an official \"18+\" range, unmistakably packaged in matte black rather than the primary-coloured boxes long associated with children's toys, a deliberate visual demarcation between two audiences that the brand once addressed as one.\n\nEqually significant is the culture that has crystallised around these products, entirely independent of LEGO's own marketing apparatus. Adult fans now organise their own conventions and clubs, gathering to exhibit elaborate, self-conceived creations that testify to remarkable patience, technical ingenuity and, not infrequently, genuine artistry. Many describe the act of building not as regression into childhood but as a form of deliberate mindfulness, likening it to solving an intricate puzzle or engaging in meditation, a quietly absorbing antidote to the frenetic pace of adult life. It is precisely this convergence of nostalgia, craftsmanship and unexpected therapeutic value that helps account for LEGO's enduring position among the world's most valuable and most reputable toy brands, consistently ranked there year after year, a Danish enterprise built, quite literally, brick by brick, that has never stopped playing well alongside the adults who once, mistakenly, believed they had put it down for good."}},
{id:"wordle-global-phenomenon",title:"Six Guesses a Day: How Wordle Became a Global Ritual",tag:"Global · Society",img:"images/reading/wordle-global-phenomenon.jpg",quiz:{"B1":[{"q":"How many tries do players get each day to guess the word?","o":["Six","Three","Ten","One"],"a":0,"x":"Players get 'six tries' to guess the daily word, so three, ten or one won't do."},{"q":"Who created Wordle, and why at first?","o":["Josh Wardle, as a gift for his partner","A large games company, to make money","The New York Times, as a new feature","A group of software engineers, for a competition"],"a":0,"x":"Josh Wardle built it 'as a gift for his partner', who loved word games, not for a company or contest."},{"q":"Who bought Wordle in early 2022?","o":["The New York Times","Josh Wardle's partner","A social media company","A video game studio"],"a":0,"x":"'The New York Times bought Wordle' in early 2022, not a social media or games company."}],"B2":[{"q":"How long is the secret word players must guess?","o":["Five letters","Four letters","Six letters","Seven letters"],"a":0,"x":"It's a 'secret five-letter word', so four, six or seven letters are wrong."},{"q":"Why did the game feel like a shared daily ritual?","o":["Everyone guessed the same word on the same day, with one puzzle every 24 hours","Players competed live against each other in real time","New puzzles appeared every few minutes","Players could choose their own word each day"],"a":0,"x":"Everyone got the same word each day with 'only one puzzle', so it felt like a shared daily ritual, not a live or endless game."},{"q":"When sharing their coloured grids, why do players avoid showing the actual word?","o":["So they do not ruin the puzzle for friends who have not played yet","Because the word changes for each player","Because the app forbids naming the word","Because they usually forget the word"],"a":0,"x":"Players hide the word 'so as not to ruin the puzzle for friends who had not yet played', not because the app forbids it."}],"C1":[{"q":"Which design choice 'ran against the grain of most digital entertainment'?","o":["Offering exactly one puzzle per day rather than endless content","Adding advertisements between puzzles","Charging a fee to play each round","Letting players buy extra guesses"],"a":0,"x":"Offering 'exactly one puzzle per day' rather than endless content ran against the grain of most digital entertainment."},{"q":"What price was The New York Times reported to have paid?","o":["A sum in the low seven figures","A few hundred dollars","Several billion dollars","Nothing, as it was donated"],"a":0,"x":"The reported price was 'in the low seven figures', not a few hundred dollars or billions."},{"q":"Why does the passage compare the game to a 'communal ritual'?","o":["Millions shared the same brief daily appointment, though invisibly","Players had to meet in person to play","It was played only on special holidays","It required teams to solve the puzzle together"],"a":0,"x":"It was a 'brief daily appointment shared, invisibly, with millions of strangers', not an in-person or holiday event."}],"C2":[{"q":"How does the passage regard the game's austere, stripped-back design?","o":["As foundational to its success rather than incidental","As a flaw that nearly caused it to fail","As a temporary feature soon removed","As unimportant to how the game spread"],"a":0,"x":"That austere design 'would prove not incidental to the game's success but foundational to it'."},{"q":"What does the passage say about the effect of offering only one puzzle a day?","o":["The scarcity elevated engagement rather than diminishing it","The scarcity frustrated players and reduced interest","It made no difference to how people played","It encouraged players to binge for hours"],"a":0,"x":"The scarcity, 'rather than diminishing engagement, elevated the game' into a communal rite."},{"q":"Which statement best reflects the passage's closing idea?","o":["A single elegant idea can thoroughly permeate the popular imagination","Only heavy marketing can make software succeed","Simple games rarely last beyond a few weeks","Commercial ambition is essential to viral success"],"a":0,"x":"The closing line marvels at how thoroughly 'a single elegant idea can permeate the popular imagination', no marketing required."}]},levels:{B1:"In 2021, a simple online game called Wordle became famous all over the world. The idea is easy to understand. Every day, players get six tries to guess a secret five-letter word. After each guess, colored tiles show which letters are correct and whether they are in the right place.\n\nThe game was made by a software engineer named Josh Wardle. At first, it was not for the public at all. He built it as a small personal project, a gift for his partner, who loved word games.\n\nWhen Wardle shared the game with everyone in 2021, it spread incredibly fast. Within just a few weeks, it had become a real worldwide phenomenon, and people of every age were playing it. One reason for this success was simple: everyone plays the same word on the same day. There is only one puzzle each day, so the game feels like a special daily habit, not something to play for hours at once.\n\nMany players share their results on social media. They post a grid of colored squares showing how many guesses they needed, but they never show the actual word, so they do not spoil it for other players.\n\nIn early 2022, The New York Times bought Wordle from Wardle. Since then, the game has led to countless other versions, covering topics such as geography, math, and music.",B2:"Few online games have captured the public imagination as quickly, or as completely, as Wordle. The concept could not be simpler: each day, players are given six attempts to guess a secret five-letter word, and after every guess, colored tiles reveal which letters are correct and whether they sit in the right position. There is no complicated interface to learn, which is precisely why the game proved so easy to fall in love with.\n\nWordle was not originally designed with millions of players in mind. It was created by a software engineer named Josh Wardle, who built it as a small personal project and, more touchingly, as a gift for his partner, who happened to be a devoted fan of word games. For a while, it remained a quiet pastime shared between the two of them.\n\nThat changed once Wardle made the game public in 2021. Almost overnight, it spread with astonishing speed, turning into a genuine global phenomenon within just a few weeks and drawing in players of every age. Much of its charm came from its restraint: everyone on the planet was guessing the exact same word on the exact same day, and since only one puzzle appeared every twenty-four hours, the game felt less like a distraction to binge and more like a small, shared daily ritual.\n\nThat ritual quickly grew a social dimension. Players began posting their results as simple grids of colored squares, proudly displaying how many guesses they had needed while carefully avoiding any hint of the actual word, so as not to ruin the puzzle for friends who had not yet played.\n\nBy early 2022, Wordle's success had caught the attention of The New York Times, which acquired the game from Wardle for a price widely reported to be in the low seven figures. Its influence has only expanded since, inspiring countless spin-offs built around other subjects, from geography and mathematics to music.",C1:"It is rare for a piece of software to become a genuine cultural touchstone, yet that is precisely what happened to Wordle, a deceptively modest word-guessing game whose premise fits into a single sentence. Players are granted six attempts to identify a secret five-letter word, and with each guess, colored tiles indicate whether a letter is correct and, crucially, whether it occupies the right position. The mechanics are almost austere in their simplicity, which turned out to be less a limitation than the very source of the game's appeal.\n\nThe story behind its creation is disarmingly personal. Wordle was the work of a software engineer named Josh Wardle, who conceived of it not as a commercial venture but as a small, private project, essentially a gift for his partner, who had a long-standing fondness for word games. There was, in other words, no marketing strategy behind its inception, no anticipation of the scale it would eventually reach.\n\nThat changed the moment Wardle made the game publicly available in 2021. What followed was a remarkably swift transformation: within a matter of weeks, Wordle had evolved from a niche curiosity into an authentic worldwide phenomenon, embraced by players spanning every generation. A significant part of its magnetism lay in a design choice that ran against the grain of most digital entertainment: rather than offering an endless stream of content designed to be consumed compulsively, Wordle offered exactly one puzzle per day, identical for every player on Earth. This constraint transformed the game into something closer to a communal ritual than a source of idle distraction, a brief daily appointment shared, invisibly, with millions of strangers.\n\nThis shared rhythm soon acquired its own social etiquette. Players took to posting their results across social media platforms, typically as a grid of colored squares indicating how many attempts a puzzle had required, while deliberately withholding the word itself, a small but consistent courtesy extended to those who had yet to play that day.\n\nRecognition of Wordle's cultural weight arrived swiftly in the business world as well. In early 2022, The New York Times acquired the game from Wardle, reportedly for a sum described as being in the low seven figures, a striking valuation for what had begun as an unassuming side project. In the years since, Wordle's influence has proliferated well beyond its original form, giving rise to an entire ecosystem of imitators and variants that apply its core mechanic to fields as diverse as geography, mathematics, and music.",C2:"Cultural phenomena of genuine global scale rarely emerge from something as unassuming as a browser tab with no advertisements, no login screen, and no monetisation strategy whatsoever, yet this is exactly the improbable origin story of Wordle. Its mechanics require no elaboration beyond a single paragraph: players are afforded six attempts to divine a secret five-letter word, and with each submission, a row of colored tiles renders a verdict, indicating not merely whether a given letter belongs in the word but whether it occupies its correct position. The austerity of this design, stripped of any superfluous embellishment, would prove not incidental to the game's success but foundational to it.\n\nThe circumstances of Wordle's creation lend the phenomenon an almost quaint intimacy that belies its eventual reach. It was conceived by a software engineer named Josh Wardle, who built it not with an audience in mind but as a modest, private undertaking, a gift crafted specifically for his partner, whose enthusiasm for word games was well established. There was no beta testing regime, no growth strategy, nothing resembling the calculated launch typically associated with viral software; it existed, initially, as an act of affection between two people.\n\nEverything shifted once Wardle released the game to the wider public in 2021. What ensued defies easy explanation: within a span of mere weeks, a puzzle built for an audience of one had metastasised into an authentic worldwide phenomenon, claiming devotees across every conceivable age bracket. A considerable portion of its allure can be attributed to a structural decision that ran deliberately counter to prevailing digital norms, namely the refusal to offer infinite, on-demand content engineered for compulsive consumption. Instead, every player on the planet was confronted with the identical word on the identical day, and precisely one puzzle was made available within any given twenty-four-hour window. This scarcity, rather than diminishing engagement, elevated the game into something resembling a communal rite, a fleeting daily appointment quietly shared with an unseen multitude rather than a pursuit to be binged into oblivion.\n\nThis collective rhythm gave rise, almost spontaneously, to its own unwritten social conventions. Players took to broadcasting their results across social media in the form of a grid composed entirely of colored squares, a shorthand that conveyed, with admirable economy, how many attempts a given puzzle had exacted, all while scrupulously omitting the word itself, a small but near-universally observed courtesy extended to those who had not yet attempted that day's challenge.\n\nInstitutional recognition of Wordle's cultural significance followed with striking speed. By early 2022, The New York Times had acquired the game outright from Wardle, for a sum reportedly characterised as being in the low seven figures, a valuation that would have seemed almost fantastical for a project originally conceived without any commercial ambition. In the intervening period, Wordle's influence has continued to ramify well beyond its original boundaries, spawning an entire cottage industry of spin-offs that graft its central mechanic onto subjects as disparate as geography, mathematics, and music, a testament to how thoroughly a single elegant idea can permeate the popular imagination."}},
{id:"cozy-gaming-wellness-boom",title:"The Rise of Cozy Games: Farming, Fishing and Finding Calm",tag:"Global · Society",img:"images/reading/cozy-gaming-wellness-boom.jpg",quiz:{"B1":[{"q":"According to the text, what can players NOT do in cozy games?","o":["Lose the game","Go fishing","Decorate a house","Meet friendly animals"],"a":0,"x":"In cozy games players 'cannot lose'. Fishing, decorating and meeting animals are precisely what they can do."},{"q":"Which company made Animal Crossing: New Horizons?","o":["A Swedish company","Nintendo, a Japanese company","Microsoft","Stardew Valley Studios"],"a":1,"x":"It was made by 'the Japanese company Nintendo', not Microsoft or a Swedish studio."},{"q":"When did Animal Crossing: New Horizons come out?","o":["Before video games were popular","In March 2020, as Covid-19 lockdowns began","After the pandemic ended","In 2011"],"a":1,"x":"It 'came out in March 2020, exactly when Covid-19 lockdowns were starting', not in 2011 or after the pandemic."}],"B2":[{"q":"According to the passage, the appeal of cozy games lies mainly in what?","o":["Fast timers that push players forward","Leaderboards that measure a player's worth","What the games refuse to offer, such as pressure and failure","Defeating a skilled opponent"],"a":2,"x":"The appeal lies in 'what these games refuse to offer', no timer, leaderboard or failure, rather than in beating an opponent."},{"q":"How does the text describe Stardew Valley in relation to Animal Crossing?","o":["An indie game offering the same unhurried, pressure-free rhythm on a smaller scale","A larger competitive game","A game made by Nintendo","A violent survival game"],"a":0,"x":"Stardew Valley is an indie game with 'the same unhurried, pressure-free rhythm on a smaller scale', not a bigger or violent one."},{"q":"What does the passage suggest about cozy games' popularity after the pandemic?","o":["It disappeared once lockdowns ended","It has outlasted the pandemic and still attracts players","It only ever existed during lockdowns","It moved entirely to competitive gaming"],"a":1,"x":"The appeal 'has outlasted the pandemic itself', still pulling players in rather than vanishing when lockdowns ended."}],"C1":[{"q":"The passage frames the rise of cozy games as what?","o":["A quiet rebellion against long-standing industry conventions","A return to competitive gaming traditions","A failure of the video game industry","A trend limited to Japan"],"a":0,"x":"It opens by calling the rise 'a quiet rebellion against the conventions' that long defined the industry, not a return to competition."},{"q":"Why does the writer mention that Stardew Valley existed before the pandemic?","o":["To prove Nintendo copied it","To show that an appetite for unpressured play existed before the pandemic amplified it","To argue cozy games began in 2020","To criticise its farming mechanics"],"a":1,"x":"Stardew Valley shows an appetite for unpressured play 'existed well before the pandemic amplified it', not that Nintendo copied it."},{"q":"How does the writer characterise researchers' final view of the cozy-games phenomenon?","o":["As a passing curiosity of lockdown boredom","As proof that competition is unnecessary","As evidence of a genuine, if modest, human need","As a purely commercial marketing success"],"a":2,"x":"Researchers read it as 'evidence of a genuine, if modest, human need', not passing lockdown boredom or mere marketing."}],"C2":[{"q":"What is the author's overall stance toward the cozy-games trend?","o":["Dismissive, treating it as a fleeting diversion born of tedium","Sympathetic, presenting it as evidence of a genuine, often unacknowledged human need","Neutral, offering only sales figures","Critical of its lack of challenge"],"a":1,"x":"The author is sympathetic, treating the trend as 'evidence of a genuine, if often unacknowledged, human need', not a fleeting diversion."},{"q":"The phrase describing Animal Crossing as 'a scale of adoption rarely matched by a game so deliberately devoid of spectacle' implies what?","o":["The game succeeded despite avoiding flashy spectacle","The game relied heavily on spectacle to sell","Spectacle is essential to commercial success","The game failed to reach a wide audience"],"a":0,"x":"It means the game reached huge sales 'despite' deliberately avoiding flashy spectacle, not because of it."},{"q":"How does the author treat the question of whether the game's timing was luck or foresight?","o":["Insists it was carefully planned marketing","Concludes it was pure coincidence","Says the answer is beside the point, since the effect was the same","Argues the timing hurt the game"],"a":2,"x":"The author says 'whether this timing reflected serendipity or foresight is beside the point', since the effect was the same either way."}]},levels:{B1:"\"Cozy games\" are a type of video game that many people enjoy today. In these games, there is no violence and no competition, and players cannot \"lose.\" Instead, players do calm, relaxing activities. They can go farming, decorate a house, go fishing, or spend time with friendly animal characters.\n\nThe most famous cozy game is \"Animal Crossing: New Horizons,\" made by the Japanese company Nintendo. It came out in March 2020, exactly when Covid-19 lockdowns were starting all over the world. Another popular cozy game is \"Stardew Valley,\" a smaller game about farming.\n\nDuring the pandemic, Animal Crossing became much more than a game. Because people could not meet in real life, they used the game instead. They held weddings, birthday parties, museum exhibitions, and even political campaign events inside it. In its first year, the game sold tens of millions of copies. It became one of the best-selling games ever made for the Nintendo Switch.\n\nMany players and researchers say that cozy games helped people during a hard time. The games gave people a gentle daily routine, small goals to complete, and a quiet way to stay connected with friends, even while everyone was apart.",B2:"\"Cozy games\" have become one of gaming's most comforting genres. Unlike traditional video games built around competition, conflict or the risk of losing, cozy games remove all of that pressure. There is no violence, no opponent to defeat, and no way to fail. Instead, players spend their time on gentle, low-stakes activities such as farming, decorating a home, fishing, or simply chatting with friendly animal characters who never judge them. The appeal lies in what these games refuse to offer: no timer pushing players forward and no leaderboard measuring their worth.\n\nThe genre's most recognisable title is \"Animal Crossing: New Horizons,\" developed by Nintendo and released in March 2020, at the exact moment Covid-19 lockdowns began spreading across the globe. The indie farming game \"Stardew Valley\" occupies a similar niche, offering the same unhurried, pressure-free rhythm on a smaller scale. Neither game asks anything of the player beyond patience and a willingness to slow down.\n\nWhat happened next turned Animal Crossing into far more than a hit release. With real-world gatherings suddenly impossible, people began recreating major life events inside the game itself: virtual weddings, birthday parties, museum exhibitions, and even political campaign events all took place on its digital islands. Within its first year, the game had sold tens of millions of copies, making it one of the best-selling titles ever released for the Nintendo Switch.\n\nFor players and researchers alike, this success reflected something deeper than entertainment. Cozy games offered a gentle sense of routine at a time when normal structure had collapsed, along with small, achievable daily accomplishments and a quiet form of social connection that let friends feel close even while they were physically kept apart. This gentle appeal has outlasted the pandemic itself, as the genre continues to attract players who simply want a softer kind of escape.",C1:"The rise of \"cozy games\" reflects a quiet rebellion against the conventions that have long defined the video game industry. Rather than rewarding players for competition, conquest or speed, this genre deliberately strips away conflict altogether: there is no violence to inflict, no opponent to outmanoeuvre, and crucially, no mechanism by which a player can \"lose.\" What remains is a curated set of unhurried pursuits, tending crops, decorating a home, fishing by a quiet river, or simply keeping company with amiable animal characters who ask nothing in return.\n\nNo title exemplifies this ethos more completely than \"Animal Crossing: New Horizons,\" Nintendo's flagship entry in the genre, which arrived in March 2020 at the precise moment Covid-19 lockdowns were beginning to spread across the world. Its release, whether by fortunate coincidence or shrewd timing, positioned it as an unlikely refuge just as ordinary life ground to a halt. The indie title \"Stardew Valley,\" built around similarly gentle farming mechanics on a more modest scale, had already established that an appetite for this kind of unpressured play existed well before the pandemic amplified it.\n\nWhat followed transformed Animal Crossing from a successful release into something closer to a cultural institution. Deprived of the ability to gather in person, players began staging entire life events within its pixelated confines: weddings were held on virtual beaches, birthdays celebrated with in-game decorations, museum exhibitions curated and opened to visiting friends, and even political campaign events, staged by real candidates seeking an audience unreachable through traditional means. The commercial results matched this cultural weight; within its first year on the market, the game sold tens of millions of copies, establishing itself as one of the best-selling titles ever released for the Nintendo Switch console.\n\nResearchers and players alike have since come to regard this phenomenon as more than a passing curiosity of lockdown boredom. Cozy games, they argue, supplied something genuinely therapeutic during a period defined by disruption: a gentle, dependable sense of routine when external structure had collapsed, a stream of small and easily attainable accomplishments to mark the passing of otherwise indistinguishable days, and a quiet, undemanding form of social connection that allowed friendships to persist even as physical distance kept people apart. In this light, the popularity of cozy games appears less like an accident of timing and more like evidence of a genuine, if modest, human need.",C2:"The ascendancy of \"cozy games\" within the broader video game landscape amounts to a quiet repudiation of the industry's founding assumptions. Where mainstream titles have traditionally conscripted players into cycles of competition, conquest and mortal risk, this genre dispenses with such stakes entirely: violence is absent, adversaries do not exist to be vanquished, and defeat, in any meaningful sense, is structurally impossible. What replaces this familiar architecture of challenge is a curated repertoire of unhurried, restorative pursuits, tending to crops, furnishing and decorating a home, fishing at an unhurried pace, or simply keeping companionable time with amiable animal characters who make no demands and pass no judgment.\n\nNo single title has come to embody this sensibility more thoroughly than \"Animal Crossing: New Horizons,\" Nintendo's flagship contribution to the genre, whose release in March 2020 coincided, with almost uncanny precision, with the onset of Covid-19 lockdowns across much of the globe. Whether this timing reflected serendipity or foresight is beside the point; the effect was to position an ostensibly modest life-simulation game as an improbable sanctuary at the exact moment ordinary existence stalled. It should be noted that this appetite for unpressured play predated the pandemic: the indie farming game \"Stardew Valley,\" built on comparably gentle mechanics at a smaller scale, had already demonstrated that a substantial audience existed for games asking nothing more of their players than patience.\n\nWhat followed elevated Animal Crossing from a commercially successful release into something approaching a cultural institution in its own right. With conventional gatherings rendered impossible, players began transposing entire categories of real-world ceremony into the game's pixelated confines: weddings were solemnised on virtual shorelines, birthdays marked with painstakingly arranged decorations, museum exhibitions curated and opened to visiting friends, and even political campaign events staged within its islands by candidates seeking an audience otherwise unreachable through conventional channels. The commercial trajectory mirrored this cultural weight: within its first year on the market, the game sold tens of millions of copies, cementing its status as one of the best-selling titles ever released for the Nintendo Switch console, a scale of adoption rarely matched by a game so deliberately devoid of spectacle.\n\nFor researchers and players alike, this phenomenon has since come to represent something considerably more consequential than a fleeting diversion born of lockdown tedium. Cozy games, it is argued, supplied a form of psychological scaffolding during a period defined by upheaval and uncertainty: a gentle, dependable sense of routine at a moment when external structure had largely disintegrated; a steady accumulation of small, readily attainable accomplishments capable of lending shape to otherwise indistinguishable days; and a quiet, undemanding mode of social connection that permitted friendships to persist despite the imposition of physical distance. Understood in these terms, the popularity of cozy games during the pandemic seems less an accident of fortunate timing than evidence of a genuine, if often unacknowledged, human need, one that has continued to sustain the genre's appeal well beyond the circumstances that first brought it to prominence."}},
{id:"minecraft-bestselling-game",title:"Built From Blocks: How Minecraft Became the Best-Selling Game Ever",tag:"Sweden · Technology",img:"images/reading/minecraft-bestselling-game.jpg",quiz:{"B1":[{"q":"What do players use to build things in Minecraft?","o":["Simple, blocky cubes","Real bricks and wood","Cards and dice","Only computer code"],"a":0,"x":"Players build with 'simple, blocky cubes', not real bricks, cards or only code."},{"q":"Who bought Mojang in 2014?","o":["Nintendo","The technology company Microsoft","Markus Persson","Sony"],"a":1,"x":"'The technology company Microsoft bought Mojang' in 2014, not Nintendo, Sony or Persson."},{"q":"Roughly how many copies has Minecraft sold?","o":["Well over 300 million","About 3 million","Around 30 million","Fewer than 1 million"],"a":0,"x":"Minecraft has sold 'well over 300 million copies', so the smaller figures fall short."}],"B2":[{"q":"According to the passage, what makes Minecraft so endlessly appealing?","o":["Its strict, fixed storyline","Its open-ended creativity","Its competitive ranking system","Its short playing time"],"a":1,"x":"It's 'precisely this open-ended creativity' that keeps the game endlessly appealing, not a fixed story or ranking system."},{"q":"Why did Microsoft acquire Mojang in 2014?","o":["Because Mojang was going out of business","Because it recognised the enormous potential of the game","Because Notch asked them to","Because schools demanded it"],"a":1,"x":"Microsoft acquired Mojang 'recognising the enormous potential of the game', not because Mojang was failing or Notch asked."},{"q":"How is Minecraft: Education Edition described?","o":["A version used in schools to teach subjects like history and coding","A paid multiplayer server","A live-action film","A competitive esports mode"],"a":0,"x":"Education Edition is a school version teaching 'history, engineering, and computer coding', not a paid server or film."}],"C1":[{"q":"What does the passage identify as the key reason Minecraft resonates with a broad audience?","o":["Its tightly scripted narrative","Its open-endedness and refusal to impose limits","Its focus on competition","Its low price"],"a":1,"x":"The credit goes to 'this open-endedness, this refusal to impose limits', not a scripted narrative or low price."},{"q":"How does the passage characterise Microsoft's 2014 acquisition of Mojang?","o":["A rescue of a failing studio","A move reflecting how significant Minecraft had already become","A decision that reduced the game's reach","An unpopular choice among players"],"a":1,"x":"The acquisition 'reflected just how significant Minecraft had already become', not a rescue of a failing studio."},{"q":"In using Minecraft: Education Edition, the passage says educators harness what?","o":["The game's competitive leaderboards","The game's inherent creativity for pedagogical ends","The game's multiplayer servers","The game's merchandise sales"],"a":1,"x":"Educators harness 'the game's inherent creativity for genuinely pedagogical ends', not leaderboards or merchandise."}],"C2":[{"q":"The passage describes Minecraft as functioning 'less like conventional entertainment and more like' what?","o":["A flexible medium adaptable to whichever curriculum an educator has in mind","A traditional narrative-driven game","A competitive esport","A short-lived fad"],"a":0,"x":"It works 'less like conventional entertainment and more like a flexible medium adaptable to whichever curriculum an educator has in mind'."},{"q":"What does the author emphasise by calling the game's origins 'almost modest'?","o":["That it was expensive to develop","The contrast between humble beginnings and its eventual enormous significance","That it was always destined to fail","That it had major publisher backing from the start"],"a":1,"x":"'Almost modest' origins point up the contrast between humble, pixelated beginnings and the game's eventual enormous significance."},{"q":"What does the phrase describing the acquisition as 'not an ending but an inflection point' convey?","o":["Microsoft's purchase stalled the game's growth","The purchase marked the start of further sustained expansion","The game stopped selling after 2014","Mojang left the industry"],"a":1,"x":"'Not an ending but an inflection point' means the purchase began 'a further, sustained expansion', not a halt or a stop in sales."}]},levels:{B1:"Minecraft is a video game where players use simple, blocky cubes to build almost anything they can imagine. In the game, people can create simple houses, working machines, and even huge, detailed copies of real cities and famous landmarks. This creative freedom is one of the main reasons the game has become so popular.\n\nA Swedish developer named Markus \"Notch\" Persson first created Minecraft. The game was released in 2011 by Mojang Studios, a company based in Sweden. In 2014, the technology company Microsoft bought Mojang. Since then, the game has continued to grow in popularity all over the world.\n\nToday, Minecraft is known as the best-selling video game of all time. It has sold well over 300 million copies across all the different platforms it has been released on, such as computers, consoles, and phones. Schools around the world also use a special version called \"Minecraft: Education Edition\" to teach subjects like history, engineering, and computer coding.\n\nThe game's success has led to much more than just sales. Minecraft inspired a live-action film and a huge range of merchandise, from toys to clothes. It also created a large, dedicated global community. Millions of fans run massive multiplayer servers, where they play, build, and explore together every single day.",B2:"Minecraft is a sandbox building and survival video game that gives players remarkable creative freedom. Using nothing more than simple, blocky cubes, players can construct almost anything they can imagine, from modest houses and cleverly working machines to enormous, highly detailed recreations of real cities and
