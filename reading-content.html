ts stadiums only"],"a":0,"x":"New smoke-free outdoor zones cover areas near schools, hospitals and children's playgrounds."}],"C1":[{"q":"Why is the birth-date mechanism described as 'self-perpetuating'?","o":["It requires yearly new laws to continue","The threshold keeps climbing without further legislation","It ends automatically after ten years","It depends on shops volunteering"],"a":1,"x":"Anchored to a fixed birth date, the age threshold climbs every year by itself, no new laws needed."},{"q":"What do the Commons and Lords votes suggest about opposition to the ban?","o":["Opposition was the clear majority view","Opposition, though vocal, remained a minority position","There was no opposition at all","The Lords fully removed the ban"],"a":1,"x":"Opposition was loud but outvoted, so it stayed a minority view in both houses."},{"q":"What does the passage say most distinguishes the UK's approach from New Zealand's?","o":["The UK's greater ambition of the idea","The UK's version actually took effect and survived","The UK banned vapes but not tobacco","The UK used a fixed age instead"],"a":1,"x":"The real difference is follow-through. The UK's law actually took effect and survived, unlike New Zealand's."}],"C2":[{"q":"Why does the author call the birth-date architecture 'quietly radical'?","o":["It bans tobacco outright immediately","The purchase age ratchets up yearly with no terminal point, needing no new law","It only affects a single year's cohort","It lowers the legal age over time"],"a":1,"x":"It looks modest, yet the age ratchets up yearly with no end point and no further legislation, hence quietly radical."},{"q":"How does the passage characterise the UK's true achievement?","o":["Conceptual originality of the idea","Follow-through, implementing an idea New Zealand abandoned","Being the first to propose the ban","Repealing an earlier tobacco law"],"a":1,"x":"The real achievement is follow-through, carrying out an idea New Zealand dropped rather than inventing it."},{"q":"The powers over vape flavours and packaging are framed as an acknowledgment that:","o":["Smoking is no longer a concern for anyone","Vaping is now the more immediate concern among the young","Vapes are completely harmless","Tobacco and vapes are identical products"],"a":1,"x":"New powers over vape flavours and packaging admit that vaping is now the bigger worry among young people."}]},levels:{B1:"In April 2026, the United Kingdom passed an important new law about smoking. On 29 April 2026, the Tobacco and Vapes Bill received Royal Assent, and it became the Tobacco and Vapes Act 2026. This law creates a \"smoke-free generation.\" It says that anyone born on or after 1 January 2009 can never legally buy tobacco products, for their whole life. Shops will not be allowed to sell them cigarettes, now or at any point in the future. This part of the law starts on 1 January 2027. Because the rule uses a birth date, not a fixed age, the legal age to buy tobacco will rise every single year. In 2027, an eighteen-year-old cannot buy cigarettes. In 2032, a twenty-three-year-old still cannot buy them. The age limit never stops rising. The new law also bans single-use disposable vapes; this part of the rule already started in June 2025. In addition, the government can now limit vape flavors, packaging, and advertising that targets children. Some outdoor places, such as areas near schools, hospitals, and children's playgrounds, will also become smoke-free zones. New Zealand had a similar idea in 2022, but it cancelled the law in 2023, before the rule ever started. Because of this, the UK is now the first country in the world to actually use this kind of tobacco ban.",
B2:"On 29 April 2026, the United Kingdom's Tobacco and Vapes Bill received Royal Assent, formally becoming the Tobacco and Vapes Act 2026. The bill had moved through Parliament with strong backing before it finally became law, bringing years of debate over how to reduce smoking rates in Britain to a concrete legislative outcome. The centerpiece of the new law is what has been nicknamed a \"smoke-free generation\" policy: it makes it illegal, for life, to sell tobacco products to anyone born on or after 1 January 2009, with this specific restriction coming into force on 1 January 2027. What makes the measure unusual is that the cutoff is fixed to a date of birth rather than to a particular age. As a result, the legal purchase age for tobacco does not stay still; it effectively climbs by one year with every year that passes, since each new birth cohort is added to the group that can never buy cigarettes. In theory, the rising age limit has no endpoint. The Act does considerably more than restrict future sales, however. Single-use disposable vapes have already been banned nationwide, a rule that came into force back in June 2025, and the government has now been given powers to further restrict vape flavors, packaging, and advertising that is aimed at children. Smoke-free zones are being extended as well, covering certain outdoor spaces such as areas close to schools, hospitals, and children's playgrounds. The idea of a generational tobacco ban is not entirely new. New Zealand passed comparable legislation in 2022, only to repeal it in 2023 before it ever actually took effect. This means the United Kingdom is now the first country in the world to genuinely implement a rolling, generational ban on tobacco sales, rather than simply legislating one and later abandoning it.",
C1:"On 29 April 2026, the Tobacco and Vapes Bill received Royal Assent, passing into law as the Tobacco and Vapes Act 2026, and thereby completing a legislative journey that had, at times, looked far from certain. The Act's defining provision is what campaigners have dubbed the \"smoke-free generation\" rule: from 1 January 2027, it will be illegal, permanently and without exception, to sell tobacco products to anyone born on or after 1 January 2009. Rather than fixing a single legal purchase age, as most countries do, the law anchors the restriction to a specific date of birth. The consequence, seemingly minor but structurally significant, is that the effective legal age of purchase rises automatically by a year every year, indefinitely, as each successive birth cohort ages into adulthood without ever qualifying to buy cigarettes legally. No further legislation is required to keep the threshold climbing; the mechanism is, in effect, self-perpetuating, embedding a policy commitment that future governments would have to actively legislate against, rather than merely decline to renew, if they ever wished to reverse it.\n\nThat such a far-reaching provision survived the legislative process at all was not a foregone conclusion. The bill cleared its House of Commons third reading by a decisive 366 votes to 41 on 26 March 2025, and a subsequent attempt in the House of Lords to strip out the generational ban specifically was defeated by an even wider margin, 246 votes to 78, suggesting that opposition to the core mechanism, though vocal, remained a minority position throughout. Beyond the generational sales ban, the Act consolidates several related measures: single-use disposable vapes, already prohibited since June 2025, remain banned, while ministers have been granted powers to further restrict vape flavors, packaging, and advertising considered likely to appeal to children. Certain outdoor spaces, including areas near schools, hospitals, and children's playgrounds, have also been designated smoke-free zones.\n\nWhat arguably distinguishes the UK's approach from earlier attempts elsewhere is not the ambition of the idea but its survival. New Zealand legislated a strikingly similar generational ban in 2022, only to repeal it in 2023, before the policy was ever implemented in practice. The UK's Act therefore represents, at least for now, the first instance of a rolling generational tobacco ban actually taking effect anywhere in the world, rather than merely being proposed and subsequently abandoned. Whether the policy proves durable in practice, surviving future changes of government in the way the New Zealand version did not, remains a question that only time will be able to answer.",
C2:"On 29 April 2026, the Tobacco and Vapes Bill received Royal Assent, becoming the Tobacco and Vapes Act 2026, and with it the United Kingdom acquired a distinction no other country currently holds: that of the first, and so far only, nation to have actually implemented a rolling, generational ban on the sale of tobacco. The Act's central provision, popularly if imperfectly termed the \"smoke-free generation\" rule, makes it illegal, for life and without exception, to sell tobacco products to anyone born on or after 1 January 2009, a restriction that takes effect from 1 January 2027. What lends the measure its peculiar potency is not merely its severity but its architecture: rather than pegging the restriction to a fixed legal age, as virtually every other tobacco control regime does, the law fixes it to a date of birth. The effect is quietly radical. Because each new birth cohort is, by definition, born after the cutoff, the legal purchase age for tobacco ratchets upward by precisely one year with every year that passes, requiring no further act of Parliament to sustain itself and, at least in principle, having no terminal point at all.\n\nThat so consequential a mechanism survived intact owes something to the scale of its political backing. The bill passed its House of Commons third reading by 366 votes to 41 on 26 March 2025, a margin that left little ambiguity about the strength of cross-party support, and when peers in the House of Lords later attempted to strip the generational ban out of the bill entirely, that effort was rejected still more emphatically, by 246 votes to 78. The Act's remit, moreover, extends well beyond the headline provision. Single-use disposable vapes, already outlawed since June 2025, remain prohibited, while ministers have been handed new powers to restrict vape flavors, packaging, and advertising judged likely to appeal to children, an acknowledgment that vaping, not smoking, is now the more immediate concern among the young. Smoke-free zones, too, have been extended outward, into outdoor spaces near schools, hospitals, and children's playgrounds, in a further narrowing of the spaces in which tobacco can be encountered at all.\n\nThe idea itself, notably, is not a British invention. New Zealand legislated a near-identical generational ban back in 2022, only to repeal it the following year, before the policy had ever taken effect, a reversal driven largely by a change of government rather than by any evidence that the approach did not work. The United Kingdom's achievement, then, is not conceptual originality but follow-through, seeing through to implementation an idea that its first legislative sponsor abandoned before it could be tested. Whether other governments, watching a policy already survive scrutiny in one country, will now find the political room to attempt what New Zealand once flinched from is, for the moment, the open question the UK's experiment leaves behind."}},
{id:"pig-kidney-bridge-transplant",title:"271 Days: Life With a Pig's Kidney",tag:"United States \u00b7 Health",img:"images/reading/pig-kidney-bridge-transplant.jpg",quiz:{"B1":[{"q":"Where did Tim Andrews's transplanted kidney come from?","o":["Another person","A pig","A machine","A human donor in 2026"],"a":1,"x":"Not from another person, but from a pig whose genes scientists had changed first. That's the key detail here."},{"q":"How many days did the pig kidney work before it was removed?","o":["130 days","271 days","90 days","365 days"],"a":1,"x":"Doctors removed it on 27 October 2025 after 271 days, beating Towana Looney's earlier 130-day record."},{"q":"What treatment did Andrews return to after the pig kidney was removed?","o":["Dialysis","A second pig kidney","Gene therapy","Surgery on his heart"],"a":0,"x":"Once the pig kidney came out, he went back on dialysis, the machine that cleans the blood, before later getting a human kidney."}],"B2":[{"q":"What was the purpose of most of the 59 gene edits described?","o":["To stop the immune system attacking the organ","To disable dormant PERV retrovirus sequences in the pig's genome","To prevent blood clotting","To make the kidney larger"],"a":1,"x":"Those 59 changes switched off old hidden virus genes, the PERVs, so they couldn't harm Andrews. Only about 10 edits guarded against rejection and clotting."},{"q":"What record did Andrews set with the pig kidney?","o":["Longest-surviving recipient of a xenotransplanted organ","First person to receive a human kidney","Youngest transplant patient","First person to use dialysis"],"a":0,"x":"Living 271 days made him the person who had lasted longest with an animal organ, past the old 130-day record."},{"q":"Why do researchers see xenotransplantation as promising?","o":["It is cheaper than dialysis","It could ease a chronic shortage of donor organs for about 90,000 waiting patients","It removes the need for any surgery","It cures all kidney disease"],"a":1,"x":"With around 90,000 people waiting for a kidney at any time, doctors hope animal organs can reach many more patients."}],"C1":[{"q":"Roughly how many of the 69 gene edits targeted immune and clotting responses?","o":["About 10","About 59","About 69","About 90"],"a":0,"x":"Of the 69 changes, about 10 held off rejection and dangerous blood clots. The other 59 disabled the pig's hidden PERV viruses."},{"q":"According to the passage, why did the kidney's long duration matter to researchers?","o":["It proved pig organs never fail","It gave data on how a modified organ behaves over time, not just early weeks","It ended the need for human donors","It shortened the transplant waiting list"],"a":1,"x":"A long run let them watch how a modified organ holds up across months, not just the first few weeks after surgery."},{"q":"Why is the 16 January 2026 human transplant called arguably as significant as the survival record?","o":["It showed a pig organ can act as a bridge to a human transplant","It set a new survival record","It proved dialysis is unnecessary","It replaced the need for gene edits"],"a":0,"x":"He became one of the first to use an animal organ as a bridge, buying time until a human kidney came free."}],"C2":[{"q":"The author suggests historians may judge which part of Andrews's case most important?","o":["The 271-day survival record","The 'second act', the pig organ serving as a bridge to a human kidney","The 69 gene edits","His return to dialysis"],"a":1,"x":"Notice the bridge role: the pig organ bought time for a later human transplant, and that may prove the more lasting achievement."},{"q":"Andrews is described as 'a test case' for which long-standing ambition?","o":["Curing all viral infections","Solving organ scarcity by using organs from another species","Ending the use of dialysis machines","Making surgery painless"],"a":1,"x":"With so many patients waiting, his case tests xenotransplantation as an answer to the shortage of human organs."},{"q":"The passage's final tone about xenotransplantation's future is best described as:","o":["Certain it will fail","Balanced and open, weighing bridge therapy against narrow proof of concept","Purely celebratory with no doubts","Dismissive of the whole field"],"a":1,"x":"It neither cheers nor dismisses the field. It weighs the bridge success against the limits of a single case."}]},levels:{B1:"In January 2025, doctors gave a new kidney to Tim Andrews, a 67-year-old retired engineer from Concord, New Hampshire. This kidney did not come from another person. It came from a pig. Scientists at Mass General Brigham and a company called eGenesis had changed the pig's genes before the operation, making 69 changes in total. About 10 of these changes stopped Andrews's body from rejecting the kidney and stopped his blood from forming dangerous clots. The other 59 changes turned off old virus genes hidden inside the pig's DNA, called PERVs, so those viruses could not harm Andrews. For many months, the pig kidney worked inside his body. On 27 October 2025, after 271 days, doctors removed it because it was not working well enough anymore. This made Andrews the person who had lived longest with an animal organ inside him, breaking the earlier record of 130 days, set by a woman named Towana Looney. After the operation, Andrews went back on dialysis, a treatment that cleans the blood using a machine. Then, on 16 January 2026, he received a new kidney from a human donor. He became one of the first patients to use an animal organ as a bridge to a later human transplant. About 90,000 people wait for a kidney in the United States at any time, so doctors hope this method can help many more patients.",
B2:"In January 2025, Tim Andrews, a 67-year-old retired engineer from Concord, New Hampshire, received a kidney transplant unlike almost any before it: the organ came not from a human donor but from a genetically modified pig. The procedure was carried out through a pilot study run jointly by Mass General Brigham and the biotech company eGenesis, and it depended on 69 separate gene edits made to the animal before Andrews ever entered the operating theatre. Roughly 10 of these edits were designed to stop his immune system from attacking the foreign organ and to prevent dangerous blood clotting, while the remaining 59 disabled ancient retrovirus sequences, known as PERVs, that lie dormant in every pig's genome and could otherwise pose an infection risk to a human recipient.\n\nThe transplant worked far longer than doctors had dared to expect. On 27 October 2025, after 271 days, surgeons finally removed the kidney because its function was declining, but by then Andrews had already become the longest-surviving recipient of a xenotransplanted organ, comfortably passing the previous record of 130 days set by Towana Looney. Once the pig kidney was removed, Andrews returned to dialysis, the machine-based treatment that filters the blood of patients whose kidneys can no longer do the job.\n\nThe story did not end there. On 16 January 2026, Andrews received a kidney from a human donor, making him one of the first patients ever to successfully bridge the gap between an animal organ and a human one while waiting for a suitable match. With roughly 90,000 people currently on the US kidney transplant waiting list, researchers see xenotransplantation as a promising, if still experimental, way of easing a chronic shortage of donor organs, and both milestones in Andrews's case were widely reported as significant steps forward for the field.",
C1:"In January 2025, Tim Andrews, a 67-year-old retired engineer from Concord, New Hampshire, underwent a procedure that would have seemed like science fiction only a decade earlier: the transplantation of a genetically modified pig kidney, performed as part of a pilot study jointly run by Mass General Brigham and the biotechnology company eGenesis. What made the organ viable at all was an extraordinary programme of genetic engineering carried out on the donor pig beforehand, amounting to 69 distinct gene edits. Roughly ten of these targeted the immune and clotting responses that would otherwise cause a human body to reject, or violently attack, foreign tissue, while the remaining 59 were aimed at silencing PERVs, ancient retrovirus sequences embedded deep within the pig genome that might, in theory, pose an infection risk once transplanted into a person.\n\nFor 271 days, the kidney functioned inside Andrews's body, a span that, by the time surgeons removed it on 27 October 2025 owing to declining performance, had already made him the longest-surviving recipient of a xenotransplanted organ on record, more than doubling the previous benchmark of 130 days set by Towana Looney. That the organ failed eventually should not obscure how remarkable its duration was; each additional day it functioned offered researchers new data on how a modified animal organ behaves inside a human body over time, rather than merely in the first weeks after surgery, when most such experiments have historically ended.\n\nOnce the pig kidney was removed, Andrews resumed dialysis, the standard fallback treatment for patients whose kidneys can no longer filter blood adequately. He did not remain on it indefinitely, however: on 16 January 2026, he received a kidney from a human donor, becoming one of the first patients to bridge successfully from an animal organ to a human one while awaiting a compatible match. This sequence, arguably as significant as the survival record itself, suggests that xenotransplantation need not always be judged solely by how long a pig organ lasts, but also by whether it can buy a critically ill patient enough time to receive a conventional transplant.\n\nGiven that some 90,000 people are on the US kidney waiting list at any given moment, and that donor organs remain chronically scarce, both episodes in Andrews's case were widely reported as milestones in a field still cautiously proving that animal-to-human transplantation can move from laboratory promise toward genuine clinical practice.",
C2:"When Tim Andrews, a 67-year-old retired engineer from Concord, New Hampshire, was wheeled into an operating theatre in January 2025 to receive a kidney harvested not from a fellow human but from a genetically modified pig, he became, whether he fully appreciated it at the time or not, a test case for one of medicine's oldest and most persistently frustrated ambitions: solving organ scarcity by borrowing organs from another species altogether. The procedure, undertaken through a pilot study jointly conducted by Mass General Brigham and the biotechnology firm eGenesis, rested on a feat of genetic engineering so intricate that it is easy to overlook just how much had to go right before the operation could even be attempted. The donor pig carried 69 separate gene edits, roughly ten of which were engineered to neutralise the immune and clotting cascades that would ordinarily cause a human body to reject foreign tissue within hours, while the remaining 59 were devoted to silencing PERVs, ancient retrovirus sequences fossilised within the pig genome, whose theoretical capacity to reactivate and infect a human host had long been cited as a reason for caution in this field.\n\nFor 271 days, remarkably, the kidney simply worked, and it was not until 27 October 2025, when its function had begun to decline, that surgeons finally removed it, by which point Andrews had already eclipsed the previous xenotransplant survival record of 130 days, set by Towana Looney, by a considerable margin. What distinguished this milestone from earlier, shorter-lived experiments was not merely its duration but what that duration implied: that a heavily engineered animal organ might plausibly function inside a human body not for days or weeks, but for the better part of a year, generating a correspondingly richer body of evidence about how such organs age, falter and, eventually, fail, evidence that no earlier case, including Looney's, had been able to supply in comparable depth.\n\nYet the more consequential twist in Andrews's case may have come afterward, and it is arguably this second act, rather than the record itself, that historians of the field will eventually judge most important. Returned to dialysis once the pig kidney was withdrawn, he received a human donor kidney on 16 January 2026, becoming one of the first patients to demonstrate that a xenotransplant could serve not as a permanent solution but as a bridge, buying a desperately ill patient enough time to reach a conventional, and still far scarcer, human match.\n\nWith approximately 90,000 people occupying the US kidney waiting list at any given moment, a queue that donor supply has never come close to clearing, both episodes were reported, with good reason, as milestones in a field that has spent decades oscillating between hype and disappointment. Whether xenotransplantation ultimately matures into a genuine bridge therapy, quietly buying time for patients until a human organ becomes available, or is remembered instead as a remarkable but narrow proof of concept, is a question Andrews's 271 days can only begin to answer."}},
{id:"louvre-crown-jewels-heist",title:"Eight Minutes at the Louvre",tag:"France \u00b7 Culture",img:"images/reading/louvre-crown-jewels-heist.jpg",quiz:{"B1":[{"q":"How long were the thieves inside the museum?","o":["About four minutes","About eight hours","About thirty minutes","About one hour"],"a":0,"x":"The whole crime ran under eight minutes, but the thieves were actually inside only about four."},{"q":"What did the thieves dress as?","o":["Police officers","Construction workers","Museum guides","Tourists"],"a":1,"x":"They dressed like construction workers and used a furniture lift to reach a first-floor balcony."},{"q":"Which item did the thieves drop in the street during their escape?","o":["An emerald necklace","The crown of Empress Eugenie","A sapphire tiara","A corsage bow"],"a":1,"x":"As they fled they dropped Empress Eugenie's crown, found later, damaged but mostly intact."}],"B2":[{"q":"What made the theft especially remarkable, according to the passage?","o":["It happened at night with no witnesses","Its speed, under eight minutes, during normal opening hours","It involved dozens of thieves","No jewels were actually taken"],"a":1,"x":"What stands out: it happened in daylight, with visitors present, and was done in under eight minutes."},{"q":"How did prosecutors describe the value of the loss?","o":["Worth about 88 million euros, but the historical loss was far greater","Worth exactly 88 million euros and nothing more","Impossible to estimate in any way","Less than the cost of the repairs"],"a":0,"x":"Prosecutors put the jewels at about 88 million euros, yet stressed the loss to France's history mattered far more than the money."},{"q":"What was the situation with the jewels as of early 2026?","o":["They had all been recovered","They had not been recovered and their whereabouts remained a mystery","They were found damaged in the street","They were returned by the thieves"],"a":1,"x":"By early 2026 the jewels still hadn't turned up, even though several people had already been charged."}],"C1":[{"q":"How did the disguise as construction workers help the thieves?","o":["It let them move openly around the exterior without arousing suspicion","It gave them keys to the gallery","It hid their faces from all cameras forever","It let them enter after closing time"],"a":0,"x":"Dressed as workers with a furniture lift, they could operate in plain sight and nobody thought to question them."},{"q":"What did the dropped, damaged crown hint at, according to the passage?","o":["The thieves' careful planning","The haste with which the thieves fled","That the crown was a fake","That the thieves were caught at the scene"],"a":1,"x":"Dropping and damaging Eugenie's crown in the street points to a hurried, panicked escape, not calm, careful planning."},{"q":"Why did prosecutors say the 88 million euro figure understated the true cost?","o":["Insurance would cover more than that","The pieces' historical significance could not be converted into money","The jewels were worth far less than that","The repairs would cost more than the jewels"],"a":1,"x":"They said the real cost sat in the pieces' history for France, something no price tag can capture."}],"C2":[{"q":"The recovered crown of Empress Eugenie is called an 'unlikely emblem' of an operation defined by:","o":["Both precision and panic","Pure luck alone","Careful, unhurried planning","Violence and force"],"a":0,"x":"That recovered crown captures the raid's two faces: a precise, planned entry and a panicked, clumsy getaway."},{"q":"The author stresses the theft's 'ordinariness as a piece of theatre' mainly to highlight:","o":["How violent the raid was","How the thieves hid in plain sight using mundane disguises and tools","How little was actually stolen","How quickly the jewels were recovered"],"a":1,"x":"Everyday workwear, a furniture lift and a disc cutter let them perform the theft openly, unremarked among visitors."},{"q":"The closing question is meant to provoke reflection on:","o":["The exact market value of the jewels","The gap between how secure a nation believes its treasures are and how easily they can be taken","Which empress owned the most jewels","Whether the museum should close permanently"],"a":1,"x":"The ending nudges you to weigh how confidently a country guards its treasures against how fast these vanished."}]},levels:{B1:"On October 19, 2025, at about 9:30 a.m., four thieves stole eight pieces of the French Crown Jewels from the Galerie d'Apollon at the Louvre in Paris. The whole crime took less than eight minutes. The thieves were only inside the museum for about four minutes, during normal opening hours, while visitors were there.\n\nThe thieves dressed like construction workers. They used a furniture lift, a truck with a basket-crane, to reach a balcony on the first floor. Then they cut through a window with a disc cutter and climbed inside.\n\nThey stole a tiara, necklace, and earring from a sapphire set that had belonged to Queens Marie-Amelie and Hortense. They also took an emerald necklace and earrings that belonged to Empress Marie Louise, and a tiara, brooch, and corsage bow that belonged to Empress Eugenie. During their escape, they dropped the crown of Empress Eugenie in the street. It was found later, damaged, but most of it was still there.\n\nFrench prosecutors said the stolen jewels were worth about 88 million euros, but that the loss for France's history was much bigger than the money.\n\nBy late November 2025, four people, and later a fifth, were charged with organized gang theft. Most were men in their thirties from the Seine-Saint-Denis area. By early 2026, the jewels still had not been found.",
B2:"On the morning of October 19, 2025, at around 9:30 a.m., four thieves carried out a daring raid on the Louvre in Paris, making off with eight pieces of the French Crown Jewels from the museum's Galerie d'Apollon. What made the theft so remarkable was its speed: the entire operation lasted under eight minutes, with the thieves spending only about four minutes inside the building itself, and it took place during normal opening hours, while the museum was open to the public.\n\nTo gain entry, the gang disguised themselves as construction workers, a simple trick that allowed them to operate in plain sight. They used a furniture lift, essentially a truck fitted with a basket-crane, to reach a balcony on the first floor, then cut through a window with a disc cutter before climbing inside.\n\nAmong the pieces stolen were a tiara, a necklace, and an earring from a sapphire set once worn by Queens Marie-Amelie and Hortense, an emerald necklace and earrings that had belonged to Empress Marie Louise, and a tiara, brooch, and corsage bow associated with Empress Eugenie. In their haste to escape, the thieves dropped the crown of Empress Eugenie in the street; it was later recovered, damaged but largely intact.\n\nFrench prosecutors placed the value of the stolen jewels at roughly 88 million euros, though they were careful to point out that the historical loss to France's heritage was, in their view, far greater than any monetary figure could capture.\n\nBy late November 2025, four suspects, and later a fifth, had been charged with organized gang theft. Most were men in their thirties from the Seine-Saint-Denis area, on the outskirts of Paris. As of early 2026, however, the jewels themselves had not been recovered, and their whereabouts remained a mystery.",
C1:"Shortly after 9:30 a.m. on October 19, 2025, four thieves executed what would become one of the most audacious museum heists in recent memory, making off with eight pieces of the French Crown Jewels from the Louvre's Galerie d'Apollon in central Paris. What distinguished the operation was not its scale but its speed and its brazenness: the entire affair took under eight minutes from start to finish, with the thieves present inside the museum itself for barely four minutes, and it unfolded during normal opening hours, with visitors and staff present throughout the building.\n\nThe method relied on disguise as much as on equipment. Posing as construction workers, a cover that let them move openly around the museum's exterior without arousing suspicion, the gang used a furniture lift, a truck equipped with a basket-crane, to reach a balcony on the first floor. From there, they cut through a window with a disc cutter, a tool ordinarily associated with legitimate building work rather than theft, and entered the gallery.\n\nThe haul itself spanned several distinct periods of French royal and imperial history. It included a tiara, necklace, and earring from a sapphire set once worn by Queens Marie-Amelie and Hortense; an emerald necklace and earrings that had belonged to Empress Marie Louise; and a tiara, brooch, and corsage bow associated with Empress Eugenie. Notably, the crown of Empress Eugenie did not leave the scene undamaged: it was dropped and abandoned in the street during the getaway, and although it was later recovered in a damaged state, it remained largely intact, a detail that hinted at the haste with which the thieves fled.\n\nAssessing the loss proved complicated. French prosecutors put a market value of roughly 88 million euros on the stolen jewels, while stressing that this figure understated the true cost, since the historical significance of the pieces to French national heritage could not, in their view, be meaningfully converted into a monetary sum.\n\nBy late November 2025, investigators had charged four suspects, later joined by a fifth, with organized gang theft; most were men in their thirties connected to the Seine-Saint-Denis area northeast of Paris. Identifying and charging suspects, however, proved considerably easier than recovering the jewels themselves: as of early 2026, the stolen pieces had not resurfaced, and their whereabouts remained entirely unknown, a gap between arrests and recovery that underlined how much of the case was still, in effect, unsolved.",
C2:"At roughly 9:30 in the morning on October 19, 2025, four thieves needed less than eight minutes, and barely four of those inside the building itself, to strip the Louvre's Galerie d'Apollon of eight pieces of the French Crown Jewels, a feat of criminal choreography that unfolded not under cover of darkness but in full daylight, during the museum's normal opening hours, with staff and visitors going about their business elsewhere in the building.\n\nThe audacity lay less in the theft's violence, of which there was none, than in its sheer ordinariness as a piece of theatre. Disguised as construction workers, a role so mundane as to be almost invisible amid the perpetual scaffolding of a major European capital, the thieves arrived in a furniture lift, a basket-crane truck of the kind used daily to move wardrobes and pianos into upper-floor apartments, and rode it calmly up to a balcony on the first floor. There, a disc cutter sliced through a window, converting a tool of routine renovation into an instrument for one of the boldest jewel thefts of the century.\n\nWhat they took reads like an inventory of nineteenth-century French court life: a tiara, necklace, and earring from a sapphire set worn by Queens Marie-Amelie and Hortense; an emerald necklace and earrings once belonging to Empress Marie Louise; and a tiara, brooch, and corsage bow associated with Empress Eugenie. Yet the getaway itself supplied the episode's most telling image, for in their evident haste the thieves dropped the crown of Empress Eugenie in the street outside, abandoning it as they fled; recovered afterward, damaged yet substantially intact, the crown became an unlikely emblem of an operation defined equally by precision and by panic.\n\nQuantifying what was lost proved harder than committing the crime itself. French prosecutors settled on a figure of roughly 88 million euros for the jewels, while insisting, pointedly, that this sum radically understated the true loss, since no market valuation could capture what these particular objects meant to France's sense of its own history.\n\nThe investigation that followed moved with a speed the thieves themselves might have appreciated. By late November 2025, four suspects, joined shortly afterward by a fifth, had been charged with organized gang theft, the majority of them men in their thirties with ties to the Seine-Saint-Denis area on the capital's northeastern fringe. What the investigation could not do, at least not by early 2026, was recover the jewels: their whereabouts remained wholly unknown, the pieces themselves absent from every account of the affair's aftermath. If four men could empty one of the world's most closely watched museums of its imperial jewels in under eight minutes, in broad daylight, what does that say about the gap between how securely a nation believes its treasures are guarded and how easily, in practice, that guard can be breached?"}},
{id:"first-american-pope",title:"Leo XIV: The First American Pope",tag:"Vatican City / United States \u00b7 Culture",img:"images/reading/first-american-pope.jpg",quiz:{"B1":[{"q":"Where was Robert Francis Prevost born?","o":["Chicago","Rome","Chiclayo","Vatican City"],"a":0,"x":"Prevost was born in Chicago on 14 September 1955, which makes him the first American pope."},{"q":"What new name did Prevost take when he became pope?","o":["Leo XIV","Leo XIII","Francis","Benedict"],"a":0,"x":"On his election he took the name Leo XIV, becoming the 267th bishop of Rome."},{"q":"How many times did the cardinals vote before choosing him?","o":["Four times","Two times","Seven times","Ten times"],"a":0,"x":"The cardinals voted four times, reaching their decision on the second day of the conclave."}],"B2":[{"q":"On which day of the conclave was the decision made?","o":["The second day","The first day","The third day","The fifth day"],"a":0,"x":"The decision came on the second day of the conclave, after four rounds of voting."},{"q":"In 2015, Prevost acquired citizenship of which country?","o":["Peru","Italy","Argentina","Spain"],"a":0,"x":"In 2015 he became Bishop of Chiclayo and took Peruvian citizenship that same year."},{"q":"What comparison did Leo XIV make when explaining his name?","o":["That artificial intelligence poses challenges comparable to the first industrial revolution","That modern wars resemble those of the 1800s","That the Church today faces the same threats as in ancient Rome","That climate change mirrors 19th-century pollution"],"a":0,"x":"He tied Leo XIII's letter on workers during the industrial revolution to today's challenge of artificial intelligence."}],"C1":[{"q":"According to the text, what likely shaped how cardinals weighed his candidacy?","o":["That much of his career had been spent outside the United States","That he had never worked outside Rome","That he was the youngest candidate available","That he had strong ties to American politics"],"a":0,"x":"His long service abroad, especially in Peru, likely eased worries about electing an American pope."},{"q":"How does the text interpret his taking Peruvian citizenship?","o":["As a genuine, long-term commitment rather than a mere symbolic gesture","As a temporary administrative requirement","As a step forced on him by the Vatican","As a purely diplomatic formality"],"a":0,"x":"Years as a bishop in Peru mark a real, lasting tie to the country, not a token gesture."},{"q":"Why does the writer say Leo XIV invoked Pope Leo XIII?","o":["To signal that AI poses a comparably disruptive challenge requiring moral engagement","To reject the teachings of earlier popes","To announce a specific new Church policy on technology","To distance himself from workers' rights debates"],"a":0,"x":"Just as Leo XIII faced the upheaval of industry, Leo XIV signals the Church must engage morally with AI."}],"C2":[{"q":"What does the speed of the decision suggest to the Vatican watchers described in the text?","o":["That the cardinals had settled on a candidate whose credentials transcended fears of American dominance","That the cardinals were deeply divided and rushed the vote","That the outcome had been decided long before the conclave","That American influence had been rejected outright"],"a":0,"x":"A quick, four-ballot result suggests his broad record outweighed any unease about choosing an American."},{"q":"According to the passage, what arguably neutralised the objection that an American pope might tilt the Church toward Washington?","o":["The breadth of his formation and work abroad","His refusal to discuss American politics","His relative youth and inexperience","His close ties to the United States government"],"a":0,"x":"His wide formation and years serving overseas answered the fear that an American might lean the Church toward Washington."},{"q":"What open question does the passage leave the reader with at its close?","o":["Whether a moral vocabulary made for factories can speak with equal authority to algorithms","Whether an American could ever truly lead a global Church","Whether the conclave acted too quickly in choosing him","Whether Leo XIII's writings were ever genuinely influential"],"a":0,"x":"It ends wondering whether a moral language built for the industrial age can speak as forcefully to AI."}]},levels:{B1:"On May 8, 2025, the Catholic Church elected a new pope, and for the first time in history, he was American. His name was Robert Francis Prevost, and he was born in Chicago on September 14, 1955. The College of Cardinals met in the Sistine Chapel, in Vatican City, to choose him. They voted four times, and on the second day of the meeting, called a conclave, they made their decision. Prevost took a new name, Leo XIV. He became the 267th bishop of Rome and the leader of about 1.4 billion Catholics around the world.\n\nBefore he became pope, Prevost had a long career in the Church. Before he entered the priesthood in Peru, he led the Augustinian religious order worldwide, from 2001 to 2013. In September 2015, he became Bishop of Chiclayo, in Peru, and that same year he also became a Peruvian citizen. He stayed in this role until 2023. Right before his election, he led a Vatican office called the Dicastery for Bishops, which checks and recommends new bishops worldwide.\n\nLeo XIV explained why he chose his new name. Pope Leo XIII led the Church from 1878 to 1903. In 1891, he wrote an encyclical, or important letter, called Rerum Novarum, about workers' rights during the first industrial revolution. Leo XIV said this history was connected to a new challenge today, artificial intelligence.",
B2:"On May 8, 2025, the Catholic Church elected its 267th pope, and for the first time in the institution's history, the new pontiff was American. Robert Francis Prevost, born in Chicago on September 14, 1955, was chosen by the College of Cardinals during a conclave held in the Sistine Chapel, in Vatican City. The decision came on the second day of deliberations, after four rounds of voting, known as ballots. Upon his election, Prevost adopted the papal name Leo XIV, taking on leadership of a global Catholic population estimated at roughly 1.4 billion people.\n\nLeo XIV's path to the papacy combined decades of religious leadership with direct pastoral experience abroad. Before entering the priesthood in Peru, he had already led the Augustinian religious order worldwide, serving from 2001 to 2013. In September 2015, he was named Bishop of Chiclayo, a diocese in Peru, and that same year he acquired Peruvian citizenship, underlining his ties to the country. He remained in that post until 2023. Immediately before his election, he headed the Vatican's Dicastery for Bishops, the office responsible for vetting and recommending candidates for bishop positions across the Catholic world, a role that gave him considerable influence over the Church's global leadership.\n\nThe name he chose was not accidental. Leo XIV explained that it referred to Pope Leo XIII, who led the Church from 1878 to 1903. In 1891, Leo XIII issued a landmark encyclical, Rerum Novarum, which addressed workers' rights at the height of the first industrial revolution, a period of rapid technological and economic change. Leo XIV drew an explicit parallel between that era and the present one, suggesting that artificial intelligence now poses comparable challenges to workers and society, and that the Church's teaching on these issues remains relevant today.",
C1:"On 8 May 2025, the College of Cardinals, meeting in conclave inside the Sistine Chapel, elected Robert Francis Prevost as the 267th bishop of Rome, making him the first American ever to hold the office. Born in Chicago on 14 September 1955, Prevost had spent much of his career outside the United States, a fact that likely shaped how cardinals weighed his candidacy, since a truly global Church arguably benefits from leadership with pastoral experience beyond its historic power centres. His election came relatively swiftly by the standards of modern conclaves: cardinals reached a decision on only the second day of deliberations, after just four ballots, and he subsequently took the name Leo XIV, assuming spiritual responsibility for a Catholic population estimated at some 1.4 billion people worldwide.\n\nPrevost's record before the papacy suggests a figure who moved fluidly between institutional governance and direct pastoral work. Prior to entering the priesthood in Peru, he had already led the Augustinian religious order on a global scale, serving as its head from 2001 to 2013, an experience that presumably equipped him with the administrative fluency needed to run a body as sprawling as the Vatican. He was appointed Bishop of Chiclayo, in Peru, in September 2015, the same year in which he acquired Peruvian citizenship, a step that went beyond symbolic gesture and signalled a genuine, long-term commitment to the local Church he served. He led that diocese until 2023, at which point he was recalled to Rome to head the Dicastery for Bishops, the Vatican office charged with vetting and recommending episcopal appointments across the Catholic world, a position that placed him, immediately before his own election, at the very centre of the Church's global leadership pipeline.\n\nThe name Leo XIV was, by his own account, a deliberate choice rather than a formality. He linked it explicitly to Pope Leo XIII, who governed the Church from 1878 to 1903 and who, in 1891, issued the encyclical Rerum Novarum, a foundational text addressing workers' rights amid the upheaval of the first industrial revolution. In invoking that legacy, Leo XIV appeared to be signalling that artificial intelligence now poses a comparably disruptive challenge to labour and society, one which, in his view, calls for the same kind of moral engagement that his predecessor once brought to industrial capitalism. Whether this framing will translate into concrete policy remains, for now, an open question, though the choice of name alone was widely read as a statement of priorities for the new pontificate.",
C2:"On 8 May 2025, in a moment that observers had debated as improbable for the better part of two centuries, the College of Cardinals, convened in conclave within the Sistine Chapel, elected Robert Francis Prevost as the 267th successor to the throne of St. Peter, thereby installing the first American ever to occupy the papacy. That the decision arrived so quickly, on merely the second day of deliberations and after only four ballots, only sharpened the sense among Vatican watchers that the cardinals had converged on a candidate whose credentials transcended the usual anxieties about American political and cultural dominance. Prevost, born in Chicago on 14 September 1955, took the name Leo XIV upon his election, assuming spiritual stewardship of a global Catholic population numbering roughly 1.4 billion, a constituency spanning continents, languages and political systems far removed from the city of his birth.\n\nWhat distinguished Prevost's candidacy, and what arguably neutralised the objection that an American pope might tilt the Church's centre of gravity too far toward Washington, was the sheer breadth of his formation abroad. Long before he entered the priesthood in Peru, he had already spent more than a decade, from 2001 to 2013, leading the Augustinian religious order on a worldwide basis, an apprenticeship in institutional governance that few cardinals could match. He subsequently became Bishop of Chiclayo, in Peru, in September 2015, the same year in which he formally acquired Peruvian citizenship, a decision that read less as diplomatic gesture than as genuine, lasting commitment to the flock he had come to serve, and one that he sustained until 2023. From there he was drawn back to Rome to head the Dicastery for Bishops, the Vatican office entrusted with vetting and recommending episcopal appointments across the entire Catholic world, a post that placed him, in the years immediately preceding his own election, at the very fulcrum of the Church's global leadership machinery.\n\nNor was the name he chose incidental, an observation Leo XIV himself was quick to confirm. He traced it directly to Pope Leo XIII, whose pontificate ran from 1878 to 1903 and whose 1891 encyclical, Rerum Novarum, stands as one of the Church's foundational statements on workers' rights, composed at the precise moment when the first industrial revolution was reshaping labour, capital and the moral obligations owed between them. By invoking that lineage so explicitly, Leo XIV situated his own papacy within a tradition of Church intervention in periods of technological upheaval, casting artificial intelligence as the successor disruption to the machinery of the nineteenth century, one that, in his telling, unsettles work and human dignity in ways not wholly unlike those Leo XIII once confronted. If a nineteenth-century pope could reshape Catholic social teaching in response to steam and steel, the question now facing his twenty-first-century namesake is whether the same moral vocabulary, forged for factories, can be made to speak with equal authority to algorithms."}},
{id:"bringing-the-bronzes-home",title:"Bringing the Bronzes Home",tag:"Nigeria \u00b7 Culture",img:"images/reading/bringing-the-bronzes-home.jpg",quiz:{"B1":[{"q":"In what year did British forces attack the palace of Benin City?","o":["1897","1922","1789","1901"],"a":0,"x":"British forces stormed the royal palace of Benin City in 1897, seizing thousands of brass, bronze and ivory works."},{"q":"Which country returned about 1,100 Benin objects in 2022?","o":["Germany","The Netherlands","Switzerland","France"],"a":0,"x":"In 2022 Germany returned about 1,100 Benin objects, opening the wider wave of European returns."},{"q":"Who wants a new royal museum in Benin City for the returning artifacts?","o":["The Oba of Benin, Ewuare II","The University of Cambridge","Museum Rietberg","The government of Germany"],"a":0,"x":"Nigeria's traditional ruler, the Oba of Benin, Ewuare II, wants a new royal museum in Benin City to hold the returns."}],"B2":[{"q":"How many Benin Bronzes did the Netherlands hand over on June 21, 2025?","o":["119","116","28","1,100"],"a":0,"x":"At the Lagos ceremony on 21 June 2025 the Netherlands formally handed over 119 Benin Bronzes."},{"q":"How many Benin works did the University of Cambridge announce it would return?","o":["116","119","28","11"],"a":0,"x":"In February 2026 Cambridge announced it would return 116 Benin works, one of the largest returns from a British institution."},{"q":"What happened to the earlier joint museum plan known as MOWAA?","o":["It was scrapped in 2023","It opened successfully in 2023","It was expanded in 2025","It was renamed the royal museum"],"a":0,"x":"That earlier joint museum plan, known as MOWAA, was scrapped in 2023."}],"C1":[{"q":"How did Museum Rietberg handle its 11 objects?","o":["It repatriated 2 at once and kept 9 on long-term loan until summer 2026","It returned all 11 immediately","It kept all 11 on permanent loan","It sold 9 and returned 2"],"a":0,"x":"Rietberg sent 2 objects straight away and held back 9 to send later, in summer 2026."},{"q":"What distinction does the writer say recurs across many restitution agreements?","o":["The distinction between ownership and physical possession","The distinction between brass and bronze objects","The difference between museums and universities","The gap between British and Swiss law"],"a":0,"x":"Watch how many deals split who legally owns a piece from where it physically sits, a distinction the writer keeps returning to."},{"q":"Why does the text suggest each returned Bronze is still, in a sense, 'in transit'?","o":["Because no dedicated home for the works has yet materialised","Because the objects keep being resold","Because ownership is still legally disputed","Because they are constantly moved between European museums"],"a":0,"x":"With the planned royal museum not yet built, the returning objects still have no settled home to arrive at."}],"C2":[{"q":"According to the writer, what did Germany's 2022 restitution achieve beyond the return itself?","o":["Its scale did as much as any legal argument to shift the terms of debate in Europe","It legally forced other countries to return objects","It ended all further discussion of colonial looting","It created a single coordinated European campaign"],"a":0,"x":"The sheer size of Germany's return reshaped Europe's conversation on looted art more than any legal case could."},{"q":"How does the passage characterise the wave of returns that followed Germany's move?","o":["As a loose, uneven cascade rather than a single coordinated campaign","As a tightly organised international treaty","As a series of legally identical transfers","As a reluctant response forced by Nigerian courts"],"a":0,"x":"Returns came piecemeal, from different countries and institutions, not as one organised international programme."},{"q":"What does the closing rhetorical question imply about restitution?","o":["That a return is incomplete if the object still has nowhere to go","That ownership alone fully resolves each case","That physical museums no longer matter","That Nigeria should stop requesting further returns"],"a":0,"x":"The ending suggests handing back ownership means little while the pieces still have no home to return to."}]},levels:{B1:"In 1897, British forces attacked the royal palace of Benin City, in what is now Nigeria. They took thousands of artworks made of brass, bronze, and ivory. Today, people call these objects the Benin Bronzes. For more than a hundred years, most of these treasures stayed in museums in Europe.\n\nThe return of the Benin Bronzes began with Germany. In 2022, Germany returned about 1,100 Benin objects to Nigeria, part of a bigger movement as European museums started to give back art taken by force long ago.\n\nOn June 21, 2025, the Netherlands held a ceremony at the National Museum in Lagos. There, officials formally handed over 119 Benin Bronzes to Nigeria.\n\nMore returns followed. In February 2026, the University of Cambridge announced that it would return 116 Benin works to Nigeria, one of the largest single returns from a British institution.\n\nThen, in March 2026, three Swiss institutions agreed to transfer 28 Benin works to Nigeria together: Museum Rietberg, the University of Zurich's ethnographic museum, and the Musee d'ethnographie in Geneva. Museum Rietberg alone gave back 11 objects, sending 2 straight away and keeping 9 to send later, in summer 2026.\n\nNigeria's traditional ruler, the Oba of Benin, Ewuare II, wants a new royal museum in Benin City to hold all of these returning artifacts.",
B2:"In 1897, British forces stormed the royal palace of Benin City, in what is now Nigeria, and carried off thousands of artworks crafted from brass, bronze, and ivory. These objects became known collectively as the Benin Bronzes, and for well over a century, most of them remained scattered across museum collections in Europe, far from the kingdom that had produced them. In recent years, however, a growing number of European institutions have agreed to send these treasures home.\n\nGermany led the way. In 2022, it returned roughly 1,100 Benin objects to Nigeria, a move widely seen as part of a broader European reckoning with colonial-era looting. Other countries soon followed. On June 21, 2025, the Netherlands formally handed over 119 Benin Bronzes to Nigeria at a ceremony held at the National Museum in Lagos, marking one of the most significant restitutions to date.\n\nThe pace of returns then accelerated further. In February 2026, the University of Cambridge announced that it would return 116 Benin works, making it one of the largest single restitutions ever carried out by a British institution. The following month, three Swiss institutions, Museum Rietberg, the University of Zurich's ethnographic museum, and Geneva's Musee d'ethnographie, agreed to transfer ownership of a combined 28 Benin works to Nigeria. Museum Rietberg alone transferred 11 objects: it immediately repatriated 2 of them, while the remaining 9 were kept on long-term loan, pending their physical return in summer 2026.\n\nAmid this wave of restitution, attention has turned to what happens next. Nigeria's traditional ruler, the Oba of Benin, Ewuare II, has pushed for a dedicated royal museum in Benin City to house the returning artifacts, after an earlier plan for a joint museum, known as MOWAA, was scrapped in 2023.",
C1:"In 1897, British forces stormed the royal palace of Benin City, in what is now Nigeria, seizing thousands of brass, bronze, and ivory artworks that had adorned the court for centuries. Collectively known ever since as the Benin Bronzes, these objects were dispersed across museums and private collections throughout Europe, where most remained for more than a hundred years, largely unaffected by the kingdom's repeated requests for their return. Only in the past few years has that pattern begun to shift decisively, as a succession of European institutions have concluded, often after lengthy internal debate, that continued possession is no longer defensible.\n\nGermany set the precedent. In 2022, it returned approximately 1,100 Benin objects to Nigeria, a restitution on a scale that signalled a broader reassessment, across European museums, of collections built through colonial-era violence. Since then, further returns have followed in relatively quick succession, though rarely at identical speed or on identical terms. On 21 June 2025, the Netherlands formally handed over 119 Benin Bronzes to Nigeria at a ceremony held at the National Museum in Lagos, one of the more prominent restitutions to date, given both its scale and its official, state-level character.\n\nThe following year brought two further, closely spaced developments. In February 2026, the University of Cambridge announced it would return 116 Benin works, a decision that ranks among the largest single restitutions yet undertaken by a British institution, and one that will likely be scrutinised as a benchmark for other UK museums still weighing similar claims. A month later, three Swiss institutions, Museum Rietberg, the University of Zurich's ethnographic museum, and Geneva's Musee d'ethnographie, agreed to transfer ownership of 28 Benin works between them. Museum Rietberg's own contribution, 11 objects, illustrates how restitution can be a staged process rather than a single, clean act: 2 pieces were repatriated immediately, while the remaining 9, though now legally Nigerian property, are to stay on long-term loan until their physical return in summer 2026, a distinction between ownership and possession that recurs across many of these agreements.\n\nWhat remains unresolved, in other words, is not so much ownership as destination. Nigeria's traditional ruler, the Oba of Benin, Ewuare II, has pressed for a dedicated royal museum in Benin City to house the returning works, particularly since an earlier, jointly planned museum project, MOWAA, was abandoned in 2023. Until such a home materialises, each returned Bronze arrives less as a fully resolved case than as an object still, in a meaningful sense, in transit.",
C2:"In 1897, British forces stormed the royal palace of Benin City, in what is now Nigeria, and made off with thousands of brass, bronze, and ivory artworks that had, for generations, embodied the artistic and spiritual authority of the Benin court. What the world would come to call the Benin Bronzes were subsequently scattered across museums, universities, and private collections throughout Europe, where the great majority sat for well over a century, largely undisturbed by the kingdom's persistent, if long unheeded, demands for their return. Only recently, and arguably only under sustained public and diplomatic pressure, has that century-long arrangement begun to unravel in earnest.\n\nGermany, characteristically, moved first and most decisively: in 2022 it returned some 1,100 Benin objects to Nigeria, a restitution whose sheer scale did as much as any legal argument to shift the terms of the debate elsewhere in Europe. What followed was less a single coordinated campaign than a loose, uneven cascade of institutions each reaching, in its own time and on its own terms, broadly the same conclusion. On 21 June 2025, the Netherlands formally handed over 119 Benin Bronzes to Nigeria at a ceremony at the National Museum in Lagos, an occasion notable less for the number of objects involved than for the state-level formality with which the transfer was conducted.\n\nTwo further milestones, arriving within a single month of each other, gave 2026 a fair claim to being the pivotal year of the whole restitution movement. In February, the University of Cambridge announced it would return 116 Benin works, one of the largest single restitutions any British institution has yet carried out, and a decision certain to be read, rightly or not, as a template for other UK museums still weighing comparable claims. Then, in March, three Swiss institutions, Museum Rietberg, the University of Zurich's ethnographic museum, and Geneva's Musee d'ethnographie, agreed jointly to transfer ownership of 28 Benin works to Nigeria. Museum Rietberg's share of that agreement, 11 objects, is instructive precisely because it complicates any simple notion of what \"returning\" an artifact actually means: 2 pieces were repatriated at once, while the remaining 9, Nigerian property in law from that moment on, were to remain on long-term loan pending physical transfer in summer 2026, ownership and possession thus quietly decoupled from one another.\n\nYet for all this momentum, the more consequential question may not be who now owns these works but where, precisely, they will end up. Nigeria's traditional ruler, the Oba of Benin, Ewuare II, has repeatedly pressed for a dedicated royal museum in Benin City, a demand that has only gained urgency since an earlier, jointly planned institution, MOWAA, collapsed in 2023. Without such a building, restitution risks becoming a diplomatic achievement in search of a physical conclusion. What, then, does it mean to call an object \"returned\" if it still has, in any real sense, nowhere to go?"}},
{id:"bad-bunny-puerto-rico-residency",title:"The Concert Series That Revived an Island",tag:"Puerto Rico \u00b7 Culture",img:"images/reading/bad-bunny-puerto-rico-residency.jpg",quiz:{"B1":[{"q":"How many shows did Bad Bunny perform during the residency?","o":["30","15","48","600"],"a":0,"x":"From 15 July to 14 September he played 30 shows at the Coliseo de Puerto Rico in San Juan."},{"q":"About how much money did the residency bring into the local economy, according to Discover Puerto Rico?","o":["Close to 200 million dollars","Close to 500 million dollars","Close to 50 million dollars","Close to 48,000 dollars"],"a":0,"x":"The tourism board Discover Puerto Rico put it at close to 200 million dollars into the local economy."},{"q":"Who could buy tickets for the first nine shows?","o":["Only people who live in Puerto Rico","Only international fans","Only members of the tourism board","Anyone from anywhere"],"a":0,"x":"The first nine shows were held for residents. Tickets for international fans opened only later, an idea called 'responsible tourism'."}],"B2":[{"q":"How much direct impact had Moody's analysts projected beforehand?","o":["Roughly 250 million dollars","Roughly 200 million dollars","Roughly 100 million dollars","Roughly 600 million dollars"],"a":0,"x":"Beforehand Moody's analysts predicted about 250 million dollars in direct impact from around 600,000 visitors."},{"q":"By about how much did food-related spending rise compared with the previous year?","o":["About 75 percent","About 30 percent","About 48 percent","About 200 percent"],"a":0,"x":"Food spending climbed about 75 percent on the same months a year earlier. Hotels and clothing each rose over 30 percent."},{"q":"Why was the timing of the residency especially notable?","o":["It happened during the island's slowest tourism season, just before hurricane season","It clashed with the island's busiest holiday period","It took place during a national holiday","It occurred at the peak of hurricane season"],"a":0,"x":"The shows filled the island's quietest season, right before hurricane season, when visitors are usually few."}],"C1":[{"q":"How does the text explain the gap between Moody's projection and the actual figure?","o":["It reflects the difficulty of translating a projected visitor count into realized spending","It reveals a clear error in Moody's methods","It shows attendance was far lower than expected","It proves the tourism board exaggerated its numbers"],"a":0,"x":"Attendance matched forecasts, so the gap between 250 and 200 million shows just how hard real spending is to predict."},{"q":"What did the 'responsible tourism' framing position as a prerequisite?","o":["Local access before the residency opened to fans from abroad","International sales before local sales","Government approval before ticketing began","Hotel bookings before concert tickets"],"a":0,"x":"Holding the first nine shows for residents put local access ahead of sales to fans from abroad."},{"q":"What open question does the passage raise about the residency's model?","o":["Whether it could be replicated by artists without Bad Bunny's particular ties to the island","Whether the economic figures were accurate at all","Whether hurricane season should be avoided entirely","Whether residents truly enjoyed the shows"],"a":0,"x":"It asks whether the model could work for artists who lack Bad Bunny's deep roots on the island."}],"C2":[{"q":"Why does the writer call the gap between forecast and outcome 'instructive'?","o":["It shows the limits of modeling consumer behavior even when attendance lands almost exactly as predicted","It proves that economic forecasts are always worthless","It reveals that attendance was wildly mispredicted","It confirms the tourism board inflated its figures"],"a":0,"x":"Visitor numbers hit target yet spending fell short, showing how hard it is to model what people actually spend."},{"q":"What does the writer suggest the residency's timing turned it into?","o":["Something close to a natural experiment in seasonal demand","A purely commercial failure","A routine tour stop like any other","A cautionary tale about weather risk"],"a":0,"x":"Running in the dead season made it a near-experiment in whether strong demand could be created off-peak."},{"q":"What point does the closing question emphasise about the residency?","o":["That it outperformed cautious forecasts while still insisting the island's own people came first","That its economic impact was ultimately negligible","That analysts had predicted its outcome perfectly","That international fans were unfairly excluded throughout"],"a":0,"x":"The ending stresses it beat modest forecasts yet still put residents first, through those local-only early shows."}]},levels:{B1:"In the summer of 2025, the Puerto Rican superstar Bad Bunny gave a special series of concerts on his home island. From July 15 to September 14, he performed 30 shows at the Coliseo de Puerto Rico Jose Miguel Agrelot in San Juan. He called the residency Debi Tirar Mas Fotos, after his own album, and the shows mixed his newest songs with his most famous hits. The concerts were also a way to show Puerto Rican culture and history to the audience. More than 600,000 people came to see the shows. According to the tourism board Discover Puerto Rico, the residency brought close to 200 million dollars into the local economy. Before the concerts started, economic analysts at Moody's had predicted about 250 million dollars in direct impact from around 600,000 visitors. The concerts created about 48,000 hotel stays. This was important because the residency happened during the island's quietest tourism season, just before hurricane season begins. Spending on food rose by about 75 percent, and spending on hotels and clothing each rose by more than 30 percent, compared with the same months the year before. Bad Bunny and the organizers made an interesting choice. The first nine shows were only for people who live in Puerto Rico. Tickets for international fans opened later. Organizers called this idea \"responsible tourism.\"",
B2:"In the summer of 2025, the Puerto Rican superstar Bad Bunny turned his home island into the stage for an unusually ambitious project: a 30-show residency, running from July 15 to September 14 at the Coliseo de Puerto Rico Jose Miguel Agrelot in San Juan. Titled after his album Debi Tirar Mas Fotos, the residency combined new material with his best-known hits, and it was designed to function as more than entertainment, doubling as a showcase of Puerto Rican culture and history for everyone who attended.\n\nThe scale of the event was considerable. More than 600,000 people attended the shows, and according to the tourism board Discover Puerto Rico, the residency generated close to 200 million dollars in direct economic impact. This came close to, though fell somewhat short of, the roughly 250 million dollars that economic analysts at Moody's had projected beforehand, based on an estimated 600,000 visitors.\n\nThe timing made the impact especially notable. The residency produced approximately 48,000 hotel stays during what is normally the island's slowest tourism period, the weeks just before hurricane season, when visitor numbers usually drop. Spending patterns shifted accordingly: food-related spending rose by about 75 percent compared with the same period the previous year, while spending on lodging and clothing each increased by more than 30 percent.\n\nPerhaps the most notable decision, however, concerned who could buy tickets first. The first nine shows were reserved exclusively for Puerto Rican residents, and only once those shows had taken place did tickets open up to international fans. Organizers described this deliberate sequencing as \"responsible tourism,\" a phrase meant to signal that local residents should be the first to benefit from the residency, before it opened to a wider audience of fans from abroad.",
C1:"Between 15 July and 14 September 2025, the Puerto Rican superstar Bad Bunny undertook a 30-show residency at the Coliseo de Puerto Rico Jose Miguel Agrelot in San Juan, an undertaking that functioned simultaneously as a commercial spectacle and, by design, as a sustained act of cultural presentation. Titled after his album Debi Tirar Mas Fotos, the residency interwove new material with his most recognizable hits, so that each performance doubled as an extended showcase of Puerto Rican culture and history rather than a conventional touring set.\n\nThe economic scale of the residency is not in serious dispute, even if the precise figures require some qualification. Discover Puerto Rico, the island's tourism board, reported that the shows drew more than 600,000 attendees and generated close to 200 million dollars in direct economic impact. This fell somewhat short of the roughly 250 million dollars that economic analysts at Moody's had projected beforehand, on the basis of an estimated 600,000 visitors, a gap that most likely reflects the inherent difficulty of translating a projected visitor count into a precise measure of realized spending, rather than any obvious flaw in either estimate. What can be said with more confidence is the pattern of spending the residency generated: food-related expenditure rose by approximately 75 percent relative to the same period the previous year, while spending on lodging and clothing each increased by more than 30 percent.\n\nThe timing of these figures arguably matters as much as their size. The roughly 48,000 hotel stays attributable to the residency occurred during what is ordinarily the island's slowest tourism period, the weeks immediately preceding hurricane season, when visitor numbers would typically be expected to decline rather than rise.\n\nPerhaps the residency's most deliberate feature, however, was neither its scale nor its timing but its ticketing structure. The first nine of the thirty shows were reserved exclusively for Puerto Rican residents, with tickets opening to international fans only once that initial allocation had been sold. Organizers explicitly framed this sequencing as \"responsible tourism,\" a term that positioned local access as a prerequisite for, rather than an afterthought to, the residency's broader commercial and cultural success. Taken together, the figures suggest that a single, culturally rooted concert series can generate measurable economic activity even in a traditionally quiet season, though whether such a model could be replicated by artists without Bad Bunny's particular connection to the island remains, inevitably, an open question.",
C2:"For nine weeks beginning on 15 July 2025, Bad Bunny transformed the Coliseo de Puerto Rico Jose Miguel Agrelot into something considerably more consequential than a concert venue: a 30-show residency that, by the time it concluded on 14 September, had become as much an economic case study as a cultural event. Titled after his album Debi Tirar Mas Fotos, the residency wove new material into a set built around his most recognizable hits, and it was conceived, deliberately, as an extended showcase of Puerto Rican culture and history rather than as a conventional tour stop that happened to land in San Juan.\n\nWhat makes the residency worth examining closely is less the fact that it drew a crowd than the sheer specificity of what that crowd left behind. More than 600,000 people attended over the course of the run, and Discover Puerto Rico, the island's tourism board, put the direct economic impact at close to 200 million dollars, a figure that, while enormous, still fell short of the roughly 250 million dollars that economic analysts at Moody's had projected in advance on the basis of an estimated 600,000 visitors. That gap between forecast and outcome is instructive in itself: it suggests the limits of modeling consumer behavior even when the headline numbers, attendance chief among them, land almost exactly where predicted. Where the residency's effects can be traced with more granularity is in the categories of spending it altered. Food-related expenditure climbed by roughly 75 percent against the same period the previous year, while spending on lodging and on clothing each rose by more than 30 percent, changes that point to a visitor base spending not merely on tickets but on the fuller texture of a stay.\n\nTiming, as much as scale, sharpened all of this considerably, turning simple attendance figures into something closer to a natural experiment in seasonal demand. The residency generated an estimated 48,000 hotel stays during precisely the weeks when Puerto Rico's tourism industry is usually at its quietest, the uneasy stretch just before hurricane season when travelers, understandably, tend to stay away. That a single artist's residency could counteract, even temporarily, a seasonal pattern driven by weather risk is itself a striking claim about the pulling power of culture over caution.\n\nYet arguably the most telling decision was not economic at all but structural: the first nine of the thirty shows were set aside exclusively for Puerto Rican residents, with international fans permitted to buy tickets only once that initial allocation was gone. Organizers termed this sequencing \"responsible tourism,\" a phrase that reframed the entire residency as an act of deference to the island before it became a product marketed abroad. What, then, should be made of a concert series that outperformed the analysts' own caution about its host economy's quietest season, and still insisted, at the level of ticketing itself, that the island's own people came first?"}},
{id:"giants-causeway",title:"The Giant's Causeway and the Legend of Finn McCool",tag:"Northern Ireland · Nature",img:"images/reading/giants-causeway.jpg",quiz:{"B1":[{"q":"Where is the Giant's Causeway?","o":["Northern Ireland","Scotland","Wales","England"],"a":0,"x":"It sits on the north Antrim coast of Northern Ireland, near the town of Bushmills."},{"q":"What are the columns made of?","o":["Wood","Sand","Basalt rock","Ice"],"a":2,"x":"The roughly 40,000 columns are dark basalt rock, fitted together like a honeycomb."},{"q":"In the legend, who built the causeway?","o":["Benandonner","Finn McCool","A king","Fishermen"],"a":1,"x":"The legend gives the credit to the Irish giant Finn McCool, who built it as stepping stones across the sea to Scotland."}],"B2":[{"q":"Roughly how many columns are there?","o":["400","4,000","40,000","400,000"],"a":2,"x":"Roughly 40,000 interlocking basalt columns, by the text's count."},{"q":"Most of the columns have how many sides?","o":["Four","Five","Six","Eight"],"a":2,"x":"Most are hexagonal, so six sides, though a few have four, five, seven or eight."},{"q":"In the legend, how did Finn's wife trick Benandonner?","o":["She hid Finn in a cave","She disguised Finn as a baby","She built a high wall","She frightened him with a storm"],"a":1,"x":"Finn's clever wife dressed him as a baby in a cradle, so Benandonner would dread the size of the father."}],"C1":[{"q":"Why did the huge 'baby' frighten Benandonner?","o":["He thought the baby would attack him","He imagined how enormous the father must be","He was afraid of all children","He realised he was lost"],"a":1,"x":"Seeing so large a baby, he pictured a monstrous father and fled back to Scotland in terror."},{"q":"Which real feature across the sea fits the legend?","o":["A castle in Scotland","Matching basalt columns at Fingal's Cave on Staffa","Another causeway in Wales","A statue of Finn McCool"],"a":1,"x":"On the Scottish island of Staffa, Fingal's Cave holds the same basalt columns,
