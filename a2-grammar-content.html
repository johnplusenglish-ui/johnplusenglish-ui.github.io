ger, more natural sentences. Note: because, so, but, when and if are A2 Key, while although and unless are a B1 step up.","desc":"Conjunctions are what make sentences flow. Without them, every idea lives in isolation. With them, you can express cause, contrast, result, condition and more.","tip":"The pair that tangles people up is <strong>because<\/strong> and <strong>so<\/strong>. They carry the same logic but in opposite order: <em>because<\/em> introduces the reason, <em>so<\/em> introduces the result. Same idea, mirror image.","explanation":"<p>Conjunctions join two clauses into one sentence. The conjunction signals the <strong>logical relationship<\/strong> between the ideas.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Because vs so<\/strong> - both express cause and effect, from opposite directions. <em>Because<\/em> = the reason. <em>So<\/em> = the result. <em>\"I stayed home because I was ill.\"<\/em> &nbsp;/&nbsp; <em>\"I was ill, so I stayed home.\"<\/em> Same situation, opposite structure. Comma before <em>so<\/em>.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>But vs although<\/strong> - both express contrast. <em>But<\/em> joins two equal ideas. <em>Although/even though<\/em> introduces the surprising part. <strong>Never use both together<\/strong> - <em>\"Although it was cold, but I went out\"<\/em> is wrong. One conjunction is enough.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Unless<\/strong> = if not. <em>\"I won't go unless you come\"<\/em> = <em>\"I won't go if you don't come.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>After time conjunctions (when, before, after, until, as soon as)<\/strong>, use the <strong>present simple<\/strong> for a future meaning, never <em>will<\/em>:<br><em>\"I'll call you when I arrive.\"<\/em> &nbsp;not&nbsp; <em>\"when I will arrive.\"<\/em><\/div>","table":{"headers":["Conjunction","Logical relationship","Example","Key note"],"rows":[["because","introduces the reason/cause","I left because I was tired.","Answers 'why?' - no comma needed before because"],["so","introduces the result/effect","I was tired, so I left.","Comma before so"],["but","simple contrast - unexpected idea","I like him, but he's annoying.","Comma before but"],["although / even though","strong contrast - surprising fact","Although it was cold, we went out.","Never use with but in same clause"],["if","condition - one thing depends on another","I'll come if I finish early.","Present simple after if for future"],["unless","negative condition (= if not)","I won't go unless you come.","= I won't go if you don't come"],["when","time - future event will happen","Call me when you arrive.","Present simple NOT will - never 'when I will arrive'"],["while","two actions at the same time","She reads while she eats.","Often used with continuous tense"],["before / after","sequence of events","Wash your hands before you eat.","Present simple for future after these too"]]},"examples":[{"type":"pos","eng":"I couldn't sleep because it was too hot.","note":"Because introduces the reason."},{"type":"pos","eng":"It was too hot, so I couldn't sleep.","note":"So introduces the result."},{"type":"pos","eng":"I like him, but he can be very annoying.","note":"But introduces a contrast."},{"type":"pos","eng":"Although it was expensive, I bought it.","note":"Although at the start of a sentence."}],"errors":[{"bad":"I was tired. Because I worked all day.","good":"I was tired because I worked all day.","reason":"Because cannot start a standalone sentence - it must join two clauses."},{"bad":"Although it was cold, but I went out.","good":"Although it was cold, I went out.","reason":"Don't use although and but together - one is enough."},{"bad":"I'll call you if I'll arrive.","good":"I'll call you when I arrive.","reason":"After time conjunctions (when, before, after), use present simple - not will."}],"realUse":[],"exercises":[{"type":"gap","title":"Choose the conjunction","sub":"Fill each gap with because, so, but, although, if, or when.","items":[{"answer":"because","before":"I stayed home ","after":" I was ill."},{"answer":"so","before":"I was ill, ","after":" I stayed home."},{"answer":"but","before":"I like him, ","after":" he can be very annoying."},{"answer":"Although","before":"","after":" it was cold, we went for a walk."},{"answer":"if/when","before":"I'll come ","after":" I finish early."},{"answer":"when/if","before":"Call me ","after":" you arrive."},{"answer":"because","before":"She was happy ","after":" she got the job."},{"answer":"so","before":"It was raining, ","after":" we took a taxi."}]},{"type":"mc","title":"Because, so, but, or although?","sub":"Choose the most natural conjunction.","items":[{"q":"I was exhausted, _____ I went to bed early.","opts":["because","although","so","but"],"answer":"so","explanation":"Result clause - so."},{"q":"I went to bed early _____ I was exhausted.","opts":["so","although","but","because"],"answer":"because","explanation":"Reason clause - because."},{"q":"She studied hard, _____ she failed the exam.","opts":["so","because","but","although"],"answer":"but","explanation":"Unexpected contrast - but."},{"q":"_____ she studied hard, she failed the exam.","opts":["Because","So","But","Although"],"answer":"Although","explanation":"Contrast at the start of a sentence - although."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"I was tired. I worked all day.","keyword":"because","answer":"I was tired because I worked all day."},{"original":"It was expensive. I bought it.","keyword":"although","answer":"Although it was expensive, I bought it. / I bought it although it was expensive."},{"original":"She was tired. She went to bed early.","keyword":"so","answer":"She was tired, so she went to bed early."},{"original":"I won't go if you don't come.","keyword":"unless","answer":"I won't go unless you come. / Unless you come, I won't go. / I will not go unless you come."},{"original":"He arrived. I called him.","keyword":"when","answer":"I called him when he arrived. / When he arrived, I called him."}]}]},{"id":"preposmovement","title":"Prepositions of movement","subtitle":"into, out of, along, past, through","intro":"Where are you going? These prepositions trace movement through space.","desc":"Prepositions of place say where something is. Prepositions of movement say where something is going. They often pair with verbs like go, walk, run, drive, come.","tip":"The confusion I sort out most is <strong>in vs into<\/strong> and <strong>on vs onto<\/strong>: <em>in/on<\/em> is a static position, <em>into/onto<\/em> is movement in that direction. \"The cat is in the box\" (position) versus \"The cat jumped into the box\" (movement).","explanation":"<p>Prepositions of movement describe <strong>direction and path<\/strong> - where something is going, not where it is. They pair with movement verbs: walk, run, drive, jump, get, go, come, fly, swim, climb.<\/p>\n<div class=\"note\"><strong>Position vs movement - the key split:<\/strong><br><em>In / on / at<\/em> = where something <em>is<\/em> (static): <em>\"The cat is in the box.\"<\/em><br><em>Into / onto<\/em> = movement <em>towards<\/em> that spot: <em>\"The cat jumped into the box.\"<\/em><br>Reaching for <em>in<\/em> when you mean <em>into<\/em> is the classic error here.<\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Through vs across<\/strong> - both mean from one side to the other. <em>Through<\/em> = enclosed space (a tunnel, a forest, a crowd). <em>Across<\/em> = open flat surface (a lake, a road, a field).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Transport fixed expressions:<\/strong> <em>get on / get off<\/em> = public transport (bus, train, plane, bike). <em>Get into / get out of<\/em> = private vehicles (car, taxi). These are fixed - <em>get in the bus<\/em> sounds wrong.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Along<\/strong> = following the length of something: a road, a river, a corridor, a beach. <em>\"We walked along the river.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Past<\/strong> = movement beyond a point without stopping. Common in directions: <em>\"Go past the church and turn left.\"<\/em> - turn left / right, no preposition needed with <em>turn<\/em>.<\/div><\/div>","table":{"headers":["Preposition","Direction / path","Example","Contrast / note"],"rows":[["into","towards the inside of something","She walked into the room.","vs in = static: she is in the room"],["out of","from inside to outside","He came out of the building.","opposite of into"],["onto","towards a surface","The cat jumped onto the table.","vs on = static: the cat is on the table"],["off","away from a surface or vehicle","She got off the bus.","get off = public transport"],["through","inside an enclosed space, one side to the other","They drove through the tunnel.","enclosed / surrounded"],["across","one side to the other over an open surface","She swam across the lake.","flat, open surface"],["along","following the length of something","We walked along the river.","a path, road, corridor, beach"],["past","beyond a fixed point without stopping","Go past the school and turn left.","directions"],["up / down","towards a higher or lower point","He ran up the stairs.","vertical movement"],["around","in a circuit or loop","They walked around the lake.","circular path"]]},"examples":[{"type":"pos","eng":"She walked into the café.","note":"Movement to the inside of somewhere."},{"type":"pos","eng":"He got off the train at Madrid.","note":"Movement away from public transport."},{"type":"pos","eng":"We drove through the mountains.","note":"Movement passing through a space."},{"type":"pos","eng":"Go along this road and turn right.","note":"Following a path."}],"errors":[{"bad":"She went in the shop.","good":"She went into the shop.","reason":"Movement towards the inside - into (not in)."},{"bad":"He jumped on the bus.","good":"He got on the bus.","reason":"For public transport: get on/off."},{"bad":"Go past the traffic lights and turn on the left.","good":"Go past the traffic lights and turn left.","reason":"Turn left/right - no on."}],"realUse":[],"exercises":[{"type":"gap","title":"Prepositions of movement","sub":"Fill each gap with the correct preposition of movement.","items":[{"answer":"into","before":"She walked ","after":" the room."},{"answer":"out of","before":"He came ","after":" the building."},{"answer":"along","before":"We cycled ","after":" the river path."},{"answer":"past","before":"Go ","after":" the church and turn right."},{"answer":"through","before":"They drove ","after":" the tunnel."},{"answer":"up/down","before":"She ran ","after":" the stairs."},{"answer":"across/over","before":"We walked ","after":" the bridge."},{"answer":"around","before":"They walked ","after":" the old city."}]},{"type":"mc","title":"In or into? On or onto?","sub":"Choose the correct preposition.","items":[{"q":"She walked _____ the room without knocking.","opts":["in","into","to","at"],"answer":"into","explanation":"Movement towards the inside - into."},{"q":"The cat jumped _____ the sofa.","opts":["on","onto","into","over"],"answer":"onto","explanation":"Movement towards a surface - onto."},{"q":"He got _____ the bus at the last stop.","opts":["in","into","on","onto"],"answer":"on","explanation":"Get on the bus - standard expression for public transport."},{"q":"She got _____ the taxi outside the hotel.","opts":["on","onto","off","into"],"answer":"into","explanation":"Get into a car/taxi - enclosed private vehicle."}]},{"type":"builder","title":"Sentence builder","sub":"Put the words in the correct order to describe movement.","items":[{"words":["she","walked","into","the","café"],"answer":"she walked into the café","context":"Describing entry into a place."},{"words":["go","past","the","school","and","turn","left"],"answer":"go past the school and turn left","context":"Giving directions."},{"words":["we","drove","through","the","mountains"],"answer":"we drove through the mountains","context":"Describing a route."},{"words":["he","ran","out","of","the","building"],"answer":"he ran out of the building","context":"Describing exit from a place."},{"words":["they","walked","along","the","beach"],"answer":"they walked along the beach","context":"Describing movement following a path."}]}]},{"id":"questiontags","title":"Question tags","subtitle":"isn't it?, don't you?, can't she?","intro":"<div style=\"margin-bottom:8px\"><span style=\"display:inline-block;background:#E8EEFF;color:#2176FF;font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 10px;border-radius:999px\">Beyond A2 Key</span></div>Question tags belong to the B1 syllabus rather than A2 Key, but they are so common in everyday British speech that they are worth meeting early. Those short questions we tack onto the end of a statement to check or confirm it.","desc":"Question tags are very common in spoken British English. They are used to check information, invite agreement, or keep conversation flowing.","tip":"The rule comes in two halves: a <strong>positive statement takes a negative tag<\/strong>, a <strong>negative statement takes a positive tag<\/strong> - and the tag always borrows the same auxiliary as the main sentence. So it's <em>\"She can swim, can't she?\"<\/em>, not \"doesn't she.\"","explanation":"<p>A question tag is a short question added to a statement to <strong>check information or invite agreement<\/strong>. Very common in spoken British English.<\/p>\n<p><strong>Two steps to build any question tag:<\/strong><\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Find the auxiliary verb<\/strong> in the main clause (be, have, do/does/did, can, will, etc.). If there is no auxiliary, use <em>do/does<\/em> (present) or <em>did<\/em> (past).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Reverse the polarity.<\/strong> Positive main clause → negative tag. Negative main clause → positive tag. Always use a pronoun, never a noun.<\/div><\/div>\n<p style=\"margin-top:14px\"><strong>Worked examples:<\/strong> <em>\"She can swim, ___?\"<\/em> → auxiliary: <em>can<\/em> → positive → tag: <em>can't she?<\/em> &nbsp;|&nbsp; <em>\"They don't know, ___?\"<\/em> → auxiliary: <em>don't<\/em> → negative → tag: <em>do they?<\/em><\/p>\n<div class=\"note\"><strong>Two special cases worth memorising:<\/strong><br><em>I am right,<\/em> → <strong>aren't I?<\/strong> (not <em>amn't I<\/em> - that form doesn't exist)<br><em>Let's go,<\/em> → <strong>shall we?<\/strong> (a fixed expression)<\/div>","table":{"headers":["Main clause","Step 1: auxiliary","Step 2: polarity","Full question tag"],"rows":[["She is French,","is","positive → negative","isn't she?"],["They aren't ready,","aren't","negative → positive","are they?"],["You can drive,","can","positive → negative","can't you?"],["It will be fine,","will","positive → negative","won't it?"],["He likes football, (no auxiliary)","add does","positive → negative doesn't","doesn't he?"],["She doesn't know, (no auxiliary)","add does","negative → positive does","does she?"],["They went home, (past simple)","add did","positive → negative didn't","didn't they?"],["I'm right, (special case)","am","positive → aren't (irregular)","aren't I?"],["Let's go, (special case)"," - ","fixed form","shall we?"]]},"examples":[{"type":"pos","eng":"It's a beautiful day, isn't it?","note":"Positive statement → negative tag."},{"type":"pos","eng":"You haven't seen this, have you?","note":"Negative statement → positive tag."},{"type":"pos","eng":"She can drive, can't she?","note":"Modal verb can → can't in tag."},{"type":"neg","eng":"They didn't come, did they?","note":"Past simple negative → positive did."}],"errors":[{"bad":"She works here, isn't she?","good":"She works here, doesn't she?","reason":"The tag must use the same auxiliary as the main verb. Works = present simple → does/doesn't."},{"bad":"They are coming, aren't they not?","good":"They are coming, aren't they?","reason":"Question tags only have one negative. Not isn't they not - just aren't they."},{"bad":"He can swim, can he?","good":"He can swim, can't he?","reason":"Positive statement → negative tag. Can → can't."}],"realUse":[],"exercises":[{"type":"gap","title":"Complete the question tag","sub":"Fill each gap with the correct question tag.","items":[{"answer":"isn't it","before":"It's cold today, ","after":"?"},{"answer":"aren't they","before":"They're coming tonight, ","after":"?"},{"answer":"doesn't she","before":"She speaks French, ","after":"?"},{"answer":"can't you","before":"You can drive, ","after":"?"},{"answer":"didn't he","before":"He called yesterday, ","after":"?"},{"answer":"have they","before":"They haven't arrived yet, ","after":"?"},{"answer":"is it","before":"It isn't ready, ","after":"?"},{"answer":"shall we","before":"Let's take a break, ","after":"?"}]},{"type":"mc","title":"Choose the correct tag","sub":"Choose the correct question tag.","items":[{"q":"She is Spanish, _____?","opts":["is she","isn't she","doesn't she","wasn't she"],"answer":"isn't she","explanation":"Positive is → negative isn't."},{"q":"They don't like it, _____?","opts":["do they","don't they","are they","did they"],"answer":"do they","explanation":"Negative don't → positive do."},{"q":"You can speak French, _____?","opts":["can you","don't you","can't you","aren't you"],"answer":"can't you","explanation":"Positive can → negative can't."},{"q":"He went home early, _____?","opts":["isn't he","does he","didn't he","wasn't he"],"answer":"didn't he","explanation":"Past simple → didn't in tag."}]},{"type":"builder","title":"Build the tag question","sub":"Put the words in the correct order.","items":[{"words":["it's","cold","today",",","isn't","it","?"],"answer":"it's cold today , isn't it ?","context":"Positive statement → negative tag."},{"words":["she","doesn't","like","coffee",",","does","she","?"],"answer":"she doesn't like coffee , does she ?","context":"Negative statement → positive tag."},{"words":["they","went","home",",","didn't","they","?"],"answer":"they went home , didn't they ?","context":"Past simple → didn't tag."},{"words":["you","can","help","me",",","can't","you","?"],"answer":"you can help me , can't you ?","context":"Modal verb → negative modal tag."},{"words":["let's","go",",","shall","we","?"],"answer":"let's go , shall we ?","context":"Fixed tag for let's."}]}]},{"id":"countableuncountable","title":"Countable & uncountable nouns","subtitle":"a bottle of water, a piece of advice","intro":"Going deeper on countable and uncountable nouns - and how to put a quantity to each.","desc":"You saw the basics at A1. At A2 we add the partitive structures that let you talk about quantities of uncountable nouns: a piece of, a bottle of, a cup of, and more.","tip":"The error I flag most is sticking <em>a/an<\/em> on an uncountable noun: <strong>\"an information\"<\/strong>, <strong>\"an advice\"<\/strong>, <strong>\"a furniture.\"<\/strong> None of those work. Uncountables take either no article (general), <em>some/any<\/em>, or a partitive - <em>a piece of advice<\/em>.","explanation":"<p>At A1 you learnt the basics: uncountable nouns cannot use <em>a/an<\/em> and have no plural. At A2 we focus on how to <strong>talk about quantities<\/strong> of uncountable nouns using partitive expressions.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Partitive expressions<\/strong> give uncountable nouns a countable unit: container/measure word + <em>of<\/em> + uncountable noun. <em>\"A glass of water.\"<\/em> / <em>\"A piece of advice.\"<\/em> / <em>\"A bit of luck.\"<\/em> The container takes the plural - the uncountable noun stays the same.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Common uncountable nouns students try to count:<\/strong> advice, information, news, furniture, luggage, equipment, knowledge, research, traffic, progress, weather, homework, money. None can take <em>a/an<\/em> or -s. <em>\"An advice\"<\/em>, <em>\"two furnitures\"<\/em>, <em>\"a homework\"<\/em> - all wrong.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>How much vs how many:<\/strong> <em>how much<\/em> + uncountable noun. <em>how many<\/em> + countable noun. <em>\"How much luggage?\"<\/em> / <em>\"How many bags?\"<\/em> / <em>\"How many pieces of luggage?\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Partitive plurals:<\/strong> it's the container word that goes plural, not the uncountable noun. <em>\"Two glasses of water\"<\/em> ✓ &nbsp; <em>\"Two glass of waters\"<\/em> ✗ &nbsp; <em>\"Two waters\"<\/em> ✗<\/div>","table":{"headers":["Partitive expression","Used with which uncountable nouns?","Example"],"rows":[["a piece of","advice, information, news, paper, music, bread, cake, furniture, pizza","a piece of advice / a piece of cake"],["a glass of","water, juice, wine, milk","a glass of water / two glasses of juice"],["a cup of","tea, coffee","a cup of coffee / three cups of tea"],["a bottle of","water, wine, beer, juice, oil","a bottle of water / two bottles of wine"],["a bit of / a little","luck, help, news, fun, advice, trouble","a bit of luck / a little help"],["a loaf of","bread","a loaf of bread / two loaves of bread"],["a slice of","bread, pizza, cake, ham","a slice of pizza / two slices of cake"],["a bag of","rice, flour, sugar, crisps","a bag of rice / two bags of flour"],["How much + uncountable"," - ","How much advice did she give you?"],["How many + countable / partitive"," - ","How many pieces of advice? / How many bags?"]]},"examples":[{"type":"pos","eng":"Can I have a piece of cake?","note":"Piece of for a portion of an uncountable food."},{"type":"pos","eng":"She gave me some good advice.","note":"Some + uncountable, or a piece of advice."},{"type":"pos","eng":"I need a bit of help.","note":"A bit of + uncountable."},{"type":"neg","eng":"I don't have any information about that.","note":"Any + uncountable in negatives."}],"errors":[{"bad":"Can you give me an advice?","good":"Can you give me some advice?","reason":"Advice is uncountable - no a/an. Use some or a piece of advice."},{"bad":"I need an information.","good":"I need some information.","reason":"Information is uncountable - no a/an."},{"bad":"She has a lot of furnitures.","good":"She has a lot of furniture.","reason":"Furniture is uncountable - no plural."}],"realUse":[],"exercises":[{"type":"gap","title":"Partitive expressions","sub":"Fill each gap with the correct partitive expression.","items":[{"answer":"a piece of/a slice of","before":"Can I have ","after":" cake?"},{"answer":"a cup of","before":"Would you like ","after":" coffee?"},{"answer":"a glass of","before":"Can I have ","after":" water, please?"},{"answer":"a bit of","before":"I need ","after":" help with this."},{"answer":"a loaf of","before":"Can you buy ","after":" bread?"},{"answer":"a slice of","before":"She only had ","after":" pizza."},{"answer":"a bottle of","before":"We need ","after":" water for the trip."},{"answer":"a piece of","before":"Let me give you ","after":" advice."}]},{"type":"categorise","title":"Countable or uncountable?","sub":"Click a word, then click the correct column.","categories":[{"name":"Countable (can use a/an, has plural)","items":["book","chair","idea","problem","friend","suggestion"]},{"name":"Uncountable (no a/an, no plural)","items":["furniture","advice","information","luggage","money","knowledge"]}]},{"type":"mc","title":"A/an, some, or a piece of?","sub":"Choose the correct option.","items":[{"q":"She gave me _____ advice.","opts":["an","a","some","a piece"],"answer":"some","explanation":"Advice is uncountable - use some or a piece of advice."},{"q":"I need _____ piece of information.","opts":["a","an","some","any"],"answer":"a","explanation":"A piece of information - the partitive piece is countable."},{"q":"Could I have _____ glass of water?","opts":["some","any","a","an"],"answer":"a","explanation":"A glass of water - a + partitive noun."},{"q":"How _____ luggage do you have?","opts":["many","much","a lot","few"],"answer":"much","explanation":"Luggage is uncountable - how much."}]}]}];</script>
<script>
(function(){
  var KEY='jpe_a2grammar_progress_v1';
  var done={}, current=0;
  try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); done=o.done||{}; current=o.current||0;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({done:done,current:current}));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function norm(s){return String(s).toLowerCase().replace(/\s+/g,' ').replace(/[.,!?;:"']/g,'').trim();}
  function _contract(s){return (' '+String(s).toLowerCase()+' ')
   .replace(/\bcan not\b/g,'cannot').replace(/\bcannot\b/g,"can't")
   .replace(/\b(is|are|was|were|do|does|did|have|has|had|would|could|should|must|might|need|will|shall) not\b/g,function(m,v){return {is:"isn't",are:"aren't",was:"wasn't",were:"weren't",do:"don't",does:"doesn't",did:"didn't",have:"haven't",has:"hasn't",had:"hadn't",would:"wouldn't",could:"couldn't",should:"shouldn't",must:"mustn't",might:"mightn't",need:"needn't",will:"won't",shall:"shan't"}[v];})
   .replace(/\b(i|you|he|she|it|we|they) had\b/g,"$1'd").replace(/\b(i|you|he|she|it|we|they) would\b/g,"$1'd")
   .replace(/\b(i|you|we|they) have\b/g,"$1've").replace(/\b(i|you|he|she|it|we|they) will\b/g,"$1'll")
   .replace(/\b(you|we|they) are\b/g,"$1're").replace(/\bi am\b/g,"i'm")
   .replace(/\s+/g,' ').trim();}
  function _cnorm(s){return _contract(s).replace(/[.,!?;:"']/g,'').replace(/\s+/g,' ').trim();}
  function accepts(val,answer){ // answer may hold "/" alternatives
    var v=norm(val), cv=_cnorm(val);
    return String(answer).split('/').some(function(a){return norm(a)===v || _cnorm(a)===cv;});
  }
  var CHECK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  var ARROW='<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  var roadEl=document.getElementById('road'), lessonEl=document.getElementById('lesson');
  document.getElementById('pTotal').textContent=LESSONS.length;

  function updateProgress(){
    var n=Object.keys(done).filter(function(k){return done[k];}).length;
    document.getElementById('pDone').textContent=n;
    document.getElementById('pFill').style.width=(n/LESSONS.length*100)+'%';
  }
  function renderRoad(){
    roadEl.innerHTML=LESSONS.map(function(l,i){
      var cls='g-step'+(i===current?' active':'')+(done[l.id]?' done':'');
      var num=done[l.id]?CHECK:(i+1);
      return '<button class="'+cls+'" data-i="'+i+'"><span class="g-step-n">'+num+'</span><span class="g-step-t">'+esc(l.title)+'</span></button>';
    }).join('');
  }

  // ---------- exercise renderers ----------
  var exSeq=0;
  function fb(id){return '<div class="q-fb" id="'+id+'"></div>';}
  function showFb(id,cls,txt){var e=document.getElementById(id);if(!e)return;e.className='q-fb show '+cls;e.innerHTML=txt;}

  function renderExercise(ex, exNum){
    exSeq++; var eid='ex'+exSeq;
    function qn(j){return '<span class="q-num">'+(j+1)+'</span>';}
    var h='<div class="g-exercise"><div class="g-ex-title"><span class="g-ex-num">'+exNum+'</span>'+esc(ex.title)+'</div>'+(ex.sub?'<div class="g-ex-sub">'+esc(ex.sub)+'</div>':'')+'<div id="'+eid+'-body">';
    var items=ex.items||ex.lines||[];
    if(ex.type==='gap'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.before)+'<input class="gap-inp" data-a="'+esc(it.answer)+'" id="'+eid+'_'+j+'">'+esc(it.after)+'</div></div>';
      });
    } else if(ex.type==='mc'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.q)+'</div><div class="opts" data-ans="'+esc(it.answer)+'" data-exp="'+esc(it.explanation||'')+'">'+
           it.opts.map(function(o){return '<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='transform'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.original)+'<br><span style="font-size:.85rem;color:var(--muted)">Use: <strong>'+esc(it.keyword)+'</strong></span></div><input class="txt-inp" data-a="'+esc(it.answer)+'" id="'+eid+'_'+j+'">'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='ec'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.wrong)+'</div><input class="txt-inp" data-a="'+esc(it.correct)+'" placeholder="Write the correct sentence" id="'+eid+'_'+j+'">'+fb(eid+'_f'+j)+(it.hint?'<div class="q-fb hint show" style="margin-top:6px">Hint: '+esc(it.hint)+'</div>':'')+'</div>';
      });
    } else if(ex.type==='tf'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+'<em>'+esc(it.context)+'</em><br>'+esc(it.statement)+'</div><div class="opts" data-ans="'+esc(it.answer)+'" data-exp="'+esc(it.explanation||'')+'">'+
           ['True','False','Not given'].map(function(o){return '<button class="opt" data-o="'+o+'">'+o+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='convo'){
      items.forEach(function(ln){
        var idx=0;
        var text=String(ln.text).replace(/\[([^\]]+)\]/g,function(m,ans){idx++;return '<input class="gap-inp" data-a="'+esc(ans)+'">';});
        h+='<div class="convo-line"><span class="convo-sp">'+esc(ln.speaker)+'</span><span>'+text+'</span></div>';
      });
    } else if(ex.type==='builder'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text"><span class="q-num">'+(j+1)+'</span><span style="font-size:.85rem;color:var(--muted)">'+esc(it.context||'')+'</span></div><div class="build-target" id="'+eid+'_t'+j+'" data-a="'+esc(it.answer)+'"></div><div class="build-bank" id="'+eid+'_b'+j+'">'+
           shuffle(it.words.slice()).map(function(w,k){return '<button class="word-chip" data-w="'+esc(w)+'">'+esc(w)+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='categorise'){
      var bank=[]; ex.categories.forEach(function(c){c.items.forEach(function(it){bank.push({w:it,cat:c.name});});});
      h+='<div class="cat-bank" id="'+eid+'-bank">'+shuffle(bank.slice()).map(function(b){return '<button class="cat-item" data-w="'+esc(b.w)+'" data-cat="'+esc(b.cat)+'">'+esc(b.w)+'</button>';}).join('')+'</div><div class="cat-cols" style="grid-template-columns:repeat('+Math.min(ex.categories.length,3)+',1fr)">'+
         ex.categories.map(function(c){return '<div class="cat-col"><div class="cat-col-h">'+esc(c.name)+'</div><div class="cat-drop" data-cat="'+esc(c.name)+'"></div></div>';}).join('')+'</div>';
    }
    h+='</div><button class="chk-btn" data-check="'+eid+'" data-type="'+ex.type+'">Check answers</button><button class="chk-link" data-show="'+eid+'">Show answers</button><span class="ex-score" id="'+eid+'-score"></span></div>';
    return {html:h, eid:eid, ex:ex};
  }
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

  // ---------- lesson rendering ----------
  var exReg={};
  function renderLesson(i){
    current=i; save(); exSeq=0; exReg={};
    var l=LESSONS[i];
    var nEx=(l.exercises||[]).length;
    var h='<div class="g-card" style="padding-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div class="g-eyebrow" style="margin-bottom:0">Lesson '+(i+1)+' of '+LESSONS.length+'</div><button class="g-export-btn" title="Save this lesson as a PNG image" aria-label="Save lesson as PNG image" onclick="exportLessonPNG('+i+',this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button></div>'+
      '<h2 class="g-lesson-title">'+esc(l.title)+'</h2>'+
      (l.subtitle?'<div class="g-lesson-sub">'+esc(l.subtitle)+'</div>':'')+
      (l.intro?'<div class="g-intro" style="margin-bottom:2px">'+l.intro+'</div>':'')+'</div>';
    h+='<div class="l-tabs"><button class="l-tab active" data-pane="learn">Learn</button><button class="l-tab" data-pane="practice">Practice'+(nEx?'<span class="l-tab-c">'+nEx+'</span>':'')+'</button></div>';
    var learn='<div class="g-card"><div class="g-body">'+(l.explanation||('<p>'+esc(l.desc||'')+'</p>'))+'</div>';
    if(l.table&&l.table.rows){learn+='<div class="g-sec-label">The forms</div><table class="g-table"><thead><tr>'+l.table.headers.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>'+l.table.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';}
    if(l.examples&&l.examples.length){learn+='<div class="g-sec-label">In action</div><div class="g-examples">'+l.examples.map(function(e){var t=e.type||'pos';var m=t==='neg'?'-':(t==='q'?'?':'+');return '<div class="g-ex '+t+'"><span class="g-ex-t">'+m+'</span><span class="g-ex-eng">'+esc(e.eng)+'</span>'+(e.note?'<div class="g-ex-note">'+esc(e.note)+'</div>':'')+'</div>';}).join('')+'</div>';}
    if(l.errors&&l.errors.length){learn+='<div class="g-sec-label">Watch out for</div><div class="g-errors">'+l.errors.map(function(e){return '<div class="g-err"><div class="g-err-line g-err-bad"><span class="mk">✗</span><span>'+esc(e.bad)+'</span></div><div class="g-err-line g-err-good"><span class="mk">✓</span><span>'+esc(e.good)+'</span></div><div class="g-err-reason">'+esc(e.reason)+'</div></div>';}).join('')+'</div>';}
    if(l.realUse&&l.realUse.length){learn+='<div class="g-sec-label">Real use</div><ul class="g-real">'+l.realUse.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul>';}
    if(l.tip){learn+='<div class="g-tip"><div><div class="g-tip-label">From John</div><p>'+l.tip+'</p></div></div>';}
    learn+='</div>';
    h+='<div class="l-pane show" id="pane-learn">'+learn+'</div>';
    var prac;
    if(nEx){
      prac='<div class="g-card"><div class="g-eyebrow">Practice</div><h3 class="g-lesson-title" style="font-size:1.25rem;margin:0 0 4px">Try it yourself</h3><p style="color:var(--muted);margin:0 0 20px;font-size:.92rem">'+nEx+' exercise'+(nEx>1?'s':'')+'. Type or click your answers, then check them.</p>';
      l.exercises.forEach(function(ex,xi){var r=renderExercise(ex,xi+1);exReg[r.eid]=r;prac+=r.html;});
      prac+='</div>';
    } else {
      prac='<div class="g-card"><p style="color:var(--muted);margin:0">Practice for this lesson is coming soon.</p></div>';
    }
    h+='<div class="l-pane" id="pane-practice">'+prac+'</div>';
    var isDone=!!done[l.id];
    h+='<div class="g-foot"><button class="g-complete'+(isDone?' done':'')+'" id="markBtn">'+(isDone?CHECK+' Completed':'Mark lesson complete')+'</button>'+
       '<button class="g-next" id="nextBtn"'+(i>=LESSONS.length-1?' disabled':'')+'>Next lesson '+ARROW+'</button></div>';
    lessonEl.innerHTML=h;
    renderRoad(); updateProgress();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ---------- interactions ----------
  document.addEventListener('click',function(e){
    var step=e.target.closest('.g-step'); if(step){renderLesson(+step.dataset.i);return;}
    var ltab=e.target.closest('.l-tab'); if(ltab){
      document.querySelectorAll('.l-tab').forEach(function(t){t.classList.remove('active');});
      ltab.classList.add('active');
      document.querySelectorAll('.l-pane').forEach(function(p){p.classList.remove('show');});
      var pane=document.getElementById('pane-'+ltab.dataset.pane); if(pane)pane.classList.add('show');
      var tr=document.querySelector('.l-tabs'); if(tr)window.scrollTo({top:tr.getBoundingClientRect().top+window.pageYOffset-16,behavior:'smooth'});
      return;
    }
    var mark=e.target.closest('#markBtn'); if(mark){var l=LESSONS[current];done[l.id]=!done[l.id];save();renderLesson(current);return;}
    var next=e.target.closest('#nextBtn'); if(next&&!next.disabled){renderLesson(Math.min(current+1,LESSONS.length-1));return;}
    var opt=e.target.closest('.opt'); if(opt&&!opt.disabled){handleOpt(opt);return;}
    var chip=e.target.closest('.word-chip'); if(chip){handleChip(chip);return;}
    var cat=e.target.closest('.cat-item'); if(cat){handleCat(cat);return;}
    var drop=e.target.closest('.cat-drop'); if(drop){handleDrop(drop);return;}
    var chk=e.target.closest('[data-check]'); if(chk){checkExercise(chk.dataset.check,chk.dataset.type);return;}
    var show=e.target.closest('[data-show]'); if(show){showAnswers(show.dataset.show);return;}
  });

  function handleOpt(opt){
    var box=opt.parentNode; if(box.dataset.answered)return; box.dataset.answered='1';
    var ans=box.dataset.ans, exp=box.dataset.exp;
    var ok=opt.dataset.o===ans;
    Array.prototype.forEach.call(box.children,function(b){b.disabled=true;if(b.dataset.o===ans)b.classList.add(ok?'correct':'reveal');});
    if(!ok)opt.classList.add('wrong');
    var fbEl=box.parentNode.querySelector('.q-fb');
    if(fbEl){fbEl.className='q-fb show '+(ok?'ok':'no');fbEl.innerHTML=(ok?'Correct. ':'Not quite. ')+esc(exp||'');}
  }
  function handleChip(chip){
    var q=chip.closest('.q'); var target=q.querySelector('.build-target');
    if(chip.parentNode.classList.contains('build-bank')){chip.classList.add('used');var c=chip.cloneNode(true);c.classList.remove('used');c.dataset.from=chip.dataset.w;target.appendChild(c);}
    else{ // remove from target, re-enable in bank
      var w=chip.dataset.w; chip.remove();
      var bankChip=q.querySelector('.build-bank .word-chip.used[data-w="'+CSS.escape(w)+'"]');
      if(bankChip)bankChip.classList.remove('used');
    }
  }
  var catSel=null;
  function handleCat(item){
    if(item.classList.contains('placed'))return;
    if(catSel)catSel.classList.remove('sel');
    if(catSel===item){catSel=null;return;}
    item.classList.add('sel');catSel=item;
  }
  function handleDrop(drop){
    if(!catSel)return;
    catSel.classList.remove('sel');catSel.classList.add('placed');
    drop.appendChild(catSel);catSel=null;
  }

  function checkExercise(eid,type){
    var r=exReg[eid]; if(!r)return; var body=document.getElementById(eid+'-body');
    var correct=0,total=0;
    if(type==='gap'||type==='convo'){
      body.querySelectorAll('.gap-inp').forEach(function(inp){total++;var ok=accepts(inp.value,inp.dataset.a);inp.classList.remove('correct','wrong');inp.classList.add(ok?'correct':'wrong');inp.disabled=true;if(ok)correct++;});
    } else if(type==='transform'||type==='ec'){
      body.querySelectorAll('.txt-inp').forEach(function(inp,j){total++;var ok=accepts(inp.value,inp.dataset.a);inp.classList.remove('correct','wrong');inp.classList.add(ok?'correct':'wrong');inp.disabled=true;if(ok)correct++;
        var f=document.getElementById(eid+'_f'+j);if(f&&!ok){f.className='q-fb show no';f.innerHTML='Answer: '+esc(inp.dataset.a.split('/')[0]);}else if(f){f.className='q-fb show ok';f.innerHTML='Correct';}});
    } else if(type==='mc'||type==='tf'){
      body.querySelectorAll('.opts').forEach(function(box){total++;if(box.dataset.answered&&box.querySelector('.wrong')===null&&box.querySelector('.correct'))correct++;else if(!box.dataset.answered){/*auto-reveal*/var ans=box.dataset.ans;Array.prototype.forEach.call(box.children,function(b){b.disabled=true;if(b.dataset.o===ans)b.classList.add('reveal');});}});
    } else if(type==='builder'){
      body.querySelectorAll('.build-target').forEach(function(t,j){total++;var built=Array.prototype.map.call(t.children,function(c){return c.dataset.w;}).join(' ');var ok=accepts(built,t.dataset.a);t.style.borderColor=ok?'var(--sea)':'var(--coral)';t.style.background=ok?'var(--sea-tint)':'var(--coral-tint)';if(ok)correct++;var f=document.getElementById(eid+'_f'+j);if(f){f.className='q-fb show '+(ok?'ok':'no');f.innerHTML=ok?'Correct':('Answer: '+esc(t.dataset.a.split('/')[0]));}});
    } else if(type==='categorise'){
      body.querySelectorAll('.cat-drop').forEach(function(drop){var cat=drop.dataset.cat;drop.querySelectorAll('.cat-item').forEach(function(it){total++;var ok=it.dataset.cat===cat;it.classList.add(ok?'correct':'wrong');if(ok)correct++;});});
    }
    var sc=document.getElementById(eid+'-score'); if(sc){sc.className='ex-score show';sc.textContent=correct+' / '+total;}
  }
  function showAnswers(eid){
    var r=exReg[eid]; if(!r)return; var ex=r.ex, body=document.getElementById(eid+'-body');
    if(ex.type==='gap'||ex.type==='convo'){body.querySelectorAll('.gap-inp').forEach(function(inp){inp.value=inp.dataset.a.split('/')[0];inp.classList.add('correct');inp.disabled=true;});}
    else if(ex.type==='transform'||ex.type==='ec'){body.querySelectorAll('.txt-inp').forEach(function(inp){inp.value=inp.dataset.a.split('/')[0];inp.classList.add('correct');inp.disabled=true;});}
    else if(ex.type==='mc'||ex.type==='tf'){body.querySelectorAll('.opts').forEach(function(box){var ans=box.dataset.ans;Array.prototype.forEach.call(box.children,function(b){b.disabled=true;if(b.dataset.o===ans)b.classList.add('reveal');});});}
    else if(ex.type==='builder'){body.querySelectorAll('.build-target').forEach(function(t){t.innerHTML='';t.dataset.a.split('/')[0].trim().split(' ').forEach(function(w){var c=document.createElement('span');c.className='word-chip';c.textContent=w;t.appendChild(c);});});}
    else if(ex.type==='categorise'){var bank=document.getElementById(eid+'-bank');body.querySelectorAll('.cat-drop').forEach(function(drop){var cat=drop.dataset.cat;});body.querySelectorAll('.cat-item').forEach(function(it){var target=body.querySelector('.cat-drop[data-cat="'+CSS.escape(it.dataset.cat)+'"]');if(target){it.classList.remove('sel');it.classList.add('placed','correct');target.appendChild(it);}});}
  }

  renderLesson(Math.min(current,LESSONS.length-1));
})();
</script>
<script>
/* High-res PNG export of the current lesson's Learn content, via html2canvas
   (same library/CDN used elsewhere on the site - no canvas taint). */
(function(){
  var H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  function loadH2C(){return new Promise(function(res,rej){if(typeof html2canvas!=='undefined')return res();var s=document.createElement('script');s.src=H2C;s.onload=function(){res();};s.onerror=function(){rej(new Error('html2canvas failed to load'));};document.head.appendChild(s);});}
  window.exportLessonPNG=function(i,btn){
    var titleEl=document.querySelector('.g-lesson-title');
    var subEl=document.querySelector('.g-lesson-sub');
    var learn=document.querySelector('#pane-learn .g-card');
    if(!titleEl||!learn) return;
    var eyebrow=document.querySelector('.g-title')?document.querySelector('.g-title').textContent.trim():'Grammar';
    var id=(window.LESSONS&&LESSONS[i])?LESSONS[i].id:'lesson';
    var fileslug=(eyebrow.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'grammar')+'-'+id;
    var orig; if(btn){orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span style="font-size:.7rem;font-weight:700;line-height:1">…</span>';}
    var host=document.createElement('div');host.style.cssText='position:fixed;left:-100000px;top:0;z-index:-1;pointer-events:none';
    var card=document.createElement('div');card.className='png-export-card';
    card.innerHTML='<div class="pec-inner"><div class="pec-eyebrow">'+eyebrow+'</div><h2 class="pec-title">'+titleEl.innerHTML+'</h2>'+(subEl?'<div class="pec-sub">'+subEl.innerHTML+'</div>':'')+'<div class="pec-body">'+learn.innerHTML+'</div><div class="pec-foot"><b>johnplusenglish</b> &nbsp;·&nbsp; English grammar, one lesson at a time</div></div>';
    host.appendChild(card);document.body.appendChild(host);
    var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready.catch(function(){}):Promise.resolve();
    loadH2C().then(function(){return ready;}).then(function(){
      return html2canvas(card,{scale:3,backgroundColor:'#F7F6F3',useCORS:true,logging:false,width:card.offsetWidth,height:card.offsetHeight});
    }).then(function(canvas){
      var link=document.createElement('a');link.download=fileslug+'.png';link.href=canvas.toDataURL('image/png');
      document.body.appendChild(link);link.click();document.body.removeChild(link);
    }).catch(function(err){console.error('PNG export failed:',err);alert('Sorry, the image export failed. Please check your connection and try again.');}).then(function(){
      if(host.parentNode)host.parentNode.removeChild(host);
      if(btn){btn.disabled=false;if(orig!=null)btn.innerHTML=orig;}
    });
  };
})();
</script>
