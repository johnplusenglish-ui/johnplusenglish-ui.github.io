<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2 Grammar - johnplusenglish</title>
<meta name="description" content="A2 grammar, one lesson at a time. Work through 15 core A2 structures with clear explanations in plain English and practice that checks itself.">
<script src="lock.js"></script>
<script src="/assets/deeplink.js"></script>
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --cream:#F7F6F3; --card:#fff; --ink:#2D3047; --muted:#8A8D9A;
  --border:#E8E5DF; --line:#EFEDE7;
  --sky:#2176FF; --sky-tint:#EAF2FE;
  --sea:#1DD3B0; --sea-d:#0F7D71; --sea-tint:#E4FBF7; --sea-bd:rgba(29,211,176,.4);
  --coral:#FF6B6B; --coral-d:#C0392B; --coral-tint:#FDECEC;
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}
.topnav{display:none}
a{color:var(--sky);text-decoration:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:32px 24px 80px}

/* header */
.g-head{display:flex;align-items:flex-start;gap:16px;margin:0 0 8px}
.g-badge{width:52px;height:52px;border-radius:14px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--sky)}
.g-badge svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g-title{font-size:2rem;font-weight:900;letter-spacing:-.02em;margin:0;line-height:1.05}
.g-sub{font-size:1rem;color:var(--muted);margin:4px 0 0;max-width:56ch}
.g-progwrap{margin:22px 0 26px}
.g-progline{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 8px}
.g-progline strong{color:var(--ink)}
.g-progbar{height:8px;border-radius:5px;background:var(--border);overflow:hidden}
.g-progfill{height:100%;width:0;background:var(--sea);border-radius:5px;transition:width .4s}

/* layout */
.g-layout{display:grid;grid-template-columns:288px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.g-layout{grid-template-columns:1fr}.g-road{position:static !important;max-height:none !important}}

/* roadmap sidebar */
.g-road{position:sticky;top:20px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:8px;max-height:calc(100vh - 40px);overflow:auto}
.g-road-head{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:12px 12px 8px}
.g-step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;font-family:inherit;cursor:pointer;padding:11px 12px;border-radius:10px;color:var(--ink);transition:background .15s}
.g-step:hover{background:var(--cream)}
.g-step.active{background:var(--sky-tint)}
.g-step-n{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:1.5px solid var(--border);color:var(--muted);background:var(--card)}
.g-step.active .g-step-n{border-color:var(--sky);color:var(--sky)}
.g-step.done .g-step-n{background:var(--sea);border-color:var(--sea);color:#fff}
.g-step-n svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g-step-t{font-size:.9rem;font-weight:600;line-height:1.3;min-width:0}
.g-step.active .g-step-t{color:var(--sky)}

/* lesson pane */
.g-lesson{min-width:0}
.g-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:30px 32px;margin:0 0 20px}
.g-eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);margin:0 0 6px}
.g-lesson-title{font-size:1.6rem;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;line-height:1.1}
.g-lesson-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:0 0 18px}
/* in-lesson folder tabs (matches site) */
.l-tabs{display:flex;gap:4px;position:relative;margin:6px 0 20px;align-items:flex-end;flex-wrap:wrap;padding-top:6px}
.l-tabs::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.l-tab{position:relative;font-family:inherit;font-size:.92rem;font-weight:700;padding:.55rem 1.5rem;color:var(--muted);cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1.5px solid var(--border);border-radius:12px 12px 0 0;transition:background .18s,color .18s}
.l-tab:hover{color:var(--ink)}
.l-tab.active{background:var(--cream);border-color:var(--sky);border-bottom:1.5px solid var(--cream);color:var(--sky);z-index:2}
.l-tab .l-tab-c{font-weight:600;opacity:.6;margin-left:7px}
.l-pane{display:none}
.l-pane.show{display:block}
/* soft circular number badges (match the roadmap) */
.g-ex-num{display:inline-flex;width:27px;height:27px;border-radius:50%;background:var(--sky);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;margin-right:12px;vertical-align:-6px;font-variant-numeric:tabular-nums}
.q-num{display:inline-flex;width:25px;height:25px;border-radius:50%;background:var(--sky-tint);color:var(--sky);align-items:center;justify-content:center;font-weight:700;font-size:.78rem;margin-right:11px;vertical-align:-5px;font-variant-numeric:tabular-nums}
.g-intro{font-size:1.05rem;font-weight:500;color:var(--ink);background:var(--sky-tint);border-radius:12px;padding:16px 20px;margin:0 0 22px}
.g-body{font-size:1rem}
.g-body p{margin:0 0 14px}
.g-body strong{font-weight:700}
.g-body em{font-style:italic;color:var(--ink)}
.g-body .rule{display:flex;gap:14px;align-items:flex-start;background:none;border:none;padding:0;margin:0 0 15px}
.g-body .rule-num{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--sea);margin-top:10px;font-size:0;color:transparent}
.g-body .rule-text{font-size:1rem;line-height:1.62}
.g-body .note{background:var(--sea-tint);border:none;border-radius:14px;padding:16px 20px;margin:20px 0 4px;font-size:.96rem;line-height:1.65}
.g-body .note strong{color:var(--sea-d)}

.g-sec-label{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:34px 0 16px}

table.g-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin:0 0 8px}
.g-table th{background:var(--cream);text-align:left;font-weight:700;padding:11px 14px;border-bottom:1.5px solid var(--border);font-size:.82rem}
.g-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.g-table tr:last-child td{border-bottom:none}
.g-table td:first-child{font-weight:600;color:var(--muted);white-space:nowrap}

/* In action - airy 2-column grid, no boxes, no dividers */
.g-examples{display:grid;grid-template-columns:1fr 1fr;gap:4px 34px;margin:0 0 4px}
@media(max-width:660px){.g-examples{grid-template-columns:1fr}}
.g-ex{padding:11px 0;background:none;border:none;display:block}
.g-ex-t{font-weight:800;font-size:.82rem;margin-right:10px}
.g-ex.pos .g-ex-t{color:var(--sea-d)}
.g-ex.neg .g-ex-t,.g-ex.q .g-ex-t{color:var(--sky)}
.g-ex-eng{font-weight:600;font-size:1rem}
.g-ex-note{font-size:.85rem;color:var(--muted);margin:3px 0 0 23px}

/* Watch out for - airy colour-coded pairs, no boxes, no dividers */
.g-errors{display:flex;flex-direction:column;gap:22px;margin:0 0 4px}
.g-err{background:none;border:none;padding:0}
.g-err-line{display:flex;gap:9px;align-items:baseline;font-size:.98rem;line-height:1.45}
.g-err-line .mk{flex:0 0 auto;font-weight:800;font-size:.9rem}
.g-err-bad{color:var(--coral-d)}.g-err-bad .mk{color:var(--coral)}
.g-err-good{color:var(--sea-d);font-weight:600;margin-top:3px}.g-err-good .mk{color:var(--sea-d)}
.g-err-reason{font-size:.85rem;color:var(--muted);margin:7px 0 0 23px}

.g-real{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.g-real li{position:relative;padding:0 0 0 22px;font-size:.96rem;line-height:1.55;border:none}
.g-real li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--sky)}

.g-tip{display:flex;gap:12px;background:var(--sea-tint);border:1.5px solid var(--sea-bd);border-radius:12px;padding:15px 18px;margin:22px 0 0}
.g-tip-label{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sea-d);margin:0 0 3px}
.g-tip p{margin:0;font-size:.95rem;line-height:1.55}

/* exercises */
.g-exercise{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:22px 24px;margin:0 0 16px}
.g-ex-title{font-size:1.05rem;font-weight:700;margin:0 0 2px}
.g-ex-sub{font-size:.9rem;color:var(--muted);margin:0 0 16px}
.q{padding:16px 0;border:none}
.q-text{font-size:1rem;margin:0 0 10px;line-height:1.75}
.gap-inp,.txt-inp{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;padding:.4rem .6rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);outline:none;transition:border-color .2s,background .2s}
.gap-inp{width:150px;text-align:center}
.txt-inp{width:100%;max-width:520px}
.gap-inp:focus,.txt-inp:focus{border-color:var(--sky)}
.gap-inp.correct,.txt-inp.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.gap-inp.wrong,.txt-inp.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0}
.opt{font-family:inherit;font-size:.95rem;font-weight:600;text-align:left;padding:.7rem 1rem;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.opt.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opt.reveal{border-color:var(--sea);color:var(--sea-d)}
.opt:disabled{cursor:default}
.q-fb{font-size:.88rem;margin-top:8px;padding:8px 12px;border-radius:8px;display:none}
.q-fb.show{display:block}
.q-fb.ok{background:var(--sea-tint);color:var(--sea-d)}
.q-fb.no{background:var(--coral-tint);color:var(--coral-d)}
.q-fb.hint{background:var(--cream);color:var(--muted)}
.chk-btn{font-family:inherit;font-weight:700;font-size:.88rem;color:#fff;background:var(--sky);border:none;border-radius:10px;padding:.6rem 1.3rem;cursor:pointer;margin-top:14px;transition:background .15s}
.chk-btn:hover{background:#175fd0}
.chk-link{font-family:inherit;font-weight:600;font-size:.82rem;color:var(--muted);background:none;border:none;cursor:pointer;margin-left:12px}
.chk-link:hover{color:var(--coral)}
.ex-score{font-size:.85rem;font-weight:700;color:var(--sea-d);margin-left:12px;display:none}
.ex-score.show{display:inline}

/* builder */
.build-target{min-height:44px;border:1.5px dashed var(--border);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;background:var(--cream)}
.build-bank{display:flex;flex-wrap:wrap;gap:6px}
.word-chip{font-family:inherit;font-size:.9rem;font-weight:600;padding:.35rem .7rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.word-chip:hover{border-color:var(--ink)}
.word-chip.used{opacity:.35;pointer-events:none}
.build-target .word-chip{background:var(--sky-tint);border-color:var(--sky)}

/* categorise */
.cat-cols{display:grid;gap:12px;margin:0 0 12px}
.cat-col{border:1.5px solid var(--border);border-radius:12px;padding:12px;min-height:70px;background:var(--card)}
.cat-col-h{font-size:.8rem;font-weight:700;color:var(--ink);margin:0 0 8px}
.cat-drop{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.cat-bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cat-item{font-family:inherit;font-size:.9rem;font-weight:600;padding:.4rem .8rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.cat-item.sel{border-color:var(--sky);background:var(--sky-tint);color:var(--sky)}
.cat-item.placed{background:var(--cream)}
.cat-item.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.cat-item.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}

/* convo */
.convo-line{display:flex;gap:10px;padding:8px 0;font-size:.98rem;line-height:1.8}
.convo-sp{font-weight:800;color:var(--sky);flex:0 0 auto;width:22px}

/* footer nav */
.g-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 0}
.g-complete{font-family:inherit;font-weight:700;font-size:.92rem;color:#fff;background:var(--sea);border:none;border-radius:12px;padding:.75rem 1.5rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.g-complete:hover{background:var(--sea-d)}
.g-complete.done{background:var(--sea-tint);color:var(--sea-d);border:1.5px solid var(--sea-bd)}
.g-complete svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next{font-family:inherit;font-weight:700;font-size:.92rem;color:var(--ink);background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.75rem 1.4rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s}
.g-next:hover{border-color:var(--ink)}
.g-next svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next[disabled]{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

/* ── PNG export ── */
.g-export-btn{background:none;border:1.5px solid var(--border);border-radius:9px;padding:.34rem .5rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;flex:0 0 auto;font-family:inherit}
.g-export-btn:hover{border-color:var(--sky);color:var(--sky)}
.g-export-btn:disabled{opacity:.55;cursor:default;border-color:var(--border);color:var(--muted)}
.g-export-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.png-export-card{width:800px;box-sizing:border-box;background:var(--cream);padding:38px;font-family:'Outfit',sans-serif;color:var(--ink)}
.pec-inner{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:34px 36px 26px}
.pec-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:0 0 10px}
.pec-title{font-size:1.7rem;font-weight:900;letter-spacing:-.01em;margin:0;line-height:1.12}
.pec-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:5px 0 0}
.pec-body{margin-top:22px}
.pec-body>.g-body>*:first-child{margin-top:0}
.pec-body .g-sec-label:first-child{margin-top:6px}
.pec-foot{margin-top:28px;padding-top:16px;border-top:1.5px solid var(--border);font-size:.75rem;font-weight:600;color:var(--muted)}
.pec-foot b{color:var(--sky);font-weight:800}
</style>
</head>

<div class="wrap">
  <div class="g-head">
    <div class="g-badge"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>

<script>const LESSONS=[{"id":"pastsimple","title":"Past simple","subtitle":"I worked, she went, did you see?","intro":"The most important past tense in English. Regular verbs are easy; it's the irregulars that need patient learning.","desc":"The past simple is used for completed actions in the past. Regular verbs add -ed. Irregular verbs change completely - there is no shortcut except learning them.","tip":"The error I correct most often here: <strong>\"Did she went?\"<\/strong> Once <em>did<\/em> is in the sentence, it already carries the past, so the main verb drops back to its base form - <strong>\"Did she go?\"<\/strong> Let <em>did<\/em> do the heavy lifting.","explanation":"<p>The past simple describes <strong>completed actions in the past<\/strong> - things that started and finished at a specific time.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Regular verbs<\/strong> - add <em>-ed<\/em>: work → worked, play → played, arrive → arrived. Spelling: stop → stop<strong>p<\/strong>ed (short vowel + consonant = double it), study → stud<strong>ied<\/strong> (consonant + y → ied).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Irregular verbs<\/strong> - change completely: go → went, see → saw, have → had, come → came, buy → bought. No rule - must be memorised. The most common verbs in English are irregular, so you will encounter them constantly.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Questions and negatives<\/strong> use <em>did/didn't<\/em> + the base form. Once <em>did<\/em> is in the sentence, the main verb returns to its dictionary form - no past tense ending.<\/div><\/div>\n<div class=\"note\"><strong>The rule to lock in:<\/strong> did/didn't + the BASE form, never the past tense.<br><em>\"Did she go?\"<\/em> ✓ &nbsp; <em>\"Did she went?\"<\/em> ✗<br><em>\"I didn't eat.\"<\/em> ✓ &nbsp; <em>\"I didn't ate.\"<\/em> ✗<br>And the time words that call for it: yesterday, last week, in 2019, two days ago, when I was a child - whenever you name a specific finished time, it's the past simple, not the present perfect.<\/div>","table":{"headers":["","Positive","Negative","Question"],"rows":[["Regular verb","I worked / She played","I didn't work / She didn't play","Did you work? / Did she play?"],["Irregular verb","I went / He saw / She had","I didn't go / He didn't see","Did she go? / Did he see?"],["Short answer"," - ","No, I didn't.","Yes, I did."],["Key rule","verb changes form","didn't + BASE form (not past)","Did + subject + BASE form"],["Time words","yesterday, last week, in 2019, two days ago"," - "," - "]]},"examples":[{"type":"pos","eng":"I visited Rome last summer.","note":"Regular verb: visit + ed."},{"type":"pos","eng":"She went to the gym yesterday.","note":"Irregular verb: go → went."},{"type":"neg","eng":"They didn't watch the match.","note":"Negative: didn't + base form."},{"type":"neg","eng":"He didn't know the answer.","note":"Irregular know - but base form after didn't."}],"errors":[{"bad":"Did she went to the party?","good":"Did she go to the party?","reason":"After did/didn't, use the base form - never past tense."},{"bad":"I didn't went home.","good":"I didn't go home.","reason":"Same rule - didn't + base form."},{"bad":"She goed to school.","good":"She went to school.","reason":"Go is irregular - past simple is went, not goed."}],"realUse":[],"exercises":[{"type":"gap","title":"Regular past simple","sub":"Fill each gap with the past simple form of the verb in brackets.","items":[{"answer":"visited","before":"We ","after":" Paris last year. (visit)"},{"answer":"finished","before":"She ","after":" work at six. (finish)"},{"answer":"studied","before":"He ","after":" English at university. (study)"},{"answer":"arrived","before":"They ","after":" late to the meeting. (arrive)"},{"answer":"stopped","before":"The bus ","after":" suddenly. (stop)"},{"answer":"played","before":"I ","after":" tennis every Saturday as a child. (play)"},{"answer":"watched","before":"We ","after":" a great film last night. (watch)"},{"answer":"decided","before":"She ","after":" to change jobs. (decide)"}]},{"type":"gap","title":"Irregular past simple","sub":"Fill each gap with the correct irregular past form.","items":[{"answer":"went","before":"I ","after":" to the gym this morning. (go)"},{"answer":"saw","before":"We ","after":" a great film last night. (see)"},{"answer":"had","before":"She ","after":" a wonderful time. (have)"},{"answer":"came","before":"He ","after":" home very late. (come)"},{"answer":"knew","before":"I ","after":" the answer immediately. (know)"},{"answer":"took","before":"It ","after":" three hours to get there. (take)"},{"answer":"told","before":"She ","after":" me the truth. (tell)"},{"answer":"made","before":"He ","after":" a big mistake. (make)"}]},{"type":"convo","title":"Fill the conversation","sub":"Complete the dialogue using past simple forms.","lines":[{"speaker":"A","text":"[Did] you have a good weekend?"},{"speaker":"B","text":"Yes! I [went] to the coast with friends. We [had] a fantastic time."},{"speaker":"A","text":"[Did] you swim?"},{"speaker":"B","text":"I [tried], but the water [was] freezing! We [ended] up walking along the beach."},{"speaker":"A","text":"[Was] the weather good?"},{"speaker":"B","text":"It [rained] on Saturday but Sunday [was] perfect."},{"speaker":"A","text":"[Did] you eat out anywhere?"},{"speaker":"B","text":"We [found] a great little restaurant. I [had] the best fish I've ever eaten."}]}]},{"id":"pastcontinuous","title":"Past continuous","subtitle":"I was working, they were sleeping","intro":"What was already in progress when something else came along and interrupted it.","desc":"The past continuous describes an action that was in progress at a specific moment in the past, or an ongoing background action that was interrupted.","tip":"The pattern I drill most is the interrupted action: <em>\"I was cooking when the phone rang.\"<\/em> The continuous paints the background, the past simple drops in the interruption. Feel them as a pair and this tense makes sense instantly.","explanation":"<p>The past continuous describes an action that was <strong>already in progress<\/strong> at a specific past moment - not when it started or finished, but what was happening in the middle.<\/p>\n<p>Formed with <strong>was/were + verb-ing<\/strong>. Same spelling rules as present continuous: drop -e (come → coming), double the consonant on short vowel words (run → running, sit → sitting).<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Interrupted action pattern<\/strong> - the most important use at A2. A longer background action (past continuous) is interrupted by a shorter sudden event (past simple). <em>\"I was cooking when the phone rang.\"<\/em> Cooking was already happening - the phone rang and cut across it.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Two simultaneous actions<\/strong> - both continuous, joined with <em>while<\/em>. <em>\"While I was cooking, she was setting the table.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Background scene-setting<\/strong> - describing what was happening at a moment in a story. <em>\"It was raining. The streets were empty. A man was walking towards the station.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>While vs when:<\/strong> <em>while<\/em> usually introduces the longer background action (the continuous), and <em>when<\/em> usually introduces the interruption (the past simple). You can flip the order without changing the meaning: <em>\"When the phone rang, I was cooking.\"<\/em><\/div>","table":{"headers":["","I / He / She / It","You / We / They"],"rows":[["Positive","was + verb-ing (was working)","were + verb-ing (were working)"],["Negative","wasn't + verb-ing (wasn't listening)","weren't + verb-ing (weren't waiting)"],["Question","Was she + verb-ing? (Was she cooking?)","Were they + verb-ing? (Were they waiting?)"],["Short answer","Yes, she was. / No, she wasn't.","Yes, they were. / No, they weren't."],["Interrupted action","I was reading (background)","...when he called. (interruption - past simple)"],["Two simultaneous","While I was cooking...","...she was setting the table."]]},"examples":[{"type":"pos","eng":"I was sleeping at midnight.","note":"In progress at a specific past time."},{"type":"pos","eng":"She was studying when I called.","note":"Background action interrupted by a past simple."},{"type":"pos","eng":"They were having dinner at 8pm.","note":"What was happening at a specific moment."},{"type":"neg","eng":"He wasn't listening to the teacher.","note":"Wasn't = was not."}],"errors":[{"bad":"I was cook when you called.","good":"I was cooking when you called.","reason":"Past continuous needs the -ing form of the verb."},{"bad":"She were sleeping.","good":"She was sleeping.","reason":"She/he/it → was. Were is for you/we/they."},{"bad":"While I walked, it started to rain.","good":"While I was walking, it started to rain.","reason":"The ongoing background action needs the continuous."}],"realUse":[],"exercises":[{"type":"gap","title":"Past continuous - positive","sub":"Fill each gap with the past continuous form.","items":[{"answer":"was sleeping","before":"She ","after":" when the alarm went off. (sleep)"},{"answer":"were watching","before":"They ","after":" TV all evening. (watch)"},{"answer":"was raining","before":"It ","after":" when we arrived. (rain)"},{"answer":"were having","before":"We ","after":" dinner at eight. (have)"},{"answer":"was working","before":"He ","after":" late again. (work)"},{"answer":"were waiting","before":"The students ","after":" outside the classroom. (wait)"}]},{"type":"gap","title":"Past simple vs past continuous","sub":"Fill each gap - decide whether to use past simple or past continuous.","items":[{"answer":"was cooking","before":"I ","after":" when the fire alarm rang. (cook)"},{"answer":"rang","before":"I was cooking when the fire alarm ","after":". (ring)"},{"answer":"were playing","before":"The children ","after":" in the garden when it started to rain. (play)"},{"answer":"started","before":"The children were playing when it ","after":" to rain. (start)"},{"answer":"was driving","before":"She ","after":" when she heard the news. (drive)"},{"answer":"heard","before":"She was driving when she ","after":" the news. (hear)"}]},{"type":"mc","title":"Which tense?","sub":"Choose the correct form.","items":[{"q":"I _____ a shower when you called.","opts":["had","was having","have","were having"],"answer":"was having","explanation":"Background action in progress when interrupted - past continuous."},{"q":"While she _____, the power went off.","opts":["worked","was working","is working","works"],"answer":"was working","explanation":"While + ongoing background action - past continuous."},{"q":"What _____ at 9pm last night?","opts":["did you do","were you doing","you were doing","you did"],"answer":"were you doing","explanation":"Asking what was in progress at a specific time - past continuous question."},{"q":"He _____ the door and _____ in.","opts":["opened / walked","was opening / was walking","opened / was walking","was opening / walked"],"answer":"opened / walked","explanation":"Two completed sequential actions - both past simple."}]}]},{"id":"presentperfect","title":"Present perfect","subtitle":"I have been, she has seen","intro":"The bridge between past and present - the past kept alive by its connection to now.","desc":"The present perfect is often the trickiest tense for A2 learners because it does not exist in many languages. The key is that the action has a connection to the present.","tip":"The classic slip I catch: pinning the present perfect to a finished time, as in <strong>\"I have seen him yesterday.\"<\/strong> My test is simple - if you can say exactly <em>when<\/em> it happened, use the past simple. The present perfect is for a past action with no fixed time that still matters now.","explanation":"<p>The present perfect connects a past action to <strong>right now<\/strong>. The action happened in the past, but it still matters - because of its result, its relevance, or because the time is still open. Formed with <strong>have/has + past participle<\/strong>.<\/p>\n<div class=\"note\"><strong>The golden rule:<\/strong> name a finished time (yesterday, in 2019, last week, an hour ago) → <strong>past simple<\/strong>. No specific time, or time still running → <strong>present perfect<\/strong>. They never mix - <em>\"I have seen him yesterday\"<\/em> is always wrong.<\/div>\n<p style=\"margin-top:14px\"><strong>For vs since<\/strong> - both used with present perfect for ongoing situations:<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>for<\/strong> + a duration of time: <em>for two years, for a long time, for ages<\/em>. Ask yourself: \"How long?\" → for.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>since<\/strong> + a starting point: <em>since 2018, since last Tuesday, since I was a child<\/em>. Ask yourself: \"Since when?\" → since.<\/div><\/div>","table":{"headers":["Use","Key word(s)","Example","Important note"],"rows":[["Life experience - any time up to now","ever (questions) / never (negatives)","Have you ever been to Japan? / I've never tried it.","No specific time mentioned"],["Very recent action","just","She's just arrived. / He's just called.","Just goes between have and participle"],["Action not yet done, but expected","yet","I haven't finished yet. / Have you eaten yet?","Yet goes at the end"],["Action done sooner than expected","already","I've already seen that film.","Already goes between have and participle"],["Unfinished time - duration","for + length of time","I've lived here for three years.","Still living here now"],["Unfinished time - starting point","since + point in time","I've worked here since 2020.","Still working here now"],["NOT for finished past times","past simple instead","I saw him yesterday. ✓   I've seen him yesterday. ✗","Yesterday/last week/ago → past simple"]]},"examples":[{"type":"pos","eng":"I've been to Spain three times.","note":"Life experience - no specific time mentioned."},{"type":"pos","eng":"She's just arrived.","note":"Very recent action - just + present perfect."},{"type":"pos","eng":"Have you ever tried sushi?","note":"Ever in questions about life experience."},{"type":"neg","eng":"I haven't finished yet.","note":"Yet in negatives - action expected but not done."}],"errors":[{"bad":"I have seen him yesterday.","good":"I saw him yesterday.","reason":"Yesterday is a specific past time - use past simple."},{"bad":"Did you ever been to Paris?","good":"Have you ever been to Paris?","reason":"Ever with life experience - present perfect, not past simple."},{"bad":"She has gone there an hour ago.","good":"She went there an hour ago.","reason":"Specific time (an hour ago) - past simple."}],"realUse":[],"exercises":[{"type":"gap","title":"Present perfect - positive","sub":"Fill each gap with the present perfect form.","items":[{"answer":"have been","before":"I ","after":" to Japan twice. (be)"},{"answer":"has just arrived","before":"She ","after":". (just arrive)"},{"answer":"have never tried","before":"I ","after":" sushi. (never try)"},{"answer":"has won","before":"Our team ","after":" three trophies this year. (win)"},{"answer":"have lived","before":"They ","after":" here since 2018. (live)"},{"answer":"has already finished","before":"He ","after":" the report. (already finish)"},{"answer":"have visited","before":"We ","after":" fifteen countries. (visit)"},{"answer":"has changed","before":"Everything ","after":" so much. (change)"}]},{"type":"gap","title":"Present perfect or past simple?","sub":"Fill each gap - choose the correct tense.","items":[{"answer":"Have you ever been","before":"","after":" to Paris? (ever be - present perfect question)"},{"answer":"went","before":"I ","after":" to Paris in 2019. (go - past simple)"},{"answer":"saw","before":"I ","after":" that film last week. (see - past simple)"},{"answer":"haven't seen","before":"I ","after":" that film yet. (not see - present perfect)"},{"answer":"has just called","before":"She ","after":". (just call - present perfect)"},{"answer":"called","before":"She ","after":" an hour ago. (call - past simple)"}]},{"type":"mc","title":"Ever, never, already, yet, just","sub":"Choose the correct time word.","items":[{"q":"Have you _____ been to Australia?","opts":["already","yet","ever","just"],"answer":"ever","explanation":"Ever = at any time in your life. Used in questions about life experience."},{"q":"I've _____ finished - I started five minutes ago!","opts":["yet","just","ever","never"],"answer":"just","explanation":"Just = very recently, moments ago."},{"q":"Have you called her _____?","opts":["ever","just","never","yet"],"answer":"yet","explanation":"Yet = by now. Used in questions and negatives."},{"q":"I've _____ eaten sushi - I hate fish.","opts":["just","yet","ever","never"],"answer":"never","explanation":"Never = at no time in your life."}]}]},{"id":"goingto","title":"Future: going to","subtitle":"I'm going to study, she's going to leave","intro":"Plans you've already made, and predictions you can back up with what you can already see.","desc":"Going to is used for intentions and plans you have already decided on, and for predictions based on present evidence.","tip":"My students often blur <em>going to<\/em> and <em>will<\/em>, so here's the line I draw: if you've <strong>already decided<\/strong>, or you can <strong>see the evidence<\/strong> right now, use <em>going to<\/em>. Save <em>will<\/em> for a decision made on the spot or a general prediction.","explanation":"<p><strong>Going to<\/strong> is formed with <strong>am/is/are + going to + base verb<\/strong>. It is used when there is already <em>evidence<\/em> for the future - either a prior decision, or something you can see.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Pre-decided plans and intentions.<\/strong> The decision was made before this conversation - you are not deciding now, you are reporting a decision already made. <em>\"I'm going to study medicine.\"<\/em> (decided before we spoke).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Predictions based on present evidence.<\/strong> You can see or sense something right now that tells you what is about to happen. <em>\"Look at those clouds - it's going to rain!\"<\/em> (the evidence is visible).<\/div><\/div>\n<div class=\"note\"><strong>Going to vs will:<\/strong><br>Evidence behind the prediction, or a decision already made? → <strong>going to<\/strong><br>Deciding right now, in this moment? → <strong>will<\/strong><br>A general prediction from opinion, no evidence in front of you? → <strong>will<\/strong><\/div>","table":{"headers":["Form","Structure","Example"],"rows":[["Positive","am/is/are + going to + base verb","I'm going to study. / She's going to leave. / They're going to win."],["Negative","am/is/are + not + going to + base verb","I'm not going to go. / He isn't going to call. / We aren't going to stay."],["Question","Am/Is/Are + subject + going to + base verb?","Are you going to come? / Is she going to stay?"],["Short answer","Yes/No + subject + am/is/are (not)","Yes, I am. / No, she isn't. / Yes, they are."],["Use 1: pre-decided plan","decision was made before speaking","I'm going to quit. (decided earlier)"],["Use 2: evidence prediction","something visible signals the outcome","Look - it's going to rain! (I can see the clouds)"],["vs will - spontaneous decision","deciding right now, no prior plan","'The phone's ringing.' 'I'll get it.'"]]},"examples":[{"type":"pos","eng":"I'm going to study medicine.","note":"Decided plan - already know what you want to do."},{"type":"pos","eng":"Look at those clouds! It's going to rain.","note":"Prediction from present evidence - you can see the clouds."},{"type":"pos","eng":"She's going to have a baby.","note":"Planned / inevitable future event."},{"type":"neg","eng":"I'm not going to eat meat anymore.","note":"Decided intention."}],"errors":[{"bad":"I going to study tonight.","good":"I'm going to study tonight.","reason":"Going to needs the verb to be: am/is/are going to."},{"bad":"She is go to leave.","good":"She is going to leave.","reason":"Full form: is going to + base verb."},{"bad":"Look - he going to fall!","good":"Look - he's going to fall!","reason":"Present evidence prediction still needs is/are."}],"realUse":[],"exercises":[{"type":"gap","title":"Going to - positive","sub":"Fill each gap with the going to form of the verb in brackets.","items":[{"answer":"'m going to study/am going to study","before":"I ","after":" medicine. (study)"},{"answer":"is going to rain","before":"Look at those clouds - it ","after":". (rain)"},{"answer":"are going to miss","before":"If we don't hurry, we ","after":" the train. (miss)"},{"answer":"'s going to be/is going to be","before":"This ","after":" a great party! (be)"},{"answer":"are going to buy","before":"They ","after":" a new house next year. (buy)"},{"answer":"is going to leave","before":"She ","after":" the company at the end of the month. (leave)"},{"answer":"'m going to cook/am going to cook","before":"I ","after":" dinner tonight. (cook)"},{"answer":"are going to win","before":"Look at the score - they ","after":". (win)"}]},{"type":"gap","title":"Negatives and questions","sub":"Fill each gap - negative or question form.","items":[{"answer":"aren't going to come","before":"They ","after":" to the party. (not come)"},{"answer":"isn't going to be","before":"It ","after":" easy. (not be)"},{"answer":"Are you going to","before":"","after":" apply for the job?"},{"answer":"Is she going to","before":"","after":" stay for dinner?"},{"answer":"aren't going to finish","before":"We ","after":" in time. (not finish)"}]},{"type":"mc","title":"Will or going to?","sub":"Choose the most natural option.","items":[{"q":"Look out! You _____ drop that!","opts":["will drop","are going to drop","drop","are dropping"],"answer":"are going to drop","explanation":"You can see it about to happen - present evidence - going to."},{"q":"The phone is ringing. OK, I _____ get it.","opts":["am going to get","get","will get","am getting"],"answer":"will get","explanation":"Spontaneous decision made at the moment of speaking - will."},{"q":"She _____ study in Paris next year. She applied last month.","opts":["will study","is going to study","studies","studied"],"answer":"is going to study","explanation":"Already decided and planned - going to."},{"q":"I think it _____ be cold tomorrow.","opts":["is going to","goes to","will","is"],"answer":"will","explanation":"General prediction without specific present evidence - will."}]}]},{"id":"will","title":"Future: will","subtitle":"I will call, she won't come","intro":"Spontaneous decisions, promises, offers and predictions - the on-the-spot future.","desc":"Will is one of those modal verbs students pick up quickly but then overuse. The key is knowing when going to is more natural.","tip":"I teach <em>will<\/em> as the tense of the moment: you decide as you speak. If you'd thought it through beforehand, that's <em>going to<\/em>. \"I'll have the pasta\" (deciding right now) versus \"I'm going to make pasta tonight\" (decided this morning).","explanation":"<p><strong>Will<\/strong> is a modal verb + base form - no <em>to<\/em>, no <em>-ing<\/em>, no <em>-s<\/em> for third person. Contraction: <em>'ll<\/em>. Negative: <em>won't<\/em>.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Spontaneous decisions<\/strong> - you decide at the exact moment of speaking, no prior plan. <em>\"The milk is finished.\" \"I'll buy some.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Promises and offers<\/strong> - <em>\"I'll be there, I promise.\"<\/em> &nbsp;/&nbsp; <em>\"I'll carry that for you.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Suggestions<\/strong> - <em>Shall I...?<\/em> (offering to do something) &nbsp;/&nbsp; <em>Shall we...?<\/em> (suggesting a joint action). More British, slightly more formal.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>General predictions<\/strong> - based on opinion, not visible evidence. <em>\"I think things will get better.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Will vs going to for predictions:<\/strong> can you point to evidence right now? → <strong>going to<\/strong>. &nbsp; Just a general belief or opinion? → <strong>will<\/strong>.<\/div>","table":{"headers":["Use","Structure","Example"],"rows":[["Spontaneous decision (now)","will + base verb","'The phone's ringing.' 'I'll get it.'"],["Promise","will / won't + base verb","I'll be there. / I won't tell anyone."],["Offer","I'll + base verb  OR  Shall I + base verb?","I'll carry that. / Shall I open the window?"],["Joint suggestion","Shall we + base verb?","Shall we get a coffee?"],["General prediction","I think/probably + will","I think it will rain later. / It'll probably be fine."],["vs going to","visible evidence now → going to","Look - it's going to rain! (I can see the clouds)"],["Contraction forms","'ll = will  /  won't = will not","I'll call. / She won't come. / They'll be late."]]},"examples":[{"type":"pos","eng":"I'll call you later.","note":"Spontaneous decision or promise."},{"type":"pos","eng":"It will be cold in December.","note":"General prediction - no specific evidence."},{"type":"pos","eng":"Don't worry - I'll help you.","note":"Offer made in the moment."},{"type":"neg","eng":"She won't be there, I'm sure.","note":"Won't = will not."}],"errors":[{"bad":"I will to call you later.","good":"I will call you later.","reason":"Will is a modal verb - always followed by the base form. Never will + to + infinitive."},{"bad":"She is going to will get the job.","good":"She is going to get the job.","reason":"Going to and will are alternatives - never use both together."},{"bad":"Will you to help me?","good":"Will you help me?","reason":"Modal + base form - no to between will and the verb."}],"realUse":[],"exercises":[{"type":"gap","title":"Will - positive, negative, questions","sub":"Fill each gap with will, won't, or the contracted form.","items":[{"answer":"I'll/I will","before":"","after":" call you later."},{"answer":"won't/will not","before":"She ","after":" be at the party - she's busy."},{"answer":"Will","before":"","after":" you help me with this?"},{"answer":"'ll/will","before":"Don't worry - it ","after":" be fine."},{"answer":"won't/will not","before":"I ","after":" tell anyone, I promise."},{"answer":"Will","before":"","after":" they be late?"},{"answer":"'ll/will","before":"I ","after":" have the pasta, please."},{"answer":"won't/will not","before":"He ","after":" change his mind - he never does."}]},{"type":"mc","title":"Will or going to?","sub":"Choose the most natural option for each context.","items":[{"q":"There's no milk. OK, I _____ buy some. (spontaneous decision)","opts":["'m going to buy","'ll buy","bought","buy"],"answer":"'ll buy","explanation":"Spontaneous decision made at that moment - will."},{"q":"What are your plans for summer? I _____ travel around Spain. (already planned)","opts":["will travel","'ll travel","'m going to travel","travelled"],"answer":"'m going to travel","explanation":"Already planned before the conversation - going to."},{"q":"I think robots _____ do most jobs in the future. (general prediction)","opts":["are going to do","go to do","will do","are doing"],"answer":"will do","explanation":"General prediction without current evidence - will."},{"q":"Look! She _____ fall! (prediction from current evidence)","opts":["will fall","is going to fall","falls","fell"],"answer":"is going to fall","explanation":"You can see it happening right now - going to."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"I promise I won't be late.","keyword":"will","answer":"I will not be late, I promise. / I promise I will not be late. / I won't be late, I promise."},{"original":"She is not going to come.","keyword":"won't","answer":"She won't come."},{"original":"Do you want to eat out tonight?","keyword":"Shall","answer":"Shall we eat out tonight?"},{"original":"I think the weather will be good.","keyword":"will","answer":"The weather will be good, I think. / I think the weather will be good."},{"original":"Would you like me to help?","keyword":"Shall","answer":"Shall I help?/Shall I help you?"}]}]},{"id":"comparatives","title":"Comparative adjectives","subtitle":"bigger, more interesting, better","intro":"Comparing two things. Short adjectives add -er, longer ones reach for <em>more<\/em>.","desc":"Comparatives are used to compare two things. The structure is simple but the rules for forming them trip students up - especially the irregular forms.","tip":"Don't drop <strong>than<\/strong> - it's the word my students forget most. It's <strong>\"Madrid is bigger than Valencia\"<\/strong>, never \"bigger Valencia.\" And never double up: it's <em>bigger<\/em> or <em>more expensive<\/em>, never \"more bigger.\"","explanation":"<p>Comparatives compare <strong>two things<\/strong>. Structure: <strong>subject + verb + comparative + than + second thing<\/strong>. The word <em>than<\/em> is essential - never leave it out.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Short adjectives (1 syllable)<\/strong> - add <em>-er<\/em>: tall → taller, fast → faster. Ends in <em>-e<\/em>? Just add <em>-r<\/em>: nice → nicer. Ends in single vowel + consonant (big, hot, thin)? <strong>Double the final consonant<\/strong>: big → bigger, hot → hotter. The doubling protects the short vowel - without it, <em>biger<\/em> would sound different.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Adjectives ending in -y<\/strong> - change -y to -ier: happy → happier, easy → easier, busy → busier.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Long adjectives (2+ syllables)<\/strong> - put <em>more<\/em> in front. Never add -er to a long adjective. more interesting, more comfortable, more expensive. <em>Interestinger<\/em> is not a word.<\/div><\/div>\n<div class=\"note\"><strong>Irregular forms to memorise:<\/strong> good → better &nbsp;·&nbsp; bad → worse &nbsp;·&nbsp; far → further.<\/div>","table":{"headers":["Rule","Adjective type","How to form","Examples"],"rows":[["Rule 1a","1 syllable (most)","add -er","tall → taller,  fast → faster,  cheap → cheaper"],["Rule 1b","1 syllable ending in -e","add -r only","nice → nicer,  large → larger,  safe → safer"],["Rule 1c","1 syllable: single vowel + consonant","double consonant + -er","big → bigger,  hot → hotter,  thin → thinner,  sad → sadder"],["Rule 2","2 syllables ending in -y","change y → ier","happy → happier,  easy → easier,  busy → busier"],["Rule 3","2 or more syllables (not -y)","more + adjective","more interesting,  more expensive,  more comfortable"],["Irregular"," - ","must be memorised","good → better,  bad → worse,  far → further"],["Structure"," - ","comparative + than + second thing","Madrid is bigger than Valencia."]]},"examples":[{"type":"pos","eng":"This city is bigger than my hometown.","note":"Short adjective: big → bigger."},{"type":"pos","eng":"Spanish is more difficult than English for me.","note":"Long adjective: more + adjective."},{"type":"pos","eng":"She speaks English better than her brother.","note":"Irregular: good → better."},{"type":"neg","eng":"The new phone isn't cheaper than the old one.","note":"Negative comparison."}],"errors":[{"bad":"She is more tall than her sister.","good":"She is taller than her sister.","reason":"Short adjectives (1 syllable) use -er, not more. Never more + -er together."},{"bad":"This is more better than the other one.","good":"This is better than the other one.","reason":"Better is already the comparative of good. Never more + comparative form."},{"bad":"Madrid is hotter that Paris.","good":"Madrid is hotter than Paris.","reason":"Comparatives require than, not that."}],"realUse":[],"exercises":[{"type":"gap","title":"Form the comparative","sub":"Fill each gap with the correct comparative form of the adjective in brackets.","items":[{"answer":"taller","before":"He is ","after":" than his father. (tall)"},{"answer":"more interesting","before":"This book is ","after":" than the last one. (interesting)"},{"answer":"better","before":"Her English is ","after":" than mine. (good)"},{"answer":"hotter","before":"July is ","after":" than June here. (hot)"},{"answer":"more expensive","before":"The restaurant is ","after":" than I expected. (expensive)"},{"answer":"worse","before":"The traffic is ","after":" today than yesterday. (bad)"},{"answer":"happier","before":"She looks ","after":" than she did before. (happy)"},{"answer":"further/farther","before":"The station is ","after":" than I thought. (far)"}]},{"type":"categorise","title":"How do you form the comparative?","sub":"Click an adjective, then click the correct column.","categories":[{"name":"add -er","items":["tall","fast","cheap","warm","young"]},{"name":"more + adjective","items":["interesting","comfortable","expensive","popular","difficult"]},{"name":"irregular","items":["good","bad","far","little","much"]}]},{"type":"mc","title":"Multiple choice","sub":"Choose the correct comparative form.","items":[{"q":"My bag is _____ than yours.","opts":["more heavy","heavier","heavyer","more heavier"],"answer":"heavier","explanation":"Heavy → change y to i + er: heavier."},{"q":"She is _____ than her sister.","opts":["more tall","taller","more taller","tallier"],"answer":"taller","explanation":"Tall is one syllable → taller."},{"q":"This job is _____ than my last one.","opts":["satisfying more","more satisfying","satisfyinger","more satisfyinger"],"answer":"more satisfying","explanation":"Satisfying has 4 syllables → more + adjective."},{"q":"He drives _____ than me.","opts":["more good","gooder","better","more better"],"answer":"better","explanation":"Good → better. Always irregular."}]}]},{"id":"superlatives","title":"Superlative adjectives","subtitle":"the biggest, the most beautiful","intro":"The extreme end of the scale - the best, the worst, the most interesting in a group.","desc":"Superlatives describe the extreme quality of something within a group. They always use the.","tip":"Always keep <strong>the<\/strong> in front of a superlative; it's the piece students drop. It's <strong>\"She is the best student in the class\"<\/strong>, never \"She is best student.\" The <em>the<\/em> is doing real work - it marks that one unique top of the list.","explanation":"<p>Superlatives describe the <strong>extreme end of a scale<\/strong> within a group. They always use <strong>the<\/strong> - because they point to something unique.<\/p>\n<p>The formation rules are the same as comparatives - just replace <em>-er<\/em> with <em>-est<\/em> and <em>more<\/em> with <em>the most<\/em>. If you know the comparative, you know the superlative.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Short adjectives:<\/strong> the + -est &nbsp;→&nbsp; tall → the tallest, fast → the fastest, big → the biggest.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Ending in -y:<\/strong> the + -iest &nbsp;→&nbsp; happy → the happiest, easy → the easiest.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Long adjectives:<\/strong> the most + adjective &nbsp;→&nbsp; the most interesting, the most expensive.<\/div><\/div>\n<div class=\"note\"><strong>Irregular:<\/strong> good → the best &nbsp;·&nbsp; bad → the worst &nbsp;·&nbsp; far → the furthest.<br><strong>In vs of:<\/strong> <em>in<\/em> for places and groups (the best player <em>in<\/em> the team), <em>of<\/em> for sets and time (the best film <em>of<\/em> the year).<\/div>","table":{"headers":["Rule","Adjective type","Comparative","Superlative"],"rows":[["Rule 1a","1 syllable (most)","taller","the tallest"],["Rule 1c","1 syllable: vowel + consonant","hotter","the hottest"],["Rule 2","ending in -y","happier","the happiest"],["Rule 3","2+ syllables","more interesting","the most interesting"],["Irregular","good","better","the best"],["Irregular","bad","worse","the worst"],["Irregular","far","further","the furthest"],["Structure"," - ","comparative + than","the + superlative + in/of"]]},"examples":[{"type":"pos","eng":"It's the tallest building in the city.","note":"Short adjective → the + -est."},{"type":"pos","eng":"That was the most interesting lecture I've attended.","note":"Long adjective → the most + adjective."},{"type":"pos","eng":"She's the best player on the team.","note":"Irregular: good → the best."},{"type":"pos","eng":"It's the hottest day of the year.","note":"Short CVC adjective → double consonant + -est."}],"errors":[{"bad":"She is best student in the class.","good":"She is the best student in the class.","reason":"Superlatives always need the."},{"bad":"It's the most tall building.","good":"It's the tallest building.","reason":"Tall is one syllable → the tallest."},{"bad":"That was the baddest film.","good":"That was the worst film.","reason":"Bad → the worst. Always irregular."}],"realUse":[],"exercises":[{"type":"gap","title":"Form the superlative","sub":"Fill each gap with the correct superlative form.","items":[{"answer":"the tallest","before":"He is ","after":" person in the family. (tall)"},{"answer":"the most interesting","before":"That was ","after":" film I've seen. (interesting)"},{"answer":"the best","before":"She is ","after":" player on the team. (good)"},{"answer":"the hottest","before":"July is ","after":" month of the year here. (hot)"},{"answer":"the worst","before":"That was ","after":" meal I've ever had. (bad)"},{"answer":"the most expensive","before":"This is ","after":" restaurant in the city. (expensive)"},{"answer":"the happiest","before":"It was ","after":" day of my life. (happy)"},{"answer":"the furthest/the farthest","before":"That is ","after":" I've ever run. (far)"}]},{"type":"mc","title":"Comparative or superlative?","sub":"Choose the correct form.","items":[{"q":"She is _____ student in the class.","opts":["the best","better","the better","best"],"answer":"the best","explanation":"Comparing to all students - superlative with the."},{"q":"London is _____ than Madrid.","opts":["the biggest","bigger","the bigger","most big"],"answer":"bigger","explanation":"Comparing two cities - comparative (no the)."},{"q":"This is _____ film I've ever seen!","opts":["the most boring","more boring","the more boring","most boring"],"answer":"the most boring","explanation":"Superlative of life experience - the most boring."},{"q":"She speaks _____ than her brother.","opts":["the most fluently","more fluent","more fluently","the fluenter"],"answer":"more fluently","explanation":"Comparing two people - comparative adverb."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"No other building in the city is as tall as this one.","keyword":"the tallest","answer":"This is the tallest building in the city. / This building is the tallest in the city."},{"original":"No other student works as hard as Maria.","keyword":"the hardest","answer":"Maria works the hardest."},{"original":"I have never eaten a better meal.","keyword":"the best","answer":"It's the best meal I've ever eaten. / It is the best meal I have ever eaten. / This is the best meal I've ever eaten."},{"original":"Nothing is worse than cold coffee.","keyword":"the worst","answer":"Cold coffee is the worst."},{"original":"I've never seen a more interesting film.","keyword":"the most","answer":"It's the most interesting film I've ever seen. / It is the most interesting film I have ever seen."}]}]},{"id":"should","title":"Modal: should / shouldn't","subtitle":"You should rest, she shouldn't worry","intro":"Advice, recommendations and gentle obligation - the everyday should.","desc":"Should is the go-to verb for giving advice in English. It is softer than must and more polite than need to - which makes it the most socially versatile modal at A2.","tip":"A slip I hear a lot: <strong>\"You should to rest.\"<\/strong> Like every modal, <em>should<\/em> takes the base form straight after it - <strong>\"You should rest.\"<\/strong> No <em>to<\/em>, no <em>-ing<\/em>, no third-person -s.","explanation":"<p><strong>Should<\/strong> is a modal verb - base form only, no <em>to<\/em>, no <em>-ing<\/em>, no <em>-s<\/em> for third person. <em>She should<\/em> - never <em>she shoulds<\/em>. <em>You should rest<\/em> - never <em>you should to rest<\/em>.<\/p>\n<p>Should expresses that something is a <strong>good idea<\/strong> - the speaker's advice or recommendation. Think of it as meaning <em>\"in my opinion, it would be a good idea to...\"<\/em><\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Advice and recommendations<\/strong> - <em>\"You should see a doctor.\"<\/em> / <em>\"We should book early.\"<\/em> The speaker believes it is the right thing to do.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Asking for advice<\/strong> - <em>\"What should I do?\"<\/em> / <em>\"Should I tell her?\"<\/em> These invite a recommendation. Answer with <em>should<\/em> or <em>shouldn't<\/em>.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Shouldn't<\/strong> = bad idea, advise against it. Not the same as forbidden. <em>\"You shouldn't eat so much sugar\"<\/em> = bad idea, but no rule stops you.<\/div><\/div>\n<div class=\"note\"><strong>Should vs must vs mustn't:<\/strong><br><em>\"You should exercise more.\"<\/em> - advice, a good idea.<br><em>\"You must wear a seatbelt.\"<\/em> - obligation, it's the law.<br><em>\"You mustn't smoke here.\"<\/em> - prohibition, not allowed.<br><em>\"You shouldn't smoke so much.\"<\/em> - advice against it, though not forbidden.<\/div>","table":{"headers":["Form","Example","What it means"],"rows":[["should + base verb","You should see a doctor.","I recommend it - it's a good idea"],["shouldn't + base verb","You shouldn't drive if you're tired.","I advise against it - bad idea, not forbidden"],["Should + subject + base verb?","Should I apologise? / What should I wear?","Asking for advice or a recommendation"],["Short answers","Yes, you should. / No, you shouldn't.","Never: Yes, you should to."],["should vs must","You should exercise more. (advice)","You must wear a seatbelt. (law/rule)"],["shouldn't vs mustn't","You shouldn't eat so much. (bad idea)","You mustn't smoke here. (prohibited, forbidden)"]]},"examples":[{"type":"pos","eng":"You should see a doctor.","note":"Giving advice."},{"type":"pos","eng":"We should book early - it gets busy.","note":"Recommendation."},{"type":"pos","eng":"Children should eat more vegetables.","note":"General recommendation."},{"type":"neg","eng":"You shouldn't stay up so late.","note":"Advising against something."}],"errors":[{"bad":"You should to rest.","good":"You should rest.","reason":"No to after modal verbs."},{"bad":"She shoulds call him.","good":"She should call him.","reason":"Should never adds -s for third person."},{"bad":"You shouldn't to worry.","good":"You shouldn't worry.","reason":"Shouldn't + base form, no to."}],"realUse":[],"exercises":[{"type":"gap","title":"Should or shouldn't?","sub":"Fill each gap with should or shouldn't.","items":[{"answer":"should","before":"You ","after":" see a doctor about that cough."},{"answer":"shouldn't","before":"You ","after":" eat so much junk food."},{"answer":"should","before":"We ","after":" book the tickets in advance."},{"answer":"shouldn't","before":"Children ","after":" spend too much time on screens."},{"answer":"should","before":"I think you ","after":" apologise."},{"answer":"shouldn't","before":"You ","after":" drive if you're tired."},{"answer":"should","before":"She ","after":" call her parents more often."},{"answer":"shouldn't","before":"He ","after":" work so hard - it's not healthy."}]},{"type":"mc","title":"Giving advice","sub":"Choose the best option.","items":[{"q":"I have a headache. What _____ I do?","opts":["should","shall","must","am"],"answer":"should","explanation":"Asking for advice - should."},{"q":"You look exhausted. You _____ take a break.","opts":["should to","should","shouldn't to","shoulds"],"answer":"should","explanation":"Should + base form."},{"q":"It's very hot. You _____ drink more water.","opts":["should","shouldn't","mustn't","should to"],"answer":"should","explanation":"Recommendation - should."},{"q":"He _____ stay up late - he has an exam tomorrow.","opts":["shouldn't","should","must","should to"],"answer":"shouldn't","explanation":"Advising against - shouldn't."}]},{"type":"convo","title":"Fill the conversation","sub":"Complete the dialogue with should or shouldn't.","lines":[{"speaker":"A","text":"I've got a really bad cold. What [should] I do?"},{"speaker":"B","text":"You [should] rest and drink lots of fluids."},{"speaker":"A","text":"[Should] I go to work tomorrow?"},{"speaker":"B","text":"No, you [shouldn't]. You [should] stay at home."},{"speaker":"A","text":"And [should] I take any medicine?"},{"speaker":"B","text":"You [should] take something for the fever, but you [shouldn't] take too many pills."}]}]},{"id":"musthaveto","title":"Modal: must / have to","subtitle":"You must stop, I have to work","intro":"Obligation and necessity - and the difference between them that really matters.","desc":"Both express obligation, but they come from different sources. Must is internal - the speaker imposes it. Have to is external - rules, laws, or circumstances impose it.","tip":"Here's the distinction I want you to feel: <strong>must<\/strong> is me telling you (my authority), while <strong>have to<\/strong> is the rules or the situation forcing it. In everyday speech, <em>have to<\/em> is actually far more common than <em>must<\/em>.","explanation":"<p>Both express <strong>obligation<\/strong> - something that is necessary. The key question is: <em>who is imposing it?<\/em><\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Must<\/strong> - the obligation comes from <em>the speaker<\/em>. Your own strong feeling, or you imposing the rule. <em>\"You must try this cake!\"<\/em> (my insistence). <em>\"I must call her.\"<\/em> (my strong feeling).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Have to<\/strong> - the obligation comes from <em>outside<\/em>: rules, laws, other people, schedules. <em>\"I have to be at work by 9.\"<\/em> (the company's rule). <em>\"She has to take medication.\"<\/em> (doctor's orders).<\/div><\/div>\n<div class=\"note\"><strong>The negatives mean opposite things:<\/strong><br><strong>Mustn't<\/strong> = prohibited, not allowed: <em>\"You mustn't park here.\"<\/em><br><strong>Don't have to<\/strong> = not necessary, your choice: <em>\"You don't have to wear a tie.\"<\/em><br>Mixing these two up is one of the most common A2 mistakes.<\/div>\n<p style=\"margin-top:14px\">Have to conjugates normally: <em>I/you/we/they have to<\/em>, <em>he/she/it has to<\/em>. Past: <strong>had to<\/strong> (must has no past form).<\/p>","table":{"headers":["Form","Example","What it means / source of obligation"],"rows":[["must + base verb","You must try this! / I must call her.","Obligation from the speaker or strong personal feeling"],["have to / has to + base verb","I have to work Saturdays. / She has to take medicine.","Obligation from external rules, laws, or circumstances"],["mustn't + base verb","You mustn't park here.","PROHIBITED - it is not allowed at all"],["don't / doesn't have to + base verb","You don't have to wear a tie.","NOT NECESSARY - optional, your choice, no obligation"],["had to + base verb (past)","I had to wait two hours. / She had to cancel.","Past obligation (must has no past form)"],["Key question"," - ","Who is imposing it?  Me → must.  Rules/situation → have to."]]},"examples":[{"type":"pos","eng":"You must try this - it's incredible.","note":"Personal strong recommendation."},{"type":"pos","eng":"I have to be at work by 8.","note":"External obligation - work schedule."},{"type":"pos","eng":"She has to take medicine three times a day.","note":"Has to for he/she/it."},{"type":"neg","eng":"You mustn't smoke in here.","note":"Prohibition - it is forbidden."}],"errors":[{"bad":"I must to go now.","good":"I have to go now.","reason":"Must + base form - no to. For external necessity, have to is more natural."},{"bad":"She have to work on Sundays.","good":"She has to work on Sundays.","reason":"He/she/it → has to."},{"bad":"I had must leave early.","good":"I had to leave early.","reason":"Past of must → had to."}],"realUse":[],"exercises":[{"type":"gap","title":"Must or have to?","sub":"Fill each gap with the correct form of must or have to.","items":[{"answer":"must/have to","before":"You ","after":" try this cake - it's amazing!"},{"answer":"have to","before":"I ","after":" be at the airport by six. (external rule)"},{"answer":"has to","before":"She ","after":" take this medication every day."},{"answer":"must","before":"You ","after":" see this film - it's incredible."},{"answer":"had to","before":"We ","after":" wait two hours for the bus yesterday."},{"answer":"have to","before":"Do you ","after":" work on weekends?"},{"answer":"has to","before":"He ","after":" wear a uniform at work."},{"answer":"must/have to","before":"I ","after":" remember to call my mother."}]},{"type":"gap","title":"Mustn't or don't have to?","sub":"Fill each gap - prohibition (mustn't) or not necessary (don't/doesn't have to)?","items":[{"answer":"mustn't","before":"You ","after":" smoke in this building. (prohibited)"},{"answer":"don't have to","before":"You ","after":" wear a tie - it's casual. (not necessary)"},{"answer":"mustn't","before":"Students ","after":" use phones during the exam. (prohibited)"},{"answer":"doesn't have to","before":"She ","after":" cook tonight - we're going out. (not necessary)"},{"answer":"mustn't","before":"You ","after":" tell anyone - it's a secret. (prohibited)"},{"answer":"don't have to","before":"You ","after":" pay now - you can pay later. (not necessary)"}]},{"type":"mc","title":"Choose the correct form","sub":"Choose must, mustn't, have to, or don't have to.","items":[{"q":"The sign says: No entry. You _____ go in there.","opts":["don't have to","must","mustn't","have to"],"answer":"mustn't","explanation":"Mustn't = it is prohibited."},{"q":"It's Sunday - I _____ get up early.","opts":["mustn't","must","don't have to","had to"],"answer":"don't have to","explanation":"Don't have to = not necessary."},{"q":"I _____ renew my passport before the trip. It expires next month.","opts":["must","mustn't","don't have to","should to"],"answer":"must","explanation":"Personal strong necessity - must."},{"q":"She _____ be at the office at 9 - it's company policy.","opts":["must","has to","mustn't","should"],"answer":"has to","explanation":"External rule/policy - has to."}]}]},{"id":"adverbsfreq","title":"Adverbs of frequency","subtitle":"always, usually, often, sometimes, never","intro":"How often? These adverbs tell your listener how frequently something happens.","desc":"Adverbs of frequency are easy to understand but students often put them in the wrong position in the sentence.","tip":"Position is the whole game: frequency adverbs go <strong>before the main verb<\/strong> but <strong>after the verb to be<\/strong>. So it's <em>\"I always eat breakfast\"<\/em> but <em>\"I am always tired on Mondays.\"<\/em>","explanation":"<p>Adverbs of frequency say <strong>how often<\/strong> something happens. The meaning is easy - the difficulty is <strong>position<\/strong>.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Before the main verb:<\/strong> I <em>always<\/em> have breakfast. &nbsp;She <em>never<\/em> eats meat. &nbsp;We <em>often<\/em> go out.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>After the verb to be (am/is/are/was/were):<\/strong> She <em>is always<\/em> late. &nbsp;He <em>was never<\/em> happy. - The opposite of rule 1, and where most mistakes happen.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>In negatives - between auxiliary and main verb:<\/strong> I <em>don't usually<\/em> drink coffee. (<em>I usually don't<\/em> is also possible, but this position is more natural.)<\/div><\/div>\n<div class=\"note\"><em>Sometimes, usually<\/em> and <em>often<\/em> can also open a sentence for emphasis - <em>\"Sometimes I regret it\"<\/em> - but the mid-sentence spot is always safe for every frequency adverb.<\/div>","table":{"headers":["Adverb","Rough frequency","Example sentence"],"rows":[["always","100% - every time","I always have coffee in the morning."],["usually / normally","~80% - most of the time","She usually walks to work."],["often / frequently","~60% - more often than not","We often eat out at the weekend."],["sometimes","~40% - roughly half the time","I sometimes work late."],["occasionally","~20-30%","He occasionally misses class."],["rarely / seldom","~10%","She rarely complains."],["hardly ever","~5% - close to never","I hardly ever watch TV."],["never","0% - not once","I never eat fast food."],["Rule: with to be","AFTER am/is/are/was/were","She is always tired. / He was never happy."],["Rule: with other verbs","BEFORE the main verb","I always check my email. / She never eats meat."],["Rule: in negatives","between auxiliary and verb","I don't usually drink coffee late."]]},"examples":[{"type":"pos","eng":"I always check my email first thing.","note":"Before the main verb (check)."},{"type":"pos","eng":"She is usually tired on Mondays.","note":"After to be (is)."},{"type":"pos","eng":"We often eat out at the weekend.","note":"Before the main verb (eat)."},{"type":"neg","eng":"I don't usually drink coffee in the evening.","note":"Between don't and the main verb."}],"errors":[{"bad":"I go always to the gym on Mondays.","good":"I always go to the gym on Mondays.","reason":"Adverbs of frequency go before the main verb, not after it."},{"bad":"He never is happy.","good":"He is never happy.","reason":"After to be - never comes after is/am/are/was/were."},{"bad":"She is often arriving late.","good":"She often arrives late.","reason":"Adverbs of frequency go with the simple form, not continuous."}],"realUse":[],"exercises":[{"type":"gap","title":"Position of adverbs of frequency","sub":"Add the adverb in brackets in the correct position.","items":[{"answer":"always","before":"always: I ","after":" have coffee in the morning."},{"answer":"usually","before":"usually: She is ","after":" late."},{"answer":"often","before":"often: We ","after":" go out at the weekend."},{"answer":"never","before":"never: He is ","after":" happy."},{"answer":"sometimes","before":"sometimes: They ","after":" eat out."},{"answer":"rarely","before":"rarely: She ","after":" complains."}]},{"type":"mc","title":"Choose the correct position","sub":"Where does the adverb go?","items":[{"q":"I ___ eat breakfast before 7am. (always)","opts":["always eat","eat always","am always eating","always am eating"],"answer":"always eat","explanation":"Before the main verb (eat)."},{"q":"She ___ late for meetings. (is / never)","opts":["never is","is never","is always","never are"],"answer":"is never","explanation":"After the verb to be: is never."},{"q":"They ___ to the cinema. (go / sometimes)","opts":["sometimes go","go sometimes","sometimes goes","goes sometimes"],"answer":"sometimes go","explanation":"Before the main verb (go)."},{"q":"Do you ___ exercise? (often)","opts":["often","often do","do often","does often"],"answer":"often","explanation":"In questions, the adverb comes after the subject."}]},{"type":"categorise","title":"How frequent?","sub":"Click an adverb, then click the correct column.","categories":[{"name":"High frequency (60-100%)","items":["always","usually","normally","often","frequently"]},{"name":"Medium frequency (~40%)","items":["sometimes","occasionally"]},{"name":"Low frequency (0-20%)","items":["rarely","seldom","hardly ever","never"]}]}]},{"id":"relativeclauses","title":"Relative clauses","subtitle":"who, which, that","intro":"<div style=\"margin-bottom:8px\"><span style=\"display:inline-block;background:#E8EEFF;color:#2176FF;font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 10px;border-radius:999px\">Partly beyond A2 Key</span></div>Adding information about a noun with who, which and that - the start of longer, richer sentences. Note: who, which and that are A2 Key, while whose and where here are a B1 step up.","desc":"Relative clauses allow you to add information about a person or thing without starting a new sentence. They make speech and writing much more fluent.","tip":"The decision I get students to make first is <strong>who vs which<\/strong>: <em>who<\/em> for people, <em>which<\/em> for things, and <em>that<\/em> can stand in for either. At A2, keep your focus on defining clauses, where the extra information is essential to say which person or thing you mean.","explanation":"<p>A relative clause adds information about a noun - attached directly, without starting a new sentence. It makes sentences flow naturally instead of sounding choppy.<\/p>\n<p><strong>Choosing the right pronoun:<\/strong><\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>who<\/strong> - for people. <em>\"The teacher who helped me.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>which<\/strong> - for things and animals. <em>\"The book which I recommended.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>that<\/strong> - for both people and things (in defining clauses). <em>\"The man that I met.\"<\/em> &nbsp;/&nbsp; <em>\"The film that won.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>where<\/strong> - for places. <em>\"The city where I grew up.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>whose<\/strong> - for possession. <em>\"The student whose essay won\"<\/em> = the student's essay won.<\/div><\/div>\n<div class=\"note\"><strong>Don't repeat the subject pronoun inside the clause:<\/strong><br><em>\"The house where I grew up <u>it<\/u> is old.\"<\/em> - drop the <em>it<\/em>; the relative word has already taken its place.<\/div>","table":{"headers":["Pronoun","Used for","Example","Can use 'that' instead?"],"rows":[["who","people","the teacher who helped me","yes - 'the teacher that helped me'"],["which","things / animals","the book which I lent you","yes - 'the book that I lent you'"],["that","people or things (defining)","the man that I met / the film that won"," - "],["where","places","the café where we met","no"],["whose","possession - who something belongs to","the student whose essay won","no"],["when","points in time","the day when I arrived","sometimes"],["Rule: no repeated subject"," - ","The house where I grew up is old. ✓","NOT: The house where I grew up it is old. ✗"]]},"examples":[{"type":"pos","eng":"She's the teacher who changed my life.","note":"Who for a person."},{"type":"pos","eng":"That's the film which won the Oscar.","note":"Which for a thing."},{"type":"pos","eng":"This is the café where we first met.","note":"Where for a place."},{"type":"pos","eng":"I have a friend whose father is a doctor.","note":"Whose = possession."}],"errors":[{"bad":"She's the woman which called.","good":"She's the woman who called.","reason":"Who for people, which for things."},{"bad":"That's the film who won the award.","good":"That's the film which won the award.","reason":"Which for things, who for people."},{"bad":"The house where I grew up it is in the north.","good":"The house where I grew up is in the north.","reason":"Don't repeat the subject - the relative clause replaces it."}],"realUse":[],"exercises":[{"type":"gap","title":"Who, which, where, or whose?","sub":"Fill each gap with who, which, where, or whose.","items":[{"answer":"who","before":"She's the teacher ","after":" helped me most."},{"answer":"which/that","before":"That's the film ","after":" won the Oscar."},{"answer":"where","before":"This is the café ","after":" we first met."},{"answer":"whose","before":"He's the student ","after":" work was the best."},{"answer":"who","before":"Do you know the man ","after":" called this morning?"},{"answer":"which/that","before":"I've lost the keys ","after":" you gave me."},{"answer":"where","before":"That's the hotel ","after":" we stayed last year."},{"answer":"who","before":"The woman ","after":" lives next door is a doctor."}]},{"type":"builder","title":"Sentence builder","sub":"Combine the two sentences using a relative clause.","items":[{"words":["the","man","who","called","is","my","brother"],"answer":"the man who called is my brother","context":"A man called. He is my brother."},{"words":["that's","the","book","which","I","recommended"],"answer":"that's the book which I recommended","context":"That's a book. I recommended it."},{"words":["she","works","in","a","hospital","which","is","very","famous"],"answer":"she works in a hospital which is very famous","context":"She works in a hospital. The hospital is very famous."},{"words":["he's","a","teacher","whose","classes","I","love"],"answer":"he's a teacher whose classes I love","context":"He's a teacher. I love his classes."},{"words":["that's","the","city","where","I","was","born"],"answer":"that's the city where I was born","context":"That's a city. I was born there."}]},{"type":"mc","title":"Who, which, that, or where?","sub":"Choose the correct relative pronoun.","items":[{"q":"The man _____ I spoke to was very helpful.","opts":["which","whose","who","where"],"answer":"who","explanation":"The man is a person - who or that."},{"q":"The hotel _____ we stayed was beautiful.","opts":["which","who","that","where"],"answer":"where","explanation":"A place - where."},{"q":"I bought a book _____ explains everything clearly.","opts":["who","whose","which","where"],"answer":"which","explanation":"A book is a thing - which or that."},{"q":"She's the student _____ got the highest mark.","opts":["which","whose","where","who"],"answer":"who","explanation":"A student is a person - who or that."}]}]},{"id":"conjunctions","title":"Conjunctions","subtitle":"because, so, but, although, when, if","intro":"<div style=\"margin-bottom:8px\"><span style=\"display:inline-block;background:#E8EEFF;color:#2176FF;font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 10px;border-radius:999px\">Partly beyond A2 Key</span></div>Joining ideas together so your English flows in lon
