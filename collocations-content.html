<html lang="en">
<head>
<script src="lock.js"></script>

<base target="_top">
<meta charset="UTF-8">

<title>Collocations - johnplusenglish</title>
<meta name="description" content="252 high-frequency English collocations organised by type and topic. Browse, study and search them by type and topic.">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sun:#FFB347;--sky:#2176FF;--sky-light:#E8EEFF;--sea:#1DD3B0;--coral:#FF6B6B;--lavender:#9B72CF;--mint:#5DDEA0;--sand:#FFF5E6;--cream:#F7F6F3;--ink:#2D3047;--muted:#7A7D8E;--border:#E8E5DF;--card:#fff;--radius:14px;--font-display:'Outfit',sans-serif;--font-body:'Outfit',sans-serif;--bg:#F7F6F3;--bg-card:#FFFFFF;--text-primary:#2D3047;--text-secondary:#7A7D8E;--text-muted:#7A7D8E;--accent-teal:#1DD3B0;--accent-coral:#FF6B6B;--accent-amber:#FFB347;--accent-violet:#9B72CF;--accent-green:#5DDEA0;--accent-blue:#2176FF;--accent-pink:#D96BA0;--accent-navy:#2D3047;--highlight-bg:#E8F2FD;--tab-active:#2176FF;--sidebar-active-bg:#2176FF;--sidebar-active-text:#FFFFFF;--shadow-sm:0 1px 3px rgba(45,48,71,0.06);--shadow-md:0 4px 12px rgba(45,48,71,0.08)}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth;overflow-y:scroll;overflow-x:hidden}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}

.topnav{position:fixed;top:0;left:0;right:0;height:52px;z-index:200;background:rgba(255,252,247,.88);backdrop-filter:blur(16px);border-bottom:1.5px solid #E8E5DF;padding:0 2rem;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Outfit',sans-serif;font-size:1.3rem;color:#2D3047;text-decoration:none;font-weight:800;letter-spacing:-.02em}
.nav-logo span{color:#2563EB}
.topnav-links{display:flex;gap:1.25rem;align-items:center}
.topnav-links a{font-size:.8rem;font-weight:600;color:#7A7D8E;text-decoration:none;transition:color .2s}
.topnav-links a:hover{color:#2176FF}
@media(max-width:640px){.topnav{padding:0 1rem}.topnav-links{gap:1rem}.topnav-links a{font-size:.75rem}.nav-logo{font-size:1.15rem}}

.page-header{padding:5.5rem 2rem 4rem;max-width:960px;margin:0 auto;position:relative;z-index:1}
.back-link{display:inline-flex;align-items:center;gap:.5rem;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:600;color:#7A7D8E;text-decoration:none;margin-bottom:1.25rem;transition:color .2s}
.back-link:hover{color:var(--text-primary)}
.category-label{font-family:Outfit,sans-serif;font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin-bottom:10px}
.page-title{font-family:'Outfit',sans-serif;font-size:clamp(2rem,5vw,3rem);font-weight:900;color:var(--ink);line-height:1.1;margin-bottom:12px}
.page-subtitle{font-family:'Outfit',sans-serif;font-size:1.05rem;color:var(--muted);font-weight:400;margin-bottom:36px;max-width:640px;line-height:1.7}

.page-container{max-width:960px;margin:0 auto;padding:0 2rem 4rem;position:relative;z-index:1}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:36px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 22px;font-size:.92rem;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .2s,border-color .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font-body)}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--tab-active);border-bottom-color:var(--tab-active)}
.tab-content{display:none}
.tab-content.active{display:block}
.tab-sep{display:inline-block;width:2.5px;height:20px;background:var(--border);margin:0 12px;align-self:center;flex-shrink:0;border-radius:2px}

.guide-body{padding:1.5rem 2rem 2rem;max-width:760px}
.guide-body h2{font-family:var(--font-display);font-size:1.65rem;font-weight:800;color:var(--text-primary);margin-bottom:16px;line-height:1.25}
.guide-body h3{font-family:var(--font-display);font-size:1.25rem;font-weight:700;color:var(--text-primary);margin-top:36px;margin-bottom:12px;line-height:1.3}
.guide-body p{font-size:1.01rem;color:var(--text-secondary);margin-bottom:16px;line-height:1.72}
.guide-body p strong{color:var(--text-primary);font-weight:700}

.example-box{background:var(--highlight-bg);border-radius:10px;padding:24px 28px;margin:20px 0 28px}
.example-box p{font-size:.98rem;color:var(--text-primary);margin-bottom:8px;line-height:1.75}
.example-box p:last-child{margin-bottom:0}
.example-box .highlight{font-weight:700;color:var(--accent-blue)}
.example-box .highlight-coral{font-weight:700;color:var(--accent-coral)}

.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0 28px}
.type-card{border:1px solid var(--border);border-radius:10px;padding:20px 22px;background:var(--bg-card);transition:box-shadow .2s}
.type-card:hover{box-shadow:var(--shadow-md)}
.type-card-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.type-card p{font-size:.93rem;margin-bottom:6px;color:var(--text-secondary)}
.type-card .example-sentence{font-size:.91rem;color:var(--text-primary);font-style:italic;margin-top:8px;margin-bottom:0}

.tip-callout{display:flex;gap:14px;background:var(--cream);border-radius:10px;padding:18px 22px;margin:24px 0}
.tip-callout .tip-icon{font-size:1.2rem;line-height:1.5}
.tip-callout p{font-size:.95rem;color:var(--text-secondary);margin-bottom:0}

.pv-print-btn{margin-left:auto;font-family:var(--font-body);font-size:.88rem;font-weight:600;padding:.5rem 1rem;border:1.5px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.5rem}
.pv-print-btn:hover{border-color:var(--text-primary);background:var(--cream)}
.pv-print-btn svg{flex-shrink:0}

@media(max-width:800px){
  .page-header{padding:5.5rem 1.25rem 0}
  .page-container{padding:0 1.25rem 3rem}
  .type-grid{grid-template-columns:1fr}
}
@media print{
  .topnav{display:none !important}.pv-print-btn{display:none!important}
  nav,.page-header,.tabs{display:none !important}
  .tab-content,.tab-content.active{display:none !important}
  .page-container{padding:0 !important;max-width:none !important}
  #printArea{display:block !important}
  .print-header{margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:2px solid #000}
  .print-header h1{font-family:'Outfit',Georgia,serif;font-size:1.6rem;font-weight:400;margin-bottom:.25rem;color:#000}
  .print-header .meta{font-family:Outfit,sans-serif;font-size:.72rem;color:#555;letter-spacing:.05em}
  .print-cat-header{font-family:'Outfit',Georgia,serif;font-size:1.25rem;font-weight:400;margin:1.25rem 0 .5rem;padding-bottom:.25rem;border-bottom:1px solid #999;color:#000;break-after:avoid;page-break-after:avoid}
  .print-cat-header:first-child{margin-top:0}
  .print-entry{break-inside:avoid;page-break-inside:avoid;padding:.5rem 0;border-bottom:1px dotted #ccc;font-family:'Outfit',sans-serif}
  .print-entry:last-child{border-bottom:none}
  .print-phrase{font-weight:800;font-size:.95rem;color:#000;display:inline}
  .print-def{font-style:italic;color:#333;font-size:.85rem;margin-top:.25rem;line-height:1.4}
  .print-ex{color:#000;font-size:.85rem;margin-top:.25rem;line-height:1.4}
  .print-ex b{font-weight:800}
  @page{margin:1.5cm;size:A4}
}
/* ── Top nav ── */
.topnav{position:fixed;top:0;left:0;right:0;height:52px;z-index:200;background:rgba(247,246,243,.88);backdrop-filter:blur(16px);border-bottom:1.5px solid #E8E5DF;padding:0 2rem;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.nav-logo span{color:#2563EB}
.topnav-links{display:flex;gap:1.25rem;align-items:center}
.topnav-links a{font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s}
.topnav-links a:hover{color:#2176FF}

/* ── Print modal ── */
.col-print-overlay{display:none;position:fixed;inset:0;background:rgba(45,48,71,.4);z-index:300;align-items:center;justify-content:center}
.col-print-overlay.show{display:flex}
.col-print-modal{background:var(--bg-card,#fff);border-radius:16px;max-width:500px;width:92%;padding:2rem;box-shadow:0 20px 60px rgba(45,48,71,.25);animation:fadeIn .25s ease}
.col-pm-title{font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:.25rem}
.col-pm-sub{font-size:.85rem;color:var(--muted,#7A7D8E);margin-bottom:1.25rem}
.col-pm-section{margin-bottom:1rem}
.col-pm-label{font-family:Outfit,sans-serif;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted,#7A7D8E);margin-bottom:.5rem;font-weight:600}
.col-pm-opts{display:flex;flex-direction:column;gap:.5rem}
.col-pm-opt{display:flex;align-items:center;gap:.75rem;padding:.5rem .75rem;border:1.5px solid var(--border,#E8E5DF);border-radius:10px;cursor:pointer;transition:all .15s;background:var(--cream,#F7F6F3)}
.col-pm-opt:hover{border-color:var(--sky,#2176FF)}
.col-pm-opt input[type=radio]{accent-color:var(--sky,#2176FF);cursor:pointer;margin:0}
.col-pm-opt-text{font-size:.88rem;font-weight:600;color:var(--ink,#2D3047)}
.col-pm-opt-desc{font-size:.76rem;color:var(--muted,#7A7D8E);font-weight:400}
.col-pm-check{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;cursor:pointer}
.col-pm-check input[type=checkbox]{accent-color:var(--sky,#2176FF);cursor:pointer}
.col-pm-check span{font-size:.85rem;color:var(--ink,#2D3047)}
.col-pm-type-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.col-pm-type-pill{font-family:'Outfit',sans-serif;font-size:.75rem;font-weight:600;padding:.25rem .75rem;border-radius:10px;border:1.5px solid var(--border,#E8E5DF);background:var(--card,#fff);color:var(--muted,#7A7D8E);cursor:pointer;transition:all .15s}
.col-pm-type-pill:hover{border-color:var(--sky,#2176FF);color:var(--sky,#2176FF)}
.col-pm-type-pill.active{background:var(--text-primary,#2D3047);border-color:var(--text-primary,#2D3047);color:#fff}
.col-pm-footer{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border,#E8E5DF)}
.col-pm-btn{font-family:'Outfit',sans-serif;font-weight:600;font-size:.85rem;padding:.5rem 1.25rem;border-radius:10px;cursor:pointer;border:1.5px solid var(--border,#E8E5DF);background:var(--card,#fff);color:var(--ink,#2D3047);transition:all .15s}
.col-pm-btn:hover{border-color:var(--ink,#2D3047)}
.col-pm-btn-go{background:var(--sky,#2176FF);color:#fff;border-color:var(--sky,#2176FF)}
.col-pm-btn-go:hover{background:#1a5fd4}
/* ── WF-style hero ── */
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border,#E8E5DF) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}
.page-header{padding:2rem 2rem 1rem;max-width:960px;margin:0 auto;position:relative;z-index:1}
.topic-hero{display:flex;align-items:flex-start;gap:1.25rem}
.topic-icon{width:52px;height:52px;border-radius:12px;background:color-mix(in srgb, #2D3047 8%, #fff);color:#2D3047;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topic-icon svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor}
.page-header h1{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-.01em;line-height:1.1}
.tabs-wrap{max-width:960px;margin:0 auto;padding:0 2rem;position:relative;z-index:1}
.tabs{display:flex;gap:4px;row-gap:4px;border-bottom:none;position:relative;margin-bottom:1.5rem;align-items:flex-end;flex-wrap:wrap;padding-top:8px}
.tabs::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.tab{position:relative;font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:700;padding:.5rem 1.25rem;color:var(--muted);cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1.5px solid var(--border);border-radius:12px 12px 0 0;transition:background .18s,color .18s,box-shadow .18s,border-color .18s}
.tab:not(.active):hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.tab:not(.active):focus-visible{outline:2px solid var(--accent, #2176FF);outline-offset:2px}
.tab.active{outline:none;background:var(--cream);border-color:var(--tab-accent,var(--accent, #2176FF));border-bottom:none!important;color:var(--tab-accent,var(--accent, #2176FF));padding-top:calc(.5rem + 3px);box-shadow:0 -3px 10px rgba(45,48,71,.06);z-index:2}

/* ============ PICKER: collapsible menu + pane + ledger (Word Banks / Fixed Expressions / Prepositions shape) ============ */
.picker{display:grid;grid-template-columns:300px 1fr;gap:1.25rem;align-items:start;transition:grid-template-columns .22s ease}
.picker.sb-collapsed{grid-template-columns:52px 1fr}
.sb{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-sm);position:sticky;top:1rem;max-height:calc(100vh - 2rem)}
.sb-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer}
.sb.collapsed .sb-head{border-bottom:none;justify-content:center;padding:.75rem .5rem}
.sb-label{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb.collapsed .sb-label{display:none}
.sb-toggle{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:all .15s;flex-shrink:0}
.sb-toggle:hover{border-color:var(--accent);color:var(--accent)}
.sb-toggle svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;transition:transform .2s ease}
.sb.collapsed .sb-toggle svg{transform:rotate(180deg)}
.sb.collapsed .sb-scroll,.sb.collapsed .sb-foot{display:none}
.sb-scroll{flex:1;min-height:0;overflow-y:auto;padding:.4rem .5rem .75rem}
.sb-scroll::-webkit-scrollbar{width:4px}
.sb-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sb-foot{padding:.55rem .9rem;border-top:1px solid var(--border);font-size:.66rem;color:var(--muted)}
.cat{margin-bottom:.4rem}
.cat-toggle{-webkit-appearance:none;appearance:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:.5rem;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--catdot);padding:.6rem .7rem;text-align:left;border-radius:8px;transition:background .15s}
.cat-toggle:hover{background:var(--cream)}
.cat-chev{font-size:.7rem;flex-shrink:0;color:var(--muted);transition:transform .18s}
.cat.shut .cat-chev{transform:rotate(-90deg)}
.cat.shut .cat-rows{display:none}
.cat-rows{background:var(--cream);border-radius:10px;padding:.25rem;margin-top:.15rem}
.bk{-webkit-appearance:none;appearance:none;display:flex;align-items:center;gap:.7rem;width:100%;padding:.55rem .8rem;text-align:left;background:none;border:none;border-radius:6px;box-shadow:none;cursor:pointer;color:var(--ink);font-family:inherit;font-size:.84rem;font-weight:700;line-height:1.25;transition:background .12s ease,box-shadow .12s ease,color .12s ease}
.bk:hover{background:#fff}
.bk.on{background:#fff;box-shadow:var(--shadow-sm)}
.bk.on .bk-name{color:var(--catdot)}
.bk-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk-all{margin-bottom:.5rem}
.bk-all:hover,.bk-all.on{background:var(--cream);box-shadow:none}
.pane{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);min-width:0;overflow:hidden;box-shadow:var(--shadow-sm)}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.25rem;border-bottom:1.5px solid var(--border)}
.pane-titles{min-width:0}
.pane-head h2{font-size:1.25rem;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.2;font-family:'Outfit',sans-serif;color:var(--ink)}
.pane-head p{font-size:.74rem;color:var(--muted);margin:.15rem 0 0}
.pane-body{padding:1rem 1.25rem 1.5rem}
.pane-print{font-family:'Outfit',sans-serif;font-size:.75rem;font-weight:700;padding:.42rem .75rem;border:1.5px solid var(--border);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.5rem;flex-shrink:0}
.pane-print:hover{border-color:var(--ink);background:var(--ink);color:var(--cream)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem .85rem;flex-wrap:wrap;margin-bottom:.85rem}
.bar-filters{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;flex:1;min-width:0}
.sel{font-family:inherit;font-size:.82rem;font-weight:600;background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:.5rem .6rem;color:var(--ink);cursor:pointer;min-height:38px}
.sel:hover{border-color:var(--ink)}
.sel:focus{outline:none;border-color:var(--accent)}
.sel.set{border-color:var(--accent);color:var(--accent)}
.search{position:relative;flex:1;min-width:180px;max-width:380px}
.search input{width:100%;font-family:inherit;font-size:.82rem;font-weight:500;background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:.5rem .75rem .5rem 2rem;color:var(--ink);min-height:38px;transition:border-color .15s}
.search input::placeholder{color:var(--muted)}
.search input:hover{border-color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);width:13px;height:13px;fill:none;stroke:var(--muted);stroke-width:2.2;pointer-events:none}
.search input:focus + svg{stroke:var(--accent)}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:.7rem;font-size:.68rem;color:var(--muted);white-space:nowrap;margin:-.35rem 0 .6rem}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.fdot{width:6px;height:6px;border-radius:50%;display:inline-block}
.fdot.t1{background:var(--ink)}.fdot.t2{background:var(--muted)}.fdot.t3{background:var(--border)}
.alpha-strip{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:.15rem;padding:.45rem .25rem;margin-bottom:.4rem;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--border)}
.alpha-strip a{font-size:.72rem;font-weight:700;color:var(--muted);text-decoration:none;width:1.6rem;height:1.6rem;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .12s,color .12s}
.alpha-strip a:hover{background:var(--accent-light);color:var(--accent)}
.sheet{display:grid;grid-template-columns:1fr;gap:0;--tw:12rem}
.gh{grid-column:1/-1;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);padding:.95rem .3rem .3rem;border-bottom:1.5px solid var(--border);margin-bottom:.1rem;scroll-margin-top:3rem}
.gh:first-child{padding-top:.35rem}
.nomatch{padding:2.5rem;text-align:center;color:var(--muted);font-size:.85rem}
/* single-column aligned ledger: term | definition, example beneath on click.
   --tw is set at runtime from the real data; rows wider than it take .wide */
.lr{display:grid;grid-template-columns:var(--tw) 1fr;gap:0 1.2rem;align-items:baseline;padding:.5rem .4rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.lr:hover,.lr.open{background:var(--cream)}
.lr.wide{grid-template-columns:1fr}
.lr.wide .lr-d{margin-top:.1rem}
.lr-h{font-weight:700;font-size:.85rem;line-height:1.35;color:var(--ink);white-space:nowrap}

<template id="guideSecTpl">
<div data-section="what-are-collocations">
          <p>A <strong>collocation</strong> is a combination of words that naturally go together in English. Native speakers instinctively choose these combinations - they sound &ldquo;right&rdquo; even though the individual words could pair differently.</p>
          <div class="example-box">
            <p>&check; <span class="highlight">make</span> a decision &nbsp; &cross; <span class="highlight-coral">do</span> a decision</p>
            <p>&check; <span class="highlight">heavy</span> rain &nbsp; &cross; <span class="highlight-coral">strong</span> rain</p>
            <p>&check; <span class="highlight">fast</span> food &nbsp; &cross; <span class="highlight-coral">quick</span> food</p>
          </div>
          <p>Unlike idioms, collocations are <strong>literal</strong> - the meaning is clear from the individual words. The challenge is knowing <em>which</em> words go together. You can guess what &ldquo;heavy rain&rdquo; means, but you need to know that English doesn't say &ldquo;strong rain&rdquo;.</p>
          <h3>Collocations vs idioms vs phrasal verbs</h3>
          <p><strong>Collocations</strong> (<em>make a decision</em>, <em>heavy traffic</em>) - literal meaning, but the word combination is fixed. The focus is on <em>which</em> words pair naturally.</p>
          <p><strong>Idioms</strong> (<em>break the ice</em>, <em>spill the beans</em>) - non-literal meaning. You can't guess the meaning from the words. These have their own dedicated page on this site.</p>
          <p><strong>Phrasal verbs</strong> (<em>give up</em>, <em>look after</em>) - verb + particle combinations where the particle changes the verb's meaning. Also covered separately.</p>
          <div class="tip-callout">
            <p><strong>Key insight:</strong> Collocations are about <em>naturalness</em>. A non-native speaker might say &ldquo;do a mistake&rdquo; and be understood, but it sounds wrong to native ears. Learning collocations is what makes your English sound polished.</p>
          </div>
        
</div>
<div data-section="types">
          <p>Collocations are grouped by the grammatical pattern of the words involved. Here are the five main types covered on this site:</p>
          <div class="type-grid">
            <div class="type-card">
              <div class="type-card-label" style="color:var(--ink)">VERB + NOUN</div>
              <p>The most common type. A specific verb pairs with a noun.</p>
              <p class="example-sentence">make a mistake &middot; take a photo &middot; pay attention</p>
            </div>
            <div class="type-card">
              <div class="type-card-label" style="color:var(--ink)">ADJECTIVE + NOUN</div>
              <p>A particular adjective naturally modifies a noun.</p>
              <p class="example-sentence">heavy traffic &middot; strong coffee &middot; bitter cold</p>
            </div>
            <div class="type-card">
              <div class="type-card-label" style="color:var(--ink)">ADVERB + ADJECTIVE</div>
              <p>An adverb intensifies or modifies an adjective.</p>
              <p class="example-sentence">deeply concerned &middot; highly unlikely &middot; perfectly clear</p>
            </div>
            <div class="type-card">
              <div class="type-card-label" style="color:var(--ink)">ADVERB + VERB</div>
              <p>An adverb modifies a verb in a fixed way.</p>
              <p class="example-sentence">strongly recommend &middot; firmly believe &middot; flatly refuse</p>
            </div>
            <div class="type-card">
              <div class="type-card-label" style="color:var(--ink)">NOUN + NOUN</div>
              <p>Two nouns combine as a fixed pair or compound.</p>
              <p class="example-sentence">traffic jam &middot; bus stop &middot; income tax</p>
            </div>

          </div>
        
</div>
<div data-section="why-matter">
          <p>Collocations are the difference between <em>correct</em> English and <em>natural</em> English. At B2 and above, the grammar is mostly there - but word choice still sounds off. That's collocations.</p>
          <h3>1. They make you sound natural</h3>
          <p>Native speakers don't think about collocations - they just <em>feel</em> right. When you use them correctly, your English sounds effortless rather than translated.</p>
          <h3>2. They appear in exams</h3>
          <p>Cambridge B2, C1, and C2 exams test collocations heavily, especially in Part 1 (multiple choice) and Part 4 (key word transformations). The wrong collocation costs marks even when the meaning is clear.</p>
          <h3>3. They're unpredictable</h3>
          <p>There's no rule that explains why we say <em>make</em> a decision but <em>take</em> a risk. Why <em>heavy</em> rain but <em>strong</em> wind? Why <em>deeply</em> concerned but <em>highly</em> unlikely? You have to learn them as fixed combinations.</p>
          <div class="tip-callout">
            <p><strong>L1 interference:</strong> Your first language has its own collocations, and they rarely translate directly. Spanish speakers say <em>do a question</em> (hacer una pregunta) instead of <em>ask a question</em>. These errors are hard to spot because they feel natural in your language.</p>
          </div>
        
</div>
<div data-section="strong-weak">
          <p>Not all collocations are equally fixed. Some are <strong>strong</strong> (nearly impossible to change), while others are <strong>weak</strong> (more flexible).</p>
          <h3>Strong collocations</h3>
          <p>These are virtually fixed. The words almost always appear together, and substituting a synonym sounds wrong:</p>
          <div class="example-box">
            <p><span class="highlight">make</span> a decision &nbsp;(not <span class="highlight-coral">do</span> a decision)</p>
            <p><span class="highlight">heavy</span> rain &nbsp;(not <span class="highlight-coral">big</span> rain)</p>
            <p><span class="highlight">bitterly</span> disappointed &nbsp;(not <span class="highlight-coral">strongly</span> disappointed)</p>
          </div>
          <h3>Weak collocations</h3>
          <p>These are more flexible - several words can fit, though one or two are preferred:</p>
          <div class="example-box">
            <p>a <span class="highlight">big</span> / large / huge / great improvement</p>
            <p><span class="highlight">very</span> / extremely / really happy</p>
          </div>
          <p>Focus your energy on <strong>strong collocations</strong>. These are the ones that sound noticeably wrong when you get them wrong, and they're the ones exams test.</p>
        
</div>
<div data-section="mistakes">
          <p>Most collocation errors come from three sources:</p>
          <h3>1. Direct translation from L1</h3>
          <div class="example-box">
            <p>&cross; <span class="highlight-coral">do</span> a mistake &nbsp;&rarr;&nbsp; &check; <span class="highlight">make</span> a mistake</p>
            <p>&cross; <span class="highlight-coral">say</span> a lie &nbsp;&rarr;&nbsp; &check; <span class="highlight">tell</span> a lie</p>
            <p>&cross; <span class="highlight-coral">win</span> money &nbsp;&rarr;&nbsp; &check; <span class="highlight">earn</span> / <span class="highlight">make</span> money</p>
          </div>
          <h3>2. Confusing similar verbs</h3>
          <div class="example-box">
            <p>&cross; <span class="highlight-coral">do</span> a decision &nbsp;&rarr;&nbsp; &check; <span class="highlight">make</span> a decision</p>
            <p>&cross; <span class="highlight-coral">make</span> homework &nbsp;&rarr;&nbsp; &check; <span class="highlight">do</span> homework</p>
            <p>&cross; <span class="highlight-coral">make</span> an exam &nbsp;&rarr;&nbsp; &check; <span class="highlight">take</span> / <span class="highlight">sit</span> an exam</p>
          </div>
          <h3>3. Wrong intensifier</h3>
          <div class="example-box">
            <p>&cross; <span class="highlight-coral">very</span> recommend &nbsp;&rarr;&nbsp; &check; <span class="highlight">strongly</span> / <span class="highlight">highly</span> recommend</p>
            <p>&cross; <span class="highlight-coral">strongly</span> different &nbsp;&rarr;&nbsp; &check; <span class="highlight">completely</span> / <span class="highlight">totally</span> different</p>
          </div>
        
</div>
<div data-section="learning">
          <h3>Learn in chunks, not single words</h3>
          <p>When you learn a new noun, learn the verb or adjective that goes with it. Don't just write <em>decision</em> in your notebook - write <em>make a decision</em>, <em>reach a decision</em>, <em>tough decision</em>.</p>
          <h3>Notice them in the wild</h3>
          <p>When you read or listen to English, underline word combinations rather than individual words. Pay attention to which verbs go with which nouns, which adverbs go with which adjectives.</p>
          <h3>Group by verb</h3>
          <p>A useful approach is to learn all the nouns that go with one verb: <em>make</em> a decision / an effort / progress / a mess / friends / a living / a complaint. This builds a web of associations.</p>
          <h3>How to use this page</h3>
          <p>Browse the collocations by type and topic, search for any you want to focus on, and print a set to study offline.</p>
          <div class="tip-callout">
            <p><strong>Test yourself:</strong> Cover the first word of each collocation and try to produce it from the second word alone. Can you say <em>___ a decision</em>, <em>___ rain</em>, <em>___ recommend</em> without thinking?</p>
          </div>
        
</div>
</template>

var GROUP_COLOR=['#2176FF','#2176FF','#2176FF','#2176FF','#2176FF','#2176FF','#2176FF','#2176FF','#2176FF'];
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
function toggleMenu(tab){
  if(window.matchMedia('(max-width:820px)').matches) return;
  var sb=document.getElementById('sb-'+tab), pk=document.getElementById('picker-'+tab);
  var c=sb.classList.toggle('collapsed'); pk.classList.toggle('sb-collapsed',c);
  try{localStorage.setItem('jpe_col_sb_'+tab+'_collapsed',c?'1':'0')}catch(e){}
}
["guide", "list"].forEach(function(tab){
  var c=false; try{c=localStorage.getItem('jpe_col_sb_'+tab+'_collapsed')==='1'}catch(e){}
  if(c){document.getElementById('sb-'+tab).classList.add('collapsed');document.getElementById('picker-'+tab).classList.add('sb-collapsed')}
});
function scrollPaneIntoView(tab){
  if(!window.matchMedia('(max-width:820px)').matches) return;
  var pane=document.querySelector('#tab-'+tab+' .pane'); if(pane) pane.scrollIntoView({behavior:'smooth',block:'start'});
}
function keepScroll(box,fn){var k=box.scrollTop;fn();box.scrollTop=k}
function measureW(strings,weight,size){
  var p=document.createElement('span');
  p.style.cssText='position:absolute;left:-9999px;top:0;white-space:nowrap;font-family:Outfit,sans-serif;font-weight:'+weight+';font-size:'+size;
  document.body.appendChild(p);
  var m=0; for(var i=0;i<strings.length;i++){p.textContent=strings[i];if(p.offsetWidth>m)m=p.offsetWidth}
  p.parentNode.removeChild(p); return m;
}
// Click a row to reveal its example, accordion-scoped to the surrounding sheet. Delegated, survives re-renders.
document.addEventListener('click',function(ev){
  if(!ev.target||!ev.target.closest) return;
  var row=ev.target.closest('[data-row]'); if(!row) return;
  var was=row.classList.contains('open');
  var sheet=row.closest('.sheet')||document;
  sheet.querySelectorAll('[data-row].open').forEach(function(o){o.classList.remove('open')});
  if(!was) row.classList.add('open');
});
// Letter jumps land instantly: A to W is a very long trip to animate.
document.addEventListener('click',function(ev){
  if(!ev.target||!ev.target.closest) return;
  var a=ev.target.closest('.alpha-strip a[href^="#"]'); if(!a) return;
  var target=document.getElementById(a.getAttribute('href').slice(1)); if(!target) return;
  ev.preventDefault();
  var strip=a.closest('.alpha-strip'), offset=strip?strip.getBoundingClientRect().height:0;
  window.scrollTo({top:target.getBoundingClientRect().top+window.scrollY-offset-6,behavior:'instant'});
});
function renderGroupMenu(boxId, groups, shut, current, allLabel, labelOf, onPick, onToggle, extraRowsHtml){
  var h='<button class="bk bk-all'+(current==='all'?' on':'')+'" data-c="all" style="--catdot:var(--ink)"><span class="bk-name">'+esc(allLabel)+'</span></button>';
  groups.forEach(function(g,gi){
    var isShut=shut.has(g.name);
    h+='<div class="cat'+(isShut?' shut':'')+'" style="--catdot:'+GROUP_COLOR[gi%GROUP_COLOR.length]+'">'
      +'<button class="cat-toggle" data-g="'+esc(g.name)+'">'+esc(g.name)+'<span class="cat-chev">&#9662;</span></button><div class="cat-rows">';
    g.keys.forEach(function(k){
      h+='<button class="bk'+(String(current)===String(k)?' on':'')+'" data-c="'+esc(k)+'"><span class="bk-name">'+esc(labelOf(k))+'</span></button>';
    });
    h+='</div></div>';
  });
  if(extraRowsHtml) h+=extraRowsHtml;
  var box=document.getElementById(boxId);
  keepScroll(box,function(){box.innerHTML=h});
  box.querySelectorAll('.bk').forEach(function(b){b.addEventListener('click',function(){onPick(b.dataset.c)})});
  box.querySelectorAll('.cat-toggle').forEach(function(t){t.addEventListener('click',function(){
    var n=t.dataset.g; shut.has(n)?shut.delete(n):shut.add(n); onToggle();
  })});
}
function groupOf(groups,key){for(var i=0;i<groups.length;i++){if(groups[i].keys.map(String).indexOf(String(key))>-1)return groups[i]}return null}

var GUIDE_GROUPS=[{"name": "Foundations", "items": [{"key": "what-are-collocations", "label": "What Are Collocations?"}, {"key": "types", "label": "Types of Collocations"}, {"key": "why-matter", "label": "Why Do They Matter?"}]}, {"name": "Using them well", "items": [{"key": "strong-weak", "label": "Strong vs Weak"}, {"key": "mistakes", "label": "Common Mistakes"}, {"key": "learning", "label": "Learning Strategies"}]}];
var GUIDE_SECTIONS=[];
GUIDE_GROUPS.forEach(function(g){g.items.forEach(function(it){GUIDE_SECTIONS.push({key:it.key,label:it.label,group:g.name})})});
var guideKey='what-are-collocations';
var guideShut=new Set();
function guideHTML(key){
  var el=document.getElementById('guideSecTpl').content.querySelector('[data-section="'+key+'"]');
  return el?el.innerHTML:'';
}
function renderGuideList(){
  var h='';
  GUIDE_GROUPS.forEach(function(g,gi){
    var shut=guideShut.has(g.name);
    h+='<div class="cat'+(shut?' shut':'')+'" style="--catdot:'+GROUP_COLOR[gi%GROUP_COLOR.length]+'">'
      +'<button class="cat-toggle" data-g="'+esc(g.name)+'">'+esc(g.name)+'<span class="cat-chev">&#9662;</span></button><div class="cat-rows">';
    g.items.forEach(function(it){
      h+='<button class="bk'+(it.key===guideKey?' on':'')+'" data-k="'+it.key+'"><span class="bk-name">'+esc(it.label)+'</span></button>';
    });
    h+='</div></div>';
  });
  var box=document.getElementById('list-guide');
  keepScroll(box,function(){box.innerHTML=h});
  box.querySelectorAll('.bk').forEach(function(b){b.addEventListener('click',function(){goGuide(b.dataset.k)})});
  box.querySelectorAll('.cat-toggle').forEach(function(t){t.addEventListener('click',function(){
    var n=t.dataset.g; guideShut.has(n)?guideShut.delete(n):guideShut.add(n); renderGuideList();
  })});
}
function goGuide(key){
  var idx=GUIDE_SECTIONS.findIndex(function(s){return s.key===key}); if(idx<0) return;
  guideKey=key;
  var sec=GUIDE_SECTIONS[idx];
  guideShut.delete(sec.group);
  renderGuideList();
  document.getElementById('h-guide').textContent=sec.label;
  document.getElementById('sub-guide').textContent='Section '+(idx+1)+' of '+GUIDE_SECTIONS.length+' · '+sec.group;
  var prev=GUIDE_SECTIONS[idx-1], next=GUIDE_SECTIONS[idx+1];
  var html=guideHTML(key)+'<div class="guide-nav">'
    +(prev?'<button class="prev" onclick="goGuide(\''+prev.key+'\')"><span>Previous</span>'+esc(prev.label)+'</button>':'<span></span>')
    +(next?'<button class="next" onclick="goGuide(\''+next.key+'\')"><span>Next</span>'+esc(next.label)+'</button>':'')
    +'</div>';
  document.getElementById('body-guide').innerHTML=html;
  var pane=document.querySelector('#tab-guide .pane');
  if(pane&&document.getElementById('tab-guide').classList.contains('active')){
    var top=pane.getBoundingClientRect().top+window.scrollY-16;
    if(window.scrollY>top) window.scrollTo({top:top,behavior:'instant'});
  }
  scrollPaneIntoView('guide');
}

    w.document.write((idx>0?'<div style="margin-top:2rem;padding-top:1.5rem;border-top:1px solid #eee">':'<div>')+'<h2>'+esc(sec.label)+'</h2>'+guideHTML(key)+'</div>');
  });
  w.document.write('</body></html>');
  w.document.close();
  setTimeout(function(){w.print()},400);
  guidePrintModalClose();
}

// ── LIST ────────────────────────────────────────────────────────────────────
var COL_GROUPS=[{"name": "Verb + noun", "keys": ["v:make +", "v:take +", "v:do +", "v:have +", "v:give +", "v:break +", "v:get +", "v:keep +", "v:catch +", "v:pay +", "v:lose +", "v:raise +", "v:run +", "v:set +", "v:hold +", "v:meet +", "v:reach +", "v:tell +", "v:bear +", "v:come +", "v:face +", "v:launch +", "v:place +", "v:play +", "v:pose +", "v:other"]}, {"name": "Other patterns", "keys": ["t:adjective + noun", "t:adverb + adjective", "t:adverb + verb", "t:noun + noun"]}];
var COL_SINGLE_VERBS=["serve +", "drop +", "cut +", "strike +", "gain +", "broaden +", "hurt +", "waste +", "miss +", "draw +"];   // verbs with only one entry, bundled as "Other verbs"
var COL_TYPE_ABBR={'verb + noun':'V+N','adjective + noun':'ADJ+N','adverb + adjective':'ADV+ADJ','noun + noun':'N+N','adverb + verb':'ADV+V'};
var COL_TYPE_LABEL={'verb + noun':'Verb + noun','adjective + noun':'Adjective + noun','adverb + adjective':'Adverb + adjective','adverb + verb':'Adverb + verb','noun + noun':'Noun + noun'};
var COL_FREQ_LABEL={common:'Common',somewhat:'Somewhat common',less:'Less common'};
var COL_TIER={common:'t1',somewhat:'t2',less:'t3'};
var colCat='all', colTypeFilter='all', colFreq='all', colQ='';
var colShut=new Set(COL_GROUPS.map(function(g){return g.name}));
var colLabel=function(k){
  if(k==='v:other') return 'Other verbs';
  if(k.indexOf('v:')===0) return k.slice(2).replace(/\s*\+\s*$/,'')+' + noun';
  return COL_TYPE_LABEL[k.slice(2)]||k.slice(2);
};
var COL_SORTED=DATA.slice().sort(function(a,b){return a.c.localeCompare(b.c)});
function colInScope(d){
  if(colCat==='all') return true;
  if(colCat==='v:other') return d.t==='verb + noun'&&COL_SINGLE_VERBS.indexOf(d.cat)>-1;
  if(colCat.indexOf('v:')===0) return d.cat===colCat.slice(2);
  return d.t===colCat.slice(2);
}
function renderColList(){renderGroupMenu('list-list',COL_GROUPS,colShut,colCat,'All collocations',colLabel,goColCat,renderColList)}
function goColCat(k){
  colCat=k; colQ='';
  var g=groupOf(COL_GROUPS,k); if(g) colShut.delete(g.name);
  renderColList(); renderColPane(); scrollPaneIntoView('list');
}
function colScope(){return COL_SORTED.filter(colInScope)}
function colMatch(d){
  if(colTypeFilter!=='all'&&d.t!==colTypeFilter) return false;
  if(colFreq!=='all'&&d.freq!==colFreq) return false;
  if(colQ){var q=colQ;if(d.c.toLowerCase().indexOf(q)<0&&d.d.toLowerCase().indexOf(q)<0&&d.e.toLowerCase().indexOf(q)<0) return false}
  return true;
}
function colShown(){return colScope().filter(colMatch)}
function colRow(d){
  return '<div class="lr" data-row><div class="lr-h">'+esc(d.c)+'<span class="lr-tag">'+(COL_TYPE_ABBR[d.t]||d.t)+'</span><span class="fdot '+(COL_TIER[d.freq]||'t3')+'" title="'+(COL_FREQ_LABEL[d.freq]||'')+'"></span></div>'
    +'<div class="lr-d">'+esc(d.d)+'</div><div class="lr-x">'+d.e+'</div></div>';   // examples come pre-bolded in the data
}
var colTermW=null;
function colSizeList(el){
  if(colTermW===null) colTermW=Math.ceil(measureW(DATA.map(function(d){return d.c+'  ADV+ADJ'}),700,'.85rem'))+16;
  el.style.setProperty('--tw',colTermW+'px');
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){colTermW=null;var s=document.getElementById('colSheet');if(s)colSizeList(s)});
var colSearchTimer=null;
function renderColPane(){
  var isAll=colCat==='all', base=colScope();
  document.getElementById('h-list').textContent=isAll?'All collocations':colLabel(colCat);
  var tn={}, fn={}; base.forEach(function(d){tn[d.t]=(tn[d.t]||0)+1;fn[d.freq]=(fn[d.freq]||0)+1});
  var types=Object.keys(COL_TYPE_LABEL).filter(function(t){return tn[t]});
  var g=groupOf(COL_GROUPS,colCat);
  document.getElementById('sub-list').textContent=isAll?base.length+' collocations · '+types.length+' patterns':base.length+' collocations'+(g?' · '+g.name:'');
  if(colTypeFilter!=='all'&&!tn[colTypeFilter]) colTypeFilter='all';
  if(colFreq!=='all'&&!fn[colFreq]) colFreq='all';
  var typeSel=types.length>1?'<select class="sel'+(colTypeFilter!=='all'?' set':'')+'" id="colTypeSel"><option value="all">All patterns ('+base.length+')</option>'
    +types.map(function(t){return '<option value="'+t+'"'+(colTypeFilter===t?' selected':'')+'>'+COL_TYPE_LABEL[t]+' ('+tn[t]+')</option>'}).join('')+'</select>':'';
  document.getElementById('body-list').innerHTML='<div class="bar"><div class="bar-filters">'+typeSel
    +'<select class="sel'+(colFreq!=='all'?' set':'')+'" id="colFreqSel"><option value="all">All frequencies'+(types.length>1?'':' ('+base.length+')')+'</option>'
    +['common','somewhat','less'].filter(function(f){return fn[f]}).map(function(f){return '<option value="'+f+'"'+(colFreq===f?' selected':'')+'>'+COL_FREQ_LABEL[f]+' ('+fn[f]+')</option>'}).join('')
    +'</select>'
    +'<label class="search"><input type="search" id="colSearch" placeholder="'+(isAll?'Search all collocations…':'Search this group…')+'" value="'+esc(colQ)+'" autocomplete="off"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg></label>'
    +'</div></div><div class="legend"><span><i class="fdot t1"></i>common</span><span><i class="fdot t2"></i>somewhat common</span><span><i class="fdot t3"></i>less common</span></div>'
    +'<div id="colStrip"></div><div class="sheet" id="colSheet"></div>';
  var ts=document.getElementById('colTypeSel'); if(ts) ts.addEventListener('change',function(e){colTypeFilter=e.target.value;e.target.classList.toggle('set',colTypeFilter!=='all');renderColSheet()});
  document.getElementById('colFreqSel').addEventListener('change',function(e){colFreq=e.target.value;e.target.classList.toggle('set',colFreq!=='all');renderColSheet()});
  document.getElementById('colSearch').addEventListener('input',function(e){
    clearTimeout(colSearchTimer); var v=e.target.value.trim().toLowerCase();
    colSearchTimer=setTimeout(function(){colQ=v;renderColSheet()},160);
  });
  renderColSheet();
}
function renderColSheet(){
  var list=colShown(), h='', strip='';
  if(!list.length){h='<div class="nomatch">No collocations match.</div>'}
  else if(colCat==='all'){
    var letters={}, order=[];
    list.forEach(function(d){var l=d.c.charAt(0).toUpperCase();if(!letters[l]){letters[l]=[];order.push(l)}letters[l].push(d)});
    order.sort();
    strip='<div class="alpha-strip">'+order.map(function(l){return '<a href="#colL-'+l+'">'+l+'</a>'}).join('')+'</div>';
    order.forEach(function(l){h+='<div class="gh" id="colL-'+l+'">'+l+' · '+letters[l].length+'</div>'+letters[l].map(colRow).join('')});
  } else {h=list.map(colRow).join('')}
  document.getElementById('colStrip').innerHTML=strip;
  var sheet=document.getElementById('colSheet'); sheet.innerHTML=h; colSizeList(sheet);
}
document.getElementById('colTotal').textContent=DATA.length;

renderGuideList(); goGuide('what-are-collocations');
renderColList(); renderColPane();

// Deep link from site search: ?find=look%20forward%20to
(function(){
  var find=JPE_DEEPLINK.getParam("find");
  if(!find) return;
  var tb=document.querySelector('.tab[data-tab="list"]'); if(tb) tb.click();
  colCat="all"; colQ=find.toLowerCase();
  renderColList(); renderColPane();
  var sh=document.getElementById("colSheet");
  if(sh) setTimeout(function(){ sh.scrollIntoView({behavior:"smooth",block:"start"}); }, 90);
})();
(function(){
  var h=JPE_DEEPLINK.getParam('tab') || decodeURIComponent(location.hash.slice(1));
  var t=h&&document.querySelector('.tab[data-tab="'+h+'"]');
  if(t) t.click();
})();

</script>
</div>


<!-- ═══ GUIDE PRINT MODAL ═══ -->
<div class="col-print-overlay" id="guidePrintModal" onclick="guidePrintModalClose(event)">
  <div class="col-print-modal" onclick="event.stopPropagation()">
    <h3>Print Guide</h3>
    <p class="print-modal-desc">Pick the sections to include.</p>
    <div class="print-selall">
      <button onclick="document.querySelectorAll('.guide-sec-cb').forEach(function(cb){cb.checked=true})">Select all</button>
      <button onclick="document.querySelectorAll('.guide-sec-cb').forEach(function(cb){cb.checked=false})">Deselect all</button>
    </div>
    <div class="print-sec-grid" id="guidePrintOpts"></div>
    <div class="print-actions">
      <button class="col-pm-btn" onclick="guidePrintModalClose()">Cancel</button>

</div>

<!-- Print Modal -->
<div class="col-print-overlay" id="colPrintOverlay" onclick="if(event.target===this)closeColPrintModal()">
  <div class="col-print-modal">
    <div class="col-pm-title">Print collocations</div>
    <div class="col-pm-sub">Choose what to print and how.</div>

    <div class="col-pm-section">
      <div class="col-pm-label">Content</div>
      <div class="col-pm-opts">
        <label class="col-pm-opt"><input type="radio" name="colPrintScope" value="current" checked><div><div class="col-pm-opt-text">Current view</div><div class="col-pm-opt-desc">Whatever is visible on screen right now</div></div></label>
        <label class="col-pm-opt"><input type="radio" name="colPrintScope" value="type"><div><div class="col-pm-opt-text">By type</div><div class="col-pm-opt-desc">Choose one or more collocation types</div></div></label>
        <label class="col-pm-opt"><input type="radio" name="colPrintScope" value="all"><div><div class="col-pm-opt-text">All 252 collocations</div><div class="col-pm-opt-desc">Full reference grouped by type</div></div></label>
      </div>
    </div>

    <div class="col-pm-section" id="colPmTypeSection" style="display:none">
      <div class="col-pm-label">Select types</div>
      <div class="col-pm-type-grid" id="colPmTypeGrid"></div>
    </div>

    <div class="col-pm-section">
      <div class="col-pm-label">Format</div>
      <label class="col-pm-check"><input type="checkbox" id="colPmWorksheet"><span>Worksheet mode - gap the collocation in the example sentence</span></label>
      <label class="col-pm-check"><input type="checkbox" id="colPmAnswers"><span>Include answer key (worksheet only)</span></label>
    </div>

    <div class="col-pm-footer">
      <button class="col-pm-btn" onclick="closeColPrintModal()">Cancel</button>
      <button class="col-pm-btn col-pm-btn-go" onclick="doColPrint()">Print</button>
    </div>
  </div>
</div>

<script>
(function(){
  var types = ['verb + noun','adjective + noun','adverb + adjective','adverb + verb','noun + noun'];
  var selectedTypes = new Set(types);
  var grid = document.getElementById('colPmTypeGrid');

  types.forEach(function(t){
    var pill = document.createElement('button');
    pill.className = 'col-pm-type-pill active';
    pill.textContent = t;
    pill.addEventListener('click', function(){
      pill.classList.toggle('active');
      if(pill.classList.contains('active')) selectedTypes.add(t);
      else selectedTypes.delete(t);
    });
    grid.appendChild(pill);
  });

  document.querySelectorAll('[name=colPrintScope]').forEach(function(r){
    r.addEventListener('change', function(){
      document.getElementById('colPmTypeSection').style.display = r.value==='type'?'block':'none';
    });
  });

  window.openColPrintModal = function(){
    document.getElementById('colPrintOverlay').classList.add('show');
  };
  window.closeColPrintModal = function(){
    document.getElementById('colPrintOverlay').classList.remove('show');
  };

  window.doColPrint = function(){
    var scope = document.querySelector('[name=colPrintScope]:checked').value;
    var worksheet = document.getElementById('colPmWorksheet').checked;
    var answers = document.getElementById('colPmAnswers').checked;

    var items = [];
    if(scope === 'current'){
      items = colShown();
    } else {
      var filtered = DATA;
      if(scope === 'type'){
        filtered = DATA.filter(function(d){ return selectedTypes.has(d.t); });
      }
      items = filtered;
    }

    if(items.length === 0){ alert('No collocations to print.'); return; }

    // Group by type
    var grouped = {};
    items.forEach(function(item){
      var t = item.t || 'Other';
      if(!grouped[t]) grouped[t] = [];
      grouped[t].push(item);
    });

    // Build print HTML
    var pw = window.open('','_blank','width=800,height=600');
    if(!pw){alert('Pop-up blocked. Please allow pop-ups.'); return;}
    var h = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Collocations</title>';
    h += '<style>';
    h += 'body{font-family:Outfit,sans-serif;color:#2D3047;padding:2rem;line-height:1.5;max-width:800px;margin:0 auto}';
    h += '.print-header{margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:2px solid #2D3047}';
    h += '.print-header h1{font-size:1.5rem;font-weight:800;margin:0 0 .25rem}';
    h += '.print-header p{font-size:.78rem;color:#7A7D8E;margin:0}';
    h += '.type-header{font-size:1.1rem;font-weight:700;margin:1.5rem 0 .5rem;padding-bottom:.25rem;border-bottom:1px solid #ccc;page-break-after:avoid}';
    h += '.type-header:first-of-type{margin-top:.5rem}';
    h += '.entry{padding:.5rem 0;border-bottom:1px dotted #ddd;page-break-inside:avoid}';
    h += '.entry:last-child{border-bottom:none}';
    h += '.phrase{font-weight:800;font-size:.92rem}';
    h += '.def{font-style:italic;color:#555;font-size:.84rem;margin-top:.25rem}';
    h += '.example{font-size:.84rem;margin-top:.25rem;line-height:1.5}';
    h += '.example b{font-weight:800}';
    h += '.gap{display:inline-block;min-width:120px;border-bottom:1.5px solid #2D3047;margin:0 2px}';
    h += '.answer-key{margin-top:2rem;padding-top:1rem;border-top:2px solid #2D3047;page-break-before:always}';
    h += '.answer-key h2{font-size:1.1rem;font-weight:700;margin-bottom:.5rem}';
    h += '.ak-item{font-size:.82rem;margin-bottom:.25rem}';
    h += '.ak-num{font-weight:700;color:#7A7D8E;margin-right:.25rem}';
    h += '@media print{body{padding:0}}';
    h += '</style></head><body>';

    var total = items.length;
    var label = scope==='current' ? 'Current view' : scope==='all' ? 'All collocations' : 'Selected types';
    h += '<div class="print-header"><h1>Collocations' + (worksheet?' - Worksheet':'') + '</h1>';
    h += '<p>' + label + ' &middot; ' + total + ' items &middot; johnplusenglish.com</p></div>';

    var answerList = [];
    var num = 0;

    Object.keys(grouped).sort().forEach(function(type){
      h += '<div class="type-header">' + type + '</div>';
      grouped[type].forEach(function(item){
        num++;
        h += '<div class="entry">';
        if(worksheet){
          // Gap the already-bolded surface form so the blank lands where the
          // collocation actually appears, even when it is inflected.
          var gapped;
          if(/<b>[\s\S]*?<\/b>/.test(item.e)){
            gapped = item.e.replace(/<b>[\s\S]*?<\/b>/, '<span class="gap">&nbsp;</span>');
          } else {
            var plain = item.e.replace(/<b>/g,'').replace(/<\/b>/g,'');
            gapped = plain + ' <span class="gap">&nbsp;</span>';
          }
          h += '<div class="example"><span style="font-weight:700;color:#7A7D8E;margin-right:.25rem">' + num + '.</span> ' + gapped + '</div>';
          if(item.d) h += '<div class="def">' + item.d + '</div>';
          answerList.push({n:num, a:item.c});
        } else {
          h += '<div class="phrase">' + item.c + '</div>';
          if(item.d) h += '<div class="def">' + item.d + '</div>';
          if(item.e) h += '<div class="example">' + item.e + '</div>';
        }
        h += '</div>';
      });
    });

    if(worksheet && answers && answerList.length > 0){
      h += '<div class="answer-key"><h2>Answer Key</h2>';
      answerList.forEach(function(a){
        h += '<div class="ak-item"><span class="ak-num">' + a.n + '.</span> ' + a.a + '</div>';
      });
      h += '</div>';
    }

    h += '</body></html>';
    pw.document.write(h);
    pw.document.close();
    pw.focus();
    setTimeout(function(){ pw.print(); }, 400);
    closeColPrintModal();
  };

window.printGuide = function(){ guidePrintModalOpen(); };
})();
</script>
