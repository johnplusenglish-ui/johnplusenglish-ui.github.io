, decide, manage, refuse, agree, afford, expect, fail","verb + to + base: I want to go."],["Verb + both (meaning changes)","remember, forget, stop, try, regret","remember to do (duty) / remember doing (memory)"],["Adjective + infinitive","happy, ready, able, difficult, easy, important","I'm happy to help. / It's easy to forget."],["Preposition + gerund","interested in, good at, tired of, before, after, without, instead of","After preposition - always -ing."],["Verb + object + infinitive","want, ask, tell, advise, expect, allow, help","I want you to come. / She told him to leave."]]},"examples":[{"type":"pos","eng":"I really enjoy cooking - it relaxes me.","note":"Enjoy + gerund."},{"type":"pos","eng":"She managed to finish the report on time.","note":"Manage + infinitive."},{"type":"pos","eng":"I remember meeting her at a party years ago.","note":"Remember + gerund = memory of a past event."},{"type":"pos","eng":"Did you remember to lock the door?","note":"Remember + infinitive = didn't forget to do it."}],"errors":[{"bad":"I enjoy to cook at weekends.","good":"I enjoy cooking at weekends.","reason":"Enjoy + gerund - never infinitive."},{"bad":"She avoided to make eye contact.","good":"She avoided making eye contact.","reason":"Avoid + gerund."},{"bad":"I'm looking forward to see you.","good":"I'm looking forward to seeing you.","reason":"To here is a preposition (part of look forward to) - followed by gerund."}],"realUse":[],"richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Verb + gerund (-ing)<\/div>\n<div class=\"colloc-grid\">\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">Feelings about activities<\/div><div class=\"colloc-card-items\">enjoy · love · hate · like (general) · miss · can't stand · don't mind<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">Avoidance & stopping<\/div><div class=\"colloc-card-items\">avoid · stop · give up · put off · delay · postpone · resist<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">Suggesting & recommending<\/div><div class=\"colloc-card-items\">suggest · recommend · consider · propose · admit · deny · imagine<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">Other -ing verbs<\/div><div class=\"colloc-card-items\">finish · practise · keep · risk · involve · mention · regret (past)<\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Verb + infinitive (to + base)<\/div>\n<div class=\"colloc-grid\">\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">Intention & decision<\/div><div class=\"colloc-card-items\">want · decide · plan · intend · hope · wish · choose · prepare<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">Ability & attempt<\/div><div class=\"colloc-card-items\">manage · try · fail · attempt · learn · afford · struggle · pretend<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">Agreement & refusal<\/div><div class=\"colloc-card-items\">agree · refuse · offer · promise · threaten · expect · claim<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">Other to-infinitive<\/div><div class=\"colloc-card-items\">need · seem · appear · tend · happen · deserve · bother<\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Verbs with meaning change - both forms<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">remember + -ing<\/div><div class=\"meaning-box-eg\">\"I remember meeting her.\"<\/div><div class=\"meaning-box-note\">Memory of a past event<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">remember + to<\/div><div class=\"meaning-box-eg\">\"Remember to lock up.\"<\/div><div class=\"meaning-box-note\">Don't forget to do it<\/div><\/div>\n<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">stop + -ing<\/div><div class=\"meaning-box-eg\">\"She stopped smoking.\"<\/div><div class=\"meaning-box-note\">Quit the habit entirely<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">stop + to<\/div><div class=\"meaning-box-eg\">\"She stopped to smoke.\"<\/div><div class=\"meaning-box-note\">Paused in order to smoke<\/div><\/div>\n<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">try + -ing<\/div><div class=\"meaning-box-eg\">\"Try adding more salt.\"<\/div><div class=\"meaning-box-note\">Experiment - see if it helps<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">try + to<\/div><div class=\"meaning-box-eg\">\"I tried to open it.\"<\/div><div class=\"meaning-box-note\">Made an effort to do it<\/div><\/div>\n<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">forget + -ing<\/div><div class=\"meaning-box-eg\">\"I'll never forget seeing it.\"<\/div><div class=\"meaning-box-note\">Memory of a past experience<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">forget + to<\/div><div class=\"meaning-box-eg\">\"Don't forget to call.\"<\/div><div class=\"meaning-box-note\">Fail to remember to do it<\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">After prepositions - always gerund<\/div>\n<table class=\"rich-table\"><tbody>\n<tr><td>good/bad/brilliant <strong>at<\/strong><\/td><td><em>She's good at explaining things.<\/em><\/td><\/tr>\n<tr><td>interested/involved <strong>in<\/strong><\/td><td><em>I'm interested in learning more.<\/em><\/td><\/tr>\n<tr><td>without / before / after / instead of<\/td><td><em>She left without saying goodbye.<\/em><\/td><\/tr>\n<tr><td>look forward <strong>to<\/strong><\/td><td><em>I look forward to hearing from you.<\/em> - <strong>to<\/strong> is a preposition here, not part of the infinitive<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","exercises":[{"type":"gap","title":"Gerund or infinitive?","sub":"Fill each gap with the gerund or infinitive form of the verb in brackets.","items":[{"answer":"swimming","before":"I really enjoy ","after":" in the sea. (swim - gerund)"},{"answer":"to leave","before":"She decided ","after":" early. (leave - infinitive)"},{"answer":"arguing","before":"They kept ","after":" about the same things. (argue - gerund)"},{"answer":"to finish","before":"He managed ","after":" on time. (finish - infinitive)"},{"answer":"going","before":"I'm thinking of ","after":" to Rome next month. (go - gerund after preposition)"},{"answer":"to apologise","before":"She refused ","after":". (apologise - infinitive)"},{"answer":"to buy","before":"I can't afford ","after":" a new car right now. (buy - infinitive after 'afford')"},{"answer":"speaking","before":"She's very good at ","after":" in public. (speak - gerund after at)"}]},{"type":"mc","title":"Gerund or infinitive - meaning change","sub":"Choose the correct form. Note the meaning difference.","items":[{"q":"I remember _____ her at the conference. (I have a memory of this)","opts":["to meet","meeting","meet","to meeting"],"answer":"meeting","explanation":"Remember + gerund = you have a memory of the past event."},{"q":"Did you remember _____ the oven off? (don't forget to do it)","opts":["turning","to turn","turn","turned"],"answer":"to turn","explanation":"Remember + infinitive = didn't forget to do the task."},{"q":"She stopped _____ when the doctor told her to.","opts":["to smoke","smoke","smoking","smoked"],"answer":"smoking","explanation":"Stop + gerund = quit the habit entirely."},{"q":"He stopped _____ a map. (he paused in order to do this)","opts":["checking","to check","check","checked"],"answer":"to check","explanation":"Stop + infinitive = paused in order to perform the action."}]},{"type":"categorise","title":"Gerund or infinitive?","sub":"Click a verb, then click the correct column.","categories":[{"name":"verb + gerund (-ing)","items":["enjoy","avoid","finish","suggest","keep","mind","practise","miss"]},{"name":"verb + infinitive (to...)","items":["want","decide","manage","refuse","hope","plan","agree","afford"]},{"name":"preposition → always gerund","items":["good at","interested in","without","instead of","after","before"]}]}]},{"id":"causative","title":"Causative: have / get","subtitle":"I had my hair cut, she got it fixed","intro":"Describing a service that someone else does for you. Common in English, missing from many languages - so worth real attention.","desc":"The causative is used when you arrange for someone else to do something for you - you don't do it yourself. It is common in everyday English but absent from many languages, causing students to reach for awkward alternatives.","tip":"This structure looks almost identical to the passive, but there's one difference I really want you to hold onto: with the causative, <em>you<\/em> arranged it. <strong>\"My car was repaired\"<\/strong> (passive - we don't know who decided) versus <strong>\"I had my car repaired\"<\/strong> (causative - I set it up, and someone did it for me). Once you feel that \"I arranged this\" meaning, you'll reach for it naturally.","explanation":"<p>The causative uses <strong>have/get + object + past participle<\/strong> to describe an action that you arrange for someone else to do on your behalf.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Have + object + past participle<\/strong> - the standard form. <em>\"I had my hair cut.\"<\/em> / <em>\"She had her car serviced.\"<\/em> / <em>\"We're having the house painted.\"<\/em> (currently in progress)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Get + object + past participle<\/strong> - more informal, common in spoken English. <em>\"I need to get my phone fixed.\"<\/em> / <em>\"She got her nails done.\"<\/em> Often implies more effort or difficulty in arranging it.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Tense changes<\/strong> come from <em>have/get<\/em>, not the past participle. The participle stays the same. <em>\"I had it repaired.\" / \"I'm having it repaired.\" / \"I'll have it repaired.\" / \"I've had it repaired.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>The shape to memorise:<\/strong> subject + have/get + object + past participle (+ by + agent, if you want it).<br><em>\"I had my photo taken (by a professional).\"<\/em><br>Line it up against the passive: <em>\"My photo was taken\"<\/em> says nothing about who arranged it; <em>\"I had my photo taken\"<\/em> says clearly that I did. The tense always lives on <em>have/get<\/em>, never on the participle.<\/div>","table":{"headers":["Tense","Have causative","Get causative"],"rows":[["Present simple","I have my car serviced every year.","I get my nails done every month."],["Past simple","She had her hair cut yesterday.","He got his suit dry-cleaned."],["Present continuous","We're having the house painted.","I'm getting my laptop repaired."],["Future (will)","I'll have it delivered.","I'll get it sorted."],["Present perfect","Have you had your eyes tested?","She's already got it fixed."]]},"examples":[{"type":"pos","eng":"I'm going to have my hair cut this afternoon.","note":"Arranged appointment - someone else will cut it."},{"type":"pos","eng":"She had her car repaired at the local garage.","note":"Past causative - she arranged it, the garage did it."},{"type":"pos","eng":"We need to get the boiler checked before winter.","note":"Get causative - informal, common in spoken English."},{"type":"pos","eng":"He has his suits made in Savile Row.","note":"Luxury causative - arrangement for a bespoke service."}],"errors":[{"bad":"I had my hair cutting yesterday.","good":"I had my hair cut yesterday.","reason":"Causative: have + object + past participle - not -ing."},{"bad":"She got repaired her phone.","good":"She got her phone repaired.","reason":"Object must come directly after get/have, before the past participle."},{"bad":"I had cut my hair.","good":"I had my hair cut.","reason":"Causative word order: had + object (my hair) + past participle (cut)."}],"realUse":[],"exercises":[{"type":"gap","title":"Form the causative","sub":"Fill each gap using have or get + object + past participle.","items":[{"answer":"had my hair cut","before":"I ","after":" at the salon yesterday. (cut)"},{"answer":"having the house painted","before":"We're ","after":" at the moment. (paint)"},{"answer":"get my eyes tested","before":"I need to ","after":" - I can't see well. (test)"},{"answer":"had her laptop repaired","before":"She ","after":" last week. (repair)"},{"answer":"have my suit dry-cleaned","before":"I want to ","after":" before the wedding. (dry-clean)"},{"answer":"getting the boiler checked","before":"We're ","after":" tomorrow. (check)"}]},{"type":"mc","title":"Choose the correct causative","sub":"Choose the correct form.","items":[{"q":"I need to _____ - it's been making a strange noise.","opts":["have my car checked","have checked my car","my car have checked","check my car have"],"answer":"have my car checked","explanation":"Causative: have + object (my car) + past participle (checked)."},{"q":"She _____ for the wedding. She looks beautiful.","opts":["had her hair done","had done her hair","did her hair","has her hair doing"],"answer":"had her hair done","explanation":"Have + object + past participle. Object (her hair) comes before the participle."},{"q":"They _____ every year before winter.","opts":["have the heating serviced","have serviced the heating","serviced the heating have","get serviced the heating"],"answer":"have the heating serviced","explanation":"Have + object + past participle - object (the heating) comes before participle."},{"q":"I _____ - I can't get the lid off.","opts":["need to get this jar opened","need to get opened this jar","need this jar to open","get this jar to open"],"answer":"need to get this jar opened","explanation":"Get + object (this jar) + past participle (opened)."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"A mechanic fixed my car.","keyword":"had","answer":"I had my car fixed by a mechanic."},{"original":"A photographer is taking her photos right now.","keyword":"having","answer":"She is having her photos taken."},{"original":"Someone delivers fresh bread to our house every morning.","keyword":"have","answer":"We have fresh bread delivered every morning."},{"original":"A plumber will fix the pipes tomorrow.","keyword":"get","answer":"I'll get the pipes fixed tomorrow."},{"original":"Did a dentist check your teeth recently?","keyword":"Have you had","answer":"Have you had your teeth checked recently?"}]}]},{"id":"quantifiersb1","title":"Quantifiers: too, enough, plenty of","subtitle":"too much, not enough, plenty of time","intro":"Excess, sufficiency, abundance - saying whether an amount is too much, just right, or plenty.","desc":"At A2 you learnt some/any/much/many/a lot of. At B1 the key additions are too, enough, and plenty of - three quantifiers that add a judgement about whether the amount is right, too much, or sufficient.","tip":"The word my students misuse most here is <em>too<\/em>, because they treat it like <em>very<\/em>. But they're not the same. <strong>\"It's very hot\"<\/strong> is neutral, just a description. <strong>\"It's too hot\"<\/strong> means there's a problem - it's more than is acceptable. <em>Too<\/em> always carries a negative consequence. If nothing's wrong, use <em>very<\/em>.","explanation":"<p>These three quantifiers make judgements about quantity - whether something is more than needed, less than needed, or just right/plenty.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Too<\/strong> - more than is acceptable or desirable. Always implies a problem or negative result. <em>\"It's too cold to go out.\"<\/em> / <em>\"He spoke too quickly for me to understand.\"<\/em> / <em>\"There are too many people.\"<\/em> / <em>\"There's too much noise.\"<\/em><br>Structure: too + adjective/adverb OR too much/many + noun.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Enough<\/strong> - the right amount, or sufficient. In positive sentences = sufficient. In negatives/questions = insufficient. <em>\"I have enough money.\"<\/em> / <em>\"She isn't old enough to vote.\"<\/em> / <em>\"He didn't work hard enough.\"<\/em><br>Structure: enough + noun OR adjective/adverb + enough (enough comes AFTER adjectives).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Plenty of<\/strong> - more than enough, abundance. Used in positive sentences. <em>\"There's plenty of time.\"<\/em> / <em>\"We have plenty of food.\"<\/em> / <em>\"Don't rush - there are plenty of seats.\"<\/em> Works with both countable and uncountable nouns.<\/div><\/div>\n<div class=\"note\"><strong>Too vs very - the distinction I drill:<\/strong><br><em>\"It's very hot.\"<\/em> = a neutral observation.<br><em>\"It's too hot.\"<\/em> = a problem; more than is acceptable.<br>And mind where <em>enough<\/em> sits: before a noun (<em>enough money<\/em>) but <strong>after<\/strong> an adjective or adverb (<em>old enough, quickly enough<\/em>). <em>\"She's enough tall\"<\/em> ✗ → <em>\"She's tall enough\"<\/em> ✓.<\/div>","table":{"headers":["Quantifier","Use","Position","Example"],"rows":[["too","excess - more than desirable (problem implied)","too + adj/adv | too much/many + noun","It's too cold. / Too many people."],["enough","sufficiency - the right amount","enough + noun | adj/adv + enough","Enough money. / Old enough."],["not enough","insufficient - less than needed","not enough + noun | not adj/adv + enough","Not enough time. / Not warm enough."],["plenty of","abundance - more than enough","plenty of + noun (countable or uncountable)","Plenty of food. / Plenty of options."],["too much","excess with uncountable nouns","too much + uncountable","Too much noise. / Too much work."],["too many","excess with countable nouns","too many + countable plural","Too many emails. / Too many people."]]},"examples":[{"type":"pos","eng":"The coffee is too hot to drink right now.","note":"Too + adjective + to + infinitive - implies a problem."},{"type":"pos","eng":"She's old enough to make her own decisions.","note":"Adjective + enough - enough after the adjective."},{"type":"pos","eng":"There's plenty of time - don't rush.","note":"Plenty of = more than enough. Reassuring."},{"type":"neg","eng":"I don't have enough money to buy it.","note":"Not enough = insufficient."}],"errors":[{"bad":"She's enough old to drive.","good":"She's old enough to drive.","reason":"Enough comes after the adjective - old enough."},{"bad":"It's very cold for swimming - let's not go.","good":"It's too cold for swimming - let's not go.","reason":"A problem with a consequence → too, not very."},{"bad":"There's too many food.","good":"There's too much food.","reason":"Food is uncountable - too much, not too many."}],"realUse":[],"exercises":[{"type":"gap","title":"Too, enough, or plenty of?","sub":"Fill each gap with too, too much, too many, enough, or plenty of.","items":[{"answer":"too","before":"This coffee is ","after":" hot to drink. (excess - problem)"},{"answer":"enough","before":"Do we have ","after":" chairs for everyone? (sufficient)"},{"answer":"too many","before":"There are ","after":" people in this room. (excess - countable)"},{"answer":"plenty of","before":"Don't worry - there's ","after":" food. (more than enough)"},{"answer":"too much","before":"He eats ","after":" sugar. (excess - uncountable)"},{"answer":"enough","before":"She isn't old ","after":" to vote. (after adjective - sufficient)"},{"answer":"too","before":"The music is ","after":" loud - I can't concentrate."},{"answer":"plenty of","before":"We have ","after":" time before the train. (abundance)"}]},{"type":"mc","title":"Too vs very","sub":"Choose the correct word.","items":[{"q":"The film was _____ long - I fell asleep.","opts":["very","too","enough","plenty"],"answer":"too","explanation":"Fell asleep = negative consequence → too (excess with a problem)."},{"q":"The weather is _____ hot today - perfect for the beach!","opts":["too","enough","very","plenty"],"answer":"very","explanation":"Perfect for the beach = positive, no problem → very, not too."},{"q":"She speaks _____ quickly for me to follow.","opts":["very","enough","too","plenty"],"answer":"too","explanation":"For me to follow = result of the excess → too + adverb."},{"q":"He's _____ talented - everyone loves his work.","opts":["too","enough","plenty","very"],"answer":"very","explanation":"Everyone loves his work = positive → very, not too."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"I can't lift this - it's too heavy.","keyword":"enough","answer":"This isn't light enough for me to lift./This isn't light enough to lift."},{"original":"She's not old enough to drive.","keyword":"too","answer":"She's too young to drive."},{"original":"There's a lot of food - don't worry.","keyword":"plenty","answer":"There's plenty of food - don't worry."},{"original":"I can't hear - the music is very loud.","keyword":"too","answer":"The music is too loud - I can't hear."},{"original":"We don't have enough time.","keyword":"too","answer":"There's too little time."}]}]},{"id":"linkingwords","title":"Linking words - advanced","subtitle":"despite, whereas, nevertheless","intro":"Moving beyond because and but into richer, more grown-up connectors - the ones that lift your writing.","desc":"At A2 you learnt because, so, but, although, when, if. At B1 these are expanded with more formal and nuanced connectors that allow for richer, more sophisticated expression - especially in writing.","tip":"The error I flag again and again with <em>despite<\/em>: it can't take a full clause. <strong>\"Despite it was raining\"<\/strong> is wrong. You want <strong>\"Despite the rain\"<\/strong> (a noun) or <strong>\"Despite the fact that it was raining\"<\/strong> if you really need a clause. So think of <em>despite<\/em> as needing a noun or an -ing form, never a subject plus verb on its own.","explanation":"<p>Linking words show the logical relationship between ideas. At B1 we extend the A2 set with more formal and nuanced connectors.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Despite / in spite of<\/strong> - contrast, despite a difficulty. Followed by noun or gerund - NEVER a clause. <em>\"Despite the rain, we went out.\"<\/em> / <em>\"In spite of feeling ill, she worked.\"<\/em> / <em>\"Despite the fact that it was raining, we went out.\"<\/em> (if you need a clause, add <em>the fact that<\/em>)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>However / nevertheless / nonetheless<\/strong> - contrast between two separate sentences. Unlike <em>but<\/em> and <em>although<\/em>, these connect two independent sentences. <em>\"The project was difficult. However, we completed it on time.\"<\/em> Always preceded by a full stop or semicolon, followed by a comma.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Whereas / while<\/strong> - direct contrast between two parallel facts. <em>\"She loves cities, whereas I prefer the countryside.\"<\/em> / <em>\"Prices have risen, while wages have stayed the same.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Therefore / as a result / consequently<\/strong> - result or consequence. More formal than <em>so<\/em>. <em>\"The roads were icy. Therefore, the match was cancelled.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Despite vs although - the difference to lock in:<\/strong><br><em>Although<\/em> + a full clause: <em>\"Although it was raining, we went out.\"<\/em><br><em>Despite<\/em> + a noun or gerund: <em>\"Despite the rain, we went out.\"<\/em><br><em>\"Despite it was raining\"<\/em> ✗ - never <em>despite<\/em> + subject + verb. If you must, bridge it with <em>the fact that<\/em>.<\/div>","table":{"headers":["Connector","Type","Structure","Example"],"rows":[["despite / in spite of","contrast","+ noun / gerund","Despite the rain, we went."],["however / nevertheless","contrast (between sentences)","full stop + however/nevertheless + comma","It was hard. However, we succeeded."],["whereas / while","parallel contrast","clause + whereas/while + clause","She likes cities, whereas I prefer villages."],["therefore / as a result / consequently","result/consequence","full stop + connector + comma","The roads were icy. Therefore, we stayed."],["furthermore / moreover","addition (more formal than also)","full stop + connector + comma","The plan is cheap. Furthermore, it is effective."],["in addition","addition","in addition + comma + clause","In addition, the report needs updating."]]},"examples":[{"type":"pos","eng":"Despite feeling tired, she finished the presentation.","note":"Despite + gerund - not despite she was tired."},{"type":"pos","eng":"The salary was low. Nevertheless, she accepted the job.","note":"Nevertheless connects two independent sentences."},{"type":"pos","eng":"He earns a lot, whereas his brother struggles financially.","note":"Whereas - direct contrast between two parallel facts."},{"type":"pos","eng":"The data was unclear. Therefore, the results are inconclusive.","note":"Therefore - formal result connector between sentences."}],"errors":[{"bad":"Despite it was raining, we went out.","good":"Despite the rain, we went out.","reason":"Despite + noun/gerund - never despite + subject + verb clause."},{"bad":"Although it was cold, but I went out.","good":"Although it was cold, I went out.","reason":"Although already expresses contrast - never add but as well. One connector is enough."},{"bad":"The results were poor, nevertheless the team continued.","good":"The results were poor. Nevertheless, the team continued.","reason":"Nevertheless connects two separate sentences - needs a full stop before it, not a comma."}],"realUse":[],"richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Contrast & concession<\/div>\n<table class=\"rich-table\"><thead><tr><th>Connector<\/th><th>Structure<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>Despite / in spite of<\/td><td>+ noun or gerund<\/td><td><em>Despite the rain, we went out. / Despite feeling ill, she worked.<\/em><\/td><\/tr>\n<tr><td>Although / even though<\/td><td>+ full clause<\/td><td><em>Although it was expensive, I bought it.<\/em><\/td><\/tr>\n<tr><td>However / nevertheless<\/td><td>New sentence + comma<\/td><td><em>It was hard. However, we succeeded.<\/em><\/td><\/tr>\n<tr><td>Whereas / while<\/td><td>Contrast in same sentence<\/td><td><em>She loves cities, whereas I prefer villages.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Result & consequence<\/div>\n<table class=\"rich-table\"><thead><tr><th>Connector<\/th><th>Structure<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>Therefore / as a result / consequently<\/td><td>New sentence + comma<\/td><td><em>The roads were icy. Therefore, the match was cancelled.<\/em><\/td><\/tr>\n<tr><td>So<\/td><td>Joins two clauses (comma before)<\/td><td><em>She was tired, so she went home.<\/em><\/td><\/tr>\n<tr><td>Because / since / as<\/td><td>+ full clause (reason)<\/td><td><em>I stayed in because I was ill.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Addition<\/div>\n<table class=\"rich-table\"><thead><tr><th>Connector<\/th><th>Use<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>Furthermore / moreover / in addition<\/td><td>Formal - new sentence<\/td><td><em>The plan is costly. Furthermore, it is untested.<\/em><\/td><\/tr>\n<tr><td>What is more<\/td><td>Emphatic addition<\/td><td><em>It's expensive. What is more, it won't work.<\/em><\/td><\/tr>\n<tr><td>Not only... but also<\/td><td>Double emphasis<\/td><td><em>Not only is it slow, but it is also unreliable.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\"><svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' style='vertical-align:-2px'><path d='M12 3 21 19H3Z'/><path d='M12 9v4m0 3h.01'/></svg> Critical rules<\/div>\n<table class=\"rich-table\"><tbody>\n<tr><td>Despite + noun/gerund ✓<\/td><td><em>Despite the rain. / Despite raining.<\/em> - NOT despite it rained ✗<\/td><\/tr>\n<tr><td>However - new sentence only<\/td><td><em>It was hard. However, we managed.<\/em> - NOT <em>it was hard, however we managed ✗<\/em><\/td><\/tr>\n<tr><td>Although - never with but<\/td><td><em>Although it was cold, I went out.<\/em> - NOT <em>although... but ✗<\/em><\/td><\/tr>\n<tr><td>Unless = if not<\/td><td><em>Unless you come<\/em> = if you don't come. Don't add don't/won't inside unless.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","exercises":[{"type":"gap","title":"Choose the correct connector","sub":"Fill each gap with despite, however, whereas, therefore, or furthermore.","items":[{"answer":"Despite","before":"","after":" the bad weather, the event was a success."},{"answer":"however","before":"The film was long. ","after":", it was never boring."},{"answer":"whereas","before":"Some students prefer grammar exercises, ","after":" others prefer conversation."},{"answer":"Therefore","before":"The evidence was inconclusive. ","after":", no decision was made."},{"answer":"Despite","before":"","after":" working hard, he failed the exam."},{"answer":"Furthermore","before":"The location is perfect. ","after":", the price is reasonable."},{"answer":"whereas","before":"Rents in the city are high, ","after":" rural areas are much cheaper."},{"answer":"however","before":"The solution seemed simple. ","after":", it proved very difficult in practice."}]},{"type":"mc","title":"Despite, although, or however?","sub":"Choose the correct connector.","items":[{"q":"_____ the high price, they decided to buy it.","opts":["Although","Despite","However","Whereas"],"answer":"Despite","explanation":"Despite + noun (the high price). Although would need a full clause."},{"q":"_____ she was nervous, she gave an excellent presentation.","opts":["Despite","However","Although","Therefore"],"answer":"Although","explanation":"Although + full clause (subject + verb). Not despite."},{"q":"The plan was approved. _____, several concerns were raised.","opts":["Although","Despite","However","Whereas"],"answer":"However","explanation":"However connects two independent sentences - preceded by full stop."},{"q":"He earns well _____ his colleague struggles on minimum wage.","opts":["however","despite","therefore","whereas"],"answer":"whereas","explanation":"Whereas - direct contrast between two parallel facts in the same sentence."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"Although it was expensive, we bought it.","keyword":"Despite","answer":"Despite the high price, we bought it."},{"original":"She was tired, but she kept working.","keyword":"Despite","answer":"Despite being tired, she kept working."},{"original":"He worked hard, so he passed.","keyword":"therefore","answer":"He worked hard. Therefore, he passed."},{"original":"Although she earns more, she saves less.","keyword":"whereas","answer":"She earns more, whereas she saves less."},{"original":"The hotel was expensive. Also, it was in a bad location.","keyword":"Furthermore","answer":"The hotel was expensive. Furthermore, it was in a bad location."}]}]},{"id":"wish","title":"Wish / if only","subtitle":"I wish I knew, if only I had more time","intro":"Regret, dissatisfaction, longing - wishing reality were different from what it is.","desc":"Wish and if only are used when reality is not what we want it to be. Like the second conditional, they use past tense to signal unreality - not past time.","tip":"The shortcut I always share: <em>wish<\/em> is really the second conditional in disguise. <em>\"If I had more money, I would...\"<\/em> is the same idea as <em>\"I wish I had more money.\"<\/em> Both use a past tense to say <em>this is not my reality<\/em>. So if you've got the second conditional, you've almost got this for free - it's about unreality, not past time.","explanation":"<p>Wish and if only express a desire for things to be different from the present reality, or regret about a past situation. Like conditionals, they use tense shift to signal unreality.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Wish + past simple<\/strong> - dissatisfaction with the present, desire for things to be different now. <em>\"I wish I spoke Spanish.\"<\/em> (I don't speak Spanish - I want to.) / <em>\"I wish it wasn't so cold.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Wish + could<\/strong> - wishing for an ability you don't currently have. <em>\"I wish I could drive.\"<\/em> / <em>\"She wishes she could afford it.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Wish + would<\/strong> - expressing frustration about someone's behaviour, or a desire for a change. <em>\"I wish you would listen!\"<\/em> / <em>\"I wish it would stop raining.\"<\/em> Note: wish + would is NOT used with the same subject. <em>\"I wish I would...\"<\/em> is wrong - use wish + past simple for your own situation.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Wish + past perfect<\/strong> - regret about a past situation that cannot be changed. <em>\"I wish I had studied harder.\"<\/em> / <em>\"She wishes she hadn't said that.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>If only<\/strong> is simply the more emotional version of <em>wish<\/em> - same grammar, stronger feeling: <em>\"If only I had more time!\"<\/em> / <em>\"If only I hadn't said that.\"<\/em><br>On <em>was<\/em> or <em>were<\/em>: after <em>wish<\/em>, formal English prefers <em>were<\/em> (mirroring the second conditional) - <em>\"I wish I were taller.\"<\/em> In everyday speech, <em>was<\/em> is common and perfectly accepted.<\/div>","table":{"headers":["Structure","Use","Example"],"rows":[["wish + past simple","dissatisfaction with present situation","I wish I lived nearer."],["wish + could","wishing for a present ability","I wish I could sing."],["wish + would","frustration with someone's behaviour or desire for change","I wish you would stop interrupting."],["wish + past perfect","regret about a past event","I wish I had studied harder."],["if only + past simple","emphatic dissatisfaction with present","If only I had more time!"],["if only + past perfect","emphatic regret about the past","If only I hadn't said that."]]},"examples":[{"type":"pos","eng":"I wish I spoke French - it would be so useful.","note":"Wish + past simple - present dissatisfaction."},{"type":"pos","eng":"She wishes she could afford to travel more.","note":"Wish + could - wishing for an ability."},{"type":"pos","eng":"I wish you would turn that music down!","note":"Wish + would - frustration about someone else's behaviour."},{"type":"pos","eng":"I wish I had taken that job when I had the chance.","note":"Wish + past perfect - regret about a past decision."}],"errors":[{"bad":"I wish I would speak better English.","good":"I wish I spoke better English.","reason":"Wish + would cannot have the same subject for I. Use past simple for your own situation."},{"bad":"I wish I can drive.","good":"I wish I could drive.","reason":"Ability wish → wish + could, not can."},{"bad":"If only I study harder last year.","good":"If only I had studied harder last year.","reason":"Regret about the past → wish/if only + past perfect."}],"realUse":[],"exercises":[{"type":"gap","title":"Wish/if only - present and past","sub":"Fill each gap with the correct form.","items":[{"answer":"spoke","before":"I wish I ","after":" Italian. (speak - present wish)"},{"answer":"could drive","before":"She wishes she ","after":". (ability wish)"},{"answer":"would listen","before":"I wish you ","after":" for once! (frustration wish)"},{"answer":"hadn't said","before":"I wish I ","after":" that - it was hurtful. (past regret)"},{"answer":"had studied","before":"If only I ","after":" harder at school. (past regret)"},{"answer":"were / was","before":"I wish it ","after":" warmer today. (present wish - temperature)"},{"answer":"would stop","before":"I wish this rain ","after":". (desire for external change)"},{"answer":"had taken","before":"She wishes she ","after":" the job when she had the chance. (past regret)"}]},{"type":"mc","title":"Which form after wish?","sub":"Choose the correct form.","items":[{"q":"I wish I _____ to work by bike. (I can't currently)","opts":["can cycle","could cycle","would cycle","cycled"],"answer":"could cycle","explanation":"Wishing for an ability you don't currently have → wish + could."},{"q":"I wish you _____ interrupting me all the time!","opts":["stopped","would stop","stop","had stopped"],"answer":"would stop","explanation":"Frustration about someone else's repeated behaviour → wish + would."},{"q":"I wish I _____ that. It caused so many problems.","opts":["didn't say","wouldn't say","hadn't said","don't say"],"answer":"hadn't said","explanation":"Regret about a past action → wish + past perfect negative."},{"q":"If only she _____ the truth earlier.","opts":["told","would tell","had told","tells"],"answer":"had told","explanation":"Regret that she didn't tell the truth in the past → if only + past perfect."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"I don't have a bigger flat. I want one.","keyword":"I wish","answer":"I wish I had a bigger flat."},{"original":"I can't play the guitar. I'd love to.","keyword":"I wish","answer":"I wish I could play the guitar."},{"original":"You always interrupt me. Please stop.","keyword":"I wish you","answer":"I wish you would stop interrupting me."},{"original":"I didn't apply for the job. I regret it.","keyword":"I wish","answer":"I wish I had applied for the job."},{"original":"She didn't tell me. I'm annoyed she didn't.","keyword":"If only","answer":"If only she had told me."}]}]},{"id":"prepositionsb1","title":"Prepositions: fixed expressions","subtitle":"good at, interested in, on time, by accident","intro":"Prepositions locked inside fixed expressions and collocations - the combinations you can't work out from a rule.","desc":"At B1 the challenge with prepositions is less about in/on/at and more about the fixed combinations that cannot be predicted from rules. These must be learnt as chunks - the logic often does not translate from other languages.","tip":"Let me be straight with you: with fixed preposition phrases there's no clever shortcut, they mostly have to be learnt as chunks. But grouping them helps a lot. <em>at<\/em> tends to go with skills and activities (good at, bad at, surprised at), <em>in<\/em> with interest and involvement (interested in, involved in, believe in), and <em>of<\/em> with feelings (afraid of, fond of, proud of). Learn them in little families and they stick.","explanation":"<p>Many verbs, adjectives, and nouns in English have fixed prepositions that must be memorised. These cannot always be predicted from the meaning - they are collocations.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Adjective + preposition<\/strong> - fixed combinations: <em>good/bad/brilliant at, interested in, afraid/scared of, proud/ashamed of, responsible for, famous for, keen on, tired of, similar to, different from, excited about, worried about, satisfied with, dependent on.<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Verb + preposition<\/strong> - fixed combinations: <em>agree with/on, apologise for, apply for, believe in, belong to, care about/for, complain about, concentrate on, deal with, depend on, insist on, laugh at, look forward to, rely on, succeed in, suffer from, think about/of.<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Fixed prepositional phrases<\/strong> - time and manner expressions: <em>on time<\/em> (punctual) vs <em>in time<\/em> (before it's too late), <em>by accident/mistake<\/em>, <em>by chance<\/em>, <em>in the end<\/em>, <em>at last<\/em>, <em>on purpose<\/em>, <em>in a hurry<\/em>, <em>in trouble<\/em>, <em>at risk<\/em>, <em>in charge of<\/em>, <em>at least<\/em>.<\/div><\/div>\n<div class=\"note\"><strong>On time vs in time<\/strong> - a pair worth memorising:<br><em>On time<\/em> = punctual, at the scheduled moment: <em>\"The train arrived on time.\"<\/em><br><em>In time<\/em> = with enough time to spare: <em>\"We got there in time to catch the train.\"<\/em><br>And <strong>by accident vs on purpose<\/strong>: <em>by accident / by mistake<\/em> is unintentional (<em>\"I deleted it by accident\"<\/em>); <em>on purpose<\/em> is deliberate (<em>\"She did it on purpose\"<\/em>).<\/div>","table":{"headers":["Category","Preposition","Examples"],"rows":[["Adjective + prep","at","good at, bad at, brilliant at, surprised at, shocked at"],["Adjective + prep","of","afraid of, scared of, proud of, ashamed of, fond of, tired of, aware of"],["Adjective + prep","about","excited about, worried about, enthusiastic about, serious about"],["Adjective + prep","for","famous for, responsible for, sorry for, grateful for"],["Adjective + prep","with","satisfied with, pleased with, bored with, familiar with"],["Adjective + prep","in","interested in, involved in, experienced in"],["Verb + prep","for","apply for, apologise for, wait for, look for, pay for, thank for"],["Verb + prep","on","depend on, rely on, insist on, concentrate on, agree on"],["Verb + prep","about","think about, worry about, complain about, care about"],["Fixed phrases","on/in/by","on time, in time, by accident, on purpose, in the end, at last"]]},"examples":[{"type":"pos","eng":"She's very good at explaining complex ideas.","note":"Good at + gerund - fixed preposition."},{"type":"pos","eng":"He's been interested in astronomy since he was a child.","note":"Interested in - fixed adjective + preposition."},{"type":"pos","eng":"I deleted the file by accident - I'm sorry.","note":"By accident = unintentional."},{"type":"pos","eng":"The train arrived on time, which was a pleasant surprise.","note":"On time = punctual, at the scheduled time."}],"errors":[{"bad":"She's good in maths.","good":"She's good at maths.","reason":"Good at - fixed preposition. Good in is not standard."},{"bad":"I'm interested about history.","good":"I'm interested in history.","reason":"Interested in - always in, not about."},{"bad":"He did it by purpose.","good":"He did it on purpose.","reason":"Intentional action → on purpose. By accident is the opposite."}],"realUse":[],"richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Adjective + preposition<\/div>\n<div class=\"colloc-grid\">\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">at<\/div><div class=\"colloc-card-items\">good at · bad at · brilliant at · surprised at · shocked at · angry at<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">of<\/div><div class=\"colloc-card-items\">afraid of · proud of · tired of · fond of · ashamed of · aware of · capable of<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">about<\/div><div class=\"colloc-card-items\">worried about · excited about · serious about · enthusiastic about · right about<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">for<\/div><div class=\"colloc-card-items\">famous for · responsible for · sorry for · grateful for · ready for · suitable for<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">with<\/div><div class=\"colloc-card-items\">satisfied with · pleased with · bored with · familiar with · disappointed with<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">in<\/div><div class=\"colloc-card-items\">interested in · involved in · experienced in · successful in · disappointed in<\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Verb + preposition<\/div>\n<div class=\"colloc-grid\">\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">for<\/div><div class=\"colloc-card-items\">apply for · apologise for · wait for · look for · pay for · thank for · hope for<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">on<\/div><div class=\"colloc-card-items\">depend on · rely on · insist on · concentrate on · agree on · work on · spend on<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">about<\/div><div class=\"colloc-card-items\">think about · worry about · complain about · care about · know about · talk about<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">with<\/div><div class=\"colloc-card-items\">agree with · deal with · help with · argue with · compare with · face with<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">in<\/div><div class=\"colloc-card-items\">believe in · succeed in · result in · specialise in · participate in · invest in<\/div><\/div>\n<div class=\"colloc-card\"><div class=\"colloc-card-head\">to<\/div><div class=\"colloc-card-items\">look forward to · belong to · refer to · contribute to · react to · lead to<\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Fixed phrases - time & manner<\/div>\n<table class=\"rich-table\"><thead><tr><th>Phrase<\/th><th>Meaning<\/th><th>Contrast<\/th><\/tr><\/thead><tbody>\n<tr><td>on time<\/td><td>Punctual - at the scheduled moment<\/td><td><em>The train arrived on time.<\/em><\/td><\/tr>\n<tr><td>in time<\/td><td>Before it's too late - with time to spare<\/td><td><em>We got there in time to catch it.<\/em><\/td><\/tr>\n<tr><td>by accident / by mistake<\/td><td>Unintentional<\/td><td><em>I deleted it by accident.<\/em><\/td><\/tr>\n<tr><td>on purpose<\/td><td>Deliberate<\/td><td><em>She did it on purpose.<\/em><\/td><\/tr>\n<tr><td>in the end<\/td><td>Finally, after a process<\/td><td><em>In the end, we agreed.<\/em><\/td><\/tr>\n<tr><td>at the end<\/td><td>At the final point (of something)<\/td><td><em>At the end of the film.<\/em><\/td><\/tr>\n<tr><td>in a hurry<\/td><td>Rushing<\/td><td><em>She left in a hurry.<\/em><\/td><\/tr>\n<tr><td>at last<\/td><td>After a long wait<\/td><td><em>At last, it arrived!<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","exercises":[{"type":"gap","title":"Adjective + preposition","sub":"Fill each gap with the correct preposition.","items":[{"answer":"at","before":"She's brilliant ","after":" languages."},{"answer":"of","before":"Are you afraid ","after":" flying?"},{"answer":"about","before":"I'm really excited ","after":" the trip."},{"answer":"for","before":"This region is famous ","after":" its wine."},{"answer":"with","before":"I'm not very satisfied ","after":" the result."},{"answer":"in","before":"She's very interested ","after":" environmental issues."},{"answer":"of","before":"He's very proud ","after":" his children."},{"answer":"for","before":"Who is responsible ","after":" this mess?"}]},{"type":"gap","title":"Verb + preposition","sub":"Fill each gap with the correct preposition.","items":[{"answer":"for","before":"I applied ","after":" the job last week."},{"answer":"on","before":"You can always rely ","after":" her."},{"answer":"about","before":"He keeps complaining ","after":" the same things."},{"answer":"for","before":"She apologised ","after":" being late."},{"answer":"on","before":"Let's concentrate ","after":" the main issue."},{"answer":"in","before":"I don't believe ","after":" coincidences."},{"answer":"with","before":"Do you agree ","after":" what he said?"},{"answer":"to","before":"I'm looking forward ","after":" seeing you."}]},{"type":"mc","title":"On time or in time?","sub":"Choose the correct phrase.","items":[{"q":"The meeting started _____. Everyone was there at 9 sharp.","opts":["in time","on time","by time","at time"],"answer":"on time","explanation":"On time = punctual, at the scheduled moment."},{"q":"We ran to the station and got there _____ to catch the last train.","opts":["on time","by time","in time","at time"],"answer":"in time","explanation":"In time = before it was too late, with time to spare."},{"q":"She broke the vase _____. It was an accident.","opts":["on purpose","by accident","in purpose","at purpose"],"answer":"by accident","explanation":"By accident / by mistake = unintentional."},{"q":"He knew the answer - he got it wrong _____.","opts":["by accident","in purpose","on purpose","by purpose"],"answer":"on purpose","explanation":"On purpose = deliberate, intentional."}]}]}];</script>
<script>
(function(){
  var KEY='jpe_b1grammar_progress_v1';
  var done={}, current=0;
  try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); done=o.done||{}; current=o.current||0;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({done:done,current:current}));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function norm(s){return String(s).toLowerCase().replace(/\s+/g,' ').replace(/[.,!?;:"']/g,'').trim();}
  function _contract(s){return (' '+String(s).toLowerCase()+' ')
   .replace(/\bcan not\b/g,'cannot').replace(/\bcannot\b/g,"can't")
   .replace(/\b(is|are|was|were|do|does|did|have|has|had|would|could|should|must|might|need|will|shall) not\b/g,function(m,v){return {is:"isn't",are:"aren't",was:"wasn't",were:"weren't",do:"don't",does:"doesn't",did:"didn't",have:"haven't",has:"hasn't",had:"hadn't",would:"wouldn't",could:"couldn't",should:"shouldn't",must:"mustn't",might:"mightn't",need:"needn't",will:"won't",shall:"shan't"}[v];})
   .replace(/\b(i|you|he|she|it|we|they) had\b/g,"$1'd").replace(/\b(i|you|he|she|it|we|they) would\b/g,"$1'd")
   .replace(/\b(i|you|we|they) have\b/g,"$1've").replace(/\b(would|could|should|must|might) have\b/g,"$1've")
   .replace(/\b(i|you|he|she|it|we|they) will\b/g,"$1'll")
   .replace(/\b(you|we|they) are\b/g,"$1're").replace(/\bi am\b/g,"i'm").replace(/\blet us\b/g,"let's")
   .replace(/\s+/g,' ').trim();}
  function _cnorm(s){return _contract(String(s).toLowerCase().trim()).replace(/[.,!?;:"']/g,'').replace(/\s+/g,' ').trim();}
  function accepts(val,answer){ // answer may hold "/" alternatives
    var v=norm(val); var alts=String(answer).split('/');
    if(alts.some(function(a){return norm(a)===v;})) return true;
    var vc=_cnorm(val);
    return alts.some(function(a){return _cnorm(a)===vc;});
  }
  var CHECK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  var ARROW='<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  var roadEl=document.getElementById('road'), lessonEl=document.getElementById('lesson');
  document.getElementById('pTotal').textContent=LESSONS.length;

  function updateProgress(){
    var n=Object.keys(done).filter(function(k){return done[k];}).length;
    document.getElementById('pDone').textContent=n;
    document.getElementById('pFill').style.width=(n/LESSONS.length*100)+'%';
  }
  function renderRoad(){
    roadEl.innerHTML=LESSONS.map(function(l,i){
      var cls='g-step'+(i===current?' active':'')+(done[l.id]?' done':'');
      var num=done[l.id]?CHECK:(i+1);
      return '<button class="'+cls+'" data-i="'+i+'"><span class="g-step-n">'+num+'</span><span class="g-step-t">'+esc(l.title)+'</span></button>';
    }).join('');
  }

  // ---------- exercise renderers ----------
  var exSeq=0;
  function fb(id){return '<div class="q-fb" id="'+id+'"></div>';}
  function showFb(id,cls,txt){var e=document.getElementById(id);if(!e)return;e.className='q-fb show '+cls;e.innerHTML=txt;}

  function renderExercise(ex, exNum){
    exSeq++; var eid='ex'+exSeq;
    function qn(j){return '<span class="q-num">'+(j+1)+'</span>';}
    var h='<div class="g-exercise"><div class="g-ex-title"><span class="g-ex-num">'+exNum+'</span>'+esc(ex.title)+'</div>'+(ex.sub?'<div class="g-ex-sub">'+esc(ex.sub)+'</div>':'')+'<div id="'+eid+'-body">';
    var items=ex.items||ex.lines||[];
    if(ex.type==='gap'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.before)+'<input class="gap-inp" data-a="'+esc(it.answer)+'" id="'+eid+'_'+j+'">'+esc(it.after)+'</div></div>';
      });
    } else if(ex.type==='mc'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.q)+'</div><div class="opts" data-ans="'+esc(it.answer)+'" data-exp="'+esc(it.explanation||'')+'">'+
           it.opts.map(function(o){return '<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='transform'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.original)+'<br><span style="font-size:.85rem;color:var(--muted)">Use: <strong>'+esc(it.keyword)+'</strong></span></div><input class="txt-inp" data-a="'+esc(it.answer)+'" id="'+eid+'_'+j+'">'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='ec'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.wrong)+'</div><input class="txt-inp" data-a="'+esc(it.correct)+'" placeholder="Write the correct sentence" id="'+eid+'_'+j+'">'+fb(eid+'_f'+j)+(it.hint?'<div class="q-fb hint show" style="margin-top:6px">Hint: '+esc(it.hint)+'</div>':'')+'</div>';
      });
    } else if(ex.type==='tf'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+'<em>'+esc(it.context)+'</em><br>'+esc(it.statement)+'</div><div class="opts" data-ans="'+esc(it.answer)+'" data-exp="'+esc(it.explanation||'')+'">'+
           ['True','False','Not given'].map(function(o){return '<button class="opt" data-o="'+o+'">'+o+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='convo'){
      items.forEach(function(ln){
        var idx=0;
        var text=String(ln.text).replace(/\[([^\]]+)\]/g,function(m,ans){idx++;return '<input class="gap-inp" data-a="'+esc(ans)+'">';});
        h+='<div class="convo-line"><span class="convo-sp">'+esc(ln.speaker)+'</span><span>'+text+'</span></div>';
      });
    } else if(ex.type==='builder'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text"><span class="q-num">'+(j+1)+'</span><span style="font-size:.85rem;color:var(--muted)">'+esc(it.context||'')+'</span></div><div class="build-target" id="'+eid+'_t'+j+'" data-a="'+esc(it.answer)+'"></div><div class="build-bank" id="'+eid+'_b'+j+'">'+
           shuffle(it.words.slice()).map(function(w,k){return '<button class="word-chip" data-w="'+esc(w)+'">'+esc(w)+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='categorise'){
      var bank=[]; ex.categories.forEach(function(c){c.items.forEach(function(it){bank.push({w:it,cat:c.name});});});
      h+='<div class="cat-bank" id="'+eid+'-bank">'+shuffle(bank.slice()).map(function(b){return '<button class="cat-item" data-w="'+esc(b.w)+'" data-cat="'+esc(b.cat)+'">'+esc(b.w)+'</button>';}).join('')+'</div><div class="cat-cols" style="grid-template-columns:repeat('+Math.min(ex.categories.length,3)+',1fr)">'+
         ex.categories.map(function(c){return '<div class="cat-col"><div class="cat-col-h">'+esc(c.name)+'</div><div class="cat-drop" data-cat="'+esc(c.name)+'"></div></div>';}).join('')+'</div>';
    }
    h+='</div><button class="chk-btn" data-check="'+eid+'" data-type="'+ex.type+'">Check answers</button><button class="chk-link" data-show="'+eid+'">Show answers</button><span class="ex-score" id="'+eid+'-score"></span></div>';
    return {html:h, eid:eid, ex:ex};
  }
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

  // ---------- lesson rendering ----------
  var exReg={};
  function renderLesson(i){
    current=i; save(); exSeq=0; exReg={};
    var l=LESSONS[i];
    var nEx=(l.exercises||[]).length;
    var h='<div class="g-card" style="padding-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div class="g-eyebrow" style="margin-bottom:0">Lesson '+(i+1)+' of '+LESSONS.length+'</div><button class="g-export-btn" title="Save this lesson as a PNG image" aria-label="Save lesson as PNG image" onclick="exportLessonPNG('+i+',this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button></div>'+
      '<h2 class="g-lesson-title">'+esc(l.title)+'</h2>'+
      (l.subtitle?'<div class="g-lesson-sub">'+esc(l.subtitle)+'</div>':'')+
      (l.intro?'<div class="g-intro" style="margin-bottom:2px">'+l.intro+'</div>':'')+'</div>';
    h+='<div class="l-tabs"><button class="l-tab active" data-pane="learn">Learn</button><button class="l-tab" data-pane="practice">Practice'+(nEx?'<span class="l-tab-c">'+nEx+'</span>':'')+'</button></div>';
    var learn='<div class="g-card"><div class="g-body">'+(l.explanation||('<p>'+esc(l.desc||'')+'</p>'))+'</div>';
    if(l.table&&l.table.rows){learn+='<div class="g-sec-label">The forms</div><table class="g-table"><thead><tr>'+l.table.headers.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>'+l.table.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';}
    if(l.examples&&l.examples.length){learn+='<div class="g-sec-label">In action</div><div class="g-examples">'+l.examples.map(function(e){var t=e.type||'pos';var m=t==='neg'?'-':(t==='q'?'?':'+');return '<div class="g-ex '+t+'"><span class="g-ex-t">'+m+'</span><span class="g-ex-eng">'+esc(e.eng)+'</span>'+(e.note?'<div class="g-ex-note">'+esc(e.note)+'</div>':'')+'</div>';}).join('')+'</div>';}
    if(l.errors&&l.errors.length){learn+='<div class="g-sec-label">Watch out for</div><div class="g-errors">'+l.errors.map(function(e){return '<div class="g-err"><div class="g-err-line g-err-bad"><span class="mk">✗</span><span>'+esc(e.bad)+'</span></div><div class="g-err-line g-err-good"><span class="mk">✓</span><span>'+esc(e.good)+'</span></div><div class="g-err-reason">'+esc(e.reason)+'</div></div>';}).join('')+'</div>';}
    if(l.realUse&&l.realUse.length){learn+='<div class="g-sec-label">Real use</div><ul class="g-real">'+l.realUse.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul>';}
    if(l.tip){learn+='<div class="g-tip"><div><div class="g-tip-label">From John</div><p>'+l.tip+'</p></div></div>';}
    learn+='</div>';
    h+='<div class="l-pane show" id="pane-learn">'+learn+'</div>';
    var prac;
    if(nEx){
      prac='<div class="g-card"><div class="g-eyebrow">Practice</div><h3 class="g-lesson-title" style="font-size:1.25rem;margin:0 0 4px">Try it yourself</h3><p style="color:var(--muted);margin:0 0 20px;font-size:.92rem">'+nEx+' exercise'+(nEx>1?'s':'')+'. Type or click your answers, then check them.</p>';
      l.exercises.forEach(function(ex,xi){var r=renderExercise(ex,xi+1);exReg[r.eid]=r;prac+=r.html;});
      prac+='</div>';
    } else {
      prac='<div class="g-card"><p style="color:var(--muted);margin:0">Practice for this lesson is coming soon.</p></div>';
    }
    h+='<div class="l-pane" id="pane-practice">'+prac+'</div>';
    var isDone=!!done[l.id];
    h+='<div class="g-foot"><button class="g-complete'+(isDone?' done':'')+'" id="markBtn">'+(isDone?CHECK+' Completed':'Mark lesson complete')+'</button>'+
       '<button class="g-next" id="nextBtn"'+(i>=LESSONS.length-1?' disabled':'')+'>Next lesson '+ARROW+'</button></div>';
    lessonEl.innerHTML=h;
    renderRoad(); updateProgress();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ---------- interactions ----------
  document.addEventListener('click',function(e){
    var step=e.target.closest('.g-step'); if(step){renderLesson(+step.dataset.i);return;}
    var ltab=e.target.closest('.l-tab'); if(ltab){
      document.querySelectorAll('.l-tab').forEach(function(t){t.classList.remove('active');});
      ltab.classList.add('active');
      document.querySelectorAll('.l-pane').forEach(function(p){p.classList.remove('show');});
      var pane=document.getElementById('pane-'+ltab.dataset.pane); if(pane)pane.classList.add('show');
      var tr=document.querySelector('.l-tabs'); if(tr)window.scrollTo({top:tr.getBoundingClientRect().top+window.pageYOffset-16,behavior:'smooth'});
      return;
    }
    var mark=e.target.closest('#markBtn'); if(mark){var l=LESSONS[current];done[l.id]=!done[l.id];save();renderLesson(current);return;}
    var next=e.target.closest('#nextBtn'); if(next&&!next.disabled){renderLesson(Math.min(current+1,LESSONS.length-1));return;}
    var opt=e.target.closest('.opt'); if(opt&&!opt.disabled){handleOpt(opt);return;}
    var chip=e.target.closest('.word-chip'); if(chip){handleChip(chip);return;}
    var cat=e.target.closest('.cat-item'); if(cat){handleCat(cat);return;}
    var drop=e.target.closest('.cat-drop'); if(drop){handleDrop(drop);return;}
    var chk=e.target.closest('[data-check]'); if(chk){checkExercise(chk.dataset.check,chk.dataset.type);return;}
    var show=e.target.closest('[data-show]'); if(show){showAnswers(show.dataset.show);return;}
  });

  function handleOpt(opt){
    var box=opt.parentNode; if(box.dataset.answered)return; box.dataset.answered='1';
    var ans=box.dataset.ans, exp=box.dataset.exp;
    var ok=opt.dataset.o===ans;
    Array.prototype.forEach.call(box.children,function(b){b.disabled=true;if(b.dataset.o===ans)b.classList.add(ok?'correct':'reveal');});
    if(!ok)opt.classList.add('wrong');
    var fbEl=box.parentNode.querySelector('.q-fb');
    if(fbEl){fbEl.className='q-fb show '+(ok?'ok':'no');fbEl.innerHTML=(ok?'Correct. ':'Not quite. ')+esc(exp||'');}
  }
  function handleChip(chip){
    var q=chip.closest('.q'); var target=q.querySelector('.build-target');
    if(chip.parentNode.classList.contains('build-bank')){chip.classList.add('used');var c=chip.cloneNode(true);c.classList.remove('used');c.dataset.from=chip.dataset.w;target.appendChild(c);}
    else{ // remove from target, re-enable in bank
      var w=chip.dataset.w; chip.remove();
      var bankChip=q.querySelector('.build-bank .word-chip.used[data-w="'+CSS.escape(w)+'"]');
      if(bankChip)bankChip.classList.remove('used');
    }
  }
  var catSel=null;
  function handleCat(item){
    if(item.classList.contains('placed'))return;
    if(catSel)catSel.classList.remove('sel');
    if(catSel===item){catSel=null;return;}
    item.classList.add('sel');catSel=item;
  }
  function handleDrop(drop){
    if(!catSel)return;
    catSel.classList.remove('sel');catSel.classList.add('placed');
    drop.appendChild(catSel);catSel=null;
  }

  function checkExercise(eid,type){
    var r=exReg[eid]; if(!r)return; var body=document.getElementById(eid+'-body');
    var correct=0,total=0;
    if(type==='gap'||type==='convo'){
      body.querySelectorAll('.gap-inp').forEach(function(inp){total++;var ok=accepts(inp.value,inp.dataset.a);inp.classList.remove('correct','wrong');inp.classList.add(ok?'correct':'wrong');inp.disabled=true;if(ok)correct++;});
    } else if(type==='transform'||type==='ec'){
      body.querySelectorAll('.txt-inp').forEach(function(inp,j){total++;var ok=accepts(inp.value,inp.dataset.a);inp.classList.remove('correct','wrong');inp.classList.add(ok?'correct':'wrong');inp.disabled=true;if(ok)correct++;
        var f=document.getElementById(eid+'_f'+j);if(f&&!ok){f.className='q-fb show no';f.innerHTML='Answer: '+esc(inp.dataset.a.split('/')[0]);}else if(f){f.className='q-fb show ok';f.innerHTML='Correct';}});
    } else if(type==='mc'||type==='tf'){
      body.querySelectorAll('.opts').forEach(function(box){total++;if(box.dataset.answered&&box.querySelector('.wrong')===null&&box.querySelector('.correct'))correct++;else if(!box.dataset.answered){/*auto-reveal*/var ans=box.dataset.ans;Array.prototype.forEach.call(box.children,function(b){b.disabled=true;if(b.dataset.o===ans)b.classList.add('reveal');});}});
    } else if(type==='builder'){
      body.querySelectorAll('.build-target').forEach(function(t,j){total++;var built=Array.prototype.map.call(t.children,function(c){return c.dataset.w;}).join(' ');var ok=accepts(built,t.dataset.a);t.style.borderColor=ok?'var(--sea)':'var(--coral)';t.style.background=ok?'var(--sea-tint)':'var(--coral-tint)';if(ok)correct++;var f=document.getElementById(eid+'_f'+j);if(f){f.className='q-fb show '+(ok?'ok':'no');f.innerHTML=ok?'Correct':('Answer: '+esc(t.dataset.a.split('/')[0]));}});
    } else if(type==='categorise'){
      body.querySelectorAll('.cat-drop').forEach(function(drop){var cat=drop.dataset.cat;drop.querySelectorAll('.cat-item').forEach(function(it){total++;var ok=it.dataset.cat===cat;it.classList.add(ok?'correct':'wrong');if(ok)correct++;});});
    }
    var sc=document.getElementById(eid+'-score'); if(sc){sc.className='ex-score show';sc.textContent=correct+' / '+total;}
  }
  function showAnswers(eid){
    var r=exReg[eid]; if(!r)return; var ex=r.ex, body=document.getElementById(eid+'-body');
    if(ex.type==='gap'||ex.type==='convo'){body.querySelectorAll('.gap-inp').forEach(function(inp){inp.value=inp.dataset.a.split('/')[0];inp.classList.add('correct');inp.disabled=true;});}
    else if(ex.type==='transform'||ex.type==='ec'){body.querySelectorAll('.txt-inp').forEach(function(inp){inp.value=inp.dataset.a.split('/')[0];inp.classList.add('correct');inp.disabled=true;});}
    else if(ex.type==='mc'||ex.type==='tf'){body.querySelectorAll('.opts').forEach(function(box){var ans=box.dataset.ans;Array.prototype.forEach.call(box.children,function(b){b.disabled=true;if(b.dataset.o===ans)b.classList.add('reveal');});});}
    else if(ex.type==='builder'){body.querySelectorAll('.build-target').forEach(function(t){t.innerHTML='';t.dataset.a.split('/')[0].trim().split(' ').forEach(function(w){var c=document.createElement('span');c.className='word-chip';c.textContent=w;t.appendChild(c);});});}
    else if(ex.type==='categorise'){var bank=document.getElementById(eid+'-bank');body.querySelectorAll('.cat-drop').forEach(function(drop){var cat=drop.dataset.cat;});body.querySelectorAll('.cat-item').forEach(function(it){var target=body.querySelector('.cat-drop[data-cat="'+CSS.escape(it.dataset.cat)+'"]');if(target){it.classList.remove('sel');it.classList.add('placed','correct');target.appendChild(it);}});}
  }

  renderLesson(Math.min(current,LESSONS.length-1));
})();
</script>
<script>
/* High-res PNG export of the current lesson's Learn content, via html2canvas
   (same library/CDN used elsewhere on the site - no canvas taint). */
(function(){
  var H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  function loadH2C(){return new Promise(function(res,rej){if(typeof html2canvas!=='undefined')return res();var s=document.createElement('script');s.src=H2C;s.onload=function(){res();};s.onerror=function(){rej(new Error('html2canvas failed to load'));};document.head.appendChild(s);});}
  window.exportLessonPNG=function(i,btn){
    var titleEl=document.querySelector('.g-lesson-title');
    var subEl=document.querySelector('.g-lesson-sub');
    var learn=document.querySelector('#pane-learn .g-card');
    if(!titleEl||!learn) return;
    var eyebrow=document.querySelector('.g-title')?document.querySelector('.g-title').textContent.trim():'Grammar';
    var id=(window.LESSONS&&LESSONS[i])?LESSONS[i].id:'lesson';
    var fileslug=(eyebrow.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'grammar')+'-'+id;
    var orig; if(btn){orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span style="font-size:.7rem;font-weight:700;line-height:1">…</span>';}
    var host=document.createElement('div');host.style.cssText='position:fixed;left:-100000px;top:0;z-index:-1;pointer-events:none';
    var card=document.createElement('div');card.className='png-export-card';
    card.innerHTML='<div class="pec-inner"><div class="pec-eyebrow">'+eyebrow+'</div><h2 class="pec-title">'+titleEl.innerHTML+'</h2>'+(subEl?'<div class="pec-sub">'+subEl.innerHTML+'</div>':'')+'<div class="pec-body">'+learn.innerHTML+'</div><div class="pec-foot"><b>johnplusenglish</b> &nbsp;·&nbsp; English grammar, one lesson at a time</div></div>';
    host.appendChild(card);document.body.appendChild(host);
    var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready.catch(function(){}):Promise.resolve();
    loadH2C().then(function(){return ready;}).then(function(){
      return html2canvas(card,{scale:3,backgroundColor:'#F7F6F3',useCORS:true,logging:false,width:card.offsetWidth,height:card.offsetHeight});
    }).then(function(canvas){
      var link=document.createElement('a');link.download=fileslug+'.png';link.href=canvas.toDataURL('image/png');
      document.body.appendChild(link);link.click();document.body.removeChild(link);
    }).catch(function(err){console.error('PNG export failed:',err);alert('Sorry, the image export failed. Please check your connection and try again.');}).then(function(){
      if(host.parentNode)host.parentNode.removeChild(host);
      if(btn){btn.disabled=false;if(orig!=null)btn.innerHTML=orig;}
    });
  };
})();
</script>
