<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B1 Grammar - johnplusenglish</title>
<meta name="description" content="B1 grammar, one lesson at a time. Work through 15 core B1 structures with clear explanations in plain English and practice that checks itself.">
<script src="lock.js"></script>
<script src="/assets/deeplink.js"></script>
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --cream:#F7F6F3; --card:#fff; --ink:#2D3047; --muted:#8A8D9A;
  --border:#E8E5DF; --line:#EFEDE7;
  --sky:#2176FF; --sky-tint:#EAF2FE;
  --sea:#1DD3B0; --sea-d:#0F7D71; --sea-tint:#E4FBF7; --sea-bd:rgba(29,211,176,.4);
  --coral:#FF6B6B; --coral-d:#C0392B; --coral-tint:#FDECEC;
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}
.topnav{display:none}
a{color:var(--sky);text-decoration:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:32px 24px 80px}

/* header */
.g-head{display:flex;align-items:flex-start;gap:16px;margin:0 0 8px}
.g-badge{width:52px;height:52px;border-radius:14px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--sky)}
.g-badge svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g-title{font-size:2rem;font-weight:900;letter-spacing:-.02em;margin:0;line-height:1.05}
.g-sub{font-size:1rem;color:var(--muted);margin:4px 0 0;max-width:56ch}
.g-progwrap{margin:22px 0 26px}
.g-progline{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 8px}
.g-progline strong{color:var(--ink)}
.g-progbar{height:8px;border-radius:5px;background:var(--border);overflow:hidden}
.g-progfill{height:100%;width:0;background:var(--sea);border-radius:5px;transition:width .4s}

/* layout */
.g-layout{display:grid;grid-template-columns:288px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.g-layout{grid-template-columns:1fr}.g-road{position:static !important;max-height:none !important}}

/* roadmap sidebar */
.g-road{position:sticky;top:20px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:8px;max-height:calc(100vh - 40px);overflow:auto}
.g-road-head{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:12px 12px 8px}
.g-step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;font-family:inherit;cursor:pointer;padding:11px 12px;border-radius:10px;color:var(--ink);transition:background .15s}
.g-step:hover{background:var(--cream)}
.g-step.active{background:var(--sky-tint)}
.g-step-n{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:1.5px solid var(--border);color:var(--muted);background:var(--card)}
.g-step.active .g-step-n{border-color:var(--sky);color:var(--sky)}
.g-step.done .g-step-n{background:var(--sea);border-color:var(--sea);color:#fff}
.g-step-n svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g-step-t{font-size:.9rem;font-weight:600;line-height:1.3;min-width:0}
.g-step.active .g-step-t{color:var(--sky)}

/* lesson pane */
.g-lesson{min-width:0}
.g-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:30px 32px;margin:0 0 20px}
.g-eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);margin:0 0 6px}
.g-lesson-title{font-size:1.6rem;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;line-height:1.1}
.g-lesson-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:0 0 18px}
/* in-lesson folder tabs (matches site) */
.l-tabs{display:flex;gap:4px;position:relative;margin:6px 0 20px;align-items:flex-end;flex-wrap:wrap;padding-top:6px}
.l-tabs::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.l-tab{position:relative;font-family:inherit;font-size:.92rem;font-weight:700;padding:.55rem 1.5rem;color:var(--muted);cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1.5px solid var(--border);border-radius:12px 12px 0 0;transition:background .18s,color .18s}
.l-tab:hover{color:var(--ink)}
.l-tab.active{background:var(--cream);border-color:var(--sky);border-bottom:1.5px solid var(--cream);color:var(--sky);z-index:2}
.l-tab .l-tab-c{font-weight:600;opacity:.6;margin-left:7px}
.l-pane{display:none}
.l-pane.show{display:block}
/* soft circular number badges (match the roadmap) */
.g-ex-num{display:inline-flex;width:27px;height:27px;border-radius:50%;background:var(--sky);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;margin-right:12px;vertical-align:-6px;font-variant-numeric:tabular-nums}
.q-num{display:inline-flex;width:25px;height:25px;border-radius:50%;background:var(--sky-tint);color:var(--sky);align-items:center;justify-content:center;font-weight:700;font-size:.78rem;margin-right:11px;vertical-align:-5px;font-variant-numeric:tabular-nums}
.g-intro{font-size:1.05rem;font-weight:500;color:var(--ink);background:var(--sky-tint);border-radius:12px;padding:16px 20px;margin:0 0 22px}
.g-body{font-size:1rem}
.g-body p{margin:0 0 14px}
.g-body strong{font-weight:700}
.g-body em{font-style:italic;color:var(--ink)}
.g-body .rule{display:flex;gap:14px;align-items:flex-start;background:none;border:none;padding:0;margin:0 0 15px}
.g-body .rule-num{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--sea);margin-top:10px;font-size:0;color:transparent}
.g-body .rule-text{font-size:1rem;line-height:1.62}
.g-body .note{background:var(--sea-tint);border:none;border-radius:14px;padding:16px 20px;margin:20px 0 4px;font-size:.96rem;line-height:1.65}
.g-body .note strong{color:var(--sea-d)}

.g-sec-label{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:34px 0 16px}

table.g-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin:0 0 8px}
.g-table th{background:var(--cream);text-align:left;font-weight:700;padding:11px 14px;border-bottom:1.5px solid var(--border);font-size:.82rem}
.g-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.g-table tr:last-child td{border-bottom:none}
.g-table td:first-child{font-weight:600;color:var(--muted);white-space:nowrap}

/* In action - airy 2-column grid, no boxes, no dividers */
.g-examples{display:grid;grid-template-columns:1fr 1fr;gap:4px 34px;margin:0 0 4px}
@media(max-width:660px){.g-examples{grid-template-columns:1fr}}
.g-ex{padding:11px 0;background:none;border:none;display:block}
.g-ex-t{font-weight:800;font-size:.82rem;margin-right:10px}
.g-ex.pos .g-ex-t{color:var(--sea-d)}
.g-ex.neg .g-ex-t,.g-ex.q .g-ex-t{color:var(--sky)}
.g-ex-eng{font-weight:600;font-size:1rem}
.g-ex-note{font-size:.85rem;color:var(--muted);margin:3px 0 0 23px}

/* Watch out for - airy colour-coded pairs, no boxes, no dividers */
.g-errors{display:flex;flex-direction:column;gap:22px;margin:0 0 4px}
.g-err{background:none;border:none;padding:0}
.g-err-line{display:flex;gap:9px;align-items:baseline;font-size:.98rem;line-height:1.45}
.g-err-line .mk{flex:0 0 auto;font-weight:800;font-size:.9rem}
.g-err-bad{color:var(--coral-d)}.g-err-bad .mk{color:var(--coral)}
.g-err-good{color:var(--sea-d);font-weight:600;margin-top:3px}.g-err-good .mk{color:var(--sea-d)}
.g-err-reason{font-size:.85rem;color:var(--muted);margin:7px 0 0 23px}

.g-real{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.g-real li{position:relative;padding:0 0 0 22px;font-size:.96rem;line-height:1.55;border:none}
.g-real li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--sky)}

.g-tip{display:flex;gap:12px;background:var(--sea-tint);border:1.5px solid var(--sea-bd);border-radius:12px;padding:15px 18px;margin:22px 0 0}
.g-tip-label{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sea-d);margin:0 0 3px}
.g-tip p{margin:0;font-size:.95rem;line-height:1.55}

/* exercises */
.g-exercise{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:22px 24px;margin:0 0 16px}
.g-ex-title{font-size:1.05rem;font-weight:700;margin:0 0 2px}
.g-ex-sub{font-size:.9rem;color:var(--muted);margin:0 0 16px}
.q{padding:16px 0;border:none}
.q-text{font-size:1rem;margin:0 0 10px;line-height:1.75}
.gap-inp,.txt-inp{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;padding:.4rem .6rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);outline:none;transition:border-color .2s,background .2s}
.gap-inp{width:150px;text-align:center}
.txt-inp{width:100%;max-width:520px}
.gap-inp:focus,.txt-inp:focus{border-color:var(--sky)}
.gap-inp.correct,.txt-inp.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.gap-inp.wrong,.txt-inp.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0}
.opt{font-family:inherit;font-size:.95rem;font-weight:600;text-align:left;padding:.7rem 1rem;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.opt.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opt.reveal{border-color:var(--sea);color:var(--sea-d)}
.opt:disabled{cursor:default}
.q-fb{font-size:.88rem;margin-top:8px;padding:8px 12px;border-radius:8px;display:none}
.q-fb.show{display:block}
.q-fb.ok{background:var(--sea-tint);color:var(--sea-d)}
.q-fb.no{background:var(--coral-tint);color:var(--coral-d)}
.q-fb.hint{background:var(--cream);color:var(--muted)}
.chk-btn{font-family:inherit;font-weight:700;font-size:.88rem;color:#fff;background:var(--sky);border:none;border-radius:10px;padding:.6rem 1.3rem;cursor:pointer;margin-top:14px;transition:background .15s}
.chk-btn:hover{background:#175fd0}
.chk-link{font-family:inherit;font-weight:600;font-size:.82rem;color:var(--muted);background:none;border:none;cursor:pointer;margin-left:12px}
.chk-link:hover{color:var(--coral)}
.ex-score{font-size:.85rem;font-weight:700;color:var(--sea-d);margin-left:12px;display:none}
.ex-score.show{display:inline}

/* builder */
.build-target{min-height:44px;border:1.5px dashed var(--border);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;background:var(--cream)}
.build-bank{display:flex;flex-wrap:wrap;gap:6px}
.word-chip{font-family:inherit;font-size:.9rem;font-weight:600;padding:.35rem .7rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.word-chip:hover{border-color:var(--ink)}
.word-chip.used{opacity:.35;pointer-events:none}
.build-target .word-chip{background:var(--sky-tint);border-color:var(--sky)}

/* categorise */
.cat-cols{display:grid;gap:12px;margin:0 0 12px}
.cat-col{border:1.5px solid var(--border);border-radius:12px;padding:12px;min-height:70px;background:var(--card)}
.cat-col-h{font-size:.8rem;font-weight:700;color:var(--ink);margin:0 0 8px}
.cat-drop{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.cat-bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cat-item{font-family:inherit;font-size:.9rem;font-weight:600;padding:.4rem .8rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.cat-item.sel{border-color:var(--sky);background:var(--sky-tint);color:var(--sky)}
.cat-item.placed{background:var(--cream)}
.cat-item.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.cat-item.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}

/* convo */
.convo-line{display:flex;gap:10px;padding:8px 0;font-size:.98rem;line-height:1.8}
.convo-sp{font-weight:800;color:var(--sky);flex:0 0 auto;width:22px}

/* footer nav */
.g-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 0}
.g-complete{font-family:inherit;font-weight:700;font-size:.92rem;color:#fff;background:var(--sea);border:none;border-radius:12px;padding:.75rem 1.5rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.g-complete:hover{background:var(--sea-d)}
.g-complete.done{background:var(--sea-tint);color:var(--sea-d);border:1.5px solid var(--sea-bd)}
.g-complete svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next{font-family:inherit;font-weight:700;font-size:.92rem;color:var(--ink);background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.75rem 1.4rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s}
.g-next:hover{border-color:var(--ink)}
.g-next svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next[disabled]{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

/* ── PNG export ── */
.g-export-btn{background:none;border:1.5px solid var(--border);border-radius:9px;padding:.34rem .5rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;flex:0 0 auto;font-family:inherit}
.g-export-btn:hover{border-color:var(--sky);color:var(--sky)}
.g-export-btn:disabled{opacity:.55;cursor:default;border-color:var(--border);color:var(--muted)}
.g-export-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.png-export-card{width:800px;box-sizing:border-box;background:var(--cream);padding:38px;font-family:'Outfit',sans-serif;color:var(--ink)}
.pec-inner{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:34px 36px 26px}
.pec-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:0 0 10px}
.pec-title{font-size:1.7rem;font-weight:900;letter-spacing:-.01em;margin:0;line-height:1.12}
.pec-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:5px 0 0}
.pec-body{margin-top:22px}
.pec-body>.g-body>*:first-child{margin-top:0}
.pec-body .g-sec-label:first-child{margin-top:6px}
.pec-foot{margin-top:28px;padding-top:16px;border-top:1.5px solid var(--border);font-size:.75rem;font-weight:600;color:var(--muted)}
.pec-foot b{color:var(--sky);font-weight:800}
</style>
</head>

<script>const LESSONS=[{"id":"ppc","title":"Present perfect continuous","subtitle":"I've been working, she's been waiting","intro":"Still happening, or only just stopped. The trick with this tense is to focus on the activity itself, not the finished result.","desc":"The present perfect continuous connects an ongoing or recently finished activity to the present. Unlike the present perfect simple, it emphasises duration and the activity itself.","tip":"Here is the question I give my own students: result or activity? <em>\"I have read the report\"<\/em> is a result, it is done and dusted. <em>\"I have been reading the report\"<\/em> is the activity, and I might still be at it. Once you can feel that split, this tense stops being tricky.","explanation":"<p>We build the present perfect continuous with <strong>have/has + been + verb-ing<\/strong>. It ties an activity from the past to right now, whether that activity is still going or has only just stopped.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Duration up to now<\/strong> - started in the past, still continuing. <em>\"I have been learning English for three years.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Recent activity with a present result<\/strong> - just stopped, effects still visible. <em>\"You look tired. Have you been running?\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Repeated or ongoing activity<\/strong> - happening again and again over a period. <em>\"I have been calling you all morning!\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>One to watch:<\/strong> state verbs (know, love, believe, own) never take the continuous. So it is <em>\"I have known her for years,\"<\/em> never <em>\"I have been knowing her.\"<\/em><\/div>","table":{"headers":["Form","I / You / We / They","He / She / It"],"rows":[["Positive","I've been working","She's been waiting"],["Negative","I haven't been sleeping","He hasn't been eating well"],["Question","Have you been waiting long?","Has she been crying?"],["Key words","for, since, all morning/day/week, lately, recently"," - "]]},"examples":[{"type":"pos","eng":"I've been studying for four hours.","note":"Duration - still studying or just stopped."},{"type":"pos","eng":"She's been living in Madrid since 2019.","note":"Ongoing situation - still living there."},{"type":"pos","eng":"You look exhausted. Have you been working out?","note":"Recent activity visible in the present."},{"type":"neg","eng":"He hasn't been sleeping well lately.","note":"Ongoing negative pattern."}],"errors":[{"bad":"I've been knowing her for years.","good":"I've known her for years.","reason":"Know is a state verb - no continuous form in any tense, including present perfect."},{"bad":"She has been finished the report.","good":"She has finished the report.","reason":"Finished is a result - use present perfect simple. Continuous would suggest it's still in progress."},{"bad":"How long are you waiting?","good":"How long have you been waiting?","reason":"Duration up to now - present perfect continuous, not present continuous."}],"realUse":[],"exercises":[{"type":"gap","title":"Form the present perfect continuous","sub":"Fill each gap with the present perfect continuous form of the verb in brackets.","items":[{"answer":"have been waiting","before":"I ","after":" for you for half an hour! (wait)"},{"answer":"has been raining","before":"It ","after":" all day. (rain)"},{"answer":"have been working","before":"They ","after":" on this project since January. (work)"},{"answer":"has been feeling","before":"She ","after":" unwell lately. (feel)"},{"answer":"have been trying","before":"I ","after":" to call you all morning. (try)"},{"answer":"has been living","before":"He ","after":" in Barcelona for five years. (live)"},{"answer":"have been studying","before":"We ","after":" for the exam all week. (study)"},{"answer":"has been crying","before":"Her eyes are red - she ","after":". (cry)"}]},{"type":"mc","title":"Simple or continuous?","sub":"Choose the most natural form.","items":[{"q":"I _____ three cups of coffee today. (result/quantity)","opts":["'ve been drinking","'ve drunk","'ve been drunk","drink"],"answer":"'ve drunk","explanation":"Three cups = completed quantity/result → present perfect simple."},{"q":"I _____ coffee all morning. (activity/duration)","opts":["drunk","'ve drunk","'ve been drinking","drink"],"answer":"'ve been drinking","explanation":"All morning = duration of activity → present perfect continuous."},{"q":"She _____ French for two years and she's really good now.","opts":["has learned","has been learning","is learning","learned"],"answer":"has been learning","explanation":"Duration of an ongoing activity → present perfect continuous."},{"q":"He _____ the report. Here it is.","opts":["has been finishing","has finished","finished","is finishing"],"answer":"has finished","explanation":"Result (here it is) → present perfect simple."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"She started crying an hour ago and is still crying.","keyword":"been","answer":"She has been crying for an hour. / She's been crying for an hour."},{"original":"They started arguing last week and are still arguing.","keyword":"have","answer":"They have been arguing since last week."},{"original":"You started waiting some time ago. Ask how long.","keyword":"How long have","answer":"How long have you been waiting?"},{"original":"I called you many times this morning.","keyword":"been","answer":"I've been calling you all morning."},{"original":"You noticed she looks tired. Ask if she has been working late.","keyword":"Have","answer":"Have you been working late?"}]}]},{"id":"pastperfect","title":"Past perfect","subtitle":"I had already eaten, she had never seen","intro":"The past before the past. Once you can put two past events in the right order, this tense clicks into place.","desc":"The past perfect describes an action that happened before another past action. It is the tense of sequence - it tells us which thing happened first.","tip":"Here is what my students always ask me: <em>can't I just use the past simple twice?<\/em> Sometimes you can, when the order is already obvious. But when you need to show that one thing happened <em>before<\/em> another, the past perfect does that job for you. Compare <strong>\"When I arrived, she left\"<\/strong> (she left after I got there) with <strong>\"When I arrived, she had left\"<\/strong> (she was already gone). That little <em>had<\/em> rewinds the clock.","explanation":"<p>The past perfect is formed with <strong>had + past participle<\/strong> - the same participle as the present perfect. It describes an action that happened <strong>before another past action or moment<\/strong>.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Sequencing past events<\/strong> - when two things happened in the past and you need to be clear which came first. <em>\"When I arrived, she had already left.\"<\/em> She left first - that is the past perfect event.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Past context for a story<\/strong> - providing background before the main narrative. <em>\"He was nervous because he had never spoken in public before.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>With reporting and conditionals<\/strong> - in reported speech and third conditional. <em>\"She said she had already eaten.\"<\/em> / <em>\"If I had known, I would have called.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Words that often signal the past perfect:<\/strong> already, just, never, yet, by the time, before, after, when, as soon as, once.<br><em>\"By the time he arrived, we had finished.\"<\/em> - <em>by the time<\/em> almost always pushes the earlier event into the past perfect.<br>One thing I always add for my students: you do not <em>always<\/em> need it. If <em>before<\/em> or <em>after<\/em> already makes the order clear, the past simple is fine - <em>\"I ate before she arrived.\"<\/em><\/div>","table":{"headers":["Form","All subjects"],"rows":[["Positive","I/you/he/she/we/they had finished - I'd finished"],["Negative","I hadn't eaten. / She hadn't arrived."],["Question","Had you met before? / Had she left?"],["Short answer","Yes, I had. / No, she hadn't."],["Common with","already, just, never, yet, by the time, when, before, after"]]},"examples":[{"type":"pos","eng":"By the time we arrived, the film had already started.","note":"By the time + past simple, past perfect for the earlier event."},{"type":"pos","eng":"She was exhausted because she had worked all night.","note":"Background explanation for a past state."},{"type":"pos","eng":"I had never eaten sushi before that trip.","note":"First-time experience at a point in the past."},{"type":"neg","eng":"He hadn't read the report when the meeting started.","note":"Something not done before a past moment."}],"errors":[{"bad":"When I arrived, she already left.","good":"When I arrived, she had already left.","reason":"Already with a past event signals the past perfect - she left before you arrived."},{"bad":"I didn't eat because I hadn't hungry.","good":"I didn't eat because I wasn't hungry.","reason":"Hungry is an adjective, not a verb - use wasn't, not hadn't."},{"bad":"By the time they came, we finished.","good":"By the time they came, we had finished.","reason":"By the time almost always requires past perfect for the completed earlier action."}],"realUse":[],"exercises":[{"type":"gap","title":"Past perfect - form","sub":"Fill each gap with the past perfect form of the verb in brackets.","items":[{"answer":"had already started","before":"By the time we arrived, the film ","after":". (already start)"},{"answer":"had tried","before":"It was the first time she ","after":" Thai food. (try)"},{"answer":"hadn't slept","before":"He was exhausted because he ","after":" for two days. (not sleep)"},{"answer":"had finished","before":"When I called, they ","after":" the meeting. (finish)"},{"answer":"had been","before":"She told me she ","after":" to Paris three times. (be)"},{"answer":"hadn't eaten","before":"I was starving - I ","after":" since breakfast. (not eat)"},{"answer":"had forgotten","before":"He looked embarrassed. He ","after":" her name. (forget)"},{"answer":"had just left","before":"When I arrived, she ","after":". (just leave)"}]},{"type":"mc","title":"Past simple or past perfect?","sub":"Choose the correct tense.","items":[{"q":"When I _____ home, my flatmate _____ already cooked dinner.","opts":["got / had","had got / had","got / has","had got / has"],"answer":"got / had","explanation":"Two past events - got home is the reference point, had cooked happened before it."},{"q":"She was nervous because she _____ never spoken to such a large audience.","opts":["has","had","didn't","was"],"answer":"had","explanation":"Background explanation before a past event - past perfect."},{"q":"By the time the police _____, the thieves _____ escaped.","opts":["arrived / had","had arrived / had","arrived / have","had arrived / have"],"answer":"arrived / had","explanation":"By the time + past simple, past perfect for the earlier completed action."},{"q":"When I finally _____ home, my family _____ dinner without me.","opts":["got / had already eaten","had got / ate","got / already ate","have got / ate"],"answer":"got / had already eaten","explanation":"The family finished dinner before you arrived, so the earlier action takes the past perfect ('had eaten'), and 'already' stresses it was complete. 'Got' is the later action, in past simple."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"She left. Then I arrived.","keyword":"by the time","answer":"By the time I arrived, she had left."},{"original":"He never visited Rome before that trip.","keyword":"had never","answer":"He had never visited Rome before that trip."},{"original":"They finished dinner. Then we arrived.","keyword":"already","answer":"When we arrived, they had already finished dinner."},{"original":"I didn't know her. Then we met at the conference.","keyword":"hadn't","answer":"I hadn't met her before the conference."},{"original":"She studied hard. That's why she passed.","keyword":"because","answer":"She passed because she had studied hard."}]}]},{"id":"usedto","title":"Used to / would","subtitle":"I used to live there, we would always meet","intro":"Talking about past habits and states that no longer exist. Two options here, and knowing when each one works is a real B1 skill.","desc":"Both used to and would can describe past habits - but they are not always interchangeable. Getting this distinction right is a genuine B1 skill.","tip":"Here is the trap I watch my students fall into: they learn <em>used to<\/em>, love it, and start using it everywhere. Then they try <em>would<\/em> for a past state and it breaks. Remember this - <em>would<\/em> is the more literary, nostalgic option, but it can only describe repeated <em>actions<\/em>, never states. <strong>\"I would be shy\"<\/strong> is wrong. For a past state, <strong>\"I used to be shy\"<\/strong> is your only choice.","explanation":"<p><strong>Used to<\/strong> and <strong>would<\/strong> both describe past habits and repeated actions that no longer happen. But they work differently.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Used to<\/strong> - past habits AND past states. The most versatile form. <em>\"I used to smoke.\"<\/em> (habit) / <em>\"We used to live near the sea.\"<\/em> (state) / <em>\"She used to be very shy.\"<\/em> (state)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Would<\/strong> - past habits and repeated actions only. More literary/nostalgic in tone. <em>\"Every summer, we would drive to the coast.\"<\/em> / <em>\"He would always bring flowers.\"<\/em> Cannot be used for states.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Neither implies<\/strong> the habit still continues - both signal it has stopped. If it still continues, use the present simple or present continuous.<\/div><\/div>\n<div class=\"note\"><strong>Would for states is always wrong:<\/strong><br><em>\"I would be shy as a child.\"<\/em> ✗ → <em>\"I used to be shy.\"<\/em> ✓<br><em>\"We would live in Rome.\"<\/em> ✗ → <em>\"We used to live in Rome.\"<\/em> ✓<br>State verbs (be, have, know, live, believe, own) only take <em>used to<\/em>.<br>And watch the spelling in the negative and question: <em>didn't use to<\/em> / <em>Did you use to...?<\/em> - no final -d once <em>did<\/em> is doing the work.<\/div>","table":{"headers":["Form","Used to","Would"],"rows":[["Positive","I used to play tennis.","We would meet every Friday."],["Negative","I didn't use to like it.","(would not used for negatives of habits)"],["Question","Did you use to live here?","(not used in questions about habits)"],["States","I used to be very shy. ✓","I would be very shy. ✗"],["Actions/habits","I used to run every day. ✓","I would run every day. ✓"],["Tone","Neutral","Nostalgic, literary, narrative"]]},"examples":[{"type":"pos","eng":"I used to hate vegetables as a child.","note":"Past state/attitude - used to only."},{"type":"pos","eng":"Every evening, my grandmother would tell us stories.","note":"Repeated past action - would for nostalgic narrative."},{"type":"pos","eng":"We used to have a dog, but he died.","note":"Past state (having) - used to only."},{"type":"neg","eng":"She didn't use to drink coffee.","note":"Negative - didn't use to (no d at end)."}],"errors":[{"bad":"I would be very nervous before exams.","good":"I used to be very nervous before exams.","reason":"Be is a state verb - would cannot describe past states."},{"bad":"She didn't used to eat meat.","good":"She didn't use to eat meat.","reason":"After didn't, the -d is dropped: didn't use to."},{"bad":"Did you used to play football?","good":"Did you use to play football?","reason":"After did, the -d is dropped: did you use to."}],"realUse":[],"exercises":[{"type":"gap","title":"Used to or would?","sub":"Fill each gap with used to or would. Both may be correct in some cases - mark which is wrong.","items":[{"answer":"used to be","before":"She ","after":" very quiet as a child. (state)"},{"answer":"would walk / used to walk","before":"We ","after":" to school together every day. (habit - both OK)"},{"answer":"used to have","before":"They ","after":" a house by the sea. (state)"},{"answer":"would read / used to read","before":"My father ","after":" to us every night. (repeated action - both OK)"},{"answer":"used to believe","before":"I ","after":" in ghosts when I was young. (state)"},{"answer":"would play / used to play","before":"As children we ","after":" in the garden all day. (habit - both OK)"}]},{"type":"mc","title":"Which is correct?","sub":"Choose the correct option.","items":[{"q":"I _____ very shy as a teenager.","opts":["would be","used to be","used to being","would being"],"answer":"used to be","explanation":"Be = state verb. Would cannot describe past states - only used to."},{"q":"Every Sunday, my mother _____ us to the market.","opts":["used to take","would take","would be taking","used taking"],"answer":"would take","explanation":"Repeated past action with nostalgic tone - would is natural. Used to also correct."},{"q":"_____ you use to live near here?","opts":["Did","Would","Used","Have"],"answer":"Did","explanation":"Question form of used to: Did + subject + use to (no d)."},{"q":"She _____ own a café in the old town.","opts":["would","used to","was used to","did use"],"answer":"used to","explanation":"Own = state verb. Would cannot be used - only used to."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"As a child, she was very shy. Now she's confident.","keyword":"used to","answer":"She used to be very shy, but now she's confident."},{"original":"He smoked, but he stopped years ago.","keyword":"used to","answer":"He used to smoke, but he stopped years ago."},{"original":"Every Friday we had dinner together. It was a tradition.","keyword":"would","answer":"Every Friday we would have dinner together."},{"original":"Did she live here before?","keyword":"use to","answer":"Did she use to live here?"},{"original":"I didn't like fish when I was young.","keyword":"didn't use","answer":"I didn't use to like fish."}]}]},{"id":"passive","title":"Passive voice","subtitle":"The report was written, it is made in Spain","intro":"When the action matters more than who did it. English leans on the passive far more than most languages, so it is worth getting comfortable with.","desc":"The passive shifts the focus from the doer to the receiver of the action. It is extremely common in English - especially in formal writing, news, and academic contexts.","tip":"A lot of my students avoid the passive because it feels heavy or formal. But it is simply how English works when the doer does not matter. <strong>\"Someone built this bridge in 1890\"<\/strong> sounds clumsy; <strong>\"This bridge was built in 1890\"<\/strong> is what a native speaker actually says. So the real skill is spotting when the doer is unknown, unimportant, or already obvious - and then stepping it out of the way.","explanation":"<p>The passive is formed with <strong>be + past participle<\/strong>. The tense of <em>be<\/em> changes to show when the action happened. The original subject (the doer) can be added with <em>by<\/em>, but is often omitted.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>When to use the passive:<\/strong> the doer is unknown (<em>\"My bike was stolen.\"<\/em>), unimportant (<em>\"The road is being repaired.\"<\/em>), or obvious from context (<em>\"He was arrested.\"<\/em> - clearly by police).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>How to form it:<\/strong> take the object of the active sentence and make it the subject. Move the verb to be + past participle. The original subject becomes <em>by + agent<\/em> (or is dropped).<br><em>\"Workers build the cars.\"<\/em> → <em>\"The cars are built (by workers).\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Common tense forms:<\/strong> present simple passive (<em>is made<\/em>), past simple passive (<em>was built<\/em>), present perfect passive (<em>has been cancelled<\/em>), future passive (<em>will be announced<\/em>).<\/div><\/div>\n<div class=\"note\"><strong>The mistake I correct most often<\/strong> is a missing past participle - people reach for the base form or the past simple instead.<br><em>\"The report was write.\"<\/em> ✗ → <em>\"The report was written.\"<\/em> ✓<br><em>\"The bridge was build.\"<\/em> ✗ → <em>\"The bridge was built.\"<\/em> ✓<br>Keep an eye on agreement too: <em>\"The results was published.\"<\/em> ✗ → <em>\"The results were published.\"<\/em> ✓<\/div>","table":{"headers":["Tense","Active","Passive"],"rows":[["Present simple","They make it in Italy.","It is made in Italy."],["Past simple","Someone stole my bike.","My bike was stolen."],["Present continuous","They are repairing the road.","The road is being repaired."],["Present perfect","They have cancelled the flight.","The flight has been cancelled."],["Future (will)","They will announce the results.","The results will be announced."],["With by agent","Shakespeare wrote Hamlet.","Hamlet was written by Shakespeare."]]},"examples":[{"type":"pos","eng":"This bridge was built in 1890.","note":"Doer unknown/unimportant - passive more natural."},{"type":"pos","eng":"The results will be published tomorrow.","note":"Future passive - will + be + past participle."},{"type":"pos","eng":"Three people were arrested at the scene.","note":"Doer obvious (police) - by agent omitted."},{"type":"neg","eng":"The meeting hasn't been confirmed yet.","note":"Present perfect passive - hasn't been + participle."}],"errors":[{"bad":"The letter was write by her.","good":"The letter was written by her.","reason":"Passive needs the past participle - write → written."},{"bad":"The results was announced yesterday.","good":"The results were announced yesterday.","reason":"Results is plural - were, not was."},{"bad":"My phone has been stole.","good":"My phone has been stolen.","reason":"Past participle of steal is stolen, not stole."}],"realUse":[],"exercises":[{"type":"gap","title":"Form the passive","sub":"Rewrite using the correct passive form of the verb in brackets.","items":[{"answer":"is spoken","before":"English ","after":" in over 50 countries. (speak - present simple)"},{"answer":"was built","before":"The Colosseum ","after":" in 70 AD. (build - past simple)"},{"answer":"has been cancelled","before":"The concert ","after":". (cancel - present perfect)"},{"answer":"is being repaired","before":"The road ","after":" at the moment. (repair - present continuous)"},{"answer":"will be announced","before":"The winner ","after":" tomorrow. (announce - future)"},{"answer":"were arrested","before":"Two suspects ","after":" last night. (arrest - past simple)"},{"answer":"has been stolen","before":"My laptop ","after":". (steal - present perfect)"},{"answer":"was directed","before":"The film ","after":" by Pedro Almodóvar. (direct - past simple)"}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"Scientists have discovered a new species.","keyword":"has been","answer":"A new species has been discovered."},{"original":"They will repair the bridge next year.","keyword":"will be","answer":"The bridge will be repaired next year."},{"original":"Picasso painted Guernica in 1937.","keyword":"was painted","answer":"Guernica was painted by Picasso in 1937. / Guernica was painted in 1937 by Picasso."},{"original":"Someone has broken the window.","keyword":"has been","answer":"The window has been broken."},{"original":"They are building a new hospital.","keyword":"is being","answer":"A new hospital is being built."}]},{"type":"mc","title":"Choose the correct passive form","sub":"Choose the correct option.","items":[{"q":"The new law _____ last week.","opts":["was passed","is passed","has pass","was passing"],"answer":"was passed","explanation":"Last week = past simple passive: was + past participle."},{"q":"Three people _____ in the accident.","opts":["were injured","was injured","are injured","have injure"],"answer":"were injured","explanation":"Three people = plural → were. Past simple passive."},{"q":"The results _____ yet.","opts":["haven't announced","haven't been announced","wasn't announced","aren't announced"],"answer":"haven't been announced","explanation":"Yet + present perfect passive: haven't been + past participle."},{"q":"This wine _____ in the Rioja region.","opts":["is produced","is produce","was produced","produces"],"answer":"is produced","explanation":"General fact about how/where something is made → present simple passive."}]}]},{"id":"modaldeduction","title":"Modal verbs: deduction","subtitle":"must be, can't be, might be","intro":"Using modals to say how sure you are about the present - without stating it as a flat fact.","desc":"At A2 you learnt can, should, must for ability, advice, and obligation. At B1 the modals take on a new job: expressing how certain you are about something - without stating it as fact.","tip":"At A2 you met <em>can, should, must<\/em> for ability, advice and obligation. Now they pick up a new job, and I teach it as three levels of certainty: <strong>must be<\/strong> (I'm almost sure it's true), <strong>might/could be<\/strong> (maybe), <strong>can't be<\/strong> (I'm almost sure it's false). The one that trips people up: the negative of deduction is <em>can't<\/em>, not <em>mustn't<\/em>. <em>\"It mustn't be true\"<\/em> is prohibition; <em>\"It can't be true\"<\/em> is what you actually mean.","explanation":"<p>Modal verbs are used for logical deduction - expressing how certain or uncertain you are about a present situation. All are followed by the <strong>base form<\/strong>.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Must be<\/strong> - strong positive deduction. Almost certain it is true based on evidence. <em>\"She's been working for 16 hours - she must be exhausted.\"<\/em> / <em>\"That must be John - I recognise his voice.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Can't be<\/strong> - strong negative deduction. Almost certain it is NOT true. <em>\"He can't be hungry - he just ate.\"<\/em> / <em>\"That can't be right - the numbers don't add up.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Might be / could be / may be<\/strong> - weak deduction. It is possible but not certain either way. <em>\"She might be in a meeting.\"<\/em> / <em>\"It could be a mistake.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Never use mustn't for a negative guess.<\/strong> <em>mustn't<\/em> means \"not allowed to\" - for deduction you always want <em>can't<\/em>.<br><em>\"That must be expensive.\"<\/em> (I'm fairly sure it is.)<br><em>\"That can't be expensive.\"<\/em> (I'm fairly sure it isn't.)<br>And to guess about the past, just add <em>have + past participle<\/em>: <em>\"She must have left already.\"<\/em> / <em>\"He can't have known.\"<\/em><\/div>","table":{"headers":["Certainty level","Positive","Negative"],"rows":[["Strong certainty - true","must be"," - "],["Strong certainty - false"," - ","can't be / couldn't be"],["Possibility","might be / could be / may be","might not be / may not be"],["Past deduction (strong)","must have + pp","can't have + pp"],["Past deduction (weak)","might have + pp","might not have + pp"]]},"examples":[{"type":"pos","eng":"You've been travelling all day - you must be tired.","note":"Evidence → strong deduction."},{"type":"pos","eng":"That can't be right - I checked it twice.","note":"Logical impossibility based on evidence."},{"type":"pos","eng":"She's not answering - she might be in a meeting.","note":"Possible explanation, not certain."},{"type":"pos","eng":"He must have left - his coat is gone.","note":"Past deduction from present evidence."}],"errors":[{"bad":"She mustn't be at home - the lights are off.","good":"She can't be at home - the lights are off.","reason":"Mustn't = prohibition. Can't = negative deduction."},{"bad":"He must be not tired - he slept all day.","good":"He can't be tired - he slept all day.","reason":"Negative deduction → can't be, not must not be."},{"bad":"It might be not true.","good":"It might not be true.","reason":"Modal + not: might not be, not might be not."}],"realUse":[],"richLabel":"Pattern reference","richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Certainty scale - present deduction<\/div>\n<div class=\"certainty-scale\">\n<div class=\"certainty-row\"><div class=\"certainty-modal\">must be<\/div><div><div class=\"certainty-meaning\">Almost certain it IS true - strong positive deduction<\/div><div class=\"certainty-eg\">\"She's been up since 5am - she must be exhausted.\"<\/div><\/div><\/div>\n<div class=\"certainty-row\"><div class=\"certainty-modal\">should be<\/div><div><div class=\"certainty-meaning\">Expected to be true based on what's normal<\/div><div class=\"certainty-eg\">\"The meeting's at 3 - he should be here by now.\"<\/div><\/div><\/div>\n<div class=\"certainty-row\"><div class=\"certainty-modal\">might / could / may be<\/div><div><div class=\"certainty-meaning\">Possible - we don't know either way<\/div><div class=\"certainty-eg\">\"She's not answering - she might be in a meeting.\"<\/div><\/div><\/div>\n<div class=\"certainty-row\"><div class=\"certainty-modal\">can't / couldn't be<\/div><div><div class=\"certainty-meaning\">Almost certain it IS NOT true - strong negative deduction<\/div><div class=\"certainty-eg\">\"He just ate - he can't be hungry.\"<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Past deduction (modal + have + past participle)<\/div>\n<div class=\"certainty-scale\">\n<div class=\"certainty-row\"><div class=\"certainty-modal\">must have + pp<\/div><div><div class=\"certainty-meaning\">Almost certain it happened<\/div><div class=\"certainty-eg\">\"She's not here - she must have left already.\"<\/div><\/div><\/div>\n<div class=\"certainty-row\"><div class=\"certainty-modal\">might/may have + pp<\/div><div><div class=\"certainty-meaning\">Possibly happened<\/div><div class=\"certainty-eg\">\"He might have misunderstood.\"<\/div><\/div><\/div>\n<div class=\"certainty-row\"><div class=\"certainty-modal\">can't/couldn't have + pp<\/div><div><div class=\"certainty-meaning\">Almost certain it didn't happen<\/div><div class=\"certainty-eg\">\"He can't have done it - he was with me.\"<\/div><\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\"><svg width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' style='vertical-align:-2px'><path d='M12 3 21 19H3Z'/><path d='M12 9v4m0 3h.01'/></svg> Critical: mustn't ≠ can't for deduction<\/div>\n<table class=\"rich-table\"><tbody>\n<tr><td><strong>can't be<\/strong> ✓<\/td><td>Negative deduction: <em>\"That can't be right.\"<\/em><\/td><\/tr>\n<tr><td><strong>mustn't be<\/strong> ✗<\/td><td>This means PROHIBITION, not deduction: <em>\"You mustn't be late\"<\/em> = not allowed<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","exercises":[{"type":"gap","title":"Must be, can't be, or might be?","sub":"Fill each gap with must be, can't be, or might be/could be.","items":[{"answer":"must be","before":"She's been awake for 24 hours - she ","after":" exhausted."},{"answer":"can't be","before":"That ","after":" John - John is in London this week."},{"answer":"might be / could be","before":"I'm not sure where he is - he ","after":" at the gym."},{"answer":"must be","before":"The restaurant is always full - the food ","after":" really good."},{"answer":"can't be","before":"She ","after":" 50 - she looks about 35."},{"answer":"might be / could be","before":"There's someone at the door - it ","after":" the delivery."}]},{"type":"mc","title":"Which modal for deduction?","sub":"Choose the correct deduction modal.","items":[{"q":"He just ate a huge meal. He _____ hungry.","opts":["must be","can't be","might be","mustn't be"],"answer":"can't be","explanation":"Strong negative deduction - can't be, never mustn't be."},{"q":"She passed every exam without studying. She _____ very clever.","opts":["can't be","mustn't be","must be","might not be"],"answer":"must be","explanation":"Strong positive deduction from evidence."},{"q":"I'm not sure - it _____ a misunderstanding.","opts":["must be","can't be","could be","mustn't be"],"answer":"could be","explanation":"Uncertainty - might be or could be."},{"q":"He _____ left - his car is still outside.","opts":["must have","can't have","might have","should have"],"answer":"can't have","explanation":"Evidence (car still there) → strong negative past deduction: can't have left."}]},{"type":"builder","title":"Sentence builder","sub":"Put the words in the correct order.","items":[{"words":["she","must","be","very","tired","after","that","journey"],"answer":"she must be very tired after that journey","context":"Strong positive deduction."},{"words":["that","can't","be","right"," - ","check","it","again"],"answer":"that can't be right - check it again","context":"Strong negative deduction."},{"words":["he","might","have","missed","his","train"],"answer":"he might have missed his train","context":"Weak past deduction."},{"words":["it","must","have","been","a","mistake"],"answer":"it must have been a mistake","context":"Strong past deduction."}]}]},{"id":"reportedspeech","title":"Reported speech","subtitle":"She said that, he told me to","intro":"Reporting what someone said, without quoting them word for word. We do this constantly in real conversation.","desc":"Reported speech shifts the tense back in time and changes pronouns and time expressions. It is essential for everyday conversation - we report what people say constantly.","tip":"The part I really want you to feel is that the tense shift is <em>logical<\/em>, not a random rule to memorise. If someone spoke in the past, then from where you're standing now it happened even further back - so every tense takes one step back. Present becomes past, past becomes past perfect, <em>will<\/em> becomes <em>would<\/em>. The pronouns shift to match the new speaker too. Once you see it as a step back in time, it stops feeling like a puzzle.","explanation":"<p>In reported speech, we report what someone said without quoting them directly. The tense typically shifts back one step, and pronouns/time expressions change to match the new perspective.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Tense backshift:<\/strong> present simple → past simple. Present continuous → past continuous. Past simple → past perfect. Will → would. Can → could. Must → had to.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Pronoun shift:<\/strong> I → he/she. We → they. My → his/her. You (= listener) → I/he/she depending on context.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Time expression shift:<\/strong> now → then. Today → that day. Yesterday → the day before / the previous day. Tomorrow → the next day / the following day. Here → there. This → that.<\/div><\/div>\n<div class=\"note\"><strong>Say vs tell - a classic:<\/strong> <em>say<\/em> needs no person (<em>\"She said she was tired\"<\/em>), but <em>tell<\/em> must have one (<em>\"She told me she was tired\"<\/em> - never <em>\"She told she was tired\"<\/em>).<br>And you can skip the backshift when the fact is still true or you report with a present verb: <em>\"He says he lives in Paris.\"<\/em><\/div>","table":{"headers":["Direct speech","Reported speech","Shift"],"rows":[["\"I am tired.\"","She said she was tired.","am → was"],["\"I'm working.\"","He said he was working.","is working → was working"],["\"I went to Rome.\"","She said she had gone to Rome.","went → had gone"],["\"I will call you.\"","He said he would call me.","will → would"],["\"I can help.\"","She said she could help.","can → could"],["\"Come here tomorrow.\"","He told me to go there the next day.","tomorrow → the next day / here → there"]]},"examples":[{"type":"pos","eng":"She said she was feeling much better.","note":"I am feeling → she was feeling (present continuous → past continuous)."},{"type":"pos","eng":"He told me he had already seen the film.","note":"I have seen → he had seen (present perfect → past perfect)."},{"type":"pos","eng":"They said they would come the next day.","note":"We will come tomorrow → they would come the next day."},{"type":"neg","eng":"She said she couldn't make it to the meeting.","note":"I can't → she couldn't (can → could)."}],"errors":[{"bad":"She said me she was tired.","good":"She told me she was tired.","reason":"Tell must have an object - told me. Say does not take an object: she said she was tired."},{"bad":"He said that he will come.","good":"He said that he would come.","reason":"Will shifts to would in reported speech."},{"bad":"She asked me where did I live.","good":"She asked me where I lived.","reason":"Reported questions use statement word order - no inversion, no do/did."}],"realUse":[],"exercises":[{"type":"gap","title":"Tense backshift","sub":"Report what each person said. Change the tense and pronouns.","items":[{"answer":"she was studying","before":"\"I'm studying.\" → She said ","after":"."},{"answer":"he had forgotten","before":"\"I forgot.\" → He said ","after":" his keys."},{"answer":"she would call","before":"\"I'll call you.\" → She said ","after":" me."},{"answer":"they could help","before":"\"We can help.\" → They said ","after":"."},{"answer":"he had been working","before":"\"I've been working all day.\" → He said ","after":" all day."},{"answer":"she didn't know","before":"\"I don't know.\" → She said ","after":"."}]},{"type":"transform","title":"Direct to reported speech","sub":"Rewrite each sentence as reported speech.","items":[{"original":"\"I'm very tired,\" she said.","keyword":"said","answer":"She said she was very tired."},{"original":"\"I'll be there at eight,\" he told me.","keyword":"told","answer":"He told me he would be there at eight."},{"original":"\"We have already eaten,\" they said.","keyword":"said","answer":"They said they had already eaten."},{"original":"\"Where do you live?\" she asked me.","keyword":"asked","answer":"She asked me where I lived."},{"original":"\"Don't be late!\" the teacher told us.","keyword":"told","answer":"The teacher told us not to be late."}]},{"type":"mc","title":"Say, tell, or ask?","sub":"Choose the correct reporting verb.","items":[{"q":"She _____ me she would be late.","opts":["said","told","asked","spoke"],"answer":"told","explanation":"Tell + object (me) + clause. Say does not take a personal object."},{"q":"He _____ he was feeling better.","opts":["told","asked","said","spoke"],"answer":"said","explanation":"Say does not take a personal object - said (that) he was feeling better."},{"q":"She _____ whether I had eaten.","opts":["said","told","asked","spoke"],"answer":"asked","explanation":"Asking a question → asked (+ if/whether for yes/no questions)."},{"q":"They _____ us to be quiet.","opts":["said","told","asked","ordered"],"answer":"told","explanation":"Reporting a command → told + object + to + infinitive."}]}]},{"id":"firstconditional","title":"Conditionals: zero & first","subtitle":"If it rains, I'll stay in","intro":"Real conditions - things that genuinely could happen. This is where conditionals begin.","desc":"The zero and first conditionals deal with real, possible situations. Zero = always true (general fact). First = possible future result.","tip":"If you take one thing from this lesson, take this: no <em>will<\/em> in the <em>if<\/em> clause. <strong>\"If it will rain, I'll stay in\"<\/strong> is wrong in English. The <em>if<\/em> clause stays in the present simple, and the <em>will<\/em> lives only in the result clause. That single rule unlocks both the zero and the first conditional, so I drill it hard with every group.","explanation":"<p>Conditionals describe the relationship between a condition and its result. Zero and first conditionals deal with real, possible situations.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Zero conditional<\/strong> - general truths, scientific facts, things that are always true. If + present simple, present simple. <em>\"If you heat water to 100°C, it boils.\"<\/em> / <em>\"If I don't sleep enough, I get headaches.\"<\/em> The result is always the same.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>First conditional<\/strong> - real and likely future situations. If + present simple, will + base verb. <em>\"If it rains, I'll take an umbrella.\"<\/em> / <em>\"If she calls, tell her I'm busy.\"<\/em> The condition is possible - we are talking about a specific future situation.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Variations in the result clause:<\/strong> instead of will, you can use can, may, might, should, or an imperative. <em>\"If you're late, call me.\"<\/em> / <em>\"If she's there, you might see her.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Keep will out of the if clause:<\/strong><br><em>\"If it will rain, I'll stay in.\"<\/em> ✗ → <em>\"If it rains, I'll stay in.\"<\/em> ✓<br>The same goes after <em>unless, when, before, after, until, as soon as<\/em> - all of them take the present simple for a future meaning.<br>And remember <em>unless<\/em> = <em>if not<\/em>: <em>\"I won't go unless you come\"<\/em> = <em>\"I won't go if you don't come.\"<\/em><\/div>","table":{"headers":["Type","If clause","Result clause","Use"],"rows":[["Zero","present simple","present simple","Always true / general fact"],["First","present simple","will + base verb","Real, likely future situation"],["First variation","present simple","can/might/should + base verb","Possibility or advice"],["First variation","present simple","imperative","Instruction given a condition"],["Unless","present simple","will + base verb","= if not: unless you hurry, we'll be late"]]},"examples":[{"type":"pos","eng":"If you mix blue and yellow, you get green.","note":"Zero conditional - scientific/general truth."},{"type":"pos","eng":"If I finish early, I'll call you.","note":"First conditional - real, specific future possibility."},{"type":"pos","eng":"If she's not there, leave a message.","note":"First conditional with imperative in result clause."},{"type":"pos","eng":"Unless you hurry, we'll miss the train.","note":"Unless = if you don't hurry."}],"errors":[{"bad":"If it will rain, we'll cancel the picnic.","good":"If it rains, we'll cancel the picnic.","reason":"Never will in the if clause - present simple instead."},{"bad":"If you will be late, call me.","good":"If you are late, call me.","reason":"Same rule - present simple in the if clause."},{"bad":"Unless you won't come, I'll go alone.","good":"Unless you come, I'll go alone.","reason":"Unless already contains the negative - don't add won't."}],"realUse":[],"exercises":[{"type":"gap","title":"Zero and first conditional","sub":"Fill each gap with the correct form.","items":[{"answer":"boils","before":"If you heat water to 100°C, it ","after":". (boil - zero)"},{"answer":"will get","before":"If you don't study, you ","after":" a bad grade. (get - first)"},{"answer":"rains","before":"I'll take an umbrella if it ","after":". (rain - first)"},{"answer":"press","before":"If you ","after":" this button, the door opens. (press - zero)"},{"answer":"will call","before":"If she's free, she ","after":" you. (call - first)"},{"answer":"freezes","before":"Water ","after":" if the temperature drops below zero. (freeze - zero)"},{"answer":"will be","before":"If we leave now, we ","after":" there by seven. (be - first)"},{"answer":"come","before":"I won't go unless you ","after":". (come - first/unless)"}]},{"type":"mc","title":"Spot the error","sub":"Choose the correct sentence.","items":[{"q":"Which is correct?","opts":["If it will rain, we'll stay in.","If it rains, we'll stay in.","If it rained, we'll stay in.","If it will rain, we would stay in."],"answer":"If it rains, we'll stay in.","explanation":"Present simple in the if clause - never will. First conditional: if + present simple, will + base."},{"q":"Which is correct?","opts":["Unless you won't hurry, we'll be late.","Unless you don't hurry, we'll be late.","Unless you hurry, we'll be late.","Unless you hurried, we'll be late."],"answer":"Unless you hurry, we'll be late.","explanation":"Unless already means 'if not' - don't add don't/won't."},{"q":"___ you pass all your exams, your parents will be delighted.","opts":["If","Unless","When","While"],"answer":"If","explanation":"First conditional about a possible result → 'if'. 'When' would presuppose the exams are certain, which is unnatural here; 'unless' and 'while' do not fit."},{"q":"What will you do if they _____ the offer?","opts":["will refuse","refused","refuse","are refusing"],"answer":"refuse","explanation":"First conditional: present simple in the if clause."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"I won't go if you don't come.","keyword":"Unless","answer":"Unless you come, I won't go."},{"original":"Mix red and blue - you get purple. (always true)","keyword":"If","answer":"If you mix red and blue, you get purple."},{"original":"Study hard now and you'll pass.","keyword":"If","answer":"If you study hard, you'll pass."},{"original":"Don't touch that - you'll burn yourself.","keyword":"If","answer":"If you touch that, you'll burn yourself."},{"original":"What happens when you don't sleep enough?","keyword":"If","answer":"If you don't sleep enough, you feel terrible."}]}]},{"id":"secondconditional","title":"Conditionals: second","subtitle":"If I had money, I'd travel","intro":"Imaginary, hypothetical, unlikely situations - the conditional of dreams and daydreams.","desc":"The second conditional is for things that are not real - either impossible, very unlikely, or contrary to the present facts. It is the conditional of dreams, wishes, advice, and polite requests.","tip":"My students mix up the first and second conditional because both point at the future. The question I get them to ask is simple: <em>how real is this?<\/em> <strong>\"If I win the lottery\"<\/strong> (first - possible, however slim) versus <strong>\"If I won the lottery\"<\/strong> (second - I'm treating it as pure fantasy). Notice the past tense there is doing something clever: it signals <em>unreality<\/em>, not past time.","explanation":"<p>The second conditional describes <strong>imaginary, hypothetical, or unlikely situations<\/strong> and their results. The past tense in the if clause signals that the situation is not real - it does not refer to the past.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Structure:<\/strong> If + past simple, would + base verb. <em>\"If I had more time, I would learn the piano.\"<\/em> (I don't have more time - this is hypothetical.) <em>\"If she lived in Madrid, she would visit me.\"<\/em> (She doesn't live in Madrid.)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>If I were you...<\/strong> - the most common advice structure in English. Always <em>were<\/em>, not <em>was<\/em>, in formal and exam contexts (though <em>was<\/em> is heard in informal speech). <em>\"If I were you, I'd talk to her directly.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Could and might<\/strong> can replace would in the result clause when the result is possible rather than certain. <em>\"If I had more money, I might travel more.\"<\/em> / <em>\"If she asked, he could help.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>The real vs imaginary test:<\/strong><br><em>\"If I win the lottery, I'll buy a house.\"<\/em> - first. I buy tickets; it could happen.<br><em>\"If I won the lottery, I'd buy a house.\"<\/em> - second. Pure daydream.<br>Keep <em>would<\/em> out of the if clause (the one exception is the very formal <em>\"If you would like...\"<\/em>). In the if clause, use the past simple.<\/div>","table":{"headers":["Form","If clause","Result clause"],"rows":[["Second conditional","past simple","would + base verb"],["With were","If I were you / If she were here","I'd / she would..."],["With could/might","past simple","could / might + base verb"],["Contracted form"," - ","I'd = I would / she'd = she would"],["First vs second","present simple (real/possible)","past simple (unreal/hypothetical)"]]},"examples":[{"type":"pos","eng":"If I had a car, I'd drive to work.","note":"I don't have a car - hypothetical."},{"type":"pos","eng":"If I were you, I'd apologise immediately.","note":"Advice structure - were (not was) in formal/exam English."},{"type":"pos","eng":"She'd be much happier if she had a different job.","note":"Result clause first - equally correct order."},{"type":"pos","eng":"If they offered me the job, I might accept.","note":"Might instead of would - less certain result."}],"errors":[{"bad":"If I would have money, I'd travel.","good":"If I had money, I'd travel.","reason":"Would never goes in the if clause - past simple instead."},{"bad":"If I was you, I wouldn't do that.","good":"If I were you, I wouldn't do that.","reason":"Were is preferred with I in the second conditional in formal/exam contexts."},{"bad":"If she would ask, I'd help.","good":"If she asked, I'd help.","reason":"Past simple in the if clause - not would."}],"realUse":[],"exercises":[{"type":"gap","title":"Second conditional - form","sub":"Fill each gap with the correct second conditional form.","items":[{"answer":"had","before":"If I ","after":" more time, I'd learn the piano. (have)"},{"answer":"would tell","before":"If I knew the answer, I ","after":" you. (tell)"},{"answer":"were","before":"If I ","after":" you, I'd apologise. (be)"},{"answer":"could travel","before":"If money were no problem, I ","after":" the world. (travel - use could)"},{"answer":"would be","before":"She ","after":" much happier if she changed jobs. (be)"},{"answer":"lived","before":"If he ","after":" closer, we'd see him more often. (live)"},{"answer":"would you do","before":"What ","after":" if you lost your passport? (do)"},{"answer":"spoke","before":"I'd get the job if I ","after":" better English. (speak)"}]},{"type":"mc","title":"First or second conditional?","sub":"Choose the correct form.","items":[{"q":"If it _____ tomorrow, we'll cancel the barbecue.","opts":["rained","would rain","rains","rain"],"answer":"rains","explanation":"Real possibility about tomorrow → first conditional: present simple in if clause."},{"q":"If I _____ a million euros, I'd buy a house by the sea.","opts":["win","won","would win","have won"],"answer":"won","explanation":"Hypothetical/dream scenario → second conditional: past simple in if clause."},{"q":"If I were you, I _____ tell him the truth.","opts":["will","would","am going to","can"],"answer":"would","explanation":"Second conditional result clause → would + base form."},{"q":"She _____ more if she _____ a better salary.","opts":["saves / gets","would save / got","will save / gets","saved / will get"],"answer":"would save / got","explanation":"Second conditional - hypothetical: would + base / past simple."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite the second sentence so it has the same meaning as the first. Use the keyword given.","items":[{"original":"I don't have a car, so I can't drive to work.","keyword":"If","answer":"If I had a car, I could drive to work."},{"original":"She doesn't know the answer, so she can't help.","keyword":"If","answer":"If she knew the answer, she could help."},{"original":"My advice to you: talk to her directly.","keyword":"If I were","answer":"If I were you, I'd talk to her directly."},{"original":"He doesn't speak Spanish, so he can't apply.","keyword":"If","answer":"If he spoke Spanish, he could apply."},{"original":"What will you do if you lose your job? (hypothetical)","keyword":"would","answer":"What would you do if you lost your job?"}]}]},{"id":"nondefining","title":"Relative clauses: non-defining","subtitle":"My teacher, who is from Dublin, ...","intro":"Adding extra information - the kind the sentence could happily survive without. The comma is the whole story here.","desc":"At A2 you learnt defining relative clauses, which identify which person or thing you mean. Non-defining clauses add extra, bonus information about something already identified. The comma is the signal.","tip":"I promise you the comma is not just decoration - it changes the meaning completely. <em>\"My sister who lives in London\"<\/em> quietly tells me you have more than one sister (the clause says which). <em>\"My sister, who lives in London,\"<\/em> tells me you have just one, and you're adding a bonus fact. If you've studied a Romance language, you already know this distinction - it behaves the same way.","explanation":"<p>Non-defining relative clauses add <strong>extra information<\/strong> about a noun that is already fully identified. They are separated from the main clause by <strong>commas<\/strong> and the information inside them could be removed without changing the core meaning of the sentence.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Commas are essential.<\/strong> They signal that the clause contains extra, non-essential information. Without commas, the clause becomes defining (essential to identify the noun).<br><em>\"My brother, who lives in Berlin, is a doctor.\"<\/em> - I have one brother. Extra info: he lives in Berlin.<br><em>\"My brother who lives in Berlin is a doctor.\"<\/em> - I have multiple brothers. The clause identifies which one.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Never use that<\/strong> in non-defining relative clauses. Only who (people), which (things), whose (possession), where (places). <em>\"The Prado, which is in Madrid, is my favourite museum.\"<\/em> - never <em>\"The Prado, that is in Madrid...\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Which can refer to the whole previous clause<\/strong> - a very common pattern. <em>\"She passed all her exams, which was a great surprise.\"<\/em> The <em>which<\/em> refers to the whole fact of passing, not just one noun.<\/div><\/div>\n<div class=\"note\"><strong>Defining vs non-defining at a glance:<\/strong><br>Defining (no commas): <em>\"The woman who called is my sister.\"<\/em> - tells us which woman.<br>Non-defining (commas): <em>\"Maria, who called this morning, is my sister.\"<\/em> - Maria is already named; the clause just adds to her.<br>One rule I never let slide: <em>that<\/em> is never used in a non-defining clause. It's a favourite exam trap.<\/div>","table":{"headers":["Type","Commas","That allowed?","Purpose"],"rows":[["Defining","No commas","Yes","Identifies which person/thing"],["Non-defining","Commas required","No - who/which/whose/where only","Adds extra information"],["Which for whole clause","Comma before which"," - ","Refers to the previous whole idea"],["Whose","Commas if non-defining"," - ","Possession: her name, whose work I admire,..."]]},"examples":[{"type":"pos","eng":"My teacher, who is from Dublin, speaks four languages.","note":"Non-defining - teacher already identified by my. Extra info added."},{"type":"pos","eng":"The Eiffel Tower, which was built in 1889, attracts millions of tourists.","note":"The Eiffel Tower is already fully identified. Which, not that."},{"type":"pos","eng":"She passed all her exams, which made her parents very proud.","note":"Which refers to the whole fact of passing - a very common pattern."},{"type":"pos","eng":"My boss, whose opinion I respect, suggested a different approach.","note":"Whose = possessive - her opinion."}],"errors":[{"bad":"My sister, that lives in London, is a nurse.","good":"My sister, who lives in London, is a nurse.","reason":"Non-defining relative clauses never use that - only who, which, whose, where."},{"bad":"The Prado, that is in Madrid, is worth a visit.","good":"The Prado, which is in Madrid, is worth a visit.","reason":"Non-defining clause about a thing - which, not that."},{"bad":"She won the prize which made her very happy.","good":"She won the prize, which made her very happy.","reason":"Which referring to the whole clause needs a comma before it."}],"realUse":[],"exercises":[{"type":"gap","title":"Add the relative pronoun","sub":"Fill each gap with who, which, or whose.","items":[{"answer":"who","before":"My neighbour, ","after":" is a retired teacher, helps me with English."},{"answer":"which","before":"The film, ","after":" won three Oscars, is now on streaming."},{"answer":"whose","before":"My colleague, ","after":" husband is a chef, always brings amazing food."},{"answer":"which","before":"She quit her job, ","after":" shocked everyone."},{"answer":"who","before":"Pablo Picasso, ","after":" was born in Málaga, became one of the most influential artists of the 20th century."},{"answer":"which","before":"The conference, ","after":" takes place every year in Vienna, attracts thousands of delegates."}]},{"type":"builder","title":"Combine the sentences","sub":"Join the two sentences using a non-defining relative clause.","items":[{"words":["My","sister","who","is","a","doctor","lives","in","Barcelona"],"answer":"My sister, who is a doctor, lives in Barcelona.","context":"Add commas - the clause gives extra info about an already-identified sister."},{"words":["The","Alhambra","which","was","built","in","the","14th","century","is","in","Granada"],"answer":"The Alhambra, which was built in the 14th century, is in Granada.","context":"Non-defining - the Alhambra is already fully identified."},{"words":["She","passed","her","driving","test","which","was","a","huge","relief"],"answer":"She passed her driving test, which was a huge relief.","context":"Which refers to the whole previous fact."},{"words":["My","boss","whose","feedback","is","always","useful","suggested","a","change"],"answer":"My boss, whose feedback is always useful, suggested a change.","context":"Whose = possessive."}]},{"type":"mc","title":"Defining or non-defining?","sub":"Choose the correct sentence.","items":[{"q":"I have one brother. Which is correct?","opts":["My brother who lives in Rome called me.","My brother, who lives in Rome, called me.","My brother, that lives in Rome, called me.","My brother which lives in Rome called me."],"answer":"My brother, who lives in Rome, called me.","explanation":"One brother = already identified → non-defining with commas. Never that."},{"q":"I have several cousins. Which identifies which cousin?","opts":["My cousin, who works in London, is visiting.","My cousin who works in London is visiting.","My cousin, who lives in London, is visiting.","My cousin, that works in London, is visiting."],"answer":"My cousin who works in London is visiting.","explanation":"Multiple cousins → defining clause (no commas) to identify which one."},{"q":"Which sentence uses which correctly for a whole idea?","opts":["She won, which was unexpected.","She won which was unexpected.","She won, that was unexpected.","She won that was unexpected."],"answer":"She won, which was unexpected.","explanation":"Which referring to the whole previous clause needs a comma and cannot use that."}]}]},{"id":"gerundsinfinitives","title":"Gerunds and infinitives","subtitle":"I enjoy swimming, I want to swim","intro":"When to use the -ing form and when to use to + infinitive. There's no single rule, so this one rewards patience.","desc":"One of the most important areas of B1 grammar - and one of the most difficult, because there is no single rule. The choice between gerund and infinitive often depends on which verb comes before it.","tip":"I'll be honest with you - there is no magic formula here; a lot of it is learning which verb takes which form. But a couple of patterns really help. Verbs about how you <em>feel about an activity<\/em> (enjoy, love, hate, avoid, miss) tend to take the gerund. Verbs about <em>plans and intentions<\/em> (want, hope, plan, decide, would like) tend to take the infinitive. And after a preposition, it's always the gerund.","explanation":"<p>Some verbs are followed by the gerund (-ing form), others by the infinitive (to + base verb), and some can take both. The choice often changes the meaning.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Verbs + gerund (-ing):<\/strong> enjoy, love, hate, like (in general), miss, avoid, finish, suggest, consider, practise, keep, mind, can't stand, imagine, deny, admit. <em>\"I enjoy running.\"<\/em> / <em>\"She avoids eating late.\"<\/em> / <em>\"He admitted lying.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Verbs + infinitive (to + base):<\/strong> want, need, hope, plan, decide, agree, refuse, manage, offer, promise, expect, would like, forget, learn, afford, fail. <em>\"I want to leave.\"<\/em> / <em>\"She managed to pass.\"<\/em> / <em>\"He refused to apologise.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Verbs + both (different meanings):<\/strong> remember, forget, stop, try, regret.<br><em>\"I remember meeting her.\"<\/em> (memory of a past event) vs <em>\"I remembered to call.\"<\/em> (didn't forget to do it)<br><em>\"She stopped smoking.\"<\/em> (quit) vs <em>\"She stopped to smoke.\"<\/em> (paused in order to smoke)<\/div><\/div>\n<div class=\"note\"><strong>After a preposition, always the gerund:<\/strong><br><em>\"I'm interested in learning.\"<\/em> / <em>\"She left without saying goodbye.\"<\/em> / <em>\"He's good at cooking.\"<\/em><br>Here's the sneaky one: the <em>to<\/em> in an infinitive is <strong>not<\/strong> a preposition, but in <em>\"I look forward to seeing you\"<\/em> that <em>to<\/em> <strong>is<\/strong> a preposition - so it takes <em>seeing<\/em>, not <em>see<\/em>. Test it by asking whether <em>to<\/em> is followed by a noun elsewhere.<\/div>","table":{"headers":["Category","Examples","Form"],"rows":[["Verb + gerund","enjoy, avoid, finish, miss, practise, consider, suggest, admit, deny, keep","verb + -ing: I enjoy running."],["Verb + infinitive","want, hope, plan
