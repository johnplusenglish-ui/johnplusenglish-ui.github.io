<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C1 Grammar - johnplusenglish</title>
<meta name="description" content="C1 grammar, one lesson at a time. Work through 10 advanced C1 structures with clear explanations in plain English and practice that checks itself.">
<script src="lock.js"></script>
<script src="/assets/deeplink.js"></script>
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --cream:#F7F6F3; --card:#fff; --ink:#2D3047; --muted:#8A8D9A;
  --border:#E8E5DF; --line:#EFEDE7;
  --sky:#2176FF; --sky-tint:#EAF2FE;
  --sea:#1DD3B0; --sea-d:#0F7D71; --sea-tint:#E4FBF7; --sea-bd:rgba(29,211,176,.4);
  --coral:#FF6B6B; --coral-d:#C0392B; --coral-tint:#FDECEC;
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}
.topnav{display:none}
a{color:var(--sky);text-decoration:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:32px 24px 80px}

/* header */
.g-head{display:flex;align-items:flex-start;gap:16px;margin:0 0 8px}
.g-badge{width:52px;height:52px;border-radius:14px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--sky)}
.g-badge svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g-title{font-size:2rem;font-weight:900;letter-spacing:-.02em;margin:0;line-height:1.05}
.g-sub{font-size:1rem;color:var(--muted);margin:4px 0 0;max-width:56ch}
.g-progwrap{margin:22px 0 26px}
.g-progline{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 8px}
.g-progline strong{color:var(--ink)}
.g-progbar{height:8px;border-radius:5px;background:var(--border);overflow:hidden}
.g-progfill{height:100%;width:0;background:var(--sea);border-radius:5px;transition:width .4s}

/* layout */
.g-layout{display:grid;grid-template-columns:288px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.g-layout{grid-template-columns:1fr}.g-road{position:static !important;max-height:none !important}}

/* roadmap sidebar */
.g-road{position:sticky;top:20px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:8px;max-height:calc(100vh - 40px);overflow:auto}
.g-road-head{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:12px 12px 8px}
.g-step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;font-family:inherit;cursor:pointer;padding:11px 12px;border-radius:10px;color:var(--ink);transition:background .15s}
.g-step:hover{background:var(--cream)}
.g-step.active{background:var(--sky-tint)}
.g-step-n{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:1.5px solid var(--border);color:var(--muted);background:var(--card)}
.g-step.active .g-step-n{border-color:var(--sky);color:var(--sky)}
.g-step.done .g-step-n{background:var(--sea);border-color:var(--sea);color:#fff}
.g-step-n svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g-step-t{font-size:.9rem;font-weight:600;line-height:1.3;min-width:0}
.g-step.active .g-step-t{color:var(--sky)}

/* lesson pane */
.g-lesson{min-width:0}
.g-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:30px 32px;margin:0 0 20px}
.g-eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);margin:0 0 6px}
.g-lesson-title{font-size:1.6rem;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;line-height:1.1}
.g-lesson-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:0 0 18px}
/* in-lesson folder tabs (matches site) */
.l-tabs{display:flex;gap:4px;position:relative;margin:6px 0 20px;align-items:flex-end;flex-wrap:wrap;padding-top:6px}
.l-tabs::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.l-tab{position:relative;font-family:inherit;font-size:.92rem;font-weight:700;padding:.55rem 1.5rem;color:var(--muted);cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1.5px solid var(--border);border-radius:12px 12px 0 0;transition:background .18s,color .18s}
.l-tab:hover{color:var(--ink)}
.l-tab.active{background:var(--cream);border-color:var(--sky);border-bottom:1.5px solid var(--cream);color:var(--sky);z-index:2}
.l-tab .l-tab-c{font-weight:600;opacity:.6;margin-left:7px}
.l-pane{display:none}
.l-pane.show{display:block}
/* soft circular number badges (match the roadmap) */
.g-ex-num{display:inline-flex;width:27px;height:27px;border-radius:50%;background:var(--sky);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;margin-right:12px;vertical-align:-6px;font-variant-numeric:tabular-nums}
.q-num{display:inline-flex;width:25px;height:25px;border-radius:50%;background:var(--sky-tint);color:var(--sky);align-items:center;justify-content:center;font-weight:700;font-size:.78rem;margin-right:11px;vertical-align:-5px;font-variant-numeric:tabular-nums}
.g-intro{font-size:1.05rem;font-weight:500;color:var(--ink);background:var(--sky-tint);border-radius:12px;padding:16px 20px;margin:0 0 22px}
.g-body{font-size:1rem}
.g-body p{margin:0 0 14px}
.g-body strong{font-weight:700}
.g-body em{font-style:italic;color:var(--ink)}
.g-body .rule{display:flex;gap:14px;align-items:flex-start;background:none;border:none;padding:0;margin:0 0 15px}
.g-body .rule-num{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--sea);margin-top:10px;font-size:0;color:transparent}
.g-body .rule-text{font-size:1rem;line-height:1.62}
.g-body .note{background:var(--sea-tint);border:none;border-radius:14px;padding:16px 20px;margin:20px 0 4px;font-size:.96rem;line-height:1.65}
.g-body .note strong{color:var(--sea-d)}

.g-sec-label{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:34px 0 16px}

table.g-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin:0 0 8px}
.g-table th{background:var(--cream);text-align:left;font-weight:700;padding:11px 14px;border-bottom:1.5px solid var(--border);font-size:.82rem}
.g-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.g-table tr:last-child td{border-bottom:none}
.g-table td:first-child{font-weight:600;color:var(--muted);white-space:nowrap}

/* In action - airy 2-column grid, no boxes, no dividers */
.g-examples{display:grid;grid-template-columns:1fr 1fr;gap:4px 34px;margin:0 0 4px}
@media(max-width:660px){.g-examples{grid-template-columns:1fr}}
.g-ex{padding:11px 0;background:none;border:none;display:block}
.g-ex-t{font-weight:800;font-size:.82rem;margin-right:10px}
.g-ex.pos .g-ex-t{color:var(--sea)}
.g-ex.neg .g-ex-t,.g-ex.q .g-ex-t{color:var(--sky)}
.g-ex-eng{font-weight:600;font-size:1rem}
.g-ex-note{font-size:.85rem;color:var(--muted);margin:3px 0 0 23px}

/* Watch out for - airy colour-coded pairs, no boxes, no dividers */
.g-errors{display:flex;flex-direction:column;gap:22px;margin:0 0 4px}
.g-err{background:none;border:none;padding:0}
.g-err-line{display:flex;gap:9px;align-items:baseline;font-size:.98rem;line-height:1.45}
.g-err-line .mk{flex:0 0 auto;font-weight:800;font-size:.9rem}
.g-err-bad{color:var(--coral-d)}.g-err-bad .mk{color:var(--coral)}
.g-err-good{color:var(--sea-d);font-weight:600;margin-top:3px}.g-err-good .mk{color:var(--sea)}
.g-err-reason{font-size:.85rem;color:var(--muted);margin:7px 0 0 23px}

.g-real{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.g-real li{position:relative;padding:0 0 0 22px;font-size:.96rem;line-height:1.55;border:none}
.g-real li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--sky)}

.g-tip{display:flex;gap:12px;background:var(--sea-tint);border:1.5px solid var(--sea-bd);border-radius:12px;padding:15px 18px;margin:22px 0 0}
.g-tip-label{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sea-d);margin:0 0 3px}
.g-tip p{margin:0;font-size:.95rem;line-height:1.55}

/* exercises */
.g-exercise{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:22px 24px;margin:0 0 16px}
.g-ex-title{font-size:1.05rem;font-weight:700;margin:0 0 2px}
.g-ex-sub{font-size:.9rem;color:var(--muted);margin:0 0 16px}
.q{padding:16px 0;border:none}
.q-text{font-size:1rem;margin:0 0 10px;line-height:1.75}
.gap-inp,.txt-inp{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;padding:.4rem .6rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);outline:none;transition:border-color .2s,background .2s}
.gap-inp{width:150px;text-align:center}
.txt-inp{width:100%;max-width:520px}
.gap-inp:focus,.txt-inp:focus{border-color:var(--sky)}
.gap-inp.correct,.txt-inp.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.gap-inp.wrong,.txt-inp.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0}
.opt{font-family:inherit;font-size:.95rem;font-weight:600;text-align:left;padding:.7rem 1rem;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.opt.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opt.reveal{border-color:var(--sea);color:var(--sea-d)}
.opt:disabled{cursor:default}
.q-fb{font-size:.88rem;margin-top:8px;padding:8px 12px;border-radius:8px;display:none}
.q-fb.show{display:block}
.q-fb.ok{background:var(--sea-tint);color:var(--sea-d)}
.q-fb.no{background:var(--coral-tint);color:var(--coral-d)}
.q-fb.hint{background:var(--cream);color:var(--muted)}
.chk-btn{font-family:inherit;font-weight:700;font-size:.88rem;color:#fff;background:var(--sky);border:none;border-radius:10px;padding:.6rem 1.3rem;cursor:pointer;margin-top:14px;transition:background .15s}
.chk-btn:hover{background:#175fd0}
.chk-link{font-family:inherit;font-weight:600;font-size:.82rem;color:var(--muted);background:none;border:none;cursor:pointer;margin-left:12px}
.chk-link:hover{color:var(--coral)}
.ex-score{font-size:.85rem;font-weight:700;color:var(--sea-d);margin-left:12px;display:none}
.ex-score.show{display:inline}

/* builder */
.build-target{min-height:44px;border:1.5px dashed var(--border);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;background:var(--cream)}
.build-bank{display:flex;flex-wrap:wrap;gap:6px}
.word-chip{font-family:inherit;font-size:.9rem;font-weight:600;padding:.35rem .7rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.word-chip:hover{border-color:var(--ink)}
.word-chip.used{opacity:.35;pointer-events:none}
.build-target .word-chip{background:var(--sky-tint);border-color:var(--sky)}

/* categorise */
.cat-cols{display:grid;gap:12px;margin:0 0 12px}
.cat-col{border:1.5px solid var(--border);border-radius:12px;padding:12px;min-height:70px;background:var(--card)}
.cat-col-h{font-size:.8rem;font-weight:700;color:var(--ink);margin:0 0 8px}
.cat-drop{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.cat-bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cat-item{font-family:inherit;font-size:.9rem;font-weight:600;padding:.4rem .8rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.cat-item.sel{border-color:var(--sky);background:var(--sky-tint);color:var(--sky)}
.cat-item.placed{background:var(--cream)}
.cat-item.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.cat-item.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}

/* convo */
.convo-line{display:flex;gap:10px;padding:8px 0;font-size:.98rem;line-height:1.8}
.convo-sp{font-weight:800;color:var(--sky);flex:0 0 auto;width:22px}

/* footer nav */
.g-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 0}
.g-complete{font-family:inherit;font-weight:700;font-size:.92rem;color:#fff;background:var(--sea);border:none;border-radius:12px;padding:.75rem 1.5rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.g-complete:hover{background:var(--sea-d)}
.g-complete.done{background:var(--sea-tint);color:var(--sea-d);border:1.5px solid var(--sea-bd)}
.g-complete svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next{font-family:inherit;font-weight:700;font-size:.92rem;color:var(--ink);background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.75rem 1.4rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s}
.g-next:hover{border-color:var(--ink)}
.g-next svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next[disabled]{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

/* ── PNG export ── */
.g-export-btn{background:none;border:1.5px solid var(--border);border-radius:9px;padding:.34rem .5rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;flex:0 0 auto;font-family:inherit}
.g-export-btn:hover{border-color:var(--sky);color:var(--sky)}
.g-export-btn:disabled{opacity:.55;cursor:default;border-color:var(--border);color:var(--muted)}
.g-export-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.png-export-card{width:800px;box-sizing:border-box;background:var(--cream);padding:38px;font-family:'Outfit',sans-serif;color:var(--ink)}
.pec-inner{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:34px 36px 26px}
.pec-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:0 0 10px}
.pec-title{font-size:1.7rem;font-weight:900;letter-spacing:-.01em;margin:0;line-height:1.12}
.pec-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:5px 0 0}
.pec-body{margin-top:22px}
.pec-body>.g-body>*:first-child{margin-top:0}
.pec-body .g-sec-label:first-child{margin-top:6px}
.pec-foot{margin-top:28px;padding-top:16px;border-top:1.5px solid var(--border);font-size:.75rem;font-weight:600;color:var(--muted)}
.pec-foot b{color:var(--sky);font-weight:800}
</style>
</head>

<script>const LESSONS=[{"id":"subjunctive","title":"Subjunctive & mandative","subtitle":"It is essential that she be informed","intro":"A verb form that quietly survived into formal English - and it carries real weight in your C1 writing.","desc":"The subjunctive is the base form of the verb used in certain subordinate clauses - regardless of subject and tense. It appears after mandative verbs (suggest, recommend, insist, demand) and in fixed formal expressions. At C1 it is expected in formal writing.","tip":"Plenty of my students reach for <em>should<\/em> instead of the subjunctive, and in British English that's perfectly fine: <em>\"I suggest that he should attend\"<\/em> is correct. But the bare subjunctive - <em>\"I suggest that he attend\"<\/em> - is more formal and frankly more impressive at C1. Both are valid; having both gives you room to shift register at will.","explanation":"<p>The subjunctive uses the <strong>base form of the verb<\/strong> for all subjects and in all tenses - no -s for third person, no was (use were), no negative auxiliary.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Mandative subjunctive<\/strong> - after verbs and adjectives of recommendation, requirement, suggestion, and demand. The pattern is: verb/adjective + <em>that<\/em> + subject + <strong>base form<\/strong>.<br>\n<em>\"The committee recommended that the proposal be rejected.\"<\/em><br>\n<em>\"It is essential that every candidate submit their application by Friday.\"<\/em><br>\n<em>\"She insisted that he attend in person.\"<\/em><br>\nMandative verbs: <em>suggest, recommend, insist, demand, require, request, propose, urge, ask.<\/em><br>\nMandative adjectives: <em>essential, vital, important, necessary, imperative, advisable, crucial.<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Were-subjunctive<\/strong> - <em>were<\/em> for all subjects in hypothetical clauses, regardless of number. Already seen in second conditional. At C1 it extends to other structures:<br>\n<em>\"If this were to happen, the consequences would be severe.\"<\/em><br>\n<em>\"Were she to resign, the company would face a crisis.\"<\/em> (formal inversion)<br>\n<em>\"I wish it were different.\"<\/em> / <em>\"As it were.\"<\/em> (fixed expression)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Fixed formal expressions with subjunctive:<\/strong><br>\n<em>So be it. / Be that as it may. / Come what may. / Far be it from me to... / Suffice it to say. / As it were.<\/em><br>\nThese are fixed - memorise them as chunks. They appear in formal speech and writing.<\/div><\/div>\n<div class=\"note\"><strong>British vs American English:<\/strong><br>\nAmerican English strongly prefers the bare subjunctive: <em>\"It is essential that he be present.\"<\/em><br>\nBritish English accepts both the subjunctive <em>and<\/em> <em>should<\/em>: <em>\"It is essential that he should be present.\"<\/em><br>\nFor C1 exams (CAE), the subjunctive is marked as correct and impressive. The <em>should<\/em> alternative is also accepted.<br>\n<strong>Negative subjunctive:<\/strong> <em>not<\/em> comes directly before the base form - no auxiliary: <em>\"She insisted that he not be told.\"<\/em><\/div>","table":{"headers":["Pattern","Example","Register"],"rows":[["verb + that + subj + base form","She recommended that he apply.","Formal"],["adj + that + subj + base form","It is vital that this be addressed.","Formal/written"],["Were-subjunctive (hypothetical)","Were this to continue, action would follow.","Formal"],["Negative subjunctive","She demanded that he not attend.","Formal"],["Should alternative (British)","It is essential that he should be told.","Formal (both correct)"],["Fixed expressions","Be that as it may. / Come what may.","Formal/idiomatic"]]},"examples":[{"type":"pos","eng":"The board insisted that the CEO resign immediately.","note":"Mandative insist + that + base form - no -s on resign."},{"type":"pos","eng":"It is imperative that all staff be notified before the announcement.","note":"Adjective + that + base form - be, not is/are."},{"type":"pos","eng":"Were the situation to deteriorate, emergency measures would be activated.","note":"Were-subjunctive with formal inversion - hypothetical conditional."},{"type":"pos","eng":"She demanded that the report not be released to the press.","note":"Negative subjunctive - not directly before base form, no auxiliary."}],"errors":[{"bad":"The committee recommended that he attends the hearing.","good":"The committee recommended that he attend the hearing.","reason":"Mandative subjunctive - base form for all subjects. No -s on third person."},{"bad":"It is essential that she is informed immediately.","good":"It is essential that she be informed immediately.","reason":"Adjective + that clause - subjunctive be, not is."},{"bad":"She insisted that he didn't attend.","good":"She insisted that he not attend.","reason":"Negative subjunctive uses not + base form directly - no auxiliary didn't."}],"realUse":[],"exercises":[{"type":"gap","title":"Mandative subjunctive","sub":"Fill each gap with the correct subjunctive form.","items":[{"answer":"be","before":"It is essential that every applicant ","after":" interviewed in person."},{"answer":"attend","before":"The professor insisted that all students ","after":" the final lecture."},{"answer":"submit","before":"The guidelines require that each participant ","after":" a written report."},{"answer":"not be","before":"She demanded that the information ","after":" shared with the press."},{"answer":"have","before":"It is advisable that the patient ","after":" a full medical examination."},{"answer":"were","before":"If this ","after":" to happen, the consequences would be severe."},{"answer":"resign","before":"The board recommended that the director ","after":" from his position."},{"answer":"be notified","before":"It is crucial that all affected parties ","after":" before the deadline."}]},{"type":"mc","title":"Subjunctive or not?","sub":"Choose the correct form.","items":[{"q":"It is vital that the document _____ signed before midnight.","opts":["is","be","was","should be"],"answer":"be","explanation":"Mandative adjective + that clause → subjunctive be, not is. (Should be is also acceptable in British English but bare subjunctive is preferred at C1.)"},{"q":"The regulations stipulate that no employee _____ discriminated against.","opts":["is","be","was","were"],"answer":"be","explanation":"Formal/legal mandative context → subjunctive be."},{"q":"_____ this prove impossible, a contingency plan is in place.","opts":["If","Should","Were","Had"],"answer":"Should","explanation":"Should + subject + base verb = formal conditional inversion for possibility."},{"q":"She insisted that he _____ present at the meeting.","opts":["is","was","be","being"],"answer":"be","explanation":"Insist + that + subjunctive: he be (not is/was)."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using the keyword.","items":[{"original":"My advice: she should apply for the position.","keyword":"recommend","answer":"I recommend that she apply for the position."},{"original":"All staff must be informed before the announcement.","keyword":"essential","answer":"It is essential that all staff be informed before the announcement."},{"original":"He told us not to use the back entrance.","keyword":"insisted","answer":"He insisted that we not use the back entrance."},{"original":"If this situation continues, action will be taken.","keyword":"Were","answer":"Were this situation to continue, action would be taken."},{"original":"The report should not be released. (She demanded this.)","keyword":"demanded","answer":"She demanded that the report not be released."}]}]},{"id":"participle","title":"Participle clauses","subtitle":"Having finished the report, she left / Left alone, he panicked","intro":"Folding two clauses into one - for concision, style and precision all at once.","desc":"Participle clauses replace full subordinate clauses with a participle phrase, making sentences more economical and formal. They are extremely common in academic writing, journalism, and literary prose - and a clear marker of C1 proficiency.","tip":"The rule I guard hardest: the subject of the participle clause has to match the subject of the main clause. It's also the most-broken rule I see. <em>\"Walking down the street, a dog bit me\"<\/em> fails because the dog wasn't walking - the subject of <em>walking<\/em> and of <em>bit<\/em> must be the same person. Check that link every time.","explanation":"<p>Participle clauses use a participle (present, past, or perfect) to compress a subordinate clause. They are more economical than full clauses and carry a formal register.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Present participle clause (-ing)<\/strong> - active meaning, often simultaneous or causal.<br>\nSimultaneous: <em>\"She sat at her desk, reading the report.\"<\/em> (= while she read)<br>\nCausal: <em>\"Not knowing what to say, he remained silent.\"<\/em> (= because he didn't know)<br>\nSequential: <em>\"Opening the door, she stepped inside.\"<\/em> (= after/as she opened)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Past participle clause (-ed/irregular)<\/strong> - passive meaning.<br>\n<em>\"Exhausted by the journey, she went straight to bed.\"<\/em> (= because she was exhausted)<br>\n<em>\"Founded in 1854, the company has grown considerably.\"<\/em> (= which was founded)<br>\n<em>\"Left alone, he began to panic.\"<\/em> (= when/because he was left)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Perfect participle clause (having + pp)<\/strong> - action completed before the main clause.<br>\n<em>\"Having submitted the report, she felt relieved.\"<\/em> (= after she had submitted)<br>\n<em>\"Having been told the news, he sat in silence.\"<\/em> (= passive perfect - after being told)<br>\nUse when the time sequence between the two actions matters.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Negative participle clauses<\/strong> - <em>not<\/em> before the participle.<br>\n<em>\"Not wanting to cause offence, she said nothing.\"<\/em><br>\n<em>\"Not having received a reply, he sent a follow-up.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>The subject rule - the most important constraint:<\/strong><br>\nThe subject of the participle clause and the main clause MUST be the same.<br>\n<em>\"Walking to work, I saw an accident.\"<\/em> ✓ - I was walking, I saw it.<br>\n<em>\"Walking to work, an accident occurred.\"<\/em> ✗ - The accident wasn't walking.<br>\nThis error is called a <strong>dangling participle<\/strong> - very common in student writing at all levels.<br>\n<strong>With/without + participle<\/strong>: <em>\"He left without saying goodbye.\"<\/em> / <em>\"She sat with her arms folded.\"<\/em><\/div>","table":{"headers":["Type","Meaning","Example"],"rows":[["Present (-ing)","Active - simultaneous or causal","Not knowing the answer, she guessed."],["Past (-ed/pp)","Passive - causal or relative","Damaged in the storm, the car was written off."],["Perfect (having + pp)","Active - completed before main action","Having read the report, he called a meeting."],["Perfect passive (having been + pp)","Passive - completed before main action","Having been warned, she proceeded with caution."],["Negative","Not before the participle","Not wishing to intrude, he waited outside."],["With/without + -ing","Manner or accompanying circumstance","She left without leaving a note."]]},"examples":[{"type":"pos","eng":"Turning to face the audience, she paused before speaking.","note":"Present participle - sequential, same subject throughout."},{"type":"pos","eng":"Devastated by the news, he couldn't bring himself to speak.","note":"Past participle - passive meaning, causal."},{"type":"pos","eng":"Having spent three years on the project, the team was proud of the result.","note":"Perfect participle - completed before main verb."},{"type":"pos","eng":"Not having received any response, she decided to follow up in person.","note":"Negative perfect participle."}],"errors":[{"bad":"Walking down the street, a dog bit me.","good":"Walking down the street, I was bitten by a dog.","reason":"Dangling participle - the subject of walking and the main clause must match. A dog wasn't walking."},{"bad":"Having finished the work, the office was locked up.","good":"Having finished the work, she locked up the office.","reason":"The office didn't finish the work. The subject must be the same throughout."},{"bad":"Exhausting from the journey, he went straight to bed.","good":"Exhausted by the journey, he went straight to bed.","reason":"Past participle for passive meaning - exhausted (he was exhausted), not exhausting."}],"realUse":[],"exercises":[{"type":"gap","title":"Form the participle clause","sub":"Fill each gap with the correct participle form of the verb in brackets.","items":[{"answer":"Having submitted","before":"","after":" the application, she waited anxiously for a response. (submit - perfect)"},{"answer":"Exhausted","before":"","after":" by weeks of negotiations, the delegates finally reached an agreement. (exhaust - passive)"},{"answer":"Not knowing","before":"","after":" what to say, he remained silent. (know - negative present)"},{"answer":"Having been warned","before":"","after":" about the risks, she proceeded carefully. (warn - perfect passive)"},{"answer":"Turning","before":"","after":" to face the audience, the speaker paused. (turn - present)"},{"answer":"Founded","before":"","after":" in 1892, the institution has a long and distinguished history. (found - passive)"},{"answer":"Not having received","before":"","after":" a reply, she sent a follow-up message. (receive - negative perfect)"},{"answer":"Damaged","before":"","after":" beyond repair, the building was eventually demolished. (damage - passive)"}]},{"type":"mc","title":"Which participle form?","sub":"Choose the correct participle clause.","items":[{"q":"_____ by the scale of the response, the organisers decided to extend the event.","opts":["Overwhelming","Overwhelmed","Having overwhelmed","Being overwhelming"],"answer":"Overwhelmed","explanation":"Passive meaning - the organisers were overwhelmed → past participle."},{"q":"_____ three hours on the problem, she finally found a solution.","opts":["Spending","Spent","Having spent","Been spending"],"answer":"Having spent","explanation":"Completed action before the main verb → having + past participle."},{"q":"_____ how to respond, he said nothing.","opts":["Not knowing","Not known","Not having known","Unknown"],"answer":"Not knowing","explanation":"Negative present participle - simultaneous/causal: because he didn't know."},{"q":"_____ the report, the board called an emergency meeting.","opts":["Reading","Having read","Read","Been reading"],"answer":"Having read","explanation":"The reading was completed before the meeting - perfect participle."}]},{"type":"tf","title":"Dangling or not?","sub":"Is the participle clause correctly attached to the right subject?","items":[{"context":"Walking through the park, I noticed the flowers were in bloom.","statement":"This sentence is grammatically correct - the subjects match.","answer":"True","explanation":"I was walking, and I noticed - same subject throughout. ✓"},{"context":"Having finished the exam, the room fell silent.","statement":"This sentence is grammatically correct.","answer":"False","explanation":"Dangling participle - the room didn't finish the exam. Should be: Having finished the exam, the students fell silent."},{"context":"Devastated by the result, the coach resigned immediately.","statement":"The coach was devastated.","answer":"True","explanation":"Past participle (passive) - the coach was devastated. Same subject as resigned. ✓"},{"context":"Sitting by the window, the rain began to fall.","statement":"This sentence contains a dangling participle.","answer":"True","explanation":"The rain wasn't sitting by the window. The subject of sitting and the subject of began don't match."},{"context":"Not having been informed of the changes, she arrived unprepared.","statement":"She had been informed of the changes.","answer":"False","explanation":"Not having been informed = she had NOT been informed. The negative perfect passive."}]}]},{"id":"advcond","title":"Advanced conditionals: inversion","subtitle":"Were she to resign... / Had it not been for... / Should you need...","intro":"The formal conditional structures that drop the word <em>if<\/em> altogether.","desc":"At B2 you learnt third and mixed conditionals. At C1, the key addition is the formal inversion of conditional clauses - dropping <em>if<\/em> and moving the auxiliary to the front. This appears constantly in formal correspondence, legal language, and academic writing. It signals sophistication.","tip":"There are three patterns and they map neatly onto the three conditionals: <strong>Should<\/strong> for the first/open conditional, <strong>Were...to<\/strong> for the second, and <strong>Had<\/strong> for the third - each simply replacing its <em>if<\/em> version. Being able to both spot and produce all three is a real C1 target, so practise them as a set.","explanation":"<p>Formal conditional inversion removes <em>if<\/em> and fronts the auxiliary. The meaning is identical to the standard conditional - only the register changes.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Should + subject + base verb<\/strong> - formal first conditional (possibility). Replaces <em>if + present simple<\/em>.<br>\n<em>\"Should you require further information, please do not hesitate to contact us.\"<\/em><br>\n<em>\"Should the situation change, we will inform you immediately.\"<\/em><br>\nVery common in formal correspondence. The result clause uses will/would/imperative.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Were + subject + to + base verb<\/strong> - formal second conditional (hypothetical). Replaces <em>if + past simple<\/em>.<br>\n<em>\"Were the company to collapse, thousands of jobs would be lost.\"<\/em><br>\n<em>\"Were she to discover the truth, the consequences would be serious.\"<\/em><br>\nAlso: <em>\"Were it not for your support, we would have failed.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Had + subject + past participle<\/strong> - formal third conditional (imaginary past). Replaces <em>if + past perfect<\/em>.<br>\n<em>\"Had the report been submitted on time, this crisis would have been avoided.\"<\/em><br>\n<em>\"Had it not been for her intervention, the situation could have escalated.\"<\/em><br>\nThe result clause uses would have / could have / might have + past participle.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Were it not for / Had it not been for<\/strong> - expressing what prevents or prevented something. Extremely common in formal and literary English.<br>\n<em>\"Were it not for the generous funding, this research would be impossible.\"<\/em><br>\n<em>\"Had it not been for her courage, the situation would have been far worse.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Register note:<\/strong> These inversions are formal and written. In spoken English, the <em>if<\/em> versions are always natural and preferred. Using <em>\"Should you require...\"<\/em> in casual conversation would sound strange.<br>\n<strong>No inversion in the result clause:<\/strong> The inversion applies only to the condition clause - the result clause keeps normal word order.<br>\n<em>\"Were this to fail, we would need a new strategy.\"<\/em> - inversion in condition only.<\/div>","table":{"headers":["Inversion","Standard equivalent","Register"],"rows":[["Should + subject + base verb","If + present simple","Formal - possibility"],["Were + subject + to + base","If + past simple (hypothetical)","Formal - hypothetical"],["Had + subject + past participle","If + past perfect","Formal - imaginary past"],["Were it not for + noun","If it were not for + noun","Formal - preventing factor (present)"],["Had it not been for + noun","If it had not been for + noun","Formal - preventing factor (past)"]]},"examples":[{"type":"pos","eng":"Should you have any questions, please feel free to contact our team.","note":"Should inversion - formal correspondence opening."},{"type":"pos","eng":"Were the project to exceed its budget, additional approval would be required.","note":"Were...to inversion - hypothetical consequence."},{"type":"pos","eng":"Had the vaccine been available earlier, countless lives would have been saved.","note":"Had inversion - imaginary past."},{"type":"pos","eng":"Were it not for the team's dedication, the launch would not have been possible.","note":"Were it not for - what prevents the negative outcome."}],"errors":[{"bad":"Were she discover the truth, the consequences would be severe.","good":"Were she to discover the truth, the consequences would be severe.","reason":"Were + subject + to + base verb - to is required between were and the verb."},{"bad":"Should you will need assistance, please call this number.","good":"Should you need assistance, please call this number.","reason":"Should inversion uses the base form - no will after should."},{"bad":"Had the report been submitted on time, this crisis would avoid.","good":"Had the report been submitted on time, this crisis would have been avoided.","reason":"Third conditional result: would have + past participle."}],"realUse":[],"exercises":[{"type":"gap","title":"Formal conditional inversion","sub":"Rewrite the if-clause using formal inversion.","items":[{"answer":"Should you require","before":"If you require further information → ","after":" further information, please contact us."},{"answer":"Were the company to collapse","before":"If the company collapsed → ","after":", thousands would lose their jobs."},{"answer":"Had the decision been made earlier","before":"If the decision had been made earlier → ","after":", the crisis would have been avoided."},{"answer":"Were it not for","before":"If it were not for their support → ","after":" their support, we would have failed."},{"answer":"Should the situation change","before":"If the situation changes → ","after":", you will be notified immediately."},{"answer":"Had it not been for","before":"If it had not been for her intervention → ","after":" her intervention, things could have been much worse."}]},{"type":"mc","title":"Which inversion?","sub":"Choose the correct formal conditional.","items":[{"q":"_____ any problems arise, please contact the helpdesk immediately.","opts":["Were","Had","Should","If"],"answer":"Should","explanation":"Should + subject + base verb = formal first conditional (open possibility)."},{"q":"_____ the merger to go ahead, significant restructuring would follow.","opts":["Should","Had","Were","If"],"answer":"Were","explanation":"Were + subject + to + base verb = formal second conditional (hypothetical)."},{"q":"_____ the warning been heeded, the disaster would have been prevented.","opts":["Were","Should","Had","If"],"answer":"Had","explanation":"Had + subject + pp = formal third conditional (imaginary past)."},{"q":"_____ it not been for the rain, the outdoor event would have been perfect.","opts":["Were","Had","Should","If"],"answer":"Had","explanation":"Had it not been for = if it had not been for - past preventing factor."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite each sentence using formal conditional inversion.","items":[{"original":"If you need any assistance, please do not hesitate to call.","keyword":"Should","answer":"Should you need any assistance, please do not hesitate to call."},{"original":"If the policy were to change, we would need to reconsider our position.","keyword":"Were","answer":"Were the policy to change, we would need to reconsider our position."},{"original":"If she had known about the problem, she would have acted sooner.","keyword":"Had","answer":"Had she known about the problem, she would have acted sooner."},{"original":"If it were not for the funding, this project would be impossible.","keyword":"Were it","answer":"Were it not for the funding, this project would be impossible."},{"original":"If it had not been for his quick thinking, the situation could have been fatal.","keyword":"Had it","answer":"Had it not been for his quick thinking, the situation could have been fatal."}]}]},{"id":"nounclauses","title":"Advanced noun clauses","subtitle":"the fact that, what struck me, it being the case that","intro":"Whole clauses doing the job of a noun - standing in as subjects, objects and complements.","desc":"Noun clauses replace nouns in a sentence - they can be the subject, object, or complement of a clause. At C1 the challenge is the more complex structures: abstract noun + that-clause, the fact that, it-extraposition, and nominal wh-clauses.","tip":"The most useful move here is <strong>it-extraposition<\/strong> - shifting a heavy subject to the end so the sentence breathes. <em>\"That the results are inconclusive is disappointing\"<\/em> is correct but top-heavy; <em>\"It is disappointing that the results are inconclusive\"<\/em> is what a native writer actually produces. At C1, choosing the more readable structure is part of the skill.","explanation":"<p>Noun clauses function as the subject, object, or complement of a sentence. At C1 they appear in complex academic and formal constructions.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Abstract noun + that-clause (appositives)<\/strong> - a noun followed by a that-clause that explains or specifies it.<br>\n<em>\"The fact that she refused surprised everyone.\"<\/em><br>\n<em>\"The possibility that the results are wrong cannot be ignored.\"<\/em><br>\n<em>\"His claim that the data was fabricated proved unfounded.\"<\/em><br>\nCommon nouns: <em>fact, idea, possibility, claim, suggestion, belief, hope, fear, news, evidence, assumption, conclusion.<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>It-extraposition<\/strong> - moving a heavy subject noun clause to the end, replacing it with <em>it<\/em> at the front. Much more natural in English than a fronted clause.<br>\n<em>\"It is disappointing that no progress has been made.\"<\/em> (= That no progress has been made is disappointing.)<br>\n<em>\"It remains to be seen whether the policy will succeed.\"<\/em><br>\n<em>\"It is not yet clear what the implications are.\"<\/em><br>\nPattern: It + be/seem/appear/remain + adjective/past participle + that/whether/what clause.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Nominal wh-clauses<\/strong> - wh-word + clause functioning as a noun.<br>\n<em>\"What struck me most was her composure.\"<\/em> (subject)<br>\n<em>\"No one knows who is responsible.\"<\/em> (object)<br>\n<em>\"The question is whether we can afford it.\"<\/em> (complement)<br>\n<em>\"How the decision was reached remains unclear.\"<\/em> (subject)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Whether vs if in noun clauses<\/strong> - both introduce indirect yes/no questions, but differ in some contexts.<br>\n<em>Whether<\/em> - preferred in formal writing; used as subject, after prepositions, before <em>to<\/em>, and with <em>or not<\/em> directly after.<br>\n<em>If<\/em> - more informal; only as object, not as subject or after prepositions.<br>\n<em>\"Whether to proceed is the key question.\"<\/em> (subject - whether only)<br>\n<em>\"It depends on whether the funding comes through.\"<\/em> (after preposition - whether only)<\/div><\/div>\n<div class=\"note\"><strong>Avoiding heavy subjects:<\/strong><br>\nHeavy (grammatically correct but stylistically poor): <em>\"That the project failed to meet its targets is a matter of concern.\"<\/em><br>\nNatural (extraposed): <em>\"It is a matter of concern that the project failed to meet its targets.\"<\/em><br>\nAs a rule of thumb: if the subject clause is longer than the predicate, extrapose it.<br>\n<strong>Sequence of tenses:<\/strong> After past reporting/thinking verbs, the that-clause normally backshifts: <em>\"She believed that the report was accurate.\"<\/em> No backshift if still true: <em>\"She noted that water boils at 100°C.\"<\/em><\/div>","table":{"headers":["Type","Structure","Example"],"rows":[["Abstract noun + that-clause","noun + that + clause","The possibility that he lied disturbs me."],["It-extraposition","It + be + adj + that/whether","It is unclear whether the plan will work."],["Nominal wh-clause (subject)","What/How/Whether + clause + verb","What matters most is consistency."],["Nominal wh-clause (object)","verb + what/whether/how + clause","No one knows what happened next."],["Whether vs if (formal)","whether as subject / after prepositions","Whether to proceed is the key decision."],["Sequence of tenses","past verb → backshift in that-clause","She said that the results had been promising."]]},"examples":[{"type":"pos","eng":"The fact that no one raised objections suggests unanimous agreement.","note":"Abstract noun + that-clause as subject."},{"type":"pos","eng":"It remains to be seen whether the new measures will have any effect.","note":"It-extraposition with remains to be seen - fixed formal phrase."},{"type":"pos","eng":"What concerns me most is not the outcome but the process.","note":"Nominal wh-clause as subject - cleft-like structure."},{"type":"pos","eng":"The assumption that growth would continue proved unfounded.","note":"Abstract noun + that-clause - appositive."}],"errors":[{"bad":"It is important that she is told immediately.","good":"It is important that she be told immediately.","reason":"After it is important that - mandative subjunctive: be, not is."},{"bad":"The fact that he refused to comment it suggests guilt.","good":"The fact that he refused to comment suggests guilt.","reason":"Don't add a pronoun (it) after the appositive that-clause - it is already the subject."},{"bad":"No one knows if this is the right decision or not.","good":"No one knows whether this is the right decision or not.","reason":"Or not directly after if is not standard - use whether or not / whether...or not."}],"realUse":[],"exercises":[{"type":"gap","title":"Complete the noun clause structure","sub":"Fill each gap with the correct word or phrase.","items":[{"answer":"that","before":"The fact ","after":" she resigned surprised the whole industry."},{"answer":"whether","before":"It remains to be seen ","after":" the reform will achieve its aims."},{"answer":"What","before":"","after":" struck me most was her absolute composure under pressure."},{"answer":"It is widely believed","before":"","after":" that the decision was politically motivated."},{"answer":"whether","before":"The question of ","after":" to proceed now divides the committee."},{"answer":"that","before":"The possibility ","after":" the figures had been manipulated was deeply troubling."},{"answer":"What","before":"","after":" matters in the long term is consistency, not short-term gain."},{"answer":"It remains unclear","before":"","after":" how the breach occurred."}]},{"type":"mc","title":"It-extraposition or noun clause?","sub":"Choose the most natural or correct form.","items":[{"q":"_____ the economy will recover quickly seems unlikely.","opts":["It","That","What","Whether"],"answer":"That","explanation":"That-clause as subject - grammatically fine, though it-extraposition would be more natural: 'It seems unlikely that the economy will recover quickly.'"},{"q":"_____ is not yet clear what caused the failure.","opts":["That","What","It","Whether"],"answer":"It","explanation":"It-extraposition: It + is/remains/seems + adjective + what-clause."},{"q":"She was unaware of _____ the contract had been terminated.","opts":["that","what","whether","if"],"answer":"whether","explanation":"After a preposition (of), use whether not if or that."},{"q":"_____ she did next shocked everyone in the room.","opts":["That","It","What","Whether"],"answer":"What","explanation":"Nominal wh-clause as subject: What + subject + verb = noun clause."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using the keyword.","items":[{"original":"That no agreement was reached is extremely disappointing.","keyword":"It is","answer":"It is extremely disappointing that no agreement was reached."},{"original":"She said the results were very promising.","keyword":"that","answer":"She said that the results were very promising."},{"original":"The most important thing is consistency.","keyword":"What","answer":"What matters most is consistency."},{"original":"Her assumption: the funding would continue. It proved wrong.","keyword":"The assumption that","answer":"The assumption that the funding would continue proved wrong."},{"original":"We don't know if the project will succeed or not.","keyword":"whether","answer":"We don't know whether the project will succeed or not."}]}]},{"id":"fronting","title":"Fronting","subtitle":"Only then did she realise / What he did was unacceptable","intro":"Pulling elements to the front of a sentence for emphasis, contrast or sharp focus.","desc":"Fronting places a non-subject element at the beginning of a clause for emphasis or stylistic effect. At C1 it is expected as a mark of sophisticated writing and formal register. It often triggers inversion of subject and auxiliary.","tip":"Fronting and inversion overlap a lot - those B2 patterns (<em>Never have I<\/em>, <em>Not only did she<\/em>) are really a kind of fronting. C1 pushes it further, to fronted objects, complements, adverbials and wh-clauses. The thing to nail down is <em>when<\/em> inversion is required (after a negative or restrictive adverbial) and when it isn't (after a fronted object or complement).","explanation":"<p>Fronting moves an element to the beginning of a clause for focus, contrast, or rhetorical emphasis.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Fronted object (topicalisation)<\/strong> - no inversion required. The object moves to the front but word order in the rest stays normal.<br>\n<em>\"This I cannot accept.\"<\/em> (= I cannot accept this.)<br>\n<em>\"The report, she had never seen.\"<\/em> (= She had never seen the report.)<br>\n<em>\"His work I admire enormously, but his personality leaves something to be desired.\"<\/em><br>\nCommon in literary and rhetorical contexts. Signals contrast or strong emphasis.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Fronted complement<\/strong> - adjective or noun complement moved to the front. No inversion.<br>\n<em>\"Remarkable was her composure under pressure.\"<\/em><br>\n<em>\"Central to the argument is the question of accountability.\"<\/em><br>\n<em>\"More worrying still is the lack of transparency.\"<\/em><br>\nCommon in formal written English - particularly academic and journalistic.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Fronted adverbial - with inversion<\/strong> - negative and restrictive adverbials trigger subject-auxiliary inversion. (Covered in B2 inversion lesson - extended here.)<br>\n<em>\"Under no circumstances will this be tolerated.\"<\/em><br>\n<em>\"On no account should you sign without reading.\"<\/em><br>\n<em>\"Only then did she realise the scale of the problem.\"<\/em><br>\n<em>\"In no way does this represent the company's position.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Fronted wh-clause<\/strong> - a nominal wh-clause placed first for emphasis.<br>\n<em>\"What he did next shocked everyone.\"<\/em> (no inversion - the wh-clause is the subject)<br>\n<em>\"What I find most impressive is her resilience.\"<\/em> (wh-cleft - covered in B2)<\/div><\/div>\n<div class=\"note\"><strong>When does inversion occur?<\/strong><br>\n✓ After negative/restrictive adverbials: <em>never, rarely, only, not only, under no circumstances, on no account, in no way, at no time, seldom, hardly, no sooner.<\/em><br>\n✗ After fronted objects: <em>\"This I cannot accept.\"<\/em> - no inversion.<br>\n✗ After fronted complements: <em>\"Remarkable was her composure.\"<\/em> - inversion of be/linking verb only, not do-support.<br>\n<strong>Stylistic caution:<\/strong> Fronting is a powerful rhetorical tool. Overuse weakens its effect. Reserve it for moments of genuine emphasis or contrast.<\/div>","table":{"headers":["Type","Inversion?","Example"],"rows":[["Fronted object","No","This offer, I cannot refuse."],["Fronted complement (adj)","Linking verb only","Central to this is the question of trust."],["Fronted negative adverbial","Yes (full inversion)","Under no circumstances will this be accepted."],["Fronted restrictive adverbial","Yes","Only after the meeting did she understand."],["Fronted wh-clause (subject)","No","What concerns me is the lack of data."],["Fronted prepositional phrase","Sometimes","In this context, the decision makes sense."]]},"examples":[{"type":"pos","eng":"The consequences of this decision, we are only beginning to understand.","note":"Fronted object - no inversion, strong emphasis."},{"type":"pos","eng":"Central to the entire debate is the question of who bears responsibility.","note":"Fronted complement - be inverts, no do-support needed."},{"type":"pos","eng":"Under no circumstances should personal data be shared with third parties.","note":"Fronted negative adverbial - should inverts before subject."},{"type":"pos","eng":"Only after years of research did the team arrive at a credible explanation.","note":"Only after - fronted adverbial triggering inversion."}],"errors":[{"bad":"Under no circumstances we will accept this offer.","good":"Under no circumstances will we accept this offer.","reason":"Negative fronted adverbial triggers inversion - will before we."},{"bad":"Only then she realised the full extent of the problem.","good":"Only then did she realise the full extent of the problem.","reason":"Only then triggers inversion - did before she."},{"bad":"This I will not to accept.","good":"This I will not accept.","reason":"Fronted object - no inversion, and no to after will."}],"realUse":[],"exercises":[{"type":"gap","title":"Complete the fronted structure","sub":"Fill each gap to complete the fronted sentence.","items":[{"answer":"will this","before":"Under no circumstances ","after":" be permitted."},{"answer":"did she","before":"Only then ","after":" understand what had really happened."},{"answer":"is the question of accountability","before":"Central to the entire argument ","after":"."},{"answer":"does this","before":"In no way ","after":" reflect our official position."},{"answer":"I cannot","before":"This offer, ","after":" refuse."},{"answer":"should you","before":"On no account ","after":" sign without reading the full contract."},{"answer":"was her composure","before":"Remarkable throughout the entire ordeal ","after":"."},{"answer":"did the team","before":"Only after months of analysis ","after":" reach a conclusion."}]},{"type":"mc","title":"Fronting - inversion required or not?","sub":"Choose the correct sentence.","items":[{"q":"Under no circumstances _____ this be disclosed to the public.","opts":["is","should","we should","that"],"answer":"should","explanation":"Negative fronted adverbial → inversion: should before the subject (implied 'it')."},{"q":"His courage _____ but his judgement leaves much to be desired.","opts":["I admire","do I admire","admire I","I do admire"],"answer":"I admire","explanation":"Fronted object - no inversion. Normal subject-verb order in the rest of the clause."},{"q":"Central to the problem _____ the lack of communication.","opts":["is","does lie","it is","there is"],"answer":"is","explanation":"Fronted complement - be inverts with subject (the lack of communication is central → fronted: Central... is the lack...)."},{"q":"Only when she read the letter _____ the full truth.","opts":["she understood","understood she","did she understand","she did understand"],"answer":"did she understand","explanation":"Only when triggers inversion: did + she + base form."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using fronting.","items":[{"original":"We will not accept this under any circumstances.","keyword":"Under no circumstances","answer":"Under no circumstances will we accept this."},{"original":"The question of trust is central to the entire argument.","keyword":"Central","answer":"Central to the entire argument is the question of trust."},{"original":"She only understood the truth after reading the report.","keyword":"Only after","answer":"Only after reading the report did she understand the truth."},{"original":"This decision I find completely unacceptable.","keyword":"This decision","answer":"This decision I find completely unacceptable."},{"original":"We will not tolerate this in any way.","keyword":"In no way","answer":"In no way will we tolerate this."}]}]},{"id":"gerundnominal","title":"Gerund clauses: nominal use","subtitle":"His refusing to cooperate / There is no point in our discussing","intro":"Gerunds working as full noun phrases - subjects, objects and complements in their own right.","desc":"At B1/B2 you learnt which verbs take gerunds or infinitives. At C1 the gerund extends to its full nominal function: as a subject, as the object of a preposition in complex noun phrases, and crucially with a possessive or object pronoun before it. This is where learners at C1 commonly make errors.","tip":"The C1 distinction I want you to own is possessive + gerund. <em>\"I don't mind him being late\"<\/em> is the informal version (object pronoun); <em>\"I don't mind his being late\"<\/em> is the formal one (possessive). Both are valid, and formal writing prefers the possessive. Most learners only know the first - carrying both is a clear C1 marker.","explanation":"<p>At C1, gerunds are used as full noun phrases in complex grammatical roles beyond simple verb complementation.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Gerund as subject<\/strong> - a gerund phrase can be the subject of a sentence. More formal than an infinitive subject with <em>it<\/em>.<br>\n<em>\"Reaching a consensus proved more difficult than expected.\"<\/em><br>\n<em>\"Overlooking such an obvious error is inexcusable.\"<\/em><br>\n<em>\"Having made the commitment, withdrawing now would be embarrassing.\"<\/em> (perfect gerund as subject)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Possessive + gerund<\/strong> - the gerund has its own subject, marked with a possessive (formal) or object pronoun (informal).<br>\nFormal: <em>\"His refusing to cooperate complicated matters.\"<\/em><br>\nInformal: <em>\"Him refusing to cooperate complicated matters.\"<\/em><br>\nFormal: <em>\"I resent his constantly interrupting.\"<\/em><br>\nInformal: <em>\"I resent him constantly interrupting.\"<\/em><br>\nWith nouns: <em>\"The team's winning the contract surprised everyone.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Preposition + gerund phrase<\/strong> - after prepositions, the gerund is required. At C1 these appear in more complex noun phrases.<br>\n<em>\"There is no possibility of resolving this quickly.\"<\/em><br>\n<em>\"The decision was taken without there being any consultation.\"<\/em><br>\n<em>\"The risk of misunderstanding the data is significant.\"<\/em><br>\n<em>\"In spite of having been warned, she proceeded.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Gerund in complex noun phrases<\/strong> - gerund as the complement of abstract nouns.<br>\n<em>\"There is no point in prolonging the discussion.\"<\/em><br>\n<em>\"There is no denying that mistakes were made.\"<\/em><br>\n<em>\"There is little prospect of reaching an agreement.\"<\/em><br>\n<em>\"The idea of starting over was daunting.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Gerund vs infinitive as subject - register difference:<\/strong><br>\nGerund subject (more formal, more concise): <em>\"Reaching consensus proved difficult.\"<\/em><br>\nIt + infinitive (natural, common): <em>\"It proved difficult to reach consensus.\"<\/em><br>\nBoth are correct - the gerund subject feels more literary/academic.<br>\n<strong>Negative gerund:<\/strong> <em>not<\/em> before the gerund: <em>\"Not telling her was a mistake.\"<\/em> / <em>\"His not having replied suggested disinterest.\"<\/em><\/div>","table":{"headers":["Pattern","Example","Register"],"rows":[["Gerund as subject","Ignoring the evidence is not an option.","Formal/written"],["Possessive + gerund (formal)","His refusing to answer was suspicious.","Formal"],["Object pronoun + gerund (informal)","I don't mind him being late.","Informal/spoken"],["Preposition + gerund phrase","There is no chance of resolving this.","Neutral/formal"],["There is no + gerund","There is no denying the scale of the problem.","Fixed formal patterns"],["Negative gerund","Not finishing the work on time was unacceptable.","Formal"]]},"examples":[{"type":"pos","eng":"His refusing to provide a statement only deepened suspicion.","note":"Possessive + gerund as subject - formal register."},{"type":"pos","eng":"There is no question of the project being abandoned at this stage.","note":"There is no question of + gerund - fixed formal pattern."},{"type":"pos","eng":"The team's winning the contract came as a complete surprise to the industry.","note":"Noun possessive + gerund as subject."},{"type":"pos","eng":"I strongly object to his being given preferential treatment.","note":"Object + possessive + gerund after preposition to."}],"errors":[{"bad":"His refuse to cooperate was noted.","good":"His refusing to cooperate was noted.","reason":"Possessive + gerund - the gerund form (refusing), not the base noun form (refusal/refuse)."},{"bad":"There is no point to discuss this further.","good":"There is no point in discussing this further.","reason":"There is no point in + gerund - preposition in is required, then gerund."},{"bad":"I resent him to interrupt me constantly.","good":"I resent him interrupting me constantly.","reason":"Resent + object + gerund - not infinitive."}],"realUse":[],"exercises":[{"type":"gap","title":"Gerund nominal structures","sub":"Fill each gap with the correct gerund construction.","items":[{"answer":"his refusing","before":"","after":" to comply was seen as a serious breach of protocol."},{"answer":"in discussing","before":"There is no point ","after":" this further until we have the full data."},{"answer":"of the situation improving","before":"There is little prospect ","after":" in the short term."},{"answer":"her constantly interrupting","before":"I strongly object to ","after":" the proceedings."},{"answer":"Not having been","before":"","after":" consulted, she felt understandably aggrieved."},{"answer":"of starting","before":"The idea ","after":" again from scratch was deeply unappealing."},{"answer":"There is no denying","before":"","after":" that significant mistakes were made."},{"answer":"the team's winning","before":"","after":" the contract was a remarkable achievement."}]},{"type":"mc","title":"Possessive or object pronoun?","sub":"Choose the more formal option, unless informal is specified.","items":[{"q":"_____ refusing to cooperate was noted in the report. (formal)","opts":["Him","His","He","Himself"],"answer":"His","explanation":"Possessive + gerund = formal. His refusing (not him refusing)."},{"q":"I don't mind _____ being here. (informal, spoken)","opts":["his","he","him","himself"],"answer":"him","explanation":"Object pronoun + gerund = informal. Both are correct; informal speech prefers him."},{"q":"There is no point _____ arguing about this.","opts":["to","in","of","for"],"answer":"in","explanation":"There is no point in + gerund - preposition in is fixed."},{"q":"The prospect _____ reaching agreement seems remote.","opts":["to","for","of","in"],"answer":"of","explanation":"Abstract noun prospect + of + gerund - prospect of reaching."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using the keyword.","items":[{"original":"He refused to cooperate and that complicated matters. (formal)","keyword":"His","answer":"His refusing to cooperate complicated matters."},{"original":"There is no possibility that this will be resolved quickly.","keyword":"of","answer":"There is no possibility of this being resolved quickly."},{"original":"It is pointless to continue the debate.","keyword":"There is no point","answer":"There is no point in continuing the debate."},{"original":"She had not been informed and that was inexcusable.","keyword":"Not having been","answer":"Not having been informed was inexcusable."},{"original":"I object to the fact that he receives preferential treatment.","keyword":"his","answer":"I object to his receiving preferential treatment."}]}]},{"id":"concession","title":"Concession structures","subtitle":"Much as I admire her / For all his talent / Be that as it may","intro":"The refined ways of conceding a point while holding firm to a contrasting position.","desc":"Concession structures acknowledge something is true while arguing for a different conclusion. At C1 they go well beyond although and despite to include much as, for all, whatever, however + adjective/adverb, and a range of formal fixed expressions. These are the hallmark of academic argument.","tip":"At C1 the skill is matching the concession to the moment. <em>Although<\/em> is always safe. <em>Much as<\/em> signals genuine admiration even as you disagree. <em>For all that<\/em> is more dismissive. <em>Be that as it may<\/em> is the most formal - it grants the point fully and then steps past it. Each one carries a different weight, so choose deliberately.","explanation":"<p>C1 concession structures allow more nuanced acknowledgement of opposing points - essential for formal argument and academic writing.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Much as / Much though<\/strong> - conceding genuine admiration or acknowledgement, followed by a contrast. More emphatic and personal than although.<br>\n<em>\"Much as I admire her work, I cannot endorse this particular decision.\"<\/em><br>\n<em>\"Much as it pains me to admit it, the evidence is compelling.\"<\/em><br>\n<em>\"Much though I respect his opinion, I must disagree.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>For all + noun phrase / For all that<\/strong> - despite all of something; often carries a slightly dismissive tone.<br>\n<em>\"For all his talent, he has never fulfilled his potential.\"<\/em><br>\n<em>\"For all the progress made, significant challenges remain.\"<\/em><br>\n<em>\"For all that, the plan is fundamentally flawed.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Whatever / However / Whoever + clause<\/strong> - universal concession covering all possibilities.<br>\n<em>\"Whatever the outcome, we must stand by our decision.\"<\/em><br>\n<em>\"However persuasive the argument, the facts speak for themselves.\"<\/em> (however + adjective/adverb, no inversion)<br>\n<em>\"Wherever she goes, she leaves a strong impression.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Be that as it may / That said / Granted<\/strong> - fixed formal expressions acknowledging a point before pivoting.<br>\n<em>\"Be that as it may, the decision has been made.\"<\/em> (acknowledges fully, moves on - most formal)<br>\n<em>\"Granted, the methodology has limitations. Nevertheless, the findings are significant.\"<\/em><br>\n<em>\"That said, there are good reasons to be cautious.\"<\/em> (informal equivalent)<\/div><\/div>\n<div class=\"note\"><strong>However + adjective - no inversion:<\/strong><br>\n<em>\"However persuasive the argument may be, the data does not support it.\"<\/em> ✓<br>\n<em>\"However persuasive be the argument...\"<\/em> ✗ - no inversion after however used this way.<br>\nCompare: <em>However<\/em> at the start of a new sentence (B1/B2) = contrast connector, followed by comma.<br>\n<em>However + adjective/adverb<\/em> = concession = whatever degree of + adjective. Different structure, different meaning.<\/div>","table":{"headers":["Structure","Use","Example"],"rows":[["Much as + clause","Genuine admiration/acknowledgement + contrast","Much as I respect him, I disagree."],["For all + noun","Despite all of - slightly dismissive","For all his experience, he made errors."],["For all that","Despite everything already said","For all that, the proposal is flawed."],["Whatever/However/Wherever","Universal concession","Whatever the cost, we must proceed."],["However + adj/adv + clause","Regardless of the degree","However convincing, the argument fails."],["Be that as it may","Full acknowledgement + move on (very formal)","Be that as it may, we must act."],["Granted / Admittedly","Partial concession before main argument","Granted, there are limitations."]]},"examples":[{"type":"pos","eng":"Much as the committee appreciated the gesture, it could not be accepted.","note":"Much as - genuine acknowledgement before refusal."},{"type":"pos","eng":"For all its apparent simplicity, the problem resists easy solution.","note":"For all its + noun - despite the quality."},{"type":"pos","eng":"Whatever the personal cost, she refused to compromise her principles.","note":"Whatever + noun phrase - universal concession."},{"type":"pos","eng":"However compelling the evidence may appear, it must be independently verified.","note":"However + adjective - regardless of the degree."}],"errors":[{"bad":"Much as I admire her, but I cannot agree.","good":"Much as I admire her, I cannot agree.","reason":"Much as already expresses contrast - don't add but as well."},{"bad":"For all that his talent, he has failed to deliver.","good":"For all his talent, he has failed to deliver.","reason":"For all + noun phrase - not for all that + possessive + noun."},{"bad":"However the argument is convincing, the data is clear.","good":"However convincing the argument, the data is clear.","reason":"However + adjective/adverb + (subject) - the adjective comes directly after however."}],"realUse":[],"exercises":[{"type":"gap","title":"Concession structures","sub":"Fill each gap with the correct concession form.","items":[{"answer":"Much as","before":"","after":" I appreciate your concern, the decision stands."},{"answer":"For all his","before":"","after":" experience, he struggled with the technical aspects."},{"answer":"Whatever","before":"","after":" the difficulties involved, this must be addressed."},{"answer":"However convincing","before":"","after":" the case, I remain unconvinced."},{"answer":"Be that as it may","before":"","after":", the organisation must move forward."},{"answer":"Granted","before":"","after":", the evidence is not conclusive. Nevertheless, it points in one direction."},{"answer":"For all that","before":"","after":", the fundamental problem has not been resolved."},{"answer":"However","before":"","after":" significant the short-term costs, the long-term benefits justify them."}]},{"type":"mc","title":"Which concession structure?","sub":"Choose the most appropriate option.","items":[{"q":"_____ her considerable experience, she struggled to manage the team.","opts":["Much as","For all","Whatever","Although"],"answer":"For all","explanation":"For all + her considerable experience = despite all of it - slightly dismissive of the quality."},{"q":"_____ I respect his opinion, I cannot support this proposal.","opts":["For all","Whatever","Much as","However"],"answer":"Much as","explanation":"Much as + clause = genuinely conceding admiration while disagreeing."},{"q":"_____ the outcome, the process must be transparent.","opts":["Much as","For all","Whatever","However"],"answer":"Whatever","explanation":"Whatever + noun = regardless of what the outcome turns out to be."},{"q":"_____ persuasive the argument may be, it is not supported by evidence.","opts":["Whatever","However","For all","Much as"],"answer":"However","explanation":"However + adjective/adverb = regardless of the degree (however persuasive = no matter how persuasive)."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using the keyword.","items":[{"original":"Although I admire her work greatly, I cannot endorse this decision.","keyword":"Much as","answer":"Much as I admire her work, I cannot endorse this decision."},{"original":"Despite all his talent, he has never achieved his potential.","keyword":"For all","answer":"For all his talent, he has never achieved his potential."},{"original":"No matter what the cost, this must be done.","keyword":"Whatever","answer":"Whatever the cost, this must be done."},{"original":"Despite how convincing the evidence appears, it must be verified.","keyword":"However","answer":"However convincing the evidence appears, it must be verified."},{"original":"I acknowledge the point you have made, but the decision stands.","keyword":"Be that as it may","answer":"Be that as it may, the decision stands."}]}]},{"id":"reportedadv","title":"Reported structures: advanced","subtitle":"is alleged to have, be reported to be, was said to have been","intro":"The passive reporting structures that fill formal, journalistic and academic English.","desc":"At B2 you learnt active reporting verbs and basic backshift. At C1 the focus is the passive impersonal reporting structure - used to distance the speaker from a claim, attribute information without committing to it, and signal that something is widely believed or alleged. This is the grammar of journalism, law, and academic writing.","tip":"The two parallel patterns - <em>It is said that...<\/em> and <em>He is said to...<\/em> - look like twins but behave differently. The first takes a full that-clause; the second takes an infinitive, and the tense of that infinitive tells your reader whether the event is simultaneous (<em>to be<\/em>) or earlier (<em>to have been<\/em>). Getting that right is a genuine C1 marker.","explanation":"<p>Passive impersonal reporting structures attribute claims without committing to their truth. Two parallel forms exist for each reporting verb.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>It + passive reporting verb + that-clause<\/strong> - impersonal, fronted with it.<br>\n<em>\"It is believed that the suspect fled the country.\"<\/em><br>\n<em>\"It has been reported that the company faces insolvency.\"<\/em><br>\n<em>\"It was alleged that funds had been misappropriated.\"<\/em><br>\nCommon verbs: <em>believe, say, think, report, claim, allege, expect, understand, know, assume.<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Subject + passive reporting verb + infinitive<\/strong> - subject is focused, infinitive follows.<br>\nPresent infinitive (= happening now/generally): <em>\"The suspect is believed to be in hiding.\"<\/em><br>\nPerfect infinitive (= happened before the reporting): <em>\"The suspect is believed to have fled the country.\"<\/em><br>\nPerfect passive infinitive: <em>\"The funds are alleged to have been misappropriated.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Tense of the infinitive - the key distinction:<\/strong><br>\n<em>to be<\/em> / <em>to have<\/em> - present situation: <em>\"She is thought to be in Madrid.\"<\/em><br>\n<em>to have + pp<\/em> - past action (before the reporting): <em>\"She is thought to have left last week.\"<\/em><br>\n<em>to have been + pp<\/em> - passive past: <em>\"He is alleged to have been involved in the fraud.\"<\/em><br>\n<em>to be + -ing<\/em> - ongoing action at time of reporting: <em>\"They are believed to be negotiating a settlement.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Passive reporting in academic and formal writing<\/strong> - used to attribute without endorsing.<br>\n<em>\"It has been argued that...\"<\/em> / <em>\"It is widely held that...\"<\/em> / <em>\"It has been suggested that...\"<\/em><br>\n<em>\"The data are considered to support...\"<\/em> / <em>\"The theory is generally accepted to be...\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Choosing between the two structures:<\/strong><br>\nBoth are correct - the choice is about focus and rhythm.<br>\n<em>It is believed that the company is struggling.<\/em> - neutral, impersonal.<br>\n<em>The company is believed to be struggling.<\/em> - subject (the company) is foregrounded.<br>\nUse the subject-focused form when the subject is the topic of the discourse.<br>\n<strong>Register:<\/strong> Both structures are formal. The <em>it<\/em>-structure is slightly more common in speech; the subject structure is more common in written reportage.<\/div>","table":{"headers":["Structure","Tense signal","Example"],"rows":[["It + passive + that-clause","Tense in that-clause","It is reported that talks have stalled."],["Subject + passive + to be","Present/ongoing","He is said to be in good health."],["Subject + passive + to have + pp","Past action (before reporting)","She is alleged to have taken the money."],["Subject + passive + to have been + pp","Passive past action","The data are thought to have been manipulated."],["Subject + passive + to be + -ing","Ongoing at time of report","They are believed to be in negotiations."],["Academic: It has been argued/suggested","Attribution in writing","It has been argued that the approach is flawed."]]},"examples":[{"type":"pos","eng":"It is widely believed that the decision was politically motivated.","note":"It + passive + that - neutral, impersonal attribution."},{"type":"pos","eng":"The prime minister is understood to be considering her resignation.","note":"Subject + passive + to be + -ing - ongoing at time of reporting."},{"type":"pos","eng":"Three officials are alleged to have accepted bribes.","note":"Subject + passive + to have + pp - past action prior to reporting."},{"type":"pos","eng":"It has been argued that the current model is no longer sustainable.","note":"Academic attribution - distancing the claim from the writer."}],"errors":[{"bad":"It is believed that the suspect flees the country.","good":"It is believed that the suspect has fled the country.","reason":"The fleeing happened before the reporting - backshift: present perfect or past in that-clause."},{"bad":"She is said living in Paris.","good":"She is said to live in Paris.","reason":"Subject + passive reporting + to + base form - not -ing directly."},{"bad":"It is alleged him to have taken the money.","good":"He is alleged to have taken the money.","reason":"Subject form: subject + is alleged + to + perfect infinitive."}],"realUse":[],"exercises":[{"type":"gap","title":"Passive reporting structures","sub":"Rewrite each sentence using the
