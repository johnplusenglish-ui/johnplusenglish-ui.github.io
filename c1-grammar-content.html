 structure indicated.","items":[{"answer":"It is believed that the company is in financial difficulty.","before":"People believe the company is in financial difficulty. → ","after":"(It + passive + that)"},{"answer":"The company is believed to be in financial difficulty.","before":"People believe the company is in financial difficulty. → ","after":"(Subject + passive + to be)"},{"answer":"He is alleged to have committed fraud.","before":"Police allege he committed fraud. → ","after":"(Subject + passive + to have + pp)"},{"answer":"It has been reported that talks have broken down.","before":"Reports say talks have broken down. → ","after":"(It + passive + that)"},{"answer":"The suspects are understood to be in custody.","before":"Authorities understand the suspects are in custody. → ","after":"(Subject + passive + to be)"},{"answer":"The funds are believed to have been transferred abroad.","before":"Investigators believe the funds were transferred abroad. → ","after":"(Subject + passive + to have been + pp)"}]},{"type":"mc","title":"Which infinitive form?","sub":"Choose the correct passive reporting structure.","items":[{"q":"She _____ to _____ the country last Tuesday. (fled - past action)","opts":["is believed / flee","is believed / have fled","was believed / fleeing","is believed / be fleeing"],"answer":"is believed / have fled","explanation":"Past action prior to reporting → to have + past participle: is believed to have fled."},{"q":"The two sides _____ to _____ a deal. (currently negotiating)","opts":["are said / negotiate","are said / have negotiated","are said / be negotiating","were said / negotiate"],"answer":"are said / be negotiating","explanation":"Ongoing action → to be + -ing: are said to be negotiating."},{"q":"The data _____ to _____ been altered before publication.","opts":["is thought / be","is thought / have","is thought / have been","was thought / being"],"answer":"is thought / have been","explanation":"Passive past action → to have been + past participle: is thought to have been altered."},{"q":"It _____ that the policy has had little effect.","opts":["is suggested","suggests","is suggesting","has suggested"],"answer":"is suggested","explanation":"It + passive reporting verb + that-clause: it is suggested that."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using the keyword.","items":[{"original":"People say he is hiding in the mountains.","keyword":"is said","answer":"He is said to be hiding in the mountains."},{"original":"Journalists report that three ministers resigned.","keyword":"It is reported","answer":"It is reported that three ministers resigned."},{"original":"Investigators believe the money was laundered.","keyword":"is believed","answer":"The money is believed to have been laundered."},{"original":"Experts consider the approach to be outdated.","keyword":"is considered","answer":"The approach is considered to be outdated."},{"original":"It is alleged that the official accepted payments.","keyword":"alleged to","answer":"The official is alleged to have accepted payments."}]}]},{"id":"extraposition","title":"It-extraposition & appositives","subtitle":"It is worth noting that... / the possibility that...","intro":"Two backbone structures of formal prose - extraposition, and the abstract noun + that-clause.","desc":"These two structures are the scaffolding of formal written English. It-extraposition makes heavy subjects manageable. Abstract noun + appositive that-clause allows dense, precise expression of complex ideas. Both appear constantly in academic writing, journalism, and formal correspondence - and both require exact grammatical control.","tip":"The error I catch most with both is a doubled subject. In <em>\"The fact that he lied, it surprised everyone\"<\/em> the <em>it<\/em> is wrong, because <em>the fact that he lied<\/em> is already the subject. And watch the subjunctive too: after <em>it is important that<\/em>, you need <em>be<\/em> - <em>\"It is important that she be present.\"<\/em>","explanation":"<p>Two complementary structures that give formal English its precision and weight.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>It-extraposition<\/strong> - moving a heavy subject clause to the end of the sentence and replacing it with <em>it<\/em> at the front. More natural than a fronted subject clause in most contexts.<br>\n<em>\"It is widely accepted that early intervention produces better outcomes.\"<\/em><br>\n<em>\"It remains to be seen whether the approach will work.\"<\/em><br>\n<em>\"It is not entirely clear what caused the failure.\"<\/em><br>\n<em>\"It goes without saying that transparency is essential.\"<\/em> (fixed)<br>\n<em>\"It is worth noting that the data predates the reform.\"<\/em> (fixed)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Extraposition with adjective + infinitive<\/strong> - the extraposed clause is a to-infinitive.<br>\n<em>\"It is difficult to overstate the significance of this finding.\"<\/em><br>\n<em>\"It proved impossible to reach a consensus.\"<\/em><br>\n<em>\"It would be premature to draw firm conclusions.\"<\/em><br>\nCompare: <em>\"To overstate the significance is difficult.\"<\/em> - grammatically correct but much less natural.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Abstract noun + appositive that-clause<\/strong> - a noun followed by a that-clause that restates its content.<br>\n<em>\"The possibility that the data was compromised has not been ruled out.\"<\/em><br>\n<em>\"There is growing evidence that the approach is counterproductive.\"<\/em><br>\n<em>\"His insistence that the findings be verified delayed the publication.\"<\/em><br>\nCommon nouns: <em>fact, possibility, evidence, claim, assumption, suggestion, belief, hope, fear, risk, chance, likelihood, prospect, news, realisation, conclusion, view.<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Fixed formal expressions with it-extraposition<\/strong> - useful chunks for academic and formal writing.<br>\n<em>It is worth noting that... / It is important to bear in mind that... / It goes without saying that... / It remains to be seen whether... / It stands to reason that... / It is no coincidence that... / It is not uncommon for + noun + to...<\/em><\/div><\/div>\n<div class=\"note\"><strong>Double subject error - the most common mistake:<\/strong><br>\n<em>\"The fact that he resigned, it shocked everyone.\"<\/em> ✗ - don't add <em>it<\/em> after the subject clause.<br>\n<em>\"The fact that he resigned shocked everyone.\"<\/em> ✓<br>\n<strong>After it is + adjective + that<\/strong> - mandative subjunctive may apply:<br>\n<em>\"It is essential that all data be verified.\"<\/em> - essential/vital/important/necessary + that → subjunctive.<br>\n<em>\"It is interesting that she chose this approach.\"<\/em> - interesting/clear/obvious/surprising → indicative.<\/div>","table":{"headers":["Pattern","Example","Notes"],"rows":[["It + be + adj + that-clause","It is clear that the situation has worsened.","Most common extraposition"],["It + be + adj + to-infinitive","It is difficult to assess the full impact.","Heavy infinitive subject extraposed"],["It + verb + that-clause","It appears that a deal has been reached.","Verb can be appear/seem/follow/transpire"],["It + remains/remains to be seen","It remains to be seen whether it works.","Fixed formal expression"],["Abstract noun + that (appositive)","The risk that costs will rise is real.","Dense noun phrase for formal writing"],["Fixed expressions","It goes without saying that... / It is worth noting that...","High-frequency formal chunks"]]},"examples":[{"type":"pos","eng":"It is widely acknowledged that the current system is no longer fit for purpose.","note":"It + passive adjective + that-clause - impersonal formal claim."},{"type":"pos","eng":"It would be premature to reach any conclusions at this stage.","note":"It + adj + to-infinitive - extraposed heavy infinitive subject."},{"type":"pos","eng":"The likelihood that the two sides will reach an agreement appears remote.","note":"Abstract noun + appositive that-clause as subject."},{"type":"pos","eng":"It goes without saying that all information must be treated as confidential.","note":"Fixed expression - extremely common in formal correspondence."}],"errors":[{"bad":"The fact that she refused, it was surprising.","good":"The fact that she refused was surprising.","reason":"Don't add it after the noun clause subject - it is already the subject."},{"bad":"It is important that all candidates are informed promptly.","good":"It is important that all candidates be informed promptly.","reason":"It is important that + mandative subjunctive - be, not are."},{"bad":"It is clear what should we do next.","good":"It is clear what we should do next.","reason":"Extraposed noun clause - statement word order, no inversion after the wh-word."}],"realUse":[],"exercises":[{"type":"gap","title":"It-extraposition & appositives","sub":"Fill each gap to complete the formal structure.","items":[{"answer":"It is widely accepted","before":"","after":" that early childhood education has a lasting impact."},{"answer":"It would be premature","before":"","after":" to draw any firm conclusions from the initial data."},{"answer":"The possibility that","before":"","after":" the contract was awarded unfairly is being investigated."},{"answer":"It goes without saying","before":"","after":" that patient confidentiality must be maintained at all times."},{"answer":"It remains to be seen","before":"","after":" whether the new policy will achieve its stated aims."},{"answer":"There is growing evidence","before":"","after":" that the intervention has had a positive effect."},{"answer":"The assumption that","before":"","after":" growth would continue indefinitely proved unfounded."},{"answer":"It is not uncommon for","before":"","after":" students to struggle with this distinction."}]},{"type":"mc","title":"Correct structure?","sub":"Choose the grammatically correct sentence.","items":[{"q":"Which is correct?","opts":["The fact that he lied, it shocked everyone.","The fact that he lied shocked everyone.","It shocked everyone the fact that he lied.","The fact of him lying it shocked everyone."],"answer":"The fact that he lied shocked everyone.","explanation":"Abstract noun + that-clause as subject - no pronoun repetition."},{"q":"After 'it is essential that' - which form?","opts":["It is essential that she attends.","It is essential that she attend.","It is essential for her to attend.","It is essential that she should attend."],"answer":"It is essential that she attend.","explanation":"Mandative: it is essential that + subjunctive (base form). She attend, not attends. (She should attend also acceptable in British English.)"},{"q":"Which uses extraposition correctly?","opts":["It is difficult to overstate this.","It is difficult overstate this.","To overstate this it is difficult.","This is difficult it to overstate."],"answer":"It is difficult to overstate this.","explanation":"It + be + adjective + to-infinitive - standard extraposition of heavy subject."},{"q":"Which appositive is correct?","opts":["The risk of that costs will rise is real.","The risk that costs will rise is real.","The risk of costs rising it is real.","The risk if costs rise is real."],"answer":"The risk that costs will rise is real.","explanation":"Abstract noun + that (no preposition before the appositive that-clause)."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using it-extraposition or appositive structure.","items":[{"original":"That the policy has failed is now undeniable.","keyword":"It is","answer":"It is now undeniable that the policy has failed."},{"original":"To reach a consensus at this stage would be premature.","keyword":"It would","answer":"It would be premature to reach a consensus at this stage."},{"original":"Nobody knows whether the plan will work.","keyword":"It remains","answer":"It remains to be seen whether the plan will work."},{"original":"He claimed that he had not been informed. This claim proved false.","keyword":"His claim that","answer":"His claim that he had not been informed proved false."},{"original":"Confidentiality must be maintained. This goes without saying.","keyword":"It goes","answer":"It goes without saying that confidentiality must be maintained."}]}]},{"id":"prepcomplements","title":"Preposition + gerund / noun clause complements","subtitle":"on condition that, by virtue of, in the event of","intro":"The fixed prepositional structures that set up complex conditions, reasons and qualifications.","desc":"Prepositions and prepositional phrases introduce subordinate ideas in formal English. At C1 the challenge is the range of complex prepositional phrases - many semi-fixed in form - that take gerund or clause complements. These are the connectors of formal legal, business, and academic discourse.","tip":"The distinction to master: after a preposition you need a gerund, not an infinitive or a that-clause. <em>\"In spite of to fail\"<\/em> is wrong; <em>\"In spite of failing\"<\/em> is right. But a handful of complex prepositional phrases take a that-clause directly - <em>on condition that<\/em>, <em>in the event that<\/em>, <em>given that<\/em>. Knowing which takes which is exactly the C1 target.","explanation":"<p>Complex prepositional phrases introduce formal conditions, concessions, causes, and qualifications. Each takes either a gerund or a that-clause complement.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Preposition/prep phrase + gerund<\/strong> - after a simple preposition, always gerund.<br>\n<em>in spite of / despite + gerund:<\/em> <em>\"In spite of having no experience, she excelled.\"<\/em><br>\n<em>by virtue of + gerund/noun:<\/em> <em>\"By virtue of being the oldest, she assumed responsibility.\"<\/em><br>\n<em>with a view to + gerund:<\/em> <em>\"He contacted us with a view to establishing a partnership.\"<\/em><br>\n<em>for the purpose of + gerund:<\/em> <em>\"The data was collected for the purpose of analysing trends.\"<\/em><br>\n<em>on the grounds of + gerund/noun:<\/em> <em>\"She appealed on the grounds of insufficient evidence.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Complex prepositional phrase + that-clause<\/strong> - certain compound prepositions take that-clauses directly.<br>\n<em>on condition that:<\/em> <em>\"I'll agree on condition that the terms are revised.\"<\/em><br>\n<em>in the event that/of:<\/em> <em>\"In the event that the proposal is rejected, we will appeal.\"<\/em><br>\n<em>given that:<\/em> <em>\"Given that resources are limited, priorities must be set.\"<\/em><br>\n<em>provided/providing that:<\/em> <em>\"I'll support the plan provided that the budget is approved.\"<\/em><br>\n<em>on the understanding that:<\/em> <em>\"She accepted the role on the understanding that she would have full autonomy.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>With a view to / with the aim of / for fear of<\/strong> - purpose and caution structures.<br>\n<em>\"They restructured with a view to reducing costs.\"<\/em> (purpose - gerund)<br>\n<em>\"He said nothing for fear of causing offence.\"<\/em> (caution - gerund)<br>\n<em>\"She applied with the aim of securing a promotion.\"<\/em> (purpose - gerund)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>In terms of / with regard to / as regards / in light of<\/strong> - focus and reference structures.<br>\n<em>\"In terms of methodology, the study is exemplary.\"<\/em><br>\n<em>\"With regard to your enquiry, please find the relevant details below.\"<\/em><br>\n<em>\"In light of recent developments, the decision must be revisited.\"<\/em><br>\n<em>\"As regards the second point, I would refer you to clause 4.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>With a view to - common error:<\/strong><br>\n<em>\"With a view to improve productivity.\"<\/em> ✗ - to here is a preposition, not part of an infinitive.<br>\n<em>\"With a view to improving productivity.\"<\/em> ✓ - gerund after the preposition to.<br>\nThis also applies to: <em>look forward to, be committed to, be accustomed to, object to, resort to, be used to, in addition to.<\/em><br>\n<strong>Provided / providing / as long as / on condition that<\/strong> are all interchangeable in meaning (conditional), but differ in formality - <em>on condition that<\/em> is most formal, <em>as long as<\/em> most informal.<\/div>","table":{"headers":["Structure","Takes","Example"],"rows":[["In spite of / despite","gerund or noun","In spite of failing twice, she persisted."],["By virtue of","gerund or noun","By virtue of her position, she had access."],["With a view to","gerund (to = preposition)","With a view to expanding operations."],["For fear of","gerund","He said nothing for fear of offending."],["On condition that","that-clause","I'll help on condition that you reciprocate."],["In the event that/of","that-clause / noun","In the event of a dispute, refer to clause 5."],["Given that","that-clause","Given that funds are limited, we must prioritise."],["Provided/providing that","that-clause","I'll agree, provided that changes are made."],["In terms of / with regard to","noun phrase","In terms of quality, it is exceptional."],["In light of","noun phrase","In light of the evidence, action is needed."]]},"examples":[{"type":"pos","eng":"She agreed to the arrangement on condition that her travel expenses would be reimbursed.","note":"On condition that + that-clause - formal conditional agreement."},{"type":"pos","eng":"The data was archived with a view to facilitating future research.","note":"With a view to + gerund - to is a preposition here."},{"type":"pos","eng":"In the event that the primary contractor fails to deliver, a penalty clause will apply.","note":"In the event that + clause - formal contractual language."},{"type":"pos","eng":"By virtue of her extensive experience, she was considered the natural choice.","note":"By virtue of + noun/gerund - by reason of."}],"errors":[{"bad":"She applied with a view to get a promotion.","good":"She applied with a view to getting a promotion.","reason":"With a view to - to is a preposition here, requiring a gerund, not an infinitive."},{"bad":"On condition of the terms are revised, I will agree.","good":"On condition that the terms are revised, I will agree.","reason":"On condition that + that-clause - not on condition of + clause."},{"bad":"In light of the new evidence, the verdict it must be reviewed.","good":"In light of the new evidence, the verdict must be reviewed.","reason":"Don't add a subject pronoun (it) after the noun phrase subject."}],"realUse":[],"richLabel":"Prepositional reference","richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Preposition/phrase + gerund<\/div>\n<table class=\"rich-table\"><thead><tr><th>Structure<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>in spite of / despite<\/td><td><em>In spite of having no experience, she excelled.<\/em><\/td><\/tr>\n<tr><td>by virtue of<\/td><td><em>By virtue of her position, she had access.<\/em><\/td><\/tr>\n<tr><td>with a view to<\/td><td><em>With a view to expanding the business.<\/em> (to = preposition)<\/td><\/tr>\n<tr><td>for the purpose of<\/td><td><em>For the purpose of analysing the data.<\/em><\/td><\/tr>\n<tr><td>for fear of<\/td><td><em>He said nothing for fear of causing offence.<\/em><\/td><\/tr>\n<tr><td>with the aim of<\/td><td><em>She applied with the aim of securing a promotion.<\/em><\/td><\/tr>\n<tr><td>on the grounds of<\/td><td><em>She appealed on the grounds of insufficient evidence.<\/em><\/td><\/tr>\n<tr><td>in addition to<\/td><td><em>In addition to managing the team, she handles accounts.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Complex phrase + that-clause<\/div>\n<table class=\"rich-table\"><thead><tr><th>Structure<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>on condition that<\/td><td><em>I'll agree on condition that the terms are revised.<\/em><\/td><\/tr>\n<tr><td>in the event that<\/td><td><em>In the event that the plan fails, we will appeal.<\/em><\/td><\/tr>\n<tr><td>given that<\/td><td><em>Given that resources are limited, priorities must be set.<\/em><\/td><\/tr>\n<tr><td>provided / providing that<\/td><td><em>I'll support it provided that the budget is approved.<\/em><\/td><\/tr>\n<tr><td>on the understanding that<\/td><td><em>She accepted on the understanding that she had full autonomy.<\/em><\/td><\/tr>\n<tr><td>assuming that<\/td><td><em>Assuming that the vote passes, work begins Monday.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Reference / focus structures + noun phrase<\/div>\n<table class=\"rich-table\"><thead><tr><th>Structure<\/th><th>Use<\/th><\/tr><\/thead><tbody>\n<tr><td>in terms of<\/td><td><em>In terms of quality, the work is exemplary.<\/em><\/td><\/tr>\n<tr><td>with regard to / as regards<\/td><td><em>With regard to your enquiry, please see below.<\/em><\/td><\/tr>\n<tr><td>in light of<\/td><td><em>In light of recent events, a review is necessary.<\/em><\/td><\/tr>\n<tr><td>in view of<\/td><td><em>In view of the difficulties, more time was granted.<\/em><\/td><\/tr>\n<tr><td>by means of<\/td><td><em>The data was collected by means of a survey.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">⚠ to as preposition - always gerund after these<\/div>\n<table class=\"rich-table\"><tbody>\n<tr><td>with a view <strong>to<\/strong><\/td><td>...to <strong>improving<\/strong> ✓ &nbsp; ...to improve ✗<\/td><\/tr>\n<tr><td>look forward <strong>to<\/strong><\/td><td>...to <strong>hearing<\/strong> ✓ &nbsp; ...to hear ✗<\/td><\/tr>\n<tr><td>be committed <strong>to<\/strong><\/td><td>...to <strong>resolving<\/strong> ✓ &nbsp; ...to resolve ✗<\/td><\/tr>\n<tr><td>object <strong>to<\/strong><\/td><td>...to <strong>being<\/strong> treated ✓ &nbsp; ...to be treated ✗<\/td><\/tr>\n<tr><td>in addition <strong>to<\/strong><\/td><td>...to <strong>managing<\/strong> ✓ &nbsp; ...to manage ✗<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","exercises":[{"type":"gap","title":"Prepositional complements","sub":"Fill each gap with the correct preposition structure and form.","items":[{"answer":"with a view to expanding","before":"The company restructured ","after":" its operations into new markets."},{"answer":"on condition that","before":"She agreed to cooperate ","after":" her identity would be protected."},{"answer":"In the event of","before":"","after":" a dispute, the matter shall be referred to arbitration."},{"answer":"for fear of","before":"He refused to comment ","after":" prejudicing the ongoing investigation."},{"answer":"By virtue of","before":"","after":" his seniority, he was granted additional privileges."},{"answer":"Given that","before":"","after":" the evidence is inconclusive, no decision can be made at this stage."},{"answer":"in terms of","before":"The project was a success ","after":" both quality and cost-effectiveness."},{"answer":"on the understanding that","before":"She accepted the role ","after":" she would have full editorial control."}]},{"type":"mc","title":"Gerund or that-clause?","sub":"Choose the correct completion.","items":[{"q":"She left early for fear of _____.","opts":["that she missed the train","missing the train","to miss the train","she would miss the train"],"answer":"missing the train","explanation":"For fear of + preposition → gerund."},{"q":"I'll agree _____ the price is reduced.","opts":["on condition of","on condition that","with a view to","by virtue of that"],"answer":"on condition that","explanation":"On condition that + that-clause - the clause specifies the condition."},{"q":"The report was written with a view to _____ the situation.","opts":["clarify","to clarify","clarifying","be clarified"],"answer":"clarifying","explanation":"With a view to + gerund - to is a preposition here, not part of an infinitive."},{"q":"_____ the new legislation, all contracts must be reviewed.","opts":["Given that","In light of","With a view to","For the purpose to"],"answer":"In light of","explanation":"In light of + noun phrase - refers to a concrete recent development as reason for action."}]},{"type":"categorise","title":"Gerund or that-clause?","sub":"Click each phrase, then click the correct column.","categories":[{"name":"+ gerund","items":["with a view to","in spite of","by virtue of","for the purpose of","for fear of","with the aim of"]},{"name":"+ that-clause","items":["on condition that","given that","provided that","in the event that","on the understanding that"]},{"name":"+ noun phrase","items":["in light of","in terms of","with regard to","as regards","in view of"]}]}]}];</script>
<script>
(function(){
  var KEY='jpe_c1grammar_progress_v1';
  var done={}, current=0;
  try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); done=o.done||{}; current=o.current||0;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({done:done,current:current}));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function norm(s){return String(s).toLowerCase().replace(/\s+/g,' ').replace(/[.,!?;:"']/g,'').trim();}
  function accepts(val,answer){ // answer may hold "/" alternatives
    var v=norm(val); return String(answer).split('/').map(norm).some(function(a){return a===v;});
  }
  var CHECK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  var ARROW='<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  var roadEl=document.getElementById('road'), lessonEl=document.getElementById('lesson');
  document.getElementById('pTotal').textContent=LESSONS.length;

  function updateProgress(){
    var n=Object.keys(done).filter(function(k){return done[k];}).length;
    document.getElementById('pDone').textContent=n;
    document.getElementById('pFill').style.width=(n/LESSONS.length*100)+'%';
  }
  function renderRoad(){
    roadEl.innerHTML=LESSONS.map(function(l,i){
      var cls='g-step'+(i===current?' active':'')+(done[l.id]?' done':'');
      var num=done[l.id]?CHECK:(i+1);
      return '<button class="'+cls+'" data-i="'+i+'"><span class="g-step-n">'+num+'</span><span class="g-step-t">'+esc(l.title)+'</span></button>';
    }).join('');
  }

  // ---------- exercise renderers ----------
  var exSeq=0;
  function fb(id){return '<div class="q-fb" id="'+id+'"></div>';}
  function showFb(id,cls,txt){var e=document.getElementById(id);if(!e)return;e.className='q-fb show '+cls;e.innerHTML=txt;}

  function renderExercise(ex, exNum){
    exSeq++; var eid='ex'+exSeq;
    function qn(j){return '<span class="q-num">'+(j+1)+'</span>';}
    var h='<div class="g-exercise"><div class="g-ex-title"><span class="g-ex-num">'+exNum+'</span>'+esc(ex.title)+'</div>'+(ex.sub?'<div class="g-ex-sub">'+esc(ex.sub)+'</div>':'')+'<div id="'+eid+'-body">';
    var items=ex.items||ex.lines||[];
    if(ex.type==='gap'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.before)+'<input class="gap-inp" data-a="'+esc(it.answer)+'" id="'+eid+'_'+j+'">'+esc(it.after)+'</div></div>';
      });
    } else if(ex.type==='mc'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.q)+'</div><div class="opts" data-ans="'+esc(it.answer)+'" data-exp="'+esc(it.explanation||'')+'">'+
           it.opts.map(function(o){return '<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='transform'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.original)+'<br><span style="font-size:.85rem;color:var(--muted)">Use: <strong>'+esc(it.keyword)+'</strong></span></div><input class="txt-inp" data-a="'+esc(it.answer)+'" id="'+eid+'_'+j+'">'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='ec'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.wrong)+'</div><input class="txt-inp" data-a="'+esc(it.correct)+'" placeholder="Write the correct sentence" id="'+eid+'_'+j+'">'+fb(eid+'_f'+j)+(it.hint?'<div class="q-fb hint show" style="margin-top:6px">Hint: '+esc(it.hint)+'</div>':'')+'</div>';
      });
    } else if(ex.type==='tf'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+'<em>'+esc(it.context)+'</em><br>'+esc(it.statement)+'</div><div class="opts" data-ans="'+esc(it.answer)+'" data-exp="'+esc(it.explanation||'')+'">'+
           ['True','False','Not given'].map(function(o){return '<button class="opt" data-o="'+o+'">'+o+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='convo'){
      items.forEach(function(ln){
        var idx=0;
        var text=String(ln.text).replace(/\[([^\]]+)\]/g,function(m,ans){idx++;return '<input class="gap-inp" data-a="'+esc(ans)+'">';});
        h+='<div class="convo-line"><span class="convo-sp">'+esc(ln.speaker)+'</span><span>'+text+'</span></div>';
      });
    } else if(ex.type==='builder'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text"><span class="q-num">'+(j+1)+'</span><span style="font-size:.85rem;color:var(--muted)">'+esc(it.context||'')+'</span></div><div class="build-target" id="'+eid+'_t'+j+'" data-a="'+esc(it.answer)+'"></div><div class="build-bank" id="'+eid+'_b'+j+'">'+
           shuffle(it.words.slice()).map(function(w,k){return '<button class="word-chip" data-w="'+esc(w)+'">'+esc(w)+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='categorise'){
      var bank=[]; ex.categories.forEach(function(c){c.items.forEach(function(it){bank.push({w:it,cat:c.name});});});
      h+='<div class="cat-bank" id="'+eid+'-bank">'+shuffle(bank.slice()).map(function(b){return '<button class="cat-item" data-w="'+esc(b.w)+'" data-cat="'+esc(b.cat)+'">'+esc(b.w)+'</button>';}).join('')+'</div><div class="cat-cols" style="grid-template-columns:repeat('+Math.min(ex.categories.length,3)+',1fr)">'+
         ex.categories.map(function(c){return '<div class="cat-col"><div class="cat-col-h">'+esc(c.name)+'</div><div class="cat-drop" data-cat="'+esc(c.name)+'"></div></div>';}).join('')+'</div>';
    }
    h+='</div><button class="chk-btn" data-check="'+eid+'" data-type="'+ex.type+'">Check answers</button><button class="chk-link" data-show="'+eid+'">Show answers</button><span class="ex-score" id="'+eid+'-score"></span></div>';
    return {html:h, eid:eid, ex:ex};
  }
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

  // ---------- lesson rendering ----------
  var exReg={};
  function renderLesson(i){
    current=i; save(); exSeq=0; exReg={};
    var l=LESSONS[i];
    var nEx=(l.exercises||[]).length;
    var h='<div class="g-card" style="padding-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div class="g-eyebrow" style="margin-bottom:0">Lesson '+(i+1)+' of '+LESSONS.length+'</div><button class="g-export-btn" title="Save this lesson as a PNG image" aria-label="Save lesson as PNG image" onclick="exportLessonPNG('+i+',this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button></div>'+
      '<h2 class="g-lesson-title">'+esc(l.title)+'</h2>'+
      (l.subtitle?'<div class="g-lesson-sub">'+esc(l.subtitle)+'</div>':'')+
      (l.intro?'<div class="g-intro" style="margin-bottom:2px">'+l.intro+'</div>':'')+'</div>';
    h+='<div class="l-tabs"><button class="l-tab active" data-pane="learn">Learn</button><button class="l-tab" data-pane="practice">Practice'+(nEx?'<span class="l-tab-c">'+nEx+'</span>':'')+'</button></div>';
    var learn='<div class="g-card"><div class="g-body">'+(l.explanation||('<p>'+esc(l.desc||'')+'</p>'))+'</div>';
    if(l.table&&l.table.rows){learn+='<div class="g-sec-label">The forms</div><table class="g-table"><thead><tr>'+l.table.headers.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>'+l.table.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';}
    if(l.examples&&l.examples.length){learn+='<div class="g-sec-label">In action</div><div class="g-examples">'+l.examples.map(function(e){var t=e.type||'pos';var m=t==='neg'?'-':(t==='q'?'?':'+');return '<div class="g-ex '+t+'"><span class="g-ex-t">'+m+'</span><span class="g-ex-eng">'+esc(e.eng)+'</span>'+(e.note?'<div class="g-ex-note">'+esc(e.note)+'</div>':'')+'</div>';}).join('')+'</div>';}
    if(l.errors&&l.errors.length){learn+='<div class="g-sec-label">Watch out for</div><div class="g-errors">'+l.errors.map(function(e){return '<div class="g-err"><div class="g-err-line g-err-bad"><span class="mk">✗</span><span>'+esc(e.bad)+'</span></div><div class="g-err-line g-err-good"><span class="mk">✓</span><span>'+esc(e.good)+'</span></div><div class="g-err-reason">'+esc(e.reason)+'</div></div>';}).join('')+'</div>';}
    if(l.realUse&&l.realUse.length){learn+='<div class="g-sec-label">Real use</div><ul class="g-real">'+l.realUse.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul>';}
    if(l.tip){learn+='<div class="g-tip"><div><div class="g-tip-label">From John</div><p>'+l.tip+'</p></div></div>';}
    learn+='</div>';
    h+='<div class="l-pane show" id="pane-learn">'+learn+'</div>';
    var prac;
    if(nEx){
      prac='<div class="g-card"><div class="g-eyebrow">Practice</div><h3 class="g-lesson-title" style="font-size:1.25rem;margin:0 0 4px">Try it yourself</h3><p style="color:var(--muted);margin:0 0 20px;font-size:.92rem">'+nEx+' exercise'+(nEx>1?'s':'')+'. Type or click your answers, then check them.</p>';
      l.exercises.forEach(function(ex,xi){var r=renderExercise(ex,xi+1);exReg[r.eid]=r;prac+=r.html;});
      prac+='</div>';
    } else {
      prac='<div class="g-card"><p style="color:var(--muted);margin:0">Practice for this lesson is coming soon.</p></div>';
    }
    h+='<div class="l-pane" id="pane-practice">'+prac+'</div>';
    var isDone=!!done[l.id];
    h+='<div class="g-foot"><button class="g-complete'+(isDone?' done':'')+'" id="markBtn">'+(isDone?CHECK+' Completed':'Mark lesson complete')+'</button>'+
       '<button class="g-next" id="nextBtn"'+(i>=LESSONS.length-1?' disabled':'')+'>Next lesson '+ARROW+'</button></div>';
    lessonEl.innerHTML=h;
    renderRoad(); updateProgress();
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ---------- interactions ----------
  document.addEventListener('click',function(e){
    var step=e.target.closest('.g-step'); if(step){renderLesson(+step.dataset.i);return;}
    var ltab=e.target.closest('.l-tab'); if(ltab){
      document.querySelectorAll('.l-tab').forEach(function(t){t.classList.remove('active');});
      ltab.classList.add('active');
      document.querySelectorAll('.l-pane').forEach(function(p){p.classList.remove('show');});
      var pane=document.getElementById('pane-'+ltab.dataset.pane); if(pane)pane.classList.add('show');
      var tr=document.querySelector('.l-tabs'); if(tr)window.scrollTo({top:tr.getBoundingClientRect().top+window.pageYOffset-16,behavior:'smooth'});
      return;
    }
    var mark=e.target.closest('#markBtn'); if(mark){var l=LESSONS[current];done[l.id]=!done[l.id];save();renderLesson(current);return;}
    var next=e.target.closest('#nextBtn'); if(next&&!next.disabled){renderLesson(Math.min(current+1,LESSONS.length-1));return;}
    var opt=e.target.closest('.opt'); if(opt&&!opt.disabled){handleOpt(opt);return;}
    var chip=e.target.closest('.word-chip'); if(chip){handleChip(chip);return;}
    var cat=e.target.closest('.cat-item'); if(cat){handleCat(cat);return;}
    var drop=e.target.closest('.cat-drop'); if(drop){handleDrop(drop);return;}
    var chk=e.target.closest('[data-check]'); if(chk){checkExercise(chk.dataset.check,chk.dataset.type);return;}
    var show=e.target.closest('[data-show]'); if(show){showAnswers(show.dataset.show);return;}
  });

  function handleOpt(opt){
    var box=opt.parentNode; if(box.dataset.answered)return; box.dataset.answered='1';
    var ans=box.dataset.ans, exp=box.dataset.exp;
    var ok=opt.dataset.o===ans;
    Array.prototype.forEach.call(box.children,function(b){b.disabled=true;if(b.dataset.o===ans)b.classList.add(ok?'correct':'reveal');});
    if(!ok)opt.classList.add('wrong');
    var fbEl=box.parentNode.querySelector('.q-fb');
    if(fbEl){fbEl.className='q-fb show '+(ok?'ok':'no');fbEl.innerHTML=(ok?'Correct. ':'Not quite. ')+esc(exp||'');}
  }
  function handleChip(chip){
    var q=chip.closest('.q'); var target=q.querySelector('.build-target');
    if(chip.parentNode.classList.contains('build-bank')){chip.classList.add('used');var c=chip.cloneNode(true);c.classList.remove('used');c.dataset.from=chip.dataset.w;target.appendChild(c);}
    else{ // remove from target, re-enable in bank
      var w=chip.dataset.w; chip.remove();
      var bankChip=q.querySelector('.build-bank .word-chip.used[data-w="'+CSS.escape(w)+'"]');
      if(bankChip)bankChip.classList.remove('used');
    }
  }
  var catSel=null;
  function handleCat(item){
    if(item.classList.contains('placed'))return;
    if(catSel)catSel.classList.remove('sel');
    if(catSel===item){catSel=null;return;}
    item.classList.add('sel');catSel=item;
  }
  function handleDrop(drop){
    if(!catSel)return;
    catSel.classList.remove('sel');catSel.classList.add('placed');
    drop.appendChild(catSel);catSel=null;
  }

  function checkExercise(eid,type){
    var r=exReg[eid]; if(!r)return; var body=document.getElementById(eid+'-body');
    var correct=0,total=0;
    if(type==='gap'||type==='convo'){
      body.querySelectorAll('.gap-inp').forEach(function(inp){total++;var ok=accepts(inp.value,inp.dataset.a);inp.classList.remove('correct','wrong');inp.classList.add(ok?'correct':'wrong');inp.disabled=true;if(ok)correct++;});
    } else if(type==='transform'||type==='ec'){
      body.querySelectorAll('.txt-inp').forEach(function(inp,j){total++;var ok=accepts(inp.value,inp.dataset.a);inp.classList.remove('correct','wrong');inp.classList.add(ok?'correct':'wrong');inp.disabled=true;if(ok)correct++;
        var f=document.getElementById(eid+'_f'+j);if(f&&!ok){f.className='q-fb show no';f.innerHTML='Answer: '+esc(inp.dataset.a.split('/')[0]);}else if(f){f.className='q-fb show ok';f.innerHTML='Correct';}});
    } else if(type==='mc'||type==='tf'){
      body.querySelectorAll('.opts').forEach(function(box){total++;if(box.dataset.answered&&box.querySelector('.wrong')===null&&box.querySelector('.correct'))correct++;else if(!box.dataset.answered){/*auto-reveal*/var ans=box.dataset.ans;Array.prototype.forEach.call(box.children,function(b){b.disabled=true;if(b.dataset.o===ans)b.classList.add('reveal');});}});
    } else if(type==='builder'){
      body.querySelectorAll('.build-target').forEach(function(t,j){total++;var built=Array.prototype.map.call(t.children,function(c){return c.dataset.w;}).join(' ');var ok=accepts(built,t.dataset.a);t.style.borderColor=ok?'var(--sea)':'var(--coral)';t.style.background=ok?'var(--sea-tint)':'var(--coral-tint)';if(ok)correct++;var f=document.getElementById(eid+'_f'+j);if(f){f.className='q-fb show '+(ok?'ok':'no');f.innerHTML=ok?'Correct':('Answer: '+esc(t.dataset.a.split('/')[0]));}});
    } else if(type==='categorise'){
      body.querySelectorAll('.cat-drop').forEach(function(drop){var cat=drop.dataset.cat;drop.querySelectorAll('.cat-item').forEach(function(it){total++;var ok=it.dataset.cat===cat;it.classList.add(ok?'correct':'wrong');if(ok)correct++;});});
    }
    var sc=document.getElementById(eid+'-score'); if(sc){sc.className='ex-score show';sc.textContent=correct+' / '+total;}
  }
  function showAnswers(eid){
    var r=exReg[eid]; if(!r)return; var ex=r.ex, body=document.getElementById(eid+'-body');
    if(ex.type==='gap'||ex.type==='convo'){body.querySelectorAll('.gap-inp').forEach(function(inp){inp.value=inp.dataset.a.split('/')[0];inp.classList.add('correct');inp.disabled=true;});}
    else if(ex.type==='transform'||ex.type==='ec'){body.querySelectorAll('.txt-inp').forEach(function(inp){inp.value=inp.dataset.a.split('/')[0];inp.classList.add('correct');inp.disabled=true;});}
    else if(ex.type==='mc'||ex.type==='tf'){body.querySelectorAll('.opts').forEach(function(box){var ans=box.dataset.ans;Array.prototype.forEach.call(box.children,function(b){b.disabled=true;if(b.dataset.o===ans)b.classList.add('reveal');});});}
    else if(ex.type==='builder'){body.querySelectorAll('.build-target').forEach(function(t){t.innerHTML='';t.dataset.a.split('/')[0].trim().split(' ').forEach(function(w){var c=document.createElement('span');c.className='word-chip';c.textContent=w;t.appendChild(c);});});}
    else if(ex.type==='categorise'){var bank=document.getElementById(eid+'-bank');body.querySelectorAll('.cat-drop').forEach(function(drop){var cat=drop.dataset.cat;});body.querySelectorAll('.cat-item').forEach(function(it){var target=body.querySelector('.cat-drop[data-cat="'+CSS.escape(it.dataset.cat)+'"]');if(target){it.classList.remove('sel');it.classList.add('placed','correct');target.appendChild(it);}});}
  }

  renderLesson(Math.min(current,LESSONS.length-1));
})();
</script>
<script>
/* High-res PNG export of the current lesson's Learn content, via html2canvas
   (same library/CDN used elsewhere on the site - no canvas taint). */
(function(){
  var H2C='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  function loadH2C(){return new Promise(function(res,rej){if(typeof html2canvas!=='undefined')return res();var s=document.createElement('script');s.src=H2C;s.onload=function(){res();};s.onerror=function(){rej(new Error('html2canvas failed to load'));};document.head.appendChild(s);});}
  window.exportLessonPNG=function(i,btn){
    var titleEl=document.querySelector('.g-lesson-title');
    var subEl=document.querySelector('.g-lesson-sub');
    var learn=document.querySelector('#pane-learn .g-card');
    if(!titleEl||!learn) return;
    var eyebrow=document.querySelector('.g-title')?document.querySelector('.g-title').textContent.trim():'Grammar';
    var id=(window.LESSONS&&LESSONS[i])?LESSONS[i].id:'lesson';
    var fileslug=(eyebrow.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'grammar')+'-'+id;
    var orig; if(btn){orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span style="font-size:.7rem;font-weight:700;line-height:1">…</span>';}
    var host=document.createElement('div');host.style.cssText='position:fixed;left:-100000px;top:0;z-index:-1;pointer-events:none';
    var card=document.createElement('div');card.className='png-export-card';
    card.innerHTML='<div class="pec-inner"><div class="pec-eyebrow">'+eyebrow+'</div><h2 class="pec-title">'+titleEl.innerHTML+'</h2>'+(subEl?'<div class="pec-sub">'+subEl.innerHTML+'</div>':'')+'<div class="pec-body">'+learn.innerHTML+'</div><div class="pec-foot"><b>johnplusenglish</b> &nbsp;·&nbsp; English grammar, one lesson at a time</div></div>';
    host.appendChild(card);document.body.appendChild(host);
    var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready.catch(function(){}):Promise.resolve();
    loadH2C().then(function(){return ready;}).then(function(){
      return html2canvas(card,{scale:3,backgroundColor:'#F7F6F3',useCORS:true,logging:false,width:card.offsetWidth,height:card.offsetHeight});
    }).then(function(canvas){
      var link=document.createElement('a');link.download=fileslug+'.png';link.href=canvas.toDataURL('image/png');
      document.body.appendChild(link);link.click();document.body.removeChild(link);
    }).catch(function(err){console.error('PNG export failed:',err);alert('Sorry, the image export failed. Please check your connection and try again.');}).then(function(){
      if(host.parentNode)host.parentNode.removeChild(host);
      if(btn){btn.disabled=false;if(orig!=null)btn.innerHTML=orig;}
    });
  };
})();
</script>
