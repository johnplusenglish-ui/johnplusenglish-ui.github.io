<script>
/* ────────────────────────────────────────────────────────────────
   DATA
   Each phrase: [phrase, transliteration, literal gloss, English, note]
   Transliteration is '' for Latin-script languages.
   ──────────────────────────────────────────────────────────────── */

const CATS = [
  {id:'greet',  name:'Greetings & Goodbyes'},
  {id:'small',  name:'Small Talk'},
  {id:'plans',  name:'Making Plans'},
  {id:'agree',  name:'Agreeing & Disagreeing'},
  {id:'react',  name:'Reactions & Surprise'},
  {id:'feel',   name:'Feelings & Moods'},
  {id:'effort', name:'Effort & Laziness'},
  {id:'annoy',  name:'Annoyance & Complaining'},
  {id:'soft',   name:'Softeners & Fillers'},
  {id:'slang',  name:'Slang & Emphasis'}
];

/* ═══════════════ ITALIAN ═══════════════ */
const DATA_it = {
greet:[
["Ci vediamo","","we see each other","See you / See you around","The default sign-off between friends. Add <b>dopo</b>, <b>domani</b>, <b>presto</b> for later, tomorrow, soon."],
["A dopo","","to later","See you later","Only for the same day. If you won't see them again today, use <b>ci vediamo</b>."],
["Ci sentiamo","","we hear each other","Talk soon / We'll be in touch","Ends a phone call or a chat. Italians distinguish sentirsi (speak) from vedersi (meet) far more carefully than English does."],
["Come va?","","how does it go","How's it going?","Everyday version of the formal <b>Come sta?</b>. Answered with <b>bene</b>, <b>non c'e male</b> or a shrug."],
["Tutto bene?","","all well","You all right?","Half greeting, half real question. A friend who looks off gets this one."],
["Buona giornata!","","good day (the whole day)","Have a good day","Said when <b>leaving</b>. <b>Buongiorno</b> is the hello; <b>buona giornata</b> is the goodbye."],
["Ciao ciao","","bye bye","Bye bye","Doubling ciao makes it goodbye only, never hello. Standard for ending calls."],
["Ci si vede","","one sees each other","See ya","Impersonal and more offhand than <b>ci vediamo</b> - you'll bump into each other at some point."],
["Fatti sentire","","make yourself heard","Keep in touch / Give me a shout","Mild reproach built in: you haven't been in contact enough."],
["Salve","","hail","Hi","The safe middle ground when <b>ciao</b> is too familiar and <b>buongiorno</b> too stiff - shops, receptions, strangers your own age."]
],
small:[
["Che si dice?","","what does one say","What's new? / What's the word?","Opens a catch-up. Expects gossip, not a status report."],
["Come mai?","","how ever","How come?","Asks the reason behind something mildly surprising. Not the same as the neutral <b>perché</b>."],
["Non c'è male","","there isn't bad","Not bad","The standard modest answer to <b>Come va?</b>. Saying <b>benissimo</b> can sound like showing off."],
["Si tira avanti","","one pulls forward","Getting by / Mustn't grumble","Impersonal <b>si</b> makes it sound like everyone is in the same boat."],
["Da quanto tempo!","","since how much time","Long time no see!","Said with both arms out. Often followed by <b>come stai?</b>"],
["Che ne so","","what of it do I know","Search me / How should I know","Dismissive shrug. Softer than it looks in writing."],
["Sai com'è","","you know how it is","You know how it is","Closes a topic without explaining it. Very useful when you don't want to elaborate."],
["Tanto per dire","","just so as to say","Just saying","Marks a comment as small talk rather than a real proposal."],
["E te?","","and you","And you?","Grammatically it should be <b>e tu?</b>, but <b>e te?</b> is what people actually say."],
["Come al solito","","as the usual","Same as always","Answer to how work / the family / life is going. Resigned but content."]
],
plans:[
["Facciamo così","","let's do like this","Right, here's the plan","Used to settle a decision after everyone has talked in circles."],
["Ci stai?","","are you in it","You in? / Are you up for it?","Invitation with no pressure. The reply is <b>ci sto</b> or <b>no, dai</b>."],
["Ci sto","","I am in it","I'm in / I'm up for it","Also means 'I agree to it'. One of the highest-value two-word phrases in Italian."],

/* ═══ STATE + RENDER ═══ */
const GROUP_COLOR = ['#2176FF','#E76F51','#2A9D8F','#9B72CF'];
const GROUPS = [
  {name:'Meeting & small talk', keys:['greet','small','plans']},
  {name:'Reacting & responding', keys:['agree','react']},
  {name:'Moods & grumbles',      keys:['feel','effort','annoy']},
  {name:'Fillers & slang',       keys:['soft','slang']}
];
const CAT_NAME = {}; CATS.forEach(function(c){ CAT_NAME[c.id] = c.name; });
const LANG_BY = {}; LANGS.forEach(function(l){ LANG_BY[l.id] = l; });

let curLang = LANGS[0];
let curCat  = 'all';
let hideEn  = false;
let mode    = 'lang';                        /* 'lang' | 'compare' */
let menuShut = {};                           /* group name -> collapsed */
let cmpLangs = COMPARE_LANGS.slice();        /* active compare columns */

const $ = function(id){ return document.getElementById(id); };
const esc = function(s){ return String(s).replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
/* Notes and literals carry intentional <b>/<i>; phrases and English never do. */
const rich = function(s){ return String(s).replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;'); };
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

function buildTabs(){
  var h = LANGS.map(function(l){
    return '<button class="tab' + (mode==='lang' && l.id===curLang.id ? ' active' : '') + '" role="tab" data-lang="' + l.id +
           '" style="--tab-accent:' + l.accent + '">' + l.name + '</button>';
  }).join('');
  h += '<button class="tab tab-compare' + (mode==='compare' ? ' active' : '') + '" role="tab" data-mode="compare" style="--tab-accent:#2176FF">Compare</button>';
  $('langTabs').innerHTML = h;
  Array.prototype.forEach.call($('langTabs').querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){
      if(b.getAttribute('data-mode')==='compare') setMode('compare');
      else { setMode('lang'); setLang(b.getAttribute('data-lang')); }
    });
  });
}

function catCount(catId){ return (curLang.data[catId]||[]).length; }
function langTotal(){ var t=0; CATS.forEach(function(c){ t += catCount(c.id); }); return t; }

/* ── Menu: All row + collapsible colour-coded groups (shared by both modes) ── */
function renderMenu(){
  var allLabel = mode==='compare' ? 'All categories' : 'All phrases';
  var h = '<button class="bk bk-all' + (curCat==='all'?' on':'') + '" data-c="all" style="--catdot:var(--ink)"><span class="bk-name">' + allLabel + '</span></button>';
  GROUPS.forEach(function(g,gi){
    var shut = !!menuShut[g.name];
    h += '<div class="cat' + (shut?' shut':'') + '" style="--catdot:' + GROUP_COLOR[gi%GROUP_COLOR.length] + '">'
       +   '<button class="cat-toggle" data-g="' + esc(g.name) + '">' + esc(g.name) + '<span class="cat-chev">&#9662;</span></button>'
       +   '<div class="cat-rows">';
    g.keys.forEach(function(k){
      h += '<button class="bk' + (curCat===k?' on':'') + '" data-c="' + k + '"><span class="bk-name">' + esc(CAT_NAME[k]) + '</span></button>';
    });
    h += '</div></div>';
  });
  var box = $('phMenu'); var keep = box.scrollTop; box.innerHTML = h; box.scrollTop = keep;
  box.querySelectorAll('.bk').forEach(function(b){ b.addEventListener('click', function(){ pickCat(b.getAttribute('data-c')); }); });
  box.querySelectorAll('.cat-toggle').forEach(function(t){ t.addEventListener('click', function(){ var n=t.getAttribute('data-g'); menuShut[n]=!menuShut[n]; renderMenu(); }); });
}
function pickCat(c){ curCat = c; renderMenu(); renderPane(); scrollPaneIntoView(); }

/* ── Language mode: single-column phrase list ── */
function phraseRow(p){
  var tr   = p[1] ? '<span class="pr-tr">' + esc(p[1]) + '</span>' : '';
  var lit  = p[2] ? '<div class="pr-lit">lit. ' + rich(p[2]) + '</div>' : '';
  var note = p[4] ? '<div class="pr-note">' + rich(p[4]) + '</div>' : '';
  return '<div class="pr">'
       +   '<div class="pr-top"><span class="pr-phrase">' + esc(p[0]) + '</span>' + tr + '</div>'
       +   lit
       +   '<div class="pr-en' + (hideEn?' hidden-en':'') + '" onclick="revealOne(this)">' + esc(p[3]) + '</div>'
       +   note
       + '</div>';
}
function renderLangPane(){
  var total = langTotal();
  $('phFoot').textContent = total; $('phCatN').textContent = CATS.length;
  document.getElementById('phFootTail').textContent = 'categories';
  var body = '';
  if(curCat==='all'){
    $('phH').textContent = 'All phrases';
    $('phSub').textContent = curLang.name + ' · ' + total + ' phrases across ' + CATS.length + ' categories';
    CATS.forEach(function(c){
      var list = curLang.data[c.id] || []; if(!list.length) return;
      body += '<div class="gh">' + esc(c.name) + '</div>' + list.map(phraseRow).join('');
    });
  } else {
    var list = curLang.data[curCat] || [];
    $('phH').textContent = CAT_NAME[curCat] || '';
    $('phSub').textContent = curLang.name + ' · ' + list.length + ' phrases';
    body = list.map(phraseRow).join('');
  }
  $('phPane').innerHTML = body;
}
function revealOne(el){ if(el.classList.contains('hidden-en')) el.classList.remove('hidden-en'); }

/* ── Compare mode: aligned phrasebook grid ── */
function activeCols(){ return COMPARE_LANGS.filter(function(id){ return cmpLangs.indexOf(id) > -1; }); }
function gridTable(catId){
  var rows = COMPARE[catId] || []; var cols = activeCols();
  var h = '<div class="cmp-wrap"><table class="cmp-table"><thead><tr><th class="cmp-fn-h">Function</th>';
  cols.forEach(function(id){ h += '<th class="cmp-lang" style="--c:' + LANG_BY[id].accent + '">' + esc(LANG_BY[id].name) + '</th>'; });
  h += '</tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr><td class="cmp-fn">' + esc(r.fn) + '</td>';
    cols.forEach(function(id){
      var v = r.by[id];
      if(!v){ h += '<td class="cmp-cell"><span class="cmp-none">-</span></td>'; }
      else if(hideEn){ h += '<td class="cmp-cell"><span class="cmp-hp" onclick="revealCell(this)">' + esc(v) + '</span></td>'; }
      else { h += '<td class="cmp-cell">' + esc(v) + '</td>'; }
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}
function revealCell(el){ el.classList.add('shown'); }
function renderComparePane(){
  var cats = curCat==='all' ? CATS.map(function(c){ return c.id; }) : [curCat];
  var nfn = 0; cats.forEach(function(c){ nfn += (COMPARE[c]||[]).length; });
  $('phFoot').textContent = cmpLangs.length; $('phCatN').textContent = nfn;
  $('phFootTail').textContent = 'aligned phrases';
  $('phH').textContent = curCat==='all' ? 'Compare all categories' : (CAT_NAME[curCat] || '') + ' — compared';
  $('phSub').textContent = cmpLangs.length + ' languages · ' + nfn + ' aligned phrases';
  var chips = '<div class="cmp-bar">' + COMPARE_LANGS.map(function(id){
    var on = cmpLangs.indexOf(id) > -1;
    return '<button class="cmp-chip' + (on?' on':'') + '" data-l="' + id + '" style="--c:' + LANG_BY[id].accent + '">' + esc(LANG_BY[id].name) + '</button>';
  }).join('') + '</div>';
  var body = '';
  cats.forEach(function(cid){
    if(!(COMPARE[cid]||[]).length) return;
    body += '<div class="cmp-cat">' + (curCat==='all' ? '<div class="cmp-cat-h">' + esc(CAT_NAME[cid]) + '</div>' : '') + gridTable(cid) + '</div>';
  });
  $('phPane').innerHTML = chips + body;
  $('phPane').querySelectorAll('.cmp-chip').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-l'); var i = cmpLangs.indexOf(id);
      if(i > -1){ if(cmpLangs.length > 1) cmpLangs.splice(i,1); }
      else { cmpLangs.push(id); }
      renderComparePane();
    });
  });
}

function renderPane(){ if(mode==='compare') renderComparePane(); else renderLangPane(); }

function toggleHide(){
  hideEn = !hideEn;
  $('phHideBtn').classList.toggle('on', hideEn);
  var noun = mode==='compare' ? 'phrases' : 'English';
  $('phHideLabel').textContent = (hideEn ? 'Show ' : 'Hide ') + noun;
  renderPane();
}

/* ── Menu collapse (persisted; key kept for continuity) ── */
function toggleMenu(){
  if(window.matchMedia('(max-width:820px)').matches) return;
  var sb=$('phSb'), pk=$('phPicker');
  var c = sb.classList.toggle('collapsed'); pk.classList.toggle('sb-collapsed', c);
  store('jpe-phrases-rail-collapsed', c ? '1' : '0');
}
function scrollPaneIntoView(){
  if(!window.matchMedia('(max-width:820px)').matches) return;
  var pane = document.querySelector('#phPicker .pane'); if(pane) pane.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ── Print the current view as a clean handout ── */
function printCurrent(){
  var w = window.open('', '_blank'); if(!w) return;
  var title, blocks = '';
  if(mode==='compare'){
    title = 'Say It in English · Compare' + (curCat==='all' ? '' : ' · ' + (CAT_NAME[curCat]||''));
    var cols = activeCols();
    var cats = curCat==='all' ? CATS.map(function(c){ return c.id; }) : [curCat];
    cats.forEach(function(cid){
      if(!(COMPARE[cid]||[]).length) return;
      blocks += '<h2>' + esc(CAT_NAME[cid]) + '</h2><table><thead><tr><th>Function</th>';
      cols.forEach(function(id){ blocks += '<th>' + esc(LANG_BY[id].name) + '</th>'; });
      blocks += '</tr></thead><tbody>';
      COMPARE[cid].forEach(function(r){
        blocks += '<tr><td class="fn">' + esc(r.fn) + '</td>';
        cols.forEach(function(id){ blocks += '<td>' + (r.by[id] ? esc(r.by[id]) : '-') + '</td>'; });
        blocks += '</tr>';
      });
      blocks += '</tbody></table>';
    });
  } else {
    title = 'Say It in English · ' + curLang.name + (curCat==='all' ? '' : ' · ' + (CAT_NAME[curCat]||''));
    var lcats = curCat==='all' ? CATS.map(function(c){ return c.id; }) : [curCat];
    lcats.forEach(function(cid){
      var list = curLang.data[cid] || []; if(!list.length) return;
      blocks += '<h2>' + esc(CAT_NAME[cid]) + '</h2>';
      list.forEach(function(p){
        blocks += '<div class="row"><div class="ph">' + esc(p[0]) + (p[1] ? ' <span class="tr">' + esc(p[1]) + '</span>' : '') + '</div>'
               + (p[2] ? '<div class="lit">lit. ' + rich(p[2]) + '</div>' : '')
               + '<div class="en">' + esc(p[3]) + '</div>'
               + (p[4] ? '<div class="note">' + rich(p[4]) + '</div>' : '') + '</div>';
      });
    });
  }
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title>'
   + '<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">'
   + '<style>*{box-sizing:border-box}body{font-family:Outfit,sans-serif;color:#2D3047;max-width:900px;margin:0 auto;padding:1.5rem 2rem;font-size:10.5pt;line-height:1.5}'
   + '.hd{text-align:right;font-size:.7rem;color:#7A7D8E;margin-bottom:1.2rem}'
   + 'h2{font-size:1.15rem;font-weight:800;margin:1.4rem 0 .5rem;padding-bottom:.25rem;border-bottom:1.5px solid #2176FF;color:#2176FF}h2:first-of-type{margin-top:0}'
   + '.row{padding:.5rem 0;border-bottom:1px solid #eee;break-inside:avoid}'
   + '.ph{font-weight:800;font-size:1rem}.tr{font-weight:500;font-size:.75rem;color:#7A7D8E}'
   + '.lit{font-style:italic;color:#7A7D8E;font-size:.82rem}.en{font-weight:700;color:#2176FF;margin-top:.2rem}.note{color:#555;font-size:.83rem;margin-top:.15rem}.note b{color:#2D3047}'
   + 'table{border-collapse:collapse;width:100%;margin:.3rem 0 .5rem;font-size:.82rem}th,td{border:1px solid #e5e5e5;padding:.35rem .5rem;text-align:left;vertical-align:top}th{background:#f5f5f3;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}td.fn{font-weight:800}'
   + '@media print{body{padding:.75rem}h2{page-break-after:avoid}table{page-break-inside:auto}tr{page-break-inside:avoid}}</style></head><body>'
   + '<div class="hd">johnplusenglish.com · ' + esc(title) + '</div>' + blocks + '</body></html>');
  w.document.close();
  setTimeout(function(){ w.print(); }, 400);
}

const CMP_INTRO = "Every category, side by side across all seven languages. Each row is one thing you might want to say; the columns show how each language says it. A dash means that language has no direct equivalent. Trim the columns with the buttons, and use <b>Hide phrases</b> to quiz how each language says a given line.";

function setMode(m){
  mode = m;
  document.documentElement.style.setProperty('--lang', m==='compare' ? '#2176FF' : curLang.accent);
  $('phIntro').innerHTML = m==='compare' ? CMP_INTRO : curLang.intro;
  var noun = m==='compare' ? 'phrases' : 'English';
  $('phHideLabel').textContent = (hideEn ? 'Show ' : 'Hide ') + noun;
  buildTabs(); renderMenu(); renderPane();
}

function setLang(id){
  curLang = LANGS.filter(function(l){ return l.id===id; })[0] || LANGS[0];
  document.documentElement.style.setProperty('--lang', curLang.accent);
  $('phIntro').innerHTML = curLang.intro;
  store('jpe-phrases-lang', curLang.id);
  buildTabs(); renderMenu(); renderPane();
}

(function init(){
  var savedLang = store('jpe-phrases-lang');
  var start = LANGS.filter(function(l){ return l.id===savedLang; })[0] || LANGS[0];
  if(store('jpe-phrases-rail-collapsed') === '1'){
    $('phSb').classList.add('collapsed');
    $('phPicker').classList.add('sb-collapsed');
  }
  curLang = start;
  setLang(start.id);
})();
</script>
</body>
</html>
