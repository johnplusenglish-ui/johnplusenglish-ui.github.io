.ph-tr{font-family:'JetBrains Mono',monospace;font-size:.71rem;color:var(--muted);letter-spacing:-.01em}
.ph-lit{font-size:.81rem;color:var(--muted);font-style:italic;margin-top:.12rem}
.ph-en{margin-top:.5rem;font-size:.97rem;font-weight:700;color:var(--lang,var(--sea));line-height:1.4}

.ph-note{margin-top:.3rem;font-size:.84rem;color:var(--muted);line-height:1.55}

.ph-intro{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;margin-bottom:1.1rem;font-size:.88rem;color:var(--muted);line-height:1.6}

@media(max-width:640px){

<script>
/* ────────────────────────────────────────────────────────────────
   DATA
   Each phrase: [phrase, transliteration, literal gloss, English, note]
   Transliteration is '' for Latin-script languages.

const CATS = [
  {id:'greet',  name:'Greetings & Goodbyes'},
  {id:'small',  name:'Small Talk'},
  {id:'plans',  name:'Making Plans'},
  {id:'agree',  name:'Agreeing & Disagreeing'},
  {id:'react',  name:'Reactions & Surprise'},
  {id:'feel',   name:'Feelings & Moods'},
  {id:'effort', name:'Effort & Laziness'},

  {id:'soft',   name:'Softeners & Fillers'},
  {id:'slang',  name:'Slang & Emphasis'}
];

/* ═══════════════ ITALIAN ═══════════════ */
const DATA_it = {
greet:[
["Ci vediamo","","we see each other","See you / See you around","The default sign-off between friends. Add <b>dopo</b>, <b>domani</b>, <b>presto</b> for later, tomorrow, soon."],
["A dopo","","to later","See you later","Only for the same day. If you won't see them again today, use <b>ci vediamo</b>."],
["Ci sentiamo","","we hear each other","Talk soon / We'll be in touch","Ends a phone call or a chat. Italians distinguish sentirsi (speak) from vedersi (meet) far more carefully than English does."],
["Come va?","","how does it go","How's it going?","Everyday version of the formal <b>Come sta?</b>. Answered with <b>bene</b>, <b>non c'e male</b> or a shrug."],
["Tutto bene?","","all well","You all right?","Half greeting, half real question. A friend who looks off gets this one."],
["Buona giornata!","","good day (the whole day)","Have a good day","Said when <b>leaving</b>. <b>Buongiorno</b> is the hello; <b>buona giornata</b> is the goodbye."],
["Ciao ciao","","bye bye","Bye bye","Doubling ciao makes it goodbye only, never hello. Standard for ending calls."],
["Ci si vede","","one sees each other","See ya","Impersonal and more offhand than <b>ci vediamo</b> — you'll bump into each other at some point."],
["Fatti sentire","","make yourself heard","Keep in touch / Give me a shout","Mild reproach built in: you haven't been in contact enough."],
["Salve","","hail","Hi","The safe middle ground when <b>ciao</b> is too familiar and <b>buongiorno</b> too stiff — shops, receptions, strangers your own age."]
],
small:[
["Che si dice?","","what does one say","What's new? / What's the word?","Opens a catch-up. Expects gossip, not a status report."],
["Come mai?","","how ever","How come?","Asks the reason behind something mildly surprising. Not the same as the neutral <b>perché</b>."],
["Non c'è male","","there isn't bad","Not bad","The standard modest answer to <b>Come va?</b>. Saying <b>benissimo</b> can sound like showing off."],
["Si tira avanti","","one pulls forward","Getting by / Mustn't grumble","Impersonal <b>si</b> makes it sound like everyone is in the same boat."],
["Da quanto tempo!","","since how much time","Long time no see!","Said with both arms out. Often followed by <b>come stai?</b>"],
["Che ne so","","what of it do I know","Search me / How should I know","Dismissive shrug. Softer than it looks in writing."],
["Sai com'è","","you know how it is","You know how it is","Closes a topic without explaining it. Very useful when you don't want to elaborate."],
["Tanto per dire","","just so as to say","Just saying","Marks a comment as small talk rather than a real proposal."],
["E te?","","and you","And you?","Grammatically it should be <b>e tu?</b>, but <b>e te?</b> is what people actually say."],
["Come al solito","","as the usual","Same as always","Answer to how work / the family / life is going. Resigned but content."]
],
plans:[
["Facciamo così","","let's do like this","Right, here's the plan","Used to settle a decision after everyone has talked in circles."],
["Ci stai?","","are you in it","You in? / Are you up for it?","Invitation with no pressure. The reply is <b>ci sto</b> or <b>no, dai</b>."],
["Ci sto","","I am in it","I'm in / I'm up for it","Also means 'I agree to it'. One of the highest-value two-word phrases in Italian."],
["Vediamo","","we see","We'll see","Polite non-commitment. Often means no, said kindly."],
["Ti va di...?","","does it go to you to","Do you fancy...?","<b>Ti va di uscire?</b> = Fancy going out? The most natural way to invite someone."],
["Mi sa di no","","it tastes to me of no","I don't think so","<b>Mi sa</b> = I reckon. Nothing to do with taste in real use."],
["Passo a prenderti","","I pass to take you","I'll come and get you","Standard for lifts. <b>Passo</b> alone means 'I'll swing by'."],
["Fammi sapere","","make me know","Let me know","The polite way to leave a plan open."],
["Se ne riparla","","one speaks of it again","We'll talk about it another time","Nine times out of ten a soft no. Listen to the tone."],
["A che ora ci troviamo?","","at what time do we find ourselves","What time shall we meet?","<b>Trovarsi</b>, not <b>incontrarsi</b>, is the everyday verb for meeting up with friends."]
],
agree:[
["Hai ragione","","you have reason","You're right","Note the have + noun structure. Students say 'you are right' in Italian and it sounds odd."],
["Esatto","","exact","Exactly","One-word confirmation. <b>Esattamente</b> is the fuller, slightly more formal version."],
["Appunto!","","precisely","That's exactly my point","Used when somebody finally says the thing you'd been trying to say."],
["Ma anche no","","but also no","Er, no thanks / I'd rather not","Ironic refusal, very modern. Deadpan delivery is the whole joke."],
["Non sono d'accordo","","I am not of accord","I don't agree","The neutral disagreement. Milder than English 'I disagree', which sounds confrontational."],
["Ci mancherebbe","","it would be lacking","Of course / Don't mention it","Agreeing that something goes without saying — after a thank-you or a request for permission."],
["Come no!","","how not","Of course!","Sincere when warm, and 'yeah, right' when flat. Tone carries all of it."],
["Boh","","(shrug sound)","Dunno","The great Italian shrug-word. A complete, acceptable answer in most conversations."],
["Mah","","(hesitation sound)","Hmm, I'm not convinced","Signals doubt before you've decided how to phrase it."],
["Sarà...","","it will be","If you say so","Polite scepticism. You've heard the claim and you're not buying it."]
],
react:[
["Ma dai!","","but give","No way! / Come on!","Disbelief, delight or irritation depending on tone. Hugely frequent."],
["Non ci credo","","I don't believe it","I can't believe it","Genuine astonishment, usually at good news or a betrayal."],
["Che palle!","","what balls","What a pain!","Mildly vulgar and completely ubiquitous. Warn students before they use it at work."],
["Mamma mia!","","my mother","Blimey / Oh my God","Real Italians do say it — for stress, cost, traffic and heat, not for pizza."],
["Roba da matti","","stuff for madmen","It's madness","Reserved for bureaucracy, queues and other people's driving."],
["Ci credo!","","I believe it","I bet! / No wonder!","Confirms that an outcome was entirely predictable."],
["Menomale","","less bad","Thank goodness","Written as one word or two. Relief, not gratitude."],
["Che figata!","","what a coolness","How cool is that!","Slang, informal, safe among friends."],
["Assurdo","","absurd","That's insane","Used alone as a full reaction to news, prices or behaviour."],
["Oddio","","oh God","Oh God","Worry more often than shock. <b>Oddio, che ore sono?</b>"]
],
feel:[
["Non ce la faccio più","","I don't make it any more","I can't take any more","Work, heat, kids, revision. The national exhaustion phrase."],
["Sono a pezzi","","I am in pieces","I'm shattered","Physical wreckage after a long day or a long run."],
["Ho un diavolo per capello","","I have a devil per hair","I'm absolutely fuming","Vivid and common. One devil for every hair on your head."],
["Mi sono rotto","","I have broken myself","I'm fed up","Short for <b>mi sono rotto le scatole</b>. Feminine speakers say <b>mi sono rotta</b>."],
["Sono giù","","I am down","I'm feeling low","Mild, everyday sadness rather than clinical language."],
["Che ansia","","what anxiety","So stressful","Applied to anything from an exam to a slow queue. Deliberately over-the-top."],
["Mi sento uno straccio","","I feel like a rag","I feel like a wreck","Illness, jet lag or a very bad night."],
["Sto una favola","","I am a fairytale","I feel great","Bright, cheerful, slightly camp. The opposite of <b>sono a pezzi</b>."],
["Ho una fame che non ci vedo","","I have a hunger that I can't see","I'm so hungry I can't think straight","Hunger as a loss of vision. Italians rank hunger highly."],
["Non vedo l'ora","","I don't see the hour","I can't wait","Followed by <b>di</b> + infinitive: <b>non vedo l'ora di partire</b>."]
],
effort:[
["Non ho voglia","","I don't have the desire","I can't be bothered","The Italian twin of Spanish <b>me da pereza</b>. Add <b>di</b> + verb: <b>non ho voglia di cucinare</b>."],
["Che fatica","","what effort","What a slog","Physical or mental. Sighed rather than said."],
["Mi scoccia","","it bugs me","I can't be bothered to","<b>Mi scoccia uscire</b> = I can't face going out. Reluctance, not real anger."],
["Lascia perdere","","let it lose","Forget it / Never mind","Ends a topic that isn't worth the energy."],
["Chi me lo fa fare?","","who makes me do it","Why would I bother?","Rhetorical. The answer is always nobody."],
["Domani è un altro giorno","","tomorrow is another day","Tomorrow's another day","The classic procrastination licence."],
["Fa niente","","it does nothing","Never mind / It doesn't matter","Also the standard reply to an apology."],
["Me la cavo","","I get myself out of it","I get by / I manage","Perfect for describing your level in a language: <b>me la cavo con l'inglese</b>."],
["È una rottura","","it's a breakage","It's a real drag","Softer, printable cousin of <b>che palle</b>."],
["Ci penso io","","I think about it, I","I'll take care of it","Generous and reassuring. The final <b>io</b> is the emphasis."]
],
annoy:[
["Basta!","","enough","That's enough!","Works on children, colleagues and rain."],
["Ma che vuoi?","","but what do you want","What's your problem?","Confrontational. Not the same as politely asking what someone wants."],
["Non se ne può più","","one can't take more of it","We've all had enough of this","Impersonal, so it sounds like a shared public verdict."],
["Sempre la stessa storia","","always the same story","Same old story","Trains, politics, that one relative."],
["Ma per favore!","","but please","Oh, come on!","Sarcastic 'please' — rejects what was just said as nonsense."],
["Mi hai stufato","","you have stewed me","I've had it with you","<b>Stufo</b> = fed up, from the same root as stew. Direct and personal."],
["Non è colpa mia","","it isn't fault mine","It's not my fault","Everyday self-defence, no drama attached."],

   intro:"Everyday spoken Russian with transliteration. Many phrases here look identical in structure to the Ukrainian list — they are genuine neighbours — but the notes flag where the register or the exact word differs."},
  {id:'fr', name:'French',    accent:'#D6455C', data:DATA_fr,
   intro:"Real spoken French, including the dropped <b>ne</b>, the verlan (<b>ouf</b>, <b>relou</b>, <b>chelou</b>) and the fillers that carry half of any conversation (<b>du coup</b>, <b>genre</b>, <b>en fait</b>)."}
];

/* ═══════════════ STATE + RENDER ═══════════════ */
let curLang = LANGS[0];
let curCat  = CATS[0].id;
let hideEn  = false;

const $ = function(id){ return document.getElementById(id); };
const esc = function(s){ return String(s).replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
/* Notes and literals carry intentional <b>/<i>; phrases and English never do. */
const rich = function(s){ return String(s).replace(/&(?!(amp|lt|gt|quot|#\d+);)/g,'&amp;'); };

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

function buildTabs(){
  $('langTabs').innerHTML = LANGS.map(function(l){
    return '<button class="tab' + (l.id===curLang.id ? ' active' : '') + '" role="tab" data-lang="' + l.id +
           '" style="--tab-accent:' + l.accent + '">' + l.name + '</button>';
  }).join('');
  Array.prototype.forEach.call($('langTabs').querySelectorAll('.tab'), function(b){
    b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); });
  });
}

function catCount(catId){
  return (curLang.data[catId]||[]).length;
}

function buildRail(){
  $('phRailList').innerHTML = CATS.map(function(c){
    var n = catCount(c.id);
    return '<button class="ph-cat' + (c.id===curCat ? ' active' : '') + '" data-cat="' + c.id + '">' +
             '<span class="ph-cat-name">' + c.name + '</span>' +
             '<span class="ph-cat-n">' + n + '</span>' +
           '</button>';
  }).join('');
  Array.prototype.forEach.call($('phRailList').querySelectorAll('.ph-cat'), function(b){
    b.addEventListener('click', function(){ curCat = b.getAttribute('data-cat'); buildRail(); buildPane(); });
  });
}

function card(p){
  var tr  = p[1] ? '<span class="ph-tr">' + esc(p[1]) + '</span>' : '';
  var lit = p[2] ? '<div class="ph-lit">lit. ' + rich(p[2]) + '</div>' : '';
  var note= p[4] ? '<div class="ph-note">' + rich(p[4]) + '</div>' : '';
  return '<div class="ph-card">' +
           '<div class="ph-line"><span class="ph-phrase">' + esc(p[0]) + '</span>' + tr + '</div>' +
           lit +
           '<div class="ph-en' + (hideEn ? ' hidden-en' : '') + '" onclick="revealOne(this)">' + esc(p[3]) + '</div>' +
           note +
         '</div>';
}

function buildPane(){
  var cat  = CATS.filter(function(c){ return c.id===curCat; })[0];
  var list = curLang.data[curCat] || [];
  var total = 0;
  CATS.forEach(function(c){ total += catCount(c.id); });
  $('phCount').textContent = total + ' phrases';

  var head = '<div class="ph-pane-head">' +
               '<div class="ph-pane-label">' + curLang.name + '</div>' +
               '<h2>' + cat.name + '</h2>' +
             '</div>';

  $('phPane').innerHTML = head + list.map(card).join('');
}

function revealOne(el){
  if(el.classList.contains('hidden-en')) el.classList.remove('hidden-en');
}

function toggleHide(){
  hideEn = !hideEn;
  $('phHideBtn').classList.toggle('on', hideEn);
  $('phHideLabel').textContent = hideEn ? 'Show English' : 'Hide English';
  buildPane();
}

function toggleRail(){
  var rail = $('phRail'), picker = $('phPicker');
  var collapsed = rail.classList.toggle('collapsed');
  picker.classList.toggle('sb-collapsed', collapsed);
  store('jpe-phrases-rail-collapsed', collapsed ? '1' : '0');
}

function setLang(id){
  curLang = LANGS.filter(function(l){ return l.id===id; })[0] || LANGS[0];
  document.documentElement.style.setProperty('--lang', curLang.accent);
  $('phIntro').innerHTML = curLang.intro;
  store('jpe-phrases-lang', curLang.id);
  buildTabs(); buildRail(); buildPane();
}

(function init(){
  var savedLang = store('jpe-phrases-lang');
  var start = LANGS.filter(function(l){ return l.id===savedLang; })[0] || LANGS[0];

  if(store('jpe-phrases-rail-collapsed') === '1'){
    $('phRail').classList.add('collapsed');
    $('phPicker').classList.add('sb-collapsed');
  }

  setLang(start.id);
})();
</script>
</body>
</html>
