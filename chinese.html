<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EN / ZH Phrasebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cobalt:#0047ab;
    --cobalt-dark:#00337d;
    --cobalt-soft:#eaf0fb;
    --coral:#ff4d4d;
    --coral-dark:#e0393f;
    --coral-soft:#ffe9e8;
    --bg:#f5f6fa;
    --card:#ffffff;
    --ink:#101828;
    --muted:#667085;
    --line:#e5e7f0;
    --radius:18px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 14px 30px -18px rgba(16,24,40,.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Outfit',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  body:not(.unlocked) header, body:not(.unlocked) main{
    display:none;
  }
  #gate{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,var(--cobalt),var(--cobalt-dark));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
  }
  body.unlocked #gate{display:none;}
  .gate-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px 24px;
    max-width:340px;
    width:100%;
    text-align:center;
  }
  .gate-card h2{
    margin:0 0 6px;
    font-size:20px;
    font-weight:800;
    color:var(--ink);
  }
  .gate-sub{
    margin:0 0 18px;
    font-size:13px;
    color:var(--muted);
  }
  .gate-card input[type=password]{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-family:'Outfit',sans-serif;
    font-size:16px;
    margin-bottom:10px;
    background:#fafbfd;
  }
  .gate-card input[type=password]:focus{
    outline:none;
    border-color:var(--cobalt);
    background:#fff;
  }
  .gate-btn{
    width:100%;
    background:var(--cobalt);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:13px;
    font-family:'Outfit',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  .gate-btn:hover{background:var(--cobalt-dark);}
  .gate-btn:disabled{opacity:.5;cursor:not-allowed;}
  .gate-error{
    font-size:12px;
    color:var(--coral-dark);
    min-height:16px;
    margin-top:8px;
    font-weight:600;
  }
  .gate-warn{
    font-size:11px;
    color:var(--muted);
    margin-top:14px;
    line-height:1.5;
  }
  header{
    position:relative;
    background:linear-gradient(135deg,var(--cobalt),var(--cobalt-dark));
    color:#fff;
    padding:28px 20px 34px;
    text-align:center;
  }
  .lock-btn{
    position:absolute;
    top:18px;
    right:16px;
    background:rgba(255,255,255,.15);
    border:none;
    border-radius:10px;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#fff;
  }
  .lock-btn:hover{background:rgba(255,255,255,.25);}
  .lock-btn svg{width:16px;height:16px;fill:currentColor;}
  header h1{
    margin:0 0 4px;
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  header p{
    margin:0;
    font-size:14px;
    opacity:.85;
    font-weight:500;
  }
  main{
    max-width:640px;
    margin:-20px auto 60px;
    padding:0 16px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    padding:20px;
    margin-bottom:16px;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input[type=text]{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-family:'Outfit',sans-serif;
    font-size:16px;
    color:var(--ink);
    background:#fafbfd;
    transition:border-color .15s;
  }
  .field input[type=text]:focus{
    outline:none;
    border-color:var(--cobalt);
    background:#fff;
  }
  .recorders{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
  }
  .recorder{
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:12px;
    background:#fafbfd;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-align:center;
  }
  .recorder .rec-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
  }
  .rec-btn{
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    background:var(--coral);
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 12px -4px rgba(255,77,77,.6);
    transition:transform .1s, background .15s;
  }
  .rec-btn:active{transform:scale(.94);}
  .rec-btn.recording{
    background:var(--coral-dark);
    animation:pulse 1.2s infinite;
  }
  .rec-btn svg{width:20px;height:20px;fill:#fff;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,77,77,.5);}
    70%{box-shadow:0 0 0 12px rgba(255,77,77,0);}
    100%{box-shadow:0 0 0 0 rgba(255,77,77,0);}
  }
  .rec-timer{
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    min-height:16px;
  }
  .rec-preview{
    width:100%;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .rec-preview.show{display:flex;}
  .rec-preview audio{width:100%;height:32px;}
  .rec-redo{
    background:none;
    border:none;
    color:var(--cobalt);
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    text-decoration:underline;
    font-family:'Outfit',sans-serif;
  }
  .rec-error{
    font-size:11px;
    color:var(--coral-dark);
    display:none;
  }
  .save-btn{
    width:100%;
    background:var(--cobalt);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px;
    font-family:'Outfit',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s, opacity .15s;
  }
  .save-btn:hover{background:var(--cobalt-dark);}
  .save-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .list-heading{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--muted);
    margin:24px 4px 10px;
  }
  .entry{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    padding:16px 18px;
    margin-bottom:12px;
    position:relative;
  }
  .entry:not(.editing) .entry-edit{display:none;}
  .entry.editing .entry-view{display:none;}
  .entry-edit{padding-top:4px;}
  .entry-edit .field{margin-bottom:12px;}
  .entry-edit .recorders{margin-bottom:12px;}
  .entry-edit-actions{
    display:flex;
    gap:10px;
  }
  .entry-edit-actions .save-btn{flex:1;}
  .cancel-btn{
    flex:1;
    background:#fff;
    border:1.5px solid var(--line);
    color:var(--ink);
    border-radius:12px;
    padding:14px;
    font-family:'Outfit',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .cancel-btn:hover{background:var(--bg);}
  .entry .en{
    font-size:17px;
    font-weight:600;
    color:var(--ink);
    margin:0 64px 4px 0;
  }
  .entry .zh{
    font-size:16px;
    font-weight:500;
    color:var(--cobalt-dark);
    margin:0 64px 2px 0;
  }
  .entry .pinyin{
    font-size:13px;
    font-weight:500;
    font-style:italic;
    color:var(--muted);
    margin:0 64px 12px 0;
  }
  .entry .audios{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .audio-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--coral-soft);
    border-radius:999px;
    padding:4px 10px 4px 4px;
  }
  .audio-chip .tag{
    font-size:10px;
    font-weight:800;
    color:var(--coral-dark);
    padding:0 2px;
    min-width:20px;
    text-align:center;
  }
  .audio-chip audio{height:28px;max-width:150px;}
  .entry-actions{
    position:absolute;
    top:14px;
    right:14px;
    display:flex;
    gap:2px;
  }
  .icon-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--muted);
    padding:6px;
    border-radius:8px;
    line-height:0;
  }
  .icon-btn svg{width:16px;height:16px;fill:currentColor;}
  .icon-btn.edit-btn:hover{color:var(--cobalt-dark);background:var(--cobalt-soft);}
  .icon-btn.delete-btn:hover{color:var(--coral-dark);background:var(--coral-soft);}
  .empty{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:30px 10px;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h2 id="gate-title">Set a password</h2>
    <p class="gate-sub" id="gate-sub">Choose a password to protect your saved phrases.</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="gate-pw" placeholder="Password" autocomplete="new-password">
      <input type="password" id="gate-pw2" placeholder="Confirm password" autocomplete="new-password">
      <button class="gate-btn" type="submit" id="gate-submit">Set password</button>
      <div class="gate-error" id="gate-error"></div>
    </form>
    <p class="gate-warn">There is no password reset. If you forget it, saved phrases cannot be recovered.</p>
  </div>
</div>

<header>
  <button class="lock-btn" id="lock-btn" type="button" title="Lock">
    <svg viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h1zm2 0h8V8a4 4 0 0 0-8 0v2zm4 4a1.5 1.5 0 0 0-1 2.62V18h2v-1.38A1.5 1.5 0 0 0 12 14z"/></svg>
  </button>
  <h1>EN / ZH Phrasebook</h1>
  <p>Type a phrase, record your voice, save it</p>
</header>

<main>
  <div class="card">
    <div class="field">
      <label for="en-input">English phrase</label>
      <input type="text" id="en-input" placeholder="e.g. How are you today?">
    </div>
    <div class="field">
      <label for="zh-input">Chinese phrase (Traditional)</label>
      <input type="text" id="zh-input" placeholder="e.g. 你今天好嗎？" lang="zh-Hant">
    </div>
    <div class="field">
      <label for="pinyin-input">Pinyin (how to say it)</label>
      <input type="text" id="pinyin-input" placeholder="e.g. Nǐ jīntiān hǎo ma?">
    </div>

    <div class="recorders" id="new-recorders"></div>

    <button class="save-btn" id="save-btn" disabled>Save phrase</button>
  </div>

  <div class="list-heading">Saved phrases</div>
  <div id="list"></div>
</main>

<script>
(function(){
  "use strict";

  var DB_NAME = "phrasebook-db";
  var STORE = "entries";
  var dbPromise = new Promise(function(resolve, reject){
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE, {keyPath:"id"});
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });

  function withStore(mode, fn){
    return dbPromise.then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(STORE, mode);
        var store = tx.objectStore(STORE);
        var result = fn(store);
        tx.oncomplete = function(){ resolve(result); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function getAllEntries(){
    return withStore("readonly", function(store){
      return new Promise(function(resolve, reject){
        var req = store.getAll();
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    }).then(function(p){ return p; });
  }

  function putEntry(entry){
    return withStore("readwrite", function(store){ store.put(entry); });
  }

  function deleteEntry(id){
    return withStore("readwrite", function(store){ store.delete(id); });
  }

  var AUTH_KEY = "phrasebook_auth_v1";
  var cryptoKey = null;

  function randBytes(n){ return crypto.getRandomValues(new Uint8Array(n)); }

  function bufToB64(buf){
    var bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    var bin = "";
    for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function b64ToBytes(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function deriveKey(password, salt){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(password), {name:"PBKDF2"}, false, ["deriveKey"]).then(function(baseKey){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:salt, iterations:150000, hash:"SHA-256"},
        baseKey,
        {name:"AES-GCM", length:256},
        false,
        ["encrypt","decrypt"]
      );
    });
  }

  function encryptText(text){
    var iv = randBytes(12);
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, cryptoKey, new TextEncoder().encode(text)).then(function(cipher){
      return {iv:iv, cipher:new Uint8Array(cipher)};
    });
  }

  function decryptText(iv, cipher){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, cryptoKey, cipher).then(function(plain){
      return new TextDecoder().decode(plain);
    });
  }

  function encryptBuffer(buf){
    var iv = randBytes(12);
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, cryptoKey, buf).then(function(cipher){
      return {iv:iv, cipher:new Uint8Array(cipher)};
    });
  }

  function decryptBuffer(iv, cipher){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, cryptoKey, cipher);
  }

  function getAuthRecord(){
    var raw = localStorage.getItem(AUTH_KEY);
    return raw ? JSON.parse(raw) : null;
  }

  function setupPassword(password){
    var salt = randBytes(16);
    return deriveKey(password, salt).then(function(key){
      cryptoKey = key;
      return encryptText("phrasebook-ok");
    }).then(function(v){
      localStorage.setItem(AUTH_KEY, JSON.stringify({
        salt: bufToB64(salt),
        iv: bufToB64(v.iv),
        cipher: bufToB64(v.cipher)
      }));
    });
  }

  function tryLogin(password){
    var rec = getAuthRecord();
    var salt = b64ToBytes(rec.salt);
    return deriveKey(password, salt).then(function(key){
      var prevKey = cryptoKey;
      cryptoKey = key;
      return decryptText(b64ToBytes(rec.iv), b64ToBytes(rec.cipher)).then(function(plain){
        if(plain === "phrasebook-ok") return true;
        cryptoKey = prevKey;
        return false;
      }).catch(function(){
        cryptoKey = prevKey;
        return false;
      });
    });
  }

  // ---- reusable audio recorder component ----

  function createRecorder(labelText){
    var root = document.createElement("div");
    root.className = "recorder";
    root.innerHTML =
      '<div class="rec-label"></div>' +
      '<button class="rec-btn" type="button">' +
        '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a1 1 0 0 0-2 0 3 3 0 0 1-6 0 1 1 0 0 0-2 0 5 5 0 0 0 4 4.9V18H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.1A5 5 0 0 0 17 11z"/></svg>' +
      '</button>' +
      '<div class="rec-timer">Tap to record</div>' +
      '<div class="rec-preview">' +
        '<audio controls></audio>' +
        '<button class="rec-redo" type="button">Re-record</button>' +
      '</div>' +
      '<div class="rec-error"></div>';

    root.querySelector(".rec-label").textContent = labelText;
    var btn = root.querySelector(".rec-btn");
    var timer = root.querySelector(".rec-timer");
    var preview = root.querySelector(".rec-preview");
    var audioEl = root.querySelector("audio");
    var redoBtn = root.querySelector(".rec-redo");
    var errorEl = root.querySelector(".rec-error");

    var state = {
      mediaRecorder:null,
      chunks:[],
      blob:null,
      stream:null,
      startedAt:0,
      timerInterval:null
    };

    var changeHandler = null;

    function fireChange(){
      if(changeHandler) changeHandler();
    }

    function showError(msg){
      errorEl.textContent = msg;
      errorEl.style.display = "block";
    }

    function formatTime(ms){
      var s = Math.floor(ms/1000);
      var mm = Math.floor(s/60);
      var ss = s % 60;
      return (mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
    }

    function startTimer(){
      state.startedAt = new Date().getTime();
      state.timerInterval = setInterval(function(){
        timer.textContent = formatTime(new Date().getTime() - state.startedAt);
      }, 200);
    }

    function stopTimer(){
      clearInterval(state.timerInterval);
    }

    function showBlob(blob){
      state.blob = blob;
      audioEl.src = URL.createObjectURL(blob);
      preview.classList.add("show");
      btn.style.display = "none";
      timer.textContent = "";
    }

    function reset(){
      state.blob = null;
      btn.style.display = "flex";
      preview.classList.remove("show");
      audioEl.removeAttribute("src");
      timer.textContent = "Tap to record";
      errorEl.style.display = "none";
    }

    function startRecording(){
      errorEl.style.display = "none";
      navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
        state.stream = stream;
        state.chunks = [];
        var mr = new MediaRecorder(stream);
        state.mediaRecorder = mr;
        mr.ondataavailable = function(e){
          if(e.data && e.data.size > 0) state.chunks.push(e.data);
        };
        mr.onstop = function(){
          showBlob(new Blob(state.chunks, {type: mr.mimeType || "audio/webm"}));
          stream.getTracks().forEach(function(t){ t.stop(); });
          fireChange();
        };
        mr.start();
        btn.classList.add("recording");
        startTimer();
      }).catch(function(){
        showError("Microphone access denied or unavailable.");
      });
    }

    function stopRecording(){
      if(state.mediaRecorder && state.mediaRecorder.state !== "inactive"){
        state.mediaRecorder.stop();
      }
      btn.classList.remove("recording");
      stopTimer();
    }

    btn.addEventListener("click", function(){
      if(btn.classList.contains("recording")){
        stopRecording();
      } else {
        startRecording();
      }
    });

    redoBtn.addEventListener("click", function(){
      reset();
      fireChange();
    });

    return {
      el: root,
      getBlob: function(){ return state.blob; },
      setBlob: showBlob,
      reset: reset,
      onChange: function(fn){ changeHandler = fn; }
    };
  }

  // ---- new-phrase form ----

  var enInput = document.getElementById("en-input");
  var zhInput = document.getElementById("zh-input");
  var pinyinInput = document.getElementById("pinyin-input");
  var saveBtn = document.getElementById("save-btn");
  var listEl = document.getElementById("list");

  var newRecorderContainer = document.getElementById("new-recorders");
  var newRec1 = createRecorder("Chinese audio 1");
  var newRec2 = createRecorder("Chinese audio 2");
  newRecorderContainer.appendChild(newRec1.el);
  newRecorderContainer.appendChild(newRec2.el);

  function updateSaveState(){
    var hasText = enInput.value.trim() !== "" || zhInput.value.trim() !== "" || pinyinInput.value.trim() !== "";
    var hasAudio = !!newRec1.getBlob() || !!newRec2.getBlob();
    saveBtn.disabled = !(hasText || hasAudio);
  }

  newRec1.onChange(updateSaveState);
  newRec2.onChange(updateSaveState);

  enInput.addEventListener("input", updateSaveState);
  zhInput.addEventListener("input", updateSaveState);
  pinyinInput.addEventListener("input", updateSaveState);

  function makeId(){
    return "p_" + new Date().getTime().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  // ---- encrypt/decrypt an entry (shared by create + edit) ----

  function buildStoredEntry(id, createdAt, enText, zhText, pinyinText, blob1, blob2){
    var payload = JSON.stringify({en:enText, zh:zhText, pinyin:pinyinText});
    return encryptText(payload).then(function(textEnc){
      var step1 = blob1 ? blob1.arrayBuffer().then(encryptBuffer) : Promise.resolve(null);
      return step1.then(function(enc1){
        var step2 = blob2 ? blob2.arrayBuffer().then(encryptBuffer) : Promise.resolve(null);
        return step2.then(function(enc2){
          return {
            id: id,
            createdAt: createdAt,
            textIv: textEnc.iv,
            textCipher: textEnc.cipher,
            audio1Iv: enc1 ? enc1.iv : null,
            audio1Cipher: enc1 ? enc1.cipher : null,
            audio1Type: blob1 ? blob1.type : null,
            audio2Iv: enc2 ? enc2.iv : null,
            audio2Cipher: enc2 ? enc2.cipher : null,
            audio2Type: blob2 ? blob2.type : null
          };
        });
      });
    });
  }

  function decryptAudioSlot(iv, cipher, type){
    if(!cipher) return Promise.resolve(null);
    return decryptBuffer(iv, cipher).then(function(buf){
      return new Blob([buf], {type: type || "audio/webm"});
    });
  }

  function decryptEntry(entry){
    return decryptText(entry.textIv, entry.textCipher).then(function(json){
      var data = JSON.parse(json);
      return Promise.all([
        decryptAudioSlot(entry.audio1Iv, entry.audio1Cipher, entry.audio1Type),
        decryptAudioSlot(entry.audio2Iv, entry.audio2Cipher, entry.audio2Type)
      ]).then(function(blobs){
        return {
          id: entry.id,
          createdAt: entry.createdAt,
          en: data.en,
          zh: data.zh,
          pinyin: data.pinyin,
          audio1: blobs[0],
          audio2: blobs[1]
        };
      });
    });
  }

  function checkEmpty(){
    if(!listEl.children.length){
      listEl.innerHTML = '<div class="empty">No phrases saved yet. Add your first one above.</div>';
    } else {
      var emptyMsg = listEl.querySelector(".empty");
      if(emptyMsg) emptyMsg.remove();
    }
  }

  function makeTextField(labelText, placeholder, value, langAttr){
    var wrap = document.createElement("div");
    wrap.className = "field";
    var label = document.createElement("label");
    label.textContent = labelText;
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = placeholder;
    input.value = value || "";
    if(langAttr) input.lang = langAttr;
    wrap.appendChild(label);
    wrap.appendChild(input);
    return {wrap:wrap, input:input};
  }

  // ---- rendering a saved entry, with inline edit mode ----

  function renderEntry(entry){
    var data = entry;

    var el = document.createElement("div");
    el.className = "entry";
    el.dataset.id = data.id;

    var viewEl = document.createElement("div");
    viewEl.className = "entry-view";
    var editEl = document.createElement("div");
    editEl.className = "entry-edit";
    el.appendChild(viewEl);
    el.appendChild(editEl);

    listEl.insertBefore(el, listEl.firstChild);

    function paintView(){
      viewEl.innerHTML = "";

      var actions = document.createElement("div");
      actions.className = "entry-actions";

      var editBtn = document.createElement("button");
      editBtn.className = "icon-btn edit-btn";
      editBtn.type = "button";
      editBtn.title = "Edit";
      editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 20h4.4l10.4-10.4-4.4-4.4L4 15.6V20zm2-3.8L15.4 6.6l1.8 1.8L7.8 18H6v-1.8zM19.7 5.3l-2-2a1 1 0 0 0-1.4 0L15 4.6l3.4 3.4 1.3-1.3a1 1 0 0 0 0-1.4z"/></svg>';
      editBtn.addEventListener("click", openEdit);

      var delBtn = document.createElement("button");
      delBtn.className = "icon-btn delete-btn";
      delBtn.type = "button";
      delBtn.title = "Delete";
      delBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7zm3-3h6l1 2H8l1-2zM9 10v7m6-7v7"/></svg>';
      delBtn.addEventListener("click", function(){
        deleteEntry(data.id).then(function(){ el.remove(); checkEmpty(); });
      });

      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      viewEl.appendChild(actions);

      if(data.en){
        var enP = document.createElement("p");
        enP.className = "en";
        enP.textContent = data.en;
        viewEl.appendChild(enP);
      }
      if(data.zh){
        var zhP = document.createElement("p");
        zhP.className = "zh";
        zhP.textContent = data.zh;
        viewEl.appendChild(zhP);
      }
      if(data.pinyin){
        var pinyinP = document.createElement("p");
        pinyinP.className = "pinyin";
        pinyinP.textContent = data.pinyin;
        viewEl.appendChild(pinyinP);
      }

      var audios = document.createElement("div");
      audios.className = "audios";
      [data.audio1, data.audio2].forEach(function(blob, i){
        if(!blob) return;
        var chip = document.createElement("div");
        chip.className = "audio-chip";
        chip.innerHTML = '<span class="tag">中' + (i+1) + '</span>';
        var a = document.createElement("audio");
        a.controls = true;
        a.src = URL.createObjectURL(blob);
        chip.appendChild(a);
        audios.appendChild(chip);
      });
      if(audios.children.length) viewEl.appendChild(audios);
    }

    // build the edit form once; re-populated each time it is opened
    var enField = makeTextField("English phrase", "e.g. How are you today?", data.en);
    var zhField = makeTextField("Chinese phrase (Traditional)", "e.g. 你今天好嗎？", data.zh, "zh-Hant");
    var pyField = makeTextField("Pinyin (how to say it)", "e.g. Nǐ jīntiān hǎo ma?", data.pinyin);

    editEl.appendChild(enField.wrap);
    editEl.appendChild(zhField.wrap);
    editEl.appendChild(pyField.wrap);

    var editRecorders = document.createElement("div");
    editRecorders.className = "recorders";
    var er1 = createRecorder("Chinese audio 1");
    var er2 = createRecorder("Chinese audio 2");
    editRecorders.appendChild(er1.el);
    editRecorders.appendChild(er2.el);
    editEl.appendChild(editRecorders);

    var actionsRow = document.createElement("div");
    actionsRow.className = "entry-edit-actions";
    var cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel-btn";
    cancelBtn.type = "button";
    cancelBtn.textContent = "Cancel";
    var saveEditBtn = document.createElement("button");
    saveEditBtn.className = "save-btn";
    saveEditBtn.type = "button";
    saveEditBtn.textContent = "Save changes";
    actionsRow.appendChild(cancelBtn);
    actionsRow.appendChild(saveEditBtn);
    editEl.appendChild(actionsRow);

    function openEdit(){
      enField.input.value = data.en || "";
      zhField.input.value = data.zh || "";
      pyField.input.value = data.pinyin || "";
      er1.reset();
      er2.reset();
      if(data.audio1) er1.setBlob(data.audio1);
      if(data.audio2) er2.setBlob(data.audio2);
      saveEditBtn.disabled = false;
      el.classList.add("editing");
    }

    cancelBtn.addEventListener("click", function(){
      el.classList.remove("editing");
    });

    saveEditBtn.addEventListener("click", function(){
      saveEditBtn.disabled = true;
      var newEn = enField.input.value.trim();
      var newZh = zhField.input.value.trim();
      var newPinyin = pyField.input.value.trim();
      var blob1 = er1.getBlob();
      var blob2 = er2.getBlob();

      buildStoredEntry(data.id, data.createdAt, newEn, newZh, newPinyin, blob1, blob2).then(function(stored){
        return putEntry(stored);
      }).then(function(){
        data.en = newEn;
        data.zh = newZh;
        data.pinyin = newPinyin;
        data.audio1 = blob1;
        data.audio2 = blob2;
        paintView();
        el.classList.remove("editing");
      }).catch(function(e){
        console.error("Failed to update phrase:", e);
        saveEditBtn.disabled = false;
      });
    });

    paintView();
  }

  saveBtn.addEventListener("click", function(){
    saveBtn.disabled = true;
    var enText = enInput.value.trim();
    var zhText = zhInput.value.trim();
    var pinyinText = pinyinInput.value.trim();
    var blob1 = newRec1.getBlob();
    var blob2 = newRec2.getBlob();
    var id = makeId();
    var createdAt = new Date().getTime();

    buildStoredEntry(id, createdAt, enText, zhText, pinyinText, blob1, blob2).then(function(stored){
      return putEntry(stored);
    }).then(function(){
      var emptyMsg = listEl.querySelector(".empty");
      if(emptyMsg) emptyMsg.remove();
      renderEntry({
        id: id,
        createdAt: createdAt,
        en: enText,
        zh: zhText,
        pinyin: pinyinText,
        audio1: blob1,
        audio2: blob2
      });

      enInput.value = "";
      zhInput.value = "";
      pinyinInput.value = "";
      newRec1.reset();
      newRec2.reset();
      updateSaveState();
    }).catch(function(e){
      console.error("Failed to save phrase:", e);
      saveBtn.disabled = false;
    });
  });

  function initApp(){
    getAllEntries().then(function(entries){
      entries.sort(function(a,b){ return a.createdAt - b.createdAt; });
      return Promise.all(entries.map(decryptEntry));
    }).then(function(plainEntries){
      plainEntries.forEach(renderEntry);
      checkEmpty();
    }).catch(function(e){
      console.error("Failed to load saved phrases:", e);
      listEl.innerHTML = '<div class="empty">Could not load saved phrases.</div>';
    });
  }

  var gateTitle = document.getElementById("gate-title");
  var gateSub = document.getElementById("gate-sub");
  var gateForm = document.getElementById("gate-form");
  var gatePw = document.getElementById("gate-pw");
  var gatePw2 = document.getElementById("gate-pw2");
  var gateSubmit = document.getElementById("gate-submit");
  var gateError = document.getElementById("gate-error");
  var lockBtn = document.getElementById("lock-btn");

  var isSetupMode = !getAuthRecord();

  if(!isSetupMode){
    gateTitle.textContent = "Enter password";
    gateSub.textContent = "Unlock your saved phrases.";
    gatePw2.style.display = "none";
    gateSubmit.textContent = "Unlock";
  }

  function unlock(){
    document.body.classList.add("unlocked");
    initApp();
  }

  gateForm.addEventListener("submit", function(e){
    e.preventDefault();
    gateError.textContent = "";
    var pw = gatePw.value;
    if(!pw){
      gateError.textContent = "Enter a password.";
      return;
    }
    gateSubmit.disabled = true;

    if(isSetupMode){
      var pw2 = gatePw2.value;
      if(pw !== pw2){
        gateError.textContent = "Passwords do not match.";
        gateSubmit.disabled = false;
        return;
      }
      if(pw.length < 4){
        gateError.textContent = "Use at least 4 characters.";
        gateSubmit.disabled = false;
        return;
      }
      setupPassword(pw).then(unlock);
    } else {
      tryLogin(pw).then(function(ok){
        if(ok){
          unlock();
        } else {
          gateError.textContent = "Incorrect password.";
          gatePw.value = "";
          gatePw.focus();
          gateSubmit.disabled = false;
        }
      });
    }
  });

  lockBtn.addEventListener("click", function(){
    location.reload();
  });

  gatePw.focus();

})();
</script>

</body>
</html>
