@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
a:focus-visible,button:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}

.main{padding-top:0;position:relative;z-index:1}

/* Hero */
.empty-pane{display:grid;grid-template-columns:1fr 440px;gap:3rem;align-items:center;max-width:1080px;margin:0 auto;padding:3.5rem 2rem 2.5rem;color:var(--muted);animation:fadeUp .55s cubic-bezier(.16,1,.3,1) backwards}
.hero-text{text-align:left;min-width:0}
.empty-pane-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);background:var(--sky-light);padding:.3rem .9rem;border-radius:6px;margin-bottom:1rem}
.empty-pane h2{font-family:'Outfit',sans-serif;font-size:2rem;font-weight:900;color:var(--ink);margin-bottom:.6rem;letter-spacing:-.01em}
.empty-pane h2 em{font-style:italic;color:var(--sky);position:relative}
.empty-pane h2 em::after{content:'';position:absolute;bottom:2px;left:-3px;right:-3px;height:8px;background:var(--sun);opacity:.4;border-radius:4px;z-index:-1}
.empty-pane p.lede{font-size:.92rem;max-width:420px;line-height:1.6;margin-bottom:1.4rem}
.hero-image{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-md);border:1.5px solid var(--border);aspect-ratio:1280/730}
.hero-image img{width:100%;height:100%;object-fit:cover;display:block}

/* Search */
.searchwrap{position:relative;max-width:460px}
.searchbox{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.7rem 1rem;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.searchbox:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-light)}
.searchbox svg.sicon{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:2;flex-shrink:0}
.searchbox input{flex:1;border:none;outline:none;background:none;font-family:'Outfit',sans-serif;font-size:1rem;color:var(--ink);min-width:0}
.searchbox input::placeholder{color:var(--muted)}
.sclear{border:none;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:.1rem .3rem;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s}
.sclear:hover{background:var(--cream);color:var(--ink)}
.searchbox.has-val .sclear{opacity:1;pointer-events:auto}
.schips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.schip{font-size:.72rem;font-weight:600;color:var(--muted);background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:.28rem .7rem;cursor:pointer;transition:all .15s;font-family:'Outfit',sans-serif}
.schip:hover{border-color:var(--sky);color:var(--sky)}

.results{position:absolute;top:calc(100% + .5rem);left:0;right:0;background:var(--card);border:1.5px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);max-height:min(60vh,420px);overflow-y:auto;z-index:50;display:none;padding:.35rem}
.results.open{display:block;animation:fadeUp .12s ease}
.ritem{display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;border-radius:9px;text-decoration:none;color:var(--ink);cursor:pointer}
.ritem:hover,.ritem.active{background:var(--sky-light)}
.ritem .rmain{flex:1;min-width:0}
.ritem .rlabel{font-size:.9rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .rsub{font-size:.74rem;color:var(--muted);margin-top:.05rem}
.rpill{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.2rem .5rem;border-radius:5px;flex-shrink:0}
.rpill.tool{background:var(--sky-light);color:var(--sky)}
.rpill.topic{background:var(--sea-light);color:#0FA085}
.rpill.item{background:var(--lavender-light);color:#7A54B0}
.rempty{padding:1rem .8rem;font-size:.85rem;color:var(--muted);text-align:center}
.rhead{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:.55rem .7rem .3rem}

/* footband + footer */
.footband{max-width:800px;margin:1.6rem auto 0;padding:1.6rem 2rem;border-top:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem;flex-wrap:wrap}
.footband-left{display:flex;flex-direction:column}
.bio-row{display:flex;align-items:flex-start;gap:.9rem}
.bio-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1.5px solid var(--border);box-shadow:var(--shadow-sm);flex-shrink:0}
.footband-contact{display:flex;gap:.6rem;flex-wrap:wrap;flex-shrink:0}
.contact-chip{display:inline-flex;align-items:center;gap:.5rem;font-size:.82rem;font-weight:600;color:var(--ink);text-decoration:none;padding:.55rem 1rem;border:1.5px solid var(--border);border-radius:10px;background:var(--card);transition:all .2s}

footer{text-align:center;padding:2.5rem 2rem;font-size:.8rem;color:var(--muted);border-top:1.5px solid var(--border);max-width:800px;margin:2rem auto 0;position:relative;z-index:1}

  .empty-pane{grid-template-columns:1fr;padding:2.8rem 1.5rem 1.5rem;gap:1.8rem}

  .searchwrap{max-width:none}

@media(max-width:700px){
  .footband{padding:1.3rem 1.2rem;flex-direction:column;align-items:flex-start}

body{overflow-x:hidden}

(function(){
  var input=document.getElementById('sInput'), box=document.getElementById('sBox'),
      panel=document.getElementById('sResults'), clearBtn=document.getElementById('sClear'),
      chips=document.getElementById('sChips');
  var active=-1, rows=[];

  // precompute lowercase haystacks
  SIDX.forEach(function(e){ e[5]=(e[0]+' '+e[3]).toLowerCase(); });
  ITEMS.forEach(function(it){ it[2]=it[0].toLowerCase(); });

  function esc(s){ return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function search(q){
    q=q.trim().toLowerCase();
    if(!q) return [];
    var toks=q.split(/\s+/);
    // word-prefix regexes: a token matches a word that STARTS with it (so "ai"
    // matches the word "ai" / "aid" but not "complaining"). Avoids junk hits
    // from short tokens landing inside longer words.
    var res=toks.map(function(t){ return new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); });
    var out=[];
    var wbz=toks.map(function(t){ return new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'); });
    function scoreHay(hay,label){
      var s=0;
      if(label.indexOf(q)===0) s+=1000; else if(label.indexOf(q)!==-1) s+=300;
      for(var i=0;i<wbz.length;i++){ if(wbz[i].test(hay)) s+=20; }
      return s;
    }
    SIDX.forEach(function(e){
      var hay=e[5];
      for(var i=0;i<res.length;i++){ if(!res[i].test(hay)) return; }
      out.push([scoreHay(hay, e[0].toLowerCase()) + (e[4]==='topic'?3:0), e]);
    });
    // vocab items (phrasal verbs, idioms, collocations, adjectives) → land on the
    // page pre-filtered via ?find=
    ITEMS.forEach(function(it){
      var hw=it[2];
      for(var i=0;i<res.length;i++){ if(!res[i].test(hw)) return; }
      var t=TOOLS[it[1]];
      out.push([scoreHay(hw, hw), [it[0], t[0], t[1]+'?find='+encodeURIComponent(it[0]), '', 'item']]);
    });
    out.sort(function(a,b){ return b[0]-a[0] || a[1][0].localeCompare(b[1][0]); });
    return out.slice(0,10).map(function(x){return x[1];});
  }

  function render(list){
    rows=list; active=-1;
    if(!list.length){
      panel.innerHTML='<div class="rempty">No matches. Try a topic (travel, money), a tool (idioms), or an exam (IELTS).</div>';
      open(true); return;
    }
    var html='';
    list.forEach(function(e,i){
      html+='<a class="ritem" role="option" href="'+e[2]+'" data-i="'+i+'">'+
              '<div class="rmain"><div class="rlabel">'+esc(e[0])+'</div><div class="rsub">'+esc(e[1])+'</div></div>'+
              '<span class="rpill '+e[4]+'">'+(e[4]==='topic'?'Topic':e[4]==='item'?'Term':'Tool')+'</span>'+
            '</a>';
    });
    panel.innerHTML=html;
    open(true);
  }

  function open(o){ panel.classList.toggle('open',o); input.setAttribute('aria-expanded',o?'true':'false'); }
  function setActive(n){
    var items=panel.querySelectorAll('.ritem');
    items.forEach(function(el){el.classList.remove('active');});
    if(n>=0 && n<items.length){ items[n].classList.add('active'); items[n].scrollIntoView({block:'nearest'}); active=n; }
    else active=-1;
  }

  function onInput(){
    var v=input.value;
    box.classList.toggle('has-val', !!v);
    if(!v.trim()){ open(false); return; }
    render(search(v));
  }

  input.addEventListener('input', onInput);
  input.addEventListener('focus', function(){ if(input.value.trim()) render(search(input.value)); });
  input.addEventListener('keydown', function(e){
    var items=panel.querySelectorAll('.ritem');
    if(e.key==='ArrowDown'){ e.preventDefault(); setActive(Math.min(active+1,items.length-1)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setActive(Math.max(active-1,-1)); }
    else if(e.key==='Enter'){ if(active>=0 && rows[active]){ window.top.location.href=rows[active][2]; } }
    else if(e.key==='Escape'){ input.value=''; box.classList.remove('has-val'); open(false); }
  });
  clearBtn.addEventListener('click', function(){ input.value=''; box.classList.remove('has-val'); open(false); input.focus(); });
  chips.addEventListener('click', function(e){
    var c=e.target.closest('.schip'); if(!c) return;
    input.value=c.dataset.q; box.classList.add('has-val'); render(search(c.dataset.q)); input.focus();
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('.searchwrap')) open(false);
  });
})();
