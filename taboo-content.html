<!DOCTYPE html>
<html lang="en">

<base target="_top">

<title>Taboo Cards · John+English</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sun:#FFB347;--sky:#2176FF;--sky-light:#E8EEFF;
  --sea:#1DD3B0;--sea-light:#E4FBF7;
  --coral:#FF6B6B;--coral-light:#FFE8E8;
  --lavender:#9B72CF;--lavender-light:#F0E8FA;
  --mint:#5DDEA0;--sand:#FFF5E6;
  --cream:#F7F6F3;--ink:#2D3047;--muted:#7A7D8E;
  --border:#E8E5DF;--card:#fff;--radius:14px;
  --shadow-sm:0 1px 3px rgba(45,48,71,.06);
  --shadow-md:0 4px 12px rgba(45,48,71,.08);
  --shadow-lg:0 8px 32px rgba(45,48,71,.12)
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}

/* NAV */
.topnav{position:fixed;top:0;left:0;right:0;height:52px;z-index:200;background:rgba(247,246,243,.88);backdrop-filter:blur(16px);border-bottom:1.5px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.nav-logo span{color:#2563EB}
.topnav-links{display:flex;gap:1.2rem;align-items:center}
.topnav-links a{font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s}
.topnav-links a:hover{color:var(--sky)}

/* BACK + HERO */
.page-header{padding:2rem 2rem 1rem;max-width:900px;margin:0 auto;position:relative;z-index:1}
.topic-hero{display:flex;align-items:flex-start;gap:1.2rem;justify-content:flex-start;text-align:left}
.topic-icon{width:52px;height:52px;border-radius:12px;background:color-mix(in srgb, #2D3047 8%, #fff);color:#2D3047;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topic-icon svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor}
.page-header h1{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;letter-spacing:-.01em;font-weight:900}

/* CONTROLS BAR */
.controls-bar{position:sticky;top:52px;z-index:100;background:rgba(247,246,243,.95);backdrop-filter:blur(12px);padding:.8rem 2rem;border-bottom:1px solid var(--border);margin-bottom:2rem}
.controls-inner{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;row-gap:.5rem}
.filter-group{display:flex;align-items:center;gap:.4rem;flex-wrap:nowrap}
.filter-divider{width:1px;height:20px;background:var(--border);margin:0 .3rem;flex-shrink:0}
.filter-label{font-family:Outfit,sans-serif;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-right:.2rem}
.filter-pill{font-family:'Outfit',sans-serif;font-size:.8rem;font-weight:600;padding:.35rem .8rem;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-pill:hover{border-color:var(--ink);color:var(--ink)}
.filter-pill.active.level-b2{background:#2EC4B6;color:#fff;border-color:#2EC4B6}
.filter-pill.active.level-c1{background:var(--sky);color:#fff;border-color:var(--sky)}
.filter-pill.active.topic{background:var(--ink);color:#fff;border-color:var(--ink)}
.card-count{font-family:Outfit,sans-serif;font-size:.68rem;color:var(--muted);font-weight:500}

/* MAIN AREA */
.main{max-width:860px;margin:0 auto;padding:0 2rem 4rem;position:relative;z-index:1}

/* TABOO CARD */
.card-wrap{display:flex;justify-content:center;margin-bottom:2rem}
.taboo-card{width:100%;max-width:480px;background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);border:2px solid var(--border);overflow:hidden;position:relative}
.card-header{padding:.7rem 1.2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--border)}
.card-level{font-family:Outfit,sans-serif;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:.2rem .55rem;border-radius:6px}
.card-level.b2{background:#2EC4B626;color:#2EC4B6}
.card-level.c1{background:var(--sky-light);color:var(--sky)}
.card-topic{font-family:Outfit,sans-serif;font-size:.6rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card-num{font-family:Outfit,sans-serif;font-size:.6rem;color:var(--muted)}

.card-target-wrap{background:#2EC4B6;padding:2rem 2rem 1.8rem;text-align:center}
.card-target-label{font-family:Outfit,sans-serif;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.65);margin-bottom:.6rem}
.card-target{font-family:'Outfit',sans-serif;font-size:2.8rem;font-weight:900;color:#fff;line-height:1.1;letter-spacing:-.02em}
.taboo-card.c1 .card-target-wrap{background:var(--sky)}

.card-taboo{padding:1.4rem 1.6rem 1.6rem}
.taboo-label{font-family:Outfit,sans-serif;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--coral);margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem}
.taboo-label::before{content:'';display:block;width:10px;height:10px;background:var(--coral);border-radius:2px;flex-shrink:0}
.taboo-list{list-style:none;display:flex;flex-direction:column;gap:.4rem}
.taboo-word{font-family:'Outfit',sans-serif;font-size:1.15rem;font-weight:700;color:var(--ink);padding:.45rem .8rem;background:var(--coral-light);border-radius:8px;border-left:3px solid var(--coral)}

/* TIMER */
.timer-section{max-width:800px;margin:.8rem auto 1.5rem}
.timer-progress{width:100%;height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:.6rem}
.timer-progress-fill{height:100%;background:var(--sea);border-radius:3px;transition:width .3s linear;width:0%}
.timer-progress-fill.warn{background:var(--coral)}
.timer-controls{display:flex;align-items:center;justify-content:center}
.timer-btn-wrap{display:inline-flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)}
.timer-btn{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;padding:.55rem 1.2rem;border:none;background:var(--card);color:var(--ink);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.5rem;min-width:96px;justify-content:center}
.timer-btn:hover{background:var(--cream)}
.timer-btn-icon{font-size:.8em;line-height:1}
.timer-btn .timer-btn-time{font-family:'JetBrains Mono',monospace}
.timer-btn.running{color:var(--sea)}
.timer-btn.paused{color:var(--sun)}
.timer-btn.warn,.timer-btn.done{color:var(--coral)}
.timer-edit-btn{font-family:'Outfit',sans-serif;padding:.55rem .8rem;border:none;border-left:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center}
.timer-edit-btn:hover{color:var(--ink);background:var(--cream)}
.timer-duration-edit{display:none;align-items:baseline;gap:.3rem;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;padding:.5rem .8rem;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
.timer-duration-input{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;border:none;background:transparent;color:var(--ink);width:4.2ch;text-align:center;outline:none;padding:0}

/* ACTION BUTTONS */
.action-row{display:flex;gap:.8rem;justify-content:center;margin-bottom:1rem;flex-wrap:wrap}
.btn{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;padding:.65rem 1.6rem;border-radius:12px;border:none;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:.45rem}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn-correct{background:#22c55e;color:#fff;box-shadow:0 4px 14px rgba(34,197,94,.3)}
.btn-correct:hover{background:#16a34a;transform:translateY(-1px)}
.btn-pass{background:var(--card);color:var(--muted);border:1.5px solid var(--border)}
.btn-pass:hover{border-color:var(--coral);color:var(--coral)}
.btn-start{background:var(--sky);color:#fff;box-shadow:0 4px 14px rgba(33,118,255,.3);font-size:1rem;padding:.75rem 2.2rem}
.btn-start:hover{background:#1a5fd4;transform:translateY(-1px)}
.btn-reset{background:var(--card);color:var(--muted);border:1.5px solid var(--border);font-size:.82rem;padding:.45rem 1rem}
.btn-reset:hover{border-color:var(--ink);color:var(--ink)}

/* PASS COUNTER */
.pass-row{display:flex;justify-content:center;gap:.35rem;margin-bottom:1.2rem}
.pass-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background .2s}
.pass-dot.used{background:var(--coral)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:4rem 2rem;color:var(--muted)}
.empty-state h3{font-size:1.1rem;font-weight:700;color:var(--ink);margin-bottom:.5rem}
.empty-state p{font-size:.9rem}

/* END CARD */
.end-card{background:var(--card);border-radius:20px;border:2px solid var(--border);padding:3rem 2rem;text-align:center;box-shadow:var(--shadow-md);max-width:480px;margin:0 auto}
.end-card h2{font-size:1.8rem;font-weight:900;color:var(--ink);margin-bottom:.5rem}
.end-card p{color:var(--muted);margin-bottom:1.5rem;font-size:.95rem}

@media(max-width:600px){
  .topnav{padding:0 1.2rem}
  .page-header,.main{padding-left:1.2rem;padding-right:1.2rem}
  .controls-bar{padding:.8rem 1.2rem}
  .card-target{font-size:2.2rem}
  .taboo-word{font-size:1rem}
  .btn{font-size:.88rem;padding:.6rem 1.2rem}
}
.back-pill{display:inline-flex;align-items:center;gap:.4rem;font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:.5rem 1.1rem .5rem .85rem;cursor:pointer;transition:all .18s;margin-bottom:1.2rem;box-shadow:var(--shadow-sm)}
.back-pill:hover{color:var(--sky);border-color:var(--sky);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.back-pill svg{width:13px;height:13px;flex-shrink:0}
</style>
<style>.topnav{display:none!important}</style></head>

var TOPICS = ['All'];
CARDS.forEach(function(c){ if (TOPICS.indexOf(c.topic) === -1) TOPICS.push(c.topic); });
TOPICS.sort(function(a,b){ return a==='All'?-1:b==='All'?1:a.localeCompare(b); });

var activeLevels = {b2:true, c1:true};
var activeTopic = 'All';
var deck = [];
var currentIdx = 0;
var passes = 0;
var MAX_PASSES = 3;

function buildTopicFilters() {
  var el = document.getElementById('topicFilters');
  var html = '';
  TOPICS.forEach(function(t) {
    html += '<button class="filter-pill topic'+(t===activeTopic?' active':'')+'" onclick="setTopic(\''+t+'\',this)">'+t+'</button>';
  });
  el.innerHTML = html;
}

function toggleLevel(lv, btn) {
  activeLevels[lv] = !activeLevels[lv];
  if (!activeLevels.b2 && !activeLevels.c1) { activeLevels[lv] = true; return; }
  btn.classList.toggle('active', activeLevels[lv]);
  rebuildDeck();
}

function setTopic(t, btn) {
  activeTopic = t;
  document.querySelectorAll('.filter-pill.topic').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  rebuildDeck();
}

function getFilteredCards() {
  return CARDS.filter(function(c) {
    var lvOk = activeLevels[c.l];
    var tOk = activeTopic === 'All' || c.topic === activeTopic;
    return lvOk && tOk;
  });
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function rebuildDeck() {
  if (timerState['main']) timerSelectDuration('main', timerState['main'].defaultSecs);
  deck = shuffle(getFilteredCards().slice());
  currentIdx = 0;
  passes = 0;
  updatePassDots();
  renderCard();
  document.getElementById('cardCount').textContent = deck.length + ' cards';
}

function renderCard() {
  var wrap = document.getElementById('cardWrap');
  var actionRow = document.getElementById('actionRow');
  if (!deck.length) {
    wrap.innerHTML = '<div class="empty-state"><h3>No cards match that filter</h3><p>Try selecting a different level or topic.</p></div>';
    actionRow.style.display = 'none';
    return;
  }
  if (currentIdx >= deck.length) {
    wrap.innerHTML = '<div class="end-card"><h2>All done! 🎉</h2><p>You\'ve been through all '+deck.length+' cards in this set.</p><button class="btn btn-start" onclick="rebuildDeck()">Play again</button></div>';
    actionRow.style.display = 'none';
    if (timerState['main'] && timerState['main'].running) timerToggle('main');
    return;
  }
  actionRow.style.display = 'flex';
  var c = deck[currentIdx];
  var tabooHtml = c.t.map(function(w){ return '<li class="taboo-word">'+w+'</li>'; }).join('');
  wrap.innerHTML = '<div class="taboo-card '+c.l+'">'
    + '<div class="card-header">'
    + '<span class="card-level '+c.l+'">'+(c.l==='b2'?'B2':'C1')+'</span>'
    + '<span class="card-topic">'+c.topic+'</span>'
    + '<span class="card-num">'+(currentIdx+1)+' / '+deck.length+'</span>'
    + '</div>'
    + '<div class="card-target-wrap"><div class="card-target-label">Describe this word</div><div class="card-target">'+c.w+'</div></div>'
    + '<div class="card-taboo"><div class="taboo-label">Forbidden words</div><ul class="taboo-list">'+tabooHtml+'</ul></div>'
    + '</div>';
}

function nextCard() {
  currentIdx++;
  passes = 0;
  updatePassDots();
  renderCard();
}

function passCard() {
  if (passes >= MAX_PASSES) return;
  passes++;
  updatePassDots();
  // Move current card to later in deck
  var card = deck.splice(currentIdx, 1)[0];
  var insertAt = Math.min(currentIdx + 3 + Math.floor(Math.random()*3), deck.length);
  deck.splice(insertAt, 0, card);
  renderCard();
}

function updatePassDots() {
  for (var i = 0; i < MAX_PASSES; i++) {
    var dot = document.getElementById('p'+i);
    if (dot) dot.classList.toggle('used', i < passes);
  }
}

function resetDeck() {
  rebuildDeck();
}

// ===== Reusable timer widget (multi-instance: one button, m:ss typing, progress bar on top) =====
var timerState = {};
function timerFormatTime(totalSeconds){
  var m=Math.floor(totalSeconds/60), s=totalSeconds%60;
  return m+':'+(s<10?'0':'')+s;
}
function timerParseTime(str){
  var parts=String(str).trim().split(':');
  var m, s;
  if(parts.length>=2){ m=parseInt(parts[0],10); s=parseInt(parts[1],10); }
  else { m=parseInt(parts[0],10); s=0; }
  if(isNaN(m)) m=0;
  if(isNaN(s)||s<0||s>59) s=0;
  var total=m*60+s;
  if(!total || total<1) return null;
  return Math.min(total,5999);
}
function timerWidgetHTML(id, defaultSecs, locked){
  var editBits = locked ? '' :
    '<button class="timer-edit-btn" id="timerEditBtn-'+id+'" onclick="timerEditDuration(\''+id+'\')" title="Edit duration" aria-label="Edit timer duration"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'+
    '<span class="timer-duration-edit" id="timerDurationEdit-'+id+'"><input type="text" inputmode="numeric" class="timer-duration-input" id="timerDurationInput-'+id+'" placeholder="'+timerFormatTime(defaultSecs)+'" onblur="timerCommitDuration(\''+id+'\')" onkeydown="if(event.key===\'Enter\'){this.blur()}else if(event.key===\'Escape\'){timerCancelEdit(\''+id+'\')}"></span>';
  return ''+
    '<div class="timer-section">'+
      '<div class="timer-progress"><div class="timer-progress-fill" id="timerProgress-'+id+'"></div></div>'+
      '<div class="timer-controls">'+
        '<span class="timer-btn-wrap">'+
          '<button class="timer-btn" id="timerBtn-'+id+'" onclick="timerHandleClick(\''+id+'\')"><span class="timer-btn-icon" id="timerBtnIcon-'+id+'">&#9654;</span><span id="timerBtnLabel-'+id+'"></span></button>'+
          editBits+
        '</span>'+
      '</div>'+
    '</div>';
}
function timerInit(id, defaultSecs, locked){
  timerState[id] = {interval:null, seconds:defaultSecs, total:defaultSecs, running:false, paused:false, defaultSecs:defaultSecs, locked:!!locked};
  timerUpdateBtn(id);
}
function timerSelectDuration(id, secs){
  var st = timerState[id];
  clearInterval(st.interval); st.interval=null;
  st.running=false; st.paused=false;
  st.total=secs; st.seconds=secs;
  var prog = document.getElementById('timerProgress-'+id);
  prog.style.width='0%'; prog.className='timer-progress-fill';
  timerUpdateBtn(id);
}
function timerEditDuration(id){
  var st = timerState[id];
  if(st.locked) return;
  clearInterval(st.interval); st.interval=null; st.running=false; st.paused=false;
  var input=document.getElementById('timerDurationInput-'+id);
  input.value=timerFormatTime(st.defaultSecs);
  document.getElementById('timerBtn-'+id).style.display='none';
  document.getElementById('timerEditBtn-'+id).style.display='none';
  document.getElementById('timerDurationEdit-'+id).style.display='inline-flex';
  input.focus();
  input.select();
}
function timerCommitDuration(id){
  var st = timerState[id];
  if(st._canceling){ st._canceling=false; return; }
  var parsed=timerParseTime(document.getElementById('timerDurationInput-'+id).value);
  if(parsed) st.defaultSecs=parsed;
  document.getElementById('timerDurationEdit-'+id).style.display='none';
  document.getElementById('timerBtn-'+id).style.display='inline-flex';
  timerSelectDuration(id, st.defaultSecs);
}
function timerCancelEdit(id){
  var st = timerState[id];
  st._canceling=true;
  document.getElementById('timerDurationEdit-'+id).style.display='none';
  document.getElementById('timerBtn-'+id).style.display='inline-flex';
  timerUpdateBtn(id);
}
function timerHandleClick(id){
  var st = timerState[id];
  if(!st.running && !st.paused && st.seconds<=0 && st.total>0){ timerSelectDuration(id, st.defaultSecs); return; }
  timerToggle(id);
}
function timerToggle(id){
  var st = timerState[id];
  if(!st.total) return;
  if(!st.running && !st.paused){ st.running=true; timerTick(id); }
  else if(st.running){ clearInterval(st.interval); st.interval=null; st.running=false; st.paused=true; }
  else{ st.paused=false; st.running=true; timerTick(id); }
  timerUpdateBtn(id);
}
function timerTick(id){
  var st = timerState[id];
  var prog=document.getElementById('timerProgress-'+id);
  st.interval=setInterval(function(){
    st.seconds--;
    var pct=((st.total-st.seconds)/st.total)*100;
    prog.style.width=pct+'%';
    if(st.seconds<=10 && st.seconds>0){ prog.className='timer-progress-fill warn'; }
    if(st.seconds<=0){
      clearInterval(st.interval); st.interval=null; st.running=false;
      prog.style.width='100%'; prog.className='timer-progress-fill warn';
      setTimeout(function(){
        if(!st.running && !st.paused && st.seconds<=0){ timerSelectDuration(id, st.defaultSecs); }
      },2500);
    }
    timerUpdateBtn(id);
  },1000);
}
function timerUpdateBtn(id){
  var st = timerState[id];
  var btn=document.getElementById('timerBtn-'+id);
  var icon=document.getElementById('timerBtnIcon-'+id);
  var label=document.getElementById('timerBtnLabel-'+id);
  var editBtn=document.getElementById('timerEditBtn-'+id);
  if(editBtn) editBtn.style.display = st.locked ? 'none' : 'inline-flex';
  if(st.running){
    icon.innerHTML='&#9208;';
    label.innerHTML='<span class="timer-btn-time">'+timerFormatTime(st.seconds)+'</span>';
    btn.className='timer-btn running'+(st.seconds<=10?' warn':'');
  } else if(st.paused){
    icon.innerHTML='&#9654;';
    label.innerHTML='<span class="timer-btn-time">'+timerFormatTime(st.seconds)+'</span>';
    btn.className='timer-btn paused';
  } else if(st.seconds<=0 && st.total>0){
    icon.innerHTML='&#8635;';
    label.textContent='Done';
    btn.className='timer-btn done';
  } else {
    icon.innerHTML='&#9654;';
    label.innerHTML='<span class="timer-btn-time">'+timerFormatTime(st.defaultSecs)+'</span>';
    btn.className='timer-btn';
  }
}

// Init
document.getElementById('timerMount').innerHTML = timerWidgetHTML('main', 60, false);
timerInit('main', 60, false);
buildTopicFilters();
rebuildDeck();
