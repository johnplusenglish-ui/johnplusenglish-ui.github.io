<style>
:root{
  --sky:#2176FF;--sky-light:#E8EEFF;--sea:#1DD3B0;--sea-light:#E4FBF7;
  --coral:#FF6B6B;--coral-light:#FFE8E8;--lavender:#9B72CF;--lavender-light:#F0E8FA;
  --cream:#F7F6F3;--ink:#2D3047;--muted:#7A7D8E;--border:#E8E5DF;--card:#fff;
  --radius:14px;--radius-sm:10px;
  --shadow-sm:0 1px 3px rgba(45,48,71,.06);--shadow-md:0 4px 14px rgba(45,48,71,.08);
  --accent:#E9C46A;--accent-light:#FDF6E3;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}
.topnav{position:fixed;top:0;left:0;right:0;z-index:200;background:#fff;border-bottom:1.5px solid var(--border);height:52px;padding:0 2rem;display:flex;align-items:center;justify-content:flex-end}.topnav .nav-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}@media(max-width:520px){.topnav-links{display:none!important}}
.nav-logo{font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none;cursor:pointer;background:none;border:none;display:inline-flex;align-items:center;gap:.5rem}
.nav-logo .nav-logo-text{color:var(--ink)}
.nav-logo-text span{color:#2563EB}
.nav-logo-icon{width:22px;height:22px;stroke-width:1.9;color:var(--sky);flex-shrink:0}
.topnav-links{display:flex;gap:1.25rem;align-items:center}
.topnav-links a,.topnav-links button{font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s;background:none;border:none;cursor:pointer;font-family:'Outfit',sans-serif}
.topnav-links a:hover,.topnav-links button:hover{color:var(--sky)}
.sidebar-toggle{display:inline-flex;align-items:center;gap:.5rem;background:none;border:none;cursor:pointer;color:var(--ink);padding:.25rem;border-radius:8px;transition:background .15s}
.sidebar-toggle:hover{background:var(--border)}.sidebar-toggle:focus{outline:none}.sidebar-toggle:focus-visible{background:var(--border)}
.sidebar-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
@media(min-width:901px){
  .sidebar{transition:width .2s ease,padding .2s ease,border-color .2s ease}
  .sidebar.collapsed{width:0;min-width:0;padding-left:0;padding-right:0;border-right-color:transparent;overflow:hidden}
  .sidebar.collapsed .cat-group{opacity:0}.sidebar.collapsed~.sidebar-collapse-btn{left:14px;background:var(--sky);border-color:var(--sky);color:#fff;box-shadow:var(--shadow-md)}.sidebar.collapsed~.sidebar-collapse-btn svg{transform:rotate(180deg)}
}

/* ── App shell: sidebar + content pane ── */
.app-shell{display:flex;align-items:flex-start;padding-top:52px;min-height:100vh;position:relative;z-index:1}
.sidebar{width:300px;flex-shrink:0;height:calc(100vh - 52px);position:sticky;top:52px;overflow-y:auto;overflow-x:hidden;background:var(--card);border-right:1.5px solid var(--border);box-shadow:2px 0 12px rgba(45,48,71,.05);padding:3rem 1rem 3rem}
.sidebar>.cat-group,.sidebar>.list-card{min-width:268px}



.list-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:1rem}
.group-head{font-family:Outfit,sans-serif;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:.5rem 1rem;background:var(--cream);border-bottom:1.5px solid var(--border)}
.row{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;text-decoration:none;color:var(--ink);transition:background .12s,transform .12s ease;width:100%;background:none;border:none;border-left:3px solid transparent;cursor:pointer;font-family:'Outfit',sans-serif;text-align:left;line-height:1.6}

.row.avail:hover{background:var(--cream)}
.row.avail:active{background:var(--cream)}
.cat-toggle:active{background:var(--cream)}
.sidebar,.sidebar *{-webkit-tap-highlight-color:transparent}
.cat-toggle,.row,.sidebar-toggle,.sidebar-collapse-btn{touch-action:manipulation}
.row.active{background:var(--cream);transform:translateX(3px)}
.row.active .row-name{color:var(--catdot,var(--ink))}
.row.soon{opacity:.4;cursor:default}
.row-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-icon svg{width:15px;height:15px;stroke-width:1.8;fill:none;stroke:currentColor}
.row-text{flex:1;min-width:0}
.row-name{font-size:.85rem;font-weight:700;line-height:1.25;display:flex;align-items:center;gap:.5rem}
.sidebar .row-name::before{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--catdot,transparent);flex-shrink:0}
.row-desc{font-size:.68rem;color:var(--muted);font-weight:400;margin-top:.05rem;line-height:1.35}
.row-arr{font-size:.85rem;color:var(--muted);transition:transform .15s;flex-shrink:0}
.row.avail:hover .row-arr{transform:translateX(3px)}
.soon-tag{font-family:Outfit,sans-serif;font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--cream);border:1.5px solid var(--border);border-radius:5px;padding:.12rem .5rem;flex-shrink:0}
.sidebar-backdrop{display:none}

.content-pane{flex:1;min-width:0;position:relative;z-index:1}
.empty-pane{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7rem 2rem;color:var(--muted);min-height:60vh}
.empty-pane-badge{display:inline-flex;align-items:center;gap:.5rem;font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);background:var(--sky-light);padding:.25rem 1rem;border-radius:6px;margin-bottom:1rem}
.empty-pane h2{font-family:'Outfit',sans-serif;font-size:1.7rem;font-weight:900;color:var(--ink);margin-bottom:.5rem;letter-spacing:-.01em}
.empty-pane p{font-size:.92rem;max-width:360px;line-height:1.6}

/* ── Topic view (lives inside .content-pane) ── */
#view-topic{display:none;position:relative;z-index:1}
.page-header{padding:2rem 2rem 1rem;max-width:960px;margin:0 auto;position:relative;z-index:1}
.back-link{display:inline-flex;align-items:center;gap:.5rem;font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:1.25rem;transition:color .2s;background:none;border:none;cursor:pointer;font-family:'Outfit',sans-serif;padding:0}
.back-link:hover{color:var(--sky)}
.back-link svg{width:14px;height:14px;flex-shrink:0}
.topic-hero{display:flex;align-items:flex-start;gap:1.25rem}
.topic-icon{width:52px;height:52px;border-radius:12px;background:color-mix(in srgb, #2D3047 8%, #fff);color:#2D3047;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topic-icon svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor}
.page-header h1{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-.01em;line-height:1.1;margin-bottom:.5rem}
.tabs-wrap{max-width:960px;margin:0 auto;padding:0 2rem;position:relative;z-index:1}
/* ── Folder-style tabs ── see prepositions-content.html for the full history
   of why this shape (paint-order baseline occlusion, not border-color
   matching). Uses var(--accent), already set per-tool by JS, so every
   pop-out tool keeps its own accent automatically. */
.tabs{display:flex;gap:4px;row-gap:4px;border-bottom:none;position:relative;margin-bottom:1.5rem;align-items:flex-end;flex-wrap:wrap;padding-top:8px}
.tabs::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.tab{position:relative;font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:700;padding:.5rem 1.25rem;color:var(--muted);cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1.5px solid var(--border);border-radius:12px 12px 0 0;transition:background .18s,color .18s,box-shadow .18s,border-color .18s}
.tab:not(.active):hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.tab:not(.active):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab.active{outline:none}
.tab.active{background:var(--cream);border-color:var(--tab-accent,var(--accent));border-bottom:none!important;color:var(--tab-accent,var(--accent));padding-top:calc(.5rem + 3px);box-shadow:0 -3px 10px rgba(45,48,71,.06);z-index:2}
@media(max-width:600px){.tab{padding:.5rem .75rem;font-size:.82rem}.tab.active{padding-top:calc(.5rem + 3px)}}
@media(prefers-reduced-motion:reduce){.tab{transition:none}}
.main{max-width:960px;margin:0 auto;padding:0 2rem 4rem;position:relative;z-index:1}
.wb-index-inner{max-width:960px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}
.level-select{margin-bottom:1.5rem}
.level-label{display:block;font-family:Outfit,sans-serif;font-size:.66rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.segmented{display:inline-flex;flex-wrap:wrap;gap:.25rem;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:.25rem;box-shadow:var(--shadow-sm)}
.seg{font-family:'Outfit',sans-serif;display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;padding:.5rem 1rem;border:none;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;transition:all .18s;text-align:left;line-height:1.25}
.seg:hover{background:var(--cream)}
.seg .seg-main{font-size:.82rem;font-weight:800;letter-spacing:.01em}
.seg .seg-sub{font-size:.65rem;font-weight:500;color:var(--muted)}
.seg.active{background:var(--ink);color:#fff}
.seg.active .seg-sub{color:rgba(255,255,255,.7)}
@media(max-width:600px){.segmented{width:100%;justify-content:space-between}.seg{flex:1;align-items:center;text-align:center;padding:.5rem .25rem}.seg .seg-main{font-size:.74rem;white-space:nowrap}.seg .seg-sub{font-size:.6rem}}
.pos-card{margin-bottom:1rem;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .18s,transform .18s}
.pos-card:hover{box-shadow:var(--shadow-md)}
.pos-head{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;cursor:pointer;user-select:none;border-left:4px solid var(--posc,var(--border));background:var(--post,var(--cream));transition:filter .12s}
.pos-head:hover{filter:brightness(.97)}
.pos-label{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink)}
.pos-count{font-family:Outfit,sans-serif;font-size:.66rem;font-weight:600;color:var(--ink);opacity:.55;background:rgba(255,255,255,.55);padding:.25rem .5rem;border-radius:20px}
.pos-chevron{margin-left:auto;font-size:.7rem;color:var(--ink);opacity:.45;transition:transform .2s}
.pos-card.collapsed .pos-chevron{transform:rotate(-90deg)}
.pos-card.collapsed .pos-body{display:none}
.pos-body{padding:.25rem 0}
.word-row{border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;padding:.75rem 1rem}
.word-row:last-child{border-bottom:none}
.word-row:hover,.word-row.open{background:var(--cream)}
.wr-main{display:flex;align-items:center;gap:.5rem}
.wr-term{font-weight:800;font-size:.92rem;line-height:1.4}
.wr-arr{margin-left:auto;font-size:1rem;color:var(--border);transition:transform .15s,color .15s;flex-shrink:0;padding-left:.5rem}
.word-row.open .wr-arr{transform:rotate(90deg);color:var(--muted)}
.wr-def{font-size:.82rem;color:var(--muted);line-height:1.4;margin-top:.18rem}
.wr-ex{display:none;font-size:.79rem;font-style:italic;color:var(--ink);opacity:.85;margin-top:.5rem;padding:.5rem .75rem;border-radius:8px;border-left:2.5px solid var(--posc,var(--border));background:var(--post,var(--cream));line-height:1.5}
.word-row.open .wr-ex{display:block}
.conv-controls{display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem}
.conv-ctrl-label{font-family:Outfit,sans-serif;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:.25rem}
.conv-hide-btn{font-family:'Outfit',sans-serif;font-size:.8rem;font-weight:700;padding:.25rem .75rem;border:1.5px solid var(--border);border-radius:20px;background:var(--card);color:var(--muted);cursor:pointer;transition:all .18s}
.conv-hide-btn:hover{border-color:var(--ink);color:var(--ink)}
.conv-hide-btn.active-a{background:var(--sky);border-color:var(--sky);color:#fff}
.conv-hide-btn.active-b{background:var(--sea);border-color:var(--sea);color:#fff}
.hide-a .conv-speaker-a ~ span{visibility:hidden}
.hide-b .conv-speaker-b ~ span{visibility:hidden}
.conv-section{margin-bottom:1.5rem;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.conv-section.collapsed .cat-body{display:none}
.conv-section.collapsed .cat-chevron{transform:rotate(-90deg)}
.conv-header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.5rem 1rem;background:var(--sea-light);border-bottom:1.5px solid var(--border);border-left:3px solid var(--sea);cursor:pointer;user-select:none}
.conv-title{font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--sea)}
.conv-entry{border-bottom:1px solid var(--border);padding:.75rem 1rem}
.conv-entry:last-child{border-bottom:none}
.conv-dialogue{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.25rem}
.conv-line{font-size:.82rem;line-height:1.5;display:grid;grid-template-columns:16px 1fr;gap:.5rem}
.conv-speaker{font-family:Outfit,sans-serif;font-size:.6rem;font-weight:700;padding-top:.18rem}
.conv-speaker-a{color:var(--sky)}
.conv-speaker-b{color:var(--sea)}
.conv-note{font-size:.73rem;color:var(--muted);font-style:italic;padding-left:24px}
.print-btn{margin-left:auto;display:inline-flex;align-items:center;gap:.5rem;font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:600;padding:.5rem 1rem;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;transition:all .18s;flex-shrink:0}
.print-btn:hover{border-color:var(--ink);background:var(--ink);color:var(--cream)}
@media print{.print-btn{display:none}}
.empty-state{text-align:center;padding:3rem;color:var(--muted);font-size:.9rem}
.tap-hint{font-size:.75rem;color:var(--muted);margin-bottom:.75rem;font-style:italic}.sidebar-collapse-btn{position:fixed;top:68px;left:calc(300px - 14px);width:28px;height:28px;border-radius:50%;background:var(--card);border:1.5px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);cursor:pointer;z-index:170;transition:left .2s ease,background .15s,border-color .15s,color .15s,box-shadow .15s}.sidebar-collapse-btn:hover{background:var(--sky);border-color:var(--sky);color:#fff;box-shadow:var(--shadow-md)}.sidebar-collapse-btn:focus{outline:none}.sidebar-collapse-btn:focus-visible{background:var(--sky);border-color:var(--sky);color:#fff}.sidebar-collapse-btn svg{width:14px;height:14px;stroke-width:2.6;transition:transform .2s ease}
.sidebar{scrollbar-width:none}.sidebar::-webkit-scrollbar{display:none}
@media(max-width:900px){
  .sidebar-toggle{display:inline-flex}.sidebar-collapse-btn{left:14px;background:var(--sky);border-color:var(--sky);color:#fff;box-shadow:var(--shadow-md)}.sidebar.open~.sidebar-collapse-btn{left:calc(min(85vw,340px) - 14px);background:var(--card);border-color:var(--border);color:var(--ink);box-shadow:var(--shadow-sm)}.sidebar.open~.sidebar-collapse-btn svg{transform:rotate(180deg)}
  .app-shell{padding-top:52px}
  .sidebar{position:fixed;top:52px;left:0;bottom:0;width:85vw;max-width:340px;transform:translateX(-100%);transition:transform .25s ease;z-index:160;background:var(--card);box-shadow:var(--shadow-md)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-backdrop{display:none;position:fixed;inset:52px 0 0 0;background:rgba(45,48,71,.35);z-index:150}
  .sidebar-backdrop.open{display:block}
  .content-pane{width:100%}
}
@media(max-width:600px){.page-header{padding:2rem 1.25rem .75rem}.main{padding:0 1.25rem 3rem}.tabs-wrap{padding:0 1.25rem}.empty-pane{padding:4rem 1.25rem}}

.back-pill{display:inline-flex;align-items:center;gap:.5rem;font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:.5rem 1rem .5rem .75rem;cursor:pointer;transition:all .18s;margin-bottom:1.25rem;box-shadow:var(--shadow-sm)}
.back-pill:hover{color:var(--sky);border-color:var(--sky);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.back-pill svg{width:13px;height:13px;flex-shrink:0}

</style>
</head>

  DATA: {"tier1":[["journey","n.","the act of travelling from one place to another","The journey took six hours by train."],["trip","n.","a journey, especially a short one for a specific purpose","She went on a business trip to Berlin for three days."],["destination","n.","the place you are travelling to","Paris was their final destination after stops in Brussels and Bruges."],["luggage","n.","bags and suitcases taken on a journey","He travelled light — just one small bag of luggage."],["passport","n.","an official document identifying a person and allowing international travel","Make sure your passport is valid for at least six months."],["departure","n.","the action of leaving; the moment a journey begins","The departure time is seven-fifteen, so be there by seven."],["arrival","n.","the act of reaching a destination","Her arrival was delayed by two hours due to a strike."],["delay","n.","a period of time by which something is late","There was a two-hour delay on all outbound flights."],["fare","n.","the price paid for a journey on public transport","The bus fare into the city centre is one euro fifty."],["customs","n.","the official process for checking goods brought into a country","He was stopped at customs and his bag was searched."],["carry on","n.","a small bag or suitcase allowed in the cabin of a plane","She only travels with a carry on — no checked luggage."],["direct","adj.","(of a route) going straight to a destination without stops or changes","Is there a direct flight, or do I have to change?"],["packed","adj.","(of a place or transport) extremely full of people","The train was absolutely packed — I had to stand the whole way."],["check in","phr.v.","to register at an airport or hotel on arrival","You can check in online up to twenty-four hours before departure."],["board","v.","to get onto a plane, train, bus, or ship","Passengers began boarding twenty minutes before departure."],["book","v.","to reserve a seat, room, or ticket in advance","She booked her flights three months ahead to get a good price."],["miss","v.","to fail to catch a train, bus, or flight in time","He missed his connection and had to wait three hours."],["set off","phr.v.","to begin a journey","They set off at dawn to beat the traffic."],["get in","phr.v.","(of a train, plane, etc.) to arrive at its destination","The train gets in at half past nine."],["head off","phr.v.","to leave and begin a journey somewhere","They headed off early to avoid the motorway traffic."],["stop off","phr.v.","to make a brief visit to a place during a longer journey","We stopped off in Lyon for lunch on the way south."],["go through customs","colloc.","to pass through the official border control process","Going through customs took nearly an hour."]],"tier2":[["itinerary","n.","a planned route or schedule for a journey","She emailed the detailed itinerary to all the group members."],["layover","n.","a stop of several hours during a longer journey, especially by air","We had a six-hour layover in Dubai on the way to Bangkok."],["turbulence","n.","irregular air movement causing a plane to shake","The pilot warned passengers to expect turbulence over the Atlantic."],["commute","n.","a regular journey between home and work","Her daily commute takes ninety minutes each way."],["congestion","n.","a situation in which a route is so full that movement is slow","The city centre is notorious for congestion during rush hour."],["jet lag","n.","fatigue and disorientation resulting from rapid long-distance air travel","He was still battling jet lag three days after arriving from Tokyo."],["carbon footprint","n.","the total amount of greenhouse gases generated by a person's activities","Flying is one of the biggest contributors to an individual's carbon footprint."],["road rage","n.","aggressive or violent behaviour by a driver towards other road users","Road rage incidents have increased significantly in urban areas."],["tourist trap","n.","a place that attracts many tourists and charges high prices for low quality","The waterfront was a total tourist trap — overpriced and disappointing."],["scenic","adj.","(of a route or place) having beautiful or impressive natural views","They took the scenic coastal road rather than the motorway."],["smooth","adj.","(of a journey) without problems or difficulties","The crossing was smooth — no turbulence at all."],["bumpy","adj.","(of a journey) rough and uncomfortable, with lots of jolts or shaking","It was a bumpy ride — the road was full of potholes."],["get around","phr.v.","to travel to different places, especially within a city or region","The best way to get around the city is by metro."],["touch down","phr.v.","(of a plane) to land on the runway","The plane touched down forty minutes ahead of schedule."],["take off","phr.v.","(of a plane) to leave the ground and begin flying","The flight took off an hour late due to a technical fault."],["pack light","colloc.","to take only a small amount of luggage on a journey","She always packs light — one carry-on is all she ever needs."],["catch a connection","colloc.","to board a connecting flight or train in time","They had to run to catch their connection at Frankfurt."],["in transit","phrase","in the process of travelling from one place to another","Her luggage was lost in transit and never arrived."],["off the beaten track","idiom","away from popular tourist routes; in a remote or unusual place","They preferred destinations off the beaten track — away from the crowds."],["itchy feet","idiom","a strong desire to travel or move to a new place","She's had itchy feet since she was a teenager — she can't stay still for long."],["a hidden gem","idiom","a place or thing that is not well known but is of great quality or beauty","The restaurant was a real hidden gem — tucked away in a back street."],["staycation","slang","a holiday spent at home or in your own country rather than abroad","We couldn't afford to fly anywhere, so we had a staycation instead."],["FOMO","slang","fear of missing out — anxiety that others are having experiences you're not","Seeing everyone's holiday photos gives me serious FOMO."]],"tier3":[["infrastructure","n.","the basic physical systems of a country, such as roads, railways, and airports","The country's transport infrastructure was crumbling after decades of underinvestment."],["sustainable tourism","n.","travel that minimises environmental damage and supports local communities","More travellers are choosing sustainable tourism options."],["nomadic","adj.","moving from place to place without a fixed home","He had lived a nomadic lifestyle for a decade before finally settling."],["remote","adj.","situated far from the main centres of population; hard to reach","The village was so remote it could only be reached on foot."],["embark","v.","to board a ship or plane; to begin a new journey or project","They embarked at Southampton for the transatlantic crossing."],["navigate","v.","to plan and direct a route; to find one's way through a place","She navigated her way through the backstreets entirely from memory."],["venture off","phr.v.","to leave a safe or familiar route and explore somewhere more unknown","We ventured off the main road and found an incredible little restaurant."],["a stone's throw","idiom","a very short distance away","The hotel was a stone's throw from the beach — you could hear the waves."],["in the middle of nowhere","idiom","in a very remote location, far from towns or services","The car broke down in the middle of nowhere — no signal, no houses."]]},
  CONV_DATA: [{"group":"Planning a trip","entries":[{"lines":[["A","<b>Have you got any holidays planned</b>?"],["B","We're thinking about Portugal in September — somewhere off the beaten track."]],"note":"\"Off the beaten track\" = away from touristy areas. Very natural in travel conversation."},{"lines":[["A","<b>How are you getting there</b>?"],["B","Flying to Lisbon, then hiring a car. The train is too slow for the distances we want to cover."]],"note":"\"Cover a distance\" = travel a certain distance. Standard travel vocabulary."},{"lines":[["A","<b>Did you book well in advance</b>?"],["B","Months ago. Flights are so much cheaper if you're flexible about dates."]],"note":"\"In advance\" and \"flexible about dates\" — practical planning language."},{"lines":[["A","<b>Are you a light packer or a heavy packer</b>?"],["B","Definitely light. I did a two-week trip with just a backpack once and never looked back."]],"note":"\"Never looked back\" = decided something was right and had no regrets about it."}]},{"group":"Getting around","entries":[{"lines":[["A","<b>What's the best way to get around</b> in your city?"],["B","The metro, without a doubt. Driving is an absolute nightmare with the congestion."]],"note":"\"Without a doubt\" = definitely. \"Absolute nightmare\" = very difficult or stressful."},{"lines":[["A","How was your commute today?"],["B","Horrible. There was a signal failure and everything was held up for forty minutes."]],"note":"\"Held up\" = delayed. Essential vocabulary for talking about transport disruption."},{"lines":[["A","<b>Did you get there alright</b>?"],["B","Eventually. We missed our connection in Madrid and had to wait three hours."]],"note":"\"Eventually\" signals that there were difficulties. \"Miss a connection\" — key travel phrase."},{"lines":[["A","The traffic is absolutely terrible here."],["B","Tell me about it. The whole city centre was in gridlock this morning — took me an hour to go two kilometres."]],"note":"\"Tell me about it\" = I completely agree, I know exactly what you mean."}]},{"group":"Talking about travel experiences","entries":[{"lines":[["A","<b>What's the best place you've ever been</b>?"],["B","Japan, without question. I'd go back tomorrow if I could."]],"note":"Classic travel question. \"Without question\" = without any doubt."},{"lines":[["A","<b>Was it what you expected</b>?"],["B","Not at all, actually — in a good way. It was completely different to what I'd imagined."]],"note":"\"Not at all — in a good way\" = a polished way to express positive surprise."},{"lines":[["A","<b>Any travel disasters</b>?"],["B","Our luggage was lost in transit and didn't turn up for three days. We had nothing but what we were wearing."]],"note":"\"Turn up\" = arrive, appear. \"Lost in transit\" = lost during the journey between flights."},{"lines":[["A","Do you prefer city breaks or getting off the beaten track?"],["B","Off the beaten track, every time. Cities are amazing but I find them exhausting after a few days."]],"note":"\"Every time\" = always, without exception. Good emphatic expression."}]},{"group":"Sustainable travel","entries":[{"lines":[["A","<b>Do you think about your carbon footprint when you travel</b>?"],["B","More than I used to. I try to take the train for anything under four hours."]],"note":"\"More than I used to\" = behaviour has changed over time. Reflective and natural."},{"lines":[["A","<b>Would you ever give up flying</b>?"],["B","For short haul, maybe. Long haul is harder to give up — the alternatives take so much longer."]],"note":"\"Short haul\" vs \"long haul\" — essential aviation vocabulary."},{"lines":[["A","Is sustainable tourism just a trend, do you think, or something that's here to stay?"],["B","I think it's here to stay. Once people start thinking about their impact, it's hard to go back."]],"note":"\"Here to stay\" = permanent. \"Go back\" = return to previous habits."}]}],
},
'home-housework': {
  title: "Home & Housework",
  accent: "#1DD3B0", accentLight: "#E4FBF7",
  icon: "<path d=\"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z\"></path><polyline points=\"9 22 9 12 15 12 15 22\"></polyline>",
  CATEGORIES: [{"key": "tier1", "label": "Tier 1 \u2014 Essential"}, {"key": "tier2", "label": "Tier 2 \u2014 Intermediate"}, {"key": "tier3", "label": "Tier 3 \u2014 Advanced"}],
  DATA: {"tier1": [["chore", "n.", "a routine household task", "The children were each given a list of daily chores."], ["mess", "n.", "an untidy or dirty state", "The kitchen was in a complete mess after the party."], ["dust", "n.", "fine dry particles of dirt that settle on surfaces", "There was a thick layer of dust on the bookshelves."], ["rubbish", "n.", "waste material to be thrown away (British English)", "Can you take the rubbish out before the lorry comes?"], ["washing", "n.", "clothes and linen that need to be washed", "There's a pile of washing that needs to be done."], ["hoovering", "n.", "the act of vacuuming floors and carpets", "I usually do the hoovering on Sunday mornings."], ["clutter", "n.", "an untidy accumulation of objects not in order", "She spent the weekend clearing the clutter from the spare room."], ["tidy", "adj.", "arranged neatly and in order", "He always keeps his desk tidy, even during busy periods."], ["messy", "adj.", "untidy and dirty", "The bathroom was absolutely messy after the kids' bath time."], ["spotless", "adj.", "perfectly clean; free of any marks or dirt", "She left the kitchen spotless after the dinner party."], ["clean", "v.", "to make something free from dirt or mess", "She spent the morning cleaning the bathroom from top to bottom."], ["vacuum", "v.", "to clean a floor or carpet using a vacuum cleaner", "He vacuums the living room every Saturday morning."], ["sweep", "v.", "to clean a floor by pushing dirt away with a brush", "She swept the kitchen floor after dinner."], ["iron", "v.", "to press clothes with a heated iron to remove creases", "She irons her shirts the night before work."], ["tidy up", "phr.v.", "to make a place neat by putting things in their proper place", "Can you tidy up the living room before the guests arrive?"], ["throw out", "phr.v.", "to dispose of something you no longer need", "She threw out a whole bin bag of old clothes."], ["clear up", "phr.v.", "to tidy or clean a place after an activity", "It took us two hours to clear up after the party."], ["put away", "phr.v.", "to return items to their correct storage place", "If everyone put things away after using them, the house would stay tidy."], ["make the bed", "colloc.", "to straighten the bedcovers and pillows after sleeping", "She always makes the bed before leaving the house."], ["do the laundry", "colloc.", "to wash a load of clothes", "He does the laundry every Sunday without fail."], ["in a state", "idiom", "in a very untidy or disordered condition", "The kitchen was in a complete state after the party."], ["tip", "slang", "a very messy or dirty place (British informal)", "The bedroom's an absolute tip \u2014 sort it out."], ["blitz", "slang", "to clean or tidy a place quickly and intensively", "We blitzed the flat before the viewing."]], "tier2": [["maintenance", "n.", "the work of keeping something in good condition", "Regular maintenance of the boiler will prevent costly breakdowns."], ["renovation", "n.", "the process of improving or restoring a building or room", "They moved out while the renovation was being carried out."], ["limescale", "n.", "a hard white deposit that builds up from hard water", "There was thick limescale around the taps and showerhead."], ["mould", "n.", "a fungal growth that appears on damp surfaces", "There was mould forming in the corners of the bathroom ceiling."], ["cluttered", "adj.", "untidy and full of objects that are not well organised", "The garage was too cluttered to fit a car in."], ["immaculate", "adj.", "perfectly clean and tidy; free from any blemish", "The flat was immaculate \u2014 you'd never guess anyone lived there."], ["meticulous", "adj.", "giving very careful attention to every detail", "She was meticulous about cleaning \u2014 every corner was inspected."], ["scrub", "v.", "to clean something thoroughly by rubbing it hard", "She scrubbed the tiles until they were white again."], ["declutter", "v.", "to remove unnecessary items from a space to make it tidier", "They spent the bank holiday decluttering the loft."], ["wipe down", "phr.v.", "to clean a surface by rubbing it with a cloth", "She wiped down the counters after cooking."], ["clear out", "phr.v.", "to remove all unwanted items from a space", "We need to clear out the garage before winter."], ["build up", "phr.v.", "to accumulate gradually on a surface", "Grease tends to build up around the hob if it isn't cleaned regularly."], ["keep on top of", "colloc.", "to manage something regularly so it doesn't get out of control", "It's much easier to keep on top of the housework little and often."], ["elbow grease", "idiom", "hard physical effort, especially when cleaning or polishing", "The stove was filthy \u2014 it took real elbow grease to get it clean."], ["not lift a finger", "idiom", "to do nothing to help with household tasks", "He sat watching TV and didn't lift a finger while she cleaned."]], "tier3": [["disrepair", "n.", "a poor condition caused by neglect and lack of maintenance", "The property had fallen into disrepair after years of neglect."], ["grime", "n.", "thick dirt that has built up over time on a surface", "Years of grime had built up on the kitchen ceiling."], ["pristine", "adj.", "in its original clean condition; unspoiled", "Despite being fifty years old, the kitchen was in pristine condition."], ["squalid", "adj.", "extremely dirty and unpleasant, often through neglect", "The students had left the house in a squalid state."], ["spick and span", "idiom", "perfectly clean and tidy", "She had the flat spick and span before the landlord's inspection."], ["run-down", "adj.", "(of a building or area) in poor condition from lack of care", "The house was completely run-down when they bought it."], ["refurbish", "v.", "to renovate and redecorate a building or room", "The landlord agreed to refurbish the kitchen before new tenants arrived."], ["do up", "phr.v.", "to renovate or redecorate a property", "They bought an old cottage and spent two years doing it up."], ["from top to bottom", "colloc.", "completely and thoroughly, from one end to the other", "She cleaned the flat from top to bottom before the move."], ["a lick of paint", "idiom", "a small amount of painting done to freshen up a room", "The hallway just needs a lick of paint and it'll look brand new."], ["a slob", "n.", "a person who is habitually lazy, untidy, or lacking in personal hygiene", "He's a complete slob \u2014 there are dirty plates everywhere."]]},
  CONV_DATA: [{"group": "Dividing household tasks", "entries": [{"lines": [["A", "Whose turn is it to <b>do the washing-up</b>?"], ["B", "Mine, I think. You cooked, so it's only fair."]], "note": "\"Do the washing-up\" is the standard British collocation \u2014 not \"wash the dishes\"."}, {"lines": [["A", "Can you <b>tidy up</b> the living room before they arrive?"], ["B", "Sure, I'll do that now. Can you <b>put away</b> the stuff on the stairs?"]], "note": "\"Tidy up\" and \"put away\" are the two most common phrasal verbs for household organisation."}, {"lines": [["A", "I feel like I'm the only one who ever <b>pulls their weight</b> around here."], ["B", "That's not fair. I did the hoovering and the laundry yesterday."]], "note": "\"Pull your weight\" = do your fair share. Very common in arguments about housework."}, {"lines": [["A", "He just sat there and <b>didn't lift a finger</b> while I cleaned the whole flat."], ["B", "That would drive me mad. Have you spoken to him about it?"]], "note": "\"Not lift a finger\" = do nothing to help. Strong, slightly accusatory idiom."}]}, {"group": "Describing the state of the house", "entries": [{"lines": [["A", "The kitchen's an absolute <b>tip</b>."], ["B", "I know \u2014 I'll give it a <b>blitz</b> this afternoon."]], "note": "\"Tip\" (informal) = a very messy place. \"Blitz\" = clean intensively and quickly."}, {"lines": [["A", "How did the flat look when they moved out?"], ["B", "Honestly, it was in a <b>state</b>. There was <b>mould</b> on the bathroom ceiling and <b>limescale</b> everywhere."]], "note": "\"In a state\" = in a bad condition. \"Mould\" and \"limescale\" are essential maintenance vocabulary."}, {"lines": [["A", "The flat was <b>immaculate</b> when we viewed it."], ["B", "She's incredibly <b>organised</b> \u2014 everything has its place."]], "note": "\"Immaculate\" implies not just clean but flawless. A step up from \"spotless\"."}, {"lines": [["A", "I need to <b>declutter</b> \u2014 there's too much stuff everywhere."], ["B", "Same. I'm going to <b>clear out</b> the spare room this weekend."]], "note": "\"Declutter\" = remove unnecessary items. \"Clear out\" = remove everything from a space."}]}, {"group": "Maintenance and repairs", "entries": [{"lines": [["A", "The whole place needs <b>doing up</b>, to be honest."], ["B", "It just needs a <b>lick of paint</b> and some new carpets."]], "note": "\"Do up\" = renovate casually. \"A lick of paint\" = a small, quick cosmetic fix."}, {"lines": [["A", "How much is the <b>upkeep</b> on a house like that?"], ["B", "More than you'd think. There's always something that needs fixing."]], "note": "\"Upkeep\" = the ongoing cost/effort of maintaining something. C1 level."}, {"lines": [["A", "The carpet in the hallway has completely <b>worn out</b>."], ["B", "It's been there twenty years \u2014 it's not surprising."]], "note": "\"Wear out\" = become unusable through repeated use."}, {"lines": [["A", "I keep putting off cleaning the oven."], ["B", "Just <b>bite the bullet</b> and do it \u2014 it'll take twenty minutes."]], "note": "\"Bite the bullet\" = force yourself to do something unpleasant you've been avoiding."}]}, {"group": "Cleaning routines", "entries": [{"lines": [["A", "How do you <b>keep on top of</b> the housework?"], ["B", "Little and often. If you let it go, it gets overwhelming."]], "note": "\"Keep on top of\" = manage something regularly before it gets out of control. Very natural C1 phrase."}, {"lines": [["A", "The bathroom needs a <b>deep clean</b>."], ["B", "I'll do it at the weekend. I need to <b>disinfect</b> everything properly."]], "note": "\"Deep clean\" = a thorough clean rather than a surface tidy. \"Disinfect\" = kill germs with chemicals."}, {"lines": [["A", "Make sure you <b>wipe down</b> the surfaces after cooking."], ["B", "And the hob \u2014 <b>grease builds up</b> really fast if you don't."]], "note": "\"Wipe down\" = clean a surface with a cloth. \"Build up\" = accumulate gradually."}, {"lines": [["A", "I always clean the flat <b>from top to bottom</b> before guests come."], ["B", "Same. It's the only way to make sure nothing gets missed."]], "note": "\"From top to bottom\" = completely and thoroughly, covering every part."}]}],
},
'health-wellbeing': {
  title: "Health & Wellbeing",
  accent: "#FF6B6B", accentLight: "#FFE8E8",
  icon: "<path d=\"M22 12h-4l-3 9L9 3l-3 9H2\"></path>",
  CATEGORIES: [{"key": "tier1", "label": "Tier 1 \u2014 Essential"}, {"key": "tier2", "label": "Tier 2 \u2014 Intermediate"}, {"key": "tier3", "label": "Tier 3 \u2014 Advanced"}],
  DATA: {"tier1": [["symptom", "n.", "a sign of illness experienced by the patient", "Fever and fatigue are common symptoms of the virus."], ["treatment", "n.", "medical care given to a patient for an illness or injury", "The treatment involves a course of antibiotics over seven days."], ["appointment", "n.", "a scheduled time to see a doctor or specialist", "She made an appointment with her GP for the following Monday."], ["prescription", "n.", "a written instruction from a doctor authorising medicine for a patient", "The doctor gave her a prescription for painkillers."], ["diet", "n.", "the food and drink a person regularly consumes", "She changed her diet and started eating more vegetables."], ["recovery", "n.", "the process of returning to health after illness or injury", "His recovery from the operation took three months."], ["surgery", "n.", "a medical procedure in which the body is cut open to treat a condition", "She needed surgery to repair the torn ligament."], ["allergy", "n.", "an adverse reaction by the immune system to a substance", "She has a severe allergy to penicillin."], ["injury", "n.", "physical damage to part of the body", "He suffered a knee injury during training."], ["stress", "n.", "mental or emotional strain caused by pressure or worry", "Chronic stress can have serious effects on physical health."], ["mental health", "n.", "a person's emotional and psychological wellbeing", "Mental health is just as important as physical health."], ["check-up", "n.", "a routine examination by a doctor to assess general health", "She goes for an annual check-up every January."], ["fit", "adj.", "in good physical condition; healthy and active", "He's incredibly fit for his age \u2014 he runs every day."], ["healthy", "adj.", "in good physical or mental condition; promoting good health", "Eating a balanced diet is the foundation of a healthy lifestyle."], ["chronic", "adj.", "(of an illness or condition) persisting for a long time", "He has a chronic back problem that flares up periodically."], ["overweight", "adj.", "above the recommended body weight for one's height", "The doctor said he was overweight and advised more exercise."], ["get over", "phr.v.", "to recover fully from an illness", "It took her two weeks to get over the chest infection."], ["come down with", "phr.v.", "to begin to develop an illness", "She came down with flu the day before her holiday."], ["pass out", "phr.v.", "to lose consciousness", "She passed out from dehydration during the half-marathon."], ["take a painkiller", "colloc.", "to take medicine that reduces pain", "She took a painkiller and lay down until the headache passed."], ["catch a cold", "colloc.", "to become infected with a common cold virus", "He caught a cold after standing in the rain."], ["feel under the weather", "idiom", "to feel slightly unwell", "I'm feeling a bit under the weather \u2014 I might skip the gym today."], ["be back on your feet", "idiom", "to have recovered from illness and returned to normal activity", "She was back on her feet within a week of the operation."]], "tier2": [["diagnosis", "n.", "a doctor's identification of an illness based on symptoms and tests", "The diagnosis came back as type 2 diabetes."], ["inflammation", "n.", "redness, swelling, and pain caused by infection or injury", "Anti-inflammatory drugs help reduce the inflammation."], ["metabolism", "n.", "the chemical processes in the body that convert food into energy", "A slow metabolism can make it harder to maintain a healthy weight."], ["immune system", "n.", "the body's defence mechanism against infection and disease", "A poor diet weakens the immune system over time."], ["nutrition", "n.", "the process of consuming the right foods for good health", "Good nutrition in childhood is essential for healthy development."], ["anxiety", "n.", "a persistent feeling of worry, nervousness, or unease", "She sought therapy for her anxiety after it began affecting her work."], ["burnout", "n.", "physical and emotional exhaustion caused by prolonged stress", "He was signed off work for a month with burnout."], ["sedentary", "adj.", "characterised by much sitting and little physical activity", "A sedentary lifestyle is a major risk factor for heart disease."], ["contagious", "adj.", "(of a disease) spreadable from person to person by contact", "The virus is highly contagious in enclosed spaces."], ["run-down", "adj.", "tired and in poor health due to overwork or neglect of self-care", "He'd been so run-down that even a minor cold knocked him out."], ["cut down on", "phr.v.", "to reduce the amount of something harmful you consume", "She was told to cut down on salt and processed foods."], ["fight off", "phr.v.", "to successfully resist and recover from an illness", "He managed to fight off the infection without antibiotics."], ["work out", "phr.v.", "to do physical exercise, especially at a gym", "She works out three times a week to manage her stress levels."], ["burn off", "phr.v.", "to use up calories or energy through physical activity", "He goes for a run to burn off steam after work."], ["keep up", "phr.v.", "to maintain a habit, standard, or routine consistently", "It's hard to keep up a healthy routine when you're travelling."], ["bounce back", "phr.v.", "to recover quickly and fully from illness or setback", "She bounced back from the surgery much faster than expected."], ["balanced diet", "colloc.", "a diet containing the correct proportions of all essential nutrients", "The key to good health is a balanced diet and regular exercise."], ["on the mend", "idiom", "recovering and getting better after an illness", "She's on the mend \u2014 back to work next week, hopefully."], ["in good shape", "idiom", "in good physical condition; healthy and fit", "For someone in their sixties, she's in remarkable shape."], ["take its toll", "idiom", "to cause gradual damage to someone's health or wellbeing", "The years of overwork were beginning to take their toll."], ["knackered", "slang", "extremely tired or exhausted (British informal)", "I'm absolutely knackered after that gym session."], ["dodgy tummy", "slang", "an upset stomach (British informal)", "I've had a dodgy tummy since that kebab last night."]], "tier3": [["prognosis", "n.", "a medical prediction of how a disease is likely to develop", "The prognosis was positive \u2014 a full recovery was expected within three months."], ["placebo effect", "n.", "a measurable improvement caused by belief in treatment rather than the treatment itself", "The trial had to account for the placebo effect in its control group."], ["holistic", "adj.", "treating the whole person \u2014 physical, mental, and social \u2014 rather than just symptoms", "She preferred a more holistic approach to her healthcare."], ["debilitating", "adj.", "making someone very weak or unable to function normally", "The debilitating fatigue made it impossible for her to work."], ["resilient", "adj.", "able to recover quickly from difficulty, illness, or stress", "Children are remarkably resilient, but trauma still leaves lasting marks."], ["preventative", "adj.", "designed to stop something harmful from occurring", "Preventative healthcare is far more cost-effective than treatment."], ["terminal", "adj.", "(of a disease) leading eventually to death; without prospect of recovery", "He was given a terminal diagnosis and told to get his affairs in order."], ["bedridden", "adj.", "confined to bed for an extended period due to illness or injury", "She was bedridden for two weeks after catching pneumonia."], ["wean off", "phr.v.", "to gradually reduce dependence on a substance or habit", "The doctor helped her wean off the medication over three months."], ["soldier on", "phr.v.", "to continue despite illness, pain, or difficulty", "He soldiered on through the cold rather than take a day off."], ["push through", "phr.v.", "to complete something demanding despite pain or exhaustion", "She pushed through the last miles on sheer willpower alone."], ["a clean bill of health", "idiom", "a confirmation that someone is in good health after a medical examination", "The consultant gave him a clean bill of health after the scan."], ["go cold turkey", "idiom", "to stop a habit or addiction suddenly and completely", "She gave up cigarettes by going cold turkey \u2014 not a single one since January."], ["hit a wall", "idiom", "to reach a point of total physical or mental exhaustion", "Around mile twenty she hit a wall and almost stopped."], ["at death's door", "idiom", "extremely ill and close to dying", "She described how she had been at death's door and miraculously recovered."], ["in the pink", "idiom", "in excellent health or condition", "She's in the pink \u2014 you'd never know she had surgery three months ago."]]},
  CONV_DATA: [{"group": "Talking about health and lifestyle", "entries": [{"lines": [["A", "<b>Do you try to eat healthily</b>?"], ["B", "I make an effort. I've cut down on processed food but I still have a sweet tooth."]], "note": "\"Cut down on\" = reduce consumption. \"Sweet tooth\" = a strong liking for sweet food."}, {"lines": [["A", "<b>How do you stay fit</b>?"], ["B", "Mostly walking and cycling. I used to go to the gym but I couldn't keep it up."]], "note": "\"Keep it up\" = maintain a habit consistently over time."}, {"lines": [["A", "<b>Do you get enough sleep</b>?"], ["B", "Definitely not. I'm a night owl \u2014 I can't seem to get to bed before midnight."]], "note": "\"Night owl\" = someone who naturally stays up and functions better late at night."}, {"lines": [["A", "<b>How do you deal with stress</b>?"], ["B", "I go for a run, mostly. It clears my head better than anything else."]], "note": "\"Clears my head\" = helps me think more clearly and feel calmer. Very common phrase."}]}, {"group": "Describing illness", "entries": [{"lines": [["A", "You don't look well. <b>Are you alright</b>?"], ["B", "I'm not great, actually. I think I'm coming down with something."]], "note": "\"Coming down with something\" = beginning to develop an illness. Natural, widely used."}, {"lines": [["A", "<b>How long have you been feeling like this</b>?"], ["B", "Since Tuesday. I thought it would pass but it's getting worse."]], "note": "Important question for describing illness duration. Natural follow-up."}, {"lines": [["A", "Have you been to the doctor?"], ["B", "Not yet. I'm hoping I can <b>fight it off</b> without antibiotics."]], "note": "\"Fight off\" an illness = overcome it through your immune system, without treatment."}, {"lines": [["A", "She was <b>at death's door</b> last winter."], ["B", "I know \u2014 I can't believe how quickly she bounced back. She's incredible."]], "note": "\"At death's door\" (C2 level idiom) contrasted with \"bounce back\" = recover quickly."}]}, {"group": "Mental health", "entries": [{"lines": [["A", "<b>How are you doing \u2014 really</b>?"], ["B", "Honestly? A bit burnt out. Work has been relentless and I can't seem to switch off."]], "note": "\"Switch off\" = stop thinking about work and relax. Essential mental health vocabulary."}, {"lines": [["A", "Have you thought about talking to someone?"], ["B", "I've been thinking about it. There's still a bit of a stigma around it but I know it helps."]], "note": "\"Talking to someone\" = seeing a therapist. \"Stigma\" = social disapproval of a topic."}, {"lines": [["A", "<b>Do you think people talk openly enough about mental health</b>?"], ["B", "More than before, definitely. But there's still a long way to go."]], "note": "Opinion question for discussion. Good for upper intermediate and above."}, {"lines": [["A", "I've been feeling really anxious lately."], ["B", "I'm sorry. <b>Have you tried any mindfulness</b>? It really helped me during a difficult period."]], "note": "\"Mindfulness\" = the practice of being aware of the present moment. Common in mental health talk."}]}, {"group": "Habits and lifestyle changes", "entries": [{"lines": [["A", "I'm trying to <b>cut down on</b> alcohol."], ["B", "Good for you. Are you doing dry January or is it a longer-term thing?"]], "note": "\"Dry January\" = a month of no alcohol in January. Common in British culture."}, {"lines": [["A", "I've been meaning to get <b>a check-up</b> but keep putting it off."], ["B", "Just book it \u2014 it's always better to catch things early."]], "note": "\"Put off\" = delay something. \"Catch things early\" = detect health issues before they worsen."}, {"lines": [["A", "She went <b>cold turkey</b> on cigarettes three years ago."], ["B", "That takes real willpower. Most people have to try several times."]], "note": "\"Cold turkey\" = stopping an addiction suddenly and completely."}, {"lines": [["A", "<b>Do you think about your health more as you get older</b>?"], ["B", "Absolutely. Things I ignored in my twenties I can't ignore anymore."]], "note": "Reflective open question. Invites personal, thoughtful responses."}]}],
},
'relationships-people': {
  title: "Relationships & People",
  accent: "#E76F51", accentLight: "#FCEAE5",
  icon: "<path d=\"M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z\"></path>",
  CATEGORIES: [{"key": "tier1", "label": "Tier 1 \u2014 Essential"}, {"key": "tier2", "label": "Tier 2 \u2014 Intermediate"}, {"key": "tier3", "label": "Tier 3 \u2014 Advanced"}],
  DATA: {"tier1": [["friendship", "n.", "a close, trusting relationship between people who are not family", "Their friendship has lasted over thirty years."], ["partner", "n.", "a person you are in a romantic relationship with", "She introduced her partner to her parents over dinner."], ["acquaintance", "n.", "a person you know slightly but who is not a close friend", "He's not really a friend \u2014 more of an acquaintance."], ["neighbour", "n.", "a person who lives near you", "Our neighbours are really friendly \u2014 they invited us over for dinner."], ["trust", "n.", "firm belief in the honesty and reliability of another person", "Trust is the foundation of any good relationship."], ["close", "adj.", "having a strong emotional bond with someone", "She's very close to her sister \u2014 they speak every day."], ["loyal", "adj.", "faithful and devoted to a person, cause, or relationship", "He's been a loyal friend through some very difficult times."], ["supportive", "adj.", "providing encouragement and emotional help", "Her family have been incredibly supportive throughout her illness."], ["get on with", "phr.v.", "to have a friendly relationship with someone", "She gets on really well with her colleagues."], ["fall out", "phr.v.", "to have a serious argument that damages a relationship", "They fell out over money and haven't spoken since."], ["break up", "phr.v.", "to end a romantic relationship", "They broke up after five years together."], ["make up", "phr.v.", "to become friends again after an argument", "They made up the next day and pretended nothing had happened."], ["settle down", "phr.v.", "to begin living a stable life, often with a partner", "He travelled for years before finally settling down in his thirties."], ["hit it off", "idiom", "to immediately get along well with someone you've just met", "They hit it off straight away and talked for hours."], ["a shoulder to cry on", "idiom", "a person who listens and offers comfort during difficult times", "She's always been a shoulder to cry on when things go wrong."], ["bestie", "slang", "a person's best or closest friend (informal)", "She's been my bestie since primary school."]], "tier2": [["bond", "n.", "a deep emotional connection between people", "The bond between mother and child is incredibly strong."], ["commitment", "n.", "a strong dedication to a person or relationship", "Marriage requires commitment from both sides."], ["chemistry", "n.", "a natural attraction or emotional connection between two people", "There was immediate chemistry between them."], ["clingy", "adj.", "overly dependent on another person for emotional support or attention", "He found her a bit clingy after only two dates."], ["toxic", "adj.", "(of a relationship) harmful, destructive, and emotionally damaging", "She finally left the toxic relationship after two years."], ["estranged", "adj.", "no longer in contact with a family member due to a disagreement", "He's been estranged from his father for over a decade."], ["grow apart", "phr.v.", "to gradually become less close to someone over time", "They didn't argue \u2014 they just grew apart."], ["look up to", "phr.v.", "to admire and respect someone", "She's always looked up to her older brother."], ["let down", "phr.v.", "to disappoint someone by failing to do what was expected", "He really let her down when he didn't turn up to the wedding."], ["drift apart", "phr.v.", "to slowly lose contact with someone without a specific cause", "After university, they gradually drifted apart."], ["get to know", "colloc.", "to spend time learning about someone's personality and character", "It takes time to really get to know someone."], ["have a lot in common", "colloc.", "to share similar interests, values, or experiences", "They have a lot in common \u2014 they both love hiking and cooking."], ["on the rocks", "idiom", "(of a relationship) in serious difficulty", "Their marriage has been on the rocks for a while now."], ["through thick and thin", "idiom", "through good times and bad times", "She's been there for me through thick and thin."], ["tight", "adj.", "(of a friendship or group) very close and loyal", "They're a really tight group \u2014 they do everything together."], ["clash", "v.", "to have a strong disagreement or conflict with someone", "She clashed with her manager over the new policy."]], "tier3": [["platonic", "adj.", "(of a relationship) close and affectionate but not sexual or romantic", "They've always had a purely platonic friendship."], ["codependent", "adj.", "excessively reliant on another person for emotional needs", "The relationship had become unhealthily codependent."], ["unconditional", "adj.", "given or offered without any conditions or limitations", "A parent's love should be unconditional."], ["rekindle", "v.", "to revive a relationship or feeling that had faded", "They rekindled their friendship after meeting at a school reunion."], ["confide in", "phr.v.", "to share personal secrets or worries with someone you trust", "She confided in her best friend about the problems at work."], ["blood is thicker than water", "idiom", "family relationships are more important than other bonds", "He forgave his brother \u2014 blood is thicker than water."], ["wear the trousers", "idiom", "to be the dominant person in a relationship", "Everyone knows she wears the trousers in that household."], ["tied to someone's apron strings", "idiom", "excessively dependent on or controlled by someone", "He's thirty-five and still tied to his mother's apron strings."], ["not see eye to eye", "idiom", "to disagree with someone about something", "They don't see eye to eye on politics, but they're still close friends."], ["on the same wavelength", "idiom", "thinking in the same way; understanding each other easily", "We've always been on the same wavelength \u2014 we barely need to explain things."]]},
  CONV_DATA: [{"group": "Friendships", "entries": [{"lines": [["A", "<b>How did you two meet</b>?"], ["B", "Through work, actually. We hit it off straight away."]], "note": "\"Hit it off\" = to get along well immediately with someone you've just met."}, {"lines": [["A", "<b>Are you still in touch with your school friends</b>?"], ["B", "A couple. Most of us just drifted apart after university."]], "note": "\"Drift apart\" = to slowly lose contact without a specific cause."}, {"lines": [["A", "<b>What makes a good friendship</b>?"], ["B", "Being there through thick and thin \u2014 not just the good times."]], "note": "\"Through thick and thin\" = in both good times and bad times."}]}, {"group": "Romantic relationships", "entries": [{"lines": [["A", "<b>How long have you been together</b>?"], ["B", "Six years. We settled down quite young compared to our friends."]], "note": "\"Settle down\" = to begin a stable life, often with a partner."}, {"lines": [["A", "<b>Do you two ever argue</b>?"], ["B", "Of course. But we always make up quickly \u2014 we never go to bed angry."]], "note": "\"Make up\" = to become friends again after an argument."}, {"lines": [["A", "I heard Tom and Laura <b>broke up</b>."], ["B", "Again? They're always on the rocks. They'll probably get back together next week."]], "note": "\"On the rocks\" = in serious difficulty. \"Break up\" = to end a relationship."}]}, {"group": "Family dynamics", "entries": [{"lines": [["A", "<b>Do you get on with your siblings</b>?"], ["B", "Now, yes. We used to fall out constantly as teenagers."]], "note": "\"Fall out\" = to have a serious argument that damages a relationship."}, {"lines": [["A", "<b>Who do you look up to</b> in your family?"], ["B", "My grandmother. She's been a shoulder to cry on my whole life."]], "note": "\"Look up to\" = to admire. \"A shoulder to cry on\" = someone who offers comfort."}]}],
},
'emotions-character': {
  title: "Emotions & Character",
  accent: "#BC4749", accentLight: "#FAE8E8",
  icon: "<circle cx=\"12\" cy=\"12\" r=\"10\"></circle><path d=\"M8 14s1.5 2 4 2 4-2 4-2\"></path><line x1=\"9\" y1=\"9\" x2=\"9.01\" y2=\"9\"></line><line x1=\"15\" y1=\"9\" x2=\"15.01\" y2=\"9\"></line>",
  CATEGORIES: [{"key": "tier1", "label": "Tier 1 \u2014 Essential"}, {"key": "tier2", "label": "Tier 2 \u2014 Intermediate"}, {"key": "tier3", "label": "Tier 3 \u2014 Advanced"}],
  DATA: {"tier1": [["mood", "n.", "a temporary state of mind or feeling", "She's been in a really good mood all day."], ["temper", "n.", "a person's tendency to become angry", "He has a terrible temper \u2014 he shouts over the smallest things."], ["confidence", "n.", "a feeling of self-assurance and belief in one's own abilities", "Her confidence has grown enormously since starting the course."], ["embarrassment", "n.", "a feeling of self-consciousness and awkwardness", "He couldn't hide his embarrassment when he tripped on stage."], ["relief", "n.", "a feeling of reassurance after anxiety or distress", "The relief on her face when she got the results was obvious."], ["grateful", "adj.", "feeling thankful for something received or experienced", "I'm so grateful for everything you've done."], ["anxious", "adj.", "feeling worried or uneasy about something uncertain", "She felt anxious about the interview for days beforehand."], ["frustrated", "adj.", "feeling upset because you are unable to change or achieve something", "He was frustrated by the lack of progress."], ["stubborn", "adj.", "refusing to change one's mind or course of action", "She's incredibly stubborn \u2014 once she's decided, there's no changing her mind."], ["open-minded", "adj.", "willing to consider new ideas and different opinions", "You need to be open-minded if you're going to travel alone."], ["cheer up", "phr.v.", "to become happier or to make someone happier", "She brought him flowers to cheer him up."], ["calm down", "phr.v.", "to become less angry, upset, or excited", "He needed a few minutes to calm down after the argument."], ["bottle up", "phr.v.", "to suppress emotions rather than expressing them", "He tends to bottle up his feelings instead of talking about them."], ["lose your temper", "colloc.", "to suddenly become very angry", "She lost her temper and shouted at the whole team."], ["keep your cool", "idiom", "to stay calm in a difficult or stressful situation", "She kept her cool even when the client started shouting."], ["over the moon", "idiom", "extremely happy and excited", "She was over the moon when she got the job offer."], ["a bundle of nerves", "idiom", "a person who is extremely anxious or nervous", "I was a bundle of nerves before the presentation."]], "tier2": [["empathy", "n.", "the ability to understand and share another person's feelings", "A good leader needs empathy as much as strategic thinking."], ["resilience", "n.", "the ability to recover from setbacks or adversity", "Her resilience after everything she's been through is remarkable."], ["insecurity", "n.", "a feeling of uncertainty or lack of confidence about oneself", "His arrogance is really just insecurity in disguise."], ["resentment", "n.", "a feeling of bitterness towards someone who has treated you unfairly", "Years of resentment had built up between them."], ["moody", "adj.", "having unpredictable changes of mood, especially towards being irritable", "He can be quite moody \u2014 fine one minute and snapping the next."], ["thick-skinned", "adj.", "not easily hurt or offended by criticism", "You need to be thick-skinned to work in politics."], ["short-tempered", "adj.", "easily angered or irritated", "She gets short-tempered when she's tired."], ["laid-back", "adj.", "calm, relaxed, and not easily worried", "He's very laid-back \u2014 nothing ever seems to bother him."], ["wind up", "phr.v.", "to deliberately annoy or provoke someone", "He loves winding his sister up \u2014 it's his favourite hobby."], ["lash out", "phr.v.", "to suddenly attack someone verbally or physically, often through anger", "She lashed out at her colleague during the meeting."], ["open up", "phr.v.", "to begin to share personal feelings or thoughts", "It took him a long time to open up about what had happened."], ["put on a brave face", "idiom", "to pretend to be happy or confident when you are not", "She put on a brave face but inside she was devastated."], ["have a heart of gold", "idiom", "to be a very kind and generous person despite appearances", "He looks tough, but he's got a heart of gold."], ["wear your heart on your sleeve", "idiom", "to show your emotions openly rather than hiding them", "She's never been able to hide how she feels \u2014 she wears her heart on her sleeve."], ["get on someone's nerves", "idiom", "to irritate or annoy someone", "His constant humming really gets on my nerves."], ["flaky", "adj.", "unreliable and often cancelling plans at the last moment (informal)", "Don't count on him \u2014 he's incredibly flaky."], ["salty", "slang", "feeling bitter or resentful about something, often unfairly", "He's still salty about not getting invited to the party."], ["vibe", "slang", "the general mood or atmosphere of a person, place, or situation", "The restaurant had a really good vibe \u2014 very relaxed."]], "tier3": [["catharsis", "n.", "the process of releasing strong emotions to achieve emotional relief", "Writing the letter was a kind of catharsis \u2014 she felt much better afterwards."], ["stoic", "adj.", "enduring pain or difficulty without showing emotion or complaint", "He remained stoic throughout the ordeal and never once complained."], ["volatile", "adj.", "(of a person) liable to sudden and unpredictable changes in mood", "He's volatile \u2014 you never know whether he'll laugh or explode."], ["magnanimous", "adj.", "generous and forgiving, especially towards someone who has wronged you", "She was magnanimous in victory and praised her opponent."], ["swallow your pride", "idiom", "to do something even though it hurts your dignity", "He swallowed his pride and apologised, even though he felt he was right."], ["a chip on your shoulder", "idiom", "a deep-seated resentment or sense of grievance", "He's had a chip on his shoulder ever since he was passed over for promotion."], ["bite the bullet", "idiom", "to force yourself to do something unpleasant or difficult", "I finally bit the bullet and went to the dentist."], ["turn over a new leaf", "idiom", "to make a fresh start and change your behaviour for the better", "After the incident, he promised to turn over a new leaf."], ["an oddball", "n.", "a person who behaves in an unusual or eccentric way", "He's a bit of an oddball, but everyone loves him."]]},
  CONV_DATA: [{"group": "Describing feelings", "entries": [{"lines": [["A", "<b>How are you feeling today</b>?"], ["B", "A bit out of sorts, to be honest. I didn't sleep well."]], "note": "\"Out of sorts\" = slightly unwell or in a bad mood."}, {"lines": [["A", "You seem really happy \u2014 <b>what's happened</b>?"], ["B", "I got the job! I'm over the moon."]], "note": "\"Over the moon\" = extremely happy and excited."}, {"lines": [["A", "<b>Were you nervous</b> before the presentation?"], ["B", "I was a bundle of nerves. My hands were shaking."]], "note": "\"A bundle of nerves\" = a person who is extremely anxious."}]}, {"group": "Dealing with emotions", "entries": [{"lines": [["A", "<b>How do you cope when you're stressed</b>?"], ["B", "I try not to bottle things up. Talking about it usually helps."]], "note": "\"Bottle up\" = to suppress emotions rather than expressing them."}, {"lines": [["A", "<b>Do you lose your temper easily</b>?"], ["B", "More than I should. I'm trying to keep my cool, especially at work."]], "note": "\"Lose your temper\" = to become very angry. \"Keep your cool\" = to stay calm."}, {"lines": [["A", "He really <b>gets on my nerves</b> sometimes."], ["B", "I know. But he's got a heart of gold underneath all that."]], "note": "\"Get on someone's nerves\" = to irritate. \"A heart of gold\" = a very kind nature."}]}, {"group": "Personality and character", "entries": [{"lines": [["A", "<b>How would you describe yourself</b>?"], ["B", "Laid-back, mostly. It takes a lot to wind me up."]], "note": "\"Laid-back\" = calm and relaxed. \"Wind up\" = to deliberately annoy."}, {"lines": [["A", "<b>Is she always that stubborn</b>?"], ["B", "Always. Once she's made up her mind, there's no changing it."]], "note": "\"Stubborn\" = refusing to change. \"Made up her mind\" = decided firmly."}]}],
},
'work-careers': {
  title: "Work & Careers",
  accent: "#2176FF", accentLight: "#E8EEFF",
  icon: "<rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"></rect><path d=\"M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2\"></path><path d=\"M12 12h.01\"></path><path d=\"M2 12h20\"></path>",
  CATEGORIES: [{"key": "tier1", "label": "Tier 1 \u2014 Essential"}, {"key": "tier2", "label": "Tier 2 \u2014 Intermediate"}, {"key": "tier3", "label": "Tier 3 \u2014 Advanced"}],
  DATA: {"tier1": [["job", "n.", "a paid position of regular employment", "She's been looking for a job since finishing university."], ["work", "n.", "activity involving mental or physical effort done to earn money", "How's work going? \u2014 Busy, but I'm enjoying it."], ["salary", "n.", "a fixed regular payment for employment, usually monthly", "His salary doubled when he moved to the private sector."], ["boss", "n.", "a person's manager or employer", "My boss asked me to stay late to finish the report."], ["colleague", "n.", "a person you work with", "She gets on well with all her colleagues."], ["employee", "n.", "a person who works for someone else in exchange for payment", "The company has over two hundred employees."], ["employer", "n.", "a person or organisation that employs people", "Your employer is legally required to provide a safe working environment."], ["career", "n.", "the series of jobs a person has over their working life", "She's built an impressive career in finance over twenty years."], ["contract", "n.", "a formal agreement between employer and employee", "Always read your contract carefully before signing."], ["interview", "n.", "a formal meeting to assess a candidate for a job", "He was nervous before the interview but it went well."], ["deadline", "n.", "the latest time by which something must be completed", "The deadline is Friday \u2014 there's no time to waste."], ["promotion", "n.", "advancement to a higher position or rank", "She was offered a promotion after just two years."], ["shift", "n.", "a set period of time worked, especially with rotating hours", "She works the night shift three times a week."], ["employed", "adj.", "having a paid job", "She's been fully employed since graduating three years ago."], ["unemployed", "adj.", "without a paid job; out of work", "He's been unemployed for six months and is actively looking."], ["full-time", "adj.", "working or involving the standard number of hours per week", "She's looking for a full-time position in marketing."], ["part-time", "adj.", "working fewer hours than the standard working week", "He works part-time while studying for his degree."], ["apply", "v.", "to formally request to be considered for a job", "I applied for three jobs this week."], ["hire", "v.", "to employ someone for a job", "They're hiring ten new staff for the summer."], ["fire", "v.", "to dismiss someone from their job", "He was fired for repeatedly missing deadlines."], ["quit", "v.", "to leave a job, often without much notice", "She quit her job and went travelling for a year."], ["retire", "v.", "to stop working permanently, usually at a certain age", "He plans to retire at sixty-five."], ["commute", "v.", "to travel regularly between home and work", "She commutes two hours each way by train."], ["take on", "phr.v.", "to accept new work or employ new staff", "The company decided to take on twenty new apprentices."], ["hand in", "phr.v.", "to formally submit something, such as a resignation", "She handed in her notice after ten years at the firm."], ["get the sack", "idiom", "to be dismissed from a job (informal)", "He got the sack after arriving late for the third time."], ["work from home", "colloc.", "to do your job from your house rather than going to an office", "She works from home two days a week."]], "tier2": [["workload", "n.", "the amount of work a person is expected to do", "Her workload has increased significantly since the merger."], ["redundancy", "n.", "the state of being made unemployed because the job is no longer needed", "He was offered voluntary redundancy after the restructure."], ["appraisal", "n.", "a formal assessment of an employee's performance", "Her annual appraisal highlighted strengths and areas for improvement."], ["incentive", "n.", "something that motivates someone to work harder", "A performance bonus is a powerful incentive for staff."], ["vacancy", "n.", "a job or position that is available and needs to be filled", "There are two vacancies in the marketing department."], ["rewarding", "adj.", "providing personal satisfaction or a sense of accomplishment", "She finds working with children deeply rewarding."], ["demanding", "adj.", "requiring a lot of skill, time, or effort", "Teaching can be one of the most demanding jobs there is."], ["self-employed", "adj.", "working for oneself rather than for an employer", "As a freelancer, he has been self-employed for five years."], ["motivated", "adj.", "having a strong desire to do or achieve something", "She's highly motivated and rarely needs to be chased for work."], ["delegate", "v.", "to assign a task to someone else, usually a subordinate", "Good managers know when to delegate."], ["collaborate", "v.", "to work jointly with others on a project or task", "The two departments collaborated closely on the product launch."], ["resign", "v.", "to formally and voluntarily leave a job or position", "She decided to resign after a disagreement with the board."], ["outsource", "v.", "to hire an external company to do work rather than doing it in-house", "Many firms outsource their customer service to reduce costs."], ["burn out", "phr.v.", "to become exhausted through sustained overwork", "He burned out after working eighteen-hour days for two years."], ["lay off", "phr.v.", "to dismiss employees because of lack of work", "The factory laid off two hundred workers due to falling demand."], ["pull your weight", "idiom", "to do your fair share of the work in a team or group", "If everyone pulled their weight, the project would be finished by now."], ["meet a deadline", "colloc.", "to complete work by the required date", "She always meets her deadlines, even under pressure."], ["work your way up", "colloc.", "to advance from a low position through effort", "He worked his way up from intern to managing director."], ["hit the ground running", "idiom", "to begin a new job with great energy and preparation", "The new recruit hit the ground running from day one."], ["jump ship", "idiom", "to leave an organisation, especially to join a rival", "Several engineers jumped ship when the takeover was announced."], ["quiet quitting", "slang", "doing only the minimum required without formally leaving", "Half the team seemed to be quiet quitting after the restructure."]], "tier3": [["sabbatical", "n.", "a period of paid leave for professional development or research", "She took a six-month sabbatical to write her book."], ["turnover", "n.", "the rate at which employees leave a company and are replaced", "High staff turnover is often a sign of poor management."], ["indispensable", "adj.", "absolutely necessary; too valuable to do without", "A good PA can make themselves indispensable within weeks."], ["lucrative", "adj.", "producing a great deal of profit or financial gain", "Investment banking is notoriously lucrative but stressful."], ["conscientious", "adj.", "taking great care to do work thoroughly and correctly", "She is conscientious, always double-checking her reports."], ["headhunt", "v.", "to approach someone employed elsewhere and offer them a job", "He was headhunted by a tech company offering twice his salary."], ["micromanage", "v.", "to control every small detail of a team's work", "Staff morale suffered because the director tended to micromanage."], ["slack off", "phr.v.", "to start working less hard or to become lazy", "People tend to slack off on Fridays, especially in the summer."], ["knock off", "phr.v.", "to stop working, especially at the end of the day (informal)", "What time do you knock off? \u2014 Usually around six."], ["climb the career ladder", "colloc.", "to progress to higher positions in one's career", "He worked hard to climb the career ladder in a competitive industry."], ["carry the can", "idiom", "to take the blame for something, often unfairly", "When the project failed, it was the junior staff who carried the can."], ["a safe pair of hands", "idiom", "a reliable person who can be trusted to handle things well", "They appointed her because she was seen as a safe pair of hands."], ["in the pipeline", "idiom", "being planned or developed but not yet complete", "A new performance review system is in the pipeline."], ["hustle culture", "n.", "the glorification of constant work and side projects as a lifestyle", "She rejected hustle culture and prioritised rest and balance instead."], ["grind culture", "slang", "the glorification of overworking as a badge of honour", "She's pushed back hard against grind culture since burning out."]]},
