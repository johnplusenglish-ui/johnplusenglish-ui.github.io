  CONV_DATA: [{"group": "Asking about work", "entries": [{"lines": [["A", "So, <b>what do you do for a living</b>?"], ["B", "I'm in marketing \u2014 I work for a tech firm in the city."]], "note": "Neutral, works in most social contexts."}, {"lines": [["A", "<b>What line of work are you in</b>, if you don't mind me asking?"], ["B", "I'm in finance, mostly corporate lending."]], "note": "Slightly more formal. Common at networking events."}, {"lines": [["A", "<b>How long have you been doing that</b>?"], ["B", "About eight years now. I started right out of university."]], "note": "Natural follow-up once someone mentions their job."}, {"lines": [["A", "<b>Are you enjoying it</b>?"], ["B", "Mostly, yeah. It can be stressful but it's never boring."]], "note": "More personal than asking about duties. Invites an honest answer."}]}, {"group": "Describing your job", "entries": [{"lines": [["A", "What does your role actually involve?"], ["B", "<b>I'm in charge of</b> the whole onboarding process for new clients."]], "note": "Describes responsibility without needing a job title."}, {"lines": [["A", "What do you actually do day to day?"], ["B", "<b>I deal with</b> customer complaints mostly \u2014 it keeps me on my toes."]], "note": "More natural than \"I am responsible for\" in conversation."}, {"lines": [["A", "Does it ever get repetitive?"], ["B", "Not really \u2014 <b>it's the kind of job where no two days are the same</b>."]], "note": "Fixed expression for conveying variety. Usually said positively."}, {"lines": [["A", "Who do you work for?"], ["B", "Actually, <b>I work for myself</b>. I set up my own consultancy a few years back."]], "note": "Natural way to say you're self-employed or freelance."}]}, {"group": "Workload & stress", "entries": [{"lines": [["A", "Can you take on the Henderson account?"], ["B", "I'd love to but <b>I've got a lot on my plate</b> right now."]], "note": "Very common idiom for being busy or overwhelmed."}, {"lines": [["A", "Hey, <b>how's work going</b>?"], ["B", "Honestly? Pretty hectic. We're right in the middle of a big project."]], "note": "Casual check-in between colleagues or friends."}, {"lines": [["A", "You look tired. Everything alright?"], ["B", "Yeah, it's just <b>been full-on lately</b>. I'm hoping things calm down next month."]], "note": "\"Full-on\" = very busy or intense. Informal, common in British English."}, {"lines": [["A", "Any holiday plans?"], ["B", "Not yet, but <b>I could really do with a break</b> \u2014 it's been a long year."]], "note": "\"Could do with\" = would really benefit from. Common in British English."}]}, {"group": "Career moves & changes", "entries": [{"lines": [["A", "Are you happy where you are?"], ["B", "Not really. <b>I'm thinking of moving on</b> \u2014 I feel like I've hit a ceiling."]], "note": "Polite, indirect way to say you're considering leaving."}, {"lines": [["A", "Why are you applying for this role?"], ["B", "Honestly, <b>I'm looking for a change</b>. I've been in my current role for five years."]], "note": "Signals dissatisfaction without being too direct."}, {"lines": [["A", "Did you get it?"], ["B", "I did! <b>It's a step up</b> from what I'm doing now, which is exciting but a bit daunting."]], "note": "A \"step up\" = a move to a higher-level position."}, {"lines": [["A", "I heard you left the company. What happened?"], ["B", "<b>I got made redundant</b>. The whole department was restructured."]], "note": "British English for being laid off. Not the same as being fired."}]}, {"group": "Workplace small talk", "entries": [{"lines": [["A", "<b>How did the meeting go</b>?"], ["B", "Better than expected, actually. They seemed pretty happy with the proposal."]], "note": "Very common office phrase for a quick debrief."}, {"lines": [["A", "<b>Did you manage to get it sorted</b>?"], ["B", "Eventually, yeah. It took longer than it should have."]], "note": "\"Sorted\" = dealt with, resolved. Very common in informal British English."}, {"lines": [["A", "<b>Can we push the Tuesday call back</b> to Thursday?"], ["B", "That works for me. I'll send a new invite."]], "note": "\"Push back\" = delay. Standard in professional settings."}, {"lines": [["A", "We're running short on time."], ["B", "Fair enough \u2014 <b>let's loop back on that</b> in the next meeting."]], "note": "Corporate jargon for returning to something later. Use with awareness of register."}]}],
},
'money-finance': {
  title: "Money & Finance",
  accent: "#2A9D8F", accentLight: "#E0F5F2",
  icon: "<line x1=\"12\" y1=\"1\" x2=\"12\" y2=\"23\"></line><path d=\"M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6\"></path>",
  CATEGORIES: [{"key": "tier1", "label": "Tier 1 \u2014 Essential"}, {"key": "tier2", "label": "Tier 2 \u2014 Intermediate"}, {"key": "tier3", "label": "Tier 3 \u2014 Advanced"}],
  DATA: {"tier1": [["debt", "n.", "money owed to another person, company, or institution", "She graduated with over thirty thousand euros of debt."], ["savings", "n.", "money set aside and not spent, usually kept in a bank", "He used his savings to put a deposit on a flat."], ["income", "n.", "money received regularly from work, investments, or benefits", "Her monthly income barely covers the rent and bills."], ["mortgage", "n.", "a long-term loan used to buy a property", "They took out a thirty-year mortgage on the house."], ["budget", "n.", "a plan for how money will be spent over a period", "We need to stick to a strict budget this month."], ["bill", "n.", "a written statement of charges for goods or services", "The electricity bill was much higher than expected."], ["tax", "n.", "money paid to the government from income, purchases, or property", "Income tax rates vary depending on how much you earn."], ["affordable", "adj.", "cheap enough for most people to buy", "Housing in the city centre is no longer affordable for young people."], ["broke", "adj.", "having no money at all (informal)", "I can't come out tonight \u2014 I'm completely broke."], ["overpriced", "adj.", "costing more than it is worth", "The restaurant was overpriced and the food was mediocre."], ["earn", "v.", "to receive money in return for work or services", "She earns a good salary but spends most of it on rent."], ["afford", "v.", "to have enough money to pay for something", "They can't afford to go on holiday this year."], ["owe", "v.", "to be required to pay money to someone", "He still owes me fifty euros from last month."], ["save up", "phr.v.", "to gradually accumulate money for a specific purpose", "She's saving up for a trip to Japan."], ["pay off", "phr.v.", "to finish paying a debt in full", "It took her five years to pay off her student loan."], ["pay back", "phr.v.", "to return money that was borrowed", "I'll pay you back on Friday, I promise."], ["cost a fortune", "colloc.", "to be extremely expensive", "The repairs cost a fortune \u2014 nearly three thousand euros."], ["make ends meet", "idiom", "to have just enough money to cover basic living expenses", "Many families are struggling to make ends meet."], ["live from hand to mouth", "idiom", "to spend all your money on immediate needs with nothing left over", "After losing his job, he was living from hand to mouth for months."], ["get by", "phr.v.", "to manage to survive or live on very little money", "It's tough, but we get by on what we earn."]], "tier2": [["inflation", "n.", "a general increase in prices and fall in the purchasing value of money", "Inflation has pushed the cost of groceries up by fifteen per cent."], ["interest rate", "n.", "the percentage charged by a bank for borrowing money, or paid on savings", "The central bank raised interest rates to combat inflation."], ["investment", "n.", "money put into something with the expectation of future profit", "Property is still seen as a safe long-term investment."], ["recession", "n.", "a period of significant economic decline", "The country entered a deep recession after the financial crisis."], ["expenditure", "n.", "the total amount of money spent over a period", "Government expenditure on healthcare has doubled in ten years."], ["disposable income", "n.", "the money a person has left after paying taxes and essential costs", "With rising rents, young people have very little disposable income."], ["frugal", "adj.", "spending money very carefully and avoiding waste", "She's naturally frugal \u2014 she never buys anything she doesn't need."], ["lucrative", "adj.", "producing a great deal of profit", "The consulting contract proved extremely lucrative."], ["cut back on", "phr.v.", "to reduce spending or consumption of something", "We've had to cut back on eating out since the bills went up."], ["put aside", "phr.v.", "to save money regularly for future use", "She puts aside two hundred euros a month for emergencies."], ["rip off", "phr.v.", "to charge someone far too much for something (informal)", "Twenty euros for a coffee? We got completely ripped off."], ["splash out", "phr.v.", "to spend a lot of money on something, especially a treat", "He splashed out on a weekend in Paris for her birthday."], ["tighten your belt", "idiom", "to spend less money because you have less available", "With the new baby, they've had to tighten their belts."], ["money doesn't grow on trees", "idiom", "used to say that money is limited and should not be wasted", "I can't buy you everything \u2014 money doesn't grow on trees."], ["cost an arm and a leg", "idiom", "to be extremely expensive", "The hotel was beautiful but it cost an arm and a leg."], ["break the bank", "idiom", "to be very expensive; to use up all your money", "A weekend away doesn't have to break the bank."], ["skint", "slang", "having no money at all (British informal)", "I can't come out tonight \u2014 I'm completely skint."], ["a rip-off", "slang", "something that is outrageously overpriced", "Eight euros for a coffee? What a rip-off."]], "tier3": [["austerity", "n.", "a policy of reduced government spending and economic restriction", "Years of austerity left public services severely underfunded."], ["equity", "n.", "the value of a property minus any debt owed on it; also fairness", "They've built up a lot of equity in the house over twenty years."], ["insolvency", "n.", "the state of being unable to pay debts", "The company was on the brink of insolvency before the bailout."], ["solvent", "adj.", "having enough money to pay all debts", "The business is profitable and fully solvent."], ["exorbitant", "adj.", "unreasonably and shockingly high in price", "The rent in central London is exorbitant."], ["squander", "v.", "to waste money or resources carelessly", "He squandered his inheritance in less than two years."], ["bail out", "phr.v.", "to rescue a person or organisation from financial difficulty", "The government bailed out the banks during the crisis."], ["a nest egg", "idiom", "a sum of money saved for the future", "She built up a comfortable nest egg over the years."], ["throw money down the drain", "idiom", "to waste money on something worthless", "Paying for that gym membership was throwing money down the drain."]]},
  CONV_DATA: [{"group": "Everyday money talk", "entries": [{"lines": [["A", "<b>How do you manage your money</b>?"], ["B", "I try to put aside a bit each month, but it's hard with the bills."]], "note": "\"Put aside\" = to save regularly for future use."}, {"lines": [["A", "<b>Do you stick to a budget</b>?"], ["B", "I try. We've had to tighten our belts since the rent went up."]], "note": "\"Tighten your belt\" = to spend less because you have less money."}, {"lines": [["A", "<b>Are you a saver or a spender</b>?"], ["B", "A spender, unfortunately. Money burns a hole in my pocket."]], "note": "\"Burns a hole in your pocket\" = makes you want to spend it immediately."}]}, {"group": "Cost of living", "entries": [{"lines": [["A", "<b>Have you noticed prices going up</b>?"], ["B", "Everything's gone through the roof. The weekly shop costs a fortune now."]], "note": "\"Gone through the roof\" = increased dramatically. \"Cost a fortune\" = be very expensive."}, {"lines": [["A", "<b>How do people manage on a low income</b>?"], ["B", "A lot of families are struggling to make ends meet."]], "note": "\"Make ends meet\" = to have just enough money to cover basic needs."}, {"lines": [["A", "I'm completely <b>skint</b> until payday."], ["B", "Same. I've been living off pasta for three days."]], "note": "\"Skint\" (British slang) = having no money at all."}]}, {"group": "Big purchases and debt", "entries": [{"lines": [["A", "<b>Are you thinking about buying a flat</b>?"], ["B", "I'd love to, but a mortgage feels terrifying. The deposits cost an arm and a leg."]], "note": "\"Cost an arm and a leg\" = to be extremely expensive."}, {"lines": [["A", "<b>Do you have any debt</b>?"], ["B", "Student loan, mostly. I'm paying it off slowly but it'll take years."]], "note": "\"Pay off\" = to finish paying a debt in full."}]}],
},
'education-learning': {
  title: "Education & Learning",
  accent: "#2E86AB", accentLight: "#E0F0F8",
  icon: "<path d=\"M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z\"></path><path d=\"M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z\"></path>",
  CATEGORIES: [{"key": "tier1", "label": "Tier 1 \u2014 Essential"}, {"key": "tier2", "label": "Tier 2 \u2014 Intermediate"}, {"key": "tier3", "label": "Tier 3 \u2014 Advanced"}],
  DATA: {"tier1": [["degree", "n.", "a qualification awarded by a university after completing a course of study", "She has a degree in economics from the University of Barcelona."], ["curriculum", "n.", "the subjects and content taught in a school or course", "The national curriculum has been updated to include coding."], ["exam", "n.", "a formal test of knowledge or ability", "She passed all her exams with top marks."], ["tuition", "n.", "teaching or instruction, especially at a university; also the fees charged", "Tuition fees have risen dramatically in the last decade."], ["grades", "n.", "marks awarded for academic work or exams", "Her grades improved significantly after she started tutoring."], ["scholarship", "n.", "a financial award given to a student based on academic merit or need", "He won a scholarship to study abroad."], ["lecture", "n.", "a formal talk given to a group of students at a university", "The lecture on climate policy was standing room only."], ["compulsory", "adj.", "required by law or rule; mandatory", "Maths and English are compulsory subjects until the age of sixteen."], ["academic", "adj.", "relating to education, schools, or scholarly work", "Her academic record is outstanding."], ["gifted", "adj.", "having exceptional natural ability or talent", "The programme is designed for gifted children who need extra challenge."], ["study", "v.", "to spend time learning about a subject", "She studied medicine at university for six years."], ["graduate", "v.", "to successfully complete a degree or course of study", "He graduated with honours in 2019."], ["revise", "v.", "to review and study material again in preparation for an exam", "She revised for three weeks solid before the finals."], ["drop out", "phr.v.", "to leave a course or school before finishing", "He dropped out of university in his second year."], ["catch up", "phr.v.", "to reach the same level as others after falling behind", "She missed two weeks and struggled to catch up."], ["pick up", "phr.v.", "to learn something informally and without deliberate study", "He picked up Spanish just from living in Madrid."], ["sit an exam", "colloc.", "to take or attempt a formal examination", "She's sitting her final exams next month."], ["learn by heart", "colloc.", "to memorise something so you can repeat it exactly", "We had to learn the poem by heart for homework."]], "tier2": [["literacy", "n.", "the ability to read and write", "Adult literacy rates remain low in some rural areas."], ["syllabus", "n.", "a document outlining the topics covered in a course", "The syllabus was published at the start of the semester."], ["dissertation", "n.", "a long piece of academic writing on a specific topic, usually for a degree", "She spent a year researching and writing her dissertation."], ["vocational", "adj.", "relating to practical skills and training for a specific job", "Vocational courses in plumbing and electrical work are increasingly popular."], ["hands-on", "adj.", "involving practical experience rather than just theory", "The course is very hands-on \u2014 you're in the workshop from day one."], ["knowledgeable", "adj.", "having a lot of knowledge; well-informed", "She's incredibly knowledgeable about European history."], ["enrol", "v.", "to officially register for a course or institution", "She enrolled on a part-time MBA programme."], ["cram", "v.", "to study intensively in a short period, usually just before an exam", "He crammed the night before and somehow passed."], ["brush up on", "phr.v.", "to improve or refresh knowledge or a skill you already have", "She brushed up on her French before the trip to Paris."], ["fall behind", "phr.v.", "to fail to keep up with others in progress or work", "He fell behind after missing a week of classes."], ["knuckle down", "phr.v.", "to start working or studying hard and seriously", "She knew she had to knuckle down if she wanted to pass."], ["a steep learning curve", "colloc.", "a situation where you have to learn a lot in a short time", "Starting the new job was a steep learning curve but she adapted quickly."], ["teacher's pet", "idiom", "a student who is the teacher's favourite, often used negatively", "He was always the teacher's pet \u2014 sat at the front and answered every question."], ["learn the ropes", "idiom", "to learn how a particular task or job works", "It took a few weeks to learn the ropes, but she got there."], ["swot", "slang", "a person who studies excessively; also to study hard (British informal)", "She's such a swot \u2014 she's always in the library."], ["bunk off", "slang", "to skip school or a class without permission (British informal)", "He used to bunk off PE and hide in the toilets."]], "tier3": [["pedagogy", "n.", "the theory and practice of teaching", "Modern pedagogy emphasises student-centred learning over rote memorisation."], ["tenure", "n.", "the right to hold a permanent academic position", "She was granted tenure after ten years of research and publishing."], ["meritocracy", "n.", "a system in which advancement is based on ability and achievement", "The university claims to be a meritocracy, but privilege still plays a role."], ["autodidact", "n.", "a person who is self-taught", "He never went to university \u2014 he's a complete autodidact."], ["rote", "adj.", "involving mechanical repetition without understanding", "Rote learning can help with memorisation but not with critical thinking."], ["nurture", "v.", "to encourage and support the development of a skill or talent", "Good teachers nurture curiosity rather than just delivering content."], ["hit the books", "idiom", "to begin studying hard", "She hit the books as soon as the exam dates were announced."], ["school of hard knocks", "idiom", "real-life experience rather than formal education", "He didn't go to university \u2014 he graduated from the school of hard knocks."]]},
  CONV_DATA: [{"group": "Talking about studying", "entries": [{"lines": [["A", "<b>How did you find university</b>?"], ["B", "The first year was a steep learning curve, but I loved it by the end."]], "note": "\"A steep learning curve\" = a situation where you have to learn a lot quickly."}, {"lines": [["A", "<b>Did you revise much</b> for your exams?"], ["B", "I crammed the week before, honestly. Not ideal but it worked."]], "note": "\"Cram\" = to study intensively in a short period before an exam."}, {"lines": [["A", "<b>Do you think grades really matter</b>?"], ["B", "They open doors, but once you're working, experience matters more."]], "note": "\"Open doors\" = to create opportunities."}]}, {"group": "Education systems", "entries": [{"lines": [["A", "<b>Do you think university should be free</b>?"], ["B", "Ideally, yes. Tuition fees put a lot of people off."]], "note": "\"Put someone off\" = to discourage someone from doing something."}, {"lines": [["A", "<b>What's your opinion on vocational courses</b>?"], ["B", "They're undervalued. Not everyone needs a degree to have a good career."]], "note": "\"Undervalued\" = not given enough recognition or importance."}, {"lines": [["A", "<b>Were you a swot at school</b>?"], ["B", "A bit, yeah. I always had my nose in a book."]], "note": "\"A swot\" (slang) = someone who studies excessively. \"Nose in a book\" = always reading."}]}, {"group": "Lifelong learning", "entries": [{"lines": [["A", "<b>Have you ever gone back to studying</b> as an adult?"], ["B", "I enrolled on an online course last year. It's never too late to learn."]], "note": "\"Enrol on\" = to officially register for a course."}, {"lines": [["A", "<b>How do you pick up new skills</b>?"], ["B", "Mostly YouTube, to be honest. You can learn the ropes of almost anything online."]], "note": "\"Pick up\" = to learn informally. \"Learn the ropes\" = to learn how something works."}]}],
},

  CATEGORIES: [{"key": "tier1", "label": "Tier 1 \u2014 Essential"}, {"key": "tier2", "label": "Tier 2 \u2014 Intermediate"}, {"key": "tier3", "label": "Tier 3 \u2014 Advanced"}],
  DATA: {"tier1": [["device", "n.", "a piece of electronic equipment such as a phone, tablet, or laptop", "She forgot her device at home and couldn't check her emails."], ["app", "n.", "a software application, especially one downloaded onto a phone", "There's an app for almost everything these days."], ["software", "n.", "programs and operating systems used by a computer", "The software needs updating \u2014 it's running very slowly."], ["network", "n.", "a system of connected computers, servers, or devices", "The whole office network went down for two hours."], ["password", "n.", "a secret word or string of characters used to gain access to a system", "She changed her password after the security breach."], ["data", "n.", "information stored or processed by a computer", "All the data is backed up to the cloud automatically."], ["screen", "n.", "the flat display surface of a phone, computer, or television", "He stared at the screen for so long his eyes began to hurt."], ["connection", "n.", "a link between a device and the internet or another device", "The connection is terrible out here \u2014 barely one bar."], ["battery", "n.", "the power source in a portable device", "My battery is nearly dead \u2014 have you got a charger?"], ["update", "n.", "a new version of software that improves or fixes the existing version", "There's a system update available \u2014 you should install it."], ["virus", "n.", "malicious software designed to damage or disrupt a computer system", "His laptop got a virus after he opened a suspicious email."], ["online", "adj.", "connected to the internet; happening over the internet", "She does most of her shopping online now."], ["wireless", "adj.", "using radio waves rather than cables to transmit data", "The whole building has wireless internet access."], ["digital", "adj.", "relating to data stored or transmitted electronically", "He prefers a digital calendar to a paper one."], ["search", "v.", "to look for information online using a search engine", "She searched online for reviews before buying."], ["download", "v.", "to transfer data from the internet to your device", "He downloaded the app and set it up in five minutes."], ["upload", "v.", "to transfer data from your device to the internet or a server", "She uploaded the photos to the shared folder."], ["charge", "v.", "to supply a device with electrical power", "I forgot to charge my phone overnight and it died this morning."], ["log in", "phr.v.", "to enter your username and password to access a system or account", "I couldn't log in because I'd forgotten my password."], ["log out", "phr.v.", "to end a session by signing out of a system", "Always log out when using a shared computer."], ["plug in", "phr.v.", "to connect a device to a power supply or another device", "Plug in the charger and leave it overnight."], ["set up", "phr.v.", "to install and configure a device or application", "It took him about ten minutes to set up the new router."], ["sign up", "phr.v.", "to register for an online account or service", "She signed up for the newsletter and immediately regretted it."], ["lose signal", "colloc.", "to lose mobile or internet connectivity", "We kept losing signal as the train went through the tunnel."], ["run out of battery", "colloc.", "(of a device) to have no power remaining", "Her phone ran out of battery just as they were trying to find the address."]], "tier2": [["algorithm", "n.", "a set of rules a computer follows to solve a problem or complete a task", "The recommendation algorithm learns from what you watch."], ["browser", "n.", "a program used to access and navigate the internet", "She cleared her browser history and cache."], ["cache", "n.", "temporary data stored to speed up access to frequently used content", "Clearing the cache sometimes fixes loading problems."], ["interface", "n.", "the visual layout through which a user interacts with software", "The new interface is much cleaner and easier to navigate."], ["server", "n.", "a computer that provides data and services to other computers on a network", "The server crashed, taking the whole website down with it."], ["platform", "n.", "a software environment or online service on which applications run", "The platform launched a new creator monetisation scheme."], ["bandwidth", "n.", "the capacity of a network connection to transmit data", "Streaming in HD uses a lot of bandwidth."], ["notification", "n.", "an automatic alert from an app or system about new activity", "He turned off all his notifications to focus on work."], ["glitch", "n.", "a small software or hardware fault causing unexpected behaviour", "There was a glitch in the checkout process and the payment failed."], ["backup", "n.", "a copy of data stored separately in case the original is lost", "Always keep a backup of important files."], ["subscription", "n.", "a recurring payment for access to a digital service", "She cancelled her subscription after the price went up."], ["laggy", "adj.", "slow to respond, especially due to a weak connection or overloaded system", "The game was really laggy \u2014 the connection couldn't handle it."], ["stream", "v.", "to watch or listen to media content over the internet without downloading it", "They streamed the concert live from their living room."], ["hack", "v.", "to gain unauthorised access to a computer system", "Someone tried to hack into her email account."], ["crash", "v.", "(of software or hardware) to stop working suddenly", "The app kept crashing every time she tried to open it."], ["sync", "v.", "to ensure data is identical across multiple devices or platforms", "Your contacts sync automatically across all your devices."], ["automate", "v.", "to make a process run automatically without manual input", "They automated the data entry process to save time."], ["scroll", "v.", "to move up or down through content on a screen", "She scrolled through her feed for twenty minutes without realising."], ["back up", "phr.v.", "to make a copy of data to prevent it from being lost", "Make sure you back up your files before updating the system."], ["switch off", "phr.v.", "to turn off a device; also to stop thinking about work and relax", "She found it impossible to switch off in the evenings."], ["cut out", "phr.v.", "(of a signal or connection) to stop suddenly and unexpectedly", "The call kept cutting out \u2014 the signal was terrible."], ["freeze", "v.", "(of a device or screen) to stop responding and become unresponsive", "My laptop froze in the middle of saving and I lost everything."], ["go viral", "colloc.", "to spread rapidly and widely on the internet", "The video went viral overnight and had ten million views by morning."], ["digital detox", "colloc.", "a period of deliberately avoiding all electronic devices and screens", "She did a full digital detox for a week and said it changed her life."], ["OTP", "n.", "a one-time password; a single-use code sent to verify your identity", "Enter the OTP that was sent to your phone to complete the login."], ["ghost", "slang", "to suddenly stop responding to someone online without explanation", "He ghosted her after three months of messaging."], ["doomscroll", "slang", "to compulsively scroll through negative news or social media", "She found herself doomscrolling late into the night."], ["catfish", "slang", "to create a fake online identity to deceive others", "She was catfished by someone pretending to be a photographer."]], "tier3": [["cybersecurity", "n.", "the practice of protecting systems and networks from digital attacks", "The company invested heavily in cybersecurity after the data breach."], ["artificial intelligence", "n.", "computer systems able to perform tasks that normally require human intelligence", "Artificial intelligence is transforming how we interact with technology."], ["machine learning", "n.", "a branch of AI where systems learn from data without being explicitly programmed", "The spam filter uses machine learning to improve over time."], ["cloud computing", "n.", "the delivery of computing services over the internet rather than local hardware", "Most of their infrastructure has moved to cloud computing."], ["roll out", "phr.v.", "to gradually release a new product, feature, or update to users", "The update will be rolled out to all users over the next two weeks."], ["opt out", "phr.v.", "to choose not to participate in a system or data-sharing agreement", "You can opt out of data collection in the privacy settings."]]},
  CONV_DATA: [{"group": "Talking about devices and tech habits", "entries": [{"lines": [["A", "<b>Are you glued to your phone</b> as much as everyone else these days?"], ["B", "Honestly, yes. I try to put it down after nine but I always end up picking it back up."]], "note": "\"Glued to your phone\" = unable to stop using it. Very natural, slightly judgmental phrase."}, {"lines": [["A", "<b>What do you use it for mostly</b>?"], ["B", "Podcasts, mainly. And I check the news obsessively \u2014 probably too much."]], "note": "Simple open question. Invites a natural, extended response."}, {"lines": [["A", "<b>Do you pay for any subscriptions</b>?"], ["B", "Too many. I keep meaning to cancel half of them but never get round to it."]], "note": "\"Get round to\" = find the time to do something. Very common in this context."}, {"lines": [["A", "<b>Do you use the cloud for everything</b>?"], ["B", "Pretty much. It means I can access my files from any device."]], "note": "\"Pretty much\" = more or less, almost entirely. Very common informal qualifier."}]}, {"group": "Tech problems", "entries": [{"lines": [["A", "My laptop keeps <b>crashing</b> \u2014 it's driving me mad."], ["B", "Have you tried clearing the cache? That usually fixes it."]], "note": "\"Driving me mad\" = making me very frustrated. Very common with tech problems."}, {"lines": [["A", "I <b>can't log in</b> \u2014 it's saying my password is wrong."], ["B", "Did you try resetting it? The link goes to your email."]], "note": "Basic but essential \u2014 very common support/help desk language."}, {"lines": [["A", "The app just <b>glitched</b> and deleted everything I'd typed."], ["B", "Nightmare. I always copy text before submitting anything important now."]], "note": "\"Glitch\" used as a verb is now very common in informal tech talk."}, {"lines": [["A", "My signal is terrible here."], ["B", "Try turning <b>aeroplane mode</b> on and off \u2014 it sometimes forces a reconnect."]], "note": "\"Turn on/off\" and \"force a reconnect\" \u2014 practical, natural troubleshooting language."}]}, {"group": "Social media and online life", "entries": [{"lines": [["A", "Did you see that video <b>going viral</b>?"], ["B", "The one with the dog? It had thirty million views by this morning."]], "note": "\"Go viral\" is now standard everyday vocabulary, not just tech jargon."}, {"lines": [["A", "He completely <b>ghosted</b> me after we matched on the app."], ["B", "That's so common now. People just disappear without a word."]], "note": "\"Ghost\" as a verb. Originally dating app slang, now used in any context."}, {"lines": [["A", "I've been trying to <b>doomscroll</b> less \u2014 it's affecting my sleep."], ["B", "Same. I put my phone in another room at ten and it's made a real difference."]], "note": "\"Doomscroll\" is now widely understood, especially among younger speakers."}, {"lines": [["A", "<b>Do you post much on social media</b>?"], ["B", "Not really. I mostly just lurk \u2014 I prefer reading to posting."]], "note": "\"Lurk\" = read/observe without participating. Common internet vocabulary."}]}, {"group": "AI and the future", "entries": [{"lines": [["A", "<b>What do you think about AI</b>? Are you worried about it?"], ["B", "It depends. For creative work, yes. But for repetitive tasks, it's genuinely useful."]], "note": "Open opinion question. Expect disagreement \u2014 good for debate practice."}, {"lines": [["A", "<b>Do you use any AI tools</b> in your work?"], ["B", "I use one to help me draft emails. It saves me about an hour a day, honestly."]], "note": "Practical angle. Most students now have some experience with AI tools."}, {"lines": [["A", "Are you worried about AI <b>taking over jobs</b>?"], ["B", "Some jobs, yes. But I think new ones will emerge \u2014 that's what always happens with technology."]], "note": "\"Take over\" + jobs. Common phrase in AI / future of work discussions."}]}],
},
'media-news': {
  title: "Media & News",
  accent: "#E07A5F", accentLight: "#FCEEE9",
  icon: "<path d=\"M4 11a9 9 0 019-9\"></path><path d=\"M4 4a16 16 0 0116 16\"></path><circle cx=\"5\" cy=\"19\" r=\"2\"></circle>",
  CATEGORIES: [{"key": "tier1", "label": "Tier 1 \u2014 Essential"}, {"key": "tier2", "label": "Tier 2 \u2014 Intermediate"}, {"key": "tier3", "label": "Tier 3 \u2014 Advanced"}],
  DATA: {"tier1": [["headline", "n.", "the title of a newspaper article, printed in large letters", "The headline read: \"Prime Minister Resigns After Scandal.\""], ["article", "n.", "a piece of writing about a topic in a newspaper, magazine, or online", "She read an interesting article about sleep science."], ["report", "n.", "a factual account of an event or investigation published or broadcast", "The report revealed widespread corruption in the industry."], ["press", "n.", "newspapers and journalists considered collectively", "The press has been highly critical of the government's response."], ["source", "n.", "a person, book, or document that provides information", "The journalist refused to reveal her source."], ["broadcast", "n.", "a programme transmitted by television or radio", "The emergency broadcast warned people to stay indoors."], ["viral", "adj.", "(of content) spread rapidly and widely online", "The clip went viral within hours of being posted."], ["breaking", "adj.", "(of news) newly happening and being reported for the first time", "We interrupt this programme to bring you breaking news."], ["biased", "adj.", "unfairly favouring one side over another", "The coverage was clearly biased towards the ruling party."], ["publish", "v.", "to make information available to the public in print or online", "The paper published the story despite threats from the company."], ["share", "v.", "to post or forward content on social media", "She shared the article without reading past the headline."], ["keep up with", "phr.v.", "to stay informed about current events or developments", "I try to keep up with the news but it's overwhelming."], ["spread like wildfire", "idiom", "to become known very quickly by many people", "The rumour spread like wildfire across social media."]], "tier2": [["coverage", "n.", "the way an event or topic is reported in the media", "The media coverage of the trial was excessive."], ["circulation", "n.", "the number of copies of a newspaper or magazine sold", "The paper's circulation has fallen by half in ten years."], ["censorship", "n.", "the suppression of information considered harmful or sensitive", "Censorship of the press is a serious threat to democracy."], ["tabloid", "n.", "a newspaper that focuses on sensational stories and celebrity gossip", "The tabloids ran the story on their front pages for a week."], ["credible", "adj.", "able to be believed or trusted as accurate", "Only information from credible sources should be shared."], ["sensationalist", "adj.", "presenting information in a way designed to shock or excite", "The reporting was sensationalist and lacked any real evidence."], ["misleading", "adj.", "giving a false or inaccurate impression", "The headline was deliberately misleading."], ["play down", "phr.v.", "to make something seem less important or serious than it is", "The government tried to play down the severity of the crisis."], ["blow out of proportion", "phr.v.", "to exaggerate the importance or seriousness of something", "The whole thing was blown completely out of proportion by the media."], ["fact-check", "v.", "to verify the accuracy of claims before publishing", "Every claim in the article was thoroughly fact-checked."], ["fake news", "colloc.", "false or misleading information presented as genuine reporting", "Social media has made it harder to distinguish fake news from real news."], ["freedom of the press", "colloc.", "the right of journalists to report without government interference", "Freedom of the press is a cornerstone of any democracy."], ["take with a pinch of salt", "idiom", "to not fully believe something because it may be exaggerated", "Anything you read in the tabloids should be taken with a pinch of salt."], ["no smoke without fire", "idiom", "if something is being said, there is probably some truth to it", "I'm not sure I believe all of it, but there's no smoke without fire."], ["clickbait", "slang", "online content with a misleading headline designed   CONV_DATA: [{"group": "News and media habits", "entries": [{"lines": [["A", "<b>How do you keep up with the news</b>?"], ["B", "Mostly online. I scroll through a couple of apps in the morning."]], "note": "\"Keep up with\" = to stay informed about current events."}, {"lines": [["A", "<b>Do you trust the media</b>?"], ["B", "Some outlets more than others. You have to take a lot of it with a pinch of salt."]], "note": "\"Take with a pinch of salt\" = to not fully believe something."}, {"lines": [["A", "<b>Do you think the news is too negative</b>?"], ["B", "Definitely. It's all doom and gloom \u2014 no wonder people switch off."]], "note": "\"Doom and gloom\" = a feeling of hopelessness. \"Switch off\" = to stop paying attention."}]}, {"group": "Social media and misinformation", "entries": [{"lines": [["A", "<b>Do you worry about fake news</b>?"], ["B", "A lot, actually. It spreads like wildfire before anyone fact-checks it."]], "note": "\"Spread like wildfire\" = to become known very quickly. \"Fact-check\" = to verify accuracy."}, {"lines": [["A", "<b>Have you ever fallen for clickbait</b>?"], ["B", "More times than I'd like to admit. The headlines are designed to mislead."]], "note": "\"Clickbait\" (slang) = content with misleading headlines to attract clicks."}, {"lines": [["A", "<b>What do you think about online trolls</b>?"], ["B", "They're a real problem. The anonymity brings out the worst in people."]], "note": "\"Troll\" (slang) = someone who posts provocative content to upset others."}]}],
},

  DATA: {"tier1": [["poverty", "n.", "the state of being extremely poor", "Child poverty has risen sharply in the last decade."], ["equality", "n.", "the state of being equal in rights, status, and opportunities", "Gender equality remains a major issue in many workplaces."], ["crime", "n.", "an illegal act punishable by law", "Petty crime tends to increase during economic downturns."], ["community", "n.", "a group of people living in the same area or sharing common interests", "The local community came together to support the families affected."], ["rights", "n.", "legal or moral entitlements that every person should have", "Everyone has the right to free speech."], ["discrimination", "n.", "unfair treatment of a person or group based on prejudice", "Discrimination on the basis of age is illegal in most countries."], ["protest", "n.", "a public demonstration expressing disapproval of something", "Thousands took to the streets in protest against the new law."], ["homeless", "adj.", "without a permanent place to live", "The charity provides meals for homeless people every evening."], ["vulnerable", "adj.", "at risk of harm or in need of special care or protection", "Elderly people living alone are particularly vulnerable."], ["fair", "adj.", "treating people equally and without bias", "The system isn't fair \u2014 it favours those who can afford lawyers."], ["ban", "v.", "to officially prohibit something", "The government has banned single-use plastic bags."], ["vote", "v.", "to formally indicate a choice in an election or decision", "She voted for the first time when she turned eighteen."], ["donate", "v.", "to give money or goods to a charity or cause", "He donates ten per cent of his salary to charity every month."], ["speak out", "phr.v.", "to publicly express your opinion, especially about injustice", "More people are speaking out against workplace harassment."], ["stand up for", "phr.v.", "to defend or support a person, belief, or principle", "She always stands on to stop or punish something", "Police have cracked down on drug dealing in the area."], ["bring about", "phr.v.", "to cause something to happen, especially change", "The protests brought about a change in government policy."], ["raise awareness", "colloc.", "to help people understand an issue they may not know about", "The campaign raised awareness of mental health in schools."], ["bridge the gap", "idiom", "to reduce the difference between two groups or things", "Education is the best way to bridge the gap between rich and poor."], ["a level playing field", "idiom", "a situation where everyone has an equal chance", "All we're asking for is a level playing field."], ["the tip of the iceberg", "idiom", "a small visible part of a much larger hidden problem", "The cases we hear about are just the tip of the iceberg."], ["a hot topic", "colloc.", "a subject that is widely discussed and often controversial", "Immigration has always been a hot topic in election campaigns."], ["woke", "slang", "aware of and actively attentive to social and racial justice issues", "The term woke has become politically charged in recent years."], ["cancel culture", "slang", "the practice of publicly rejecting or boycotting someone for offensive behaviour", "Cancel culture is one of the most divisive topics in modern debate."]], "tier3": [["systemic", "adj.", "relating to or affecting an entire system rather than individual parts", "Systemic racism cannot be solved by individual acts of kindness alone."], ["disenfranchised", "adj.", "deprived of rights or power, especially the right to vote", "Many young people feel disenfranchised by the political system."], ["grassroots", "adj.", "driven by ordinary people at a local level rather than by leaders", "The movement started as a grassroots campaign and grew into a national force."], ["advocate", "v.", "to publicly support or recommend a cause or policy", "She advocates for prison reform and rehabilitation over punishment."], ["perpetuate", "v.", "to cause something undesirable to continue indefinitely", "The media can perpetuate harmful stereotypes without realising it."], ["phase out", "phr.v.", "to gradually stop using or providing something", "The subsidy is being phased out over the next three years."], ["sweep under the carpet", "idiom", "to hide a problem or scandal rather than deal with it", "The abuse was swept under the carpet for decades."], ["a double-edged sword", "idiom", "something that has both positive and negative consequences", "Social media is a double-edged sword \u2014 it connects and divides."]]},

function buildPosColors(accentHex, accentLightHex){
  const out = {};
  POS_ORDER.forEach(pos=>{ out[pos] = [accentHex, accentLightHex]; });
  return out;
}

/* ═══════════════ Browse / Conversation rendering (shared across all topics) ═══════════════ */
const POS_ORDER = ['n.','adj.','v.','phr.v.','colloc.','idiom','phrase','slang'];
const POS_LABELS = {'n.':'Nouns','adj.':'Adjectives','v.':'Verbs','phr.v.':'Phrasal Verbs','colloc.':'Collocations','idiom':'Idioms','phrase':'Set Phrases','slang':'Modern Slang'};
let CURRENT = null;
let CURRENT_ID = null;
let activeCat = 'all';
let hiddenSpeaker = null;

function renderBrowse() {
  const container = document.getElementById('browse-content');
  const cats = activeCat === 'all' ? CURRENT.CATEGORIES : CURRENT.CATEGORIES.filter(c=>c.key===activeCat);
  const posColors = buildPosColors(CURRENT.accent, CURRENT.accentLight);
  let html = ''; let total = 0;
  const groups = {};
  cats.forEach(cat => {
    const entries = CURRENT.DATA[cat.key]||[];
    if (!entries.length) return;
    total += entries.length;
    entries.forEach(function(e){ var pos=e[1]; if(!groups[pos]) groups[pos]=[]; groups[pos].push(e); });
  });
  POS_ORDER.forEach(function(pos, i){
    if (!groups[pos]) return;
    var label = POS_LABELS[pos]||pos;
    var colors = posColors[pos]||['#7A7D8E','#F0EFEC'];
    var fg = colors[0], bg = colors[1];
    var count = groups[pos].length;
    var cardStyle = 'style="--posc:'+fg+';--post:'+bg+'"';
    html += '<div class="pos-card'+(i===0?'':' collapsed')+'" '+cardStyle+'>'
      + '<div class="pos-head" onclick="togglePos(this)">'
      + '<span class="pos-label">' + label + '</span>'
      + '<span class="pos-count">' + count + '</span>'
      + '<span class="pos-chevron">&#9660;</span>'
      + '</div>'
      + '<div class="pos-body">';
    groups[pos].forEach(function(e){
      var term=e[0], def=e[2], ex=e[3]||'';
      html += '<div class="word-row" onclick="toggleRow(this)">'
        + '<div class="wr-main"><span class="wr-term">'+term+'</span><span class="wr-arr">&#8250;</span></div>'
        + '<div class="wr-def">'+def+'</div>'
        + (ex ? '<div class="wr-ex">'+ex+'</div>' : '')
        + '</div>';
    });
    html += '</div></div>';
  });
  html = '<p class="tap-hint">Tap any word to see an example sentence, or tap a category to collapse it.</p>' + html;
  if (!total) html = '<div class="empty-state">No items.</div>';
  container.innerHTML = html;
}
function toggleRow(row){ row.classList.toggle('open'); }
function filterCat(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('.seg').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderBrowse();
}
function renderConversation() {
  const container = document.getElementById('conv-content');
  let html = '';
  CURRENT.CONV_DATA.forEach(section => {
    html += '<div class="conv-section collapsed"><div class="conv-header" onclick="toggleCat(this)"><span class="conv-title">'+section.group+'</span><span class="cat-chevron" style="color:var(--sea)">&#9660;</span></div><div class="cat-body">';
    section.entries.forEach(e => {
      const lines = e.lines.map((l,i) => {
        const scls = i===0?'conv-speaker-a':'conv-speaker-b';
        const lbl = i===0?'A':'B';
        return '<div class="conv-line"><span class="conv-speaker '+scls+'">'+lbl+'</span><span>'+l[1]+'</span></div>';
      }).join('');
      html += '<div class="conv-entry"><div class="conv-dialogue">'+lines+'</div><div class="conv-note">'+e.note+'</div></div>';
    });
    html += '</div></div>';
  });
  container.innerHTML = html;
}
function toggleHide(speaker) {
  const container = document.getElementById('conv-content');
  if (hiddenSpeaker === speaker) {
    hiddenSpeaker = null;
    container.classList.remove('hide-a','hide-b');
    document.getElementById('conv-hide-a').classList.remove('active-a');
    document.getElementById('conv-hide-b').classList.remove('active-b');
  } else {
    hiddenSpeaker = speaker;
    container.classList.remove('hide-a','hide-b');
    container.classList.add('hide-'+speaker.toLowerCase());
    document.getElementById('conv-hide-a').classList.remove('active-a');
    document.getElementById('conv-hide-b').classList.remove('active-b');
    document.getElementById('conv-hide-'+speaker.toLowerCase()).classList.add('active-'+speaker.toLowerCase());
  }
}
function switchTab(id, btn) {
  const view = document.getElementById('view-topic');
  view.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  view.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
}
function toggleCat(hdr) { hdr.parentElement.classList.toggle('collapsed'); }
function togglePos(hdr) { hdr.parentElement.classList.toggle('collapsed'); }


function resetTopicUI(){
  activeCat = 'all';
  hiddenSpeaker = null;
  document.querySelectorAll('#view-topic .seg').forEach((b,i)=>b.classList.toggle('active', i===0));
  document.getElementById('conv-hide-a').classList.remove('active-a');
  document.getElementById('conv-hide-b').classList.remove('active-b');
  document.getElementById('view-topic').classList.remove('hide-a','hide-b');
  switchTab('browse', document.querySelector('#view-topic .tab'));
}

function selectTopic(id, skipHash){
  const t = TOPICS[id];
  if (!t) return;
  CURRENT = t; CURRENT_ID = id;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--accent-light', t.accentLight);
  document.getElementById('topicTitle').innerHTML = t.title;
  document.getElementById('topicIcon').innerHTML = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">'+t.icon+'</svg>';
  resetTopicUI();
  renderBrowse();
  renderConversation();
  document.getElementById('view-wordbanks-index').style.display = 'none';
  document.getElementById('view-topic').style.display = 'block';
  window.scrollTo(0,0);
  if (!skipHash) history.pushState({topic:id}, '', '#'+id);
}
function showIndex(skipHash){
  CURRENT = null; CURRENT_ID = null;
  document.getElementById('view-topic').style.display = 'none';
  document.getElementById('view-wordbanks-index').style.display = 'block';
  window.scrollTo(0,0);
  if (!skipHash) history.pushState({topic:null}, '', location.pathname);
}
window.addEventListener('popstate', function(){
  const id = location.hash.replace('#','');
  if (id && TOPICS[id]) selectTopic(id, true); else showIndex(true);
});
(function(){
  const id = location.hash.replace('#','');
  if (id && TOPICS[id]) selectTopic(id, true);
})();

</script>
