<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 Grammar - johnplusenglish</title>
<meta name="description" content="A1 grammar, one lesson at a time. Work through 15 core A1 structures with clear explanations in plain English and practice that checks itself.">
<script src="lock.js"></script>
<script src="/assets/deeplink.js"></script>
<script src="matching.js"></script>
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --cream:#F7F6F3; --card:#fff; --ink:#2D3047; --muted:#8A8D9A;
  --border:#E8E5DF; --line:#EFEDE7;
  --sky:#2176FF; --sky-tint:#EAF2FE;
  --sea:#1DD3B0; --sea-d:#0F7D71; --sea-tint:#E4FBF7; --sea-bd:rgba(29,211,176,.4);
  --coral:#FF6B6B; --coral-d:#D6453F; --coral-tint:#FDECEC;
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}
.topnav{display:none}
a{color:var(--sky);text-decoration:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:32px 24px 80px}

/* header */
.g-head{display:flex;align-items:flex-start;gap:16px;margin:0 0 8px}
.g-badge{width:52px;height:52px;border-radius:14px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--sky)}
.g-badge svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g-title{font-size:2rem;font-weight:900;letter-spacing:-.02em;margin:0;line-height:1.05}
.g-sub{font-size:1rem;color:var(--muted);margin:4px 0 0;max-width:56ch}
.g-progwrap{margin:22px 0 26px}
.g-progline{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 8px}
.g-progline strong{color:var(--ink)}
.g-progbar{height:8px;border-radius:5px;background:var(--border);overflow:hidden}
.g-progfill{height:100%;width:0;background:var(--sea);border-radius:5px;transition:width .4s}

/* layout */
.g-layout{display:grid;grid-template-columns:288px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.g-layout{grid-template-columns:1fr}.g-road{position:static !important;max-height:none !important}}

/* roadmap sidebar */
.g-road{position:sticky;top:20px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:8px;max-height:calc(100vh - 40px);overflow:auto}
.g-road-head{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:12px 12px 8px}
.g-step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;font-family:inherit;cursor:pointer;padding:11px 12px;border-radius:10px;color:var(--ink);transition:background .15s}
.g-step:hover{background:var(--cream)}
.g-step.active{background:var(--sky-tint)}
.g-step-n{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:1.5px solid var(--border);color:var(--muted);background:var(--card)}
.g-step.active .g-step-n{border-color:var(--sky);color:var(--sky)}
.g-step.done .g-step-n{background:var(--sea);border-color:var(--sea);color:#fff}
.g-step-n svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g-step-t{font-size:.9rem;font-weight:600;line-height:1.3;min-width:0}
.g-step.active .g-step-t{color:var(--sky)}

/* lesson pane */
.g-lesson{min-width:0}
.g-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:30px 32px;margin:0 0 20px}
.g-eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);margin:0 0 6px}
.g-lesson-title{font-size:1.6rem;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;line-height:1.1}
.g-lesson-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:0 0 18px}
/* in-lesson folder tabs (matches site) */
.l-tabs{display:flex;gap:4px;position:relative;margin:6px 0 20px;align-items:flex-end;flex-wrap:wrap;padding-top:6px}
.l-tabs::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.l-tab{position:relative;font-family:inherit;font-size:.92rem;font-weight:700;padding:.55rem 1.5rem;color:var(--muted);cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1.5px solid var(--border);border-radius:12px 12px 0 0;transition:background .18s,color .18s}
.l-tab:hover{color:var(--ink)}
.l-tab.active{background:var(--cream);border-color:var(--sky);border-bottom:1.5px solid var(--cream);color:var(--sky);z-index:2}
.l-tab .l-tab-c{font-weight:600;opacity:.6;margin-left:7px}
.l-pane{display:none}
.l-pane.show{display:block}
/* soft circular number badges (match the roadmap) */
.g-ex-num{display:inline-flex;width:27px;height:27px;border-radius:50%;background:var(--sky);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;margin-right:12px;vertical-align:-6px;font-variant-numeric:tabular-nums}
.q-num{display:inline-flex;width:25px;height:25px;border-radius:50%;background:var(--sky-tint);color:var(--sky);align-items:center;justify-content:center;font-weight:700;font-size:.78rem;margin-right:11px;vertical-align:-5px;font-variant-numeric:tabular-nums}
.g-intro{font-size:1.05rem;font-weight:500;color:var(--ink);background:var(--sky-tint);border-radius:12px;padding:16px 20px;margin:0 0 22px}
.g-body{font-size:1rem}
.g-body p{margin:0 0 14px}
.g-body strong{font-weight:700}
.g-body em{font-style:italic;color:var(--ink)}
.g-body .rule{display:flex;gap:14px;align-items:flex-start;background:none;border:none;padding:0;margin:0 0 15px}
.g-body .rule-num{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--sea);margin-top:10px;font-size:0;color:transparent}
.g-body .rule-text{font-size:1rem;line-height:1.62}
.g-body .note{background:var(--sea-tint);border:none;border-radius:14px;padding:16px 20px;margin:20px 0 4px;font-size:.96rem;line-height:1.65}
.g-body .note strong{color:var(--sea-d)}

.g-sec-label{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:34px 0 16px}

table.g-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin:0 0 8px}
.g-table th{background:var(--cream);text-align:left;font-weight:700;padding:11px 14px;border-bottom:1.5px solid var(--border);font-size:.82rem}
.g-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.g-table tr:last-child td{border-bottom:none}
.g-table td:first-child{font-weight:600;color:var(--muted);white-space:nowrap}

/* In action - airy 2-column grid, no boxes, no dividers */
.g-examples{display:grid;grid-template-columns:1fr 1fr;gap:4px 34px;margin:0 0 4px}
@media(max-width:660px){.g-examples{grid-template-columns:1fr}}
.g-ex{padding:11px 0;background:none;border:none;display:block}
.g-ex-t{font-weight:800;font-size:.82rem;margin-right:10px}
.g-ex.pos .g-ex-t{color:var(--sea-d)}
.g-ex.neg .g-ex-t,.g-ex.q .g-ex-t{color:var(--sky)}
.g-ex-eng{font-weight:600;font-size:1rem}
.g-ex-note{font-size:.85rem;color:var(--muted);margin:3px 0 0 23px}

/* Watch out for - airy colour-coded pairs, no boxes, no dividers */
.g-errors{display:flex;flex-direction:column;gap:22px;margin:0 0 4px}
.g-err{background:none;border:none;padding:0}
.g-err-line{display:flex;gap:9px;align-items:baseline;font-size:.98rem;line-height:1.45}
.g-err-line .mk{flex:0 0 auto;font-weight:800;font-size:.9rem}
.g-err-bad{color:var(--coral-d)}.g-err-bad .mk{color:var(--coral)}
.g-err-good{color:var(--sea-d);font-weight:600;margin-top:3px}.g-err-good .mk{color:var(--sea-d)}
.g-err-reason{font-size:.85rem;color:var(--muted);margin:7px 0 0 23px}

.g-real{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.g-real li{position:relative;padding:0 0 0 22px;font-size:.96rem;line-height:1.55;border:none}
.g-real li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--sky)}

.g-tip{display:flex;gap:12px;background:var(--sea-tint);border:1.5px solid var(--sea-bd);border-radius:12px;padding:15px 18px;margin:22px 0 0}
.g-tip-label{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sea-d);margin:0 0 3px}
.g-tip p{margin:0;font-size:.95rem;line-height:1.55}

/* exercises */
.g-exercise{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:22px 24px;margin:0 0 16px}
.g-ex-title{font-size:1.05rem;font-weight:700;margin:0 0 2px}
.g-ex-sub{font-size:.9rem;color:var(--muted);margin:0 0 16px}
.q{padding:16px 0;border:none}
.q-text{font-size:1rem;margin:0 0 10px;line-height:1.75}
.gap-inp,.txt-inp{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;padding:.4rem .6rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);outline:none;transition:border-color .2s,background .2s}
.gap-inp{width:150px;text-align:center}
.txt-inp{width:100%;max-width:520px}
.gap-inp:focus,.txt-inp:focus{border-color:var(--sky)}
.gap-inp.correct,.txt-inp.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.gap-inp.wrong,.txt-inp.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0}
.opt{font-family:inherit;font-size:.95rem;font-weight:600;text-align:left;padding:.7rem 1rem;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.opt.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opt.reveal{border-color:var(--sea);color:var(--sea-d)}
.opt:disabled{cursor:default}
.q-fb{font-size:.88rem;margin-top:8px;padding:8px 12px;border-radius:8px;display:none}
.q-fb.show{display:block}
.q-fb.ok{background:var(--sea-tint);color:var(--sea-d)}
.q-fb.no{background:var(--coral-tint);color:var(--coral-d)}
.q-fb.hint{background:var(--cream);color:var(--muted)}
.chk-btn{font-family:inherit;font-weight:700;font-size:.88rem;color:#fff;background:var(--sky);border:none;border-radius:10px;padding:.6rem 1.3rem;cursor:pointer;margin-top:14px;transition:background .15s}
.chk-btn:hover{background:#175fd0}
.chk-link{font-family:inherit;font-weight:600;font-size:.82rem;color:var(--muted);background:none;border:none;cursor:pointer;margin-left:12px}
.chk-link:hover{color:var(--coral)}
.ex-score{font-size:.85rem;font-weight:700;color:var(--sea-d);margin-left:12px;display:none}
.ex-score.show{display:inline}

/* builder */
.build-target{min-height:44px;border:1.5px dashed var(--border);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;background:var(--cream)}
.build-bank{display:flex;flex-wrap:wrap;gap:6px}
.word-chip{font-family:inherit;font-size:.9rem;font-weight:600;padding:.35rem .7rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.word-chip:hover{border-color:var(--ink)}
.word-chip.used{opacity:.35;pointer-events:none}
.build-target .word-chip{background:var(--sky-tint);border-color:var(--sky)}

/* categorise */
.cat-cols{display:grid;gap:12px;margin:0 0 12px}
.cat-col{border:1.5px solid var(--border);border-radius:12px;padding:12px;min-height:70px;background:var(--card)}
.cat-col-h{font-size:.8rem;font-weight:700;color:var(--ink);margin:0 0 8px}
.cat-drop{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.cat-bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cat-item{font-family:inherit;font-size:.9rem;font-weight:600;padding:.4rem .8rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.cat-item.sel{border-color:var(--sky);background:var(--sky-tint);color:var(--sky)}
.cat-item.placed{background:var(--cream)}
.cat-item.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.cat-item.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}

/* convo */
.convo-line{display:flex;gap:10px;padding:8px 0;font-size:.98rem;line-height:1.8}
.convo-sp{font-weight:800;color:var(--sky);flex:0 0 auto;width:22px}

/* footer nav */
.g-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 0}
.g-complete{font-family:inherit;font-weight:700;font-size:.92rem;color:#fff;background:var(--sea);border:none;border-radius:12px;padding:.75rem 1.5rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.g-complete:hover{background:var(--sea-d)}
.g-complete.done{background:var(--sea-tint);color:var(--sea-d);border:1.5px solid var(--sea-bd)}
.g-complete svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next{font-family:inherit;font-weight:700;font-size:.92rem;color:var(--ink);background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.75rem 1.4rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s}
.g-next:hover{border-color:var(--ink)}
.g-next svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next[disabled]{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

/* ── PNG export ── */
.g-export-btn{background:none;border:1.5px solid var(--border);border-radius:9px;padding:.34rem .5rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;flex:0 0 auto;font-family:inherit}
.g-export-btn:hover{border-color:var(--sky);color:var(--sky)}
.g-export-btn:disabled{opacity:.55;cursor:default;border-color:var(--border);color:var(--muted)}
.g-export-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.png-export-card{width:800px;box-sizing:border-box;background:var(--cream);padding:38px;font-family:'Outfit',sans-serif;color:var(--ink)}
.pec-inner{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:34px 36px 26px}
.pec-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:0 0 10px}
.pec-title{font-size:1.7rem;font-weight:900;letter-spacing:-.01em;margin:0;line-height:1.12}
.pec-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:5px 0 0}
.pec-body{margin-top:22px}
.pec-body>.g-body>*:first-child{margin-top:0}
.pec-body .g-sec-label:first-child{margin-top:6px}
.pec-foot{margin-top:28px;padding-top:16px;border-top:1.5px solid var(--border);font-size:.75rem;font-weight:600;color:var(--muted)}
.pec-foot b{color:var(--sky);font-weight:800}
</style>
</head>

<script>const LESSONS=[{"id":"be","title":"Verb to be","subtitle":"am / is / are","intro":"The single most important verb in English. Everything you build later stands on this, so it is worth getting rock solid.","desc":"Before you can say anything in English - introduce yourself, describe things, talk about your job or feelings - you need the verb <em>to be<\/em>. It has three present tense forms.","tip":"The thing I stop my students on every time: short answers never contract. If I ask <strong>\"Are you ready?\"<\/strong>, you say <strong>\"Yes, I am\"<\/strong> - never <em>\"Yes, I'm.\"<\/em> You can open a sentence with a contraction (<em>I'm tired<\/em>), but you can't end one with it.","explanation":"<p>The verb <em>to be<\/em> is used to <strong>identify people and things<\/strong>, describe <strong>states, feelings and characteristics<\/strong>, and talk about <strong>jobs, nationalities and origins<\/strong>.<\/p>\n<p>Unlike most verbs, <em>to be<\/em> has three completely different present tense forms. They are not interchangeable - each belongs to a specific subject.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>am<\/strong> - only with <em>I<\/em>. Always. No exceptions.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>is<\/strong> - with <em>he, she, it<\/em>, and singular nouns. <em>\"The weather is nice.\"<\/em> / <em>\"My name is John.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>are<\/strong> - with <em>you, we, they<\/em>, and plural nouns. <em>\"They are my friends.\"<\/em> / <em>\"We are from Ukraine.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Short answers with to be never contract:<\/strong> <em>\"Are you ready?\"<\/em> → <em>\"Yes, I am.\"<\/em> - never <em>\"Yes, I'm.\"<\/em> You can begin a sentence with a contraction (I'm tired), but you can't finish on one.<\/div>","table":{"headers":["Subject","Full form","Contraction","Negative","Short negative"],"rows":[["I","I am","I'm","I am not","I'm not"],["You","You are","You're","You are not","You aren't"],["He / She / It","He is","He's","He is not","He isn't"],["We","We are","We're","We are not","We aren't"],["They","They are","They're","They are not","They aren't"]]},"examples":[{"type":"pos","eng":"I'm a student.","note":"Contraction is more natural in speech."},{"type":"pos","eng":"She is from Spain.","note":"Full form - also correct, slightly more formal."},{"type":"neg","eng":"He isn't tired.","note":"Contraction of is + not."},{"type":"neg","eng":"We aren't teachers.","note":"Contraction of are + not."}],"errors":[{"bad":"She teacher.","good":"She is a teacher.","reason":"The verb to be cannot be omitted in English."},{"bad":"My name are John.","good":"My name is John.","reason":"\"My name\" is singular - always use \"is\"."},{"bad":"He are my friend.","good":"He is my friend.","reason":"He/she/it always take is."}],"realUse":[],"exercises":[{"type":"gap","title":"Choose the correct form","sub":"Fill each gap with am, is, or are.","items":[{"answer":"am","before":"I ","after":" a student."},{"answer":"is","before":"She ","after":" from Spain."},{"answer":"are","before":"They ","after":" my friends."},{"answer":"is","before":"My dog ","after":" very friendly."},{"answer":"are","before":"We ","after":" in the same class."},{"answer":"is","before":"The weather ","after":" beautiful today."},{"answer":"am","before":"I ","after":" not tired."},{"answer":"are","before":"You ","after":" very kind."}]},{"type":"gap","title":"Positives, negatives and questions","sub":"Fill each gap with the correct form of to be - positive, negative or question.","items":[{"answer":"isn't","before":"He ","after":" at home. (negative)"},{"answer":"aren't","before":"They ","after":" ready yet. (negative)"},{"answer":"Is","before":"","after":" she a teacher? (question)"},{"answer":"Are","before":"","after":" you from Italy? (question)"},{"answer":"am not","before":"I ","after":" very happy today. (negative)"},{"answer":"Is","before":"","after":" it cold outside? (question)"}]},{"type":"mc","title":"Short answers","sub":"Choose the correct short answer.","items":[{"q":"Are you from Spain? - ___","opts":["Yes, I'm.","Yes, I am.","Yes, am.","Yes, I is."],"answer":"Yes, I am.","explanation":"Short answers with to be never use contractions - always the full form."},{"q":"Is she a doctor? - ___","opts":["No, she isn't.","No, she aren't.","No, she not.","No, isn't."],"answer":"No, she isn't.","explanation":"Negative short answer for she: No, she isn't."},{"q":"Are they at home? - ___","opts":["Yes, they're.","Yes, are.","Yes, they are.","Yes, they is."],"answer":"Yes, they are.","explanation":"Short answers with to be never use contractions."},{"q":"Is it far? - ___","opts":["No, it not.","No, it isn't.","No, it aren't.","No, isn't it."],"answer":"No, it isn't.","explanation":"No, it isn't. - correct negative short answer for it."}]}]},{"id":"pronouns","title":"Subject pronouns","subtitle":"I, you, he, she, it, we, they","intro":"Every English sentence needs a subject, and these seven little words are that foundation.","desc":"In English, the subject must always be stated explicitly - you cannot drop it, even when it seems obvious. This trips up speakers of Spanish, Italian, Russian and many other languages.","tip":"Here is the one I chase hardest: don't drop <strong>it<\/strong>. In a lot of languages you can leave the subject out - \"Is raining\", \"Is cold.\" English won't let you: <strong>\"It's raining.\"<\/strong> No subject means no complete sentence, full stop.","explanation":"<p>Subject pronouns replace a noun as the <strong>subject of a verb<\/strong>. In English, the subject must always be stated - you cannot drop it, even when it seems obvious. This is different from Spanish, Italian, Russian, and many other languages where the subject pronoun is optional.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>I, you, he, she, we, they<\/strong> - straightforward replacements for people and groups.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>It<\/strong> - for things, animals, and as a <em>dummy subject<\/em> for weather, time, distance, and impersonal statements. There is no real noun behind <em>it<\/em> - it just fills the subject slot. <em>\"It's raining.\"<\/em> / <em>\"It's five o'clock.\"<\/em> / <em>\"It's far.\"<\/em> Many languages drop this entirely. English never does.<\/div><\/div>\n<div class=\"note\"><strong>Never drop the subject in English.<\/strong><br>Spanish <em>\"Es tarde\"<\/em> &nbsp;→&nbsp; English <em>\"It is late\"<\/em> - the <em>it<\/em> is required.<br>Spanish <em>\"Tengo hambre\"<\/em> &nbsp;→&nbsp; English <em>\"I am hungry\"<\/em> - the <em>I<\/em> is required.<\/div>","table":{"headers":["Pronoun","Refers to","Example"],"rows":[["I","the speaker","I live in Madrid."],["you","singular or plural listener","You speak really well."],["he","male person","He is my brother."],["she","female person","She works at a hospital."],["it","thing, animal, or impersonal subject","It is cold today."],["we","speaker + others","We are from Ukraine."],["they","group not including speaker","They are in the garden."]]},"examples":[{"type":"pos","eng":"It's raining.","note":"\"It\" as a weather subject - no equivalent noun."},{"type":"pos","eng":"She and I are both teachers.","note":"When combining with I, put the other person first."},{"type":"pos","eng":"They are my students.","note":"Can refer to a group of people or things."},{"type":"neg","eng":"He isn't here today.","note":"\"He\" for a named male person."}],"errors":[{"bad":"Is cold.","good":"It is cold.","reason":"English needs a subject pronoun for weather and time."},{"bad":"Me and John are friends.","good":"John and I are friends.","reason":"As a subject, use \"I\" not \"me\". Put the other person first."},{"bad":"My dog, he is friendly.","good":"My dog is friendly.","reason":"Don't use a pronoun AND a noun as subject - it's redundant."}],"realUse":[],"exercises":[{"type":"gap","title":"Subject pronouns","sub":"Fill each gap with the correct subject pronoun.","items":[{"answer":"She","before":"My sister is a doctor. ","after":" works at a hospital."},{"answer":"They","before":"John and Maria are Spanish. ","after":" live in Madrid."},{"answer":"It","before":"","after":" is five o'clock."},{"answer":"I","before":"My brother and ","after":" are very close."},{"answer":"We","before":"","after":" are all from Ukraine."},{"answer":"It","before":"The book is on the table. ","after":" is very interesting."},{"answer":"He","before":"That's my teacher. ","after":" is very funny."},{"answer":"They","before":"I have two cats. ","after":" are very lazy."}]},{"type":"categorise","title":"Categorise the pronouns","sub":"Click a pronoun, then click the correct column.","categories":[{"name":"Singular","items":["I","you","he","she","it"]},{"name":"Plural","items":["we","they"]},{"name":"Both singular and plural","items":["you (pl.)"]}]},{"type":"mc","title":"Choose the correct pronoun","sub":"Choose the correct subject pronoun.","items":[{"q":"___ is raining outside.","opts":["He","She","It","They"],"answer":"It","explanation":"\"It\" is used as a dummy subject for weather."},{"q":"___ and I are best friends. (Anna)","opts":["Me","Her","She","Hers"],"answer":"She","explanation":"Subject pronoun needed - she, not her. And other person first."},{"q":"The company announced ___ new strategy.","opts":["their","they","it","its"],"answer":"its","explanation":"Possessive pronoun for a company/institution is its."},{"q":"My parents called. ___ want me to come home.","opts":["It","He","She","They"],"answer":"They","explanation":"My parents = a group → they."}]}]},{"id":"articles","title":"Articles","subtitle":"a, an, the - and zero article","intro":"Three tiny words that cause a surprising amount of trouble. Let me give you the core logic to hold onto.","desc":"Articles are among the hardest things in English for speakers of languages without them - Russian, Ukrainian, Polish, Turkish, Chinese. But there is a clear logic.","tip":"The mistake I see most is actually the opposite of adding too many articles - it's forgetting that sometimes you use <strong>none at all<\/strong>. \"I love music.\" \"Life is short.\" \"She's from Spain.\" When you talk about something in general, leave <em>the<\/em> out.","explanation":"<p>English has three article choices: <strong>a/an<\/strong> (indefinite), <strong>the<\/strong> (definite), and <strong>zero article<\/strong> (no article at all). The choice depends on whether the noun is specific or general.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>A / an<\/strong> - one unspecified member of a category. Use when the listener does not know exactly which one you mean, or when you introduce something for the first time. <em>A before consonant sounds, an before vowel sounds<\/em> - it is about <strong>sound, not spelling<\/strong>. <em>\"An hour\"<\/em> (h is silent). <em>\"A university\"<\/em> (sounds like <em>yoo<\/em>).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>The<\/strong> - a specific noun that both speaker and listener know about. Either it was mentioned before (<em>\"I bought a book. The book was great.\"<\/em>), or there is only one in context (<em>\"Pass me the salt.\"<\/em> / <em>\"The sun is out.\"<\/em>).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Zero article (no article)<\/strong> - used with uncountable nouns and plurals when talking about things <em>in general<\/em>. <em>\"I love music.\"<\/em> / <em>\"Dogs are friendly.\"<\/em> / <em>\"Water is essential.\"<\/em> Do not add <em>the<\/em> here - <em>\"I love the music\"<\/em> means specific music, not music in general.<\/div><\/div>\n<div class=\"note\"><strong>Fixed expressions that take no article at all:<\/strong> at home, at work, at school, at university, by car, by bus, go to bed, go to hospital (British), have breakfast/lunch/dinner.<\/div>","table":{"headers":["Article","Use","Example"],"rows":[["a","First mention, singular countable","I saw a dog in the street."],["an","Same - noun starts with vowel sound","She is an engineer. It's an hour."],["the","Specific noun already known or unique","The dog was barking all night."],["the","Unique things in the world","the sun, the internet, the government"],["Ø","Uncountable / plural used generally","I love music. Dogs are friendly."],["Ø","Most proper nouns","I live in Spain. She's from Kyiv."]]},"examples":[{"type":"pos","eng":"I bought a book. The book was excellent.","note":"A on first mention → the when already known."},{"type":"pos","eng":"She's an honest person.","note":"\"An\" before silent h - \"an hour\", \"an honour\"."},{"type":"pos","eng":"The moon is bright tonight.","note":"Unique - only one moon. Always the."},{"type":"neg","eng":"I don't like the coffee here.","note":"\"The\" = this specific coffee in this place."}],"errors":[{"bad":"She is teacher.","good":"She is a teacher.","reason":"Jobs and roles need \"a\" or \"an\"."},{"bad":"I need an information.","good":"I need some information.","reason":"\"Information\" is uncountable. Never \"an information\"."},{"bad":"The life is short.","good":"Life is short.","reason":"Abstract uncountable nouns used generally take zero article."}],"realUse":[],"exercises":[{"type":"gap","title":"a, an, the, or nothing?","sub":"Fill each gap with a, an, the, or - (write - for no article).","items":[{"answer":"a","before":"I want ","after":" coffee, please."},{"answer":"an","before":"She is ","after":" architect."},{"answer":" - ","before":"I love ","after":" music."},{"answer":"the","before":"Can you open ","after":" door?"},{"answer":"the","before":"He works in ","after":" United States."},{"answer":"an","before":"I need ","after":" hour to finish."},{"answer":" - ","before":"She lives in ","after":" Paris."},{"answer":"the","before":"Who invented ","after":" telephone?"}]},{"type":"mc","title":"First mention vs second mention","sub":"Choose the correct article.","items":[{"q":"I saw ___ dog in the park. ___ dog was very big.","opts":["a / A","the / The","a / The","the / A"],"answer":"a / The","explanation":"First mention = a (unspecified). Second mention = the (now we know which dog)."},{"q":"She plays ___ piano every evening.","opts":["a","an","the"," - "],"answer":"the","explanation":"Musical instruments always use the."},{"q":"___ sun is very strong today.","opts":["A","An","The"," - "],"answer":"The","explanation":"The sun is unique - there is only one. Always the."},{"q":"I'm looking for ___ job.","opts":["the","a","an"," - "],"answer":"a","explanation":"Any job, not a specific one → a."}]},{"type":"categorise","title":"Which article?","sub":"Click a phrase, then click the correct column.","categories":[{"name":"a / an","items":["an umbrella","a job","an engineer","a university","an hour","a book"]},{"name":"the","items":["the moon","the internet","the Nile","the same thing","the best one"]},{"name":"no article (Ø)","items":["music","France","water","love","Kyiv","happiness"]}]}]},{"id":"plurals","title":"Plural nouns","subtitle":"Regular and common irregular forms","intro":"Adding -s is only the beginning. English has a few more plural rules than most learners expect, so let's sort them out.","desc":"Forming plurals in English is mostly predictable - but there are important spelling rules and irregular forms every A1 learner needs to control.","tip":"Three irregular plurals come up in almost every lesson I teach, so learn these first: <strong>child → children<\/strong>, <strong>woman → women<\/strong>, <strong>person → people<\/strong>. \"Childrens\" and \"womans\" simply aren't English words.","explanation":"<p>The basic rule is: add <strong>-s<\/strong> to most nouns. But several spelling rules change how the plural is formed.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Nouns ending in -s, -ss, -sh, -ch, -x, -z<\/strong> - add <em>-es<\/em> (this adds a syllable so you can say it). bus → bus<strong>es<\/strong>, church → church<strong>es<\/strong>, box → box<strong>es<\/strong>, watch → watch<strong>es<\/strong>.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Nouns ending in consonant + y<\/strong> - change <em>y<\/em> to <em>-ies<\/em>. city → cit<strong>ies<\/strong>, baby → bab<strong>ies<\/strong>, story → stor<strong>ies<\/strong>. (But vowel + y just adds -s: day → days, boy → boys.)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Nouns ending in -f or -fe<\/strong> - change to <em>-ves<\/em>. knife → kni<strong>ves<\/strong>, leaf → lea<strong>ves<\/strong>, half → hal<strong>ves<\/strong>. Exceptions: roof → roofs, chef → chefs.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Irregular plurals<\/strong> - must be memorised. man → men, woman → women, child → children, tooth → teeth, foot → feet, mouse → mice, person → people, sheep → sheep, fish → fish.<\/div><\/div>\n<div class=\"note\"><strong>Uncountable nouns<\/strong> have no plural at all: <em>information, advice, furniture, luggage, money, homework, news, water, music<\/em>. Never add -s to these - <em>\"two informations\"<\/em> and <em>\"an advice\"<\/em> are always wrong.<\/div>","table":{"headers":["Rule","Singular","Plural","Notes"],"rows":[["Most nouns + s","cat / book","cats / books","Default rule"],["-s/-sh/-ch/-x + es","bus / church","buses / churches","Adds a syllable"],["Consonant + y → ies","city / baby","cities / babies","Vowel + y = just add s: boys"],["-f/-fe → ves","knife / leaf","knives / leaves","Not all: roofs, chiefs"],["Irregular","man / woman / child","men / women / children","Must be memorised"],["Same form","sheep / fish","sheep / fish","No change"]]},"examples":[{"type":"pos","eng":"The children are playing in the park.","note":"\"Children\" is the plural of \"child\" - not \"childs\"."},{"type":"pos","eng":"There are three women in the meeting.","note":"\"Women\" - not \"womans\"."},{"type":"pos","eng":"The leaves are falling.","note":"\"Leaf\" → \"leaves\": f/fe → ves."},{"type":"neg","eng":"There aren't any buses on Sundays.","note":"\"Buses\" = bus + es."}],"errors":[{"bad":"I have three childs.","good":"I have three children.","reason":"\"Children\" is the irregular plural of \"child\"."},{"bad":"The informations are...","good":"The information is...","reason":"\"Information\" is uncountable - no plural."},{"bad":"Two womans applied.","good":"Two women applied.","reason":"\"Women\" is the plural of \"woman\"."}],"realUse":[],"exercises":[{"type":"gap","title":"Write the plural","sub":"Write the plural form of the word in brackets.","items":[{"answer":"children","before":"She has three ","after":" (child)."},{"answer":"women","before":"How many ","after":" (woman) are in the class?"},{"answer":"leaves","before":"All the ","after":" (leaf) have fallen."},{"answer":"buses","before":"There are two ","after":" (bus) per hour."},{"answer":"people","before":"A lot of ","after":" (person) were waiting."},{"answer":"teeth","before":"The ","after":" (tooth) are very white."},{"answer":"cities","before":"How many ","after":" (city) have you visited?"},{"answer":"shelves","before":"The ","after":" (shelf) are full of books."}]},{"type":"categorise","title":"Categorise","sub":"Click a word, then click the correct column.","categories":[{"name":"Regular plural (-s / -es)","items":["book","bus","day","girl","church","box"]},{"name":"Irregular plural","items":["child","woman","tooth","foot","mouse"]},{"name":"Uncountable (no plural)","items":["information","advice","music","water","homework"]}]},{"type":"mc","title":"Multiple choice","sub":"Choose the correct option.","items":[{"q":"She has five _____ in her bag.","opts":["knife","knifes","knives","knifeies"],"answer":"knives","explanation":"\"Knife\" ends in -fe → change to -ves: knives."},{"q":"There are many _____ in the park.","opts":["childs","children","childrens","child"],"answer":"children","explanation":"\"Children\" is the only correct irregular plural of \"child\"."},{"q":"How much _____ do you have?","opts":["informations","information","an information","informings"],"answer":"information","explanation":"\"Information\" is uncountable - no plural."},{"q":"Two _____ applied for the job.","opts":["man","mans","men","mens"],"answer":"men","explanation":"\"Man\" → \"men\". Completely irregular."}]}]},{"id":"demonstratives","title":"Demonstratives","subtitle":"this, that, these, those","intro":"Four little words that point. Usually at distance in space, and sometimes in time too.","desc":"Demonstratives allow speakers to point at things physically or reference things in conversation. The two-way system (near/far) is simple but very productive.","tip":"Try this one and it'll stick: on the phone we always say <strong>\"This is John\"<\/strong>, never \"I am John.\" It feels odd at first, but it is exactly what English speakers say every single time.","explanation":"<p>English demonstratives work on two axes: <strong>distance<\/strong> (near vs far) and <strong>number<\/strong> (singular vs plural).<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>This / these<\/strong> - near the speaker. <em>\"This is my coat.\"<\/em> (holding it) / <em>\"These are my keys.\"<\/em> (in your hand).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>That / those<\/strong> - away from the speaker. <em>\"That building over there.\"<\/em> / <em>\"Those mountains in the distance.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Singular vs plural:<\/strong> this/that = singular noun. these/those = plural noun. Mixing them up is the most common error: <em>\"This are my friends\"<\/em> ✗ → <em>\"These are my friends.\"<\/em> ✓<\/div><\/div>\n<div class=\"note\"><strong>Distance can be about feeling, not just space:<\/strong> <em>\"Those were the days\"<\/em> pushes something into a distant past; <em>\"This is John\"<\/em> on the phone pulls someone close into the conversation; <em>\"That's a great idea\"<\/em> nods to something just said.<\/div>","table":{"headers":["","Near (here)","Far (there)"],"rows":[["Singular","this","that"],["Plural","these","those"],["Example (sing.)","This book is mine.","That book is yours."],["Example (pl.)","These bags are heavy.","Those bags are hers."]]},"examples":[{"type":"pos","eng":"This is my friend, Maria.","note":"\"This\" draws them into the conversation space."},{"type":"pos","eng":"Those mountains are beautiful.","note":"The mountains are far away - use those."},{"type":"pos","eng":"These days, everything is expensive.","note":"\"These days\" = the present period - temporal use."},{"type":"neg","eng":"I don't like this weather.","note":"\"This\" because the weather is immediate and current."}],"errors":[{"bad":"These is my book.","good":"This is my book.","reason":"\"This\" = singular. \"These\" must be followed by a plural noun."},{"bad":"I want those one.","good":"I want that one.","reason":"\"That one\" = singular. \"Those\" is plural."},{"bad":"This are my friends.","good":"These are my friends.","reason":"\"Friends\" is plural - use \"these\", not \"this\"."}],"realUse":[],"exercises":[{"type":"gap","title":"This, that, these or those?","sub":"Fill each gap with the correct demonstrative.","items":[{"answer":"This","before":"","after":" is my sister. (She's standing next to me.)"},{"answer":"those","before":"Can you see ","after":" birds up in the sky?"},{"answer":"those","before":"I love ","after":" shoes you're wearing."},{"answer":"These","before":"","after":" days, everyone uses a smartphone."},{"answer":"that","before":"What's ","after":" smell? It's wonderful!"},{"answer":"those","before":"Are ","after":" your keys on the table?"},{"answer":"this","before":"Is ","after":" seat free? (asking about the seat next to you)"},{"answer":"that","before":"Who is ","after":" woman over there?"}]},{"type":"mc","title":"Near or far?","sub":"Choose the correct demonstrative.","items":[{"q":"___ is my coat. (You're holding it.)","opts":["This","That","These","Those"],"answer":"This","explanation":"You're holding it - it's near. Use this (singular)."},{"q":"___ buildings over there are very old.","opts":["This","That","These","Those"],"answer":"Those","explanation":"Over there = far away. Plural buildings → those."},{"q":"___ were the days! (a happy memory)","opts":["This","That","These","Those"],"answer":"Those","explanation":"\"Those were the days\" - fixed expression for a distant happy past."},{"q":"Can I try on ___ shoes in the window?","opts":["this","that","these","those"],"answer":"those","explanation":"The shoes are in the shop window - not near you. Plural → those."}]},{"type":"builder","title":"Sentence builder","sub":"Put the words in the correct order.","items":[{"words":["this","is","my","sister"],"answer":"this is my sister","context":"Introduce someone standing next to you."},{"words":["those","are","my","keys"],"answer":"those are my keys","context":"The keys are on the table across the room."},{"words":["these","days","everything","is","expensive"],"answer":"these days everything is expensive","context":"Make a sentence about the present period."},{"words":["is","that","your","bag","?"],"answer":"is that your bag ?","context":"Ask about a bag on the floor near the door."},{"words":["I","don't","like","this","weather"],"answer":"I don't like this weather","context":"Talk about the current weather."}]}]},{"id":"presentsimple","title":"Present simple","subtitle":"I work, she works, do/does","intro":"The workhorse tense - habits, routines, facts, timetables. You'll use this one constantly.","desc":"The present simple is used far more than most learners realise - not just for daily routines, but for facts, general truths, and timetabled future events.","tip":"Don't lose the <strong>-s<\/strong> on he, she and it: <em>She works. He plays. It starts.<\/em> And once <em>does<\/em> is in a question, the main verb drops the -s again: <strong>\"Does she work?\"<\/strong> - never \"Does she works?\"","explanation":"<p>The present simple is used for <strong>habits and routines<\/strong>, <strong>general truths and facts<\/strong>, and <strong>timetabled future events<\/strong>. It is not used for things happening right now - that is the present continuous.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>He / she / it always gets -s (or -es).<\/strong> This is the most important spelling rule in the present simple. work → work<strong>s<\/strong>, play → play<strong>s<\/strong>. Verbs ending in -s, -sh, -ch, -x, -o add -es: watch → watch<strong>es<\/strong>, go → go<strong>es<\/strong>, do → do<strong>es<\/strong>. Consonant + y: study → stud<strong>ies<\/strong>. Irregular: have → <strong>has<\/strong>.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Questions and negatives use do / does.<\/strong> Once <em>does<\/em> is in the sentence, the main verb returns to its base form - no -s. <em>\"Does she work?\"<\/em> - NOT <em>\"Does she works?\"<\/em> The <em>does<\/em> already carries the third person.<\/div><\/div>\n<div class=\"note\"><strong>State verbs<\/strong> (know, like, love, want, need, understand, believe, prefer, own) describe states, not actions, so they almost never take the continuous - even about right now. <em>\"I understand.\"<\/em> / <em>\"She wants coffee.\"<\/em> - never <em>\"I am understanding\"<\/em> or <em>\"She is wanting.\"<\/em><\/div>","table":{"headers":["Form","I / You / We / They","He / She / It"],"rows":[["Positive","I work / you play","She works / he plays"],["Negative","I don't work","She doesn't work"],["Question","Do you work?","Does she work?"],["Short answer","Yes, I do. / No, I don't.","Yes, she does. / No, she doesn't."]]},"examples":[{"type":"pos","eng":"She works in a hospital.","note":"-s added for she. Irregular: go → goes, do → does, have → has."},{"type":"pos","eng":"We have English class on Mondays.","note":"Scheduled, regular event."},{"type":"neg","eng":"He doesn't like coffee.","note":"\"Doesn't\" = does + not. Main verb stays base form."},{"type":"neg","eng":"They don't watch TV.","note":"\"Don't\" = do + not."}],"errors":[{"bad":"She work in a bank.","good":"She works in a bank.","reason":"He/she/it always need the -s ending."},{"bad":"Does she works here?","good":"Does she work here?","reason":"\"Does\" already carries the third person - main verb must be base form."},{"bad":"He don't like it.","good":"He doesn't like it.","reason":"\"Don't\" is for I/you/we/they. He/she/it use \"doesn't\"."}],"realUse":[],"exercises":[{"type":"gap","title":"Positive sentences","sub":"Fill each gap with the correct present simple form.","items":[{"answer":"works","before":"She ","after":" in a hospital. (work)"},{"answer":"goes","before":"He ","after":" to the gym every day. (go)"},{"answer":"have","before":"We ","after":" English class on Mondays. (have)"},{"answer":"starts","before":"The film ","after":" at eight. (start)"},{"answer":"speak","before":"They ","after":" three languages. (speak)"},{"answer":"studies","before":"She ","after":" medicine at university. (study)"},{"answer":"finishes","before":"He ","after":" work at six. (finish)"},{"answer":"live","before":"I ","after":" near the city centre. (live)"}]},{"type":"gap","title":"Negatives and questions","sub":"Fill each gap with the correct negative or question form.","items":[{"answer":"doesn't eat","before":"He ","after":" meat. (not eat)"},{"answer":"don't understand","before":"I ","after":" the question. (not understand)"},{"answer":"Do","before":"","after":" you speak Spanish? (question)"},{"answer":"Does","before":"","after":" he live near here? (question)"},{"answer":"don't like","before":"They ","after":" cold weather. (not like)"},{"answer":"doesn't have","before":"She ","after":" a car. (not have)"}]},{"type":"mc","title":"Short answers","sub":"Choose the correct short answer.","items":[{"q":"Do you like coffee? - ___","opts":["Yes, I like.","Yes, I do.","Yes, do I.","Yes, I does."],"answer":"Yes, I do.","explanation":"Short answer with do/does: Yes, I do."},{"q":"Does she work here? - ___","opts":["No, she doesn't.","No, she don't.","No, she doesn't work.","No, doesn't she."],"answer":"No, she doesn't.","explanation":"Short answer for she: No, she doesn't."},{"q":"Do they speak English? - ___","opts":["Yes, they speak.","Yes, they does.","Yes, they do.","Yes, do they."],"answer":"Yes, they do.","explanation":"Short answer for they: Yes, they do."},{"q":"Does he have a brother? - ___","opts":["Yes, he has.","Yes, he does.","Yes, does he.","Yes, he do."],"answer":"Yes, he does.","explanation":"Short answer for he: Yes, he does."}]}]},{"id":"presentcontinuous","title":"Present continuous","subtitle":"I'm working, she's reading","intro":"What's happening right now, or around now. The tense of this very moment.","desc":"The present continuous describes actions happening at the moment of speaking, or temporary situations in the current period.","tip":"Careful with the verbs that don't like the -ing form - the big ones are <strong>know, love, understand, want, need<\/strong>. Say <strong>\"I know\"<\/strong>, not \"I'm knowing\"; <strong>\"I understand\"<\/strong>, not \"I'm understanding.\"","explanation":"<p>The present continuous is formed with <strong>be + verb-ing<\/strong>. It is used for actions <strong>happening right now<\/strong> and <strong>temporary situations<\/strong> around the present period.<\/p>\n<p><strong>-ing spelling rules:<\/strong> most verbs just add -ing. Verbs ending in -e drop it: come → com<strong>ing<\/strong>, have → hav<strong>ing<\/strong>. Short verbs ending in single vowel + consonant double the consonant: run → run<strong>n<\/strong>ing, sit → sit<strong>t<\/strong>ing.<\/p>\n<div class=\"note\"><strong>State verbs don't take the -ing form, even right now.<\/strong> They describe mental states, feelings, senses and possession rather than actions in progress. The ones to remember: <em>know, understand, believe, think (= have an opinion), like, love, hate, prefer, want, need, own, have (= possess), see, hear, smell, taste.<\/em><br><em>\"I know the answer.\"<\/em> ✓ &nbsp; <em>\"I am knowing the answer.\"<\/em> ✗<\/div>","table":{"headers":["Form","Example","Notes"],"rows":[["Positive","I am working / She is eating","Contraction: I'm, she's, they're"],["Negative","He isn't listening","= is not listening"],["Question","Are you coming?","Invert subject and be"],["Spelling: -e","come → coming","Drop the -e before -ing"],["Spelling: CVC","run → running","Double the final consonant"]]},"examples":[{"type":"pos","eng":"I'm studying English.","note":"Happening right now."},{"type":"pos","eng":"She's staying with friends this week.","note":"Temporary situation."},{"type":"neg","eng":"He isn't listening to me.","note":"Be + not + -ing."},{"type":"neg","eng":"We aren't going to the party.","note":"Future arrangement being cancelled."}],"errors":[{"bad":"I'm not understanding this.","good":"I don't understand this.","reason":"Understand is a state verb - it describes a mental state, not an action. Never used in the continuous."},{"bad":"She is wanting a coffee.","good":"She wants a coffee.","reason":"Want is a state verb - use the present simple."},{"bad":"I am knowing the answer.","good":"I know the answer.","reason":"Know is a state verb - never used in continuous form."}],"realUse":[],"exercises":[{"type":"gap","title":"Present continuous - positive","sub":"Fill each gap with the present continuous form. Use contractions where possible.","items":[{"answer":"is raining","before":"It ","after":" outside. (rain)"},{"answer":"'m studying/am studying","before":"I ","after":" for an exam right now. (study)"},{"answer":"are watching","before":"They ","after":" a film at the moment. (watch)"},{"answer":"is cooking","before":"She ","after":" dinner. (cook)"},{"answer":"'m working/am working","before":"I ","after":" from home this week. (work)"},{"answer":"is getting","before":"The weather ","after":" better. (get)"},{"answer":"are playing","before":"The children ","after":" in the garden. (play)"},{"answer":"is sitting","before":"He ","after":" next to me. (sit)"}]},{"type":"gap","title":"Negatives and questions","sub":"Fill each gap - negative or question form of the present continuous.","items":[{"answer":"isn't listening","before":"He ","after":" to me. (not listen)"},{"answer":"aren't coming","before":"They ","after":" to the party. (not come)"},{"answer":"Are","before":"","after":" you coming tomorrow? (question)"},{"answer":"Is","before":"","after":" she still working? (question)"},{"answer":"aren't sleeping","before":"The children ","after":" - they're playing! (not sleep)"}]},{"type":"categorise","title":"Action verb or state verb?","sub":"Click a verb, then click the correct column.","categories":[{"name":"Action verb ✓ (can use -ing)","items":["run","eat","talk","sleep","write","watch","cook","study"]},{"name":"State verb ✗ (avoid -ing)","items":["know","love","understand","want","believe","need","hate","prefer"]}]}]},{"id":"imperatives","title":"Imperatives","subtitle":"Do this. Don't do that.","intro":"Short, direct and surprisingly powerful. Imperatives do a lot of everyday work in English.","desc":"Imperatives are formed from the base verb - no subject, no auxiliary. They're used for instructions, requests, commands, warnings, advice, and invitations.","tip":"A bare imperative can land as rude, so I teach one easy fix: add <strong>please<\/strong>. \"Sit down\" becomes \"Please sit down.\" Tiny change, big difference - and it matters a lot in English.","explanation":"<p>The imperative uses the <strong>base form of the verb<\/strong> with no subject and no auxiliary. It works for instructions, commands, requests, warnings, advice, and invitations.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Positive:<\/strong> base verb only. <em>\"Sit down.\"<\/em> / <em>\"Open your books.\"<\/em> / <em>\"Turn left.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Negative:<\/strong> don't + base verb. <em>\"Don't move.\"<\/em> / <em>\"Don't be late.\"<\/em> - never <em>\"Don't to move\"<\/em> or <em>\"Don't moving\"<\/em>.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Let's + base verb<\/strong> - a suggestion including yourself. <em>\"Let's go!\"<\/em> / <em>\"Let's have a break.\"<\/em> - never <em>\"Let's to go\"<\/em>.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Please<\/strong> makes any imperative more polite. <em>\"Sit down.\"<\/em> → <em>\"Please sit down.\"<\/em> or <em>\"Sit down, please.\"<\/em><\/div><\/div>\n<div class=\"note\">A bare imperative can sound abrupt in English, so tone and context matter. When you're speaking to someone you don't know well, softer forms like <em>\"Could you sit down?\"<\/em> or <em>\"Would you mind sitting down?\"<\/em> feel far more polite.<\/div>","table":{"headers":["Form","Example","Use"],"rows":[["Positive imperative","Sit down. / Open your books.","Instructions, commands"],["Negative imperative","Don't move. / Don't be late.","Prohibitions, warnings"],["With please","Please be quiet.","Polite requests"],["With do","Do sit down!","Emphasis or warmth"],["With let's","Let's go! / Let's have a break.","First person plural suggestion"]]},"examples":[{"type":"pos","eng":"Turn left at the traffic lights.","note":"Giving directions."},{"type":"pos","eng":"Don't forget your passport!","note":"Reminder/warning."},{"type":"pos","eng":"Let's meet at seven.","note":"\"Let's\" = let us - a shared suggestion."},{"type":"neg","eng":"Don't be so hard on yourself.","note":"Giving emotional advice."}],"errors":[{"bad":"You go straight on.","good":"Go straight on.","reason":"Imperatives have no subject - drop you."},{"bad":"Don't to smoke here.","good":"Don't smoke here.","reason":"\"Don't\" + base verb, no \"to\"."},{"bad":"Let's to go to the beach.","good":"Let's go to the beach.","reason":"\"Let's\" + base verb, no \"to\"."}],"realUse":[],"exercises":[{"type":"gap","title":"Positive and negative imperatives","sub":"Fill each gap with the correct imperative form of the verb in brackets.","items":[{"answer":"Turn","before":"","after":" right at the traffic lights. (turn)"},{"answer":"Don't forget","before":"","after":" your keys! (not forget)"},{"answer":"Sit","before":"","after":" down, please. (sit)"},{"answer":"Don't be","before":"","after":" late! (not be)"},{"answer":"Open","before":"","after":" your books to page ten. (open)"},{"answer":"Don't touch","before":"","after":" that! It's hot! (not touch)"}]},{"type":"match","title":"Match imperative to function","sub":"Match each imperative sentence to its function.","leftHead":"Sentence","rightHead":"Function","pairs":[{"left":"Turn left at the lights.","right":"Giving directions"},{"left":"Don't touch that!","right":"Warning / prohibition"},{"left":"Let's have a break.","right":"Suggestion (we)"},{"left":"Please come in.","right":"Polite invitation"},{"left":"Add the onions and stir.","right":"Recipe instruction"},{"left":"Get some rest.","right":"Giving advice"}]},{"type":"builder","title":"Sentence builder","sub":"Put the words in the correct order.","items":[{"words":["turn","right","at","the","corner"],"answer":"turn right at the corner","context":"Giving directions."},{"words":["don't","be","late","!"],"answer":"don't be late !","context":"A warning."},{"words":["let's","go","to","the","cinema"],"answer":"let's go to the cinema","context":"A suggestion."},{"words":["please","don't","make","noise"],"answer":"please don't make noise","context":"A polite prohibition."},{"words":["always","check","your","work"],"answer":"always check your work","context":"Advice with 'always'."}]}]},{"id":"thereisare","title":"There is / There are","subtitle":"Saying something exists","intro":"How to say that something exists - or doesn't - in a place.","desc":"There is and there are are used to introduce or confirm the existence of something. The choice depends on whether the noun that follows is singular or plural.","tip":"When you want to say something exists, reach for <strong>there is / there are<\/strong>: \"There's a park near here.\" A lot of my students translate it as \"It is a park near here\" - that's a translation, not English. Use <em>there is/are<\/em> to introduce new information.","explanation":"<p>We use <strong>there is / there are<\/strong> to say that something exists. The verb agrees with the noun that follows it - not with the word <em>there<\/em>.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>There is / there's<\/strong> - singular or uncountable noun follows. <em>\"There is a park near here.\"<\/em> / <em>\"There's a problem.\"<\/em> / <em>\"There isn't any milk.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>There are<\/strong> - plural noun follows. <em>\"There are twenty students.\"<\/em> / <em>\"There aren't any seats left.\"<\/em> / <em>\"Are there any messages?\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Don't mix up there is and it is.<\/strong> <em>\"There is a bank near here\"<\/em> says it exists; <em>\"It is a bank\"<\/em> describes what something is. Use <em>there is/are<\/em> for existence and new information.<br>And the short answer never contracts: <em>\"Is there a chemist nearby?\" \"Yes, there is.\"<\/em> - never <em>\"Yes, there's.\"<\/em><\/div>","table":{"headers":["Form","Singular","Plural"],"rows":[["Positive","There is a park. / There's...","There are three bedrooms."],["Negative","There isn't a bus stop here.","There aren't any seats left."],["Question","Is there a chemist nearby?","Are there any restaurants?"],["Short answer","Yes, there is. / No, there isn't.","Yes, there are. / No, there aren't."]]},"examples":[{"type":"pos","eng":"There's a great cafe on the corner.","note":"Introducing new information."},{"type":"pos","eng":"There are twenty students in the class.","note":"Plural noun → there are."},{"type":"neg","eng":"There isn't any milk in the fridge.","note":"Uncountable noun → there isn't."},{"type":"neg","eng":"There aren't any tickets left.","note":"Plural noun → there aren't."}],"errors":[{"bad":"It is a bank near here.","good":"There is a bank near here.","reason":"Use \"there is\" to introduce the existence of something."},{"bad":"There is five people waiting.","good":"There are five people waiting.","reason":"\"Five people\" is plural - use \"there are\"."},{"bad":"Are there a swimming pool?","good":"Is there a swimming pool?","reason":"\"A swimming pool\" is singular - use \"is there\"."}],"realUse":[],"exercises":[{"type":"gap","title":"There is or there are?","sub":"Fill each gap with there is, there are, there isn't, or there aren't.","items":[{"answer":"There's","before":"","after":" a great park near my house."},{"answer":"There are","before":"","after":" twenty students in this class."},{"answer":"There isn't","before":"","after":" any milk in the fridge."},{"answer":"Is there","before":"","after":" a pharmacy near here?"},{"answer":"There aren't","before":"","after":" any tickets left."},{"answer":"There are","before":"","after":" a lot of people waiting."},{"answer":"Are there","before":"","after":" any seats available?"},{"answer":"There is","before":"","after":" a problem with my order."}]},{"type":"convo","title":"Fill the conversation","sub":"Complete the dialogue - use there is, there are, is there or are there.","lines":[{"speaker":"A","text":"Excuse me, [is there] a pharmacy near here?"},{"speaker":"B","text":"Yes, [there is] one on the next street."},{"speaker":"A","text":"And [are there] any cash machines nearby?"},{"speaker":"B","text":"[There are] two - one in the supermarket and one outside the bank."},{"speaker":"A","text":"Great. [Is there] a cafe too? I need a coffee."},{"speaker":"B","text":"Of course! [There are] three cafes on the main square."}]},{"type":"mc","title":"Short answers","sub":"Choose the correct short answer.","items":[{"q":"Is there a bank near here? - ___","opts":["Yes, there's.","Yes, there is.","Yes, is there.","Yes, there are."],"answer":"Yes, there is.","explanation":"Short answers with there is never contract."},{"q":"Are there any questions? - ___","opts":["No, there isn't.","No, aren't.","No, there aren't.","No, there aren't some."],"answer":"No, there aren't.","explanation":"Short answer for there are: No, there aren't."},{"q":"___ any milk in the fridge?","opts":["Is there","Are there","There is","There are"],"answer":"Is there","explanation":"Milk is uncountable (singular) → is there."},{"q":"___ a lot of noise outside.","opts":["There are","Are there","There is","Is there"],"answer":"There is","explanation":"Noise is uncountable → there is."}]}]},{"id":"possessives","title":"Possessive adjectives & pronouns","subtitle":"my/your/his... and mine/yours/his...","intro":"Whose is it? Two overlapping systems here - adjectives that sit before a noun, and pronouns that stand alone.","desc":"English has two ways to express possession. Possessive adjectives (my, your, his) always come before a noun. Possessive pronouns (mine, yours, his) stand alone.","tip":"A mistake I hear all the time: <strong>\"This bag is my.\"<\/strong> It needs to be <strong>\"This bag is mine.\"<\/strong> The moment the word stands alone with no noun after it, switch to <em>mine, yours, hers, his, ours, theirs<\/em>.","explanation":"<p>English has two ways to express possession. Choosing the wrong one is a very common mistake.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Possessive adjectives<\/strong> (my, your, his, her, its, our, their) - always come <em>before<\/em> a noun. They describe the noun. <em>\"My book.\"<\/em> / <em>\"Her car.\"<\/em> / <em>\"Their house.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Possessive pronouns<\/strong> (mine, yours, his, hers, ours, theirs) - stand <em>alone<\/em>, with no noun after them. They replace the whole noun phrase. <em>\"The book is mine.\"<\/em> / <em>\"Is this yours?\"<\/em> / <em>\"The house is theirs.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>The error I correct most:<\/strong> <em>\"This bag is my\"<\/em> ✗ - <em>my<\/em> always needs a noun after it. Standing alone, use the pronoun: <em>\"This bag is mine\"<\/em> ✓.<br><strong>Its vs it's:<\/strong> <em>its<\/em> (no apostrophe) is possessive - <em>\"The dog wagged its tail\"<\/em>; <em>it's<\/em> (with apostrophe) means <em>it is<\/em> - <em>\"It's cold today.\"<\/em><\/div>","table":{"headers":["Subject","Possessive adjective","Possessive pronoun"],"rows":[["I","my - my book","mine - the book is mine"],["you","your - your car","yours - the car is yours"],["he","his - his coat","his - the coat is his"],["she","her - her bag","hers - the bag is hers"],["it","its - its tail","(its - rarely used alone)"],["we","our - our house","ours - the house is ours"],["they","their - their children","theirs - the children are theirs"]]},"examples":[{"type":"pos","eng":"That's my coat.","note":"Possessive adjective before noun."},{"type":"pos","eng":"The blue one is mine.","note":"Possessive pronoun - stands alone."},{"type":"pos","eng":"Their house is bigger than ours.","note":"Two possessive pronouns in one sentence."},{"type":"neg","eng":"That bag isn't hers.","note":"Possessive pronoun after negative be."}],"errors":[{"bad":"This is my.","good":"This is mine.","reason":"Possessive adjectives cannot stand alone."},{"bad":"It's dog is friendly.","good":"Its dog is friendly.","reason":"\"It's\" = it is. \"Its\" (no apostrophe) = possessive."},{"bad":"Their house is bigger than our.","good":"Their house is bigger than ours.","reason":"Possessive pronoun needed, not adjective."}],"realUse":[],"exercises":[{"type":"gap","title":"Possessive adjectives","sub":"Fill each gap with the correct possessive adjective.","items":[{"answer":"my","before":"I forgot ","after":" keys again."},{"answer":"their","before":"They are visiting ","after":" parents this weekend."},{"answer":"her","before":"Maria loves ","after":" job."},{"answer":"its","before":"The dog wagged ","after":" tail."},{"answer":"our","before":"We love ","after":" new apartment."},{"answer":"his","before":"He left ","after":" phone at home."},{"answer":"your","before":"Is this ","after":" bag?"},{"answer":"their","before":"The children forgot ","after":" lunch."}]},{"type":"gap","title":"Possessive pronouns","sub":"Fill each gap with the correct possessive pronoun.","items":[{"answer":"yours","before":"That's not my coat - it must be ","after":"."},{"answer":"hers","before":"The red bag is ","after":"."},{"answer":"ours","before":"Their garden is smaller than ","after":"."},{"answer":"his","before":"I have my ticket. Does he have ","after":"?"},{"answer":"mine","before":"This is not your problem - it's ","after":"."},{"answer":"theirs","before":"Our car is new. ","after":" is old."}]},{"type":"match","title":"Adjective to pronoun","sub":"Match each possessive adjective to its pronoun form.","leftHead":"Adjective (+ noun)","rightHead":"Pronoun (alone)","pairs":[{"left":"my book","right":"mine"},{"left":"your car","right":"yours"},{"left":"his coat","right":"his"},{"left":"her bag","right":"hers"},{"left":"our house","right":"ours"},{"left":"their children","right":"theirs"}]}]},{"id":"preposplace","title":"Prepositions of place","subtitle":"in, on, at, above, under, next to...","intro":"Where is it? English has a rich little system for pinning things down in space.","desc":"Prepositions of place are one of those areas where direct translation from other languages regularly fails. The in/on/at trio alone causes problems for years if not understood from the beginning.","tip":"I get students to feel the three main ones like this: <strong>in<\/strong> = inside something, <strong>on<\/strong> = on a surface, <strong>at<\/strong> = at a point or place. \"I'm in the kitchen.\" \"The keys are on the table.\" \"See you at the station.\"","explanation":"<p>The three key prepositions of place are <strong>in<\/strong>, <strong>on<\/strong>, and <strong>at<\/strong>. Many errors come from translating directly from another language - English does not always match.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>In<\/strong> - enclosed or surrounded: inside a space, a city, a country. <em>\"In the room.\"<\/em> / <em>\"In London.\"<\/em> / <em>\"In a taxi.\"<\/em> / <em>\"In bed.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>On<\/strong> - a surface, a line, or a floor. <em>\"On the table.\"<\/em> / <em>\"On the bus.\"<\/em> / <em>\"On the third floor.\"<\/em> / <em>\"On the right.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>At<\/strong> - a point or destination. Often used with places where you do an activity. <em>\"At home.\"<\/em> / <em>\"At work.\"<\/em> / <em>\"At school.\"<\/em> / <em>\"At the station.\"<\/em> / <em>\"At the airport.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Transport:<\/strong> <em>on<\/em> the bus / train / plane / bike (public transport), but <em>in<\/em> a taxi / car (private vehicle).<br><strong>Fixed expressions:<\/strong> <em>at home, at work, at school<\/em> - no article, always <em>at<\/em>. It's <em>\"I'm at home\"<\/em>, never <em>\"I'm in the home.\"<\/em><\/div>","table":{"headers":["Preposition","Use","Examples"],"rows":[["in","enclosed, inside","in the room, in London, in a box"],["on","surface, line","on the table, on the bus, on the third floor"],["at","point, destination","at home, at work, at the station"],["above","higher than","the picture above the fireplace"],["under / below","lower than","under the table, below sea level"],["next to / beside","immediately to the side","next to the door, beside me"],["between","in the middle of two things","between the bank and the café"]]},"examples":[{"type":"pos","eng":"She's in the kitchen.","note":"Enclosed space → in."},{"type":"pos","eng":"The keys are on the table.","note":"Surface → on."},{"type":"pos","eng":"I'll meet you at the station.","note":"Destination point → at."},{"type":"pos","eng":"The cat is under the sofa.","note":"Below and in contact → under."}],"errors":[{"bad":"She is on the kitchen.","good":"She is in the kitchen.","reason":"Rooms and enclosed spaces use in."},{"bad":"I live in the third floor.","good":"I live on the third floor.","reason":"Floors in buildings use on."},{"bad":"I'm in home.","good":"I'm at home.","reason":"\"At home\" is a fixed expression."}],"realUse":[],"exercises":[{"type":"gap","title":"In, on or at?","sub":"Fill each gap with in, on, or at.","items":[{"answer":"in","before":"She's ","after":" the kitchen."},{"answer":"on","before":"The book is ","after":" the table."},{"answer":"at","before":"I'll see you ","after":" the station."},{"answer":"on","before":"My office is ","after":" the third floor."},{"answer":"in","before":"I'm ","after":" a taxi right now."},{"answer":"at","before":"She's ","after":" work today."},{"answer":"on","before":"They met ","after":" the bus."},{"answer":"in","before":"He was born ","after":" Rome."}]},{"type":"gap","title":"More prepositions of place","sub":"Fill each gap with under, above, next to, between, or behind.","items":[{"answer":"under","before":"The cat is sleeping ","after":" the sofa."},{"answer":"next to","before":"The bank is ","after":" the supermarket."},{"answer":"above","before":"There's a shelf ","after":" the desk."},{"answer":"between","before":"The café is ","after":" the bank and the post office."},{"answer":"behind","before":"The car park is ","after":" the shopping centre."}]},{"type":"categorise","title":"Categorise","sub":"Click a phrase, then click the correct column.","categories":[{"name":"in","items":["the kitchen","a taxi","London","a box","the sky","the fridge"]},{"name":"on","items":["the table","the bus","the third floor","the wall","the right"]},{"name":"at","items":["home","work","the station","school","the airport","the doctor's"]}]}]},{"id":"prepostime","title":"Prepositions of time","subtitle":"at, in, on - with time expressions","intro":"At three o'clock. On Monday. In January. Three prepositions cover most of your time references at A1.","desc":"The same three prepositions (at, in, on) that locate things in space also locate them in time - but with different rules.","tip":"My quick guide: <strong>at<\/strong> for clock times (at 6pm), <strong>on<\/strong> for days (on Monday), <strong>in<\/strong> for months and years (in March, in 2019). And drop the preposition entirely with <em>next, last, this<\/em>: \"See you next Monday\", not \"on next Monday.\"","explanation":"<p>The same three prepositions - <em>at, on, in<\/em> - also locate things in time. The rules are different from their place meanings and must be learnt separately.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>At<\/strong> - specific clock times and fixed time points. <em>\"At 6pm.\"<\/em> / <em>\"At midnight.\"<\/em> / <em>\"At noon.\"<\/em> / <em>\"At Christmas.\"<\/em> / <em>\"At the weekend.\"<\/em> (British English)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>On<\/strong> - days and dates. <em>\"On Monday.\"<\/em> / <em>\"On 5th March.\"<\/em> / <em>\"On my birthday.\"<\/em> / <em>\"On New Year's Day.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>In<\/strong> - months, years, seasons, and times of day. <em>\"In January.\"<\/em> / <em>\"In 2019.\"<\/em> / <em>\"In winter.\"<\/em> / <em>\"In the morning.\"<\/em> / <em>\"In the evening.\"<\/em> Exception: <em>at night<\/em> (not <em>in the night<\/em>).<\/div><\/div>\n<div class=\"note\"><strong>No preposition<\/strong> with <em>next, last, this, every<\/em> + a time word: <em>\"See you next Monday\"<\/em> - never <em>\"on next Monday\"<\/em>; <em>\"I'll call you this evening\"<\/em> - never <em>\"in this evening.\"<\/em><br>And a handy pair: <em>in time<\/em> = with time to spare; <em>on time<\/em> = exactly at the scheduled moment.<\/div>","table":{"headers":["Preposition","Use","Examples"],"rows":[["at","Clock times + fixed points","at 6pm, at noon, at midnight, at Christmas, at the weekend"],["on","Days and dates","on Monday, on 12th April, on my birthday, on New Year's Day"],["in","Months, years, seasons, times of day","in March, in 2019, in winter, in the morning"],["no prep.","This / next / last + time word","this Monday, next week, last year"]]},"examples":[{"type":"pos","eng":"The class starts at half past nine.","note":"\"At\" + clock time."},{"type":"pos","eng":"We met on a cold Tuesday in November.","note":"Day (on) + month (in) - both in one sentence."},{"type":"pos","eng":"I was born in 1990.","note":"\"In\" + year."},{"type":"neg","eng":"I don't work on Sundays.","note":"\"On\" + day of the week."}],"errors":[{"bad":"The party is in Friday.","good":"The party is on Friday.","reason":"Days of the week use on."},{"bad":"I was born on 1992.","good":"I was born in 1992.","reason":"Years use in."},{"bad":"She arrived at the morning.","good":"She arrived in the morning.","reason":"Parts of the day use in. Exception: at night."}],"realUse":[],"exercises":[{"type":"categorise","title":"At, in or on?","sub":"Click a time expression, then click the correct column.","categories":[{"name":"at","items":["6 o'clock","midnight","Christmas","the weekend","noon","night"]},{"name":"on","items":["Monday","14th April","my birthday","New Year's Day","a Tuesday","Saturday morning"]},{"name":"in","items":["March","2019","winter","the morning","the 20th century","the evening"]}]},{"type":"gap","title":"Fill the gaps","sub":"Fill each blank with at, in, on, or - (no preposition).","items":[{"answer":"on","before":"The meeting is ","after":" Tuesday."},{"answer":"in","before":"I was born ","after":" 1988."},{"answer":"at","before":"The class starts ","after":" nine o'clock."},{"answer":"in","before":"She always goes jogging ","after":" the morning."},{"answer":" - ","before":"I'll see you ","after":" next Friday."},{"answer":"at","before":"We always have dinner together ","after":" Christmas."},{"answer":"on","before":"She started university ","after":" 5th September."},{"answer":"in","before":"It gets dark early ","after":" winter."}]},{"type":"mc","title":"At, in, on - or nothing?","sub":"Choose the correct option.","items":[{"q":"I'll call you ___ the morning.","opts":["at","on","in"," - "],"answer":"in","explanation":"Times of day (morning, afternoon, evening) use in."},{"q":"We met ___ a Thursday evening in July.","opts":["at","on","in"," - "],"answer":"on","explanation":"Specific day → on. The month and time of day follow separately."},{"q":"She always works late ___ night.","opts":["in","on","at"," - "],"answer":"at","explanation":"At night is a fixed expression - unlike other times of day which use in."},{"q":"See you ___ next week.","opts":["in","on","at"," - "],"answer":" - ","explanation":"No preposition before next/last/this + time word."}]}]},{"id":"quantifiers","title":"Quantifiers","subtitle":"some, any, much, many, a lot of","intro":"How much? How many? These are your key words for talking about quantity at A1.","desc":"Quantifiers express quantity without using numbers. The some/any distinction alone accounts for a huge number of errors among beginners.","tip":"The rule I want in your head: <strong>some<\/strong> in positive sentences, <strong>any<\/strong> in negatives and questions. \"I have some milk.\" \"I don't have any milk.\" The one exception is offers - \"Would you like <strong>some<\/strong> coffee?\" - because there you're expecting a yes.","explanation":"<p>Quantifiers express quantity without using numbers. The most important distinction at A1 is <strong>some vs any<\/strong>.<\/p>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Some<\/strong> - positive statements: <em>\"I have some milk.\"<\/em> / <em>\"There are some students.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Any<\/strong> - negative sentences and most questions: <em>\"I don't have any money.\"<\/em> / <em>\"Are there any seats?\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Much<\/strong> - with uncountable nouns, mainly in negatives and questions: <em>\"There isn't much time.\"<\/em> / <em>\"How much does it cost?\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>Many<\/strong> - with countable plural nouns, mainly in negatives and questions: <em>\"There aren't many people.\"<\/em> / <em>\"How many students?\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\"><\/div><div class=\"rule-text\"><strong>A lot of<\/strong> - both countable and uncountable, in positive sentences: <em>\"I have a lot of work.\"<\/em> / <em>\"There are a lot of people.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>The exception - some in offers and requests:<\/strong> when you ask a question expecting the answer yes, use <em>some<\/em>, not <em>any<\/em>. <em>\"Would you like some coffee?\"<\/em> / <em>\"Can I have some water?\"<\/em> - you're expecting a yes, so <em>some<\/em> feels natural.<\/div>","table":{"headers":["Quantifier","With","Use / example"],"rows":[["some","count (pl.) + uncount","I need some milk. / There are some students."],["any","count (pl.) + uncount","I don't have any money. / Are there any seats?"],["much","uncountable","There isn't much time. / How much does it cost?"],["many","countable (plural)","There aren't many people. / How many students?"],["a lot of","both","I have a lot of work. / There are a lot of people."]]},"examples":[{"type":"pos","eng":"There's some coffee in the kitchen.","note":"\"Some\" in a positive statement."},{"type":"pos","eng":"I have a lot of homework tonight.","note":"\"A lot of\" in positive sentences."},{"type":"neg","eng":"There isn't any bread left.","note":"\"Any\" in a negative sentence."},{"type":"neg","eng":"There aren't many students today.","note":"\"Many\" with plural countable noun."}],"errors":[{"bad":"There are much people here.","good":"There are many people here.","reason":"Many with countable nouns. Much is for uncountable: much noise, much time."},{"bad":"I don't have no money.","good":"I don't have any money.","reason":"Double negative - English only allows one negative per clause. Use any after don't/doesn't."},{"bad":"I need some informations.","good":"I need some information.","reason":"Information is uncountable - no plural form, even with some."}],"realUse":[],"exercises":[{"type":"categorise","title":"Countable or uncountable?","sub":"Click a word, then click the correct column.","categories":[{"name":"Countable","items":["studen
