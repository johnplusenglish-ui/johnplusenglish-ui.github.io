<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixed Expressions - johnplusenglish</title>
<meta name="description" content="70 essential fixed expressions for fluent English, organised by function. Browse, study, and practise.">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#2176FF;--accent-light:#E8EEFF;--sky:#2176FF;--sky-light:#E8EEFF;--sea:#1DD3B0;--sea-deep:#12907F;--sea-light:#E4FBF7;--coral:#FF6B6B;--coral-light:#FFE8E8;--lavender:#9B72CF;--sun:#FFB347;--cream:#F7F6F3;--ink:#2D3047;--muted:#7A7D8E;--border:#E8E5DF;--card:#fff;--radius:14px;
--shadow-sm:0 1px 3px rgba(45,48,71,.06);--shadow-md:0 4px 14px rgba(45,48,71,.08)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-y:scroll}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}

/* Nav */
.topnav{position:fixed;top:0;left:0;right:0;height:52px;z-index:200;background:rgba(247,246,243,.92);backdrop-filter:blur(16px);border-bottom:1.5px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.nav-logo span{color:#2563EB}
.topnav-links{display:flex;gap:1.25rem}
.topnav-links a{font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s}
.topnav-links a:hover{color:var(--sky)}

/* Header */
.page-header{padding:2rem 2rem 1rem;max-width:960px;margin:0 auto;position:relative;z-index:1}
.topic-hero{display:flex;align-items:flex-start;gap:1.25rem}
.topic-icon{width:52px;height:52px;border-radius:12px;background:color-mix(in srgb, #2D3047 8%, #fff);color:#2D3047;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topic-icon svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor}
.page-header h1{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-.01em;line-height:1.1}

/* Tabs */
.page-container{max-width:960px;margin:0 auto;padding:0 2rem 5rem;position:relative;z-index:1}
.tabs-wrap{max-width:960px;margin:0 auto;padding:0 2rem;position:relative;z-index:1}
.tabs{display:flex;gap:4px;row-gap:4px;border-bottom:none;position:relative;margin-bottom:1.5rem;align-items:flex-end;flex-wrap:wrap;padding-top:8px}
.tabs::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.tab{position:relative;font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:700;padding:.5rem 1.25rem;color:var(--muted);cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1.5px solid var(--border);border-radius:12px 12px 0 0;transition:background .18s,color .18s,box-shadow .18s,border-color .18s}
.tab:not(.active):hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.tab:not(.active):focus-visible{outline:2px solid var(--accent, #2176FF);outline-offset:2px}
.tab.active{outline:none;background:var(--cream);border-color:var(--tab-accent,var(--accent, #2176FF));border-bottom:none!important;color:var(--tab-accent,var(--accent, #2176FF));padding-top:calc(.5rem + 3px);box-shadow:0 -3px 10px rgba(45,48,71,.06);z-index:2}
.tab-content{display:none}
.tab-content.active{display:block}

/* ============ BROWSE (word-bank picker layout) ============ */
.picker{display:grid;grid-template-columns:300px 1fr;gap:1.25rem;align-items:start;transition:grid-template-columns .22s ease}
.picker.sb-collapsed{grid-template-columns:52px 1fr}

.fx-sidebar{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-sm);position:sticky;top:1rem;max-height:calc(100vh - 2rem)}
.fx-sb-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer}
.fx-sidebar.collapsed .fx-sb-head{border-bottom:none;justify-content:center;padding:.75rem .5rem}
.fx-sb-label{font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-sidebar.collapsed .fx-sb-label{display:none}
.fx-sb-toggle{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:all .15s;flex-shrink:0}
.fx-sb-toggle:hover{border-color:var(--accent);color:var(--accent)}
.fx-sb-toggle svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;transition:transform .2s ease}
.fx-sidebar.collapsed .fx-sb-toggle svg{transform:rotate(180deg)}
.fx-sidebar.collapsed .fx-sb-scroll,.fx-sidebar.collapsed .fx-sb-foot{display:none}
.fx-sb-scroll{flex:1;min-height:0;overflow-y:auto;padding:.4rem .5rem .75rem}
.fx-sb-scroll::-webkit-scrollbar{width:4px}
.fx-sb-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.fx-sb-foot{padding:.55rem .9rem;border-top:1px solid var(--border);font-size:.66rem;color:var(--muted)}

.cat{margin-bottom:.4rem}
.cat-toggle{-webkit-appearance:none;appearance:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:.5rem;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--catdot);padding:.6rem .7rem;text-align:left;border-radius:8px;transition:background .15s}
.cat-toggle:hover{background:var(--cream)}
.cat-chev{font-size:.7rem;flex-shrink:0;color:var(--muted);transition:transform .18s}
.cat.shut .cat-chev{transform:rotate(-90deg)}
.cat.shut .cat-rows{display:none}
.cat-rows{background:var(--cream);border-radius:10px;padding:.25rem;margin-top:.15rem}
.bk{-webkit-appearance:none;appearance:none;display:flex;align-items:center;gap:.7rem;width:100%;padding:.55rem .8rem;text-align:left;background:none;border:none;border-radius:6px;box-shadow:none;cursor:pointer;color:var(--ink);font-family:inherit;font-size:.84rem;font-weight:700;line-height:1.25;transition:background .12s ease,box-shadow .12s ease,color .12s ease}
.bk:hover{background:#fff}
.bk.on{background:#fff;box-shadow:var(--shadow-sm)}
.bk.on .bk-name{color:var(--catdot)}
.bk-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the all-expressions row sits outside the trays, so it takes a cream fill instead of a white pill */
.bk-all{margin-bottom:.5rem}
.bk-all:hover,.bk-all.on{background:var(--cream);box-shadow:none}

/* pane */
.fx-pane{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);min-width:0;overflow:hidden;box-shadow:var(--shadow-sm)}
.fx-pane-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.25rem;border-bottom:1.5px solid var(--border)}
.fx-pane-titles{min-width:0}
.fx-pane-head h2{font-size:1.25rem;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.2}
.fx-pane-head p{font-size:.74rem;color:var(--muted);margin:.15rem 0 0}
.fx-body{padding:1rem 1.25rem 1.5rem}

.bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem .85rem;flex-wrap:wrap;margin-bottom:.85rem}
.bar-filters{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.sel{font-family:inherit;font-size:.82rem;font-weight:600;background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:.5rem .6rem;color:var(--ink);cursor:pointer;min-height:38px}
.sel:hover{border-color:var(--ink)}
.sel:focus{outline:none;border-color:var(--accent)}
.sel.set{border-color:var(--accent);color:var(--accent)}

.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:0 2rem}
.gh{grid-column:1/-1;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);padding:.95rem .3rem .3rem;border-bottom:1.5px solid var(--accent);margin-bottom:.1rem}
.gh:first-child{padding-top:.35rem}
.w{padding:.5rem .3rem;border-bottom:1px solid var(--border);cursor:pointer}
.w:hover,.w.open{background:var(--cream)}
.w-t{font-size:.85rem;font-weight:700;margin-bottom:.08rem;line-height:1.35}
.w-d{font-size:.745rem;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w.open .w-d{-webkit-line-clamp:unset;overflow:visible}
.w-x{display:none;font-size:.735rem;font-style:italic;margin-top:.28rem;padding:.3rem .5rem;background:var(--accent-light);border-radius:6px;line-height:1.45;color:var(--ink)}
.w-x b{font-weight:800;font-style:normal}
.w.open .w-x{display:block}
.empty{padding:2.5rem;text-align:center;color:var(--muted);font-size:.85rem;grid-column:1/-1}

/* ============ OPEN CLOZE ============ */
.oc-intro{margin-bottom:1.5rem;color:var(--muted);font-size:.95rem;line-height:1.5}
.oc-layout{display:grid;grid-template-columns:300px 1fr;gap:1.25rem;align-items:start;transition:grid-template-columns .22s ease}
.oc-layout.sb-collapsed{grid-template-columns:52px 1fr}
.oc-sidebar{background:var(--card);border:1.5px solid var(--border);border-radius:14px;display:flex;flex-direction:column;position:sticky;top:68px;max-height:calc(100vh - 84px)}
.oc-sidebar-header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--border);cursor:pointer}
.oc-sidebar.collapsed .oc-sidebar-header{border-bottom:none;justify-content:center;padding:.75rem .5rem}
.oc-sidebar-header-label{font-family:Outfit,sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-sidebar.collapsed .oc-sidebar-header-label{display:none}
.oc-sidebar-toggle{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:all .15s;flex-shrink:0}
.oc-sidebar-toggle:hover{border-color:var(--accent, #2176FF);color:var(--accent, #2176FF)}
.oc-sidebar-toggle svg{width:13px;height:13px;transition:transform .2s ease}
.oc-sidebar.collapsed .oc-sidebar-toggle svg{transform:rotate(180deg)}
.oc-sidebar.collapsed .oc-sidebar-scroll{display:none}
.oc-sidebar-scroll{flex:1;overflow-y:auto;padding:.5rem;max-height:70vh}
.oc-sidebar-scroll::-webkit-scrollbar{width:4px}
.oc-sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.oc-sb-item{display:grid;grid-template-columns:22px 1fr auto;gap:.6rem;align-items:center;padding:.6rem .65rem;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:.15rem}
.oc-sb-item:hover{background:var(--cream)}
.oc-sb-item.active{background:var(--cream)}
.oc-sb-item.active .oc-sb-num,.oc-sb-item.active .oc-sb-theme{color:var(--muted)}
.oc-sb-num{font-family:Outfit,sans-serif;font-size:.68rem;font-weight:500;color:var(--muted);text-align:right}
.oc-sb-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.oc-sb-title{font-family:'Outfit',sans-serif;font-weight:700;font-size:.85rem;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-sb-item.active .oc-sb-title{color:var(--sky)}
.oc-sb-theme{font-family:'Outfit',sans-serif;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-sb-tick{display:flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0}
.oc-content{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:2rem 2rem;box-shadow:0 4px 18px rgba(45,48,71,.05)}
.oc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.5rem}
.oc-title{font-family:'Outfit',sans-serif;font-size:1.8rem;color:var(--ink);font-weight:400;line-height:1.2}
.oc-meta{font-family:Outfit,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent, #2176FF);font-weight:700;margin-bottom:1.5rem}
.oc-meta .oc-meta-sep{color:var(--muted);margin:0 .5rem}
.oc-meta .oc-meta-gaps{color:var(--muted)}
.oc-passage{font-family:'Outfit',sans-serif;font-size:1.05rem;color:var(--ink);line-height:2.2;margin-bottom:1.5rem}
.oc-gap{display:inline-block;position:relative;margin:0 .15em}
.oc-gap-num{font-family:Outfit,sans-serif;font-size:.68rem;color:var(--muted);vertical-align:super;margin-right:.15em;font-weight:700}
.oc-gap-slot{font-family:'Outfit',sans-serif;font-weight:700;font-size:1rem;color:var(--ink);background:transparent;border:none;border-bottom:2px dotted var(--muted);padding:.25rem .25rem;min-width:9.5em;text-align:center;display:inline-block;cursor:pointer;transition:all .15s}
.oc-gap-slot:hover{border-bottom-color:var(--ink);border-bottom-style:solid;background:var(--cream)}
.oc-gap-slot.filled{color:var(--ink);border-bottom-style:solid;border-bottom-color:var(--border)}
.oc-gap-slot.correct{color:#0F7D71;border-bottom-color:#1DD3B0;background:rgba(29,211,176,.08)}
.oc-gap-slot.wrong{color:#FF6B6B;border-bottom-color:#FF6B6B;background:rgba(255,107,107,.06);text-decoration:line-through}
.oc-bank{margin-bottom:1.5rem;padding:1rem 1.25rem;background:var(--cream);border:1.5px dashed var(--border);border-radius:12px}
.oc-bank-label{font-family:Outfit,sans-serif;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.75rem;font-weight:700}
.oc-bank-chips{display:flex;flex-wrap:wrap;gap:.5rem}
.oc-bank-chip{font-family:'Outfit',sans-serif;font-weight:600;font-size:.88rem;color:var(--ink);background:#fff;border:1.5px solid var(--border);border-radius:7px;padding:.5rem 1rem;cursor:pointer;transition:all .15s}
.oc-bank-chip:hover{border-color:var(--accent, #2176FF);color:var(--accent, #2176FF)}
.oc-bank-chip.selected{background:var(--accent, #2176FF);border-color:var(--accent, #2176FF);color:#fff}
.oc-bank-chip.used{opacity:.35;text-decoration:line-through;pointer-events:none}
.oc-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
.oc-btn{font-family:'Outfit',sans-serif;font-weight:700;font-size:.92rem;border:1.5px solid var(--border);border-radius:10px;padding:.75rem 1.25rem;cursor:pointer;transition:all .15s ease;background:var(--card);color:var(--ink)}
.oc-btn:hover{border-color:var(--ink)}
.oc-btn-primary{background:var(--accent, #2176FF);border-color:var(--accent, #2176FF);color:#fff}
.oc-btn-primary:hover{background:#26A79A;border-color:#26A79A}
.oc-result{margin-top:1.25rem;padding:.75rem 1rem;border-radius:10px;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;display:none}
.oc-result.show{display:block}
.oc-result.partial{background:var(--cream);border:1.5px solid var(--border);color:var(--ink)}
.oc-result.full{background:#E4FBF7;border:1.5px solid #1DD3B0;color:#0F7D71}

@media(max-width:820px){
  .picker,.picker.sb-collapsed{grid-template-columns:1fr}
  .fx-sidebar{position:static;max-height:none}
  .fx-sb-scroll{max-height:230px}
  .fx-body{padding:1rem}
  .fx-pane-head{padding:.85rem 1rem}
  .fx-pane-head h2{font-size:1.1rem}
  .bar-filters{width:100%}
  .bar-filters .sel{flex:1;min-width:150px}
  /* stacked: the menu sits above the pane, so collapsing it would just leave an empty card */
  .fx-sb-toggle{display:none}
  .fx-sidebar.collapsed .fx-sb-head{border-bottom:1px solid var(--border);justify-content:space-between;padding:.75rem 1rem;cursor:default}
  .fx-sidebar.collapsed .fx-sb-label{display:block}
  .fx-sidebar.collapsed .fx-sb-scroll,.fx-sidebar.collapsed .fx-sb-foot{display:block}
}
@media(max-width:640px){
  .page-header{padding:4.8rem 1.25rem 1.5rem}
  .page-container{padding:0 1.25rem 4rem}
  .topnav{padding:0 1rem}
  .oc-layout{grid-template-columns:1fr}
  .oc-sidebar{position:static;max-height:none}
  .oc-sidebar-toggle{display:none}
  .oc-sidebar-scroll{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;gap:.4rem}
  .oc-sb-item{flex-shrink:0;min-width:180px;margin-bottom:0}
  .oc-content{padding:1.5rem 1.25rem}
  .oc-passage{font-size:1rem;line-height:2}
}

/* Print */
.print-btn{font-family:'Outfit',sans-serif;font-size:.75rem;font-weight:700;padding:.42rem .75rem;border:1.5px solid var(--border);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.5rem;flex-shrink:0}
.print-btn:hover{border-color:var(--ink);background:var(--ink);color:var(--cream)}
.print-modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(45,48,71,.45);backdrop-filter:blur(4px);z-index:300;display:none;align-items:center;justify-content:center;padding:1rem}
.print-modal-backdrop.open{display:flex}
.print-modal{background:var(--card);border-radius:18px;padding:2rem;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(45,48,71,.18);max-height:90vh;overflow-y:auto}
.print-modal h3{font-family:'Outfit',sans-serif;font-size:1.15rem;font-weight:800;color:var(--ink);margin-bottom:.25rem}
.print-modal-desc{font-size:.85rem;color:var(--muted);margin-bottom:1.25rem;line-height:1.5}
.print-opts{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem}
.print-opt{display:flex;align-items:flex-start;gap:.5rem;padding:.75rem .75rem;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;background:#fff}
.print-opt:hover{border-color:var(--ink)}
.print-opt input[type=radio]{margin-top:.25rem}
.print-opt-content{flex:1}
.print-opt-label{font-weight:700;font-size:.88rem}
.print-opt-desc{font-size:.78rem;color:var(--muted);margin-top:.25rem}
.print-opt:has(input:checked){border-color:var(--sky);background:var(--sky-light)}
.print-actions{display:flex;gap:.5rem;margin-top:1.25rem;justify-content:flex-end}
</style>
<style>.topnav{display:none!important}</style>
</head>
<body>

<div class="topnav">
  <a class="nav-logo" href="index.html">john<span>plus</span>english</a>
  <div class="topnav-links">
    <a href="index.html">Home</a>
  </div>
</div>

<div class="page-header">  <div class="topic-hero">
    <div class="topic-icon"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21c2-.3 4-1.5 4-6V6c0-1-.6-1.6-1.6-1.6H4.6C3.6 4.4 3 5 3 6v6c0 1 .6 1.6 1.6 1.6H6c0 2-1 3-2 3.4V21z"></path><path d="M18 21c2-.3 4-1.5 4-6V6c0-1-.6-1.6-1.6-1.6h-5.8c-1 0-1.6.6-1.6 1.6v6c0 1 .6 1.6 1.6 1.6H16c0 2-1 3-2 3.4V21z"></path></svg></div>
    <div><h1>Fixed Expressions</h1></div>
  </div>
</div>
<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('browse',this)" style="--tab-accent:#2176FF">Browse</button>
    <button class="tab" onclick="switchTab('practice',this)" style="--tab-accent:#2176FF">Practice</button>
  </div>
</div>

<div class="page-container">
  <!-- BROWSE TAB -->
  <div class="tab-content active" id="tab-browse">
    <div class="picker" id="picker">

      <aside class="fx-sidebar" id="fxSidebar">
        <div class="fx-sb-head" onclick="toggleSetMenu()">
          <span class="fx-sb-label">All Sets</span>
          <button class="fx-sb-toggle" type="button" aria-label="Collapse list" onclick="event.stopPropagation();toggleSetMenu()"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        </div>
        <div class="fx-sb-scroll" id="setList"></div>
        <div class="fx-sb-foot"><b id="totalN">0</b> expressions across <b id="totalSets">0</b> sets</div>
      </aside>

      <div class="fx-pane">
        <div class="fx-pane-head">
          <div class="fx-pane-titles">
            <h2 id="hName"></h2>

<script>
const CATS = [{"id": "opinions", "label": "Giving Opinions", "color": "#2176FF", "items": [{"expr": "as far as I'm concerned", "def": "used to introduce your personal opinion", "ex": "<b>As far as I'm concerned</b>, the decision was completely unfair.", "reg": "neutral", "level": "B2"}, {"expr": "to be honest", "def": "used before sharing a frank opinion", "ex": "<b>To be honest</b>, I didn't think much of the film.", "reg": "neutral", "level": "B2"}, {"expr": "if you ask me", "def": "used to give a strong personal opinion, often uninvited", "ex": "<b>If you ask me</b>, the whole system needs an overhaul.", "reg": "informal", "level": "B2"}, {"expr": "the way I see it", "def": "used to present your perspective on a situation", "ex": "<b>The way I see it</b>, we don't really have a choice.", "reg": "neutral", "level": "B2"}, {"expr": "at the end of the day", "def": "used before stating the most important fact or conclusion", "ex": "<b>At the end of the day</b>, what matters is that you're happy.", "reg": "informal", "level": "B2"}, {"expr": "from my point of view", "def": "used to present your personal perspective", "ex": "<b>From my point of view</b>, the proposal makes perfect sense.", "reg": "neutral", "level": "B2"}, {"expr": "I'd say that", "def": "a soft way of introducing an opinion or estimate", "ex": "<b>I'd say</b> about half the team agree with the changes.", "reg": "neutral", "level": "B2"}, {"expr": "personally speaking", "def": "used to emphasise that something is your own view", "ex": "<b>Personally speaking</b>, I think remote work is far more productive.", "reg": "neutral", "level": "C1"}, {"expr": "it goes without saying", "def": "used to say something is obviously true", "ex": "<b>It goes without saying</b> that safety comes first.", "reg": "neutral", "level": "B2"}, {"expr": "for what it's worth", "def": "used before sharing an opinion you're not sure will be valued", "ex": "<b>For what it's worth</b>, I think you made the right call.", "reg": "neutral", "level": "C1"}]}, {"id": "agreeing", "label": "Agreeing & Disagreeing", "color": "#2176FF", "items": [{"expr": "I couldn't agree more", "def": "used to show total agreement", "ex": "<b>I couldn't agree more</b> - the policy is long overdue.", "reg": "neutral", "level": "B2"}, {"expr": "that's a fair point", "def": "used to acknowledge someone has made a valid argument", "ex": "<b>That's a fair point</b>, but I still think we should wait.", "reg": "neutral", "level": "B2"}, {"expr": "I see what you mean", "def": "used to show you understand someone's argument", "ex": "<b>I see what you mean</b>, but the data doesn't support that.", "reg": "neutral", "level": "B2"}, {"expr": "I beg to differ", "def": "a polite way of saying you disagree", "ex": "<b>I beg to differ</b> - the evidence suggests otherwise.", "reg": "formal", "level": "C1"}, {"expr": "that's not necessarily the case", "def": "used to politely challenge an assumption", "ex": "<b>That's not necessarily the case</b> - it depends on the context.", "reg": "neutral", "level": "C1"}, {"expr": "you've got a point", "def": "used to acknowledge someone's argument is valid", "ex": "<b>You've got a point</b> - I hadn't thought of it that way.", "reg": "neutral", "level": "B2"}, {"expr": "I take your point", "def": "used to show you understand someone's argument, even if you don't fully agree", "ex": "<b>I take your point</b>, but the cost is still a major issue.", "reg": "neutral", "level": "C1"}, {"expr": "with all due respect", "def": "used before politely disagreeing with someone, often someone senior", "ex": "<b>With all due respect</b>, I think that approach is outdated.", "reg": "formal", "level": "C1"}, {"expr": "fair enough", "def": "used to accept a point or decision even if you don't fully agree", "ex": "You don't want to come? <b>Fair enough</b>.", "reg": "informal", "level": "B2"}, {"expr": "I'm not so sure about that", "def": "a soft way of expressing doubt or disagreement", "ex": "<b>I'm not so sure about that</b> - the numbers don't add up.", "reg": "neutral", "level": "B2"}]}, {"id": "hedging", "label": "Hedging & Softening", "color": "#2176FF", "items": [{"expr": "to be fair", "def": "used to add balance or acknowledge the other side", "ex": "<b>To be fair</b>, he did warn us it might not work.", "reg": "neutral", "level": "B2"}, {"expr": "having said that", "def": "used to introduce a contrasting point after something you've just said", "ex": "It's expensive. <b>Having said that</b>, the quality is excellent.", "reg": "neutral", "level": "B2"}, {"expr": "it depends on", "def": "used to say the answer varies according to circumstances", "ex": "<b>It depends on</b> what you mean by 'affordable'.", "reg": "neutral", "level": "B2"}, {"expr": "more or less", "def": "approximately; not exactly but close enough", "ex": "I'm <b>more or less</b> ready - give me five minutes.", "reg": "neutral", "level": "B2"}, {"expr": "as a general rule", "def": "used to describe what is usually true, while allowing for exceptions", "ex": "<b>As a general rule</b>, the earlier you book, the cheaper it is.", "reg": "neutral", "level": "B2"}, {"expr": "it's not that simple", "def": "used to say a situation is more complex than it appears", "ex": "<b>It's not that simple</b> - there are legal issues to consider.", "reg": "neutral", "level": "B2"}, {"expr": "I may be wrong, but", "def": "used to introduce an uncertain opinion politely", "ex": "<b>I may be wrong</b>, but I think the meeting was rescheduled.", "reg": "neutral", "level": "B2"}, {"expr": "as far as I know", "def": "used to say something you believe is true but aren't completely certain about", "ex": "<b>As far as I know</b>, the deadline hasn't changed.", "reg": "neutral", "level": "B2"}, {"expr": "correct me if I'm wrong", "def": "used before stating something you believe is true, inviting others to challenge it", "ex": "<b>Correct me if I'm wrong</b>, but didn't we agree on Tuesday?", "reg": "neutral", "level": "B2"}, {"expr": "broadly speaking", "def": "used to make a general statement that may not be true in every case", "ex": "<b>Broadly speaking</b>, people are working longer hours than they used to.", "reg": "formal", "level": "C1"}]}, {"id": "adding", "label": "Adding & Contrasting", "color": "#2176FF", "items": [{"expr": "on top of that", "def": "used to add another point that makes a situation more extreme", "ex": "The flight was delayed, and <b>on top of that</b>, they lost my bag.", "reg": "neutral", "level": "B2"}, {"expr": "on the other hand", "def": "used to introduce a contrasting viewpoint or fact", "ex": "It's expensive. <b>On the other hand</b>, the quality is superb.", "reg": "neutral", "level": "B2"}, {"expr": "not only... but also", "def": "used to emphasise that two things are true", "ex": "She's <b>not only</b> a great teacher <b>but also</b> an excellent communicator.", "reg": "neutral", "level": "B2"}, {"expr": "what's more", "def": "used to add a stronger or more surprising point", "ex": "He refused to help, and <b>what's more</b>, he blamed us for the problem.", "reg": "neutral", "level": "B2"}, {"expr": "that being said", "def": "used to introduce a contrasting point, similar to 'having said that'", "ex": "The hotel was lovely. <b>That being said</b>, the location wasn't ideal.", "reg": "neutral", "level": "B2"}, {"expr": "in addition to", "def": "used to add extra information", "ex": "<b>In addition to</b> his teaching, he runs a blog on linguistics.", "reg": "formal", "level": "B2"}, {"expr": "at the same time", "def": "used to introduce a contrasting or complicating factor", "ex": "I want to help, but <b>at the same time</b>, I don't want to interfere.", "reg": "neutral", "level": "B2"}, {"expr": "to make matters worse", "def": "used to add a further negative development", "ex": "We missed the bus, and <b>to make matters worse</b>, it started raining.", "reg": "neutral", "level": "B2"}, {"expr": "on the flip side", "def": "used to introduce a positive aspect of something mostly negative, or vice versa", "ex": "The hours are long, but <b>on the flip side</b>, the salary is excellent.", "reg": "informal", "level": "B2"}, {"expr": "by the same token", "def": "used to add a point that follows logically from what was just said", "ex": "If we want results, <b>by the same token</b>, we have to invest more.", "reg": "formal", "level": "C1"}]}, {"id": "explaining", "label": "Explaining & Sequencing", "color": "#2176FF", "items": [{"expr": "first of all", "def": "used to introduce the first point in a list or argument", "ex": "<b>First of all</b>, let me explain the background.", "reg": "neutral", "level": "B2"}, {"expr": "in other words", "def": "used to rephrase something more clearly", "ex": "He's been made redundant - <b>in other words</b>, he lost his job.", "reg": "neutral", "level": "B2"}, {"expr": "as a result", "def": "used to show the consequence of something", "ex": "The factory closed, and <b>as a result</b>, three hundred people lost their jobs.", "reg": "neutral", "level": "B2"}, {"expr": "for instance", "def": "used to give an example", "ex": "There are many options - <b>for instance</b>, we could try online advertising.", "reg": "neutral", "level": "B2"}, {"expr": "the thing is", "def": "used to introduce a key problem or explanation", "ex": "<b>The thing is</b>, we simply can't afford it right now.", "reg": "informal", "level": "B2"}, {"expr": "the point is", "def": "used to emphasise the most important fact or argument", "ex": "<b>The point is</b>, nobody consulted us before making the decision.", "reg": "neutral", "level": "B2"}, {"expr": "put it this way", "def": "used before rephrasing something more directly or memorably", "ex": "<b>Put it this way</b> - if I had to choose, I wouldn't go back.", "reg": "informal", "level": "B2"}, {"expr": "to put it simply", "def": "used to rephrase something in a clearer, less complicated way", "ex": "<b>To put it simply</b>, we've run out of money.", "reg": "neutral", "level": "B2"}, {"expr": "that's to say", "def": "used to clarify or rephrase something", "ex": "She's his cousin - <b>that's to say</b>, they're related on his mother's side.", "reg": "neutral", "level": "C1"}, {"expr": "all things considered", "def": "used to give a final judgement after weighing up all the facts", "ex": "<b>All things considered</b>, the trip was a success.", "reg": "neutral", "level": "C1"}]}, {"id": "reacting", "label": "Reacting & Responding", "color": "#2176FF", "items": [{"expr": "no wonder", "def": "used to say something is not surprising given the circumstances", "ex": "He slept four hours - <b>no wonder</b> he's exhausted.", "reg": "neutral", "level": "B2"}, {"expr": "that makes sense", "def": "used to show you understand and accept an explanation", "ex": "Ah, <b>that makes sense</b> - I thought something was off.", "reg": "neutral", "level": "B2"}, {"expr": "you've got a point", "def": "used to acknowledge someone has raised a valid argument", "ex": "<b>You've got a point</b> - we should probably check the contract.", "reg": "neutral", "level": "B2"}, {"expr": "tell me about it", "def": "used to strongly agree with someone about a shared frustration", "ex": "'The commute is a nightmare.' '<b>Tell me about it</b> - mine's even worse.'", "reg": "informal", "level": "B2"}, {"expr": "you can say that again", "def": "used to emphatically agree with what someone just said", "ex": "'This weather is awful.' '<b>You can say that again</b>.'", "reg": "informal", "level": "B2"}, {"expr": "if I'm not mistaken", "def": "used to introduce something you believe is true but want to confirm", "ex": "<b>If I'm not mistaken</b>, you two have already met?", "reg": "neutral", "level": "B2"}, {"expr": "it serves you right", "def": "used to say someone deserves a bad outcome because of their own actions", "ex": "You didn't study and failed? <b>It serves you right</b>.", "reg": "informal", "level": "B2"}, {"expr": "how come?", "def": "an informal way of asking 'why?'", "ex": "You're not going? <b>How come</b>?", "reg": "informal", "level": "B2"}, {"expr": "believe it or not", "def": "used to introduce something surprising", "ex": "<b>Believe it or not</b>, she's never been abroad.", "reg": "neutral", "level": "B2"}, {"expr": "funnily enough", "def": "used to introduce a surprising coincidence", "ex": "<b>Funnily enough</b>, I was just thinking about you.", "reg": "neutral", "level": "B2"}]}, {"id": "social", "label": "Social & Conversational", "color": "#2176FF", "items": [{"expr": "by the way", "def": "used to introduce a new topic or a related aside", "ex": "<b>By the way</b>, did you hear about the office move?", "reg": "neutral", "level": "B2"}, {"expr": "speaking of which", "def": "used to transition to a related topic", "ex": "We were talking about holidays - <b>speaking of which</b>, have you booked yours?", "reg": "neutral", "level": "B2"}, {"expr": "long time no see", "def": "a greeting used when you haven't seen someone for a while", "ex": "Tom! <b>Long time no see</b> - how've you been?", "reg": "informal", "level": "B2"}, {"expr": "it's up to you", "def": "used to tell someone the decision is theirs", "ex": "We can eat in or go out - <b>it's up to you</b>.", "reg": "neutral", "level": "B2"}, {"expr": "take your time", "def": "used to tell someone there is no rush", "ex": "<b>Take your time</b> - there's no hurry.", "reg": "neutral", "level": "B2"}, {"expr": "you know what I mean", "def": "used to check if the listener understands your point", "ex": "It's not rude exactly, just a bit blunt - <b>you know what I mean</b>?", "reg": "informal", "level": "B2"}, {"expr": "where were we?", "def": "used to return to a topic after an interruption", "ex": "Sorry about that phone call. Now, <b>where were we</b>?", "reg": "neutral", "level": "B2"}, {"expr": "to cut a long story short", "def": "used to skip over details and get to the main point", "ex": "<b>To cut a long story short</b>, we missed the flight and had to rebook.", "reg": "neutral", "level": "B2"}, {"expr": "between you and me", "def": "used to share something confidential", "ex": "<b>Between you and me</b>, I don't think he's going to last in that job.", "reg": "informal", "level": "B2"}, {"expr": "don't get me wrong", "def": "used before clarifying something so it isn't misunderstood", "ex": "<b>Don't get me wrong</b>, I like the idea - I just think the timing is off.", "reg": "neutral", "level": "B2"}]}, {"id": "generalising", "label": "Generalising & Specifying", "color": "#2176FF", "items": [{"expr": "on the whole", "def": "generally; considering everything", "ex": "<b>On the whole</b>, the project has been a success.", "reg": "neutral", "level": "B2"}, {"expr": "by and large", "def": "mostly; in general", "ex": "<b>By and large</b>, people are happy with the new system.", "reg": "neutral", "level": "C1"}, {"expr": "in particular", "def": "especially; more than others", "ex": "The food was great - the dessert <b>in particular</b>.", "reg": "neutral", "level": "B2"}, {"expr": "as a rule of thumb", "def": "as a rough guide or general principle", "ex": "<b>As a rule of thumb</b>, you should save at least ten per cent of your income.", "reg": "neutral", "level": "B2"}, {"expr": "generally speaking", "def": "used to make a broad statement that may not be true in every case", "ex": "<b>Generally speaking</b>, the trains are reliable.", "reg": "neutral", "level": "B2"}, {"expr": "strictly speaking", "def": "if we follow the rules or facts exactly", "ex": "<b>Strictly speaking</b>, you need a permit to park here.", "reg": "formal", "level": "C1"}, {"expr": "to a certain extent", "def": "partly but not completely", "ex": "I agree <b>to a certain extent</b>, but it's not the whole picture.", "reg": "neutral", "level": "B2"}, {"expr": "on balance", "def": "after considering all the facts", "ex": "<b>On balance</b>, I think moving was the right decision.", "reg": "neutral", "level": "C1"}, {"expr": "as a whole", "def": "considered altogether rather than individually", "ex": "The team <b>as a whole</b> performed well, despite a few weak spots.", "reg": "neutral", "level": "B2"}, {"expr": "in a nutshell", "def": "in a very brief summary", "ex": "<b>In a nutshell</b>, the deal fell through because of the price.", "reg": "neutral", "level": "B2"}]}, {"id": "certainty", "label": "Certainty & Doubt", "color": "#2176FF", "items": [{"expr": "without a doubt", "def": "certainly; with no uncertainty at all", "ex": "She is <b>without a doubt</b> the best candidate for the job.", "reg": "neutral", "level": "B2"}, {"expr": "there's no question", "def": "used to say something is definitely true", "ex": "<b>There's no question</b> that he's talented - the issue is consistency.", "reg": "neutral", "level": "B2"}, {"expr": "I wouldn't be surprised if", "def": "used to say something seems likely", "ex": "<b>I wouldn't be surprised if</b> they cancelled the event.", "reg": "neutral", "level": "B2"}, {"expr": "chances are", "def": "it is likely that", "ex": "<b>Chances are</b> he's stuck in traffic - give him ten minutes.", "reg": "informal", "level": "B2"}, {"expr": "as far as I can tell", "def": "based on what I know or can observe", "ex": "<b>As far as I can tell</b>, nobody's complained about it.", "reg": "neutral", "level": "B2"}, {"expr": "it remains to be seen", "def": "we will only know the result later", "ex": "<b>It remains to be seen</b> whether the new policy will actually work.", "reg": "formal", "level": "C1"}, {"expr": "I'm pretty sure", "def": "used to express high but not total confidence", "ex": "<b>I'm pretty sure</b> the meeting is at three, not two.", "reg": "informal", "level": "B2"}, {"expr": "there's every chance", "def": "it is very likely", "ex": "<b>There's every chance</b> we'll finish on time if we start now.", "reg": "neutral", "level": "B2"}, {"expr": "I have my doubts", "def": "I'm not confident that something is true or will happen", "ex": "He says he'll be ready by Friday, but <b>I have my doubts</b>.", "reg": "neutral", "level": "B2"}, {"expr": "only time will tell", "def": "we will have to wait to see the result", "ex": "The reforms sound promising, but <b>only time will tell</b>.", "reg": "neutral", "level": "B2"}]}, {"id": "advice", "label": "Giving Advice & Suggesting", "color": "#2176FF", "items": [{"expr": "if I were you", "def": "used to give advice by imagining yourself in someone's position", "ex": "<b>If I were you</b>, I'd take the job and worry about the rest later.", "reg": "neutral", "level": "B2"}, {"expr": "you might want to", "def": "a soft way of making a suggestion", "ex": "<b>You might want to</b> double-check the address before we leave.", "reg": "neutral", "level": "B2"}, {"expr": "it might be worth", "def": "used to suggest something could be beneficial", "ex": "<b>It might be worth</b> getting a second opinion from another doctor.", "reg": "neutral", "level": "B2"}, {"expr": "there's no harm in", "def": "used to suggest trying something because there's no risk", "ex": "<b>There's no harm in</b> asking - the worst they can say is no.", "reg": "neutral", "level": "B2"}, {"expr": "you'd be better off", "def": "used to suggest a preferable course of action", "ex": "<b>You'd be better off</b> taking the train - driving will take twice as long.", "reg": "neutral", "level": "B2"}, {"expr": "have you considered", "def": "a polite way of suggesting an alternative someone may not have thought of", "ex": "<b>Have you considered</b> working part-time while you study?", "reg": "neutral", "level": "B2"}, {"expr": "why don't you", "def": "a direct but friendly way of making a suggestion", "ex": "<b>Why don't you</b> take a few days off? You look exhausted.", "reg": "neutral", "level": "B2"}, {"expr": "if it helps", "def": "used to offer something that might be useful", "ex": "<b>If it helps</b>, I can send you the notes from the meeting.", "reg": "neutral", "level": "B2"}, {"expr": "you could always", "def": "used to s const CAT_BY_ID = {};
CATS.forEach(c => CAT_BY_ID[c.id] = c);

const ALL = [];
CATS.forEach(c => c.items.forEach(item => ALL.push(Object.assign({}, item, {catId:c.id, catLabel:c.label, catColor:c.color}))));

// sidebar grouping - collapsible, same shape as the Word Banks bank menu
const SET_GROUPS = [
  {name:'Opinion & argument',   ids:['opinions','agreeing','hedging','certainty']},
  {name:'Structuring & linking',ids:['adding','explaining','cause','comparing','generalising']},
  {name:'Conversation & advice',ids:['reacting','social','advice','time']}
];
const GROUP_COLOR = ['#2176FF','#2176FF','#2176FF'];

let setId = 'all', reg = 'all';

// groups start closed, bar the one holding the current set
const shutGroups = new Set(SET_GROUPS.map(g => g.name));
shutGroups.delete((SET_GROUPS.filter(g => g.ids.indexOf(setId) > -1)[0] || SET_GROUPS[0]).name);

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const setEntries = id => id === 'all' ? ALL : ALL.filter(e => e.catId === id);

function shownList() {
  return setEntries(setId).filter(e => reg === 'all' || e.reg === reg);
}

function renderSetList() {
  let h = '<button class="bk bk-all' + (setId === 'all' ? ' on' : '') + '" data-s="all" style="--catdot:var(--ink)">'
        + '<span class="bk-name">All expressions</span></button>';
  SET_GROUPS.forEach((g, gi) => {
    const shut = shutGroups.has(g.name);
    h += '<div class="cat' + (shut ? ' shut' : '') + '" style="--catdot:' + GROUP_COLOR[gi % GROUP_COLOR.length] + '">'
       + '<button class="cat-toggle" data-g="' + esc(g.name) + '">' + esc(g.name)
       + '<span class="cat-chev">&#9662;</span></button>'
       + '<div class="cat-rows">';
    g.ids.forEach(id => {
      const c = CAT_BY_ID[id];
      if (!c) return;
      h += '<button class="bk' + (setId === id ? ' on' : '') + '" data-s="' + id + '">'
         + '<span class="bk-name">' + esc(c.label) + '</span></button>';
    });
    h += '</div></div>';
  });
  const box = document.getElementById('setList');
  const keep = box.scrollTop;          // re-rendering would otherwise snap the list back to the top
  box.innerHTML = h;
  box.scrollTop = keep;
  box.querySelectorAll('.bk').forEach(b => b.addEventListener('click', () => goSet(b.dataset.s)));
  box.querySelectorAll('.cat-toggle').forEach(t => t.addEventListener('click', () => {
    const n = t.dataset.g;
    shutGroups.has(n) ? shutGroups.delete(n) : shutGroups.add(n);
    renderSetList();
  }));
}

function goSet(id) {
  setId = id;
  renderSetList();
  renderBrowse();
  if (window.matchMedia('(max-width:820px)').matches) {
    const pane = document.querySelector('.fx-pane');
    if (pane) pane.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

function toggleSetMenu() {
  if (window.matchMedia('(max-width:820px)').matches) return;
  document.getElementById('fxSidebar').classList.toggle('collapsed');
  document.getElementById('picker').classList.toggle('sb-collapsed');
}

const REG_LABEL = {formal:'Formal', neutral:'Neutral', informal:'Informal'};

function renderBrowse() {
  const isAll = setId === 'all';
  const cat = isAll ? null : CAT_BY_ID[setId];
  const base = setEntries(setId);

  document.getElementById('hName').textContent = isAll ? 'All expressions' : cat.label;
  document.getElementById('hSub').textContent = isAll
    ? CATS.length + ' sets · ' + ALL.length + ' expressions'
    : base.length + ' expressions';

  const regN = {};
  base.forEach(e => { regN[e.reg] = (regN[e.reg] || 0) + 1; });
  // a filter that this set has nothing for would leave the dropdown and the list disagreeing
  if (reg !== 'all' && !regN[reg]) reg = 'all';

  let h = '<div class="bar"><div class="bar-filters">'
    + '<select class="sel' + (reg !== 'all' ? ' set' : '') + '" id="regSel">'
    + '<option value="all">All registers (' + base.length + ')</option>'
    + ['formal','neutral','informal'].filter(r => regN[r]).map(r =>
        '<option value="' + r + '"' + (reg === r ? ' selected' : '') + '>' + REG_LABEL[r] + ' (' + regN[r] + ')</option>').join('')
    + '</select></div></div>'
    + '<div class="sheet" id="fxSheet"></div>';

  document.getElementById('browse-content').innerHTML = h;

  document.getElementById('regSel').addEventListener('change', e => {
    reg = e.target.value; e.target.classList.toggle('set', reg !== 'all'); renderSheet();
  });

  renderSheet();
}

function exprRow(e) {
  return '<div class="w" data-row>'
    + '<div class="w-t">' + esc(e.expr) + '</div>'
    + '<div class="w-d">' + esc(e.def) + '</div>'
    + '<div class="w-x">' + e.ex + '</div>'
    + '</div>';
}

function renderSheet() {
  const list = shownList();
  let h = '';
  if (!list.length) {
    h = '<div class="empty">Nothing matches.</div>';
  } else if (setId === 'all') {
    CATS.forEach(c => {
      const items = list.filter(e => e.catId === c.id);
      if (!items.length) return;
      h += '<div class="gh">' + esc(c.label) + ' · ' + items.length + '</div>' + items.map(exprRow).join('');
    });
  } else {
    h = list.map(exprRow).join('');
  }
  const sheet = document.getElementById('fxSheet');
  sheet.innerHTML = h;
  sheet.querySelectorAll('[data-row]').forEach(r => r.addEventListener('click', () => {
    const was = r.classList.contains('open');
    sheet.querySelectorAll('.w.open').forEach(o => o.classList.remove('open'));
    if (!was) r.classList.add('open');
  }));
}

    var isActive = i === currentPassage;
    var cls = isActive ? ' active' : '';
    var tick = checked[i] ? '<span class="oc-sb-tick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2176FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' : '';
    html += '<div class="oc-sb-item' + cls + '" onclick="selectPassage(' + i + ')">'
      + '<span class="oc-sb-num">' + String(i+1).padStart(2,'0') + '</span>'
      + '<div class="oc-sb-text"><span class="oc-sb-title">' + p.title + '</span>'
      + '<span class="oc-sb-theme">' + p.cat + '</span></div>'
      + tick
      + '</div>';
  });
  sb.innerHTML = html;
}

function renderPassage() {
  var p = PASSAGES[currentPassage];
  var myAnswers = answers[currentPassage] || {};
  var isChecked = checked[currentPassage];

  // Word bank
  var bankHtml = '<div class="oc-bank"><div class="oc-bank-label">Word bank &middot; click to copy</div><div class="oc-bank-chips">';
  p.bank.forEach(function(word) {
    var isUsed = false;
    Object.keys(myAnswers).forEach(function(k) { if (myAnswers[k] === word) isUsed = true; });
    var cls = 'oc-bank-chip';
    if (isUsed) cls += ' used';
    if (selectedWord === word && !isUsed) cls += ' selected';
    bankHtml += '<span class="' + cls + '" onclick="selectChip(this,\'' + word.replace(/'/g, "\\x27") + '\')">' + word + '</span>';
  });
  bankHtml += '</div></div>';

  // Passage text
  var text = p.text;
  for (var g = p.answers.length; g >= 1; g--) {
    var answer = myAnswers[g] || '';
    var slotClass = 'oc-gap-slot';
    if (answer) slotClass += ' filled';
    if (isChecked && answer) {
      slotClass += answer.toLowerCase() === p.answers[g-1].toLowerCase() ? ' correct' : ' wrong';
    }
    var display = answer || '';
    text = text.replace('{' + g + '}', '<span class="oc-gap"><span class="oc-gap-num">(' + g + ')</span><span class="' + slotClass + '" onclick="clickGap(' + g + ')">' + display + '</span></span>');
  }

  // Actions
  var actHtml = '<div class="oc-actions">';
  if (!isChecked) {
    actHtml += '<button class="oc-btn oc-btn-primary" onclick="checkPassage()">Check answers</button>';
    actHtml += '<button class="oc-btn" onclick="clearPassage()">Clear</button>';
    actHtml += '<button class="oc-btn" onclick="revealPassage()">Reveal</button>';
  } else {
    var correct = 0;
    Object.keys(myAnswers).forEach(function(k) { if (myAnswers[k].toLowerCase() === p.answers[k-1].toLowerCase()) correct++; });
    var total = p.answers.length;
    var resClass = correct === total ? 'full' : 'partial';
    actHtml += '<button class="oc-btn" onclick="retryPassage()">Try again</button>';
    actHtml += '</div>';
    actHtml += '<div class="oc-result show ' + resClass + '">' + correct + ' / ' + total + ' correct' + (correct === total ? ' - Perfect!' : '') + '</div>';
  }
  if (!isChecked) actHtml += '</div>';

  document.getElementById('oc-content').innerHTML =
    '<div class="oc-head"><div class="oc-title">' + p.title + '</div>'
    + '<button class="print-btn" onclick="openPrintModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>Print</button></div>'
    + '<div class="oc-meta">' + p.cat + '<span class="oc-meta-sep">&middot;</span><span class="oc-meta-gaps">' + p.answers.length + ' gaps</span></div>'
    + bankHtml
    + '<div class="oc-passage">' + text + '</div>'
    + actHtml;
}

function selectChip(chip, word) {
  if (chip.classList.contains('used')) return;
  document.querySelectorAll('.oc-bank-chip.selected').forEach(function(c) { c.classList.remove('selected'); });
  if (selectedWord === word) { selectedWord = null; return; }
  selectedWord = word;
  chip.classList.add('selected');
}

function clickGap(num) {
  if (checked[currentPassage]) return;
  if (!answers[currentPassage]) answers[currentPassage] = {};
  if (selectedWord) {
    Object.keys(answers[currentPassage]).forEach(function(k) {
      if (answers[currentPassage][k] === selectedWord) delete answers[currentPassage][k];
    });
    answers[currentPassage][num] = selectedWord;
    selectedWord = null;
    renderPassage();
  } else if (answers[currentPassage][num]) {
    delete answers[currentPassage][num];
    renderPassage();
  }
}

function checkPassage() { checked[currentPassage] = true; renderPassage(); renderSidebar(); }
function clearPassage() { answers[currentPassage] = {}; selectedWord = null; renderPassage(); }
function retryPassage() { answers[currentPassage] = {}; checked[currentPassage] = false; selectedWord = null; renderPassage(); renderSidebar(); }
function revealPassage() {
  var p = PASSAGES[currentPassage];
  if (!answers[currentPassage]) answers[currentPassage] = {};
  p.answers.forEach(function(a, i) { answers[currentPassage][i+1] = a; });
  checked[currentPassage] = true;
  renderPassage(); renderSidebar();
}
function selectPassage(idx) { currentPassage = idx; selectedWord = null; renderSidebar(); renderPassage(); }

// ── Tabs ───────────────────────────────────────────────────────────────────
function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
  if (id === 'practice') { renderSidebar(); renderPassage(); }
}

// ── Init ───────────────────────────────────────────────────────────────────
document.getElementById('totalN').textContent = ALL.length;
document.getElementById('totalSets').textContent = CATS.length;
renderSetList();
renderBrowse();

// ── Print ──────────────────────────────────────────────────────────────────
function openPrintModal() {
  document.getElementById('printModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePrintModal(e) {
  if (e && e.target && e.target !== document.getElementById('printModal') && !e.target.classList.contains('oc-btn')) return;
  document.getElementById('printModal').classList.remove('open');
  document.body.style.overflow = '';
}

function executePrint() {
  var mode = document.querySelector('input[name="printMode"]:checked').value;
  var css = '@page{margin:1.4cm 1.8cm}*{margin:0;padding:0;box-sizing:border-box}'
    + 'body{font-family:Outfit,sans-serif;color:#2D3047;font-size:10pt;line-height:1.6}'
    + '.header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2pt solid #E8E5DF;padding-bottom:4pt;margin-bottom:12pt}'
    + 'h1{font-size:17pt;font-weight:900}'
    + '.meta{font-family:"JetBrains Mono",monospace;font-size:7.5pt;color:#7A7D8E}'
    + '.cat-name{font-family:"JetBrains Mono",monospace;font-size:7.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4pt 0;border-bottom:1.5pt solid #E8E5DF;margin:10pt 0 4pt;display:flex;align-items:center;gap:6pt}'
    + '.cat-dot{display:inline-block;width:7pt;height:7pt;border-radius:50%}'
    + 'table{width:100%;border-collapse:collapse;margin-bottom:6pt}'
    + 'td{padding:3pt 5pt;vertical-align:top;border-bottom:0.5pt solid #f5f3ef;font-size:10pt}'
    + 'td.expr{font-weight:800;width:28%}'
    + 'td.def{color:#555;width:38%}'
    + 'td.ex{font-style:italic;color:#888;width:34%}'
    + 'td.reg{font-family:"JetBrains Mono",monospace;font-size:7pt;text-transform:uppercase;width:8%;color:#7A7D8E}'
    + 'td.ws-line{border-bottom:1pt solid #bbb}'
    + '.passage{margin-bottom:18pt;page-break-inside:avoid}'
    + '.p-title{font-size:13pt;font-weight:800;margin-bottom:2pt}'
    + '.p-meta{font-family:"JetBrains Mono",monospace;font-size:7pt;color:#2176FF;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8pt}'
    + '.p-bank{padding:6pt 8pt;border:1pt dashed #ccc;border-radius:6pt;margin-bottom:8pt;font-size:9pt;color:#555}'
    + '.p-bank b{font-weight:700;color:#2D3047}'
    + '.p-text{font-size:10.5pt;line-height:2}'
    + '.p-gap{display:inline-block;min-width:80pt;border-bottom:1.5pt solid #333;text-align:center;margin:0 2pt;padding:0 3pt}'
    + '.p-gap .num{font-family:"JetBrains Mono",monospace;font-size:6.5pt;color:#666;vertical-align:super}'
    + '.p-filled{font-weight:700;color:#0F7D71;border-bottom:none;background:rgba(29,211,176,.15);border-radius:3pt;padding:1pt 4pt}'
    + '.footer{margin-top:12pt;padding-top:6pt;border-top:1pt solid #E8E5DF;font-family:"JetBrains Mono",monospace;font-size:7pt;color:#7A7D8E;text-align:right}';

  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Fixed Expressions</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">'
    + '<style>' + css + '</style></head><body>';

  var today = new Date().toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});

  if (mode === 'current') {
    var list = shownList();
    var isAll = setId === 'all';
    var title = isAll ? 'Fixed Expressions' : CAT_BY_ID[setId].label;
    html += '<div class="header"><h1>' + title + '</h1><span class="meta">' + list.length + (list.length === 1 ? ' expression' : ' expressions') + '</span></div>';
    if (!list.length) {
      html += '<p>Nothing matches the current filters.</p>';
    } else if (isAll) {
      CATS.forEach(function(cat) {
        var items = list.filter(function(e){ return e.catId === cat.id; });
        if (!items.length) return;
        html += '<div class="cat-name"><span class="cat-dot" style="background:' + cat.color + '"></span>' + cat.label + ' (' + items.length + ')</div><table>';
        items.forEach(function(item) {
          html += '<tr><td class="expr">' + item.expr + '</td><td class="reg">' + item.reg + '</td><td class="def">' + item.def + '</td><td class="ex">' + item.ex.replace(/<b>/g,'').replace(/<\/b>/g,'') + '</td></tr>';
        });
        html += '</table>';
      });
    } else {
      html += '<table>';
      list.forEach(function(item) {
        html += '<tr><td class="expr">' + item.expr + '</td><td class="reg">' + item.reg + '</td><td class="def">' + item.def + '</td><td class="ex">' + item.ex.replace(/<b>/g,'').replace(/<\/b>/g,'') + '</td></tr>';
      });
      html += '</table>';
    }
  } else if (mode.startsWith('browse') || mode === 'worksheet') {
    var label = mode === 'browse-full' ? 'Full Reference' : mode === 'browse-compact' ? 'Compact Reference' : 'Worksheet';
    html += '<div class="header"><h1>Fixed Expressions</h1><span class="meta">' + label + ' \u00b7 ' + CATS.reduce(function(n,c){return n+c.items.length;},0) + ' expressions</span></div>';

    CATS.forEach(function(cat) {
      html += '<div class="cat-name"><span class="cat-dot" style="background:' + cat.color + '"></span>' + cat.label + ' (' + cat.items.length + ')</div><table>';
      cat.items.forEach(function(item) {
        if (mode === 'browse-full') {
          html += '<tr><td class="expr">' + item.expr + '</td><td class="reg">' + item.reg + '</td><td class="def">' + item.def + '</td><td class="ex">' + item.ex.replace(/<b>/g,'').replace(/<\/b>/g,'') + '</td></tr>';
        } else if (mode === 'browse-compact') {
          html += '<tr><td class="expr">' + item.expr + '</td><td class="reg">' + item.reg + '</td><td class="def">' + item.def + '</td></tr>';
        } else {
          html += '<tr><td class="expr">' + item.expr + '</td><td class="reg">' + item.reg + '</td><td class="ws-line"></td></tr>';
        }
      });
      html += '</table>';
    });
  } else {
    var withAnswers = mode === 'passages-answers';
    var label = withAnswers ? 'Answer Key' : 'Worksheet';
    html += '<div class="header"><h1>Fixed Expressions - Practice</h1><span class="meta">' + label + ' \u00b7 ' + PASSAGES.length + ' passages</span></div>';

    PASSAGES.forEach(function(p, pi) {
      html += '<div class="passage"><div class="p-title">' + (pi+1) + '. ' + p.title + '</div>';
      html += '<div class="p-meta">' + p.cat + ' \u00b7 ' + p.answers.length + ' gaps</div>';
      if (!withAnswers) {
        html += '<div class="p-bank"><b>Word bank:</b> ' + p.bank.join(' \u00a0\u00b7\u00a0 ') + '</div>';
      }
      var text = p.text;
      for (var g = p.answers.length; g >= 1; g--) {
        if (withAnswers) {
          text = text.replace('{' + g + '}', '<span class="p-filled">' + p.answers[g-1] + '</span>');
        } else {
          text = text.replace('{' + g + '}', '<span class="p-gap"><span class="num">(' + g + ')</span></span>');
        }
      }
      html += '<div class="p-text">' + text + '</div></div>';
    });
  }

  html += '<div class="footer">johnplusenglish.com \u00b7 ' + today + '</div>';
  html += '</body></html>';

  var win = window.open('','_blank');
  win.document.write(html);
  win.document.close();
  win.onload = function(){ win.focus(); win.print(); };
  closePrintModal();
}
</script>

<div class="print-modal-backdrop" id="printModal" onclick="closePrintModal(event)">
  <div class="print-modal" onclick="event.stopPropagation()">
    <h3>Print</h3>
    <p class="print-modal-desc">Choose what to print.</p>
    <div class="print-opts">
      <label class="print-opt">
        <input type="radio" name="printMode" value="current" checked>
        <div class="print-opt-content">
          <div class="print-opt-label">What's on screen</div>
          <div class="print-opt-desc">The set and filters you have showing, with definitions and examples</div>
        </div>
      </label>
      <label class="print-opt">
        <input type="radio" name="printMode" value="browse-full">
        <div class="print-opt-content">
          <div class="print-opt-label">All expressions (full)</div>
          <div class="print-opt-desc">Expression + definition + example, grouped by category</div>
        </div>
      </label>
      <label class="print-opt">
        <input type="radio" name="printMode" value="browse-compact">
        <div class="print-opt-content">
          <div class="print-opt-label">All expressions (compact)</div>
          <div class="print-opt-desc">Expression + definition only, no examples</div>
        </div>
      </label>
      <label class="print-opt">
        <input type="radio" name="printMode" value="worksheet">
        <div class="print-opt-content">
          <div class="print-opt-label">Worksheet</div>
          <div class="print-opt-desc">Expressions with blank lines for students to write definitions</div>
        </div>
      </label>
      <label class="print-opt">
        <input type="radio" name="printMode" value="passages-blank">
        <div class="print-opt-content">
          <div class="print-opt-label">Practice passages (worksheet)</div>
          <div class="print-opt-desc">Passages with gaps + word bank, no answers</div>
        </div>
      </label>
      <label class="print-opt">
        <input type="radio" name="printMode" value="passages-answers">
        <div class="print-opt-content">
          <div class="print-opt-label">Practice passages (with answers)</div>
          <div class="print-opt-desc">Passages with answers filled in</div>
        </div>
      </label>
    </div>
    <div class="print-actions">
      <button class="oc-btn" onclick="closePrintModal()">Cancel</button>
      <button class="oc-btn oc-btn-primary" onclick="executePrint()">Print</button>
    </div>
  </div>
</div>
