name: Validate content

# The same tools/validate-*.mjs checks as the local pre-commit hook, but as a full gate: the hook
# runs only the validator whose family was staged, whereas this runs EVERY validator, so a defect
# is caught regardless of which files a commit touched (and `--no-verify` can't sneak one past).
# validate-common.mjs (no args) scans all *-content.html for the dash rule.
#
# This workflow is also called by deploy.yml (workflow_call) so the production deploy is gated on
# exactly these checks — one definition, used by both PR feedback and the deploy gate.

on:
  pull_request:
    paths:
      - '**/*-content.html'
      - 'tools/**'
      - '.github/workflows/*.yml'
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run all content validators
        run: |
          fail=0
          for v in tools/validate-*.mjs; do
            echo "::group::$v"
            node "$v" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" = "1" ]; then
            echo "::error::One or more content validators reported errors"
            exit 1
          fi
          echo "All content validators passed."
