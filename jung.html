  :root{
    --paper:#fbfaf6;
    --paper-alt:#f2efe4;
    --card:#ffffff;
    --ink:#141414;
    --ink-soft:#4a4a46;
    --ink-faint:#7a7a76;
    --accent:#1f4fd8;
    --accent-deep:#15379e;
    --gold:#a9781f;
    --display:'Bricolage Grotesque', sans-serif;
    --sans:'Outfit', sans-serif;
    --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  em{font-style:normal;color:var(--accent);}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}

  #progress{position:fixed;top:0;left:0;height:2px;width:0%;background:var(--accent);z-index:200;}

  /* NAV */
  header{
    position:sticky;top:0;z-index:100;
    background:rgba(251,250,246,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--paper-alt);
    border-bottom:1px solid #e3e0d4;
  }
  nav.wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px;flex-wrap:wrap;}
  .nav-left{display:flex;align-items:center;gap:18px;}
  .brand{font-family:var(--display);font-weight:600;font-size:1.3rem;color:var(--ink);}

  .switcher{display:flex;gap:2px;background:var(--paper-alt);border-radius:999px;padding:3px;flex-wrap:wrap;}
  .switch-btn{
    font-family:var(--sans);font-weight:500;font-size:.76rem;white-space:nowrap;
    padding:6px 11px;border-radius:999px;border:none;background:none;color:var(--ink-soft);cursor:pointer;
    transition:background .15s, color .15s;
  }
  .switch-btn:hover{color:var(--ink);}
  .switch-btn.active{background:var(--accent);color:#fff;font-weight:600;}

  .navlinks{display:flex;gap:2px;align-items:center;}
  .navlinks a{
    font-size:.82rem;font-weight:500;letter-spacing:.02em;
    color:var(--ink-soft);
    padding:8px 16px;border-radius:6px;
    border-bottom:2px solid transparent;
    transition:.15s;
  }
  .navlinks a:hover{color:var(--accent);}
  .navlinks a.active{color:var(--accent);border-bottom-color:var(--accent);}
  .navtoggle{display:none;background:none;border:none;color:var(--ink);font-size:1.5rem;cursor:pointer;}

  @media(max-width:800px){
    .navlinks{
      position:fixed;top:68px;left:0;right:0;
      flex-direction:column;align-items:stretch;
      background:var(--paper);
      border-bottom:1px solid #e3e0d4;
      padding:8px;gap:0;
      transform:translateY(-130%);
      transition:transform .2s ease;
    }
    .navlinks.open{transform:translateY(0);}
    .navlinks a{padding:14px 12px;border-bottom:1px solid #e3e0d4;border-radius:0;}
    .navtoggle{display:block;}
  }

  /* HERO */
  .hero{padding:90px 0 60px;text-align:center;}
  .kicker{
    display:inline-block;
    font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold);font-weight:600;
    margin-bottom:20px;
  }
  .hero h1{
    font-family:var(--display);font-weight:700;
    font-size:clamp(2.4rem,6vw,4.2rem);
    line-height:1.06;color:var(--ink);text-wrap:balance;
  }
  .hero p.lede{
    max-width:600px;margin:24px auto 0;
    font-size:1.12rem;color:var(--ink-soft);font-weight:300;
  }
  .hero .ctas{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap;}
  .btn{
    font-family:var(--sans);font-weight:500;font-size:.9rem;
    padding:12px 24px;border-radius:8px;cursor:pointer;
    border:1px solid var(--ink);transition:.15s;
  }
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary:hover{background:var(--accent-deep);border-color:var(--accent-deep);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:#e3e0d4;}
  .btn-ghost:hover{border-color:var(--ink);}

  .cold-open{
    max-width:700px;margin:56px auto 0;
    background:var(--card);
    border:1px solid #e3e0d4;
    border-left:3px solid var(--accent);
    border-radius:6px;
    padding:32px 34px;
    text-align:left;
  }
  .cold-open .tag{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;}
  .cold-open p{font-family:var(--display);font-weight:400;font-size:1.16rem;line-height:1.5;color:var(--ink);margin-top:14px;}
  .cold-open p+p{margin-top:12px;}
  .cold-open .sign{margin-top:16px;font-family:var(--sans);font-size:.8rem;color:var(--ink-faint);}

  /* SECTION generic */
  section{padding:88px 0;}
  section:nth-of-type(even){background:var(--paper-alt);}
  .sec-head{max-width:660px;margin-bottom:50px;}
  .sec-head .kicker{margin-bottom:14px;}
  .sec-head h2{
    font-family:var(--display);font-weight:700;
    font-size:clamp(1.8rem,3.6vw,2.6rem);
    color:var(--ink);line-height:1.15;text-wrap:balance;
  }
  .sec-head p{margin-top:14px;color:var(--ink-soft);font-size:1.02rem;max-width:60ch;}

  /* TIMELINE */
  .tl{position:relative;padding-left:32px;}
  .tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#e3e0d4;}
  .tl-era{font-family:var(--sans);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:40px 0 12px;}
  .tl-era:first-child{margin-top:0;}
  .tl-item{position:relative;padding:0 0 24px 24px;cursor:pointer;}
  .tl-item::before{content:"";position:absolute;left:-32px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:2px solid var(--accent);transition:.15s;}
  section:nth-of-type(even) .tl-item::before{background:var(--paper-alt);}
  .tl-item:hover::before, .tl-item.open::before{background:var(--accent);}
  .tl-item .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .tl-year{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--accent);min-width:64px;font-variant-numeric:tabular-nums;}
  .tl-title{font-weight:600;font-size:1rem;color:var(--ink);}
  .tl-one{color:var(--ink-soft);font-size:.9rem;margin-top:4px;}
  .tl-more{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:.92rem;color:var(--ink-soft);}
  .tl-item.open .tl-more{max-height:280px;margin-top:10px;}
  .tl-more-inner{border-left:2px solid #e3e0d4;padding:2px 0 2px 14px;}
  .tl-hint{font-size:.7rem;color:var(--ink-faint);margin-top:3px;}

  /* LECTURES */
  .lec-list{display:flex;flex-direction:column;gap:10px;}
  .lec{background:var(--card);border:1px solid #e3e0d4;border-radius:8px;overflow:hidden;}
  .lec.open{border-color:var(--accent);}
  .lec-head{display:flex;align-items:center;gap:18px;padding:20px 24px;cursor:pointer;background:none;border:none;width:100%;text-align:left;color:inherit;font-family:inherit;}
  .lec-num{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--accent);width:38px;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .lec-head-text{flex:1;min-width:0;}
  .lec-head-text .lec-title{font-weight:600;font-size:1.08rem;color:var(--ink);}
  .lec-head-text .lec-sub{font-size:.84rem;color:var(--ink-faint);margin-top:2px;}
  .lec-meta{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);white-space:nowrap;flex-shrink:0;border:1px solid #e3e0d4;padding:4px 10px;border-radius:999px;}
  .lec-chevron{width:18px;height:18px;flex-shrink:0;color:var(--ink-faint);transition:transform .2s;}
  .lec.open .lec-chevron{transform:rotate(180deg);color:var(--accent);}
  .lec-body{max-height:0;overflow:hidden;transition:max-height .35s ease;}
  .lec.open .lec-body{max-height:2600px;}
  .lec-body-inner{padding:0 24px 28px 82px;border-top:1px solid #e3e0d4;padding-top:20px;}
  .lec-body-inner p{margin-bottom:14px;color:var(--ink-soft);font-size:1rem;}
  .lec-body-inner p:last-child{margin-bottom:0;}
  .lec-quote{font-family:var(--display);font-weight:400;font-size:1.16rem;color:var(--ink);border-left:2px solid var(--gold);padding:4px 0 4px 16px;margin:0 0 18px;}
  @media(max-width:640px){
    .lec-body-inner{padding-left:24px;}
    .lec-head{padding:16px;gap:12px;}
    .lec-meta{display:none;}
  }

  /* LEGACY */
  .legacy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;}
  .card{background:var(--card);border:1px solid #e3e0d4;border-top:3px solid var(--accent);border-radius:6px;padding:24px;}
  .card h3{font-family:var(--display);font-weight:600;font-size:1.16rem;margin-bottom:8px;color:var(--ink);}
  .card p{font-size:.92rem;color:var(--ink-soft);}

  .verdict{margin-top:50px;background:var(--card);border:1px solid #e3e0d4;border-radius:8px;padding:34px;}
  .verdict h3{font-family:var(--display);font-weight:600;font-size:1.36rem;color:var(--ink);margin-bottom:12px;}
  .verdict p{color:var(--ink-soft);margin-bottom:12px;}
  .verdict p:last-child{margin-bottom:0;}

  footer{border-top:1px solid #e3e0d4;padding:44px 0 60px;text-align:center;color:var(--ink-faint);font-size:.84rem;}
  footer .brand{justify-content:center;margin-bottom:12px;color:var(--ink-soft);font-size:1.1rem;}
  footer .fine{max-width:540px;margin:12px auto 0;line-height:1.6;}

  ::selection{background:var(--accent);color:#fff;}
</style>
</head>

  hero: {
    kicker: "A life in eight lectures",
    titleHTML: "The Man Who Insisted<br>You Already <em>Know Yourself</em>",
    lede: "Carl Rogers spent fifty years arguing that the person in the room already has what they need, and the therapist's job is mostly to get out of the way. It sounds soft. It was one of the most disruptive ideas in the history of psychotherapy."
  },
  coldOpen: {
    tag: "Cold open",
    paras: [
      "Picture Wisconsin, 1957. The most quietly influential man in American psychotherapy walks onto a locked ward at Mendota State Hospital to test his own theory on patients diagnosed with chronic schizophrenia, people the rest of the profession had largely given up on.",
      "His entire career had been built on one radical-sounding claim: that empathy, honesty and unconditional acceptance from a therapist were not just nice to have, they were the active ingredient. Diagnosis, advice, interpretation, all the tools psychiatry was proud of, were, in his account, mostly getting in the way.",
      "The Wisconsin project did not go the way his last twenty years of success suggested it would. Which is exactly why it belongs at the centre of this story, not the edges."
    ],
    sign: "On tone: think fewer footnotes, more fireside. The facts are real, the framing is ours."
  },
  timelineSec: {
    kicker: "1902 &#8211; 1987",
    titleHTML: "A life, <em>heard out in full</em>",
    lede: "Rogers thought the most healing thing one person could do for another was listen without an agenda. His own life reads a little like a demonstration: farmer's son, seminarian, psychologist, peace broker. Click any point for the longer story."
  },
  lecturesSec: {
    kicker: "The lecture series",
    titleHTML: "Eight lectures on <em>the quiet radical</em>",
    lede: "Same order he more or less lived it: the farm, the seminary he walked out on, the small-city clinic, the theory, the study that complicated it, the institute he built to escape universities entirely, and the peace work nobody expected from a therapist."
  },
  legacySec: {
    kicker: "After 1987",
    titleHTML: "Why you already know <em>more Rogers than you think</em>",
    lede: "He never had Freud's fame or Jung's mystique. He had something that aged better: a handful of ideas about listening that turned out to be testable, and mostly held up."
  },
  legacyCards: [
    {title:"Active listening", body:"“What I hear you saying is...” started life as a clinical technique for reflecting a client's feelings back to them. It is now standard vocabulary in HR training, mediation, parenting books, and roughly every workplace conflict-resolution seminar ever run."},
    {title:"Motivational interviewing", body:"William Miller and Stephen Rollnick built one of the most widely used counselling methods in addiction treatment directly on Rogers's core conditions: empathy over confrontation, the client's own reasons for change over the counsellor's."},
    {title:"Student-centred learning", body:"<em>Freedom to Learn</em> (1969) argued classrooms should work the way therapy did, less telling, more facilitating. It fed directly into decades of progressive education reform, for better and for worse, depending who you ask."},
    {title:"The common factors finding", body:"Decades of psychotherapy outcome research later converged on an uncomfortable finding for a field built on competing techniques: the quality of the therapeutic relationship predicts outcomes about as well as which school of therapy you use. Rogers said this in 1957, from clinical intuition, with no meta-analysis to back him up."},
    {title:"Encounter groups", body:"The basic encounter group, T-groups, and the wider human potential movement of the 1960s and 70s trace straight back to Rogers's belief that groups, not just individual sessions, could be run on the same principles. Esalen owes him a debt it rarely credits."},
    {title:"The unresolved question", body:"The 1957&#8211;63 Wisconsin project, his one serious attempt to apply the method to chronic schizophrenia, produced far weaker results than his usual outpatient work and strained relationships with colleagues badly. Whether that was a limit of the theory or a limit of that particular hospital ward is still argued. See Lecture Six."}
  ],
  verdict: {
    title: "So was he naive, or was he just early?",
    paras: [
      "Critics, then and now, have accused Rogers of a kind of clinical optimism that only makes sense if you assume most people are one good listener away from being fine, an assumption that looks shakier the sicker the patient gets. The Wisconsin project is Exhibit A for that critique, and it is a fair one.",
      "But the later “common factors” research in psychotherapy outcome studies has been unusually kind to him: across wildly different schools of therapy, the strength of the relationship between therapist and client keeps turning out to be one of the best predictors of whether treatment actually works, which is more or less the claim Rogers was making in 1957 with nothing but casework and nerve. He died on the 4th of February 1987 in La Jolla, California, days after a Nobel Peace Prize nomination arrived for three decades of taking that same idea, that being properly heard changes people, into rooms full of Protestants and Catholics, Black and white South Africans, Americans and Soviets, and asking whether it scaled."
    ]
  },
  footer: {
    tagline: "The life, teachings and legacy of Carl Ransom Rogers (1902&#8211;1987).",
    fine: "Built as a study reference. Dates and events are drawn from standard biographical sources, principally Rogers's own <em>On Becoming a Person</em> and Howard Kirschenbaum's biography; the Wisconsin schizophrenia project in Lecture Six is presented with its mixed results intact rather than folded into the wider success story."
  },

  timeline: [
    {era:"Formation", year:"1902", title:"Born in Oak Park, Illinois", one:"January 8th, the fourth of six children in a strict, work-focused Congregationalist household.", more:"Rogers later described his childhood home as marked by close family ties and a rigid, unspoken assumption that other people's behaviour, drinking, cardplaying, dancing, was not to be trusted. He said the family motto might as well have been 'you don't yield to those impulses'."},
    {era:"Formation", year:"1914", title:"Family moves to a farm near Glen Ellyn", one:"His parents relocate the family partly to keep the teenage children away from town.", more:"Rogers, unexpectedly, took to it: he read serious texts on scientific agriculture, ran his own controlled experiments on animal feed and crop yields, and later said the experience taught him how to think like a scientist years before he studied psychology."},
    {era:"Formation", year:"1919", title:"Enrols at the University of Wisconsin-Madison", one:"Declares agriculture as his major, following the family script.", more:"Wisconsin was also his parents' alma mater and a stronghold of the same religious conservatism he'd grown up in. Rogers joined the same Christian student groups his parents approved of, at least at first."},
    {era:"Turning point", year:"1922", title:"Six-month trip to China", one:"Selected as one of ten American students for a World Student Christian Federation conference in Peking.", more:"Meeting Christians with radically more liberal theological views than his parents', on a boat and in China for months with limited contact home, Rogers later called it the experience that first let him think for himself religiously. He kept a diary of his changing views; when his parents eventually read it, the resulting conflict was serious enough that Rogers described it as a genuine break."},
    {era:"Turning point", year:"1924", title:"Graduates Wisconsin, marries Helen Elliott, enrols at Union Theological Seminary", one:"Switches from agriculture to history as an undergraduate, then heads to a liberal New York seminary to train for the ministry.", more:"Helen Elliott was a childhood friend from Oak Park; the marriage lasted until her death in 1979. Union was chosen deliberately because it was theologically liberal, about as far from his parents' fundamentalism as a seminary could be."},
    {era:"Turning point", year:"1926", title:"Crosses the street to Columbia University Teachers College", one:"Enrols in psychology and education without formally leaving Union.", more:"The decisive moment was a student-run, faculty-free seminar at Union called 'Why am I entering the ministry?', which let Rogers and several classmates think out loud about doctrinal doubts they weren't supposed to admit to. A number of that seminar's students, Rogers included, left for psychology instead."},
    {era:"Rochester", year:"1928", title:"Joins the Rochester Society for the Prevention of Cruelty to Children", one:"Full-time work with delinquent and abused children, largely outside academic psychology's reach.", more:"Rochester gave Rogers twelve years of unglamorous, high-volume clinical work: hundreds of children, minimal supervision from any single theoretical school, and the freedom to notice what actually seemed to help without having to defend it to a psychoanalytic faculty."},
    {era:"Rochester", year:"1931", title:"PhD, Columbia University", one:"Clinical psychology, with a dissertation on measuring personality adjustment in children.", more:"The degree formalised training he'd mostly built through Rochester casework rather than the reverse."},
    {era:"Rochester", year:"1936", title:"Otto Rank gives a three-day seminar in Rochester", one:"A pivotal, short encounter with the psychoanalytic dissident who thought the relationship itself, not technique, did the healing.", more:"Rank had broken with Freud partly over exactly this idea. Rogers later credited those three days with crystallising something he'd been circling for years: that the relationship, not the diagnosis, was the active ingredient."},
    {era:"Rochester", year:"1939", title:"Publishes The Clinical Treatment of the Problem Child", one:"His first book, drawn directly from the Rochester casework.", more:"It won him a professorship offer, unusual for someone without a conventional academic track record, on the strength of practical results rather than theoretical pedigree."},
    {era:"Non-directive", year:"1940", title:"Professor at Ohio State University", one:"His first full academic post, arriving with more clinical hours than most of his new colleagues had accumulated in a career.", more:"It was at Ohio State that Rogers first put his approach into words for other clinicians, not just demonstrated it in casework."},
    {era:"Non-directive", year:"1942", title:"Publishes Counseling and Psychotherapy", one:"Introduces 'non-directive counseling' and, for the first time in the field, publishes verbatim transcripts of real therapy sessions.", more:"Recording and transcribing actual sessions for training and research was close to unheard of; therapy had mostly been described secondhand, through the therapist's own notes. Rogers made the method itself inspectable, which is part of why it could be tested later."},
    {era:"Chicago", year:"1945", title:"Moves to the University of Chicago", one:"Founds and directs the university counseling center.", more:"Chicago gave Rogers a research-friendly base and graduate students to help systematically study outcomes, something the still-young field of psychotherapy had barely attempted."},
    {era:"Chicago", year:"1951", title:"Publishes Client-Centered Therapy", one:"Replaces 'patient' with 'client', a small word change carrying a large theoretical claim.", more:"The word swap rejected the medical model's built-in hierarchy: a patient is diagnosed and treated, a client retains authority over their own process. Not everyone in psychiatry appreciated the implication."},
    {era:"Chicago", year:"1957", title:"Publishes the 'necessary and sufficient conditions' paper", one:"States the core theory in its tightest form: congruence, unconditional positive regard, and empathic understanding.", more:"It is arguably the single most cited and most tested claim in the history of psychotherapy research, precisely because Rogers stated it in terms specific enough to be falsifiable, unusual for the field at the time."},
    {era:"Chicago", year:"1957", title:"Public dialogue with B.F. Skinner", one:"The behaviorist and the humanist debate free will, determinism, and what actually changes people.", more:"Skinner argued behaviour was shaped by reinforcement, full stop; Rogers argued the human capacity for self-directed growth was real and had to be the starting point of any workable psychology. Neither man won, but the debate helped define the two poles of mid-century American psychology."},
    {era:"Wisconsin", year:"1957", title:"Moves to the University of Wisconsin", one:"Takes on his most ambitious, and in the end most difficult, research project.", more:"After two decades of strong outpatient results, Rogers wanted to test client-centered therapy against its hardest possible case: hospitalized, chronic schizophrenia."},
    {era:"Wisconsin", year:"1963", title:"The Wisconsin schizophrenia project concludes", one:"Results are far weaker than his outpatient track record, and colleague relationships sour badly.", more:"The project became one of the most fought-over studies in his career: some read it as showing the limits of client-centered therapy with severe pathology, others argued the hospital environment and staff resistance undermined the method before it had a fair test. Rogers left Wisconsin, and university psychology departments altogether, not long after."},
    {era:"La Jolla", year:"1961", title:"Publishes On Becoming a Person", one:"A collection of essays that becomes an unlikely bestseller well outside academic psychology.", more:"It's the book most non-specialists who've heard of Rogers have actually read, and it did more than any journal article to make 'unconditional positive regard' part of everyday vocabulary."},
    {era:"La Jolla", year:"1964", title:"Leaves the university system for the Western Behavioral Sciences Institute", one:"Trades tenure and a department for an independent research institute in La Jolla, California.", more:"The move was itself an expression of his theory: Rogers had spent two decades arguing institutions should trust people to direct their own growth, and academic bureaucracy kept getting in the way of practicing what he preached."},
    {era:"La Jolla", year:"1968", title:"Co-founds the Center for Studies of the Person", one:"A self-governing, non-hierarchical research community, a structural experiment as much as an institution.", more:"No president, no fixed departments, members set their own agendas. It was Rogers's attempt to build an organisation that actually matched his theory of human motivation, rather than merely housing people who studied it."},
    {era:"La Jolla", year:"1969", title:"Publishes Freedom to Learn", one:"Applies client-centered principles to classrooms, arguing students learn best when trusted with real responsibility.", more:"It became a foundational text for the student-centered and open-classroom education movements of the 1970s, and a recurring target for critics who blamed it, fairly or not, for a decline in academic rigor."},
    {era:"La Jolla", year:"1970s", title:"Encounter groups and the human potential movement", one:"Person-centered group work spreads through Esalen and the wider growth-movement scene of the era.", more:"Rogers ran and studied 'basic encounter groups' extensively during this period, arguing the same core conditions that worked one-on-one could work in a room of strangers. The results fed directly into decades of corporate team-building and group-therapy practice most participants never trace back to him."},
    {era:"Peace work", year:"1985", title:"The Rust Workshop, Austria", one:"A large, invitation-only person-centered workshop convened amid Cold War tension.", more:"Rogers, in his eighties, was applying the same principles from Rochester casework decades earlier to Cold War diplomacy: that people from opposing camps could actually hear each other if the room was structured right."},
    {era:"Peace work", year:"1986", title:"Leads workshops in the Soviet Union", one:"Travels to Moscow and Tbilisi during early glasnost to run large-group person-centered sessions.", more:"It was among the first Western-led psychological work of its kind permitted inside the USSR in decades, and Rogers, by his own account, found the audiences hungry for exactly the kind of open, non-directive conversation his entire career had been built on."},
    {era:"Peace work", year:"1987", title:"Dies in La Jolla, California", one:"February 4th, days after a fall and hip surgery, aged 85.", more:"A Nobel Peace Prize nomination for his conflict-resolution workshops in Northern Ireland, South Africa, Central America and the Soviet Union had been submitted that same year. He did not live to see the announcement."}
  ],

  lectures: [
    {
      title:"The Preacher's Son Who Nearly Became a Farmer", sub:"Oak Park to Wisconsin, 1902–1924", meta:"Origins",
      quote:"The facts are always friendly.",
      paras:[
        "Start with the household, because Rogers himself always did. Born in Oak Park, Illinois in 1902, the fourth of six children, he grew up in a strict Congregationalist family that prized hard work, close family bonds, and deep suspicion of the world outside the front door. Drinking, dancing, cardplaying, movies, all of it was treated less as sin than as simply beneath the family's standards.",
        "When Carl was twelve, his parents moved the family to a farm outside Glen Ellyn, partly, by his own later account, to keep the teenage children away from town. It should have been a step backward for a bright, bookish kid. Instead Rogers threw himself into scientific agriculture, reading serious texts on animal husbandry and running his own controlled feeding experiments on livestock. He later said this, not any psychology course, was where he actually learned the discipline of testing an idea against evidence rather than assuming he already knew the answer.",
        "He arrived at the University of Wisconsin-Madison in 1919, his parents' own alma mater, declaring agriculture as his major and joining the same conservative Christian student organisations they approved of. On paper, the plan was working exactly as designed: farm boy becomes agricultural scientist, stays inside the family's moral and religious world. Off paper, a switch to history, then a slow drift toward the ministry, was already underway, and it was about to accelerate somewhere his parents genuinely had not planned for: a boat to China."
      ]
    },
    {
      title:"The Seminar That Changed His Mind", sub:"China, Union Seminary, and the crossing to Columbia, 1922–1928", meta:"Turning point",
      quote:"What is most personal is most universal.",
      paras:[
        "In 1922, Rogers was one of ten American students chosen to attend a World Student Christian Federation conference in Peking, a six-month round trip by ship and rail that put him, for the first time, in sustained contact with Christians who held views his fundamentalist parents would have found close to heretical.",
        "He kept a diary through the trip, tracking his own shifting views on doctrine with the same careful, evidence-first habit he'd developed watching livestock feed trials back on the farm. When he returned home and his parents eventually read it, the resulting confrontation was serious enough that Rogers later described it as the point he stopped outsourcing his beliefs to them.",
        "He enrolled at Union Theological Seminary in New York in 1924, deliberately choosing one of the most theologically liberal seminaries in the country, about as far from Oak Park as an American seminary could get. The decisive moment there wasn't a lecture. It was an informal, student-organised, faculty-free discussion group called 'Why am I entering the ministry?', where Rogers and a handful of classmates admitted, mostly to each other, doubts they weren't supposed to voice out loud in a seminary building.",
        "That kind of talking, unstructured, unsupervised, oddly more honest for the lack of an authority figure in the room, is arguably the first working prototype of everything Rogers built his career on. Several students from that seminar left the ministry track for psychology. Rogers crossed the street to Columbia University Teachers College without bothering to formally withdraw from Union first."
      ]
    },
    {
      title:"Rochester and the Ghost of Otto Rank", sub:"Twelve years of casework nobody in academic psychology was watching, 1928–1940", meta:"Method",
      quote:"The curious paradox is that when I accept myself just as I am, then I can change.",
      paras:[
        "Rochester, New York, was not where careers in psychology were supposed to be made in the late 1920s. Rogers spent twelve years there anyway, working full-time for the Society for the Prevention of Cruelty to Children, treating hundreds of delinquent and abused children with almost no oversight from any single dominant theoretical school.",
        "That isolation turned out to be the making of him. Freudian psychoanalysis, the field's reigning orthodoxy, was mostly a New York and Vienna phenomenon; Rochester's caseload didn't leave much room for fifty-minute analytic hours with children who needed practical help now. Rogers built his own working method out of what actually seemed to help, largely by trial and error, and largely without anyone senior enough to tell him he was doing it wrong.",
        "The single most important three days of this period arrived in 1936, when Otto Rank, once one of Freud's closest colleagues before a bitter break, gave a seminar in Rochester. Rank's own heresy was structural: he argued the relationship between therapist and client, the immediate, present-tense encounter itself, mattered more than technique or historical interpretation of childhood trauma.",
        "Rogers had been circling something like this idea for years without quite naming it. Rank's seminar gave him the vocabulary. By 1939, when Rogers published his first book, The Clinical Treatment of the Problem Child, drawn straight from the Rochester casework, the outline of everything that followed, relationship over diagnosis, present over past, the client's own resources over the therapist's expertise, was already visible, years before he had an academic platform to argue for any of it."
      ]
    },
    {
      title:"Non-Directive", sub:"Ohio State and the recordings nobody else was making, 1940–1944", meta:"Method goes public",
      quote:"It is the client who knows what hurts, what directions to go, what problems are crucial, what experiences have been deeply buried.",
      paras:[
        "Ohio State University hired Rogers as a professor in 1940, an unusual move given he arrived with a stack of real clinical hours most of his new academic colleagues couldn't match, but comparatively little of the conventional research pedigree the job would normally require.",
        "It was at Ohio State that Rogers first had to explain his method to people who hadn't watched him work it in a room, which forced him to actually name it. Counseling and Psychotherapy, published in 1942, coined the term non-directive counseling: the therapist does not interpret, diagnose, advise, or steer the conversation toward a predetermined insight. The client leads. The therapist's job is to reflect back what's being felt, accurately and without judgment, and largely get out of the way.",
        "The book's genuinely radical move, more than the theory, was methodological: Rogers published verbatim transcripts of actual therapy sessions, recorded and typed up in full. Almost nobody had done this. Therapy up to that point had mostly been described secondhand, through the therapist's own retrospective case notes, which meant the field had no real way to check a clinician's account of a session against what had actually been said in the room.",
        "Making the raw material inspectable was, whether Rogers fully intended it or not, a bet that his method could survive scrutiny that most therapeutic schools of the era never invited. It was a bet that mostly paid off, and it is the reason Rogers, alone among the major mid-century therapy pioneers, ended up with a body of work that later researchers could actually go back and test."
      ]
    },
    {
      title:"Chicago and the Core Conditions", sub:"Client-Centered Therapy to the 1957 paper, 1945–1957", meta:"Theory",
      quote:"The good life is a process, not a state of being. It is a direction, not a destination.",
      paras:[
        "The University of Chicago gave Rogers what Rochester and Ohio State never fully had: a counseling center of his own to direct, graduate students to train, and a research infrastructure serious enough to systematically study whether his method actually worked, rather than simply asserting that it did.",
        "In 1951 he published Client-Centered Therapy, and made one word choice that carried an entire argument: patient became client. A patient is diagnosed and treated by an expert; a client retains authority over their own process and simply engages help. Psychiatry, built on the medical model's built-in hierarchy, did not universally love the implication.",
        "The theory reached its tightest, most citable form in a 1957 paper with a deliberately unglamorous title: 'The Necessary and Sufficient Conditions of Therapeutic Personality Change'. Rogers argued exactly three things had to be true for therapeutic change to happen: the therapist had to be congruent, genuinely themselves rather than performing a professional role; the therapist had to offer unconditional positive regard, accepting the client without judgment regardless of what they revealed; and the therapist had to offer accurate empathic understanding, and the client had to actually perceive all of this. Take any one away, Rogers claimed, and the theory predicted therapy would not work, regardless of technique.",
        "That precision is the whole point. Rogers had turned a humane-sounding but vague idea, being kind and understanding helps people, into something specific enough to fail a test. Decades of psychotherapy outcome research have since tried to fail it. It has mostly held up, which is a genuinely unusual outcome for a mid-century psychological theory built on casework and clinical intuition rather than laboratory data.",
        "The same year, Rogers debated B.F. Skinner in public for the first of several times, the humanist against the behaviorist, self-directed growth against reinforcement schedules, free will against determinism dressed up in a lab coat. Neither man converted the other. The exchange did more than almost anything else to fix the two poles American psychology would argue between for the rest of the century."
      ]
    },
    {
      title:"Wisconsin and the Patients Who Complicated the Theory", sub:"The schizophrenia project, 1957–1963", meta:"The hard case",
      quote:"The individual has within him or herself vast resources for self-understanding and for altering his self-concept, basic attitudes, and self-directed behavior.",
      paras:[
        "By 1957, client-centered therapy had a well-established track record, mostly with articulate, motivated, outpatient college students and adults, exactly the population most likely to make any talk therapy look good. Rogers moved to the University of Wisconsin that year determined to test the theory against a genuinely hard case: chronic, hospitalized schizophrenia at Mendota State Hospital.",
        "It was, by any measure, a serious scientific undertaking: a controlled study, systematic outcome measures, a team of researchers tracking hospitalized patients against a matched control group over several years. It was also a direct test of Rogers's central hypothesis in the environment least designed to support it, a locked institutional ward, chronically understaffed, with patients whose contact with reality was often genuinely impaired.",
        "The results were nothing like his outpatient work. Some patients showed real improvement. Many did not, and the difference between client-centered therapy's usual outcomes and its Wisconsin outcomes was large enough that it became one of the most argued-over studies of Rogers's career. Relationships with hospital staff and even some of his own research colleagues, notably a sharp and lasting disagreement with psychiatrist Otto Will, deteriorated over the course of the project.",
        "The honest reading cuts both ways. Critics took Wisconsin as evidence that client-centered therapy's success elsewhere depended on picking easy patients, that unconditional positive regard has real limits once someone's contact with reality is compromised. Rogers and his defenders argued the hospital environment itself, hostile, hierarchical, chronically resource-starved, undermined the conditions the theory required before the therapy ever had a fair test. Both explanations are plausible. Neither fully explains away the other, which is precisely why this project belongs at the center of the story rather than a footnote to the Chicago years' success.",
        "Wisconsin was also, not incidentally, the beginning of the end of Rogers's relationship with conventional university psychology departments. Within a few years he had left academia altogether, for good."
      ]
    },
    {
      title:"La Jolla and the Institute Built to Escape Universities", sub:"Western Behavioral Sciences Institute to encounter groups, 1964–1970s", meta:"Independence",
      quote:"How can I provide a relationship which this person may use for his own personal growth?",
      paras:[
        "In 1964 Rogers did something almost no senior academic psychologist of his stature did: he walked away from the university system entirely, tenure and all, to join the Western Behavioral Sciences Institute in La Jolla, California, an independent research organisation with no department, no fixed curriculum, and no dean to answer to.",
        "Four years later he co-founded the Center for Studies of the Person, structured deliberately without a president, without fixed departments, and without much of a formal hierarchy at all. Members set their own research agendas. It was less an institution than an attempt to build an organisation that actually matched Rogers's own theory of human motivation, trust people with real autonomy and they will generally use it well, rather than simply housing people who studied that theory in the abstract.",
        "The same period produced On Becoming a Person, a 1961 essay collection that became, almost by accident, a genuine bestseller well outside academic psychology, and Freedom to Learn in 1969, which applied the client-centered argument directly to classrooms: students, like clients, learn best when trusted with real responsibility for their own education rather than managed through it.",
        "Rogers also began running and systematically studying what he called basic encounter groups, arguing the same three core conditions that worked between one therapist and one client could work in a room of strangers. The idea fed directly into the human potential movement gathering force at nearby Esalen Institute through the 1960s and 70s, and from there into a genre of corporate team-building retreat and group-therapy practice whose participants, decades later, mostly have no idea any of it traces back to a Presbyterian farm boy from Illinois."
      ]
    },
    {
      title:"The Peace Workshops", sub:"Northern Ireland to the Soviet Union, 1980–1987", meta:"Late life",
      quote:"When I look at the world I am pessimistic, but when I look at people I am optimistic.",
      paras:[
        "In the last decade of his life, well into his seventies and eighties, Rogers took the same three conditions, congruence, unconditional positive regard, empathic understanding, that he'd spent thirty years applying to individual clients and small groups, and pointed them at some of the twentieth century's harder problems: sectarian Northern Ireland, apartheid-era South Africa, Central American conflict zones, and, in 1985 and 1986, the Cold War itself.",
        "The Rust Workshop, held in Austria in 1985, brought together participants from both sides of the Iron Curtain for an extended, invitation-only, unstructured large-group encounter, built on the wager that the same listening that helped a client in a Chicago counseling room might help diplomats, activists and ordinary citizens actually hear each other across a genuinely dangerous divide.",
        "In 1986, in his mid-eighties, Rogers travelled to Moscow and Tbilisi to lead large-group person-centered sessions during the earliest stirrings of glasnost, among the first Western-led psychological work of its kind permitted inside the Soviet Union in decades. He reported, characteristically, that Soviet audiences were hungry for exactly the open, non-directive kind of conversation the state had spent decades making impossible.",
        "A Nobel Peace Prize nomination, recognising three decades of this conflict-resolution work, was submitted in early 1987. Rogers died on the 4th of February that year in La Jolla, days after a fall and hip surgery, before the prize was decided. He did not need the committee to tell him whether the idea worked. He had spent his whole career testing it, one room at a time, right up to the end."
      ]
    }
  ]
},

    {title:"Everyday vocabulary", body:"“Ego,” “denial,” “repression,” “Freudian slip,” “unconscious.” Ordinary English is loaded with Freud's specific technical vocabulary, most of it now used by people who have never read a word he wrote."},
    {title:"The father everyone argued with", body:"Adler broke away over inferiority and power. Jung broke away over sexuality and the sacred. Rogers and Maslow built humanistic psychology largely as a rejection of Freud's pessimism about human nature. Nearly every major school of twentieth-century psychology exists partly in reaction to him."},
    {title:"Talk therapy itself", body:"Whatever you think of psychoanalytic theory, the basic format, regular, private, extended conversation as treatment, traces to Freud and Josef Breuer's “talking cure.” Cognitive behavioral therapy runs on entirely different theory and still inherited the format."},
    {title:"The scientific verdict", body:"Mainstream clinical psychology has largely moved on from psychoanalytic theory: small, unrepresentative case studies, claims that resist disproof, and, in several of his most famous cases, real questions about how faithfully he reported what patients actually said."},
    {title:"The cocaine chapter", body:"Before the couch, Freud spent several years enthusiastically promoting cocaine as a wonder drug, including to a friend whose addiction he made worse. It rarely makes the highlight reel, and it should."},
    {title:"The unresolved question", body:"How much of the case-history “evidence” underpinning psychoanalysis was accurately recorded versus reshaped to fit the theory is still argued over by historians with access to the partially restricted Freud Archives. See Lecture Three."}
  ],
  verdict: {
    title: "So was he a scientist, or a novelist with a medical degree?",
    paras: [
      "Neither label quite survives contact with the record. As clinical science, most of his specific claims have not held up: small samples, unfalsifiable mechanisms, and, in several of his most cited cases, a documented gap between what patients apparently said and what Freud wrote down. Judged as science, the field mostly moved on decades ago.",
      "But almost no one else in the history of psychology reshaped how ordinary people talk about their own minds this thoroughly. He died in London on the 23rd of September 1939, choosing the timing and manner of his own death, by his physician's hand, at his own repeated request, rather than continue enduring a cancer that had already cost him his jaw and much of his face. Four of his sisters, left behind in Vienna because the Nazi authorities would not let an entire family leave at once, were murdered in the camps within a few years of his death."
    ]
  },

    {era:"Formation", year:"1876-82", title:"Works in Ernst Brücke's physiology laboratory", one:"Publishes early research on nerve cells and, memorably, the reproductive anatomy of eels.", more:"Brücke's lab was rigorously materialist, insisting all biological phenomena be explained by physics and chemistry alone. Freud absorbed this scientific ambition even after his own theories moved well outside what a strict physiologist would recognise as evidence."},
    {era:"Cocaine years", year:"1884", title:"Publishes “Über Coca”", one:"An enthusiastic paper promoting cocaine as a treatment for depression, fatigue and morphine addiction.", more:"Freud used it himself, praised it lavishly in print, and recommended it to his friend Ernst von Fleischl-Marxow, already addicted to morphine after a hand amputation. Fleischl-Marxow developed a severe cocaine addiction on top of the morphine one and died young, a fact Freud rarely discussed afterward."},
    {era:"Cocaine years", year:"1885", title:"Loses credit for cocaine's real medical breakthrough", one:"A colleague, Carl Koller, gets there first with cocaine's genuine use as a local anaesthetic in eye surgery.", more:"Freud had mentioned the anaesthetic possibility in passing but hadn't tested it properly before leaving Vienna to visit his fiancée. Koller published first. The episode stung Freud for years."},

    {era:"The talking cure", year:"1886", title:"Marries Martha Bernays, opens private practice", one:"Begins treating nervous disorders in Vienna, largely using hypnosis at first.", more:"The couple had six children, the youngest of whom, Anna Freud, became a major psychoanalyst herself and her father's closest professional collaborator in his final years."},
    {era:"The talking cure", year:"1895", title:"Publishes Studies on Hysteria with Josef Breuer", one:"Built around the case of “Anna O.”, treated by Breuer, whose own term for her therapy was “the talking cure”.", more:"Breuer and Freud's collaboration and friendship did not survive the book by many years; Breuer grew uncomfortable with how far Freud was pushing sexual explanations for hysteria, and the two men became estranged."},

  lectures: [
    {
      title:"Moravia to Vienna", sub:"1856–1876", meta:"Origins",
      quote:"The mind is like an iceberg, it floats with one-seventh of its bulk above water.",
      paras:[
        "Sigmund Freud was born in the small Moravian town of Freiberg in 1856, the eldest son of a wool merchant on his third marriage. His father Jakob was old enough, and close enough in age to his own adult sons from an earlier marriage, that the household's exact hierarchy of affection was never entirely straightforward. His mother Amalia was young, and by every account, unreservedly devoted to her firstborn son. Freud later said he had been his mother's undisputed favourite, and that a man who has been the unquestioned favourite of his mother keeps, for life, the feeling of a conqueror.",
        "The family's fortunes declined and they moved to Vienna when Freud was three, a city that was simultaneously one of the great intellectual capitals of Europe and a place where casual, institutional antisemitism shaped what a Jewish family could realistically expect from a career. Freud would live there for the next seventy-nine years, almost his entire life, before circumstances finally forced him out.",
        "He entered the University of Vienna's medical school in 1873 with no particular devotion to medicine itself. He later wrote that he felt no special calling to heal the sick, and had been drawn in instead by Darwin's theories and by a public reading of an essay on nature, wanting a scientific framework serious enough to investigate the biggest possible questions about what a human being actually is. Medicine was simply the respectable, available vehicle for that ambition."
      ]
    },
    {
      title:"Eels, Cocaine, and a Professional Embarrassment", sub:"1876–1886", meta:"Ambition",
      quote:"I am actually not at all a man of science... I am nothing but by temperament a conquistador.",
      paras:[
        "Freud spent his first serious scientific years in the physiology laboratory of Ernst Brücke, a demanding materialist who insisted every biological phenomenon be reducible, in principle, to physics and chemistry. Freud's early published research, on the nerve cells of crayfish and, notably, on the still-mysterious reproductive anatomy of eels, was careful, unglamorous laboratory science, a world away from the theories that would later make him famous.",
        "Money and ambition pushed him toward clinical medicine instead of a pure research career Brücke's lab couldn't afford to fund indefinitely. In 1884 he published “Über Coca”, an enthusiastic paper promoting cocaine as a treatment for depression, exhaustion, and even morphine addiction. Freud used it himself, praised its effects lavishly, and recommended it to his close friend Ernst von Fleischl-Marxow, who was already dependent on morphine after a botched hand amputation. Fleischl-Marxow developed a severe cocaine addiction on top of the existing one and died young, still in his thirties, a chapter of the story rarely included in the popular image of Freud the wise old man of the couch.",
        "The professional embarrassment came a year later. Freud had noted, in passing, cocaine's potential as a local anaesthetic, but left for a trip to see his fiancée Martha Bernays before properly testing the idea. A colleague, Carl Koller, tested it thoroughly in the interim and published first, securing credit for what would become one of cocaine's genuinely important, lasting medical applications, numbing the eye for surgery. Freud, by his own later account, felt the sting of that missed opportunity for years.",
        "The same period sent him to Paris to study under the neurologist Jean-Martin Charcot, whose public demonstrations of hysteria and hypnosis at the Salpêtrière hospital treated the condition as a real, physiologically rooted neurological disorder rather than fraud or feminine weakness. Freud brought that legitimising framework home to Vienna, and it became the foundation stone of everything that followed."
      ]
    },
    {
      title:"The Talking Cure", sub:"1886–1899", meta:"Method",
      quote:"Psychoanalysis is in essence a cure through love.",
      paras:[
        "Freud married Martha Bernays in 1886 and opened a private practice in Vienna treating nervous disorders, relying at first on hypnosis, the fashionable technique he'd observed in Paris. He found it inconsistent and unsatisfying, and gradually developed an alternative: simply letting patients talk, freely and without direction, about whatever came to mind, and listening for the patterns.",
        "The decisive case wasn't even his own. Studies on Hysteria, published with his colleague Josef Breuer in 1895, was built substantially around Breuer's patient “Anna O.”, whose own term for the method, talking through her symptoms until they eased, was “the talking cure”. The collaboration didn't survive the book by many years; Breuer grew increasingly uneasy with how insistently Freud traced hysteria back to repressed sexual material, and the friendship cooled into estrangement.",
        "In 1896, the same year he first used the word “psychoanalysis” in print, Freud's father Jakob died. The loss triggered an intense, sustained period of self-analysis, Freud treating his own dreams, memories and slips of the tongue as primary data for the theory he was building. It is a genuinely unusual methodological choice for a scientist to make himself his own most important case study, and it is a choice later critics return to constantly when explaining why so much of psychoanalytic theory proved so difficult to independently verify.",
        "By the end of the decade Freud had a working method, a growing private practice, and a body of self-observation he was ready to turn into the book he considered his masterpiece."
      ]
    },
    {
      title:"The Interpretation of Dreams", sub:"1899–1905", meta:"The theory",
      quote:"The interpretation of dreams is the royal road to the knowledge of the unconscious activities of the mind.",
      paras:[
        "The Interpretation of Dreams was published in late 1899, though Freud had the title page dated 1900, reportedly for the marketing appeal of a new-century publication. It sold roughly six hundred copies over its first eight years, a commercial disappointment that did nothing to shake Freud's own conviction that it was his most important work.",
        "The theory was ambitious: dreams were not random neurological noise but disguised wish-fulfilments, coded messages from an unconscious mind whose true desires were too threatening, or too socially unacceptable, to surface directly into waking awareness. Interpreting a dream, patiently decoding its symbols and free-associating outward from its images, became “the royal road” to everything the conscious mind was working to keep hidden from itself.",
        "The Psychopathology of Everyday Life followed in 1901, extending the same logic to slips of the tongue, misplaced objects, and small accidental errors, the origin of what popular usage still calls a Freudian slip, an unintended action that supposedly reveals an unconscious motive.",
        "Then, in 1905, Three Essays on the Theory of Sexuality pushed the theory somewhere far more controversial: infantile sexuality, the claim that sexual drives were present and psychologically active from early childhood, organised into a sequence of developmental stages. Vienna's medical and social establishment reacted with genuine outrage. It did lasting damage to Freud's public standing in the short term, and it is arguably the single claim that made psychoanalysis impossible for polite society to ignore."
      ]
    },
    {
      title:"Bringing the Plague to America", sub:"1907–1913", meta:"The movement",
      quote:"He said, in effect: promise me never to abandon the sexual theory. And I understood the request as one from a father who does not want to lose a son.",
      paras:[
        "By 1907, Freud had a genuine problem: psychoanalysis was widely dismissed outside Vienna as a parochial, faintly disreputable “Jewish science”, and he badly needed a credible non-Jewish, non-Viennese figurehead to carry it into the wider medical world. Carl Jung, respected, Swiss, Protestant, and already doing serious clinical work in Zurich, was close to perfect casting. Their first meeting, in Vienna in 1907, ran thirteen hours without a natural break, and Freud began describing Jung, before long, as his son and chosen heir.",
        "In 1909 the two men crossed the Atlantic together, along with Sándor Ferenczi, to lecture at Clark University in Massachusetts, Freud's only trip to America. He reportedly told Jung, half joking, as their ship approached New York harbour, that they were bringing the Americans “the plague”, psychoanalysis's peculiar power to permanently disturb people's comfortable illusions about themselves.",
        "In 1910 Freud engineered Jung into the presidency of the newly formed International Psychoanalytical Association, over the heads of his own long-serving Viennese circle, a decision that stored up real resentment among colleagues like Alfred Adler, who broke away entirely the following year to found his own rival school built around power and inferiority rather than sexuality.",
        "Jung's own departure in 1913 hurt more, and differently. Freud had spent years grooming him as psychoanalysis's future, extracting from him, by Jung's own later account, something close to a promise never to abandon the centrality of sexual theory. When Jung's theoretical differences hardened into an open break, Freud experienced it less as a scientific disagreement between colleagues than as a genuine act of filial betrayal, and the psychoanalytic movement narrowed considerably, and more defensively, around his most loyal remaining circle."
      ]
    },
    {
      title:"War, Death, and the Death Drive", sub:"1913–1923", meta:"Theory, revised",
      quote:"The aim of all life is death.",
      paras:[
        "The First World War tested Freud's earlier, relatively optimistic model of the mind, built around pleasure-seeking libido, against a scale of organised human violence and repetition-compulsion, soldiers reliving trauma in dreams rather than simply wishing it away, that the original theory struggled to explain.",
        "Personal loss sharpened the revision. Freud's daughter Sophie died suddenly in the 1918-1920 influenza pandemic, and biographers consistently connect her death to the noticeably darker turn his theory takes soon after, in 1920's Beyond the Pleasure Principle. Alongside the earlier life-preserving drives, Freud now proposed a death drive, Thanatos, an instinct toward destruction, repetition and eventual return to an inorganic, tension-free state, operating in permanent, unresolved tension with the drive toward life and pleasure.",
        "The theory reached its most enduring architectural form in 1923's The Ego and the Id, which replaced Freud's earlier, looser topography of conscious and unconscious with the structural model still taught in introductory psychology today: the id, primitive and driven by instinct; the superego, internalised social and parental prohibition; and the ego, the beleaguered mediator forced to negotiate between the two while still functioning in the real world.",
        "The same year, 1923, cancer was discovered in Freud's jaw, almost certainly linked to a lifelong habit of roughly twenty cigars a day. It would define, and steadily narrow, everything that came after."
      ]
    },
    {
      title:"The Cancer Years", sub:"1923–1933", meta:"Endurance",
      quote:"I have found little that is “good” about human beings on the whole... most of them are trash.",
      paras:[
        "Freud underwent roughly thirty operations on his jaw and mouth over his remaining sixteen years, eventually requiring an uncomfortable prosthetic device, patients and colleagues privately called it “the monster”, to separate his mouth from his nasal cavity so he could speak and eat at all. He continued seeing patients, writing, and smoking cigars, against every piece of medical advice, essentially without interruption.",
        "It was, by any measure, a long, grinding decade of physical suffering, and Freud's private correspondence from these years grows noticeably darker and more pessimistic about human nature in general, a shift some biographers read as inseparable from the pain he was living through daily, and others read as the honest conclusion of a lifetime spent listening to what people were actually capable of, once you got them talking freely enough.",
        "He kept working regardless, refining his theory of civilisation itself as a permanent, unresolved trade: humanity, in Freud's account, purchased the safety and structure of collective life at the cost of endlessly repressing its own instinctual drives, a bargain he considered necessary, exhausting, and never fully stable. His 1930 essay Civilization and Its Discontents, written the same year his mother Amalia died at ninety-five, remains one of his most widely read works outside clinical psychology, precisely because it reads less like a medical text than a genuinely bleak, personal verdict on the entire human project."
      ]
    },
    {
      title:"Book Burnings and a Flight Tax", sub:"1933–1939", meta:"Exile",
      quote:"What progress we are making. In the Middle Ages they would have burned me; now they are content with burning my books.",
      paras:[
        "In 1933, Nazi students publicly burned Freud's books in Berlin as part of a broader campaign against “un-German” and Jewish intellectual work. Freud, reportedly, greeted the news with characteristic dark humour: progress, he said, given that an earlier century would simply have burned the author.",
        "That humour did not survive the Anschluss. When Germany annexed Austria in March 1938, the danger stopped being abstract almost overnight. The Gestapo interrogated Freud's daughter Anna, his closest professional collaborator and the person he trusted to carry psychoanalysis forward, for an entire day; she had reportedly carried a lethal dose of veronal with her in case the interrogation ended in something worse than release.",
        "Freud, eighty-two and gravely ill, was permitted to emigrate only after paying what amounted to a ransom, a so-called “flight tax”, arranged with help from influential supporters including Princess Marie Bonaparte and diplomatic pressure from the United States. He was forced to sign an official statement declaring he had been treated with proper respect by the authorities. He added a sardonic postscript recommending the Gestapo to anyone, a small, bitter act of defiance the censors apparently missed or chose to ignore.",
        "Four of Freud's elderly sisters were refused exit permits; an entire family leaving at once, the authorities decided, would attract too much attention. All four later died in Nazi concentration and extermination camps. Freud, in London, spent his final months completing Moses and Monotheism and continuing to see a small number of patients through worsening pain, before dying on the 23rd of September 1939, by his own explicit request, as his physician Max Schur administered a final series of morphine doses. He was eighty-three, and the Second World War had begun three weeks earlier."
      ]
    }
  ]
},

  timeline: [
    {era:"The dark year", year:"1904", title:"Born in Susquehanna, Pennsylvania", one:"March 20th, son of a lawyer, in a small, orderly railroad town.", more:"Skinner later described his childhood home as warm but rule-bound, and credited it with an early, lasting interest in how consequences, praise, punishment, small daily rewards, actually shaped what he and his younger brother did."},
    {era:"The dark year", year:"1922", title:"Enters Hamilton College", one:"Studies English, intending to become a novelist.", more:"He was a bright, restless, somewhat awkward student who threw himself into writing rather than science, and graduated still fully committed to a literary career."},
    {era:"The dark year", year:"1926-27", title:"Corresponds with Robert Frost", one:"Sends the poet some short stories and receives genuinely encouraging feedback.", more:"Skinner moved back into his parents' house afterward, intending to spend a year writing seriously. He later called it his “dark year”: he produced almost nothing worth keeping, and eventually concluded, bluntly, that he had nothing important to say as a novelist."},
    {era:"The dark year", year:"1928", title:"Enters Harvard for graduate study in psychology", one:"Abandons fiction for science, having read Pavlov and John B. Watson.", more:"He arrived with no undergraduate psychology training at all, and threw himself into laboratory work with the same intensity he'd once given fiction."},
    {era:"The box", year:"1930-31", title:"Develops the operant conditioning chamber", one:"The “Skinner box”: a lever, a food-pellet dispenser, and an animal, usually a rat or pigeon, learning that pressing the lever produces a reward.", more:"He also built the cumulative recorder, a device that graphed an animal's rate of responding over time, turning behaviour itself into a continuous, visible data trace rather than a series of isolated trials."},
    {era:"The box", year:"1931", title:"PhD, Harvard", one:"Formalises operant conditioning as distinct from Pavlov's classical conditioning.", more:"Where Pavlov's dogs learned to associate one stimulus with another, Skinner's animals learned that their own voluntary actions produced consequences, a shift in emphasis that would define his entire career."},

      paras:[
        "Burrhus Frederic Skinner was born in the small, orderly railroad town of Susquehanna, Pennsylvania in 1904, the son of a lawyer. It was a stable, rule-bound household, and Skinner later credited it with his first real fascination: watching how consistently small rewards and punishments actually shaped what he and his younger brother did, long before he had any formal vocabulary for it.",
        "He arrived at Hamilton College in 1922 intending to become a writer, and left four years later still fully committed to that plan. He sent some short stories to Robert Frost, who responded with genuinely warm encouragement, and Skinner moved back into his parents' house to spend a serious year writing.",
        "He later called it his “dark year”. He produced almost nothing he considered worth keeping, and reached, with the same blunt clarity he'd later apply to everything else, a simple conclusion: he had nothing important to say as a novelist. It is, in hindsight, a strikingly behaviorist way to fail at fiction, judging the work purely by its output rather than by any inner sense of artistic calling.",
        "In 1928 he enrolled at Harvard for graduate study in psychology, having read Pavlov's work on conditioned reflexes and John B. Watson's behaviorist manifestos, with no undergraduate psychology training at all. He threw himself into laboratory work with exactly the intensity he'd once reserved for fiction, and within two years had built the apparatus that would define his entire career."

        "The real innovation wasn't the box. It was the cumulative recorder, a device that graphed an animal's rate of responding continuously over time, turning behaviour into a visible, ongoing data trace rather than a series of separate trials to be counted afterward. For the first time, a researcher could watch, in real time, exactly how a pattern of reinforcement shaped the shape of behaviour itself.",
        "This let Skinner draw a sharp theoretical line against Pavlov's already-famous classical conditioning. Pavlov's dogs learned to associate one stimulus with another, a bell with food, largely passively. Skinner's animals learned that their own voluntary actions, pressing a lever, produced consequences in the world. Operant conditioning was behaviour operating on the environment and being shaped by what came back.",
        "The Behavior of Organisms, published in 1938 after Skinner had moved to the University of Minnesota and married Yvonne Blue, laid the whole framework out formally and established him, while still relatively junior, as a serious and increasingly influential figure in American experimental psychology."

        "A magazine ran an article about the invention, calling it the “Heir Conditioner” in a headline pun Skinner reportedly disliked. That article, retold and distorted across subsequent decades, mutated into something else entirely: an urban legend that Skinner had raised his daughter as a psychological experiment in a sealed laboratory box, and that she had, as a result, gone insane, sued her father, and eventually killed herself.",

        "It's a genuinely useful teaching example, not just of one specific myth, but of how easily a fairly mundane piece of applied engineering can be transformed, through repetition alone, into something far darker and far more memorable than the truth, a process that, with a certain irony, is itself a kind of reinforcement schedule: each retelling rewarded by how much more dramatic the story becomes."

        "Walden Two, published in 1948, answered the question as fiction: a utopian novel depicting a self-sufficient commune where child-rearing, work, and social life were all consciously engineered to reinforce cooperative, contented behaviour. The book's mouthpiece character, Frazier, argues the case for behavioral design with an unapologetic confidence that many readers found either inspiring or deeply unsettling, sometimes both at once.",

        "The public reaction was enormous, and largely hostile. Time magazine put Skinner on its cover; critics across the political spectrum accused him of building a case for soft authoritarianism dressed up as science. He was denounced from pulpits and op-ed pages alike as a threat to everything from religious faith to American individualism.",

        "The question that would eventually define his career was already visible, even at this early stage, in the particular way he framed his ambitions: not simply how groups behave, the standard social-psychology question of the era, but something closer to the specific historical puzzle that had shadowed his own childhood, how ordinary, unremarkable people could become willing participants in organised atrocity."

const ACCENTS = {
  jung:    '#1f4fd8', // cobalt
  rogers:  '#2f7a52', // sage green
  freud:   '#8c2f3f', // wine burgundy
  skinner: '#1f7a72', // steel teal
  milgram: '#c1531f', // burnt amber
  piaget:  '#6b3fa0', // violet
};

function shadeColor(hex, percent){
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (num >> 16) + percent));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + percent));
  const b = Math.max(0, Math.min(255, (num & 0x0000FF) + percent));
  return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}

  document.getElementById('brandText').textContent = p.brand;
  document.getElementById('footerBrand').textContent = p.brand;

  document.getElementById('heroKicker').textContent = p.hero.kicker;
  document.getElementById('heroTitle').innerHTML = p.hero.titleHTML;
  document.getElementById('heroLede').textContent = p.hero.lede;

  document.getElementById('coldOpenTag').textContent = p.coldOpen.tag;
  document.getElementById('coldOpenParas').innerHTML = p.coldOpen.paras.map(t => `<p>${t}</p>`).join('');
  document.getElementById('coldOpenSign').textContent = p.coldOpen.sign;

  document.getElementById('timelineKicker').innerHTML = p.timelineSec.kicker;
  document.getElementById('timelineTitle').innerHTML = p.timelineSec.titleHTML;
  document.getElementById('timelineLede').textContent = p.timelineSec.lede;

  document.getElementById('lecturesKicker').textContent = p.lecturesSec.kicker;
  document.getElementById('lecturesTitle').innerHTML = p.lecturesSec.titleHTML;
  document.getElementById('lecturesLede').textContent = p.lecturesSec.lede;

  document.getElementById('legacyKicker').textContent = p.legacySec.kicker;
  document.getElementById('legacyTitle').innerHTML = p.legacySec.titleHTML;
  document.getElementById('legacyLede').textContent = p.legacySec.lede;

  document.getElementById('verdictTitle').textContent = p.verdict.title;
  document.getElementById('verdictParas').innerHTML = p.verdict.paras.map(t => `<p>${t}</p>`).join('');

  document.getElementById('footerTagline').innerHTML = p.footer.tagline;
  document.getElementById('footerFine').innerHTML = p.footer.fine;

  // Legacy grid
  const legacyGrid = document.getElementById('legacyGrid');
  legacyGrid.innerHTML = '';
  p.legacyCards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<h3>${c.title}</h3><p>${c.body}</p>`;
    legacyGrid.appendChild(el);
  });

  // Timeline
  const tlList = document.getElementById('timelineList');
  tlList.innerHTML = '';
  let lastEra = null;
  p.timeline.forEach((item) => {
    if(item.era !== lastEra){
      const eraEl = document.createElement('div');
      eraEl.className = 'tl-era';
      eraEl.textContent = item.era;
      tlList.appendChild(eraEl);
      lastEra = item.era;
    }
    const el = document.createElement('div');
    el.className = 'tl-item';
    el.innerHTML = `
      <div class="row">
        <span class="tl-year">${item.year}</span>
        <span class="tl-title">${item.title}</span>
      </div>
      <div class="tl-one">${item.one}</div>
      <div class="tl-hint">Click for more &#8594;</div>
      <div class="tl-more"><div class="tl-more-inner">${item.more}</div></div>
    `;
    el.addEventListener('click', () => el.classList.toggle('open'));
    tlList.appendChild(el);
  });

  // Lectures
  const lecList = document.getElementById('lectureList');
  lecList.innerHTML = '';
  p.lectures.forEach((lec, i) => {
    const el = document.createElement('div');
    el.className = 'lec';
    const num = String(i+1).padStart(2,'0');
    el.innerHTML = `
      <button class="lec-head" aria-expanded="false">
        <span class="lec-num">${num}</span>
        <span class="lec-head-text">
          <span class="lec-title">${lec.title}</span>
          <span class="lec-sub">${lec.sub}</span>
        </span>
        <span class="lec-meta">${lec.meta}</span>
        <svg class="lec-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="lec-body">
        <div class="lec-body-inner">
          <div class="lec-quote">&#8220;${lec.quote}&#8221;</div>
          ${lec.paras.map(pp => `<p>${pp}</p>`).join('')}
        </div>
      </div>
    `;
    const head = el.querySelector('.lec-head');
    head.addEventListener('click', () => {
      const willOpen = !el.classList.contains('open');
      el.classList.toggle('open', willOpen);
      head.setAttribute('aria-expanded', String(willOpen));
    });
    lecList.appendChild(el);
  });

  window.scrollTo(0,0);
}

// ---------- Switcher ----------
const switcher = document.getElementById('personSwitcher');
switcher.querySelectorAll('.switch-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    switcher.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPerson(btn.dataset.person);
  });
});

renderPerson('jung');

</script>
</body>
</html>
