<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="docTitle">Exam Photos Speaking - johnplusenglish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sun:#FFB347;--sky:#2176FF;--sky-light:#E8EEFF;--sea:#1DD3B0;--sea-light:#E4F8F6;--coral:#FF6B6B;--lavender:#9B72CF;--lavender-light:#F0E8FA;--mint:#5DDEA0;--sand:#FFF5E6;--cream:#F7F6F3;--ink:#2D3047;--muted:#7A7D8E;--border:#E8E5DF;--card:#fff;--radius:14px;--radius-sm:10px;--shadow-sm:0 1px 3px rgba(45,48,71,.06);--shadow-md:0 4px 14px rgba(45,48,71,.08);--lv-b2:#16A88D;--lv-b2-light:rgba(22,168,141,.1);--lv-c1:#2176FF;--lv-c1-light:rgba(33,118,255,.1);--lv-c2:#9B72CF;--lv-c2-light:rgba(155,114,207,.1)}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-y:scroll}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}

nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(247,246,243,.88);backdrop-filter:blur(16px);border-bottom:1.5px solid var(--border);padding:.85rem 2rem;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.nav-logo span{color:#2563EB}
.nav-links{display:flex;gap:1.8rem}
.nav-links a{font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--ink)}

.page-header{padding:2rem 2rem 1rem;max-width:960px;margin:0 auto}
.back-link{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:1.2rem;transition:color .2s}
.back-link:hover{color:var(--ink)}
.section-label{font-family:Outfit,sans-serif;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lavender);margin-bottom:.5rem;font-weight:500}
.page-title{font-family:'Outfit',sans-serif;font-size:clamp(2rem,5vw,3rem);margin-bottom:.8rem;font-weight:900;line-height:1.1}
.page-desc{color:var(--muted);font-size:1.05rem;max-width:600px;line-height:1.7;margin-bottom:1.5rem}
.topic-hero{display:flex;align-items:flex-start;gap:1.25rem}
.topic-icon{width:52px;height:52px;border-radius:12px;background:color-mix(in srgb,#2D3047 8%,#fff);color:#2D3047;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topic-icon svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor}
.page-header h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;letter-spacing:-.01em;line-height:1.1;margin:0}

.main-area{max-width:960px;margin:0 auto;padding:0 2rem 4rem;position:relative;z-index:1}

/* Mode tabs (folder style; level badge keeps its own semantic colour) */
.mode-bar{display:flex;gap:4px;row-gap:4px;position:relative;flex-wrap:wrap;align-items:flex-end;padding-top:8px;margin-bottom:1.8rem}
.mode-bar::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.mode-pill{position:relative;padding:.5rem 1.1rem;border-radius:12px 12px 0 0;font-size:.85rem;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--muted);transition:background .18s,color .18s,box-shadow .18s,border-color .18s;white-space:nowrap;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:7px}
.mode-pill .lvl{font-family:Outfit,sans-serif;font-size:.65rem;font-weight:500;padding:2px 7px;border-radius:5px;letter-spacing:.5px}
.mode-pill:not(.active):hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.mode-pill:not(.active):focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.mode-pill.active{outline:none;background:var(--cream);border-bottom:none!important;box-shadow:0 -3px 10px rgba(45,48,71,.06);padding-top:calc(.5rem + 3px);z-index:2}
.mode-pill[data-mode="b2"].active{border-color:var(--lv-b2);color:var(--lv-b2)}
.mode-pill[data-mode="c1"].active{border-color:var(--lv-c1);color:var(--lv-c1)}
.mode-pill[data-mode="c2"].active{border-color:var(--lv-c2);color:var(--lv-c2)}
.mode-pill[data-mode="gen"].active{border-color:var(--sun);color:var(--sun)}
.mode-pill .lvl-b2{background:var(--lv-b2-light);color:var(--lv-b2)}
.mode-pill .lvl-c1{background:var(--lv-c1-light);color:var(--lv-c1)}
.mode-pill .lvl-c2{background:var(--lv-c2-light);color:var(--lv-c2)}
.mode-pill .lvl-gen{background:var(--sand);color:var(--sun)}
@media(max-width:600px){.mode-pill{padding:.5rem .8rem;font-size:.78rem}.mode-pill.active{padding-top:calc(.5rem + 3px)}}
@media(prefers-reduced-motion:reduce){.mode-pill{transition:none}}

/* Panels */
.panel{display:none;animation:fadeUp .3s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Exam info banner */
.exam-info{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:.88rem;line-height:1.55;color:var(--ink)}
.exam-info.b2{background:var(--lv-b2-light);}
.exam-info.c1{background:var(--lv-c1-light);}
.exam-info.c2{background:var(--lavender-light);}
.exam-info.gen{background:var(--sand);}
.exam-info svg{flex-shrink:0;margin-top:2px}
.exam-info strong{font-weight:700}

/* ── ACCORDION CARDS ── */
.acc-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:12px;overflow:hidden;transition:box-shadow .2s}
.acc-card:hover{box-shadow:var(--shadow-md)}
.acc-card.open{box-shadow:var(--shadow-md)}
.acc-header{padding:16px 22px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .15s;user-select:none}
.acc-header:hover{background:var(--cream)}
.acc-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.95rem}
.set-badge{font-family:Outfit,sans-serif;font-size:.68rem;font-weight:500;padding:4px 10px;border-radius:6px;letter-spacing:.5px}
.set-badge.b2{background:var(--lv-b2-light);color:var(--lv-b2)}
.set-badge.c1{background:var(--lv-c1-light);color:var(--lv-c1)}
.set-badge.c2{background:var(--lavender-light);color:var(--lavender)}
.set-badge.gen{background:var(--sand);color:var(--sun)}
.chevron{color:var(--muted);transition:transform .25s;font-size:.85rem}
.acc-card.open .chevron{transform:rotate(180deg)}
.acc-body{display:none;padding:0 22px 22px;border-top:1.5px solid var(--border)}
.acc-card.open .acc-body{display:block;animation:fadeUp .2s ease}

/* Labels */
.lbl{font-family:Outfit,sans-serif;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;margin-top:16px;font-weight:500}
.lbl:first-child{margin-top:14px}

/* Images */
.img-row{display:flex;gap:12px;margin-bottom:4px;margin-top:2px}
.img-slot{flex:1;aspect-ratio:4/3;border-radius:var(--radius-sm);overflow:hidden;position:relative;background:var(--cream);border:1.5px solid var(--border)}
.img-slot img{width:100%;height:100%;object-fit:cover;display:block}
.img-label{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;background:rgba(31,34,51,.6);color:#fff;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.img-row.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.img-row.grid-3 .img-slot{aspect-ratio:4/3}
.img-row.grid-5{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.img-row.grid-5 .img-slot{aspect-ratio:1}
.img-row.single{max-width:100%}

/* Task instruction */
.task-q{font-family:'Outfit',sans-serif;font-size:1rem;font-weight:500;line-height:1.6;color:var(--ink);padding:0;margin:18px 0 14px}
.task-q strong{font-weight:800}
.task-q.phase-q{display:none}.task-q.phase-q.active{display:block}

/* Timer */
.timer-row{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--cream);border-radius:var(--radius-sm);margin-top:12px;border:1px solid var(--border);font-size:.82rem;color:var(--muted)}
.timer-row strong{color:var(--ink);font-weight:700}
.timer-progress-fill{position:absolute;left:0;top:0;height:3px;background:var(--sea);width:0%;transition:width .3s linear}
.timer-progress-fill.warn{background:var(--coral)}
.timer-btn-wrap{margin-left:auto;display:inline-flex;border-radius:10px;overflow:hidden}
.timer-btn{background:var(--sky);color:#fff;border:none;padding:6px 16px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;display:inline-flex;align-items:center;gap:6px}
.timer-btn:hover{background:#3A7DC4}
.timer-btn-icon{font-size:.85em;line-height:1}
.timer-btn .timer-btn-time{font-family:'JetBrains Mono',monospace}
.timer-btn.running{background:var(--coral)}
.timer-btn.running:hover{background:#E55A5A}
.timer-btn.paused{background:var(--sun)}
.timer-btn.done{background:var(--coral)}
.timer-edit-btn{font-family:'Outfit',sans-serif;padding:6px 10px;border:none;border-left:1.5px solid rgba(255,255,255,.35);background:var(--sky);color:#fff;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center}
.timer-edit-btn:hover{background:#3A7DC4}
.timer-duration-edit{display:none;align-items:baseline;gap:.3rem;font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:700;padding:6px 10px;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);margin-left:auto}
.timer-duration-input{font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:700;border:none;background:transparent;color:var(--ink);width:4.2ch;text-align:center;outline:none;padding:0}

/* Guided prompts */
.prompts-list{display:flex;flex-direction:column;gap:0;margin-top:2px}
.p-item{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.p-item:last-child{border-bottom:none}
.p-num{width:14px;font-size:.82rem;font-weight:800;flex-shrink:0;line-height:1.5}
.p-num.b2{color:var(--lv-b2)}
.p-num.c1{color:var(--lv-c1)}
.p-num.c2{color:var(--lavender)}
.p-num.gen{color:var(--sun)}
.p-text{display:block;font-size:.87rem;color:var(--ink);line-height:1.5;font-weight:600}
.p-hint{display:block;font-size:.8rem;color:var(--muted);font-style:italic;margin-top:2px;font-weight:400}

/* Follow-up */
.followup{padding:2px 0 0;display:block}

/* Language box */
.lang-box{padding:2px 0 0}
.lang-groups{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 28px}
.lang-fn{font-family:Outfit,sans-serif;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.11em;padding-bottom:6px;border-bottom:1.5px solid var(--border);margin-bottom:4px}
.lang-fn.b2{color:var(--lv-b2)}
.lang-fn.c1{color:var(--lv-c1)}
.lang-fn.c2{color:var(--lavender)}
.lang-fn.gen{color:var(--sun)}
.lang-list{list-style:none;margin:0;padding:0}
.lang-list .chip{display:block;font-size:.84rem;font-weight:400;line-height:1.4;color:var(--ink);background:none;border:none;border-radius:0;padding:5px 0;transition:color .15s}
.lang-list .chip:hover{background:none;border:none;color:var(--sky)}
.lang-list .chip.used{text-decoration:line-through;color:var(--muted);opacity:.45;background:none}
.lang-list .chip.used:hover{background:none;color:var(--muted)}
@media(max-width:820px){.lang-groups{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.lang-groups{grid-template-columns:1fr;gap:14px}}
.lang-box-header{display:flex;align-items:center;justify-content:flex-end;margin-top:10px}
.reset-chips{font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;transition:color .15s}
.reset-chips:hover{color:var(--ink)}

/* ── Present mode: full-window view of one task's question + photos for a shared screen ── */
.present-overlay{position:fixed;inset:0;z-index:600;background:var(--cream);display:none;flex-direction:column}
.present-overlay.open{display:flex}
.present-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:14px 24px;background:#fff;border-bottom:1.5px solid var(--border);flex-shrink:0}
.present-topic{font-family:'Outfit',sans-serif;font-weight:800;font-size:1.05rem;color:var(--ink)}
.present-close{display:inline-flex;align-items:center;gap:9px;font-family:'Outfit',sans-serif;background:none;border:1.5px solid var(--border);border-radius:10px;padding:7px 10px 7px 16px;cursor:pointer;color:var(--muted);transition:all .15s}
.present-close:hover{border-color:var(--ink);color:var(--ink)}
.present-close-x{font-size:1.15rem;line-height:1}
.present-close-label{font-size:.65rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--border);border-radius:5px;padding:2px 6px}
.present-stage{flex:1;overflow:auto;padding:32px 5vw 56px;display:flex;flex-direction:column;align-items:center;gap:20px}
.present-stage .task-q{font-size:clamp(1rem,1.35vw,1.3rem);line-height:1.5;max-width:1150px;width:100%;padding:16px 22px}
.present-stage .img-row{width:100%;max-width:1250px;gap:22px;margin:0}
.present-stage .img-row.single{max-width:1000px}
.present-stage .img-slot{border-radius:16px}
.present-stage .img-label{width:32px;height:32px;font-size:.95rem;top:12px;left:12px}
.present-stage .lbl{font-size:.85rem;max-width:1250px;width:100%;margin:0}
.present-stage .timer-row{width:100%;max-width:1250px;font-size:1.15rem;padding:18px 24px}
.present-stage .timer-btn{font-size:1.05rem;padding:11px 20px}
.present-stage .phase-tabs{width:100%;max-width:1250px}
.present-stage .phase-tab{font-size:.92rem;padding:10px 20px}
.present-stage .phase-block{width:100%;max-width:1250px;margin-top:0}
.present-stage .sub-drop{width:100%}
@media(max-width:820px){.present-stage{padding:24px 4vw 40px;gap:18px}.present-stage .task-q{font-size:1.1rem;padding:16px 20px}}
@media print{.present-overlay{display:none!important}}
.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.print-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-family:'Outfit',sans-serif;transition:all .2s}
.print-btn:hover{border-color:var(--ink);color:var(--ink)}
.dl-btn.busy{opacity:.55;cursor:progress}
.print-btn:disabled{pointer-events:none}
.print-btn svg{flex-shrink:0}

.img-slot.c1-faded{opacity:.3;transition:opacity .25s;filter:grayscale(30%)}
.img-slot.faded{opacity:.35;transition:opacity .25s;filter:grayscale(30%)}

@media print{
  nav,.mode-bar,.acc-header .chevron,.sub-drop-header,.timer-row,.gen-timer-row,.print-btn,.card-actions,.phase-tabs{display:none!important}
  .acc-card{box-shadow:none!important;border:1px solid #ddd!important;break-inside:avoid}
  .acc-body{display:block!important}
  .sub-drop-body{display:block!important}
  body::before{display:none}
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;font-weight:500;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:5px 11px;color:var(--ink);transition:background .15s,border-color .15s,color .15s;cursor:pointer;user-select:none}
.chip:hover{background:var(--sky-light);border-color:var(--sky);color:var(--sky)}
.chip.used{text-decoration:line-through;opacity:.4;background:transparent;color:var(--muted)}
.chip.used:hover{background:transparent;border-color:var(--border);color:var(--muted)}

/* C2 phase tabs */
.phase-tabs{display:flex;gap:4px;background:var(--cream);border-radius:10px;padding:3px;width:fit-content;margin-top:14px;border:1.5px solid var(--border)}
.phase-tab{font-family:'Outfit',sans-serif;padding:6px 16px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all .2s}
.phase-tab:hover{color:var(--ink)}
.phase-tab.active{background:var(--ink);color:#fff;box-shadow:var(--shadow-sm)}
.phase-block{display:none;margin-top:10px}
.phase-block.active{display:block}

/* Sub-dropdowns inside accordion cards */
.sub-drop{margin-top:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--card)}
.sub-drop-header{padding:11px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:background .15s;font-size:.84rem;font-weight:700;color:var(--ink)}
.sub-drop-header:hover{background:var(--cream)}
.sub-drop-header .sub-icon{font-size:.75rem;color:var(--muted);transition:transform .2s}
.sub-drop.open .sub-drop-header .sub-icon{transform:rotate(180deg)}
.sub-drop-body{display:none;padding:4px 16px 14px;border-top:1px solid var(--border)}
.sub-drop.open .sub-drop-body{display:block}
.sub-drop-header .sub-label{display:flex;align-items:center;gap:8px}
.sub-drop-header .sub-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sub-dot.b2{background:var(--lv-b2)}.sub-dot.c1{background:var(--lv-c1)}.sub-dot.c2{background:var(--lavender)}.sub-dot.gen{background:var(--sun)}

.mode-pill[data-mode="phrases"].active{border-color:var(--ink);color:var(--ink)}
.mode-pill .lvl-phrases{background:#f0f0f0;color:var(--ink)}

/* Phrase Bank */
.pb-level-bar{display:flex;gap:4px;background:var(--cream);border-radius:10px;padding:3px;width:fit-content;margin-bottom:1.8rem;border:1.5px solid var(--border)}
.pb-level-btn{font-family:'Outfit',sans-serif;padding:7px 20px;border-radius:10px;font-size:.82rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all .2s}
.pb-level-btn:hover{color:var(--ink)}
.pb-level-btn.active.b2{background:var(--lv-b2);color:#fff}
.pb-level-btn.active.c1{background:var(--lv-c1);color:#fff}
.pb-level-btn.active.c2{background:var(--lavender);color:#fff}
.pb-level-btn.active.gen{background:var(--sun);color:var(--ink)}
.pb-panel{display:none}
.pb-panel.active{display:block;animation:fadeUp .3s ease}
.pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pb-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm)}
.pb-card-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pb-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pb-dot.b2{background:var(--lv-b2)}.pb-dot.c1{background:var(--lv-c1)}.pb-dot.c2{background:var(--lavender)}.pb-dot.gen{background:var(--sun)}
.pb-fn{font-family:Outfit,sans-serif;font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.pb-chips{display:flex;flex-wrap:wrap;gap:5px}

@media(max-width:700px){
  .pb-level-bar{width:100%}
  .pb-level-btn{flex:1;text-align:center;padding:7px 8px;font-size:.75rem}
  .pb-grid{grid-template-columns:1fr}
}

@media(max-width:700px){
  .page-header{padding:2rem 1.2rem 1rem}
  .main-area{padding:0 1.2rem 3rem}
  .acc-header{padding:14px 16px}
  .acc-body{padding:0 16px 18px}
  .img-row{flex-direction:column}
  .img-row.grid-3,.img-row.grid-5{grid-template-columns:1fr 1fr}
  .phase-tabs{width:100%}
  .phase-tab{flex:1;text-align:center;font-size:.72rem;padding:6px 8px}
  nav{padding:.85rem 1.2rem}
  .nav-links{gap:1rem}
}

function renderPhrases() {
  const el = document.getElementById('panel-phrases');

  ];
  let h = `<div class="pb-level-bar">`;
  levels.forEach((lv,i) => {
    h += `<button class="pb-level-btn${i===0?' active b2':''}" data-pblevel="${lv.key}" onclick="switchPbLevel(this,'${lv.key}')">${lv.label}</button>`;
  });
  h += `</div>`;
  levels.forEach((lv,i) => {
    h += `<div class="pb-panel${i===0?' active':''}" id="pb-${lv.key}">`;
    h += `<button class="print-btn" style="margin-bottom:14px" onclick="printPbLevel('${lv.key}')"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>Print all</button>`;
    h += `<div class="pb-grid" id="pb-grid-${lv.key}">`;
    phraseBank[lv.key].forEach(cat => {
      const cardId = `pb-${lv.key}-${cat.fn.replace(/\s+/g,'-').replace(/[^a-z0-9-]/gi,'')}`;
      h += `<div class="pb-card" id="${cardId}"><div class="pb-card-title"><span class="pb-dot ${lv.key}"></span><span class="pb-fn">${cat.fn}</span></div><div class="pb-chips">${cat.phrases.map(p=>`<span class="chip">${p}</span>`).join('')}</div></div>`;
    });
    h += `</div></div>`;
  });
  el.innerHTML = h;
}

function switchPbLevel(btn, level) {
  const bar = btn.closest('.pb-level-bar');
  bar.querySelectorAll('.pb-level-btn').forEach(b => b.className = 'pb-level-btn');
  btn.classList.add('active', level);
  document.querySelectorAll('.pb-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`pb-${level}`).classList.add('active');
}

function imgs(photos, cls, labels) {
  return `<div class="img-row ${cls||''}">${photos.map((u,i)=>`<div class="img-slot">${labels?`<span class="img-label">${labels[i]}</span>`:''}<img src="${u}" alt="${labels?'Photo '+labels[i]:'Image'}" loading="lazy"></div>`).join('')}</div>`;

function promptsList(list, level) {
  return `<div class="prompts-list">${list.map((p,i)=>`<div class="p-item"><span class="p-num ${level}">${i+1}</span><div><span class="p-text">${p.text}</span>${p.hint?`<span class="p-hint">${p.hint}</span>`:''}</div></div>`).join('')}</div>`;

function langBox(level) {
  const cols = lang[level].map(g =>
    `<div class="lang-group"><div class="lang-fn ${level}">${g.fn}</div><ul class="lang-list">` +
    g.phrases.map(t => `<li class="chip">${t}</li>`).join('') +

function timerHTML(id, secs, locked, labelText) {
  const m = Math.floor(secs/60), s = secs%60;
  const labelHTML = labelText !== undefined ? labelText : `Speaking time: <strong>${m>0?m+' min':''}${s>0?' '+s+' sec':''}</strong>`;
  const editBits = locked ? '' :
    `<button class="timer-edit-btn" id="timerEditBtn-${id}" onclick="timerEditDuration('${id}')" title="Edit duration" aria-label="Edit timer duration"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><span class="timer-duration-edit" id="timerDurationEdit-${id}"><input type="text" inputmode="numeric" class="timer-duration-input" id="timerDurationInput-${id}" placeholder="${timerFormatTime(secs)}" onblur="timerCommitDuration('${id}')" onkeydown="if(event.key==='Enter'){this.blur()}else if(event.key==='Escape'){timerCancelEdit('${id}')}"></span>`;
  return `<div class="timer-row">
    <div class="timer-progress-fill" id="timerProgress-${id}"></div>
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5.5"/><path d="M7 4v3l2 1"/></svg>
    <span>${labelHTML}</span>
    <span class="timer-btn-wrap"><button class="timer-btn" id="timerBtn-${id}" onclick="timerHandleClick('${id}')"><span class="timer-btn-icon" id="timerBtnIcon-${id}">&#9654;</span><span id="timerBtnLabel-${id}"></span></button>${editBits}</span>
  </div>`;
}

function subDrop(label, level, content, openByDefault=false) {
  return `<div class="sub-drop${openByDefault?' open':''}"><div class="sub-drop-header" onclick="this.parentElement.classList.toggle('open')"><span class="sub-label"><span class="sub-dot ${level}"></span>${label}</span><span class="sub-icon">▾</span></div><div class="sub-drop-body">${content}</div></div>`;
}

// ── Reusable timer widget engine (multi-instance; locked = official exam duration, unlocked = editable m:ss) ──
var timerState = {};
function timerFormatTime(totalSeconds){
  var m=Math.floor(totalSeconds/60), s=totalSeconds%60;
  return m+':'+(s<10?'0':'')+s;
}
function timerParseTime(str){
  var parts=String(str).trim().split(':');
  var m, s;
  if(parts.length>=2){ m=parseInt(parts[0],10); s=parseInt(parts[1],10); }
  else { m=parseInt(parts[0],10); s=0; }
  if(isNaN(m)) m=0;
  if(isNaN(s)||s<0||s>59) s=0;
  var total=m*60+s;
  if(!total || total<1) return null;
  return Math.min(total,5999);
}
function timerInit(id, defaultSecs, locked){
  timerState[id] = {interval:null, seconds:defaultSecs, total:defaultSecs, running:false, paused:false, defaultSecs:defaultSecs, locked:!!locked};
  timerUpdateBtn(id);
}
function timerSelectDuration(id, secs){
  var st = timerState[id];
  clearInterval(st.interval); st.interval=null;
  st.running=false; st.paused=false;
  st.total=secs; st.seconds=secs;
  var prog = document.getElementById('timerProgress-'+id);
  prog.style.width='0%'; prog.className='timer-progress-fill';
  timerUpdateBtn(id);
}
function timerEditDuration(id){
  var st = timerState[id];
  if(st.locked) return;
  clearInterval(st.interval); st.interval=null; st.running=false; st.paused=false;
  var input=document.getElementById('timerDurationInput-'+id);
  input.value=timerFormatTime(st.defaultSecs);
  document.getElementById('timerBtn-'+id).style.display='none';
  document.getElementById('timerEditBtn-'+id).style.display='none';
  document.getElementById('timerDurationEdit-'+id).style.display='inline-flex';
  input.focus();
  input.select();
}
function timerCommitDuration(id){
  var st = timerState[id];
  if(st._canceling){ st._canceling=false; return; }
  var parsed=timerParseTime(document.getElementById('timerDurationInput-'+id).value);
  if(parsed) st.defaultSecs=parsed;
  document.getElementById('timerDurationEdit-'+id).style.display='none';
  document.getElementById('timerBtn-'+id).style.display='inline-flex';
  timerSelectDuration(id, st.defaultSecs);
}
function timerCancelEdit(id){
  var st = timerState[id];
  st._canceling=true;
  document.getElementById('timerDurationEdit-'+id).style.display='none';
  document.getElementById('timerBtn-'+id).style.display='inline-flex';
  timerUpdateBtn(id);
}
function timerHandleClick(id){
  var st = timerState[id];
  if(!st.running && !st.paused && st.seconds<=0 && st.total>0){ timerSelectDuration(id, st.defaultSecs); return; }
  timerToggle(id);
}
function timerToggle(id){
  var st = timerState[id];
  if(!st.total) return;
  if(!st.running && !st.paused){ st.running=true; timerTick(id); }
  else if(st.running){ clearInterval(st.interval); st.interval=null; st.running=false; st.paused=true; }
  else{ st.paused=false; st.running=true; timerTick(id); }
  timerUpdateBtn(id);
}
function timerTick(id){
  var st = timerState[id];
  var prog=document.getElementById('timerProgress-'+id);
  st.interval=setInterval(function(){
    st.seconds--;
    var pct=((st.total-st.seconds)/st.total)*100;
    prog.style.width=pct+'%';
    if(st.seconds<=10 && st.seconds>0){ prog.className='timer-progress-fill warn'; }
    if(st.seconds<=0){
      clearInterval(st.interval); st.interval=null; st.running=false;
      prog.style.width='100%'; prog.className='timer-progress-fill warn';
      setTimeout(function(){
        if(!st.running && !st.paused && st.seconds<=0){ timerSelectDuration(id, st.defaultSecs); }
      },2500);
    }
    timerUpdateBtn(id);
  },1000);
}
function timerUpdateBtn(id){
  var st = timerState[id];
  var btn=document.getElementById('timerBtn-'+id);
  var icon=document.getElementById('timerBtnIcon-'+id);
  var label=document.getElementById('timerBtnLabel-'+id);
  var editBtn=document.getElementById('timerEditBtn-'+id);
  if(editBtn) editBtn.style.display = st.locked ? 'none' : 'inline-flex';
  if(st.running){
    icon.innerHTML='&#9208;';
    label.innerHTML='<span class="timer-btn-time">'+timerFormatTime(st.seconds)+'</span>';
    btn.className='timer-btn running'+(st.seconds<=10?' warn':'');
  } else if(st.paused){
    icon.innerHTML='&#9654;';
    label.innerHTML='<span class="timer-btn-time">'+timerFormatTime(st.seconds)+'</span>';
    btn.className='timer-btn paused';
  } else if(st.seconds<=0 && st.total>0){
    icon.innerHTML='&#8635;';
    label.textContent='Done';
    btn.className='timer-btn done';
  } else {
    icon.innerHTML='&#9654;';
    label.innerHTML='<span class="timer-btn-time">'+timerFormatTime(st.defaultSecs)+'</span>';
    btn.className='timer-btn';
  }
}

// ── Download the task as an image practice sheet ──
const SHEET_META = {
  b2:  {ink:'#16A88D', tint:'#E7F6F2', label:'B2 First · Speaking Part 2'},
  c1:  {ink:'#2176FF', tint:'#E8EEFF', label:'C1 Advanced · Speaking Part 2'},
  c2:  {ink:'#9B72CF', tint:'#F0E8FA', label:'C2 Proficiency · Speaking Part 2'},
  gen: {ink:'#E09A2E', tint:'#FFF5E6', label:'Picture discussion'}
};

/* split an element's html into [{text, bold}] so <strong> survives into canvas */
function richSegments(el) {
  const out = [];
  el.childNodes.forEach(n => {
    if (n.nodeType === 3) out.push({text:n.textContent, bold:false});
    else out.push({text:n.textContent, bold:n.tagName === 'STRONG' || n.tagName === 'B'});
  });
  return out;
}
function wrapRich(ctx, segs, maxW, fReg, fBold) {
  const lines = []; let line = [], x = 0;
  segs.forEach(seg => {
    const parts = seg.text.split(/(\s+)/).filter(t => t !== '');
    parts.forEach(w => {
      ctx.font = seg.bold ? fBold : fReg;
      const ww = ctx.measureText(w).width;
      if (x + ww > maxW && /\S/.test(w) && line.length) { lines.push(line); line = []; x = 0; }
      if (!/\S/.test(w) && x === 0) return;
      line.push({text:w, bold:seg.bold, x:x});
      x += ww;
    });
  });
  if (line.length) lines.push(line);
  return lines;
}
function wrapPlain(ctx, text, maxW) {
  const words = text.split(' '); const lines = []; let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines;
}
function roundRectPath(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
/* draw an image cropped to fill the box, like object-fit:cover */
function drawCover(ctx, img, x, y, w, h, r) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const scale = Math.max(w/iw, h/ih);
  const dw = iw*scale, dh = ih*scale;
  ctx.save(); roundRectPath(ctx, x, y, w, h, r); ctx.clip();
  ctx.drawImage(img, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
  ctx.restore();
}

async function downloadCardImage(cardId) {
  const btn = document.getElementById('dlBtn-' + cardId);
  const card = document.getElementById(cardId);
  if (!card) return;
  const level = cardId.split('-')[0];
  const meta = SHEET_META[level] || SHEET_META.gen;
  const label = btn ? btn.lastChild : null;
  if (btn) { btn.disabled = true; btn.classList.add('busy'); }

  try {
    const F = w => (sz => `${w} ${sz}px Outfit, sans-serif`);
    try {
      await Promise.all(['400 16px Outfit','500 16px Outfit','700 16px Outfit','800 16px Outfit']
        .map(f => document.fonts.load(f)));
      await document.fonts.ready;
    } catch (e) {}

    const imgs = Array.from(card.querySelectorAll('.img-row img'));
    await Promise.all(imgs.map(im => im.complete && im.naturalWidth
      ? Promise.resolve() : new Promise(r => { im.onload = im.onerror = r; })));

    const letters = Array.from(card.querySelectorAll('.img-row .img-label')).map(e => e.textContent.trim());
    const topic = (card.querySelector('.acc-title') || {}).textContent || '';
    const setNo = (card.querySelector('.set-badge') || {}).textContent || '';
    const title = topic.replace(setNo, '').trim();
    const qEl = card.querySelector('.task-q.phase-q.active') || card.querySelector('.task-q');
    const groups = (typeof lang !== 'undefined' && lang[level]) ? lang[level] : [];

    /* ---- layout (CSS pixels, drawn at 2x) ---- */
    const W = 900, PAD = 66, CW = W - PAD*2, S = 3;   /* 3x -> 2700px wide, ~325 DPI on A4 */
    const single = imgs.length === 1;
    const cols = single ? 1 : (imgs.length === 2 ? 2 : 3);
    const gap = 14;
    const slotW = (CW - gap*(cols-1)) / cols;
    /* single image keeps its native 3:2 so nothing is cropped; grids match the on-screen crop */
    const slotH = single ? slotW * 0.667 : (level === 'c2' ? slotW : slotW * 0.75);
    const rows = Math.ceil(imgs.length / cols);

    const probe = document.createElement('canvas').getContext('2d');
    probe.font = '500 19px Outfit, sans-serif';
    const qLines = qEl ? wrapRich(probe, richSegments(qEl), CW, '500 19px Outfit, sans-serif', '800 19px Outfit, sans-serif') : [];

    const gCols = Math.min(3, Math.max(1, groups.length));
    const gGap = 26;
    const gW = (CW - gGap*(gCols-1)) / gCols;
    probe.font = '400 14px Outfit, sans-serif';
    const gLines = groups.map(g => g.phrases.map(t => wrapPlain(probe, t, gW)));
    const gHeights = gLines.map(list => list.reduce((a, l) => a + l.length*20 + 8, 0));
    const langBodyH = groups.length ? Math.max(...gHeights) : 0;

    let H = PAD;
    H += 26 + 16;                               // header line
    H += qLines.length * 29 + 20;               // question
    H += rows*slotH + (rows-1)*gap;             // photos
    if (groups.length) H += 34 + 24 + langBodyH; // language block
    H += 26 + PAD;                              // footer

    const cv = document.createElement('canvas');
    cv.width = W*S; cv.height = Math.round(H)*S;
    const ctx = cv.getContext('2d');
    ctx.scale(S, S);
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

    let y = PAD;

    /* header: level chip + set/topic, rule underneath */
    ctx.font = '700 11px Outfit, sans-serif';
    try { ctx.letterSpacing = '1.2px'; } catch (e) {}
    const chipTxt = meta.label.toUpperCase();
    const chipW = ctx.measureText(chipTxt).width + 20;
    ctx.fillStyle = meta.tint; roundRectPath(ctx, PAD, y, chipW, 22, 6); ctx.fill();
    ctx.fillStyle = meta.ink; ctx.fillText(chipTxt, PAD + 10, y + 6);
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    ctx.font = '800 15px Outfit, sans-serif'; ctx.fillStyle = '#2D3047';
    const headRight = `${setNo.trim()}  ${title}`.trim();
    ctx.textAlign = 'right'; ctx.fillText(headRight, W - PAD, y + 4); ctx.textAlign = 'left';
    y += 22 + 14;
    ctx.strokeStyle = '#E8E5DF'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y + .5); ctx.lineTo(W - PAD, y + .5); ctx.stroke();
    y += 20;

    /* question */
    qLines.forEach(line => {
      line.forEach(tok => {
        ctx.font = tok.bold ? '800 19px Outfit, sans-serif' : '500 19px Outfit, sans-serif';
        ctx.fillStyle = '#2D3047';
        ctx.fillText(tok.text, PAD + tok.x, y);
      });
      y += 29;
    });
    y += 20;

    /* photos with letter badges */
    imgs.forEach((im, i) => {
      const cx = PAD + (i % cols) * (slotW + gap);
      const cy = y + Math.floor(i / cols) * (slotH + gap);
      drawCover(ctx, im, cx, cy, slotW, slotH, 10);
      ctx.strokeStyle = '#E8E5DF'; ctx.lineWidth = 1;
      roundRectPath(ctx, cx + .5, cy + .5, slotW - 1, slotH - 1, 10); ctx.stroke();
      const L = letters[i];
      if (L) {
        ctx.fillStyle = 'rgba(31,34,51,.62)';
        ctx.beginPath(); ctx.arc(cx + 20, cy + 20, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '700 12px Outfit, sans-serif';
        ctx.textAlign = 'center'; ctx.fillText(L, cx + 20, cy + 14); ctx.textAlign = 'left';
      }
    });
    y += rows*slotH + (rows-1)*gap;

    /* useful language, one column per function */
    if (groups.length) {
      y += 34;
      groups.slice(0, gCols).forEach((g, gi) => {
        const gx = PAD + gi*(gW + gGap);
        let gy = y;
        ctx.font = '700 10px Outfit, sans-serif';
        try { ctx.letterSpacing = '1.1px'; } catch (e) {}
        ctx.fillStyle = meta.ink; ctx.fillText(g.fn.toUpperCase(), gx, gy);
        try { ctx.letterSpacing = '0px'; } catch (e) {}
        gy += 15;
        ctx.strokeStyle = '#E8E5DF'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(gx, gy + .5); ctx.lineTo(gx + gW, gy + .5); ctx.stroke();
        gy += 9;
        ctx.font = '400 14px Outfit, sans-serif'; ctx.fillStyle = '#2D3047';
        gLines[gi].forEach(lines => {
          lines.forEach(ln => { ctx.fillText(ln, gx, gy); gy += 20; });
          gy += 8;
        });
      });
      y += 24 + langBodyH;
    }

    /* footer */
    ctx.strokeStyle = '#E8E5DF'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y + .5); ctx.lineTo(W - PAD, y + .5); ctx.stroke();
    ctx.font = '700 12px Outfit, sans-serif'; ctx.fillStyle = '#7A7D8E';
    ctx.fillText('johnplusenglish.com', PAD, y + 10);

    const slug = (setNo.trim() + '-' + title).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    /* JPEG: the sheet is ~95% photograph, so lossless PNG costs ~5x the bytes for no visible gain */
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.92));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${level}-${slug || 'task'}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return cv;
  } catch (err) {
    console.error(err);
    alert('Sorry, the image could not be created.');
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove('busy'); }
  }
}

  if (!card) return;
  if (presentState) closePresent();
  const level = id.split('-')[0];
  const overlay = ensurePresentOverlay();
  const stage = overlay.querySelector('.present-stage');
  stage.innerHTML = '';
  const moves = [];
  (PRESENT_SELECTORS[level] || PRESENT_SELECTORS.b2).forEach(sel => {
    card.querySelectorAll(sel).forEach(node => {
      const anchor = document.createComment('present-anchor');
      node.parentNode.insertBefore(anchor, node);
      moves.push({ node, anchor });
      stage.appendChild(node);
    });
  });
  const setNo = ((card.querySelector('.set-badge') || {}).textContent || '').trim();
  const fullTitle = ((card.querySelector('.acc-title') || {}).textContent || '').trim();
  const topic = fullTitle.replace(setNo, '').trim();
  overlay.querySelector('.present-topic').textContent = [setNo, topic].filter(Boolean).join(' · ');
  overlay.classList.add('open');
  document.addEventListener('keydown', presentEscHandler);
  presentState = { id, moves };
}

function closePresent() {
  if (!presentState) return;
  presentState.moves.forEach(({ node, anchor }) => {
    anchor.parentNode.insertBefore(node, anchor);
    anchor.remove();
  });
  presentState = null;
  const ov = document.getElementById('presentOverlay');
  if (ov) ov.classList.remove('open');
  document.removeEventListener('keydown', presentEscHandler);
}

const RAIL_META = {
  b2:  {sets:b2Sets,  tint:'var(--lv-b2-light)',    ink:'var(--lv-b2)',    label:'FCE Part 2 sets'},
  c1:  {sets:c1Sets,  tint:'var(--lv-c1-light)',    ink:'var(--lv-c1)',    label:'CAE Part 2 sets'},
  c2:  {sets:c2Sets,  tint:'var(--lavender-light)', ink:'var(--lavender)', label:'CPE Part 2 sets'},
  gen: {sets:genSets, tint:'var(--sand)',           ink:'var(--sun)',      label:'Free describe images'}
};
function thumbFor(photo) {
  return photo.replace('/picture-discussion/', '/picture-discussion/thumbs/');
}
function selectSet(level, i) {
  const panel = document.getElementById('panel-' + level);
  panel.querySelectorAll('.set-pane > .acc-card').forEach((c, n) => {
    c.classList.toggle('shown', n === i);
    c.classList.toggle('open', n === i);
  });
  const rows = panel.querySelectorAll('.set-row');
  rows.forEach((r, n) => r.classList.toggle('on', n === i));
  const activeRow = rows[i];
  const catGroup = activeRow && activeRow.closest('.set-rail-cat-group');
  if (catGroup) catGroup.classList.add('open');
}
function toggleRailCat(level, ci) {
  const panel = document.getElementById('panel-' + level);
  const group = panel.querySelector(`.set-rail-cat-group[data-cat="${ci}"]`);
  if (group) group.classList.toggle('open');
}
function installSetRails() {
  Object.keys(RAIL_META).forEach(level => {
    const meta = RAIL_META[level];
    const panel = document.getElementById('panel-' + level);
    const cards = Array.from(panel.children).filter(el => el.classList.contains('acc-card'));
    const pane = document.createElement('div');
    pane.className = 'set-pane';
    cards.forEach(c => {
      const head = c.querySelector('.acc-header');
      if (head) head.removeAttribute('onclick');   // the card in the pane stays open
      pane.appendChild(c);
    });
    const rail = document.createElement('aside');
    rail.className = 'set-rail';
    rail.style.setProperty('--rowtint', meta.tint);
    rail.style.setProperty('--rowink', meta.ink);
    const rowLabel = level === 'gen' ? 'Image' : 'Set';
    const rowHTML = (s, i) =>
      `<button class="set-row" type="button" onclick="selectSet('${level}',${i})">` +
        `<span class="set-thumb"><img loading="lazy" alt="" src="${thumbFor(s.photos[0])}"></span>` +
        `<span class="set-row-txt"><span class="set-row-n">${rowLabel} ${i + 1}</span>` +
        `<span class="set-row-t">${s.topic}</span></span>` +
      `</button>`;
    let rows = '';
    if (meta.sets.some(s => s.category)) {
      const cats = [];
      meta.sets.forEach((s, i) => {
        let cat = cats[cats.length - 1];
        if (!cat || cat.name !== s.category) { cat = { name: s.category, items: [] }; cats.push(cat); }
        cat.items.push(i);
      });
      rows = cats.map((cat, ci) =>
        `<div class="set-rail-cat-group${ci === 0 ? ' open' : ''}" data-cat="${ci}">` +
          `<button class="set-rail-cat-toggle" type="button" onclick="toggleRailCat('${level}',${ci})">` +
            `<span class="set-rail-cat-name">${cat.name}</span>` +
            `<span class="set-rail-cat-count">${cat.items.length}</span>` +
            `<span class="set-rail-cat-chevron">&#9662;</span>` +
          `</button>` +
          `<div class="set-rail-cat-rows">${cat.items.map(i => rowHTML(meta.sets[i], i)).join('')}</div>` +
        `</div>`
      ).join('');
    } else {
      rows = meta.sets.map((s, i) => rowHTML(s, i)).join('');
    }
    const railLabel = meta.sets.some(s => s.category) ? 'All categories' : 'All sets';
    rail.innerHTML = `<div class="set-rail-head" onclick="toggleSetRail('${level}')"><span class="set-rail-label">${railLabel}</span><button class="set-rail-toggle" type="button" aria-label="Collapse list" onclick="event.stopPropagation();toggleSetRail('${level}')"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button></div>` +
                     `<div class="set-rail-scroll">${rows}</div>` +
                     `<div class="set-rail-foot"><b>${meta.sets.length}</b> ${meta.label}</div>`;
    const picker = document.createElement('div');
    picker.className = 'set-picker';
    picker.appendChild(rail);
    picker.appendChild(pane);
    panel.appendChild(picker);
    selectSet(level, 0);
    if (railCollapsed) { rail.classList.add('collapsed'); picker.classList.add('sb-collapsed'); }
  });
}
