<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2 Grammar - johnplusenglish</title>
<meta name="description" content="B2 grammar, one lesson at a time. Work through 15 core B2 structures with clear explanations in plain English and practice that checks itself.">
<script src="lock.js"></script>
<script src="/assets/deeplink.js"></script>
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --cream:#F7F6F3; --card:#fff; --ink:#2D3047; --muted:#8A8D9A;
  --border:#E8E5DF; --line:#EFEDE7;
  --sky:#2176FF; --sky-tint:#EAF2FE;
  --sea:#1DD3B0; --sea-d:#0F7D71; --sea-tint:#E4FBF7; --sea-bd:rgba(29,211,176,.4);
  --coral:#FF6B6B; --coral-d:#C0392B; --coral-tint:#FDECEC;
  --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}
.topnav{display:none}
a{color:var(--sky);text-decoration:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:32px 24px 80px}

/* header */
.g-head{display:flex;align-items:flex-start;gap:16px;margin:0 0 8px}
.g-badge{width:52px;height:52px;border-radius:14px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--sky)}
.g-badge svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g-title{font-size:2rem;font-weight:900;letter-spacing:-.02em;margin:0;line-height:1.05}
.g-sub{font-size:1rem;color:var(--muted);margin:4px 0 0;max-width:56ch}
.g-progwrap{margin:22px 0 26px}
.g-progline{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;font-weight:600;color:var(--muted);margin:0 0 8px}
.g-progline strong{color:var(--ink)}
.g-progbar{height:8px;border-radius:5px;background:var(--border);overflow:hidden}
.g-progfill{height:100%;width:0;background:var(--sea);border-radius:5px;transition:width .4s}

/* layout */
.g-layout{display:grid;grid-template-columns:288px 1fr;gap:26px;align-items:start}
@media(max-width:860px){.g-layout{grid-template-columns:1fr}.g-road{position:static !important;max-height:none !important}}

/* roadmap sidebar */
.g-road{position:sticky;top:20px;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:8px;max-height:calc(100vh - 40px);overflow:auto}
.g-road-head{font-size:.66rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:12px 12px 8px}
.g-step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;font-family:inherit;cursor:pointer;padding:11px 12px;border-radius:10px;color:var(--ink);transition:background .15s}
.g-step:hover{background:var(--cream)}
.g-step.active{background:var(--sky-tint)}
.g-step-n{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:1.5px solid var(--border);color:var(--muted);background:var(--card)}
.g-step.active .g-step-n{border-color:var(--sky);color:var(--sky)}
.g-step.done .g-step-n{background:var(--sea);border-color:var(--sea);color:#fff}
.g-step-n svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g-step-t{font-size:.9rem;font-weight:600;line-height:1.3;min-width:0}
.g-step.active .g-step-t{color:var(--sky)}

/* lesson pane */
.g-lesson{min-width:0}
.g-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:30px 32px;margin:0 0 20px}
.g-eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);margin:0 0 6px}
.g-lesson-title{font-size:1.6rem;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;line-height:1.1}
.g-lesson-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:0 0 18px}
/* in-lesson folder tabs (matches site) */
.l-tabs{display:flex;gap:4px;position:relative;margin:6px 0 20px;align-items:flex-end;flex-wrap:wrap;padding-top:6px}
.l-tabs::before{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--border)}
.l-tab{position:relative;font-family:inherit;font-size:.92rem;font-weight:700;padding:.55rem 1.5rem;color:var(--muted);cursor:pointer;white-space:nowrap;background:color-mix(in srgb,var(--ink) 4%,transparent);border:1.5px solid var(--border);border-radius:12px 12px 0 0;transition:background .18s,color .18s}
.l-tab:hover{color:var(--ink)}
.l-tab.active{background:var(--cream);border-color:var(--sky);border-bottom:1.5px solid var(--cream);color:var(--sky);z-index:2}
.l-tab .l-tab-c{font-weight:600;opacity:.6;margin-left:7px}
.l-pane{display:none}
.l-pane.show{display:block}
/* soft circular number badges (match the roadmap) */
.g-ex-num{display:inline-flex;width:27px;height:27px;border-radius:50%;background:var(--sky);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;margin-right:12px;vertical-align:-6px;font-variant-numeric:tabular-nums}
.q-num{display:inline-flex;width:25px;height:25px;border-radius:50%;background:var(--sky-tint);color:var(--sky);align-items:center;justify-content:center;font-weight:700;font-size:.78rem;margin-right:11px;vertical-align:-5px;font-variant-numeric:tabular-nums}
.g-intro{font-size:1.05rem;font-weight:500;color:var(--ink);background:var(--sky-tint);border-radius:12px;padding:16px 20px;margin:0 0 22px}
.g-body{font-size:1rem}
.g-body p{margin:0 0 14px}
.g-body strong{font-weight:700}
.g-body em{font-style:italic;color:var(--ink)}
.g-body .rule{display:flex;gap:14px;align-items:flex-start;background:none;border:none;padding:0;margin:0 0 15px}
.g-body .rule-num{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--sea);margin-top:10px;font-size:0;color:transparent}
.g-body .rule-text{font-size:1rem;line-height:1.62}
.g-body .note{background:var(--sea-tint);border:none;border-radius:14px;padding:16px 20px;margin:20px 0 4px;font-size:.96rem;line-height:1.65}
.g-body .note strong{color:var(--sea-d)}

.g-sec-label{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:34px 0 16px}

table.g-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;margin:0 0 8px}
.g-table th{background:var(--cream);text-align:left;font-weight:700;padding:11px 14px;border-bottom:1.5px solid var(--border);font-size:.82rem}
.g-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.g-table tr:last-child td{border-bottom:none}
.g-table td:first-child{font-weight:600;color:var(--muted);white-space:nowrap}

/* In action - airy 2-column grid, no boxes, no dividers */
.g-examples{display:grid;grid-template-columns:1fr 1fr;gap:4px 34px;margin:0 0 4px}
@media(max-width:660px){.g-examples{grid-template-columns:1fr}}
.g-ex{padding:11px 0;background:none;border:none;display:block}
.g-ex-t{font-weight:800;font-size:.82rem;margin-right:10px}
.g-ex.pos .g-ex-t{color:var(--sea)}
.g-ex.neg .g-ex-t,.g-ex.q .g-ex-t{color:var(--sky)}
.g-ex-eng{font-weight:600;font-size:1rem}
.g-ex-note{font-size:.85rem;color:var(--muted);margin:3px 0 0 23px}

/* Watch out for - airy colour-coded pairs, no boxes, no dividers */
.g-errors{display:flex;flex-direction:column;gap:22px;margin:0 0 4px}
.g-err{background:none;border:none;padding:0}
.g-err-line{display:flex;gap:9px;align-items:baseline;font-size:.98rem;line-height:1.45}
.g-err-line .mk{flex:0 0 auto;font-weight:800;font-size:.9rem}
.g-err-bad{color:var(--coral-d)}.g-err-bad .mk{color:var(--coral)}
.g-err-good{color:var(--sea-d);font-weight:600;margin-top:3px}.g-err-good .mk{color:var(--sea)}
.g-err-reason{font-size:.85rem;color:var(--muted);margin:7px 0 0 23px}

.g-real{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.g-real li{position:relative;padding:0 0 0 22px;font-size:.96rem;line-height:1.55;border:none}
.g-real li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--sky)}

.g-tip{display:flex;gap:12px;background:var(--sea-tint);border:1.5px solid var(--sea-bd);border-radius:12px;padding:15px 18px;margin:22px 0 0}
.g-tip-label{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sea-d);margin:0 0 3px}
.g-tip p{margin:0;font-size:.95rem;line-height:1.55}

/* exercises */
.g-exercise{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:22px 24px;margin:0 0 16px}
.g-ex-title{font-size:1.05rem;font-weight:700;margin:0 0 2px}
.g-ex-sub{font-size:.9rem;color:var(--muted);margin:0 0 16px}
.q{padding:16px 0;border:none}
.q-text{font-size:1rem;margin:0 0 10px;line-height:1.75}
.gap-inp,.txt-inp{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:600;padding:.4rem .6rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);outline:none;transition:border-color .2s,background .2s}
.gap-inp{width:150px;text-align:center}
.txt-inp{width:100%;max-width:520px}
.gap-inp:focus,.txt-inp:focus{border-color:var(--sky)}
.gap-inp.correct,.txt-inp.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.gap-inp.wrong,.txt-inp.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0}
.opt{font-family:inherit;font-size:.95rem;font-weight:600;text-align:left;padding:.7rem 1rem;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.opt.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}
.opt.reveal{border-color:var(--sea);color:var(--sea-d)}
.opt:disabled{cursor:default}
.q-fb{font-size:.88rem;margin-top:8px;padding:8px 12px;border-radius:8px;display:none}
.q-fb.show{display:block}
.q-fb.ok{background:var(--sea-tint);color:var(--sea-d)}
.q-fb.no{background:var(--coral-tint);color:var(--coral-d)}
.q-fb.hint{background:var(--cream);color:var(--muted)}
.chk-btn{font-family:inherit;font-weight:700;font-size:.88rem;color:#fff;background:var(--sky);border:none;border-radius:10px;padding:.6rem 1.3rem;cursor:pointer;margin-top:14px;transition:background .15s}
.chk-btn:hover{background:#175fd0}
.chk-link{font-family:inherit;font-weight:600;font-size:.82rem;color:var(--muted);background:none;border:none;cursor:pointer;margin-left:12px}
.chk-link:hover{color:var(--coral)}
.ex-score{font-size:.85rem;font-weight:700;color:var(--sea-d);margin-left:12px;display:none}
.ex-score.show{display:inline}

/* builder */
.build-target{min-height:44px;border:1.5px dashed var(--border);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;background:var(--cream)}
.build-bank{display:flex;flex-wrap:wrap;gap:6px}
.word-chip{font-family:inherit;font-size:.9rem;font-weight:600;padding:.35rem .7rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.word-chip:hover{border-color:var(--ink)}
.word-chip.used{opacity:.35;pointer-events:none}
.build-target .word-chip{background:var(--sky-tint);border-color:var(--sky)}

/* categorise */
.cat-cols{display:grid;gap:12px;margin:0 0 12px}
.cat-col{border:1.5px solid var(--border);border-radius:12px;padding:12px;min-height:70px;background:var(--card)}
.cat-col-h{font-size:.8rem;font-weight:700;color:var(--ink);margin:0 0 8px}
.cat-drop{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.cat-bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cat-item{font-family:inherit;font-size:.9rem;font-weight:600;padding:.4rem .8rem;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
.cat-item.sel{border-color:var(--sky);background:var(--sky-tint);color:var(--sky)}
.cat-item.placed{background:var(--cream)}
.cat-item.correct{border-color:var(--sea);background:var(--sea-tint);color:var(--sea-d)}
.cat-item.wrong{border-color:var(--coral);background:var(--coral-tint);color:var(--coral-d)}

/* convo */
.convo-line{display:flex;gap:10px;padding:8px 0;font-size:.98rem;line-height:1.8}
.convo-sp{font-weight:800;color:var(--sky);flex:0 0 auto;width:22px}

/* footer nav */
.g-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 0}
.g-complete{font-family:inherit;font-weight:700;font-size:.92rem;color:#fff;background:var(--sea);border:none;border-radius:12px;padding:.75rem 1.5rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.g-complete:hover{background:var(--sea-d)}
.g-complete.done{background:var(--sea-tint);color:var(--sea-d);border:1.5px solid var(--sea-bd)}
.g-complete svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next{font-family:inherit;font-weight:700;font-size:.92rem;color:var(--ink);background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:.75rem 1.4rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s}
.g-next:hover{border-color:var(--ink)}
.g-next svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.g-next[disabled]{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

/* ── PNG export ── */
.g-export-btn{background:none;border:1.5px solid var(--border);border-radius:9px;padding:.34rem .5rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;flex:0 0 auto;font-family:inherit}
.g-export-btn:hover{border-color:var(--sky);color:var(--sky)}
.g-export-btn:disabled{opacity:.55;cursor:default;border-color:var(--border);color:var(--muted)}
.g-export-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.png-export-card{width:800px;box-sizing:border-box;background:var(--cream);padding:38px;font-family:'Outfit',sans-serif;color:var(--ink)}
.pec-inner{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:34px 36px 26px}
.pec-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);margin:0 0 10px}
.pec-title{font-size:1.7rem;font-weight:900;letter-spacing:-.01em;margin:0;line-height:1.12}
.pec-sub{font-size:1rem;color:var(--muted);font-style:italic;margin:5px 0 0}
.pec-body{margin-top:22px}
.pec-body>.g-body>*:first-child{margin-top:0}
.pec-body .g-sec-label:first-child{margin-top:6px}
.pec-foot{margin-top:28px;padding-top:16px;border-top:1.5px solid var(--border);font-size:.75rem;font-weight:600;color:var(--muted)}
.pec-foot b{color:var(--sky);font-weight:800}
</style>
</head>

<script>const LESSONS=[{"id":"pps_ppc","title":"Present perfect: simple vs continuous","subtitle":"I've written three reports / I've been writing all day","intro":"One tense family, two jobs: one form points at the result, the other at the activity itself.","desc":"At B1 you learnt each form separately. At B2 the skill is choosing between them fluently - the contrast reveals a lot about what the speaker wants to emphasise.","tip":"Here's the test I give my students: <strong>can you count it or point to a finished result?<\/strong> If yes, go simple - <em>\"I've written three emails\"<\/em> (a countable result). If it's the ongoing activity with no fixed quantity, go continuous - <em>\"I've been writing emails.\"<\/em> And remember, state verbs (know, love, believe) stay simple in either tense.","explanation":"<p>Both tenses connect the past to the present, but they differ in focus and emphasis.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Present perfect simple<\/strong> - focuses on the <em>result or completion<\/em> of an action. <em>\"I've finished the report.\"<\/em> (It's done.) / <em>\"She's written five novels.\"<\/em> (Countable achievement.) / <em>\"I've been to Paris.\"<\/em> (Life experience - a fact.)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Present perfect continuous<\/strong> - focuses on the <em>activity and duration<\/em>, often still ongoing or just finished. <em>\"I've been working on the report.\"<\/em> (Activity emphasis.) / <em>\"She's been writing all morning.\"<\/em> (Duration, possibly still happening.) / <em>\"You look tired - have you been running?\"<\/em> (Visible present result of recent activity.)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Adverbs as clues:<\/strong> <em>just, already, yet, ever, never<\/em> → simple. <em>all day/week/morning, for hours, lately, recently<\/em> → often continuous. <em>For/since<\/em> → both possible, with different nuances.<\/div><\/div>\n<div class=\"note\"><strong>The ambiguous cases:<\/strong><br>\n<em>\"I've worked here for ten years.\"<\/em> - simple: emphasis on the fact/duration as a completed state.<br>\n<em>\"I've been working here for ten years.\"<\/em> - continuous: emphasis on the ongoing activity.<br>\nBoth are correct. The continuous feels more dynamic and conversational; the simple more formal and factual.<br>\n<strong>State verbs (know, love, own, believe, understand)<\/strong> never use continuous: <em>\"I've known her for years.\"<\/em> - never <em>\"I've been knowing.\"<\/em><\/div>","table":{"headers":["","Present perfect simple","Present perfect continuous"],"rows":[["Focus","Result, completion, fact","Activity, duration, ongoing process"],["Form","have/has + past participle","have/has + been + verb-ing"],["Typical adverbs","just, already, yet, ever, never, three times","all day, for hours, lately, recently, all morning"],["With for/since","Duration as a fact","Duration as ongoing activity"],["State verbs","✓ I've known her for years","✗ I've been knowing her"],["Countable results","✓ She's written five books","✗ She's been writing five books"]]},"examples":[{"type":"pos","eng":"I've sent twenty emails today.","note":"Countable result → simple."},{"type":"pos","eng":"I've been sending emails all morning.","note":"Activity duration → continuous."},{"type":"pos","eng":"She's lived in Madrid since 2015.","note":"Ongoing state as fact → simple is natural."},{"type":"pos","eng":"She's been living in Madrid since 2015.","note":"Ongoing activity → continuous emphasises the process."}],"errors":[{"bad":"I've been knowing her for years.","good":"I've known her for years.","reason":"Know is a state verb - no continuous form in any tense."},{"bad":"She's been writing three novels.","good":"She's written three novels.","reason":"Countable completed result → simple. Continuous doesn't quantify."},{"bad":"Have you been ever to Tokyo?","good":"Have you ever been to Tokyo?","reason":"Ever always comes between have and the past participle."}],"realUse":[],"exercises":[{"type":"gap","title":"Simple or continuous?","sub":"Fill each gap with the present perfect simple or continuous form of the verb in brackets.","items":[{"answer":"have been waiting","before":"I ","after":" for over an hour. Where have you been? (wait - activity)"},{"answer":"has written","before":"She ","after":" four bestsellers. (write - countable result)"},{"answer":"have been thinking","before":"I ","after":" about your proposal all week. (think - ongoing)"},{"answer":"has already finished","before":"He ","after":" the project. Here's the report. (finish - completed)"},{"answer":"have known","before":"We ","after":" each other since university. (know - state verb)"},{"answer":"has been raining","before":"It ","after":" all day - the streets are flooded. (rain - ongoing)"},{"answer":"have visited","before":"I ","after":" Japan three times. (visit - life experience)"},{"answer":"have been working","before":"They ","after":" on this problem for months. (work - ongoing activity)"}]},{"type":"mc","title":"Which form - and why?","sub":"Choose the correct form. The reason matters.","items":[{"q":"You look exhausted. What _____?","opts":["have you done","have you been doing","did you do","do you do"],"answer":"have you been doing","explanation":"Visible present result of recent activity - continuous for the activity that caused the tiredness."},{"q":"She _____ three languages since childhood.","opts":["has been speaking","has spoken","spoke","is speaking"],"answer":"has spoken","explanation":"Speak here = acquired ability/fact about her life. Simple for life facts."},{"q":"I _____ to finish this chapter.","opts":["tried","have tried","have been trying","was trying"],"answer":"have been trying","explanation":"Ongoing effort, still in progress - continuous."},{"q":"He _____ the same mistake five times today.","opts":["has been making","has made","is making","was making"],"answer":"has made","explanation":"Five times = countable result → simple."}]},{"type":"tf","title":"True, False, or Not given","sub":"Based on the sentence, is the statement true, false, or not given?","items":[{"context":"I've been reading this book for three weeks.","statement":"The speaker has finished the book.","answer":"Not given","explanation":"Continuous = ongoing activity. We don't know if they've finished."},{"context":"She's read the report.","statement":"The report has been completed.","answer":"True","explanation":"Simple = completed action. The report is done."},{"context":"They've been building the new bridge for two years.","statement":"The bridge is finished.","answer":"False","explanation":"Continuous = still in progress. Been building suggests it's ongoing."},{"context":"I've known him since school.","statement":"This sentence would be wrong with 'been knowing'.","answer":"True","explanation":"Know = state verb. State verbs never use the continuous form."}]}]},{"id":"pastperfcont","title":"Past perfect continuous","subtitle":"I had been working, she had been waiting","intro":"The activity that had been running in the background before another past event stepped in.","desc":"The past perfect continuous combines the logic of the past perfect (before a past moment) with the logic of the continuous (emphasis on activity and duration). It is the tense of background explanation.","tip":"I teach this as simply the past version of the present perfect continuous. If <em>\"I've been working all day and I'm exhausted\"<\/em> feels right now, then <em>\"I had been working all day and I was exhausted\"<\/em> follows the exact same logic in the past. The continuous sets the scene; the simple delivers the event.","explanation":"<p>The past perfect continuous is formed with <strong>had been + verb-ing<\/strong>. It describes an activity that was in progress <strong>before a specific past moment<\/strong> - emphasising the duration or ongoing nature of that activity.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Duration before a past event<\/strong> - how long something had been happening before something else occurred. <em>\"She had been studying for six hours when she finally took a break.\"<\/em> / <em>\"By the time he arrived, we had been waiting for two hours.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Explanation for a past state<\/strong> - the activity explains why something was the way it was. <em>\"He was exhausted because he had been working all night.\"<\/em> / <em>\"Her eyes were red because she had been crying.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Interrupted past activity<\/strong> - something was in progress when a past event cut it off. <em>\"She had been writing the report when the power went out.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Past perfect simple vs continuous:<\/strong><br>\n<em>\"He had read the report.\"<\/em> - simple: completed before a past moment. Focus on result.<br>\n<em>\"He had been reading the report.\"<\/em> - continuous: activity in progress before a past moment. Focus on duration/process.<br>\n<strong>State verbs don't use this form:<\/strong> <em>\"She had known him for years.\"<\/em> - never <em>\"She had been knowing.\"<\/em><br>\n<strong>For/since with this tense:<\/strong> <em>\"He had been waiting for two hours.\"<\/em> / <em>\"She had been living there since 2010.\"<\/em><\/div>","table":{"headers":["Form","Example","Note"],"rows":[["had been + verb-ing","I had been working all night.","All subjects - no exceptions"],["Negative","She hadn't been sleeping well."," - "],["Question","Had they been waiting long?"," - "],["With for","He had been waiting for an hour.","Duration before the past event"],["With since","She had been living there since 2015.","Starting point before the past event"],["State verbs","She had known him for years. ✓","Had been knowing ✗ - never"]]},"examples":[{"type":"pos","eng":"She was exhausted because she had been working non-stop for twelve hours.","note":"Activity explains a past state."},{"type":"pos","eng":"By the time the doctor arrived, he had been waiting for over an hour.","note":"Duration before a past moment - by the time + past perfect."},{"type":"pos","eng":"The road was wet - it had been raining.","note":"Visible past evidence explained by a previous activity."},{"type":"pos","eng":"She had been living in Paris for three years when she got the job offer.","note":"Ongoing situation before a past event."}],"errors":[{"bad":"She had been known him for years.","good":"She had known him for years.","reason":"Know = state verb - past perfect simple, not continuous."},{"bad":"By the time he arrived, I was waiting for two hours.","good":"By the time he arrived, I had been waiting for two hours.","reason":"Duration before a past moment - past perfect continuous needed."},{"bad":"He was tired because he worked all night.","good":"He was tired because he had been working all night.","reason":"The working happened before being tired - needs past perfect. Continuous for the ongoing activity."}],"realUse":[],"exercises":[{"type":"gap","title":"Past perfect continuous - form","sub":"Fill each gap with the past perfect continuous form of the verb in brackets.","items":[{"answer":"had been waiting","before":"By the time she arrived, I ","after":" for over an hour. (wait)"},{"answer":"had been working","before":"He was exhausted because he ","after":" all night. (work)"},{"answer":"had been raining","before":"The streets were wet - it ","after":" all day. (rain)"},{"answer":"had been studying","before":"She ","after":" for six hours when she finally took a break. (study)"},{"answer":"hadn't been sleeping","before":"He looked terrible - he ","after":" well. (not sleep)"},{"answer":"had been living","before":"They ","after":" in Rome for three years when the opportunity arose. (live)"},{"answer":"had been arguing","before":"It was clear from their faces that they ","after":". (argue)"},{"answer":"had been trying","before":"She ","after":" to reach him all morning before he finally answered. (try)"}]},{"type":"mc","title":"Which past tense?","sub":"Choose the correct form.","items":[{"q":"She was nervous because she _____ in public before.","opts":["never spoke","had never spoken","had never been speaking","never had spoken"],"answer":"had never spoken","explanation":"First-time experience before a past moment - past perfect simple (never + state/result)."},{"q":"By the time the ambulance arrived, he _____ for twenty minutes.","opts":["was bleeding","had bled","had been bleeding","bled"],"answer":"had been bleeding","explanation":"Duration of ongoing activity before a past moment → past perfect continuous."},{"q":"The meeting was tense - clearly they _____ before we arrived.","opts":["argued","have been arguing","had been arguing","had argued"],"answer":"had been arguing","explanation":"Ongoing activity that explains the atmosphere when we arrived - past perfect continuous."},{"q":"By 2020, she _____ the company for fifteen years.","opts":["ran","has run","had been running","had been run"],"answer":"had been running","explanation":"Duration of an ongoing activity up to a past point - past perfect continuous."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using the keyword.","items":[{"original":"He started working at midnight. He stopped at 8am. He was very tired.","keyword":"had been","answer":"He was very tired because he had been working all night."},{"original":"She started waiting at 2pm. He arrived at 4pm.","keyword":"had been waiting","answer":"She had been waiting for two hours when he arrived."},{"original":"They started arguing before we got there.","keyword":"had been","answer":"They had been arguing before we got there."},{"original":"It rained all night. That's why the road was flooded.","keyword":"had been","answer":"The road was flooded because it had been raining all night."},{"original":"She started living in Madrid in 2015. She left in 2020.","keyword":"had been living","answer":"She had been living in Madrid for five years when she left."}]}]},{"id":"futureforms","title":"Future forms: contrast","subtitle":"will, going to, present continuous, future perfect","intro":"Six ways to talk about the future - and your choice signals meaning, not just timing.","desc":"At B2, students need to move beyond will vs going to and command the full range of future forms, including the future perfect and future continuous - both common in formal and academic writing.","tip":"The B2 habit I most want to break is leaning on <em>will<\/em> for everything. Each form has its own job. In real speech, <em>\"I'm meeting her tomorrow\"<\/em> (an arranged plan, a diary entry) sounds far more natural than <em>\"I will meet her tomorrow.\"<\/em> The form you pick tells your listener whether the future is planned, predicted, spontaneous, or already finished by a deadline.","explanation":"<p>English has multiple future forms, each with a distinct communicative function. Choosing the right one is a key B2 skill.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Will + base verb<\/strong> - spontaneous decisions, promises, general predictions, offers. <em>\"I'll call you back.\"<\/em> / <em>\"I think it will be fine.\"<\/em> / <em>\"I'll help you with that.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Going to + base verb<\/strong> - pre-decided plans/intentions, predictions from present evidence. <em>\"I'm going to quit.\"<\/em> (decided before) / <em>\"Look - it's going to rain!\"<\/em> (evidence visible)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Present continuous<\/strong> - fixed arrangements, diary plans (usually with another person involved). <em>\"I'm meeting the client at 3.\"<\/em> / <em>\"They're getting married in June.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Present simple<\/strong> - timetabled, scheduled events (transport, programmes). <em>\"The train leaves at 6.\"<\/em> / <em>\"The match starts at 8pm.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">5<\/div><div class=\"rule-text\"><strong>Future continuous (will be + -ing)<\/strong> - activity in progress at a future moment, or polite enquiry. <em>\"At this time tomorrow I'll be sitting on a beach.\"<\/em> / <em>\"Will you be using the car tonight?\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">6<\/div><div class=\"rule-text\"><strong>Future perfect (will have + past participle)<\/strong> - action completed before a future point. <em>\"By Friday, I will have finished the report.\"<\/em> / <em>\"By 2030, the technology will have changed completely.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Future perfect vs future continuous:<\/strong><br>\n<em>\"I'll be working at 6pm.\"<\/em> - in progress at 6pm (continuous).<br>\n<em>\"I'll have finished by 6pm.\"<\/em> - completed before 6pm (perfect).<br>\n<strong>After time conjunctions<\/strong> (when, before, after, as soon as, until) - always present simple or present perfect for future meaning: <em>\"I'll call you when I arrive.\"<\/em> / <em>\"I'll email you once I've checked.\"<\/em><\/div>","table":{"headers":["Form","Structure","Main use"],"rows":[["Will","will + base verb","Spontaneous decisions, promises, predictions, offers"],["Going to","am/is/are + going to + base verb","Pre-decided plans, evidence-based predictions"],["Present continuous","am/is/are + verb-ing","Fixed arrangements, diary plans"],["Present simple","base verb (+ -s)","Timetabled events, schedules"],["Future continuous","will be + verb-ing","Activity in progress at a future moment; polite enquiry"],["Future perfect","will have + past participle","Action completed before a future point"]]},"examples":[{"type":"pos","eng":"By the time she retires, she will have worked here for forty years.","note":"Future perfect - completed before a future moment."},{"type":"pos","eng":"This time next week, I'll be lying on a beach.","note":"Future continuous - in progress at a future time."},{"type":"pos","eng":"The conference starts at 9 and finishes at 5.","note":"Present simple - scheduled event."},{"type":"pos","eng":"I'm having lunch with the CEO tomorrow.","note":"Present continuous - fixed arrangement."}],"errors":[{"bad":"I'll meet her tomorrow at three - it's in my diary.","good":"I'm meeting her tomorrow at three - it's in my diary.","reason":"Fixed diary arrangement with another person → present continuous is more natural."},{"bad":"The train will leave at 8:15.","good":"The train leaves at 8:15.","reason":"Timetabled transport → present simple."},{"bad":"By next year, I will finish the course.","good":"By next year, I will have finished the course.","reason":"Completed before a future point → future perfect."}],"realUse":[],"exercises":[{"type":"gap","title":"Choose the correct future form","sub":"Fill each gap with the most appropriate future form of the verb in brackets.","items":[{"answer":"will have finished","before":"By Friday, I ","after":" the report. (finish - completed before Friday)"},{"answer":"'m meeting","before":"I ","after":" the director at noon tomorrow. It's in my diary. (meet - arrangement)"},{"answer":"leaves","before":"The last train ","after":" at 11:47. (leave - timetable)"},{"answer":"'ll be lying","before":"This time next week, I ","after":" on a beach. (lie - in progress at future moment)"},{"answer":"'m going to resign","before":"I've made my decision - I ","after":". (resign - pre-decided)"},{"answer":"will have been","before":"By 2030, this company ","after":" in business for a century. (be - completed by future point)"},{"answer":"'ll get","before":"'There's no milk.' 'OK, I ","after":" some.' (get - spontaneous decision)"},{"answer":"will be working","before":"Don't call at 6 - I ","after":" on the presentation. (work - in progress at that time)"}]},{"type":"mc","title":"Which future form is most natural?","sub":"Choose the most appropriate option.","items":[{"q":"I've decided - I _____ vegetarian. (pre-decided)","opts":["will go","go","'m going to go","'m going"],"answer":"'m going to go","explanation":"Pre-decided intention → going to."},{"q":"The film _____ at 8:30 and _____ at 10:45.","opts":["will start / will finish","starts / finishes","is starting / is finishing","started / finished"],"answer":"starts / finishes","explanation":"Film timetable → present simple for both."},{"q":"_____ you _____ the office tomorrow? (polite enquiry)","opts":["Will / visit","Are / visiting","Do / visit","Will / be visiting"],"answer":"Will / be visiting","explanation":"Polite enquiry about plans → future continuous."},{"q":"By the time she graduates, she _____ here for six years.","opts":["will study","is studying","will have been studying","has been studying"],"answer":"will have been studying","explanation":"Duration completed before a future point → future perfect continuous."}]},{"type":"categorise","title":"Which future form?","sub":"Click each sentence, then click the correct column.","categories":[{"name":"Will","items":["I'll have the salad, please.","It will probably rain later.","I'll help you move the furniture."]},{"name":"Going to","items":["She's going to have a baby.","Look out - you're going to fall!","I've decided - I'm going to apply."]},{"name":"Present continuous","items":["I'm having dinner with clients tonight.","They're getting married in the spring.","We're flying to Madrid on Thursday."]},{"name":"Future perfect","items":["By June, she will have completed the course.","They will have left by the time you arrive.","By 2050, temperatures will have risen significantly."]}]}]},{"id":"passiveadv","title":"Passive - advanced forms","subtitle":"it is believed, he is thought to, having been told","intro":"Beyond the basic passive - reporting structures, passive infinitives and the more advanced forms.","desc":"At B1 you learnt the core tense forms of the passive. At B2 the challenge is the more complex constructions: passive infinitives, passive reporting verbs, and the passive in subordinate clauses. These appear constantly in formal writing and news.","tip":"The passive with reporting verbs is one of the most useful patterns I can hand you at B2. <strong>\"It is believed that climate change is accelerating\"<\/strong> and <strong>\"Climate change is believed to be accelerating\"<\/strong> are both correct, both passive, and both fill academic and news writing. Get comfortable producing both and you've hit a genuine B2 target.","explanation":"<p>At B2, the passive extends beyond basic tense forms to include complex constructions used in formal registers.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Passive with reporting verbs<\/strong> - distancing the speaker from a claim. Two parallel structures:<br>\n<em>It + passive reporting verb + that clause:<\/em> <em>\"It is believed that the economy will recover.\"<\/em><br>\n<em>Subject + passive reporting verb + infinitive:<\/em> <em>\"The economy is believed to be recovering.\"<\/em><br>\nCommon verbs: <em>believe, say, think, consider, report, claim, allege, expect, know, understand.<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Passive infinitives<\/strong> - the infinitive in its passive form. <em>to be done, to have been done.<\/em><br>\n<em>\"The contract needs to be signed.\"<\/em> / <em>\"She expected to be promoted.\"<\/em> / <em>\"The work appears to have been completed.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Having been + past participle<\/strong> - passive participle clause for a completed action before the main verb. <em>\"Having been warned about the risks, she proceeded carefully.\"<\/em> / <em>\"Having been rejected twice, he almost gave up.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Get passive<\/strong> - informal passive, often for accidents or unexpected events. <em>\"She got promoted.\"<\/em> / <em>\"He got arrested.\"<\/em> / <em>\"The car got damaged in the storm.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Tense in passive reporting structures:<\/strong><br>\nPresent infinitive = happening now or generally true: <em>\"He is said to live in Paris.\"<\/em><br>\nPerfect infinitive = happened before the reporting: <em>\"He is said to have lived in Paris.\"<\/em><br>\n<strong>Impersonal passive<\/strong> is standard in academic writing to avoid personal statements: instead of <em>\"I think...\"<\/em>, use <em>\"It is thought that...\"<\/em> or <em>\"It has been argued that...\"<\/em><\/div>","table":{"headers":["Structure","Example","Register"],"rows":[["It + passive reporting + that","It is believed that inflation will fall.","Formal/journalistic"],["Subject + passive reporting + infinitive","Inflation is believed to be falling.","Formal/journalistic"],["Passive infinitive (to be done)","The report needs to be submitted.","Neutral/formal"],["Passive perfect infinitive (to have been done)","The work appears to have been completed.","Formal"],["Having been + pp (participle clause)","Having been told the news, she wept.","Formal/literary"],["Get passive","She got promoted last month.","Informal/spoken"]]},"examples":[{"type":"pos","eng":"It is widely believed that artificial intelligence will transform the economy.","note":"Impersonal passive reporting - formal distancing."},{"type":"pos","eng":"Artificial intelligence is widely believed to be transforming the economy.","note":"Subject as focus - same meaning, alternative structure."},{"type":"pos","eng":"The report needs to be reviewed before submission.","note":"Passive infinitive - no agent needed."},{"type":"pos","eng":"Having been awarded the prize, she gave a short speech.","note":"Having been + pp - completed action before the main event."}],"errors":[{"bad":"The economy is believed that it will recover.","good":"The economy is believed to recover.","reason":"Subject + passive reporting verb + infinitive - no that clause after the subject form."},{"bad":"Having been rejecting the offer, she sought alternatives.","good":"Having been rejected, she sought alternatives.","reason":"Having been + past participle - not -ing form of the action verb."},{"bad":"She is said living in France.","good":"She is said to live in France.","reason":"Passive reporting verb + to + infinitive."}],"realUse":[],"exercises":[{"type":"gap","title":"Passive reporting structures","sub":"Rewrite using the structure indicated in brackets.","items":[{"answer":"It is believed that the company will be sold.","before":"People believe the company will be sold. → ","after":"(It + passive reporting)"},{"answer":"The company is believed to be for sale.","before":"People believe the company is for sale. → ","after":"(Subject + passive reporting + infinitive)"},{"answer":"It is reported that three people were injured.","before":"Reports say three people were injured. → ","after":"(It + passive reporting)"},{"answer":"The prime minister is expected to resign.","before":"People expect the prime minister to resign. → ","after":"(Subject + passive reporting + infinitive)"},{"answer":"It is thought that inflation will fall next year.","before":"Economists think inflation will fall next year. → ","after":"(It + passive reporting)"},{"answer":"The suspect is alleged to have fled the country.","before":"Police allege the suspect fled the country. → ","after":"(Subject + passive reporting + perfect infinitive)"}]},{"type":"mc","title":"Choose the correct form","sub":"Choose the correct passive structure.","items":[{"q":"_____ that negotiations are continuing.","opts":["It is understood","It understands","They understand","Understanding is"],"answer":"It is understood","explanation":"Impersonal passive reporting structure: It + passive verb + that."},{"q":"The decision _____ by the end of the week.","opts":["is expected making","is expected to be made","expects to make","is expected made"],"answer":"is expected to be made","explanation":"Subject + passive reporting + passive infinitive: is expected to be made."},{"q":"_____ the promotion, she celebrated with her team.","opts":["Having offered","Having been offered","Being offered","Being given"],"answer":"Having been offered","explanation":"Completed passive action before the main event → having been + past participle."},{"q":"The building _____ to date from the 14th century.","opts":["is believed","is believing","believes","has believed"],"answer":"is believed","explanation":"Subject + is believed + to infinitive - passive reporting."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using the keyword.","items":[{"original":"People say he committed the crime.","keyword":"alleged","answer":"He is alleged to have committed the crime."},{"original":"Experts believe climate change is accelerating.","keyword":"It is","answer":"It is believed that climate change is accelerating."},{"original":"The work was completed before she could check it.","keyword":"Having been","answer":"Having been completed, the work was submitted without her approval."},{"original":"They expect the project to be finished by June.","keyword":"is expected","answer":"The project is expected to be finished by June."},{"original":"She was told the news and immediately called her family.","keyword":"Having been","answer":"Having been told the news, she immediately called her family."}]}]},{"id":"thirdmixed","title":"Conditionals: third & mixed","subtitle":"If I had known, I would have called / I would be","intro":"Past regret, and the intriguing mix where a different past would have reshaped the present.","desc":"At B1 you learnt the second conditional (hypothetical present/future). At B2, the third conditional adds regret about the past, and mixed conditionals blend time frames - past condition with present result, or present condition with past result.","tip":"I think of the third conditional as the grammar of hindsight - every <em>\"If only I had...\"<\/em> and <em>\"I should have...\"<\/em> is really this structure in disguise. The mixed conditional then adds the twist I love: how would <em>now<\/em> be different if the <em>past<\/em> had gone another way? Hold the two timeframes in your head at once and it clicks.","explanation":"<p>Third and mixed conditionals extend the conditional system into the past and across time frames.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Third conditional<\/strong> - imaginary past. Something didn't happen; this is the regret or speculation about what would have been different. If + past perfect, would have + past participle.<br><em>\"If I had studied harder, I would have passed.\"<\/em> (I didn't study - I didn't pass.) <em>\"If she had called, I would have come.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Mixed conditional - past → present<\/strong> - a past condition with a present result. The past was different; that difference affects the present. If + past perfect, would + base verb.<br><em>\"If I had taken that job, I would be living in Tokyo now.\"<\/em> (I didn't take the job - I'm not in Tokyo.)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Mixed conditional - present → past<\/strong> - a present state explains a past result. If + past simple, would have + past participle.<br><em>\"If she were more careful, she wouldn't have made that mistake.\"<\/em> (She isn't careful - that's why she made the mistake.)<\/div><\/div>\n<div class=\"note\"><strong>Formal inversion in conditionals:<\/strong> In formal/written English, the <em>if<\/em> can be omitted and the auxiliary inverted.<br>\n<em>\"Had I known, I would have called.\"<\/em> = <em>\"If I had known...\"<\/em><br>\n<em>\"Were she to resign, the company would struggle.\"<\/em> = <em>\"If she were to resign...\"<\/em><br>\n<em>\"Should you need assistance, do not hesitate to contact us.\"<\/em> = <em>\"If you should need...\"<\/em><br>\nThis inversion is a key B2/C1 feature - common in formal letters and academic writing.<\/div>","table":{"headers":["Type","If clause","Result clause","Time frame"],"rows":[["Third conditional","past perfect","would have + pp","Past → past (both unreal)"],["Mixed 1: past → present","past perfect","would + base verb","Past unreal condition, present result"],["Mixed 2: present → past","past simple (were/didn't)","would have + pp","Present unreal state, past result"],["Formal inversion (3rd)","Had I known...","I would have called.","Formal/literary"],["Formal inversion (mixed)","Were she more careful...","she wouldn't have made that mistake.","Formal/literary"]]},"examples":[{"type":"pos","eng":"If I had taken that job, I would have been living in New York for five years by now.","note":"Third conditional - imaginary past leading to an imaginary present state."},{"type":"pos","eng":"If I had studied medicine, I would be a doctor now.","note":"Mixed conditional - past decision affecting present reality."},{"type":"pos","eng":"If she were more organised, she wouldn't have missed the deadline.","note":"Mixed conditional - present characteristic explaining a past result."},{"type":"pos","eng":"Had we known about the problem earlier, we could have avoided the crisis.","note":"Formal inversion - had + subject + past participle."}],"errors":[{"bad":"If I would have known, I would have called you.","good":"If I had known, I would have called you.","reason":"Third conditional: if + past perfect - never would have in the if clause."},{"bad":"If she studied more, she would have passed the exam.","good":"If she had studied more, she would have passed the exam.","reason":"Past unreal → past perfect in the if clause (third conditional)."},{"bad":"Had I known, I would called you.","good":"Had I known, I would have called you.","reason":"Formal inversion: would have + past participle in the result clause."}],"realUse":[],"exercises":[{"type":"gap","title":"Third and mixed conditionals","sub":"Fill each gap with the correct conditional form.","items":[{"answer":"had studied","before":"If I ","after":" harder, I would have passed the exam. (third conditional)"},{"answer":"would be","before":"If she had taken the job, she ","after":" living in Tokyo now. (mixed - past → present)"},{"answer":"wouldn't have made","before":"If he were more careful, he ","after":" that mistake. (mixed - present → past)"},{"answer":"would have come","before":"If you had called, I ","after":" immediately. (third conditional)"},{"answer":"had invested","before":"If they ","after":" earlier, they would be in a stronger position now. (mixed)"},{"answer":"would have been","before":"If we hadn't moved, our children ","after":" educated in a different system. (third)"}]},{"type":"mc","title":"Which conditional?","sub":"Choose the correct form.","items":[{"q":"If she _____ the interview better, she would have got the job.","opts":["prepared","had prepared","would prepare","would have prepared"],"answer":"had prepared","explanation":"Third conditional - past unreal: past perfect in if clause."},{"q":"If I _____ taller, I would have become a basketball player.","opts":["am","were","had been","would be"],"answer":"had been","explanation":"Mixed - present state (I'm not tall) linked to past result → past perfect in if clause."},{"q":"If he _____ more careful, he wouldn't have crashed the car.","opts":["is","was","were","had been"],"answer":"were","explanation":"Present characteristic explaining a past result → past simple (were) in if clause."},{"q":"_____ I known about the problem, I would have dealt with it immediately.","opts":["Should","Had","If","Were"],"answer":"Had","explanation":"Formal inversion of third conditional: Had + subject + past participle."}]},{"type":"builder","title":"Sentence builder","sub":"Put the words in the correct order.","items":[{"words":["if","she","had","taken","the","job","she","would","be","in","Paris","now"],"answer":"if she had taken the job she would be in Paris now","context":"Mixed conditional - past decision, present result."},{"words":["had","we","known","earlier","we","could","have","avoided","the","crisis"],"answer":"had we known earlier we could have avoided the crisis","context":"Formal inversion of third conditional."},{"words":["if","he","were","more","confident","he","wouldn't","have","made","that","mistake"],"answer":"if he were more confident he wouldn't have made that mistake","context":"Mixed - present state, past consequence."},{"words":["if","I","hadn't","met","her","my","life","would","be","very","different"],"answer":"if I hadn't met her my life would be very different","context":"Mixed - past event, present result."}]}]},{"id":"modalpast","title":"Modal verbs: past forms","subtitle":"should have, needn't have, could have, must have","intro":"Past obligation, possibility, necessity and deduction - all through the modal perfects.","desc":"Modal perfects are one of the most distinctively English grammatical features - they pack a huge amount of meaning into a compact structure. Every modal verb can combine with <em>have + past participle<\/em> to create a past meaning, and each combination carries a specific nuance.","tip":"Here are the four modal perfects I drill and the feeling behind each: <strong>should have<\/strong> (you were meant to but didn't - reproach), <strong>needn't have<\/strong> (you did something that turned out unnecessary - mild waste), <strong>could have<\/strong> (it was possible but never happened - a missed chance), <strong>must have<\/strong> (a near-certain guess about the past from evidence). Those shades of meaning are exactly what lift you from B1 to B2.","explanation":"<p>Modal verbs + have + past participle express past meanings: obligation, possibility, necessity, and deduction.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Should have + pp<\/strong> - something that was the right thing to do but wasn't done (or was done when it shouldn't have been). Implies reproach or regret. <em>\"You should have called - I was worried.\"<\/em> / <em>\"She shouldn't have said that.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Could have + pp<\/strong> - something that was possible in the past but didn't happen. Can express: missed opportunity (<em>\"I could have been a doctor\"<\/em>), reproach (<em>\"You could have helped\"<\/em>), or speculation (<em>\"That could have been anyone\"<\/em>).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Must have + pp<\/strong> - strong positive deduction about the past from present or past evidence. <em>\"She looks exhausted - she must have been working all night.\"<\/em> / <em>\"He must have taken the wrong turn.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Can't/couldn't have + pp<\/strong> - strong negative past deduction. <em>\"He can't have done it - he was with me.\"<\/em> / <em>\"That couldn't have been her - she's abroad.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Needn't have + pp<\/strong> - something was done but it turned out to be unnecessary. <em>\"You needn't have cooked - we'd already eaten.\"<\/em> Compare: <em>didn't need to<\/em> = it wasn't necessary and it wasn't done.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Might/may have + pp<\/strong> - weak past deduction or possibility. <em>\"She might have misunderstood.\"<\/em> / <em>\"He may have left already.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Needn't have vs didn't need to:<\/strong><br>\n<em>\"You needn't have brought flowers.\"<\/em> - you brought them, but it wasn't necessary.<br>\n<em>\"I didn't need to bring flowers, so I didn't.\"<\/em> - it wasn't necessary and I didn't do it.<br>\n<strong>Should have vs ought to have:<\/strong> Both express past obligation/reproach. <em>Ought to have<\/em> is slightly more formal but otherwise equivalent.<\/div>","table":{"headers":["Modal perfect","Meaning","Example"],"rows":[["should have + pp","obligation not fulfilled / reproach","You should have called. / She shouldn't have left."],["could have + pp","past possibility not realised / reproach","I could have been a doctor. / You could have helped."],["must have + pp","strong positive past deduction","She must have worked all night."],["can't/couldn't have + pp","strong negative past deduction","He can't have done it - he was here."],["needn't have + pp","unnecessary completed action","You needn't have cooked."],["might/may have + pp","weak past possibility or deduction","She might have misunderstood."],["would have + pp","imaginary past result (conditional)","If I'd known, I would have called."]]},"examples":[{"type":"pos","eng":"You should have told me - I would have helped.","note":"Obligation not fulfilled - reproach/regret."},{"type":"pos","eng":"She must have been driving for hours - she looks exhausted.","note":"Strong past deduction from present evidence."},{"type":"pos","eng":"You needn't have bought a present - just coming was enough.","note":"Action was done but turned out unnecessary."},{"type":"pos","eng":"He can't have known about it - he seemed genuinely surprised.","note":"Strong negative past deduction."}],"errors":[{"bad":"You should had called earlier.","good":"You should have called earlier.","reason":"Modal perfect: should have + past participle - not had."},{"bad":"He must had known about it.","good":"He must have known about it.","reason":"Must have + past participle."},{"bad":"I needn't have to buy it.","good":"I needn't have bought it.","reason":"Needn't have + past participle - no to."}],"realUse":[],"richLabel":"Emphasis structures","richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Modal perfect - the full system<\/div>\n<table class=\"rich-table\"><thead><tr><th>Form<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>should have + pp<\/td><td>Obligation not fulfilled - reproach or regret<\/td><td><em>\"You should have called.\"<\/em><\/td><\/tr>\n<tr><td>shouldn't have + pp<\/td><td>Something done that was wrong<\/td><td><em>\"She shouldn't have said that.\"<\/em><\/td><\/tr>\n<tr><td>could have + pp<\/td><td>Past possibility not realised; missed opportunity; reproach<\/td><td><em>\"I could have been a doctor.\"<\/em><\/td><\/tr>\n<tr><td>must have + pp<\/td><td>Strong positive past deduction<\/td><td><em>\"She must have worked all night.\"<\/em><\/td><\/tr>\n<tr><td>can't/couldn't have + pp<\/td><td>Strong negative past deduction<\/td><td><em>\"He can't have done it - he was here.\"<\/em><\/td><\/tr>\n<tr><td>needn't have + pp<\/td><td>Action was done but turned out unnecessary<\/td><td><em>\"You needn't have cooked.\"<\/em><\/td><\/tr>\n<tr><td>didn't need to<\/td><td>Action was unnecessary AND wasn't done<\/td><td><em>\"I didn't need to go, so I didn't.\"<\/em><\/td><\/tr>\n<tr><td>might/may have + pp<\/td><td>Weak past deduction or possibility<\/td><td><em>\"She might have misunderstood.\"<\/em><\/td><\/tr>\n<tr><td>would have + pp<\/td><td>Imaginary past result (3rd conditional)<\/td><td><em>\"If I'd known, I would have called.\"<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">⚠ Needn't have vs didn't need to<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">needn't have brought<\/div><div class=\"meaning-box-eg\">\"You needn't have brought flowers.\"<\/div><div class=\"meaning-box-note\">You DID bring them - but it wasn't necessary<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">didn't need to bring<\/div><div class=\"meaning-box-eg\">\"I didn't need to bring anything, so I didn't.\"<\/div><div class=\"meaning-box-note\">It wasn't necessary AND you didn't do it<\/div><\/div>\n<\/div>\n<\/div>","exercises":[{"type":"gap","title":"Modal perfect - form","sub":"Fill each gap with the correct modal perfect form.","items":[{"answer":"should have called","before":"You ","after":" - I was worried about you."},{"answer":"must have been","before":"She looks terrible - she ","after":" awake all night."},{"answer":"needn't have cooked","before":"You ","after":" - we'd already eaten."},{"answer":"can't have known","before":"He ","after":" about it - he was as surprised as we were."},{"answer":"could have taken","before":"I ","after":" a different route, but I wasn't paying attention."},{"answer":"might have misunderstood","before":"She ","after":" - she seemed confused by your question."},{"answer":"shouldn't have said","before":"He ","after":" that - it was very unkind."},{"answer":"must have left","before":"She's not here - she ","after":" already."}]},{"type":"mc","title":"Which modal perfect?","sub":"Choose the correct option.","items":[{"q":"You _____ me - I had no idea what was happening. (obligation not fulfilled)","opts":["should have told","must have told","needn't have told","could have been telling"],"answer":"should have told","explanation":"Obligation not fulfilled - reproach/regret → should have + pp."},{"q":"She _____ the bus - she arrived with wet hair and out of breath. (deduction)","opts":["should have missed","might have missed","must have missed","can't have missed"],"answer":"must have missed","explanation":"Strong positive deduction from evidence → must have + pp."},{"q":"You _____ the whole thing out - a short note was enough. (unnecessary action done)","opts":["shouldn't have typed","needn't have typed","didn't need type","couldn't have typed"],"answer":"needn't have typed","explanation":"It was done but wasn't necessary → needn't have + pp."},{"q":"He _____ the robbery - he was in hospital at the time. (strong negative deduction)","opts":["shouldn't have done","must have done","can't have done","needn't have done"],"answer":"can't have done","explanation":"Strong negative past deduction → can't have + pp."}]},{"type":"tf","title":"True, False, or Not given","sub":"Is the statement true, false, or not given?","items":[{"context":"You needn't have brought wine - we have plenty.","statement":"The speaker brought wine.","answer":"True","explanation":"Needn't have = action was done but was unnecessary. The wine was brought."},{"context":"She must have left already - her coat is gone.","statement":"The speaker is certain she has left.","answer":"True","explanation":"Must have = strong positive deduction. The coat is the evidence."},{"context":"He could have applied for the promotion.","statement":"He applied for the promotion.","answer":"False","explanation":"Could have = past possibility not realised. He didn't apply."},{"context":"I didn't need to submit the report until Monday, so I took the weekend off.","statement":"The report was submitted on Monday.","answer":"Not given","explanation":"Didn't need to = it wasn't necessary. The report may or may not have been submitted - we don't know when."}]}]},{"id":"reportedspeechadv","title":"Reported speech - advanced","subtitle":"admit, deny, insist, warn, suggest","intro":"Beyond said and told - reaching for the precise reporting verb that captures how something was said.","desc":"At B1 you learnt basic reported speech with tense backshift and say/tell. At B2 the key upgrade is using a range of reporting verbs that do two jobs at once: they tell you what was said AND how it was said - whether someone admitted something, denied it, insisted, warned, or suggested.","tip":"The thing to grasp is that each reporting verb carries its own grammar. <em>Admit, deny, suggest<\/em> take the gerund. <em>Insist, demand, recommend<\/em> take <em>that<\/em> + should or the base form. <em>Warn, advise, tell, urge<\/em> take an object + infinitive. Learning them in those families is really the work of B2.","explanation":"<p>Precise reporting verbs convey both the content and the manner of speech. Each group follows a different grammatical pattern.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Verb + that clause<\/strong> (with tense backshift): <em>say, claim, explain, state, admit, deny, insist, agree, argue, confirm, announce, warn.<\/em><br><em>\"She admitted that she had made a mistake.\"<\/em> / <em>\"He insisted that the decision was wrong.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Verb + gerund (-ing)<\/strong>: <em>admit, deny, suggest, recommend, propose, acknowledge, regret, mention.<\/em><br><em>\"She admitted making a mistake.\"<\/em> / <em>\"He denied having been there.\"<\/em> / <em>\"They suggested meeting earlier.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Verb + object + infinitive<\/strong>: <em>tell, warn, advise, ask, beg, encourage, persuade, remind, urge, instruct, order, forbid.<\/em><br><em>\"She warned him not to go.\"<\/em> / <em>\"He urged us to reconsider.\"<\/em> / <em>\"She reminded me to lock the door.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Verb + that + should/base form<\/strong> (subjunctive-like): <em>suggest, recommend, insist, demand, propose, request.<\/em><br><em>\"She suggested that he should apply.\"<\/em> / <em>\"They insisted that the work be completed.\"<\/em> (formal subjunctive)<\/div><\/div>\n<div class=\"note\"><strong>No tense backshift when:<\/strong> the situation is still true now, the reporting verb is present tense, or it's a scientific/general truth: <em>\"She said she lives in Madrid.\"<\/em> (still true) / <em>\"He says it works.\"<\/em> (present reporting).<br>\n<strong>Changes in reported speech:<\/strong> here → there | now → then | today → that day | tomorrow → the next day | this → that | come → go | bring → take.<\/div>","table":{"headers":["Pattern","Verbs","Example"],"rows":[["verb + that clause","say, claim, admit, insist, argue, confirm","He admitted that he had lied."],["verb + gerund","admit, deny, suggest, recommend, regret","She denied taking the money."],["verb + object + infinitive","tell, warn, advise, urge, beg, remind","He warned her not to trust them."],["verb + that + should/base","suggest, recommend, insist, demand","They insisted that it be done."],["verb + to infinitive","offer, refuse, threaten, promise, agree","She offered to help."],["verb + object + not to","warn, tell, advise, remind","She advised him not to go."]]},"examples":[{"type":"pos","eng":"She admitted having been present at the meeting.","note":"Admit + gerund - conceding a fact."},{"type":"pos","eng":"He denied making any such promise.","note":"Deny + gerund - strong rejection of an accusation."},{"type":"pos","eng":"They urged the government to take immediate action.","note":"Urge + object + infinitive - strong encouragement."},{"type":"pos","eng":"She suggested that they should meet earlier.","note":"Suggest + that + should - recommendation."}],"errors":[{"bad":"She suggested to go out for dinner.","good":"She suggested going out for dinner.","reason":"Suggest + gerund - never suggest + infinitive."},{"bad":"He denied to have taken the money.","good":"He denied having taken the money.","reason":"Deny + gerund - never deny + infinitive."},{"bad":"She told to me not to worry.","good":"She told me not to worry.","reason":"Tell + object (no to before the object) + not to + infinitive."}],"realUse":[],"exercises":[{"type":"gap","title":"Reporting verbs - correct pattern","sub":"Rewrite each sentence using the reporting verb in brackets.","items":[{"answer":"admitted making","before":"'I made a mistake,' she said. → She ","after":" a mistake. (admit + gerund)"},{"answer":"denied having taken","before":"'I didn't take the money,' he said. → He ","after":" the money. (deny + gerund)"},{"answer":"warned us not to go","before":"'Don't go out alone,' she said to us. → She ","after":" out alone. (warn + object + not to)"},{"answer":"suggested meeting","before":"'Why don't we meet earlier?' she said. → She ","after":" earlier. (suggest + gerund)"},{"answer":"urged the government to act","before":"'The government must act now,' they said. → They ","after":" immediately. (urge + object + infinitive)"},{"answer":"insisted that the report should be reviewed","before":"'The report must be reviewed,' she said. → She ","after":". (insist + that + should)"}]},{"type":"mc","title":"Which pattern?","sub":"Choose the correctly formed reported sentence.","items":[{"q":"'I didn't steal it.' (deny)","opts":["He denied to steal it.","He denied stealing it.","He denied steal it.","He denied he stole it."],"answer":"He denied stealing it.","explanation":"Deny + gerund - never infinitive."},{"q":"'You should apply for the grant.' (suggest)","opts":["She suggested to apply.","She suggested that he should apply.","She suggested him to apply.","She suggested he applies."],"answer":"She suggested that he should apply.","explanation":"Suggest + that + should + base verb. Suggest + gerund also correct: she suggested applying."},{"q":"'Please don't tell anyone.' (beg)","opts":["She begged not to tell.","She begged him not to tell.","She begged that not tell.","She begged telling."],"answer":"She begged him not to tell.","explanation":"Beg + object + not to + infinitive."},{"q":"'I'll help you.' (offer)","opts":["She offered helping.","She offered to help.","She offered that she help.","She offered help."],"answer":"She offered to help.","explanation":"Offer + to + infinitive."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using the reporting verb given.","items":[{"original":"'I was there,' she said.","keyword":"admitted","answer":"She admitted having been there."},{"original":"'Don't sign anything without reading it,' he told her.","keyword":"warned","answer":"He warned her not to sign anything without reading it."},{"original":"'I didn't send that email,' he said.","keyword":"denied","answer":"He denied having sent that email."},{"original":"'Why don't we postpone the meeting?' she said.","keyword":"suggested","answer":"She suggested postponing the meeting."},{"original":"'You must reconsider,' they said to us.","keyword":"urged","answer":"They urged us to reconsider."}]}]},{"id":"relativesb2","title":"Relative clauses: full review","subtitle":"defining, non-defining, reduced","intro":"The complete picture of relative clauses - including reduced forms and the trickier patterns.","desc":"At B1 and B2 the relative clause system becomes fully productive. The key addition at B2 is the reduced relative clause - dropping the relative pronoun and verb to be, leaving a participle or adjective. This is extremely common in formal written English and makes writing more economical.","tip":"Reduced relatives are where I see errors in both directions - not reducing when you could, or reducing wrongly. <em>\"The woman who is sitting by the door\"<\/em> → <em>\"the woman sitting by the door\"<\/em> (active); <em>\"the report which was written by the team\"<\/em> → <em>\"the report written by the team\"<\/em> (passive). The trick to remember: it only works when the clause contains a form of <em>be<\/em>.","explanation":"<p>A full review of the relative clause system, including reduced relatives common in B2+ writing.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Defining relative clauses<\/strong> - no commas. Essential to identify which person/thing. <em>who, which, that, whose, where, when.<\/em> That can replace who/which. The pronoun can be omitted when it is the object of the clause: <em>\"The film (that) I saw was excellent.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Non-defining relative clauses<\/strong> - commas required. Extra information, not essential. <em>who, which, whose, where, when<\/em> - never <em>that<\/em>. <em>Which<\/em> can refer to the whole previous clause. <em>\"She passed her exams, which surprised everyone.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Reduced relative clauses<\/strong> - the relative pronoun + be is dropped, leaving a participle or adjective. Only possible when the relative clause contains a form of <em>be<\/em>.<br>\nActive: <em>\"the woman who is sitting...\"<\/em> → <em>\"the woman sitting...\"<\/em><br>\nPassive: <em>\"the report which was written...\"<\/em> → <em>\"the report written...\"<\/em><br>\nAdjective: <em>\"the issue which is most relevant...\"<\/em> → <em>\"the most relevant issue...\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Prepositions in relative clauses<\/strong> - formal English moves the preposition to before the pronoun: <em>\"the country in which she was born\"<\/em> (formal) vs <em>\"the country that she was born in\"<\/em> (informal). With <em>which<\/em> and <em>whom<\/em> only - never <em>\"in that\"<\/em>.<\/div><\/div>\n<div class=\"note\"><strong>Omission of the object pronoun:<\/strong><br>\n<em>\"The book (which/that) I recommended is excellent.\"<\/em> - object pronoun can be dropped.<br>\n<em>\"The woman who called is my sister.\"<\/em> - subject pronoun CANNOT be dropped.<br>\n<strong>When vs where vs which:<\/strong> when = times (<em>the day when<\/em>), where = places (<em>the city where<\/em>), which/that = things, who/that = people. These are often confused at B2.<\/div>","table":{"headers":["Type","Pronouns","Commas","Notes"],"rows":[["Defining","who, which, that, whose, where, when","No","that can replace who/which; object pronoun omissible"],["Non-defining","who, which, whose, where, when","Yes","Never that; which can refer to whole clause"],["Reduced active","participle (-ing)","Depends","Drop who/which + be: who is sitting → sitting"],["Reduced passive","past participle","Depends","Drop which was + pp: which was written → written"],["Prep + which/whom","in which, from whom, etc.","Depends","Formal English: moves prep before pronoun"],["Which for whole clause","which","Comma before","She failed, which upset her."]]},"examples":[{"type":"pos","eng":"The delegates attending the conference came from forty countries.","note":"Reduced active relative - who were attending → attending."},{"type":"pos","eng":"The report submitted by the committee was highly critical.","note":"Reduced passive relative - which was submitted → submitted."},{"type":"pos","eng":"The city in which she was born no longer exists.","note":"Formal preposition + which - more formal than 'the city she was born in'."},{"type":"pos","eng":"She won the award, which came as a complete surprise.","note":"Non-defining which referring to the whole previous clause."}],"errors":[{"bad":"The woman sitting by the door, she is my manager.","good":"The woman sitting by the door is my manager.","reason":"Don't add a second subject pronoun after a relative clause."},{"bad":"The city in that she grew up is beautiful.","good":"The city in which she grew up is beautiful.","reason":"Preposition + which - never preposition + that."},{"bad":"He won the prize, that was unexpected.","good":"He won the prize, which was unexpected.","reason":"Non-defining clause referring to the whole event - which, not that."}],"realUse":[],"exercises":[{"type":"gap","title":"Reduce the relative clause","sub":"Rewrite the underlined relative clause as a reduced relative.","items":[{"answer":"sitting","before":"The man ","after":" by the window is my colleague. (who is sitting)"},{"answer":"written","before":"The letter ","after":" by the director arrived this morning. (which was written)"},{"answer":"attending","before":"All delegates ","after":" the conference must register. (who are attending)"},{"answer":"involved","before":"The companies ","after":" in the merger denied any wrongdoing. (which were involved)"},{"answer":"most affected","before":"The communities ","after":" by the flood need urgent help. (which are most affected)"},{"answer":"appointed","before":"The new manager ","after":" last month has already made changes. (who was appointed)"}]},{"type":"mc","title":"Which relative structure?","sub":"Choose the correct option.","items":[{"q":"This is the building _____ the treaty was signed.","opts":["that","which","in which","in that"],"answer":"in which","explanation":"Preposition + which for place (formal). Never preposition + that."},{"q":"She received an offer _____ she couldn't refuse.","opts":["which","in which","that she"," - "],"answer":" - ","explanation":"Object pronoun can be omitted in defining relative clauses - the offer (that) she couldn't refuse."},{"q":"The CEO resigned, _____ sent shockwaves through the industry.","opts":["that","which","who","whose"],"answer":"which","explanation":"Non-defining which referring to the whole previous clause - CEO resigned."},{"q":"The data _____ in the report supports our hypothesis.","opts":["that presented","presented","which it presents","presenting"],"answer":"presented","explanation":"Reduced passive relative - the data (which was) presented."}]},{"type":"builder","title":"Combine the sentences","sub":"Combine using the most appropriate relative structure.","items":[{"words":["the","research","published","last","year","has","been","widely","cited"],"answer":"the research published last year has been widely cited","context":"Reduced passive relative - which was published."},{"words":["she","won","the","award",",","which","surprised","everyone"],"answer":"she won the award , which surprised everyone","context":"Non-defining which for whole clause."},{"words":["the","country","in","which","she","was","born","no","longer","exists"],"answer":"the country in which she was born no longer exists","context":"Formal preposition + which."},{"words":["the","delegates","attending","the","summit","represented","fifty","nations"],"answer":"the delegates attending the summit represented fifty nations","context":"Reduced active relative - who were attending."}]}]},{"id":"gerundsinfinadv","title":"Gerunds and infinitives - advanced","subtitle":"complex patterns, change of meaning, nominalised gerunds","intro":"The full range of verb + gerund and verb + infinitive patterns, at B2 depth.","desc":"At B1 you learnt the basic verb lists. At B2 the focus shifts to: verbs that change meaning (remember/forget/stop/try/regret/go on), the use of the gerund as a subject or object noun, verbs that take an object + bare infinitive (make, let, see, hear, help), and the pattern after adjectives and nouns.","tip":"The one that trips people up is the bare infinitive after perception verbs. <em>\"I saw him run\"<\/em> (bare infinitive - the whole action, start to finish) versus <em>\"I saw him running\"<\/em> (participle - caught mid-action). Both are right; they just frame the moment differently. Feel that difference and you've got it.","explanation":"<p>At B2, the gerund/infinitive system extends to more complex patterns and subtler meaning distinctions.<\/p>\n<di
