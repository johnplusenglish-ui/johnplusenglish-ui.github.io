v class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Verbs with meaning change<\/strong> - the most important B2 pairs:<br>\n<em>remember + gerund<\/em> = recall a past event. <em>remember + infinitive<\/em> = not forget to do something.<br>\n<em>stop + gerund<\/em> = quit an activity. <em>stop + infinitive<\/em> = pause in order to do something.<br>\n<em>try + gerund<\/em> = experiment with something. <em>try + infinitive<\/em> = make an effort to do something.<br>\n<em>regret + gerund<\/em> = feel sorry about a past action. <em>regret + infinitive<\/em> = formal announcement: \"I regret to inform you...\"<br>\n<em>go on + gerund<\/em> = continue doing. <em>go on + infinitive<\/em> = move on to the next thing.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Perception verbs + bare infinitive or -ing<\/strong>: see, hear, watch, feel, notice, observe + object + bare infinitive (complete action) or + -ing (action in progress).<br>\n<em>\"I saw her leave.\"<\/em> (she left - complete) vs <em>\"I saw her leaving.\"<\/em> (she was in the process of leaving)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Make, let, help + bare infinitive<\/strong>: causative/permissive verbs take the bare infinitive.<br>\n<em>\"They made us wait.\"<\/em> / <em>\"She let him speak.\"<\/em> / <em>\"This helped me understand.\"<\/em> But in passive: <em>\"We were made to wait.\"<\/em> (to + infinitive in passive)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Gerund as subject or object noun<\/strong>: the gerund functions as a noun - it can be the subject of a sentence or follow a preposition.<br>\n<em>\"Swimming is good exercise.\"<\/em> / <em>\"Before leaving, check everything.\"<\/em> / <em>\"The thought of failing terrified her.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Would rather + bare infinitive (own preference):<\/strong> <em>\"I'd rather go alone.\"<\/em><br>\n<strong>Would rather + past simple (other person):<\/strong> <em>\"I'd rather you didn't tell her.\"<\/em> - past simple signals hypothetical preference about someone else.<br>\n<strong>It's (high) time + past simple:<\/strong> <em>\"It's time you apologised.\"<\/em> / <em>\"It's high time the government acted.\"<\/em> - past simple signals urgency about present situation.<\/div>","table":{"headers":["Pattern","Example","Note"],"rows":[["remember + gerund","I remember meeting her.","Memory of past event"],["remember + infinitive","Remember to lock the door.","Don't forget to do it"],["stop + gerund","She stopped smoking.","Quit the habit"],["stop + infinitive","She stopped to smoke.","Paused in order to smoke"],["try + gerund","Try adding more salt.","Experiment - see if it helps"],["try + infinitive","I tried to open the door.","Made an effort"],["make + object + bare inf","They made us wait.","Force/compel"],["let + object + bare inf","Let him speak.","Permit"],["perception + bare inf","I saw him leave.","Complete action"],["perception + -ing","I saw him leaving.","Action in progress"]]},"examples":[{"type":"pos","eng":"I'll never forget meeting her for the first time.","note":"Forget + gerund = memory of past event."},{"type":"pos","eng":"Don't forget to bring your passport.","note":"Forget + infinitive = don't fail to do it."},{"type":"pos","eng":"He stopped to check his phone.","note":"Stop + infinitive = paused in order to do it."},{"type":"pos","eng":"I heard her playing the piano next door.","note":"Perception + -ing = in progress (heard the activity)."}],"errors":[{"bad":"I remember to meet her at the conference.","good":"I remember meeting her at the conference.","reason":"Memory of a past event → remember + gerund."},{"bad":"They made us to wait for hours.","good":"They made us wait for hours.","reason":"Make + object + bare infinitive - no to in active form."},{"bad":"I saw him to leave the building.","good":"I saw him leave the building.","reason":"Perception verb + object + bare infinitive - no to."}],"realUse":[],"richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Meaning-change verb pairs<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">remember + -ing<\/div><div class=\"meaning-box-eg\">\"I remember meeting her.\"<\/div><div class=\"meaning-box-note\">Memory of a past event<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">remember + to<\/div><div class=\"meaning-box-eg\">\"Remember to lock up.\"<\/div><div class=\"meaning-box-note\">Don't forget to do it<\/div><\/div>\n<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">stop + -ing<\/div><div class=\"meaning-box-eg\">\"He stopped smoking.\"<\/div><div class=\"meaning-box-note\">Quit the habit<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">stop + to<\/div><div class=\"meaning-box-eg\">\"He stopped to smoke.\"<\/div><div class=\"meaning-box-note\">Paused in order to smoke<\/div><\/div>\n<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">try + -ing<\/div><div class=\"meaning-box-eg\">\"Try adding garlic.\"<\/div><div class=\"meaning-box-note\">Experiment - see if it helps<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">try + to<\/div><div class=\"meaning-box-eg\">\"I tried to open it.\"<\/div><div class=\"meaning-box-note\">Made an effort (may have failed)<\/div><\/div>\n<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">regret + -ing<\/div><div class=\"meaning-box-eg\">\"I regret saying that.\"<\/div><div class=\"meaning-box-note\">Feel sorry about a past action<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">regret + to<\/div><div class=\"meaning-box-eg\">\"I regret to inform you...\"<\/div><div class=\"meaning-box-note\">Formal announcement - present action<\/div><\/div>\n<\/div>\n<div class=\"meaning-pair\">\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">go on + -ing<\/div><div class=\"meaning-box-eg\">\"She went on talking.\"<\/div><div class=\"meaning-box-note\">Continue doing the same thing<\/div><\/div>\n<div class=\"meaning-box\"><div class=\"meaning-box-head\">go on + to<\/div><div class=\"meaning-box-eg\">\"She went on to become director.\"<\/div><div class=\"meaning-box-note\">Move on to a new activity<\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Special patterns<\/div>\n<table class=\"rich-table\"><thead><tr><th>Pattern<\/th><th>Form<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>Perception verbs (see, hear, watch, feel) + complete action<\/td><td>+ object + bare infinitive<\/td><td><em>\"I saw her leave.\"<\/em> - the whole event<\/td><\/tr>\n<tr><td>Perception verbs + action in progress<\/td><td>+ object + -ing<\/td><td><em>\"I saw her leaving.\"<\/em> - caught mid-action<\/td><\/tr>\n<tr><td>make + object<\/td><td>+ bare infinitive<\/td><td><em>\"They made us wait.\"<\/em> (passive: <em>were made to wait<\/em>)<\/td><\/tr>\n<tr><td>let + object<\/td><td>+ bare infinitive<\/td><td><em>\"Let him speak.\"<\/em><\/td><\/tr>\n<tr><td>would rather (self)<\/td><td>+ bare infinitive<\/td><td><em>\"I'd rather go alone.\"<\/em><\/td><\/tr>\n<tr><td>would rather (other person)<\/td><td>+ past simple<\/td><td><em>\"I'd rather you didn't mention it.\"<\/em><\/td><\/tr>\n<tr><td>it's (high) time<\/td><td>+ past simple<\/td><td><em>\"It's time you apologised.\"<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","exercises":[{"type":"gap","title":"Gerund or infinitive - meaning change","sub":"Fill each gap with the gerund or infinitive. The meaning matters.","items":[{"answer":"to lock","before":"Did you remember ","after":" the door? (don't forget to do it)"},{"answer":"meeting","before":"I'll never forget ","after":" her for the first time. (memory of past event)"},{"answer":"smoking","before":"He stopped ","after":" ten years ago. (quit the habit)"},{"answer":"to buy","before":"She stopped ","after":" flowers on the way home. (paused in order to)"},{"answer":"adding","before":"Try ","after":" more garlic - it might improve the flavour. (experiment)"},{"answer":"to contact","before":"I tried ","after":" her but the line was busy. (attempt)"},{"answer":"to inform","before":"I regret ","after":" you that the position has been filled. (formal announcement)"},{"answer":"working","before":"He went on ","after":" for the same company for twenty years. (continue)"}]},{"type":"mc","title":"Perception verbs and make/let","sub":"Choose the correct form.","items":[{"q":"I heard her _____ the front door - she must have arrived.","opts":["to close","closing","close","closed"],"answer":"close","explanation":"Heard + object + bare infinitive = the complete action. Also: closing would suggest you heard it in progress."},{"q":"They made us _____ for three hours before the interview.","opts":["to wait","waiting","wait","waited"],"answer":"wait","explanation":"Make + object + bare infinitive - no to in active. (In passive: were made to wait.)"},{"q":"I'd rather you _____ anyone about this.","opts":["don't tell","didn't tell","not tell","won't tell"],"answer":"didn't tell","explanation":"Would rather + other person = past simple to express hypothetical preference."},{"q":"It's high time she _____ the situation.","opts":["addresses","has addressed","addressed","to address"],"answer":"addressed","explanation":"It's high time + past simple - urgency about present situation."}]},{"type":"tf","title":"True, False, or Not given","sub":"Is the statement true, false, or not given?","items":[{"context":"I saw her leave the building at five.","statement":"I watched her whole departure from the building.","answer":"True","explanation":"Bare infinitive = complete action. I saw the whole event of her leaving."},{"context":"I saw her leaving the building.","statement":"She had already left when I saw her.","answer":"False","explanation":"-ing form = action in progress. I caught the act of her leaving - she was in the process."},{"context":"He tried calling her several times.","statement":"He was unable to call her.","answer":"False","explanation":"Try + gerund = experiment/attempt. He did call - the calls just didn't succeed. Try + infinitive would suggest the attempt itself was difficult."},{"context":"It's time you apologised.","statement":"The speaker believes an apology is overdue.","answer":"True","explanation":"It's time + past simple signals that something should already have happened - it's overdue."}]}]},{"id":"wishb2","title":"Wish, if only & it's time","subtitle":"I wish I had, if only she hadn't, it's time you did","intro":"Regret, dissatisfaction and urgency - the complete toolkit for wishing things were otherwise.","desc":"At B1 you learnt the core wish structures. At B2 we extend to the full system including wish + would for external irritation, wish + could, if only for emphasis, and the it's time / it's high time structure which triggers the past simple to express urgency.","tip":"The subtle B2 distinction I want you to feel: <em>\"I wish I were taller\"<\/em> (a permanent state I can't change) versus <em>\"I wish you would stop\"<\/em> (a behaviour I want changed). The <em>would<\/em> form is for things that <em>could<\/em> change but frustrate you. And never <em>\"I wish I would\"<\/em> about yourself - for your own situation, use the past simple.","explanation":"<p>The full wish/if only/it's time system at B2.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Wish/if only + past simple<\/strong> - dissatisfaction with the present; desire for things to be different now. <em>\"I wish I spoke Italian.\"<\/em> / <em>\"If only I had more time!\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Wish/if only + past perfect<\/strong> - regret about a past action or situation that cannot be changed. <em>\"I wish I had taken that opportunity.\"<\/em> / <em>\"If only she hadn't said that.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Wish + would<\/strong> - frustration about someone else's current behaviour, or desire for an external change. Can also express a wish for something to happen. <em>\"I wish he would stop interrupting.\"<\/em> / <em>\"I wish it would stop raining.\"<\/em> Never with the same subject: not <em>\"I wish I would...\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>It's time / it's high time + past simple<\/strong> - expressing that something is overdue and should happen now. The past simple signals urgency about the present, not past meaning. <em>\"It's time you made a decision.\"<\/em> / <em>\"It's high time the government acted.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">5<\/div><div class=\"rule-text\"><strong>Would rather + bare infinitive<\/strong> (own preference) vs <strong>would rather + past simple<\/strong> (preference about someone else). <em>\"I'd rather go alone.\"<\/em> vs <em>\"I'd rather you came with me.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Were vs was after wish:<\/strong> Formally, <em>were<\/em> is preferred: <em>\"I wish I were taller.\"<\/em> In informal speech, <em>was<\/em> is very common and widely accepted. In formal exams, <em>were<\/em> is preferred.<br>\n<strong>If only vs I wish:<\/strong> Same grammar, but <em>if only<\/em> expresses stronger emotion - longing, frustration, or regret. <em>I wish<\/em> can be more neutral.<br>\n<strong>How I wish vs I wish:<\/strong> <em>\"How I wish I could see her again!\"<\/em> - emphatic, literary or emotional register.<\/div>","table":{"headers":["Structure","Use","Example"],"rows":[["wish/if only + past simple","Present dissatisfaction","I wish I lived closer."],["wish/if only + past perfect","Past regret","If only I had applied earlier."],["wish + would","Frustration about others' behaviour","I wish you would listen."],["wish + could","Wishing for an ability","I wish I could play the piano."],["it's time + past simple","Something is overdue - urgency","It's time you made a decision."],["it's high time + past simple","More urgent/emphatic","It's high time this changed."],["would rather + bare inf (self)","Personal preference","I'd rather stay in tonight."],["would rather + past simple (other)","Preference about another person","I'd rather you didn't mention it."]]},"examples":[{"type":"pos","eng":"If only I had accepted the offer when I had the chance.","note":"Past regret about a decision - if only + past perfect."},{"type":"pos","eng":"I wish people would be more considerate on public transport.","note":"Frustration about general behaviour - wish + would."},{"type":"pos","eng":"It's high time this country invested in its infrastructure.","note":"Strong urgency - it's high time + past simple."},{"type":"pos","eng":"I'd rather you didn't bring it up at dinner.","note":"Preference about someone else's behaviour - would rather + past simple."}],"errors":[{"bad":"I wish I would be taller.","good":"I wish I were taller.","reason":"Same subject - use past simple (were), not would. Would is only for other people's behaviour."},{"bad":"It's time you will apologise.","good":"It's time you apologised.","reason":"It's time + past simple - never future/will."},{"bad":"I'd rather you don't tell her.","good":"I'd rather you didn't tell her.","reason":"Would rather + another person = past simple (hypothetical preference)."}],"realUse":[],"exercises":[{"type":"gap","title":"Wish, if only, it's time","sub":"Fill each gap with the correct form.","items":[{"answer":"spoke","before":"I wish I ","after":" better French. (present dissatisfaction - speak)"},{"answer":"hadn't said","before":"If only I ","after":" that - it was so cruel. (past regret - say)"},{"answer":"would stop","before":"I wish he ","after":" talking so loudly. (frustration - stop)"},{"answer":"had taken","before":"I wish I ","after":" that job when I had the chance. (past regret - take)"},{"answer":"made","before":"It's time you ","after":" a decision. (overdue - make)"},{"answer":"didn't","before":"I'd rather you ","after":" come. (preference about other - negative)"},{"answer":"could afford","before":"I wish I ","after":" a longer holiday. (ability wish - afford)"},{"answer":"acted","before":"It's high time the government ","after":" on this issue. (urgency - act)"}]},{"type":"mc","title":"Which structure?","sub":"Choose the correct form.","items":[{"q":"I wish I _____ - it would be so useful.","opts":["could drive","can drive","would drive","drove"],"answer":"could drive","explanation":"Wish for an ability you don't have → wish + could."},{"q":"I wish you _____ your phone during dinner!","opts":["didn't check","don't check","wouldn't check","hadn't checked"],"answer":"wouldn't check","explanation":"Frustration about ongoing behaviour → wish + would (negative)."},{"q":"It's high time she _____ the truth.","opts":["tells","told","will tell","has told"],"answer":"told","explanation":"It's high time + past simple - urgency/overdue."},{"q":"If only we _____ the contract earlier.","opts":["read","have read","had read","would read"],"answer":"had read","explanation":"Regret about past action → if only + past perfect."}]},{"type":"convo","title":"Fill the conversation","sub":"Complete the dialogue using wish, if only, it's time, or would rather.","lines":[{"speaker":"A","text":"I [wish] this project [were] over. I'm exhausted."},{"speaker":"B","text":"I know. [If only] we [had started] earlier - we wouldn't be in this mess."},{"speaker":"A","text":"I [wish] the client [would] stop changing their mind."},{"speaker":"B","text":"Agreed. It's [time] we [had] a serious conversation with them."},{"speaker":"A","text":"I'd [rather] you [did] that - you're better at difficult conversations."},{"speaker":"B","text":"Fine. [If only] I [had] your optimism - I'm dreading it."}]}]},{"id":"inversion","title":"Inversion for emphasis","subtitle":"Never have I, Not only did she, Hardly had they","intro":"Flipping the auxiliary in front of the subject for dramatic emphasis and a formal register.","desc":"Inversion takes the word order of questions and applies it to statements for emphasis. It is a hallmark of formal and literary English and appears constantly in B2/C1 texts - newspaper editorials, formal speeches, and academic writing. Recognising it is as important as producing it.","tip":"The pattern is always kicked off by a negative or restrictive phrase at the start of the sentence, and the rule is simply: bring the auxiliary to the front (add do/does/did if there isn't one). The main verb stays put. The slip I catch most is inverting the auxiliary and then carrying on with normal statement order - the inversion has to land fully.","explanation":"<p>Inversion places an auxiliary verb before the subject to create emphasis or a formal register. It is triggered by negative or restrictive adverbials at the start of a clause.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Never, rarely, seldom, barely, hardly, scarcely<\/strong> - negative frequency adverbs. <em>\"Never have I seen such courage.\"<\/em> / <em>\"Rarely does she make a mistake.\"<\/em> / <em>\"Hardly had she arrived when the trouble started.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Not only... but also, not until, not since, no sooner... than<\/strong> - restrictive negatives. <em>\"Not only did she pass, but she also came top.\"<\/em> / <em>\"Not until I read the report did I understand the scale of the problem.\"<\/em> / <em>\"No sooner had he sat down than the phone rang.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>Only after, only when, only by, only then<\/strong> - restrictive only-phrases. <em>\"Only after the meeting did she realise what had happened.\"<\/em> / <em>\"Only by working together can we solve this.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">·<\/div><div class=\"rule-text\"><strong>So/such... that<\/strong> with inversion: <em>\"So difficult was the task that many gave up.\"<\/em> / <em>\"Such was the scale of the disaster that international help was needed.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>How to form inversion:<\/strong><br>\n1. Move the negative/restrictive expression to the front.<br>\n2. Move the auxiliary (be, have, do, modal) before the subject.<br>\n3. If no auxiliary exists, add do/does/did.<br>\n<em>Normal: \"I have never seen anything like it.\"<\/em><br>\n<em>Inverted: \"Never have I seen anything like it.\"<\/em><br>\n<strong>Inversion does NOT apply in indirect/embedded clauses<\/strong>: <em>\"I didn't realise how rarely she made mistakes.\"<\/em> - no inversion after how.<\/div>","table":{"headers":["Trigger","Normal word order","Inverted","Notes"],"rows":[["Never","I have never seen...","Never have I seen...","Have moves before I"],["Rarely/Seldom","She rarely makes...","Rarely does she make...","Add does - no auxiliary"],["Hardly...when","She had hardly arrived when...","Hardly had she arrived when...","Had moves before she"],["No sooner...than","He had no sooner sat down than...","No sooner had he sat down than...","Had moves before he"],["Not only...but","She not only passed but also...","Not only did she pass but she also...","Add did - no auxiliary"],["Only after","She only realised after the meeting.","Only after the meeting did she realise.","Did moves before she"],["So + adj","The task was so difficult that...","So difficult was the task that...","Was moves before the task"]]},"examples":[{"type":"pos","eng":"Never have I encountered such professional dedication.","note":"Never + have + subject - formal/emphatic."},{"type":"pos","eng":"Not only did she complete the project on time, but she also came in under budget.","note":"Not only did - both clauses get inversion in the first clause."},{"type":"pos","eng":"Hardly had the meeting started when a fire alarm went off.","note":"Hardly...when - both parts of the structure needed."},{"type":"pos","eng":"Only by collaborating closely can the two teams achieve this.","note":"Only by + gerund - inversion with modal."}],"errors":[{"bad":"Never I have seen such dedication.","good":"Never have I seen such dedication.","reason":"Inversion: auxiliary (have) must come before subject (I)."},{"bad":"Not only she passed but also won a scholarship.","good":"Not only did she pass but she also won a scholarship.","reason":"Not only triggers inversion - did before she. Also: second clause needs its own subject."},{"bad":"Hardly she had arrived when the trouble started.","good":"Hardly had she arrived when the trouble started.","reason":"Inversion: had must come before she."}],"realUse":[],"richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Inversion triggers → structures<\/div>\n<table class=\"rich-table\"><thead><tr><th>Trigger<\/th><th>Inverted structure<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>Never<\/td><td>Never + have/has/had + subject + pp<\/td><td><em>\"Never have I seen such courage.\"<\/em><\/td><\/tr>\n<tr><td>Rarely / seldom / barely<\/td><td>Rarely/Seldom + do/does/did + subject + base verb<\/td><td><em>\"Rarely does she make a mistake.\"<\/em><\/td><\/tr>\n<tr><td>Hardly / scarcely... when<\/td><td>Hardly/Scarcely + had + subject + pp + when<\/td><td><em>\"Hardly had she arrived when the trouble started.\"<\/em><\/td><\/tr>\n<tr><td>No sooner... than<\/td><td>No sooner + had + subject + pp + than<\/td><td><em>\"No sooner had he sat down than the phone rang.\"<\/em><\/td><\/tr>\n<tr><td>Not only... but also<\/td><td>Not only + did + subject + base verb<\/td><td><em>\"Not only did she pass, but she also came top.\"<\/em><\/td><\/tr>\n<tr><td>Not until<\/td><td>Not until [clause/phrase] + did/was + subject<\/td><td><em>\"Not until I read it did I understand.\"<\/em><\/td><\/tr>\n<tr><td>Only after / only when / only by<\/td><td>Only [phrase] + did/can + subject<\/td><td><em>\"Only after the meeting did she realise.\"<\/em><\/td><\/tr>\n<tr><td>So + adjective<\/td><td>So + adj + was/were + subject + that<\/td><td><em>\"So difficult was the task that many gave up.\"<\/em><\/td><\/tr>\n<tr><td>Such was<\/td><td>Such was + noun + that<\/td><td><em>\"Such was the chaos that no one knew what to do.\"<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Before → after: inversion in action<\/div>\n<div class=\"transform-demo\">\n<div class=\"transform-demo-row\"><div class=\"tdl\">I have never seen anything like it.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">Never have I seen anything like it.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">She not only passed but also won the prize.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">Not only did she pass, but she also won the prize.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">He had no sooner arrived than it started to rain.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">No sooner had he arrived than it started to rain.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">The problem was so complex that no solution was found.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">So complex was the problem that no solution was found.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">She only understood after reading the report.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">Only after reading the report did she understand.<\/div><\/div>\n<\/div>\n<\/div>","exercises":[{"type":"gap","title":"Form the inversion","sub":"Rewrite each sentence beginning with the word or phrase given.","items":[{"answer":"Never have I read","before":"I have never read such a gripping novel. → ","after":" such a gripping novel."},{"answer":"Rarely does she make","before":"She rarely makes spelling errors. → ","after":" spelling errors."},{"answer":"Not only did he apologise","before":"He not only apologised but also offered compensation. → ","after":" but he also offered compensation."},{"answer":"Hardly had the ceremony begun","before":"The ceremony had hardly begun when it started to rain. → ","after":" when it started to rain."},{"answer":"Only after reading the report","before":"She only understood the scale after reading the report. → ","after":" did she understand the scale."},{"answer":"So complex was the problem","before":"The problem was so complex that no single solution existed. → ","after":" that no single solution existed."}]},{"type":"mc","title":"Which is correct?","sub":"Choose the correctly inverted sentence.","items":[{"q":"Normal: 'I had rarely felt so nervous.' Inverted:","opts":["Rarely I had felt so nervous.","Rarely had I felt so nervous.","Rarely I felt so nervous.","Rarely did I had felt so nervous."],"answer":"Rarely had I felt so nervous.","explanation":"Rarely + auxiliary (had) + subject (I) - past perfect here."},{"q":"Normal: 'She not only passed the exam but also broke the record.' Inverted:","opts":["Not only she passed the exam but also broke the record.","Not only did she pass the exam but she also broke the record.","Not only passed she the exam but also broke the record.","Not only has she passed the exam but also broke the record."],"answer":"Not only did she pass the exam but she also broke the record.","explanation":"Not only + did (add auxiliary) + she + base form. Also no inversion in the but also clause."},{"q":"Normal: 'We had no sooner arrived than it began to rain.' Inverted:","opts":["No sooner we had arrived than it began to rain.","No sooner had we arrived than it began to rain.","No sooner did we arrive than it began to rain.","No sooner we arrived than it began to rain."],"answer":"No sooner had we arrived than it began to rain.","explanation":"No sooner + had (auxiliary) + we - past perfect. Both correct options work but had arrived is more formal."},{"q":"'Only by _____ can we address this crisis.'","opts":["working together can","we working together","working together we","working together do we"],"answer":"working together can","explanation":"Only by + gerund + auxiliary + subject - only by working together can we."}]},{"type":"builder","title":"Build the inverted sentence","sub":"Put the words in the correct order.","items":[{"words":["never","have","I","encountered","such","hostility"],"answer":"never have I encountered such hostility","context":"Never + have + I."},{"words":["not","only","did","she","refuse","but","she","also","complained"],"answer":"not only did she refuse but she also complained","context":"Not only did + subject + base verb."},{"words":["so","exhausted","was","he","that","he","fell","asleep","immediately"],"answer":"so exhausted was he that he fell asleep immediately","context":"So + adjective + was + subject + that."},{"words":["only","after","the","meeting","did","we","understand","the","implications"],"answer":"only after the meeting did we understand the implications","context":"Only after + noun + did + subject."}]}]},{"id":"cleft","title":"Cleft sentences","subtitle":"It was John who called, What I need is rest","intro":"Splitting a sentence in two so all the light falls on the part you want to emphasise.","desc":"Cleft sentences take a simple idea and restructure it to place strong emphasis on one specific element. They are common in speech and formal writing, and they show sophisticated command of English syntax.","tip":"The name comes from the Latin for 'split' - you cleave a normal sentence apart and drop in a focusing frame. Most of my students understand clefts when they read them but never produce them. At B2 the real goal is using them confidently yourself, in both speech and writing.","explanation":"<p>Cleft sentences split a normal sentence to emphasise one particular element. There are two main types.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>It-cleft: It + be + emphasised element + relative clause.<\/strong><br>\n<em>\"It was John who called.\"<\/em> (not someone else - John specifically)<br>\n<em>\"It was yesterday that I saw her.\"<\/em> (not today or last week)<br>\n<em>\"It was the noise that woke me.\"<\/em> (not light or a smell)<br>\nThe emphasised element can be a person (who), thing (that/which), time (that/when), or place (that/where).<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Wh-cleft (pseudo-cleft): What/All + subject + verb + be + emphasis.<\/strong><br>\n<em>\"What I need is a long holiday.\"<\/em> / <em>\"What surprised me was her reaction.\"<\/em> / <em>\"All I want is a cup of tea.\"<\/em><br>\nThe <em>what<\/em> clause acts as the subject - followed by <em>be<\/em> + the new information.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Reverse wh-cleft:<\/strong> Emphasis + be + what/who + subject + verb.<br>\n<em>\"A long holiday is what I need.\"<\/em> / <em>\"Her reaction was what surprised me.\"<\/em> - same meaning as wh-cleft but reversed for stylistic variation.<\/div><\/div>\n<div class=\"note\"><strong>When to use clefts:<\/strong> to correct a misunderstanding (<em>\"No, it was Tuesday that we met, not Wednesday\"<\/em>), to highlight new/unexpected information, or to add rhetorical emphasis in formal speech or writing.<br>\n<strong>Register note:<\/strong> It-clefts are used in both formal and informal contexts. Wh-clefts feel slightly more formal and are very common in academic writing: <em>\"What this study demonstrates is that...\"<\/em><\/div>","table":{"headers":["Type","Structure","Example"],"rows":[["It-cleft","It + be + focus + relative clause","It was Maria who found the solution."],["It-cleft (time)","It + be + time expression + that","It was in 2019 that everything changed."],["Wh-cleft","What + S + V + be + focus","What I need is a long break."],["All-cleft","All + S + V + be + focus","All I want is the truth."],["Reverse wh-cleft","Focus + be + what + S + V","The truth is what I want."],["It-cleft (negative)","It + wasn't/isn't + focus + that","It wasn't the money that motivated her."]]},"examples":[{"type":"pos","eng":"It was the discovery of penicillin that transformed modern medicine.","note":"It-cleft emphasising cause - the discovery, not anything else."},{"type":"pos","eng":"What this research shows is that early intervention makes a significant difference.","note":"Wh-cleft - common in academic writing."},{"type":"pos","eng":"All she wanted was to be left alone.","note":"All-cleft - emphasises limitation/exclusivity."},{"type":"pos","eng":"It wasn't the result that surprised us - it was the scale of it.","note":"Negative it-cleft for contrast."}],"errors":[{"bad":"It was John that he called.","good":"It was John who called.","reason":"It-cleft with a person: who (not that he) - the subject form is needed."},{"bad":"What I need it is a long holiday.","good":"What I need is a long holiday.","reason":"Wh-cleft: no extra pronoun (it) before is."},{"bad":"It was yesterday when I saw her.","good":"It was yesterday that I saw her.","reason":"It-cleft with time: that (not when) in standard it-cleft."}],"realUse":[],"richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Cleft sentence types<\/div>\n<table class=\"rich-table\"><thead><tr><th>Type<\/th><th>Structure<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>It-cleft (person)<\/td><td>It + was + focus + who + clause<\/td><td><em>\"It was Maria who found the solution.\"<\/em><\/td><\/tr>\n<tr><td>It-cleft (thing)<\/td><td>It + was + focus + that + clause<\/td><td><em>\"It was the noise that woke me.\"<\/em><\/td><\/tr>\n<tr><td>It-cleft (time/place)<\/td><td>It + was + time/place + that + clause<\/td><td><em>\"It was in 2019 that everything changed.\"<\/em><\/td><\/tr>\n<tr><td>Negative it-cleft<\/td><td>It + wasn't + focus + that + clause<\/td><td><em>\"It wasn't the money that motivated her.\"<\/em><\/td><\/tr>\n<tr><td>Wh-cleft<\/td><td>What + subject + verb + be + focus<\/td><td><em>\"What I need is a long holiday.\"<\/em><\/td><\/tr>\n<tr><td>All-cleft<\/td><td>All + subject + verb + be + focus<\/td><td><em>\"All she wanted was the truth.\"<\/em><\/td><\/tr>\n<tr><td>Reverse wh-cleft<\/td><td>Focus + be + what + subject + verb<\/td><td><em>\"A long holiday is what I need.\"<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Before → after: cleft in action<\/div>\n<div class=\"transform-demo\">\n<div class=\"transform-demo-row\"><div class=\"tdl\">Maria found the solution. (emphasise Maria)<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">It was Maria who found the solution.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">The noise woke me. (emphasise the noise)<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">It was the noise that woke me.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">I find her dedication most impressive.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">What I find most impressive is her dedication.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">She only wanted the truth.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">All she wanted was the truth.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">The company was founded in 2019. (emphasise 2019)<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">It was in 2019 that the company was founded.<\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">⚠ Common errors<\/div>\n<table class=\"rich-table\"><tbody>\n<tr><td>It was John <strong>who<\/strong> called ✓<\/td><td>Person in subject position → <strong>who<\/strong>, not that<\/td><\/tr>\n<tr><td>What I need <strong>is<\/strong> rest ✓ - NOT <em>\"What I need it is rest\"<\/em><\/td><td>No extra pronoun before be in wh-cleft<\/td><\/tr>\n<tr><td>All she wanted <strong>was<\/strong> the truth ✓ - NOT <em>\"All what she wanted\"<\/em><\/td><td>No what after All<\/td><\/tr>\n<tr><td>It was yesterday <strong>that<\/strong> I saw her ✓ - NOT <em>\"when\"<\/em><\/td><td>Time expressions in it-clefts → that<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","exercises":[{"type":"gap","title":"Form the cleft sentence","sub":"Rewrite using the cleft structure indicated in brackets.","items":[{"answer":"It was Maria who discovered the error.","before":"Maria discovered the error. → ","after":"(It-cleft - emphasise Maria)"},{"answer":"It was in 2019 that the company was founded.","before":"The company was founded in 2019. → ","after":"(It-cleft - emphasise the time)"},{"answer":"What I find most impressive is her dedication.","before":"I find her dedication most impressive. → ","after":"(Wh-cleft)"},{"answer":"All they wanted was a fair hearing.","before":"They only wanted a fair hearing. → ","after":"(All-cleft)"},{"answer":"It wasn't the cost that bothered me - it was the principle.","before":"The principle bothered me, not the cost. → ","after":"(Negative it-cleft)"},{"answer":"What this research demonstrates is that diet affects cognition.","before":"This research demonstrates that diet affects cognition. → ","after":"(Wh-cleft - academic)"}]},{"type":"mc","title":"Which cleft structure?","sub":"Choose the correct cleft sentence.","items":[{"q":"Emphasise 'the noise' in: 'The noise woke me.'","opts":["It was the noise that woke me.","It was the noise who woke me.","What woke me it was the noise.","It was the noise woke me."],"answer":"It was the noise that woke me.","explanation":"It-cleft with a thing: It + was + the noise + that + verb."},{"q":"'I find her persistence most admirable.' (wh-cleft)","opts":["It is her persistence that I find most admirable.","What I find most admirable is her persistence.","Her persistence is that I find admirable.","What is her persistence that I find admirable."],"answer":"What I find most admirable is her persistence.","explanation":"Wh-cleft: What + subject + verb + be + emphasis."},{"q":"'She only wanted the truth.' (all-cleft)","opts":["It was the truth that she wanted.","What she wanted all was the truth.","All she wanted was the truth.","All what she wanted was the truth."],"answer":"All she wanted was the truth.","explanation":"All-cleft: All + subject + verb + be + emphasis. No 'what' after all."},{"q":"Correct the error: 'What I want it is a solution.'","opts":["What I want is a solution.","It is a solution what I want.","What I want that is a solution.","What is I want is a solution."],"answer":"What I want is a solution.","explanation":"Wh-cleft: no extra pronoun (it) before be."}]},{"type":"builder","title":"Build the cleft sentence","sub":"Put the words in the correct order.","items":[{"words":["it","was","her","generosity","that","impressed","me","most"],"answer":"it was her generosity that impressed me most","context":"It-cleft emphasising her generosity."},{"words":["what","this","study","shows","is","that","exercise","reduces","stress"],"answer":"what this study shows is that exercise reduces stress","context":"Wh-cleft - academic."},{"words":["all","I","need","is","a","decent","night's","sleep"],"answer":"all I need is a decent night's sleep","context":"All-cleft."},{"words":["it","wasn't","the","money","that","motivated","her","but","the","challenge"],"answer":"it wasn't the money that motivated her but the challenge","context":"Negative it-cleft with contrast."}]}]},{"id":"linkingb2","title":"Linking words - advanced","subtitle":"notwithstanding, admittedly, by contrast","intro":"The sophisticated connectors that hold formal writing and advanced discourse together.","desc":"At B1 you learnt despite, whereas, however, therefore. At B2 the range expands significantly - particularly for formal and academic writing. These connectors signal nuanced logical relationships: concession, qualification, contrast, exemplification, clarification.","tip":"At B2 the skill isn't just knowing these connectors - it's placing and punctuating them correctly. <em>Admittedly, nevertheless, however<\/em> open a sentence with a comma. <em>Nevertheless<\/em> lands harder than <em>however<\/em>; <em>notwithstanding<\/em> behaves like <em>despite<\/em> but more formally; <em>by contrast<\/em> is more emphatic than <em>on the other hand<\/em>. The nuance is the whole point.","explanation":"<p>Advanced linking expressions for formal writing, academic essays, and professional communication.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Concession and qualification:<\/strong><br>\n<em>Admittedly<\/em> = I acknowledge this point (even though it goes against my argument). <em>\"Admittedly, the evidence is limited.\"<\/em><br>\n<em>Nevertheless / nonetheless<\/em> = strong contrast despite concession. <em>\"The data is incomplete. Nevertheless, certain trends are clear.\"<\/em><br>\n<em>That said / having said that<\/em> = informal spoken equivalent of nevertheless. <em>\"It's expensive. That said, the quality is exceptional.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Contrast and comparison:<\/strong><br>\n<em>By contrast / in contrast<\/em> = sharper contrast than <em>on the other hand<\/em>. <em>\"Sales rose in Europe. By contrast, Asian markets saw a decline.\"<\/em><br>\n<em>Conversely<\/em> = the opposite is true. <em>\"Higher prices reduce demand. Conversely, lower prices stimulate it.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Addition and emphasis:<\/strong><br>\n<em>What is more / moreover / furthermore<\/em> = adding a stronger or additional point. <em>\"The plan is costly. What is more, it is unlikely to succeed.\"<\/em><br>\n<em>Indeed<\/em> = emphatic addition or confirmation. <em>\"This is a serious problem. Indeed, it may be the most serious we face.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Exemplification and clarification:<\/strong><br>\n<em>Notably / in particular<\/em> = highlighting a specific example. <em>\"Several issues arose, notably the question of funding.\"<\/em><br>\n<em>That is to say / namely<\/em> = clarifying or specifying. <em>\"One country stood out, namely Portugal.\"<\/em><br>\n<em>In other words<\/em> = restating more simply. <em>\"The project was a failure - in other words, we wasted a year.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>Notwithstanding<\/strong> is a formal preposition/adverb meaning 'despite' or 'in spite of'. As a preposition it follows or precedes the noun phrase: <em>\"Notwithstanding the difficulties, we succeeded.\"<\/em> / <em>\"The decision was made, the risks notwithstanding.\"<\/em> It is more formal than <em>despite<\/em>.<br>\n<strong>Position matters:<\/strong> Most of these connectors go at the start of a new sentence or clause, followed by a comma. They generally cannot join two clauses with only a comma between them (comma splice). Use a full stop or semicolon before them.<\/div>","table":{"headers":["Connector","Function","Position/Structure"],"rows":[["admittedly","acknowledge a point that may weaken your argument","Start of sentence + comma"],["nevertheless / nonetheless","strong contrast/concession (= despite this)","Start of sentence + comma"],["that said / having said that","informal spoken concession","Start of sentence + comma"],["by contrast / in contrast","sharp contrast","Start of sentence + comma"],["conversely","the opposite is true","Start of sentence + comma"],["what is more / moreover","add a stronger point","Start of sentence + comma"],["indeed","emphatic confirmation or addition","Start of sentence/mid-clause + comma"],["notably / in particular","highlight specific example","Start of sentence or mid-clause"],["namely","specify exactly what/who","Before the specific item"],["notwithstanding","formal: despite / in spite of","Before noun phrase or after it"]]},"examples":[{"type":"pos","eng":"The methodology has limitations. Admittedly, the sample size was small.","note":"Admittedly - conceding a weakness before defending the argument."},{"type":"pos","eng":"The results were inconclusive. Nevertheless, they provide a useful baseline.","note":"Nevertheless - strong pivot after concession."},{"type":"pos","eng":"Costs rose sharply in Q3. By contrast, Q4 showed significant improvement.","note":"By contrast - sharp factual contrast between two periods."},{"type":"pos","eng":"The plan is ambitious - indeed, some would say reckless.","note":"Indeed - emphatic addition, escalating the point."}],"errors":[{"bad":"The evidence is strong, admittedly there are gaps.","good":"The evidence is strong. Admittedly, there are gaps.","reason":"Admittedly starts a new sentence - it cannot join two clauses with just a comma."},{"bad":"Sales fell in Europe, by contrast Asian markets grew.","good":"Sales fell in Europe. By contrast, Asian markets grew.","reason":"By contrast starts a new sentence - needs a full stop before it."},{"bad":"The results were poor, nevertheless the team continued.","good":"The results were poor. Nevertheless, the team continued.","reason":"Nevertheless starts a new sentence - full stop before it."}],"realUse":[],"richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Concession & qualification<\/div>\n<table class=\"rich-table\"><thead><tr><th>Connector<\/th><th>Use<\/th><th>Structure<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>Admittedly<\/td><td>Acknowledge a weakness in your argument<\/td><td>New sentence + comma<\/td><td><em>Admittedly, the sample was small.<\/em><\/td><\/tr>\n<tr><td>Nevertheless / nonetheless<\/td><td>Strong contrast despite concession<\/td><td>New sentence + comma<\/td><td><em>The data is limited. Nevertheless, trends are clear.<\/em><\/td><\/tr>\n<tr><td>That said / having said that<\/td><td>Informal concession pivot<\/td><td>New sentence<\/td><td><em>It's expensive. That said, the quality is superb.<\/em><\/td><\/tr>\n<tr><td>Notwithstanding<\/td><td>Formal: despite / in spite of<\/td><td>+ noun phrase (before or after)<\/td><td><em>Notwithstanding the risks, they proceeded.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Contrast & comparison<\/div>\n<table class=\"rich-table\"><thead><tr><th>Connector<\/th><th>Use<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>By contrast / in contrast<\/td><td>Sharper factual contrast than \"on the other hand\"<\/td><td><em>Sales rose in Europe. By contrast, Asia saw decline.<\/em><\/td><\/tr>\n<tr><td>Conversely<\/td><td>The opposite is true<\/td><td><em>Higher rates slow inflation. Conversely, they can cause recession.<\/em><\/td><\/tr>\n<tr><td>Whereas<\/td><td>Direct parallel contrast within a sentence<\/td><td><em>She earns more, whereas she saves less.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Addition & emphasis<\/div>\n<table class=\"rich-table\"><thead><tr><th>Connector<\/th><th>Use<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>What is more / moreover / furthermore<\/td><td>Adding a stronger point<\/td><td><em>The plan is costly. What is more, it is untested.<\/em><\/td><\/tr>\n<tr><td>Indeed<\/td><td>Emphatic confirmation or escalation<\/td><td><em>This is serious. Indeed, it may be the worst crisis yet.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Exemplification & clarification<\/div>\n<table class=\"rich-table\"><thead><tr><th>Connector<\/th><th>Use<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>Notably / in particular<\/td><td>Highlight a specific example<\/td><td><em>Several issues arose, notably the question of funding.<\/em><\/td><\/tr>\n<tr><td>Namely<\/td><td>Specify exactly who/what<\/td><td><em>One country stood out, namely Portugal.<\/em><\/td><\/tr>\n<tr><td>That is to say / in other words<\/td><td>Restate or clarify<\/td><td><em>The project failed - in other words, a year was wasted.<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">⚠ Punctuation rules<\/div>\n<table class=\"rich-table\"><tbody>\n<tr><td>Admittedly / Nevertheless / However / Therefore<\/td><td>Always <strong>full stop before, comma after<\/strong>. Never join two clauses with a comma alone.<\/td><\/tr>\n<tr><td>Notwithstanding<\/td><td>Preposition - directly before the noun phrase. No comma needed unless fronted.<\/td><\/tr>\n<tr><td>Whereas / while (contrast)<\/td><td>Join two clauses in the same sentence. Comma before whereas/while.<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","exercises":[{"type":"gap","title":"Choose the correct connector","sub":"Fill each gap with the most appropriate advanced connector.","items":[{"answer":"Admittedly","before":"","after":", the data has limitations, but the overall trend is clear."},{"answer":"Nevertheless","before":"The project faced serious setbacks. ","after":", the team delivered on time."},{"answer":"By contrast","before":"The northern region saw rapid growth. ","after":", the south experienced decline."},{"answer":"indeed","before":"This is a serious issue - ","after":", the most serious the company has faced."},{"answer":"notably","before":"Several problems emerged, ","after":" the question of long-term funding."},{"answer":"Notwithstanding","before":"","after":" the risks involved, the committee approved the proposal."},{"answer":"Conversely","before":"Higher interest rates slow inflation. ","after":", they can trigger recession."},{"answer":"What is more","before":"The plan is expensive. ","after":", it is unlikely to succeed."}]},{"type":"mc","title":"Which connector?","sub":"Choose the most appropriate connector.","items":[{"q":"The methodology was sound. _____, the sample size was too small to be conclusive.","opts":["Admittedly","Conversely","Indeed","Namely"],"answer":"Admittedly","explanation":"Admittedly = conceding a weakness while defending the overall position."},{"q":"Sales in Europe rose sharply. _____, North American figures fell.","opts":["Indeed","Admittedly","By contrast","Notwithstanding"],"answer":"By contrast","explanation":"By contrast = sharp factual contrast between two comparable things."},{"q":"The report identified one critical risk, _____ the lack of adequate oversight.","opts":["namely","notably","conversely","what is more"],"answer":"namely","explanation":"Namely = specifying exactly what the one thing is."},{"q":"The results were disappointing. _____, they were far worse than last year.","opts":["Admittedly","Indeed","By contrast","Conversely"],"answer":"Indeed","explanation":"Indeed = emphatic confirmation/escalation of the previous point."}]},{"type":"transform","title":"Sentence transformation","sub":"Rewrite using the connector given.","items":[{"original":"Despite the difficulties, the project succeeded.","keyword":"Notwithstanding","answer":"Notwithstanding the difficulties, the project succeeded."},{"original":"Although the sample is small, the findings are significant.","keyword":"Admittedly","answer":"Admittedly, the sample is small. Nevertheless, the findings are significant."},{"original":"The first experiment failed. The second succeeded.","keyword":"By contrast","answer":"The first experiment failed. By contrast, the second succeeded."},{"original":"Several figures stand out - especially Martinez and Chen.","keyword":"notably","answer":"Several figures stand out, notably Martinez and Chen."},{"original":"The plan is risky. It is also very expensive.","keyword":"What is more","answer":"The plan is risky. What is more, it is very expensive."}]}]},{"id":"emphasis","title":"Emphatic structures","subtitle":"do/does/did, so...that, such...that, the + comparative","intro":"The grammatical levers you can pull to add weight and intensity to a statement.","desc":"Emphatic structures allow speakers and writers to add force, surprise, or intensity to what they say. They are common in both formal and informal English - from academic writing to emotional speech. At B2, productive control of these structures is expected.","tip":"The emphatic <em>do/does/did<\/em> is badly underused by learners, and it's beautifully natural in speech: <em>\"I do understand your concerns\"<\/em> in a meeting, or <em>\"She did call\"<\/em> to contradict someone. Most students only meet it as a question auxiliary and never reach for it to emphasise a plain statement - so make it yours.","explanation":"<p>Emphatic structures add force, surprise, or intensity to statements. Several grammatical patterns achieve this effect.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Emphatic do/does/did<\/strong> - adding do/does/did to a positive statement for emphasis, contradiction, or concession. The main verb returns to base form.<br>\n<em>\"I do understand your point.\"<\/em> (emphasis - reassuring) / <em>\"She did call, despite what you think.\"<\/em> (contradiction) / <em>\"He does try his best, even if the results disappoint.\"<\/em> (concession)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>So + adjective/adverb + that<\/strong> - expressing degree with a result. <em>\"She spoke so quickly that I couldn't follow.\"<\/em> / <em>\"The problem is so serious that immediate action is required.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Such + (a/an) + (adjective) + noun + that<\/strong> - expressing degree with a noun focus. <em>\"It was such a complex problem that no one solution existed.\"<\/em> / <em>\"Such was the scale of the disaster that aid poured in from around the world.\"<\/em> (formal/inverted)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>The + comparative + the + comparative<\/strong> - parallel comparison expressing proportional relationship. <em>\"The more you practise, the better you get.\"<\/em> / <em>\"The earlier we start, the more time we'll have.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">5<\/div><div class=\"rule-text\"><strong>Emphatic reflexive pronouns<\/strong> - for exclusion or emphasis on personal involvement. <em>\"I'll do it myself.\"<\/em> / <em>\"The president himself attended.\"<\/em> / <em>\"She said so herself.\"<\/em><\/div><\/div>\n<div class=\"note\"><strong>So vs such:<\/strong> Both express degree, but different structures.<br>\n<em>So + adjective/adverb<\/em>: <em>\"It was so beautiful.\"<\/em><br>\n<em>Such + a/an + adjective + noun<\/em>: <em>\"It was such a beautiful place.\"<\/em><br>\n<em>\"Such beautiful scenery.\"<\/em> (uncountable/plural - no article)<br>\nA common error: <em>\"It was so a beautiful place.\"<\/em> ✗ → <em>\"It was such a beautiful place.\"<\/em> ✓<\/div>","table":{"headers":["Structure","Example","Effect"],"rows":[["Emphatic do/does/did","I do appreciate your help.","Reassurance, contradiction, concession"],["So + adj/adv + that","She was so tired that she fell asleep standing up.","Degree + result"],["Such (a/an) + adj + noun + that","It was such a shock that she couldn't speak.","Degree + result (noun focus)"],["Such was + noun + that","Such was the excitement that no one slept.","Formal/inverted degree"],["The + comp + the + comp","The harder you work, the luckier you get.","Proportional relationship"],["Reflexive for emphasis","He built it himself. / The CEO himself resigned.","Personal involvement or exclusion"]]},"examples":[{"type":"pos","eng":"I do appreciate how difficult this must be for you.","note":"Emphatic do - reassurance/acknowledgement."},{"type":"pos","eng":"The report was so detailed that it took a week to review.","note":"So + adjective + that - degree and result."},{"type":"pos","eng":"It was such an unexpected development that no one knew how to respond.","note":"Such a/an + adjective + noun + that."},{"type":"pos","eng":"The more transparent the process, the more trust it will generate.","note":"The + comparative + the + comparative."}],"errors":[{"bad":"It was so a beautiful evening.","good":"It was such a beautiful evening.","reason":"Before a/an + adjective + noun → such. So is followed directly by the adjective without a noun."},{"bad":"The more you practise, the more better you get.","good":"The more you practise, the better you get.","reason":"The + comparative - just the comparative form. Better already IS comparative. Not more better."},{"bad":"Such the impact was great that everyone noticed.","good":"Such was the impact that everyone noticed.","reason":"Such was + noun - the verb be comes directly after such."}],"realUse":[],"richContent":"\n<div class=\"rich-section\">\n<div class=\"rich-heading\">Emphatic do/does/did<\/div>\n<table class=\"rich-table\"><thead><tr><th>Use<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>Reassurance / concession<\/td><td><em>\"I do understand your concerns.\"<\/em> / <em>\"He does try his best.\"<\/em><\/td><\/tr>\n<tr><td>Contradiction<\/td><td><em>\"She did call - I heard her.\"<\/em> / <em>\"I did send the email.\"<\/em><\/td><\/tr>\n<tr><td>Insistence<\/td><td><em>\"Do come in!\"<\/em> / <em>\"Do sit down.\"<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">So...that vs Such...that<\/div>\n<table class=\"rich-table\"><thead><tr><th>Structure<\/th><th>Follows<\/th><th>Example<\/th><\/tr><\/thead><tbody>\n<tr><td>so + adjective/adverb + that<\/td><td>Adjective or adverb - no noun<\/td><td><em>\"It was so cold that the pipes froze.\"<\/em> / <em>\"She spoke so quickly that I couldn't follow.\"<\/em><\/td><\/tr>\n<tr><td>such a/an + adjective + noun + that<\/td><td>Singular countable noun<\/td><td><em>\"It was such a shock that she wept.\"<\/em><\/td><\/tr>\n<tr><td>such + adjective + noun + that<\/td><td>Uncountable or plural noun<\/td><td><em>\"Such beautiful scenery that we stopped the car.\"<\/em><\/td><\/tr>\n<tr><td>Such was + noun + that<\/td><td>Formal/inverted - noun first<\/td><td><em>\"Such was the scale of the disaster that...\"<\/em><\/td><\/tr>\n<\/tbody><\/table>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">The + comparative + the + comparative<\/div>\n<div class=\"transform-demo\">\n<div class=\"transform-demo-row\"><div class=\"tdl\">As practice increases, performance improves.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">The more you practise, the better you get.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">As the problem gets harder, more people give up.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">The harder the problem, the more people give up.<\/div><\/div>\n<div class=\"transform-demo-row\"><div class=\"tdl\">As costs rise, profit shrinks.<\/div><div class=\"tdarrow\">→<\/div><div class=\"tdr\">The higher the costs, the lower the profit.<\/div><\/div>\n<\/div>\n<\/div>\n<div class=\"rich-section\">\n<div class=\"rich-heading\">⚠ So vs Such<\/div>\n<table class=\"rich-table\"><tbody>\n<tr><td><em>\"It was <strong>so<\/strong> a beautiful city.\"<\/em> ✗<\/td><td>No noun directly after so → use such: <em>\"such a beautiful city\"<\/em> ✓<\/td><\/tr>\n<tr><td><em>\"It was <strong>such<\/strong> cold.\"<\/em> ✗<\/td><td>No noun → use so: <em>\"it was so cold\"<\/em> ✓<\/td><\/tr>\n<tr><td><em>\"The more better you get\"<\/em> ✗<\/td><td>The + comparative only: <em>\"the better you get\"<\/em> ✓<\/td><\/tr>\n<\/tbody><\/table>\n<\/div>","exercises":[{"type":"gap","title":"Emphatic structures","sub":"Fill each gap with the correct emphatic form.","items":[{"answer":"do","before":"I ","after":" understand your concerns - please let me explain."},{"answer":"such","before":"It was ","after":" a difficult decision that she couldn't sleep for days."},{"answer":"so","before":"He spoke ","after":" quickly that nobody could follow him."},{"answer":"the harder","before":"","after":" you work, the luckier you get."},{"answer":"did","before":"She ","after":" warn us - we just didn't listen."},{"answer":"such was","before":"","after":" the excitement that the whole city came out to celebrate."},{"answer":"the more","before":"","after":" I learn, the more I realise how much I don't know."},{"answer":"himself","before":"The prime minister ","after":" attended the ceremony."}]},{"type":"mc","title":"So or such?","sub":"Choose the correct structure.","items":[{"q":"It was _____ a challenging project that the whole team was exhausted.","opts":["so","such","very","too"],"answer":"such","explanation":"Such + a + adjective + noun. 'Such a challenging project' - noun follows."},{"q":"She was _____ tired that she fell asleep in the meeting.","opts":["such","very","so","too"],"answer":"so","explanation":"So + adjective (no noun following directly). 'So tired' - adjective only."},{"q":"It was _____ difficult terrain that the rescue took three days.","opts":["so","such","too","very"],"answer":"such","explanation":"Such + adjective + noun (no article because terrain is uncountable)."},{"q":"The traffic was _____ bad that I missed the flight.","opts":["such","very","so","much"],"answer":"so","explanation":"So + adjective. 'So bad' - adjective without article/noun."}]},{"type":"builder","title":"Build the emphatic sentence","sub":"Put the words in the correct order.","items":[{"words":["the","more","you","read","the","better","your","writing","becomes"],"answer":"the more you read the better your writing becomes","context":"Proportional comparative - the more...the better."},{"words":["it","was","such","an","inspiring","speech","that","everyone","stood","up"],"answer":"it was such an inspiring speech that everyone stood up","context":"Such a/an + adjective + noun + that."},{"words":["I","do","think","you","should","reconsider","this","decision"],"answer":"I do think you should reconsider this decision","context":"Emphatic do - strong recommendation."},{"words":["such","was","the","impact","of","the","report","that","policy","changed"],"answer":"such was the impact of the report that policy changed","context":"Such was - formal inverted degree."}]}]},{"id":"causativeadv","title":"Causative - advanced","subtitle":"have someone do, get something done, need doing","intro":"The full sweep of causative structures - including naming the person who does the job for you.","desc":"At B1 you learnt have/get + object + past participle (the standard causative). At B2 the system expands to include: have/get + someone + do something (active causative), need/want + object + past participle, and the need + -ing structure. These distinctions matter both for meaning precision and for exam performance.","tip":"What B2 adds to the B1 causative is the <em>active<\/em> version. <em>\"I had him fix it\"<\/em> names the specific person who did it (active); <em>\"I had it fixed\"<\/em> just says it got done (passive). The passive hides the agent, the active puts them centre stage - choose depending on whether the doer matters.","explanation":"<p>The causative system at B2 extends the B1 form to include active causative, need + -ing, and more complex arrangements.<\/p>\n<div class=\"rule\"><div class=\"rule-num\">1<\/div><div class=\"rule-text\"><strong>Have/get + object + past participle<\/strong> (B1 review) - arrange for someone else to do something; the person doing it is not mentioned. <em>\"I had my car serviced.\"<\/em> / <em>\"She got her hair done.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">2<\/div><div class=\"rule-text\"><strong>Have/get + person + base verb (bare infinitive)<\/strong> - active causative; you cause a specific person to do something. <em>\"I'll have the technician check it.\"<\/em> / <em>\"She got her assistant to book the tickets.\"<\/em> (Note: get + person + to + infinitive; have + person + bare infinitive)<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">3<\/div><div class=\"rule-text\"><strong>Need + -ing<\/strong> - something requires attention; the -ing form has a passive meaning. <em>\"The car needs servicing.\"<\/em> = the car needs to be serviced. <em>\"The report needs revising.\"<\/em> = the report needs to be revised. Common in British English for repairs and maintenance.<\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">4<\/div><div class=\"rule-text\"><strong>Want/would like + object + past participle<\/strong> - expressing a desire for a causative outcome. <em>\"I want this report checked by Friday.\"<\/em> / <em>\"She'd like the flat repainted.\"<\/em><\/div><\/div>\n<div class=\"rule\"><div class=\"rule-num\">5<\/div><div class=\"rule-text\"><strong>Have something happen (unwanted causative)<\/strong> - something happened to you (often negative, unplanned). <em>\"She had her bag stolen.\"<\/em> / <em>\"He had his application rejected.\"<\/em> - same structure, but the meaning is something that happened to the subject, not something they arranged.<\/div><\/div>\n<div class=\"note\"><strong>Have + person + bare infinitive vs get + person + to + infinitive:<\/strong><br>\n<em>\"I had the plumber fix the leak.\"<\/em> - have + bare infinitive. More formal.<br>\n<em>\"I got the plumber to fix the leak.\"<\/em> - get + to + infinitive. More informal.<br>\n<strong>Need + -ing vs need to be + past participle:<\/strong><br>\n<em>\"The car needs servicing.\"<\/em> = <em>\"The car needs to be serviced.\"<\/em> - both equally correct.<br>\n<em>\"I need to service the car.\"<\/em> - different: I will do it myself.<\/div>","table":{"headers":["Structure","Example","Meaning"],"rows":[["have + object + pp","I had my hair cut.","Arrange for someone to do it (agent not mentioned)"],["get + object + pp","She got her laptop fixed.","Same - more informal"],["have + person + bare inf","I had the mechanic check the brakes.","Cause a specific person to do it (active, formal)"],["get + person + to + inf","She got her assistant to book it.","Cause a specific person to do it (active, informal)"],["need + -ing","The roof needs repairing.","Something requires attention (passive meaning)"],["want/would like + obj + pp","I want the report finished by Friday.","Express desire for a causative outcome"],["have + obj + pp (unwanted)","She had her bag stolen.","Something happened to the subject (not arranged)"]]},"examples":[{"type":"pos","eng":"I'll have the IT department look into the problem.","note":"Have + person + bare infinitive - active causative, formal."},{"type":"pos","eng":"She got the designer to completely overhaul the website.","note":"Get + person + to + infinitive - active causative, informal."},{"type":"pos","eng":"The boiler needs replacing - it's twenty years old.","note":"Need + -ing - passive meaning, British English."},{"type":"pos","eng":"I'd like this document translated by Monday.","note":"Would like + object + past participle - causative desire."}],"errors":[{"bad":"I got the mechanic fix my car.","good":"I got the mechanic to fix my car.","reason":"Get + person + to + infinitive - need to after get with a person."},{"bad":"The report needs to revising.","good":"The report needs revising.","reason":"Need + -ing - just the gerund, no to before it."},{"bad":"I had the technician to check the system.","good":"I had the technician check the system.","reason":"Have + person + bare infinitive - no to after have."}],"realUse":[],"exercises":[{"type":"gap","title":"Active and passive causative","sub":"Fill each gap with the correct causative form.","items":[{"answer":"had the technician check","before":"I ","after":" the system before the launch. (have + person + bare inf)"},{"answer":"got her assistant to book","before":"She ","after":" the flights. (get + person + to inf)"},{"answer":"needs repainting","before":"The kitchen ","after":" - it's looking very tired. (need + -ing)"},{"answer":"having her portrait painted","before":"She's ","after":" at the moment. (have + obj + pp - present continuous)"},{"answer":"had his wallet stolen","before":"He ","after":" on the train. (unwanted causative)"},{"answer":"want this finished","before":"I ","after":" by Friday. (want + obj + pp)"}]},{"type":"mc","title":"Which causative?","sub":"Choose the correct form.","items":[{"q":"I need _____ - it's making a strange noise.","opts":["my car to check","my car checking","to check my car have","have my car checked"],"answer":"have my car checked","explanation":"Standard passive causative: have + object + past participle."},{"q":"She _____ to update the spreadsheet.","opts":["had her colleague","got her colleague","had got her colleague","made her colleague"],"answer":"got her colleague","explanation":"Get + person + to + infinitive - got her colleague to update."},{"q":"The report _____ before submission.","opts":["needs to revising","needs revise","needs revising","need to be revise"],"answer":"needs revising","explanation":"Need + -ing - passive meaning. Needs revising = needs to be revised."},{"q":"I'm afraid she _____ at the border.","opts":["had her passport confiscating","got her passport confiscated","had confiscated her passport","had her passport confiscate"],"answer":"got her passport confiscated","explanation":"Unwanted causative: got + object + past participle - something happened to her."}]},{"type":"convo","title":"Fill the conversation","sub":"Complete the dialogue using the correct causative form.","lines":[{"speaker":"A","text":"The office is a mess. I think we need [to have it redecorated]."},{"speaker":"B","text":"Agreed. I'll [get someone to come in] and give us a quote."},{"speaker":"A","text":"Also, the photocopier [needs servicing] - it's been jamming constantly."},{"speaker":"B","text":"I'll [have the maintenance team look at] it this afternoon."},{"speaker":"A","text":"And the security cameras - [have them checked] too."},{"speaker":"B","text":"Good idea. I'll [get an engineer to test] the whole system."}]}]}];</script>
<script>
(function(){
  var KEY='jpe_b2grammar_progress_v1';
  var done={}, current=0;
  try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); done=o.done||{}; current=o.current||0;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({done:done,current:current}));}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function norm(s){return String(s).toLowerCase().replace(/\s+/g,' ').replace(/[.,!?;:"']/g,'').trim();}
  function accepts(val,answer){ // answer may hold "/" alternatives
    var v=norm(val); return String(answer).split('/').map(norm).some(function(a){return a===v;});
  }
  var CHECK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  var ARROW='<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  var roadEl=document.getElementById('road'), lessonEl=document.getElementById('lesson');
  document.getElementById('pTotal').textContent=LESSONS.length;

  function updateProgress(){
    var n=Object.keys(done).filter(function(k){return done[k];}).length;
    document.getElementById('pDone').textContent=n;
    document.getElementById('pFill').style.width=(n/LESSONS.length*100)+'%';
  }
  function renderRoad(){
    roadEl.innerHTML=LESSONS.map(function(l,i){
      var cls='g-step'+(i===current?' active':'')+(done[l.id]?' done':'');
      var num=done[l.id]?CHECK:(i+1);
      return '<button class="'+cls+'" data-i="'+i+'"><span class="g-step-n">'+num+'</span><span class="g-step-t">'+esc(l.title)+'</span></button>';
    }).join('');
  }

  // ---------- exercise renderers ----------
  var exSeq=0;
  function fb(id){return '<div class="q-fb" id="'+id+'"></div>';}
  function showFb(id,cls,txt){var e=document.getElementById(id);if(!e)return;e.className='q-fb show '+cls;e.innerHTML=txt;}

  function renderExercise(ex, exNum){
    exSeq++; var eid='ex'+exSeq;
    function qn(j){return '<span class="q-num">'+(j+1)+'</span>';}
    var h='<div class="g-exercise"><div class="g-ex-title"><span class="g-ex-num">'+exNum+'</span>'+esc(ex.title)+'</div>'+(ex.sub?'<div class="g-ex-sub">'+esc(ex.sub)+'</div>':'')+'<div id="'+eid+'-body">';
    var items=ex.items||ex.lines||[];
    if(ex.type==='gap'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.before)+'<input class="gap-inp" data-a="'+esc(it.answer)+'" id="'+eid+'_'+j+'">'+esc(it.after)+'</div></div>';
      });
    } else if(ex.type==='mc'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.q)+'</div><div class="opts" data-ans="'+esc(it.answer)+'" data-exp="'+esc(it.explanation||'')+'">'+
           it.opts.map(function(o){return '<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='transform'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.original)+'<br><span style="font-size:.85rem;color:var(--muted)">Use: <strong>'+esc(it.keyword)+'</strong></span></div><input class="txt-inp" data-a="'+esc(it.answer)+'" id="'+eid+'_'+j+'">'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='ec'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+esc(it.wrong)+'</div><input class="txt-inp" data-a="'+esc(it.correct)+'" placeholder="Write the correct sentence" id="'+eid+'_'+j+'">'+fb(eid+'_f'+j)+(it.hint?'<div class="q-fb hint show" style="margin-top:6px">Hint: '+esc(it.hint)+'</div>':'')+'</div>';
      });
    } else if(ex.type==='tf'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text">'+qn(j)+'<em>'+esc(it.context)+'</em><br>'+esc(it.statement)+'</div><div class="opts" data-ans="'+esc(it.answer)+'" data-exp="'+esc(it.explanation||'')+'">'+
           ['True','False','Not given'].map(function(o){return '<button class="opt" data-o="'+o+'">'+o+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='convo'){
      items.forEach(function(ln){
        var idx=0;
        var text=String(ln.text).replace(/\[([^\]]+)\]/g,function(m,ans){idx++;return '<input class="gap-inp" data-a="'+esc(ans)+'">';});
        h+='<div class="convo-line"><span class="convo-sp">'+esc(ln.speaker)+'</span><span>'+text+'</span></div>';
      });
    } else if(ex.type==='builder'){
      items.forEach(function(it,j){
        h+='<div class="q"><div class="q-text"><span class="q-num">'+(j+1)+'</span><span style="font-size:.85rem;color:var(--muted)">'+esc(it.context||'')+'</span></div><div class="build-target" id="'+eid+'_t'+j+'" data-a="'+esc(it.answer)+'"></div><div class="build-bank" id="'+eid+'_b'+j+'">'+
           shuffle(it.words.slice()).map(function(w,k){return '<button class="word-chip" data-w="'+esc(w)+'">'+esc(w)+'</button>';}).join('')+'</div>'+fb(eid+'_f'+j)+'</div>';
      });
    } else if(ex.type==='categorise'){
      var bank=[]; ex.categories.forEach(function(c){c.items.forEach(function(it){bank.push({w:it,cat:c.name});});});
      h+='<div class="cat-bank" id="'+eid+'-bank">'+shuffle(bank.slice()).map(function(b){return '<button class="cat-item" data-w="'+esc(b.w)+'" data-cat="'+esc(b.cat)+'">'+esc(b.w)+'</button>';}).join('')+'</div><div class="cat-cols" style="grid-template-columns:repeat('+Math.min(ex.categories.length,3)+',1fr)">'+
         ex.categories.map(function(c){return '<div class="cat-col"><div class="cat-col-h">'+esc(c.name)+'</div><div class="cat-drop" data-cat="'+esc(c.name)+'"></div></div>';}).join('')+'</div>';
    }
    h+='</div><button class="chk-btn" data-check="'+eid+'" data-type="'+ex.type+'">Check answers</button><button class="chk-link" data-show="'+eid+'">Show answers</button><span class="ex-score" id="'+eid+'-score"></span></div>';
    return {html:h, eid:eid, ex:ex};
  }
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

  // ---------- lesson rendering ----------
  var exReg={};
  function renderLesson(i){
    current=i; save(); exSeq=0; exReg={};
    var l=LESSONS[i];
    var nEx=(l.exercises||[]).length;
    var h='<div class="g-card" style="padding-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px"><div class="g-eyebrow" style="margin-bottom:0">Lesson '+(i+1)+' of '+LESSONS.length+'</div><button class="g-export-btn" title="Save this lesson as a PNG image" aria-label="Save lesson as PNG image" onclick="exportLessonPNG('+i+',this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button></div>'+
      '<h2 class="g-lesson-title">'+esc(l.title)+'</h2>'+
      (l.subtitle?'<div class="g-lesson-sub">'+esc(l.subtitle)+'</div>':'')+
      (l.intro?'<div class="g-intro" style="margin-bottom:2px">'+l.intro+'</div>':'')+'</div>';
    h+='<div class="l-tabs"><button class="l-tab active" data-pane="learn">Learn</button><button class="l-tab" data-pane="practice">Practice'+(nEx?'<span class="l-tab-c">'+nEx+'</span>':'')+'</button></div>';
    var learn='<div class="g-card"><div class="g-body">'+(l.explanation||('<p>'+esc(l.desc||'')+'</p>'))+'</div>';
    if(l.table&&l.table.rows){learn+='<div class="g-sec-label">The forms</div><table class="g-table"><thead><tr>'+l.table.headers.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>'+l.table.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';}
    if(l.examples&&l.examples.length){learn+='<div class="g-sec-label">In action</div><div class="g-examples">'+l.examples.map(function(e){var t=e.type||'pos';var m=t==='neg'?'-':(t==='q'?'?':'+');return '<div class="g-ex '+t+'"><span class="g-ex-t">'+m+'</span><span class="g-ex-eng">'+esc(e.eng)+'</span>'+(e.note?'<div class="g-ex-note">'+esc(e.note)+'</div>':'')+'</div>';}).join('')+'</div>';}
    if(l.errors&&l.errors.length){learn+='<div class="g-sec-label">Watch out for</div><div class="g-errors">'+l.errors.map(function(e){return '<div class="g-err"><div class="g-err-line g-err-bad"><span class="mk">✗</span><span>'+esc(e.bad)+'</span></div><div class="g-err-line g-err-good"><span class="mk">✓</span><span>'+esc(e.good)+'</span></div><div class="g-err-reason">'+esc(e.reason)+'</div></div>';}).join('')+'</div>';}
    if(l.realUse&&l.realUse.length){learn+='<div class="g-sec-label">Real use</div><ul class="g-real">'+l.realUse.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul>';}
    if(l.tip){learn+='<div class="g-tip"><div><div class="g-tip-label">From John</div><p>'+l.tip+'</p></div></div>';}
    learn+='</div>';
    h+='<div class="l-pane show" id="pane-learn">'+learn+'</div>';
    var prac;
    if(nEx){
