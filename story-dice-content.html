<style>
:root{

  --lavender:#2176FF;--lavender-light:#E8EEFF;
  --cream:#F7F6F3;--ink:#2D3047;--muted:#7A7D8E;

  --shadow-sm:0 1px 3px rgba(45,48,71,.06);

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.4;pointer-events:none;z-index:0}

/* NAV */
.topnav{position:fixed;top:0;left:0;right:0;height:52px;z-index:200;background:rgba(247,246,243,.88);backdrop-filter:blur(16px);border-bottom:1.5px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.nav-logo span{color:#2176FF}
.topnav-links{display:flex;gap:1.2rem}
.topnav-links a{font-size:.8rem;font-weight:600;color:var(--muted);text-decoration:none;transition:color .2s}
.topnav-links a:hover{color:var(--sky)}

/* BACK + HERO */
.page-header{padding:2rem 2rem 1rem;max-width:900px;margin:0 auto;position:relative;z-index:1}
.topic-hero{display:flex;align-items:flex-start;gap:1.2rem;justify-content:flex-start;text-align:left}
.topic-icon{width:52px;height:52px;border-radius:14px;background:var(--sky-tint);color:var(--sky);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-sub{color:var(--muted);font-size:1rem;font-weight:500;line-height:1.6;max-width:620px;margin:.55rem 0 0}
.topic-icon svg{width:24px;height:24px;stroke-width:1.8;fill:none;stroke:currentColor}
.page-header h1{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;letter-spacing:-.01em;font-weight:900}

/* MAIN */
.main{max-width:860px;margin:0 auto;padding:0 2rem 4rem;position:relative;z-index:1}

/* CONTROLS ROW */
.controls-row{display:flex;align-items:center;justify-content:center;gap:.8rem;margin-bottom:2.4rem;flex-wrap:wrap}
.filter-label{font-family:Outfit,sans-serif;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.filter-pill{font-family:'Outfit',sans-serif;font-size:.8rem;font-weight:600;padding:.35rem .85rem;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.filter-pill:hover{border-color:var(--ink);color:var(--ink)}
.filter-pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.filter-divider{width:1px;height:20px;background:var(--border)}

/* DICE AREA */
.dice-area{display:flex;justify-content:center;gap:1.4rem;margin-bottom:2rem;flex-wrap:wrap}

.die-wrap{display:flex;flex-direction:column;align-items:center;gap:.7rem}
.die-label{font-family:Outfit,sans-serif;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* THE DIE */
.die{width:160px;height:160px;border-radius:28px;background:var(--card);border:2px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:1rem;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;user-select:none}
.die:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(45,48,71,.16)}
.die:active{transform:scale(.97)}
.die.rolling{animation:diceRoll .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes diceRoll{
  0%{transform:rotate(0) scale(1)}
  20%{transform:rotate(-8deg) scale(.95)}
  40%{transform:rotate(6deg) scale(1.04)}
  60%{transform:rotate(-4deg) scale(.98)}
  80%{transform:rotate(2deg) scale(1.01)}
  100%{transform:rotate(0) scale(1)}
}
.die-icon{font-size:2.8rem;line-height:1;transition:opacity .15s}
.die-word{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;color:var(--ink);text-align:center;line-height:1.3;transition:opacity .15s}
.die.rolling .die-icon,.die.rolling .die-word{opacity:.3}

/* Die colour accents */
.die-char{border-color:var(--sky)}
.die-char .die-word{color:var(--sky)}
.die-set{border-color:var(--lavender)}
.die-set .die-word{color:var(--lavender)}
.die-twist{border-color:var(--coral)}
.die-twist .die-word{color:var(--coral)}

/* Re-roll button on die */
.reroll-btn{position:absolute;bottom:.5rem;right:.55rem;font-family:Outfit,sans-serif;font-size:.55rem;font-weight:700;color:var(--muted);background:var(--cream);border:1px solid var(--border);border-radius:5px;padding:.15rem .4rem;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.05em}
.reroll-btn:hover{border-color:var(--ink);color:var(--ink)}

/* ROLL ALL BUTTON */
.roll-wrap{display:flex;justify-content:center;margin-bottom:1.8rem}
.btn-roll{font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:800;padding:.85rem 2.6rem;border-radius:14px;border:none;background:var(--ink);color:#fff;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:.55rem;letter-spacing:-.01em;box-shadow:0 4px 18px rgba(45,48,71,.22)}
.btn-roll:hover{background:#1a1d2e;transform:translateY(-2px);box-shadow:0 8px 28px rgba(45,48,71,.28)}
.btn-roll:active{transform:scale(.97)}
.btn-roll svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* TIMER */
.timer-section{max-width:800px;margin:0 auto 1.8rem}
.timer-progress{width:100%;height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:.6rem}
.timer-progress-fill{height:100%;background:var(--sea);border-radius:3px;transition:width .3s linear;width:0%}
.timer-progress-fill.warn{background:var(--coral)}
.timer-controls{display:flex;align-items:center;justify-content:center}
.timer-btn-wrap{display:inline-flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)}
.timer-btn{font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;padding:.55rem 1.2rem;border:none;background:var(--card);color:var(--ink);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:.5rem;min-width:96px;justify-content:center}
.timer-btn:hover{background:var(--cream)}
.timer-btn-icon{font-size:.8em;line-height:1}
.timer-btn .timer-btn-time{font-family:'JetBrains Mono',monospace}
.timer-btn.running{color:#0F7D71}
.timer-btn.paused{color:var(--sun)}
.timer-btn.warn,.timer-btn.done{color:var(--coral)}
.timer-edit-btn{font-family:'Outfit',sans-serif;padding:.55rem .8rem;border:none;border-left:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center}
.timer-edit-btn:hover{color:var(--ink);background:var(--cream)}
.timer-duration-edit{display:none;align-items:baseline;gap:.3rem;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;padding:.5rem .8rem;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
.timer-duration-input{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;border:none;background:transparent;color:var(--ink);width:4.2ch;text-align:center;outline:none;padding:0}

/* STORY STARTER */
.starter-wrap{max-width:580px;margin:0 auto 1.8rem}
.btn-starter{width:100%;font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:700;padding:.65rem 1.4rem;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:.45rem}
.btn-starter:hover{border-color:var(--sky);color:var(--sky)}
.btn-starter svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.starter-card{margin-top:.7rem;background:var(--sky-light);border:1.5px solid var(--sky);border-radius:12px;padding:1rem 1.2rem;display:none}
.starter-card.show{display:block}
.starter-label{font-family:Outfit,sans-serif;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sky);margin-bottom:.4rem}
.starter-text{font-size:1rem;font-weight:600;color:var(--ink);line-height:1.5;font-style:italic}

.theme-row{display:flex;justify-content:center;align-items:center;gap:.4rem;margin-bottom:2rem;flex-wrap:wrap}
.theme-badge{font-family:Outfit,sans-serif;font-size:.6rem;font-weight:700;padding:.22rem .6rem;border-radius:5px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;transition:all .15s;border:1.5px solid var(--border);background:var(--card);color:var(--muted)}
.theme-badge:hover{border-color:var(--ink);color:var(--ink)}
.theme-badge.active{background:var(--ink);color:#fff;border-color:var(--ink)}

@media(max-width:640px){
  .topnav{padding:0 1.2rem}
  .page-header,.main{padding-left:1.2rem;padding-right:1.2rem}
  .die{width:130px;height:130px;border-radius:22px}
  .die-icon{font-size:2.2rem}
  .die-word{font-size:.85rem}
  .dice-area{gap:1rem}
}
</style>

  var d = DICE[dieKey];
  if (activeTheme === 'All') {
    return [].concat(d.everyday, d.dramatic, d.absurd, d.professional);
  }
  var key = activeTheme.toLowerCase();
  return d[key] || d.everyday;
}

function rollOne(idx) {
  var dieEl = document.getElementById('die'+idx);
  dieEl.classList.add('rolling');
  var keys = ['character','setting','twist'];
  var pool = getPool(keys[idx]);

  // Shuffle through quickly then land
  var ticks = 0;
  var iv = setInterval(function() {
    var item = pool[Math.floor(Math.random()*pool.length)];
    document.getElementById('icon'+idx).textContent = item.icon;
    document.getElementById('word'+idx).textContent = item.word;
    ticks++;
    if (ticks >= 8) {
      clearInterval(iv);
      var final = pool[Math.floor(Math.random()*pool.length)];
      document.getElementById('icon'+idx).textContent = final.icon;
      document.getElementById('word'+idx).textContent = final.word;
      currentFaces[idx] = final.word;
      dieEl.classList.remove('rolling');
      hideStarter();
    }
  }, 60);
}

function rollAll() {
  var btn = document.getElementById('btnRoll');
  btn.disabled = true;
  setTimeout(function(){ btn.disabled = false; }, 600);

  rollOne(0);
  setTimeout(function(){ rollOne(1); }, 80);
  setTimeout(function(){ rollOne(2); }, 160);

  // Reset timer
  if (timerState['main']) timerSelectDuration('main', timerState['main'].defaultSecs);
}

// Theme
function buildThemeRow() {
  var el = document.getElementById('themeRow');
  el.innerHTML = '<span class="filter-label">Theme</span>'
    + THEMES.map(function(t){
        return '<button class="theme-badge'+(t===activeTheme?' active':'')+'" onclick="setTheme(\''+t+'\',this)">'+t+'</button>';
      }).join('');
}

function setTheme(t, btn) {
  activeTheme = t;
  document.querySelectorAll('.theme-badge').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  hideStarter();
  try{ localStorage.setItem('jpe-story-dice-theme', t); }catch(e){}
}

// Starter
function toggleStarter() {
  var card = document.getElementById('starterCard');
  var btn = document.getElementById('btnStarter');
  if (!currentFaces[0] || !currentFaces[1] || !currentFaces[2]) {
    // Roll first if no faces
    rollAll();
    setTimeout(function(){ generateStarter(); }, 700);
    return;
  }
  if (card.classList.contains('show')) {
    hideStarter();
  } else {
    generateStarter();
  }
}

function generateStarter() {
  var c = currentFaces[0] || 'a stranger';
  var s = currentFaces[1] || 'an unfamiliar place';
  var t = currentFaces[2] || 'something unexpected happened';
  var template = STARTERS_TEMPLATES[Math.floor(Math.random()*STARTERS_TEMPLATES.length)];
  document.getElementById('starterText').textContent = template(c, s, t);
  document.getElementById('starterCard').classList.add('show');
  document.getElementById('btnStarter').innerHTML = '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> New starter';
}

function hideStarter() {
  document.getElementById('starterCard').classList.remove('show');
  document.getElementById('btnStarter').innerHTML = '<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Show me a story starter';
}

// ===== Reusable timer widget (multi-instance: one button, m:ss typing, progress bar on top) =====
var timerState = {};
function timerFormatTime(totalSeconds){
  var m=Math.floor(totalSeconds/60), s=totalSeconds%60;
  return m+':'+(s<10?'0':'')+s;
}
function timerParseTime(str){
  var parts=String(str).trim().split(':');
  var m, s;
  if(parts.length>=2){ m=parseInt(parts[0],10); s=parseInt(parts[1],10); }
  else { m=parseInt(parts[0],10); s=0; }
  if(isNaN(m)) m=0;
  if(isNaN(s)||s<0||s>59) s=0;
  var total=m*60+s;
  if(!total || total<1) return null;
  return Math.min(total,5999);
}
function timerWidgetHTML(id, defaultSecs, locked){
  var editBits = locked ? '' :
    '<button class="timer-edit-btn" id="timerEditBtn-'+id+'" onclick="timerEditDuration(\''+id+'\')" title="Edit duration" aria-label="Edit timer duration"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'+
    '<span class="timer-duration-edit" id="timerDurationEdit-'+id+'"><input type="text" inputmode="numeric" class="timer-duration-input" id="timerDurationInput-'+id+'" placeholder="'+timerFormatTime(defaultSecs)+'" onblur="timerCommitDuration(\''+id+'\')" onkeydown="if(event.key===\'Enter\'){this.blur()}else if(event.key===\'Escape\'){timerCancelEdit(\''+id+'\')}"></span>';
  return ''+
    '<div class="timer-section">'+
      '<div class="timer-progress"><div class="timer-progress-fill" id="timerProgress-'+id+'"></div></div>'+
      '<div class="timer-controls">'+
        '<span class="timer-btn-wrap">'+
          '<button class="timer-btn" id="timerBtn-'+id+'" onclick="timerHandleClick(\''+id+'\')"><span class="timer-btn-icon" id="timerBtnIcon-'+id+'">&#9654;</span><span id="timerBtnLabel-'+id+'"></span></button>'+
          editBits+
        '</span>'+
      '</div>'+
    '</div>';
}
function timerInit(id, defaultSecs, locked){
  timerState[id] = {interval:null, seconds:defaultSecs, total:defaultSecs, running:false, paused:false, defaultSecs:defaultSecs, locked:!!locked};
  timerUpdateBtn(id);
}
function timerSelectDuration(id, secs){
  var st = timerState[id];
  clearInterval(st.interval); st.interval=null;
  st.running=false; st.paused=false;
  st.total=secs; st.seconds=secs;
  var prog = document.getElementById('timerProgress-'+id);
  prog.style.width='0%'; prog.className='timer-progress-fill';
  timerUpdateBtn(id);
}
function timerEditDuration(id){
  var st = timerState[id];
  if(st.locked) return;
  clearInterval(st.interval); st.interval=null; st.running=false; st.paused=false;
  var input=document.getElementById('timerDurationInput-'+id);
  input.value=timerFormatTime(st.defaultSecs);
  document.getElementById('timerBtn-'+id).style.display='none';
  document.getElementById('timerEditBtn-'+id).style.display='none';
  document.getElementById('timerDurationEdit-'+id).style.display='inline-flex';
  input.focus();
  input.select();
}
function timerCommitDuration(id){
  var st = timerState[id];
  if(st._canceling){ st._canceling=false; return; }
  var parsed=timerParseTime(document.getElementById('timerDurationInput-'+id).value);
  if(parsed) st.defaultSecs=parsed;
  document.getElementById('timerDurationEdit-'+id).style.display='none';
  document.getElementById('timerBtn-'+id).style.display='inline-flex';
  timerSelectDuration(id, st.defaultSecs);
}
function timerCancelEdit(id){
  var st = timerState[id];
  st._canceling=true;
  document.getElementById('timerDurationEdit-'+id).style.display='none';
  document.getElementById('timerBtn-'+id).style.display='inline-flex';
  timerUpdateBtn(id);
}
function timerHandleClick(id){
  var st = timerState[id];
  if(!st.running && !st.paused && st.seconds<=0 && st.total>0){ timerSelectDuration(id, st.defaultSecs); return; }
  timerToggle(id);
}
function timerToggle(id){
  var st = timerState[id];
  if(!st.total) return;
  if(!st.running && !st.paused){ st.running=true; timerTick(id); }
  else if(st.running){ clearInterval(st.interval); st.interval=null; st.running=false; st.paused=true; }
  else{ st.paused=false; st.running=true; timerTick(id); }
  timerUpdateBtn(id);
}
function timerTick(id){
  var st = timerState[id];
  var prog=document.getElementById('timerProgress-'+id);
  st.interval=setInterval(function(){
    st.seconds--;
    var pct=((st.total-st.seconds)/st.total)*100;
    prog.style.width=pct+'%';
    if(st.seconds<=10 && st.seconds>0){ prog.className='timer-progress-fill warn'; }
    if(st.seconds<=0){
      clearInterval(st.interval); st.interval=null; st.running=false;
      prog.style.width='100%'; prog.className='timer-progress-fill warn';
      setTimeout(function(){
        if(!st.running && !st.paused && st.seconds<=0){ timerSelectDuration(id, st.defaultSecs); }
      },2500);
    }
    timerUpdateBtn(id);
  },1000);
}
function timerUpdateBtn(id){
  var st = timerState[id];
  var btn=document.getElementById('timerBtn-'+id);
  var icon=document.getElementById('timerBtnIcon-'+id);
  var label=document.getElementById('timerBtnLabel-'+id);
  var editBtn=document.getElementById('timerEditBtn-'+id);
  if(editBtn) editBtn.style.display = st.locked ? 'none' : 'inline-flex';
  if(st.running){
    icon.innerHTML='&#9208;';
    label.innerHTML='<span class="timer-btn-time">'+timerFormatTime(st.seconds)+'</span>';
    btn.className='timer-btn running'+(st.seconds<=10?' warn':'');
  } else if(st.paused){
    icon.innerHTML='&#9654;';
    label.innerHTML='<span class="timer-btn-time">'+timerFormatTime(st.seconds)+'</span>';
    btn.className='timer-btn paused';
  } else if(st.seconds<=0 && st.total>0){
    icon.innerHTML='&#8635;';
    label.textContent='Done';
    btn.className='timer-btn done';
  } else {
    icon.innerHTML='&#9654;';
    label.innerHTML='<span class="timer-btn-time">'+timerFormatTime(st.defaultSecs)+'</span>';
    btn.className='timer-btn';
  }
}

(function(){
  try{
    var saved = localStorage.getItem('jpe-story-dice-theme');
    if (saved && THEMES.indexOf(saved) !== -1) activeTheme = saved;
  }catch(e){}
})();

buildThemeRow();
document.getElementById('timerMount').innerHTML = timerWidgetHTML('main', 90, false);
timerInit('main', 90, false);
</script>
