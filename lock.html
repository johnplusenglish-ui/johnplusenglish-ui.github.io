<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/theme.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>johnplusenglish</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{;--ielts:#FFB347;--pod:#1360E8;--shadow-md:0 8px 30px rgba(45,48,71,.12);--shadow-sm:0 1px 3px rgba(45,48,71,.07)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream);font-family:Outfit,sans-serif;color:var(--ink);padding:1.5rem;background-image:radial-gradient(var(--border) .5px,transparent .5px);background-size:14px 14px}
.wrap{max-width:420px;width:100%;text-align:center}
.logo{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:900;font-size:1.05rem;margin-bottom:2.2rem}
.logo-icon{width:20px;height:20px;stroke:var(--sky);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.logo-text span{color:var(--sky)}
.hero{background:var(--card);border:1.5px solid var(--border);border-radius:20px;box-shadow:var(--shadow-md);padding:2.6rem 2rem 2.2rem}
.cap{width:56px;height:56px;border-radius:14px;background:var(--ielts);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 1.1rem}
h1{font-size:1.6rem;font-weight:900;letter-spacing:-.01em;margin:0 0 .5rem;line-height:1.15}
p{color:var(--muted);font-size:.92rem;margin:0 0 1.6rem;line-height:1.5}
.cta{display:inline-flex;align-items:center;gap:.5rem;width:100%;justify-content:center;padding:1rem 1.4rem;border:none;border-radius:12px;background:var(--ielts);color:#fff;font-family:inherit;font-size:1.02rem;font-weight:800;text-decoration:none;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(255,145,0,.35)}
.cta:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(255,145,0,.42)}
.cta svg{width:18px;height:18px;flex-shrink:0}
.ctas{display:flex;flex-direction:column;gap:.6rem}
.cta-alt{background:var(--sky);box-shadow:0 4px 14px rgba(33,118,255,.32);font-size:.98rem;padding:.9rem 1.4rem}
.cta-alt:hover{box-shadow:0 6px 18px rgba(33,118,255,.4)}
.cta-prep{background:#CC5500;box-shadow:0 4px 14px rgba(204,85,0,.32);font-size:.98rem;padding:.9rem 1.4rem}
.cta-prep:hover{box-shadow:0 6px 18px rgba(204,85,0,.4)}

/* Johncast podcast notes */
.pod{background:var(--card);border:1.5px solid var(--border);border-radius:20px;box-shadow:var(--shadow-md);padding:1.4rem;margin-top:1.1rem;text-align:left}
.pod-row{display:flex;align-items:center;gap:.9rem;margin-bottom:1.1rem}
.pod-cover{width:64px;height:64px;border-radius:12px;flex-shrink:0;display:block}
.pod-eyebrow{font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--pod);margin-bottom:.2rem}
.pod-title{font-size:1.05rem;font-weight:800;line-height:1.2;margin-bottom:.15rem}
.pod-sub{font-size:.78rem;color:var(--muted);line-height:1.35}
.pod-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.9rem 1.2rem;border-radius:12px;background:var(--pod);color:#fff;font-family:inherit;font-size:.96rem;font-weight:800;text-decoration:none;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px rgba(19,96,232,.32)}
.pod-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(19,96,232,.4)}
.pod-btn svg{width:17px;height:17px;flex-shrink:0}

.login-toggle{margin-top:2.4rem;background:none;border:none;color:var(--border);font-family:inherit;font-size:.62rem;letter-spacing:.04em;cursor:pointer;text-decoration:none;opacity:.55;transition:opacity .2s,color .2s}
.login-toggle:hover,.login-toggle:focus-visible{opacity:1;color:var(--muted)}
.login-box{display:none;margin-top:.9rem;text-align:left}
.login-box.open{display:block}
.login-box input{width:100%;padding:.65rem .85rem;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:.85rem;margin-bottom:.5rem;background:var(--card)}
.login-box input:focus{outline:none;border-color:var(--ielts)}
.login-box button{width:100%;padding:.6rem;border:1.5px solid var(--border);border-radius:9px;background:var(--card);color:var(--ink);font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.login-box button:hover{border-color:var(--ielts);color:var(--ielts)}
.err{color:#D64545;font-size:.76rem;margin:-.15rem 0 .5rem;display:none}
.err.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><svg class="logo-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5z"></path><path d="M6 10.5v4.5c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"></path><path d="M22 8v6"></path></svg><span class="logo-text">john<span>plus</span>english</span></div>

  <div class="hero">
    <div class="cap"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19v-3"/><path d="M9 19v-7"/><path d="M14 19v-11"/><path d="M19 19V5"/></svg></div>
    <h1>Find your English level</h1>
    <p>Three free, adaptive tests with an instant result. Find your overall level from A1 to C2, or test your phrasal verbs or your prepositions on their own.</p>
    <div class="ctas">
      <a class="cta" href="level-test.html">
        Take the level test
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
      <a class="cta cta-alt" href="phrasal-verb-test.html">
        Take the phrasal verb test
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
      <a class="cta cta-prep" href="preposition-test.html">
        Take the preposition test
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>

  <!-- Johncast card removed at John&rsquo;s request 2026-10-23. To restore, uncomment:
  <div class="pod">
    <div class="pod-row">
      <img class="pod-cover" src="images/podcast/johncast-episode-4.png" alt="Johncast Episode 4 cover" width="64" height="64">
      <div>
        <div class="pod-eyebrow">Johncast &middot; Episode 4</div>
        <div class="pod-title">Hustle Culture</div>
        <div class="pod-sub">Full transcript and vocabulary notes.</div>
      </div>
    </div>
    <a class="pod-btn" href="ep4.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      Transcript &amp; Notes (PDF)
    </a>
  </div>

  -->

  <button class="login-toggle" onclick="document.getElementById('loginBox').classList.toggle('open')">Off limits</button>
  <div class="login-box" id="loginBox">
    <input type="password" id="pw" placeholder="Password">
    <div class="err" id="err">Wrong password, try again.</div>
    <button onclick="tryUnlock()">Enter</button>
  </div>
</div>
<script>
var PASS = 'projecthailmary1985';
function tryUnlock(){
  var v = document.getElementById('pw').value;
  if (v === PASS) {
    try { sessionStorage.setItem('jpe-unlocked-v1', '1'); } catch(e){}
    var params = new URLSearchParams(location.search);
    var r = params.get('r') || 'index.html';
    location.replace(r);
  } else {
    document.getElementById('err').classList.add('show');
  }
}
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryUnlock();
});
</script>
</body>
</html>
