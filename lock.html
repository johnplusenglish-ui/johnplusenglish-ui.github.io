<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>johnplusenglish</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#F7F6F3;--ink:#2D3047;--muted:#7A7D8E;--border:#E8E5DF;--card:#fff;--ielts:#FF9100;--shadow-md:0 8px 30px rgba(45,48,71,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--cream);font-family:Outfit,sans-serif;color:var(--ink);padding:1.5rem}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);padding:2.2rem 2rem;max-width:360px;width:100%;text-align:center}
.logo{font-weight:900;font-size:1.3rem;margin-bottom:.3rem}
.logo span{color:var(--ielts)}
p{color:var(--muted);font-size:.9rem;margin:0 0 1.4rem}
input{width:100%;padding:.8rem 1rem;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;font-size:.95rem;margin-bottom:.9rem}
input:focus{outline:none;border-color:var(--ielts)}
button{width:100%;padding:.85rem;border:none;border-radius:10px;background:var(--ielts);color:#fff;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer}
button:hover{opacity:.92}
.err{color:#D64545;font-size:.82rem;margin:-.5rem 0 .9rem;display:none}
.err.show{display:block}
.lt{margin-top:1.3rem;font-size:.82rem}
.lt a{color:var(--ielts);font-weight:600;text-decoration:none}
.lt a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo">john<span>plus</span>english</div>
  <p>This part of the site is private while it's being rebuilt.</p>
  <input type="password" id="pw" placeholder="Password" autofocus>
  <div class="err" id="err">Wrong password, try again.</div>
  <button onclick="tryUnlock()">Enter</button>
  <div class="lt">Just here for the level check? <a href="level-test.html">Take it here</a></div>
</div>
<script>
var PASS = 'projecthailmary1985';
function tryUnlock(){
  var v = document.getElementById('pw').value;
  if (v === PASS) {
    try { sessionStorage.setItem('jpe-unlocked-v1', '1'); } catch(e){}
    var params = new URLSearchParams(location.search);
    var r = params.get('r') || 'index.html';
    location.replace(r);
  } else {
    document.getElementById('err').classList.add('show');
  }
}
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryUnlock();
});
</script>
</body>
</html>
