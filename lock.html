<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/theme.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>johnplusenglish</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --shadow-sm:0 1px 3px rgba(45,48,71,.06);
  --shadow-md:0 10px 34px rgba(45,48,71,.09);
  --c-level:#F5A524;
  --c-phrasal:#2176FF;
  --c-prep:#F26A1B;
  --c-idiom:#0F7D71;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--cream);font-family:Outfit,sans-serif;color:var(--ink);
  padding:3.5rem 1.5rem;
  background-image:radial-gradient(var(--border) .5px,transparent .5px);background-size:14px 14px;
}
.wrap{max-width:430px;width:100%;text-align:center}

/* ---------- logo ---------- */
.logo{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
      font-weight:900;font-size:1.15rem;margin-bottom:3.4rem;letter-spacing:-.01em}
.logo-icon{width:22px;height:22px;stroke:var(--sky);stroke-width:1.9;fill:none;
           stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.logo-text span{color:var(--sky)}

/* ---------- the four ---------- */
.links{display:flex;flex-direction:column;gap:.85rem}
.link{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1.35rem 1.5rem;border-radius:16px;
  background:var(--card);border:1.5px solid var(--border);box-shadow:var(--shadow-sm);
  color:var(--ink);font-size:1.08rem;font-weight:600;text-decoration:none;
  transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s,border-color .16s;
}
.link:hover,.link:focus-visible{
  transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:transparent;outline:none;
}
.link .go{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--dot);color:#fff;transition:transform .16s;
}
.link:hover .go{transform:translateX(3px)}
.link .go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;
              stroke-linecap:round;stroke-linejoin:round}
.link-level  {--dot:var(--c-level)}
.link-phrasal{--dot:var(--c-phrasal)}
.link-prep   {--dot:var(--c-prep)}
.link-idiom  {--dot:var(--c-idiom)}

/* ---------- socials ---------- */
.social{display:flex;justify-content:center;gap:.6rem;margin-top:3.4rem}
.social a{
  display:inline-flex;align-items:center;gap:.45rem;
  padding:.6rem 1.05rem;border-radius:999px;
  border:1.5px solid var(--border);background:var(--card);
  color:var(--muted);font-size:.85rem;font-weight:500;text-decoration:none;
  transition:color .16s,border-color .16s;
}
.social a:hover{color:var(--sky);border-color:var(--sky)}
.social svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;
            stroke-linecap:round;stroke-linejoin:round}

/* ---------- the way in ---------- */
.login-toggle{margin-top:3rem;background:none;border:none;color:var(--border);
  font-family:inherit;font-size:.62rem;letter-spacing:.04em;cursor:pointer;
  text-decoration:none;opacity:.55;transition:opacity .2s,color .2s}
.login-toggle:hover,.login-toggle:focus-visible{opacity:1;color:var(--muted)}
.login-box{display:none;margin:.9rem auto 0;text-align:left;max-width:260px}
.login-box.open{display:block}
.login-box input{width:100%;padding:.65rem .85rem;border:1.5px solid var(--border);
  border-radius:9px;font-family:inherit;font-size:.85rem;margin-bottom:.5rem;background:var(--card)}
.login-box input:focus{outline:none;border-color:var(--sky)}
.login-box button{width:100%;padding:.6rem;border:1.5px solid var(--border);border-radius:9px;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.login-box button:hover{border-color:var(--sky);color:var(--sky)}
.err{color:#D64545;font-size:.76rem;margin:-.15rem 0 .5rem;display:none}
.err.show{display:block}

@media (max-width:420px){
  body{padding:2.5rem 1.1rem}
  .logo{margin-bottom:2.6rem}
  .link{padding:1.15rem 1.2rem;font-size:1rem}
  .social,.login-toggle{margin-top:2.6rem}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5z"></path><path d="M6 10.5v4.5c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"></path><path d="M22 8v6"></path></svg>
    <span class="logo-text">john<span>plus</span>english</span>
  </div>

  <nav class="links">
    <a class="link link-level" href="level-test.html">
      English Level Test
      <span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span>
    </a>
    <a class="link link-phrasal" href="phrasal-verb-test.html">
      Phrasal Verb Test
      <span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span>
    </a>
    <a class="link link-prep" href="preposition-test.html">
      Prepositions Test
      <span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span>
    </a>
    <a class="link link-idiom" href="idiom-game.html">
      Idiom Game
      <span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span>
    </a>
  </nav>

  <div class="social">
    <a href="https://www.instagram.com/johnplusenglish" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      Instagram
    </a>
    <a href="https://t.me/johnplusenglishchannel" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-20 7.5 8 4M22 2l-4 19-8-6.5M22 2l-14 12.5"/></svg>
      Telegram
    </a>
  </div>

  <button class="login-toggle" onclick="document.getElementById('loginBox').classList.toggle('open')">Off limits</button>
  <div class="login-box" id="loginBox">
    <input type="password" id="pw" placeholder="Password">
    <div class="err" id="err">Wrong password, try again.</div>
    <button onclick="tryUnlock()">Enter</button>
  </div>
</div>
<script>
var PASS = 'projecthailmary1985';
function tryUnlock(){
  var v = document.getElementById('pw').value;
  if (v === PASS) {
    try { sessionStorage.setItem('jpe-unlocked-v1', '1'); } catch(e){}
    var params = new URLSearchParams(location.search);
    var r = params.get('r') || 'index.html';
    location.replace(r);
  } else {
    document.getElementById('err').classList.add('show');
  }
}
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') tryUnlock();
});
</script>
</body>
</html>
